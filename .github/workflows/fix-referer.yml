name: Fix OSS Referer Policy
on: workflow_dispatch
jobs:
  fix-referer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update bucket referer to allow all (CDN forwards client Referer)
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
        run: |
          pip install oss2 -q
          python3 << 'PYEOF'
          import oss2
          auth = oss2.Auth("${{ secrets.OSS_KEY_ID }}", "${{ secrets.OSS_KEY_SECRET }}")
          bucket = oss2.Bucket(auth, "https://oss-cn-shenzhen.aliyuncs.com", "thoradar-online")
          # Allow all referrers + empty referer
          # Reason: CDN forwards client Referer (e.g. google.com) to origin;
          # OSS blocks non-whitelisted referrers -> 403 from search engine traffic.
          # Fix at OSS level: allow *. CDN-level referer filtering = future enhancement.
          config = oss2.models.BucketReferer(True, ["*"])
          bucket.put_bucket_referer(config)
          print("OK: Referer policy updated -> AllowEmpty=True, Whitelist=['*']")
          # Verify
          r = bucket.get_bucket_referer()
          print(f"Verify: empty={r.allow_empty_referer}, refs={r.referers}")
          PYEOF
