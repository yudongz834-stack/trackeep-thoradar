name: ThorRadar Daily Pipeline

on:
  schedule:
    # 北京时间 05:03（UTC 前一日 21:03）每日运行；错开整点＝避开 GitHub 定时高峰排队
    # （实际仍常被排队延迟 2-3 小时跨 UTC 午夜——简报标签/提交日期一律取北京日，见引擎 bj_today）
    - cron: '3 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thoradar-daily
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test then run pipeline
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python3 thoradar_engine.py --self-test
          python3 thoradar_engine.py --regression || echo "::warning::工程回归有漏拦/误拦，见 data/regression/report.json（不阻断当日发布，人工看板跟进）"
          python3 thoradar_engine.py || { echo "::warning::首次运行失败，5 分钟后自动重试一次"; sleep 300; python3 thoradar_engine.py; }

      - name: Guard — data must actually change (fail loud on silent no-op)
        run: |
          if git diff --quiet -- index.html data/; then
            echo "::error::流水线运行后 index.html 与 data/ 均无变化——疑似静默断粮，判失败"
            exit 1
          fi

      - name: Commit and push updated data
        run: |
          git config user.name "thoradar-bot"
          git config user.email "bot@thoradar.local"
          git add index.html data/
          git commit -m "chore(daily): 胸科雷达 $(TZ=Asia/Shanghai date +%F) 文献雷达更新 [skip ci]"
          git push
