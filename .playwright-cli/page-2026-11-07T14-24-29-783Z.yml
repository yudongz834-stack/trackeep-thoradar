            - generic [ref=e1003]: 原始字段 · 非全文
          - paragraph [ref=e1004]: "BACKGROUND: Claudin 18.2 (CLDN18.2) is physiologically expressed in normal gastric epithelium and is frequently retained in gastric adenocarcinoma. Recent studies have suggested that CLDN18.2 may also be expressed in tumors showing gastric epitheliallike differentiation outside the stomach, including pulmonary invasive mucinous adenocarcinoma (IMA). This study evaluated the diagnostic utility of CLDN18.2 compared with HNF4A and MUC5AC in pulmonary IMA. METHODS: We assessed immunohistochemical expression of CLDN18.2 using clone 43-14A, HNF4A, and MUC5AC in surgically resected pulmonary tumors, including 84 IMAs and 82 other non-small cell lung carcinomas (NSCLCs). Staining was semiquantitatively evaluated using H-scores, and positivity was defined as an H-score greater than 0. Diagnostic performance was assessed using sensitivity, specificity, positive predictive value (PPV), and negative predictive value (NPV), with 95% confidence intervals (CIs). RESULTS: CLDN18.2 was positive in 75 of 84 IMAs (89.3%) but in only 2 of 82 other NSCLCs (2.4%). CLDN18.2H-scores were markedly higher in IMA than in other NSCLC (mean ± SD, 216.6 ± 105.3 vs. 1.6 ± 13.8; P < 0.001). CLDN18.2 showed a sensitivity of 89.3% (95% CI, 80.9-94.3), specificity of 97.6% (95% CI, 91.5-99.3), PPV of 97.4% (95% CI, 91.0-99.3), and NPV of 89.9% (95% CI, 81.9-94.6). Although HNF4A and MUC5AC showed slightly higher sensitivities, their specificities were lower than that of CLDN18.2. CONCLUSIONS: CLDN18.2 is a highly specific immunohistochemical marker for pulmonary IMA and provides superior rule-in performance compared with HNF4A and MUC5AC."
