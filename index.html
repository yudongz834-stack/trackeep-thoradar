<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

","pico":{"p":"18项研究、4,070例接受一线奥希替尼治疗的EGFR突变晚期/复发/转移性NSCLC患者","ic":"暴露/预后因素（TP53突变、EGFR L858R对比19外显子缺失、ECOG PS≥2、中枢神经系统/脑转移、肝转移、骨转移、PD-L1表达）与结局（PFS/rwPFS为主要结局，OS/rwOS为次要结局）的关联；无干预对照"},"reason":"为EGFR突变晚期NSCLC一线奥希替尼的患者风险分层提供合并效应量基线，可用于预后模型构建与强化治疗试验的富集人群设计（如TP53突变、L858R、脑转移亚组），但不足以单独改变一线用药选择。","abstract_en":"BACKGROUND: Osimertinib is the standard first-line therapy for epidermal growth factor receptor (EGFR)-mutated advanced non-small cell lung cancer (NSCLC), but outcomes remain heterogeneous. This meta-analysis evaluated baseline clinical and molecular prognostic factors associated with poorer outcomes in this setting. METHODS: PubMed, Embase, Web of Science, Scopus, and the Cochrane Library were searched through 20 May 2026. Eligible studies included patients with EGFR-mutated advanced, recurrent, or metastatic NSCLC receiving first-line osimertinib with extractable prognostic data. The primary outcome was progression-free survival or real-world progression-free survival (PFS/rwPFS); overall survival or real-world overall survival (OS/rwOS) was secondary. Hazard ratios (HRs) were pooled using random-effects models. RESULTS: Eighteen studies involving 4,070 first-line osimertinib-treated patients were included. TP53 mutation was associated with shorter PFS/rwPFS (HR 1.65, 95% confidence interval [CI] 1.15-2.37) and worse OS/rwOS (HR 1.55, 95% CI 1.14-2.12). EGFR L858R, versus exon 19 deletion, was associated with shorter PFS/rwPFS (HR 1.62, 95% CI 1.39-1.90) and worse OS/rwOS (HR 1.63, 95% CI 1.40-1.88), with consistent estimates across sensitivity analyses. Eastern Cooperative Oncology Group performance status ≥ 2, central nervous system/brain metastasis, and liver metastasis were associated with poorer outcomes. The OS/rwOS association for liver metastasis was sensitive to alternative estimate selection. Evidence for bone metastasis and programmed death-ligand 1 expression was less robust. CONCLUSIONS: Evidence-tier assessment identified EGFR L858R, ECOG PS ≥ 2, and CNS/brain metastasis as high-certainty adverse prognostic factors. Liver metastasis was supported by moderate certainty for PFS/rwPFS but lower certainty for OS/rwOS. TP53 mutation, PD-L1 expression, and bone metastasis were lower-certainty or exploratory findings. These findings support future integrated prognostic models, but do not establish criteria for selecting intensified first-line therapy over osimertinib monotherapy.","tags":["EGFR突变","奥希替尼","预后因素","系统评价与荟萃分析","TP53"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926850","pmid":"42926850","pmcid":"PMC13692361","doi":"10.64898/2026.10.02.26364620","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926850/","notice_url":"","trial_url":"","pub_date":"2026-Oct-05","briefing_date":"2026-10-25","journal_abbr":"medRxiv","journal_full":"medRxiv : the preprint server for health sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单中心回顾性模拟评估研究 · AI系统可行性/阅片者评分研究（非对照）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":56,"score_breakdown":{"clinical":22,"methodology":17,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"全部","metric":"工具调用准确率","val":"93.1% (646/694)","stat":"95% CI: 91.2%, 95.0%","grounded":true,"checks":[{"num":"93.1%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"646","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"694","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"91.2%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"95.0%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"全部","metric":"自我调节（正确转诊医生）准确率","val":"92.6% (462/499)","stat":"95% CI: 90.2%, 94.8%","grounded":true,"checks":[{"num":"92.6 ons":["人群限定「全部」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部","metric":"自我调节（正确转诊医生）准确率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"可回答问题","metric":"临床准确性满分5.0比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「可回答问题」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"可回答问题","metric":"患者可理解性满分5.0比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「可回答问题」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"应转诊医生问题","metric":"临床准确性满分5.0比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「应转诊医生问题」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"应转诊医生问题","metric":"患者可理解性满分5.0比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「应转诊医生问题」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"规划器-执行器式多模态智能体系统回答肺癌筛查CT患者提问：模拟问题上的工具调用准确率与“转诊医生”自我调节能力评估","title_en":"Planner-Executor Style Multimodal Agentic System to Answer Patient Questions in Lung Cancer Screening CT.","authors":"Sakiyama K, Serapio A, Ye M, Nowroozi A, Bondarenko M, Wu YF, Qi K, Liu J et al.","affiliation_highlight":"","results":"总体工具调用准确率93.1%（646/694；95% CI: 91.2%, 95.0%）；自我调节准确率92.6%（462/499；90.2%, 94.8%）。可回答问题中，所有读者均给出满分5.0的比例：临床准确性78.9%（180/228）（读者间一致性 Gwet's AC2=0.92），患者可理解性73.2%（167/228）（0.86）。应转诊医生问题中：临床准确性77.3%（133/172）（0.80），患者可理解性70.3%（121/172）（0.78）。","authors_conclusion":"规划器-执行器式多模态智能体系统能可靠回答LCS相关的患者个体化问题；其较高的工具调用与自我调节表现显示其有潜力成为LCS项目中安全有效的数字化沟通辅助工具。","ai_note":"①问题为模拟生成而非真实患者提问，未验证真实语境下的提问分布与误解模式；②“自我调节准确率”以LLM-as-a-judge判定，缺少医师金标准对照，属循环式评价风险；③工具调用分母694与699题不一致，5题缺失原因未说明；④“100条回答×4名医师”与结果中228/172的分母关系需读者自行推断，报告口径不清；⑤仅报告“全 reader 满分5.0”这一严苛但粗糙的比例，未给均值/分布或失败案例的错误类型分析；⑥无与基线模型、检索式问答或人工护士/医师回答的对照；⑦单中心回顾性数据，无真实随访依从性等临床结局。","pico":{"p":"某三级学术医院116份肺癌筛查（LCS）CT报告及图像；基于此生成699个模拟患者问题（分为可回答与应转诊医生两类）；医师阅片评分子集为4名医师×100条回答","ic":"干预：基于大语言模型的多智能体（planner+executor）多模态智能体系统，用于回答LCS CT结果相关问题；对照：无对照组，仅以工具调用准确率、自我调节准确率（LLM-as-a-judge）及医师评分（临床准确性、患者可理解性）为评价指标"},"reason":"为肺癌筛查结果沟通类AI工具提供了可复用的评价框架（工具调用、越界问题转诊、医师多维评分），可作为后续真实患者场景研究与数字沟通工具对照设计的基线；但尚不足以改变当前筛查随访或患者沟通的临床路径。","abstract_en":"BACKGROUND: Accurate patient understanding of lung cancer screening (LCS) results is critical for engagement and follow-up adherence, given the currently low screening uptake. While artificial intelligence (AI) systems show promise in facilitating patient communication, its effective use in clinical settings requires appropriate invocation of imaging tools and self-regulation by deferring certain questions to physicians. To this end, we developed and evaluated a planner-executor style multimodal agentic system to answer simulated patient questions about LCS CT results. METHODS: This retrospective study utilized 116 LCS CT reports and images collected from a tertiary academic hospital. The system employed a multi-agent architecture (planner and executor) to mimic clinical reasoning. We developed a large language model (LLM)-based question generation framework to prepare a comprehensive set of 699 simulated patient questions, categorized as answerable and defer-to-doctor to assess self-regulation. Performance was evaluated on tool-calling, self-regulation accuracy (ability to correctly defer out-of-scope questions to a human provider) assessed by LLM-as-a-judge, and clinical quality assessed by a reader performance study with four physicians evaluating a subset of 100 responses. RESULTS: The system demonstrated high overall tool-calling accuracy of 93.1% (646/694; 95% CI: 91.2%, 95.0%) and self-regulation accuracy of 92.6% (462/499; 90.2%, 94.8%). For answerable questions, the percentage of responses receiving perfect 5.0 scores across all readers included 78.9% (180/228) for clinical accuracy (inter-rater agreement: Gwet's AC2=0.92), and 73.2% (167/228) for patient understandability (0.86). For defer-to-doctor questions, the percentage of responses included 77.3% (133/172) for clinical accuracy (0.80) and 70.3% (121/172) for patient understandability (0.78). CONCLUSIONS: The planner-executor style multi-modal agentic system reliably answers patient-specific questions about LCS. Its high tool-calling and self-regulation performance demonstrates its potential as a safe and effective digital communication facilitator in LCS programs.","tags":["肺癌筛查","患者沟通","LLM多智能体","自我调节/转诊","模拟问题","数字健康"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922218","pmid":"42922218","pmcid":"","doi":"10.7417/CT.2026.2149","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922218/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Clin Ter","journal_full":"La Clinica terapeutica","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单中心回顾性队列研究（255例，2014–2018年手术）· 分期分层Kaplan-Meier生存分析 + 探索性机器学习预测建模","category":"surgery","category_label":"微创与无管化胸外科","score_total":54,"score_breakdown":{"clinical":18,"methodology":17,"specialty":19,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"VATS vs 开胸（全队列）","metric":"术后死亡率","val":"0% vs 5.8%","stat":"","grounded":true,"checks":[{"num":"0%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"5.8%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"I期","metric":"中位总生存（月）","val":"65.3 vs 67.7","stat":"p=0.768","grounded":true,"checks":[{"num":"65.3","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"67.7","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.768","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"II期","metric":"中位总生存（月）","val":"75.8 vs 48.8","stat":"p=0.003","grounded":true,"checks":[{"num":"75.8","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"48.8","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.003","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"探索性机器学习模型","metric":"测试集准确度","val":"0.39-0.48","stat":"","grounded":true,"checks":[{"num":"0.39","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.48","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"VATS vs 开胸（全队列）","metric":"术后死亡率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「vs」未在原摘要出现","人群限定「开胸」无英文锚（词典未收录，宁误杀）","人群限定「全」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"I期","metric":"中位总生存（月）","population_ok":true,"metric_ok":true,"mismatch_reasons":[]},{"group":"II期","metric":"中位总生存（月）","population_ok":true,"metric_ok":true,"mismatch_reasons":[]},{"group":"探索性机器学习模型","metric":"测试集准确度","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「探索性机器学习模」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"VATS与开胸治疗NSCLC的回顾性生存比较：I期总生存无差异、II期VATS生存更长，但基线不平衡且探索性预测模型准确度低不足以临床应用","title_en":"Video-Assisted Thoracoscopic Surgery versus Thoracotomy in Non-Small Cell Lung Cancer: Survival Analysis and Exploratory Predictive Modelling.","authors":"Makarov V, Baimukhametov E, Yessentayeva S, Oljaev S, Arybzhanov D","affiliation_highlight":"Department of Multidisciplinary Surgery, National Research Oncology Centre, Astana, Republic of Kazakhstan.","results":"VATS术后死亡率0%（0% versus 5.8% for thoracotomy）；I期中位总生存65.3 versus 67.7个月（p=0.768）；II期75.8 versus 48.8个月（p=0.003）；III期方向相似但未达统计学显著（摘要未给出数值）；探索性模型测试准确度0.39–0.48。","authors_conclusion":"In this unadjusted retrospective cohort, VATS was associated with lower perioperative mortality, and at stage II with longer overall survival. Given the retrospective design and baseline imbalances, these findings are hypothesis-generating and require confirmation in prospective, adjusted studies before informing surgical indications.","ai_note":"未预设单一主要终点，按分期进行多重亚组比较且未校正多重性，II期p=0.003属亚组内结果；VATS组更多为女性、腺癌、I期，适应证偏倚（confounding by indication）未通过校正处理，0%与5.8%的围手术期死亡率未给出组样本量与置信区间；III期“方向相似但未达显著”未报告效应量与P值，存在选择性叙述空间；机器学习部分作者已自认准确度低不可临床使用，但摘要仍以“random forest performing best”呈现排序。","pico":{"p":"2014–2018年间接受手术治疗的255例非小细胞肺癌患者（回顾性队列）","ic":"干预：电视辅助胸腔镜手术（VATS）；对照：开胸手术（thoracotomy）；非随机分组、基线不平衡、比较未做校正"},"reason":"为早期NSCLC手术路径（VATS vs 开胸）的生存获益讨论提供未校正的真实世界对照基线，并明确提示II期获益仅为假说，可用于设计需校正混杂的前瞻性或注册队列研究；同时示范了探索性ML模型在样本量不足时不可外推的边界。","abstract_en":"BACKGROUND: This study retrospectively compared outcomes of minimally invasive and open surgical approaches for non-small cell lung cancer (NSCLC) in a cohort of 255 patients operated on between 2014 and 2018. A machine-learning analysis was performed as an exploratory, hypothesis-generating component. METHOD: Survival was analysed by disease stage using Kaplan-Meier curves and log-rank tests. Because the groups were not randomised and were imbalanced at baseline, comparisons are unadjusted and should be interpreted as associations. Exploratory predictive models were developed using five machine-learning algorithms (random forest performing best), with feature contributions interpreted using Shapley Additive Explanations (SHAP). Missing values were handled by multiple imputation, continuous variables were standardised, and correlated features were excluded. RESULTS: Video-assisted thoracoscopic surgery (VATS) was used more frequently for adenocarcinoma, in women, and at stage I, with zero postoperative mortality (0% versus 5.8% for thoracotomy). At stage I, there were no differences in median overall survival (65.3 versus 67.7 months; p=0.768); at stage II, VATS was associated with longer survival (75.8 versus 48.8 months; p=0.003); at stage III, a similar direction did not reach significance. Recurrent predictors in the exploratory models were coronary artery disease, chronic obstructive pulmonary disease, intervention volume, tumour histology, and vascular invasion; however, test accuracy remained low (0.39-0.48), precluding clinical use. SHAP analysis highlighted resection completeness, lack of conversion, and tumour morphology. CONCLUSIONS: In this unadjusted retrospective cohort, VATS was associated with lower perioperative mortality, and at stage II with longer overall survival. Given the retrospective design and baseline imbalances, these findings are hypothesis-generating and require confirmation in prospective, adjusted studies before informing surgical indications.","tags":["VATS","开胸手术","NSCLC","回顾性队列","生存分析","机器学习"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42926887","pmid":"42926887","pmcid":"PMC13694925","doi":"10.1016/j.lanepe.2026.101896","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926887/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Eur","journal_full":"Lancet Reg Health Eur","tier":"A","if_val":15.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":20,"methodology":15,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Income-related differences in survival across disease categories in Sweden: a retrospective population-based register study.","title_en":"Income-related differences in survival across disease categories in Sweden: a retrospective population-based register study.","authors":"Mougin V, Gray A, Naghavi M, Allebeck P, Kinge JM, Wool EE, Weaver ND, Murray CJL et al.","affiliation_highlight":"Department of Global Public Health, Karolinska Institutet, Stockholm, Sweden.","results":"BACKGROUND: Lower income is consistently associated with poorer survival after disease diagnosis, even in countries with universal healthcare such as Sweden. While income-related survival differences have been documented…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lower income is consistently associated with poorer survival after disease diagnosis, even in countries with universal healthcare such as Sweden. While income-related survival differences have been documented for specific conditions, comparative evidence across a range of disease categories with long-term follow-up is lacking. We quantify income-related differences in survival across 100 disease categories focussing on leading non-communicable diseases (NCDs). METHODS: All individuals aged 16-95 years registered in Sweden between 2001 and 2023 were followed from first diagnosis until death or the end of 2023. By disease category cohort, individuals were matched to five general population controls (no prior diagnosis of that category) on birth year, sex, and income quartile. Flexible parametric models were used to estimate standardised survival curves for diagnosed individuals and their matched controls. FINDINGS: For all 100 disease categories, estimated 10-year survival was lower for the lowest income quartile (Q1) than higher quartiles. For 37 conditions, the Q1 vs Q4 10-year survival gap exceeded 10 percentage points; the largest gaps were for other pharynx cancer (10-year survival 34.2% [95% CI 32.5-35.7] in Q1 vs 58.2% [56.3-60.1] in Q4), larynx cancer, mouth cancer, COPD, and endocarditis. Income-related survival disparities accounted for 6.2 million (95% CI 5.9-6.6 million) person-years of survival loss within 10 years of diagnosis across all cohorts compared to a high-income survival counterfactual, with cardiovascular diseases accounting for the largest share for Q1 (1.3 million). Survival loss after diagnosis relative to undiagnosed controls was significantly greater for Q1 compared to Q4 for 73 of 100 conditions. INTERPRETATION: Substantial income-related disparities in survival persist in Sweden across all the most prevalent NCDs. Policies addressing income inequality alongside targeted disease-specific interventions are likely required to reduce income disparities in survival. FUNDING: Swedish Research Council for Health, Working Life and Welfare.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921462","pmid":"42921462","pmcid":"PMC13693345","doi":"10.1016/j.ctro.2026.101317","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921462/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Clin Transl Radiat Oncol","journal_full":"Clinical and Translational Radiation Oncology","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Randomized controlled trials of radiation therapy for cutaneous malignancies: a systematic review.","title_en":"Randomized controlled trials of radiation therapy for cutaneous malignancies: a systematic review.","authors":"Mahase SS, Miccio J, Chilov M, Gharzai LA, Barker CA, Zaorsky NG","affiliation_highlight":"Department of Radiation Oncology, Penn State Cancer Institute, Hershey, PA, USA.","results":"PURPOSE: In cutaneous oncology, radiotherapy use is largely based on retrospective studies, institutional experience, and expert consensus, with limited high-level evidence to guide practice. We summarize randomized cont…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: In cutaneous oncology, radiotherapy use is largely based on retrospective studies, institutional experience, and expert consensus, with limited high-level evidence to guide practice. We summarize randomized controlled trials in cutaneous radiation oncology and identify gaps in contemporary treatment warranting additional study. METHODS AND MATERIALS: We searched Ovid MEDLINE ALL, Embase.com, and the Cochrane Central Register of Controlled Trials for randomized controlled trials of radiotherapy for cutaneous malignancies: basal cell carcinoma (BCC), squamous cell carcinoma (SCC), melanoma, and Merkel cell carcinoma. Outcomes of interest included recurrence, survival, toxicity and cosmesis. Study inclusion required approval by three authors, with discrepancies resolved by an additional author. RESULTS: Thirteen trials entailing fewer than 2500 patients were identified, with only four studies published in the last decade. Three BCC studies compared radiotherapy with other treatments, while two additional BCC studies and one mixed BCC/SCC study compared dose-fractionation regimens. One SCC study evaluated adjuvant radiotherapy versus chemoradiotherapy. Among five melanoma trials, four evaluated adjuvant radiotherapy, including one for the primary tumor site and three for the regional nodal basin, and one compared definitive radiotherapy with topical imiquimod for unresectable melanoma in situ. One Merkel cell carcinoma trial evaluated lymph node basin radiotherapy. CONCLUSIONS: Randomized trials of radiotherapy for cutaneous malignancies are limited, small and heterogeneous, relative to the frequency of these diseases and clinical trials of other therapeutic interventions. Modern randomized trials are needed to bridge these gaps.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926946","pmid":"42926946","pmcid":"PMC13692620","doi":"10.21203/rs.3.rs-11043657/v1","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926946/","notice_url":"","trial_url":"","pub_date":"2026-Oct-05","briefing_date":"2026-10-25","journal_abbr":"Res Sq","journal_full":"Research square","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"方法学开发与多癌种回顾性验证研究（基于时点配对血浆表观遗传组与肿瘤转录组的机器学习建模与头对头benchmark，预印本）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":53,"score_breakdown":{"clinical":21,"methodology":19,"specialty":13,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"整合血浆染色质与片段化特征的小鼠学习框架APEX实现全基因组单基因肿瘤表达推断，并在24种癌症中展示亚型分型与治疗靶点追踪能力","title_en":"Quantitative gene-level inference of tumor transcription from plasma epigenomes.","authors":"Freedman M, Gulati G, Vasseur D, Nawfal R, Sotudian S, Semaan K, Eid M, Seo JH et al.","affiliation_highlight":"","results":"","authors_conclusion":"APEX在单基因表达推断上优于现有方法，可解析胰腺癌转录亚型、追踪小细胞肺癌的治疗靶点，并发现NECTIN4表达可作为尿路上皮癌对enfortumab vedotin治疗反应的生物标志物。","ai_note":"摘要未报告任何性能数值（相关性、AUC、准确性及置信区间均缺失），仅有“outperforms”的定性表述，无法判断优势幅度与临床可用性；benchmark的对照方法清单、训练/验证划分、是否含独立外部队列、可推断的最低肿瘤分数阈值均未交代；摘要以胰腺癌亚型解析、SCLC靶点追踪、NECTIN4疗效标志物三项应用作为价值佐证，但这些属于摘要层面的声称，缺少样本量与效应值支撑，存在以应用场景替代主要分析指标呈现的倾向；预印本未经同行评审。","pico":{"p":"559份血浆样本，覆盖24种癌症类型，含临床相关肿瘤分数，且具备时点配对的血浆表观遗传组与肿瘤转录组数据","ic":"干预：APEX机器学习框架（整合H3K4me3/H3K36me3定位信息与基因体片段周期性的单基因表达推断）；对照：现有血浆来源表达推断方法（头对头比较）"},"reason":"为液体活检从“突变/甲基化检测”扩展到“肿瘤转录状态无创推断”提供了方法学基线与对照框架，对判断血浆cfDNA能否替代组织RNA用于亚型分型与靶点/疗效标志物（如NECTIN4、SCLC靶点）选择具有参考价值，同时可作为后续胸部肿瘤液体活检队列设计的benchmark参照。","abstract_en":"Tumor phenotype and therapeutic vulnerability are shaped by dynamic transcriptional states that are not captured by genetic profiling alone and are difficult to monitor longitudinally. Existing plasma-based approaches have largely been developed using samples with high circulating tumor DNA fractions, evaluated across expression quantiles rather than individual genes, and rarely benchmarked head-to-head. Using timepoint-matched plasma epigenomes and tumor transcriptomes, we identify biologically grounded relationships between circulating chromatin, fragmentation, and transcription. H3K4me3 and H3K36me3 encode distinct positional information reflecting promoter activity and transcriptional elongation, while gene-body fragment periodicity predicts expression. We integrate these relationships into APEX, a machine-learning framework for genome-wide single-gene expression inference. Across 559 plasma samples spanning 24 cancer types and clinically relevant tumor fractions, APEX outperforms existing approaches for individual-gene inference, resolves pancreatic cancer transcriptional subtypes, tracks therapeutic targets in small-cell lung cancer, and identifies NECTIN4 expression as a biomarker of response to enfortumab vedotin in urothelial cancer.","tags":["液体活检","cfDNA表观遗传","基因表达推断","机器学习","小细胞肺癌","疗效生物标志物"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922101","pmid":"42922101","pmcid":"PMC6558447","doi":"10.1111/1759-7714.13091","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922101/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Clin Respir J","journal_full":"The clinical respiratory journal","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Closed Versus Open Vent Port Techniques and the Disconnection Technique for Optimizing Lung Collapse With Bronchial Blockers in Video-Assisted Thoracoscopic Surgery: A Randomized Controlled Trial.","title_en":"Closed Versus Open Vent Port Techniques and the Disconnection Technique for Optimizing Lung Collapse With Bronchial Blockers in Video-Assisted Thoracoscopic Surgery: A Randomized Controlled Trial.","authors":"Yao J, Chen YJ, Shen FM, Xie J, Yang JJ, Huang LX, Tan XX, Yang Y et al.","affiliation_highlight":"Department of Anesthesiology, Surgery and Pain Management, Zhongda Hospital, Southeast University, Nanjing, Jiangsu, Chi…","results":"INTRODUCTION: For patients undergoing video-assisted thoracoscopic surgery (VATS) for lung cancer or other pulmonary lesions, effective one-lung ventilation (OLV) is essential to provide surgical exposure. Bronchial bloc…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: For patients undergoing video-assisted thoracoscopic surgery (VATS) for lung cancer or other pulmonary lesions, effective one-lung ventilation (OLV) is essential to provide surgical exposure. Bronchial blockers (BBs) are increasingly used for OLV, but the optimal management of their vent port to accelerate lung collapse remains unclear. METHODS: In this prospective, randomized, controlled trial, 75 patients were allocated to three groups (n = 25 each): Group 1-BB with vent port closed; Group 2 (control)-BB with vent port open; Group 3-BB with the disconnection technique. Primary outcome was the time to complete lung collapse, which was scored according to the video clips obtained during the operation. Secondary outcomes included intraoperative hypoxemia, blood gas analysis, blocker malposition, perioperative complications, and surgeon satisfaction. RESULTS: A total of 72 patients were included in the modified intention-to-treat analysis, with 24 patients in each group. Median time to complete lung collapse was 15 min (95% CI: 10-15) in Groups 1 and 3 but was not reached in Group 2 (15/24, 62.5% had not achieved complete collapse by 30 min). In an exploratory 30-min restricted mean survival time (RMST), complete collapse occurred on average 14.17 min earlier in Group 1 (95% CI: 11.10-17.23) and 12.50 min earlier in Group 3 (95% CI: 9.62-15.38) than in Group 2, with no difference between Groups 1 and 3 (1.67 min, 95% CI: -1.85 to 5.19); time-averaged hazard ratios were consistent (Group 1 vs. 2, 9.80 [4.22-22.73]; Group 3 vs. 2, 7.63 [3.36-17.31]; Group 1 vs. 3, 1.20 [0.67-2.16]). No significant differences were detected in hypoxemia, blocker malposition, or complications across groups; however, the trial was not powered for safety outcomes. CONCLUSION: In patients aged 18-65 years with ASA I-II and normal pulmonary function undergoing thoracic surgery, the closure of the BB vent port results in a more rapid lung collapse compared to maintaining the vent port open. However, there was no statistically significant difference observed between the vent port closure technique and the disconnection technique regarding the time required for complete lung collapse. TRIAL REGISTRATION: ChiCTR identifier: ChiCTR2000039896.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42921141","pmid":"42921141","pmcid":"PMC13691733","doi":"10.3389/fonc.2026.1986814","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921141/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Nodal evaluation as the arbiter of oncologic equivalence: reassessing segmentectomy after CALGB 140503 and JCOG0802.","title_en":"Nodal evaluation as the arbiter of oncologic equivalence: reassessing segmentectomy after CALGB 140503 and JCOG0802.","authors":"Bazarbaev A, Androutsopoulou V, Zotos PA, Abbaker N, Scarci M, Magouliotis DE","affiliation_highlight":"Department of Surgery, Duke University Medical Center, Durham, NC, United States.","results":"Two randomized trials, CALGB 140503 and JCOG0802, established segmentectomy as an oncologically acceptable alternative to lobectomy for small, peripheral, clinically node-negative non-small cell lung cancer. Both reached…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Two randomized trials, CALGB 140503 and JCOG0802, established segmentectomy as an oncologically acceptable alternative to lobectomy for small, peripheral, clinically node-negative non-small cell lung cancer. Both reached that conclusion under a protocol-enforced condition that is rarely emphasized when their results are applied in practice: nodal status had to be verified intraoperatively against a defined anatomic standard. CALGB 140503 required frozen-section confirmation of N0 status at two mediastinal stations and one major hilar node before randomization, whereas JCOG0802 mandated systematic or selective dissection of N1 and N2 stations in both arms and explicitly disallowed sampling as a substitute. This review examines whether that nodal rigor is reproduced, or even reported, once segmentectomy leaves the trial setting. National data indicate that it is not. Segmentectomy accounts for 4.4% of resections for clinical stage I to IIA disease, and only 12.6% of segmentectomy cases met all three Commission on Cancer quality measures, with adherence concentrated in academic and higher-volume programs. Retrospective series consistently report lower nodal upstaging after segmentectomy than after lobectomy, but the difference is driven by N1 rather than N2 stations and tracks the smaller nodal footprint of the operation, so a lower upstaging rate cannot by itself distinguish less disease from less looking. Anatomic mapping data indicate that exhaustive intersegmental dissection is unnecessary, whereas reliable hilar and mediastinal sampling is not. Across the wider literature, adequate nodal evaluation is defined inconsistently and reported at a granularity too coarse for readers to verify compliance, a two-axis problem that we characterize here for the segmentectomy literature specifically. Robotic assistance increases the number of nodal stations harvested relative to video-assisted surgery but has not been shown to improve risk-adjusted detection of occult disease. We propose a seven-point minimum standard, anchored on station-based rather than count-based adequacy, for segmentectomy performed outside a clinical trial.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42926544","pmid":"42926544","pmcid":"PMC13692234","doi":"10.64898/2026.10.07.755430","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926544/","notice_url":"","trial_url":"","pub_date":"2026-Oct-10","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前机制+转化验证研究 · 小鼠肺癌异种移植模型与肺癌患者样本对照分析（bioRxiv预印本，未经同行评审）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":51,"score_breakdown":{"clinical":20,"methodology":16,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"红细胞表面结合肿瘤来源DNA形成独立循环池：小鼠肺癌模型中rtDNA全部检出而匹配血浆未检出，肺癌患者中突变多与红细胞相关","title_en":"The Red Blood Cell Surface Defines a Distinct Tumor DNA Compartment for Liquid Biopsy.","authors":"Elias E, Ruger H, Predina J, Bleiberg BA, Areesawangkit P, Noguera-Ortega E, Kulkarni A, Thompson JC et al.","affiliation_highlight":"","results":"","authors_conclusion":"红细胞表面是肿瘤DNA捕获与滞留的可调控位点；研究识别出一个独立的肿瘤来源遗传物质细胞储库，挑战以血浆为中心的液体活检范式。","ai_note":"预印本未同行评审；全文无样本量、无效应量、无置信区间或P值，仅以“all animals”“correlated”“majority”“concordant”等定性表述支撑核心主张；肿瘤负荷相关性未给统计量，“majority”比例未量化；小鼠异种移植模型中的人源肿瘤DNA与患者内源性肿瘤DNA在血浆清除与TLR9结合背景上不可直接类比；机制部分（去唾液酸化/TLR9）与临床检测性能之间缺少桥接数据；“challenge the plasma-centric paradigm”属结论外推，超出摘要所呈现证据强度。","pico":{"p":"携带肺癌异种移植瘤的小鼠；肺癌患者（摘要未报告样本量）","ic":"红细胞表面结合肿瘤DNA（rtDNA）检测 vs 匹配血浆中肿瘤DNA检测；患者中红细胞来源突变与匹配肿瘤组织分子改变作一致性对照"},"reason":"提示液体活检的检测基质可能不止血浆，红细胞结合DNA可能解释血浆ctDNA假阴性；为肺癌分子残留/基因分型检测的样本前处理与分析流程设计提供新的对照基线，但需在同行评审后的定量研究中验证方可影响检测选择。","abstract_en":"Red blood cells (RBCs) modulate host inflammatory responses by scavenging mitochondrial and pathogen DNA. However, how RBC surface properties govern the capture of tumor-derived DNA remains poorly understood. We show that RBCs tether and retain tumor-derived DNA on their surface, forming a distinct circulating pool of RBC-bound tumor DNA (rtDNA). Desialylation increased DNA capture in a Toll-like receptor 9 (TLR9)-dependent manner, identifying RBC surface sialylation and TLR9 as regulators of DNA binding. In mice bearing lung cancer xenografts, rtDNA was detected in all animals and its abundance correlated with tumor burden, whereas tumor DNA was undetectable in matched plasma samples. In patients with lung cancer, the majority of detected mutant tumor DNA was associated with RBCs rather than plasma, and RBC-derived mutations were concordant with molecular alterations identified in matched tumor tissue. Collectively, these findings establish the RBC surface as a tunable site of tumor DNA capture and retention and challenge the plasma-centric paradigm of liquid biopsy by identifying a distinct cellular reservoir of tumor-derived genetic material.","tags":["液体活检","红细胞结合肿瘤DNA","肺癌","ctDNA假阴性","预印本","TLR9"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926202","pmid":"42926202","pmcid":"10511428","doi":"10.1080/01969722.2025.2588199","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926202/","notice_url":"","trial_url":"","pub_date":"2026-Oct-09","briefing_date":"2026-10-25","journal_abbr":"BMC Cancer","journal_full":"BMC CANCER","tier":"B","if_val":4.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"回顾性生物信息学预后标志物研究 · 整合转录组与单细胞RNA测序，辅以组织学实验验证（非治疗性）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":50,"score_breakdown":{"clinical":15,"methodology":16,"specialty":19,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"基于R-loop相关基因的预后评分在食管鳞癌中的构建及其与免疫微环境、干性的关联分析","title_en":"An R-loop-related gene signature predicts prognosis and shapes the immune microenvironment in esophageal squamous cell carcinoma.","authors":"Meng C, Su H, Yan R, Sun R, Yu Q, Meng Y, Xi Y","affiliation_highlight":"Shanxi Medical University, Taiyuan, Shanxi, 030001, People's Republic of China.","results":"","authors_conclusion":"本研究首次系统刻画ESCC的R-loop景观，提示SquamousEpithelium细胞可能在R-loop相关进展中起关键作用，并被鉴定为具有潜在预后价值及可能治疗相关性的生物标志物，尚需功能验证。","ai_note":"摘要未报告样本量、随访时间、HR/95%CI、评分阈值及模型校正信息，无法判断效应量与过拟合风险；评分构建与预后评估似在同一数据框架内完成，缺乏独立外部验证队列；主要终点总生存仅以“显著更差”表述，且低评分组预后更差与高评分恶性SquamousEpithelium细胞干性增强并存，方向性矛盾未被解释；单细胞“最高评分细胞类型”结论依赖多算法整合与注释稳定性；“首次系统刻画”和“潜在治疗相关性”超出当前数据支持范围。","pico":{"p":"食管鳞状细胞癌（ESCC）患者转录组与单细胞RNA测序数据；样本量摘要未报告","ic":"暴露/指标：基于R-loop相关基因（RLRGs）构建评分并划分高低评分组；对照：非肿瘤对照组织用于核心基因表达验证"},"reason":"为ESCC中R-loop相关基因预后分层与免疫微环境/干性关联提供假设生成框架，可作为后续外部验证与机制研究的对照基线；当前证据强度不足以改变手术或围手术期临床决策。","abstract_en":"BACKGROUND: Esophageal squamous cell carcinoma (ESCC) features a poor prognosis and unclear pathogenesis, and the role of R-loops, key regulators of genome stability, has not been systematically characterized in this disease. METHODS: Transcriptomic and single-cell RNA sequencing data of ESCC were integrated with published R-loop-related genes (RLRGs) to construct an RLRG scoring system. The associations between the RLRG score and prognosis, tumor immune microenvironment, and tumor stemness were analyzed via multiple bioinformatics algorithms. The expression of core genes was verified using reverse transcription quantitative polymerase chain reaction (RT-qPCR), Western Blot, immunohistochemistry, and immunofluorescence. RESULTS: Seven key RLRGs related to the prognosis of the ESCC patients were identified, among which three core genes-BRIX1, CHEK1, and NUP155-were significantly upregulated in ESCC tissues compared with controls, as confirmed by both bioinformatic analysis and experimental validation. Notably, BRIX1, CHEK1, and NUP155 were co-enriched in DNA replication, pyrimidine metabolism, RNA degradation, and MYC target pathways, which are closely linked to R-loop biology and suggest potential crosstalk between these genes and R-loop regulatory networks. Meanwhile, the low RLRGs score group exhibited significantly worse overall survival but displayed a more active yet dysfunctional immune microenvironment. Single-cell analysis identified SquamousEpithelium cells as the key cell type with the highest RLRG scores across five independent algorithms. Malignant SquamousEpithelium cells with high RLRG scores showed enhanced stemness and activation of pathways including JAK-STAT, hypoxia, and DNA repair. CONCLUSION: This study provided the first systematic characterization of the R-loop landscape in ESCC, suggests that SquamousEpithelium cells may play a key role in R-loop-associated progression and are identified as potential prognostic biomarkers with possible therapeutic relevance that requires functional validation.","tags":["食管鳞癌","R-loop","预后模型","肿瘤免疫微环境","单细胞测序","生物信息学"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42920888","pmid":"42920888","pmcid":"PMC11083526","doi":"10.1016/j.cgh.2025.06.036","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42920888/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Liver fibrosis risk, missed follow-up, and inequitable specialist referral in the All of Us Research Program: a retrospective cohort study.","title_en":"Liver fibrosis risk, missed follow-up, and inequitable specialist referral in the All of Us Research Program: a retrospective cohort study.","authors":"Sellers K, White TM, Manolas MI, Hagström H, Brennan PN, Diaz LA, Bansal MB, Danpanichkul P et al.","affiliation_highlight":"City University of New York Graduate School of Public Health & Health Policy (CUNY SPH), New York, NY, USA.","results":"BACKGROUND: Metabolic dysfunction-associated steatotic liver disease (MASLD) is highly prevalent and frequently undiagnosed, despite liver fibrosis being the strongest predictor of liver-related morbidity and mortality. …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Metabolic dysfunction-associated steatotic liver disease (MASLD) is highly prevalent and frequently undiagnosed, despite liver fibrosis being the strongest predictor of liver-related morbidity and mortality. We aimed to quantify Fibrosis-4 (FIB-4) index-based fibrosis risk and to evaluate guideline-recommended follow-up-FIB-4 documentation, confirmatory testing, and specialist referral-in a large US cohort. METHODS: We conducted a retrospective study of electronic health record data from the US All of Us Research Program. Among adults aged 35 years or older with sufficient laboratory data, FIB-4 scores were calculated from routinely captured biomarkers, classified as low (<1.3), indeterminate (1.3-2.67; 2.0-2.67 if aged ≥65 years), or high risk (>2.67), and described across sociodemographic and metabolic subgroups; associations with incident major adverse liver outcomes (MALO) were assessed with Cox proportional-hazards regression. We examined FIB-4 documentation, confirmatory testing, and specialty referrals within 365 days of the index FIB-4 date. FINDINGS: Among 136,004 participants (mean age 60.8 years [SD 13.5]; 79,365 [58.4%] female; 81,420 [59.9%] White, 21,779 [16.0%] Hispanic or Latino, 20,076 [14.8%] Black), 26,971 (19.8%, 95% CI 19.6-20.0) had indeterminate and 11,217 (8.2%, 8.1-8.4) high FIB-4-based fibrosis risk. Elevated risk was more frequent with cardiovascular disease (41.7% vs 25.6%), hypertension (30.7% vs 23.4%), and type 2 diabetes (29.7% vs 27.4%), rising from 25.6% with no metabolic comorbidities to 36.6% with four. FIB-4 documentation was rare, and fewer than 1% of high-risk participants underwent confirmatory testing or referral; referral was low across risk categories (0.19% high, 0.19% indeterminate, 0.25% low risk). MALO occurred in 1308 (11.7%) high-risk vs 830 (0.8%) low-risk participants (adjusted hazard ratio 19.68, 95% CI 17.88-21.67). INTERPRETATION: Routinely collected laboratory data identify substantial liver fibrosis risk in this volunteer US cohort, yet guideline-recommended follow-up is uncommon. Implementation strategies such as automated risk calculation and reflex-based testing pathways could reduce missed opportunities for earlier diagnosis and intervention. FUNDING: No specific funding was received for this study.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926883","pmid":"42926883","pmcid":"PMC13694876","doi":"10.1016/j.lanepe.2026.101886","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926883/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Eur","journal_full":"Lancet Reg Health Eur","tier":"A","if_val":15.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"队列研究（启发式判定）","category":"nodule","category_label":"肺结节与早筛管理","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Age- and sex-specific smoking trends by birth cohort in Norway, 1978-2024: an analysis of cross-sectional survey data.","title_en":"Age- and sex-specific smoking trends by birth cohort in Norway, 1978-2024: an analysis of cross-sectional survey data.","authors":"Di Silvestre J, Salgado MV, Jeon J, Mok Y, Holford TR, Vedøy TF, Pedersen K, Burger EA et al.","affiliation_highlight":"Department of Health Management and Health Economics, University of Oslo, Oslo, Norway.","results":"BACKGROUND: Smoking is the primary cause of lung cancer, the leading cause of cancer-related mortality in Norway. To inform disease modeling and tobacco control policies, including lung cancer screening, we estimated sex…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Smoking is the primary cause of lung cancer, the leading cause of cancer-related mortality in Norway. To inform disease modeling and tobacco control policies, including lung cancer screening, we estimated sex-specific, birth-cohort smoking behaviors among Norwegians born between 1950 and 2000 using national survey data. METHODS: We analyzed nationally representative cross-sectional survey data from 1978 to 2024 (n = 78,282) to reconstruct smoking trends and smoking intensity in Norway. We used a previously established Age-Period-Cohort modeling framework to estimate cohort-specific prevalence of daily ever-smoking, probabilities of smoking initiation and cessation, prevalence of daily current-smoking, and average cigarettes smoked per day (CPD). Analyses were conducted separately by sex assigned at birth for cohorts born between 1950 and 2000. FINDINGS: Daily ever-smoking prevalence peaked in the 1950 birth cohort, reaching 70% (90% CI 66%-91%) among males and 66% (90% CI 55%-89%) among females, alongside similar peaks in smoking initiation probabilities, 13% (90% CI 12%-24%) for males and 12% (90% CI 10%-23%) for females. Smoking cessation probabilities increased with age within each birth cohort, rising from approximately 0% to 5% over 40 years in earlier cohorts, compared with an increase from about 5% to 15% over 20 years from the 1965 birth cohort onward. Smoking intensity peaked at 15 CPD among males and 12 CPD among females. Although smoking intensity declined in both sexes after the 1975 birth cohort, it remained higher among males, with peak model-estimated CPD decreasing from approximately 13.5 to 10 cigarettes in males and from 11.5 to 7.5 cigarettes in females between the 1980 and 2000 birth cohorts. INTERPRETATION: Smoking behavior in Norway has changed across generations, with declining smoking initiation rates, increased smoking cessation, and lower cigarettes per day. Understanding these trends provides essential inputs to inform tobacco control and lung cancer prevention policies in Norway. FUNDING: Norwegian Cancer Society, National Cancer Institute of the National Institutes of Health, U.S. Food and Drug Administration.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926823","pmid":"42926823","pmcid":"PMC13694844","doi":"10.1016/j.lanepe.2026.101890","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926823/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Eur","journal_full":"Lancet Reg Health Eur","tier":"A","if_val":15.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Life-course socioeconomic position and health in older adulthood: a causal mediation analysis in the 1958 British Birth Cohort.","title_en":"Life-course socioeconomic position and health in older adulthood: a causal mediation analysis in the 1958 British Birth Cohort.","authors":"Guo Y, Pelikh A, Ploubidis GB, Goodman A","affiliation_highlight":"Centre for Longitudinal Studies, Social Research Institute, University College London, United Kingdom.","results":"BACKGROUND: Childhood socioeconomic position (SEP) influences later health, but how inequalities persist into early older age and operate through adult SEP remains unclear. Quantifying these pathways is important for ide…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Childhood socioeconomic position (SEP) influences later health, but how inequalities persist into early older age and operate through adult SEP remains unclear. Quantifying these pathways is important for identifying opportunities to reduce health inequalities over the life course. We therefore used an interventional causal mediation framework to quantify the contribution of four distinct dimensions of adult SEP to childhood socioeconomic inequalities in self-reported and objective health outcomes in early older age. METHODS: We analysed data from the 1958 British Birth Cohort collected at birth, ages 33 and 55, and the most recent sweep, when participants were aged 60-66 years. Sample sizes ranged from 4014 to 8363 depending on the outcome. We examined the extent to which four dimensions of adult SEP - adult occupational class, education, housing tenure, and income - mediated associations between childhood SEP, measured by paternal occupational class at birth, and self-rated health (SRH), C-reactive protein (CRP), cholesterol ratio, glycated haemoglobin (HbA1c), and NT-proBNP. FINDINGS: Among men, occupational class mediated 39% of the association with poorer SRH (indirect effect RR 0.90, 95%: CI 0.86-0.95), and education mediated 27% (0.93, 0.90-0.96). Among women, mediation was smaller and most evident via education (10%; 0.95, 0.91-0.98) and housing tenure (6%; 0.97, 0.94-0.99). Mediation was limited for CRP and minimal for cholesterol ratio, HbA1c, and NT-proBNP. INTERPRETATION: Improving adult SEP could reduce, but is unlikely to eliminate, early older-age health inequalities associated with childhood SEP, highlighting the importance of interventions across the life course. FUNDING: UK Economic and Social Research Council.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921926","pmid":"42921926","pmcid":"","doi":"10.1177/10781552261496856","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921926/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"J Oncol Pharm Pract","journal_full":"Journal of oncology pharmacy practice : official publication of the International Society of Oncology Pharmacy Practitioners","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":28,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cost-effectiveness of zenocutuzumab-zbco across three NRG1 fusion-positive indications.","title_en":"Cost-effectiveness of zenocutuzumab-zbco across three NRG1 fusion-positive indications.","authors":"Weiss GJ","affiliation_highlight":"Department of Medicine, UMass Chan Medical School, Worcester, MA, USA.","results":"IntroductionZenocutuzumab-zbco is the first approved therapy for NRG1 fusion-positive cancer, indicated for non-small cell lung cancer (NSCLC), pancreatic ductal adenocarcinoma (PDAC), and cholangiocarcinoma (CCA). At th…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"IntroductionZenocutuzumab-zbco is the first approved therapy for NRG1 fusion-positive cancer, indicated for non-small cell lung cancer (NSCLC), pancreatic ductal adenocarcinoma (PDAC), and cholangiocarcinoma (CCA). At the pivotal analyses, overall survival (OS) was unreported for NSCLC and PDAC, whereas a later publication reported observed OS and progression-free survival (PFS) for CCA. Cost-effectiveness was evaluated from a US payer perspective.MethodsA three-state partitioned survival model estimated incremental costs and quality-adjusted life-years (QALYs) over 5 years. For NSCLC and PDAC, OS was modeled as a threshold variable across prespecified scenarios, with an incremental cost-effectiveness ratio (ICER) per scenario. For CCA, OS and PFS were reconstructed from published Kaplan-Meier curves and used directly, with a base-case ICER and extrapolation sensitivity. The wholesale acquisition cost was $24,155.46/infusion. Probabilistic, one-way, and threshold analyses were performed.ResultsFor NSCLC and PDAC, ICERs ranged from approximately $665,000 (PDAC, OS 18 months) to $2.79 million per QALY (NSCLC, OS 10 months). For CCA, using observed data, the base-case ICER was approximately $397,000 per QALY (extrapolation range $349,000-$430,000). No indication was cost-effective at $150,000 or $200,000 per QALY. Drug acquisition cost, comparator OS, and utilities were the dominant drivers. Cost-effectiveness required acquisition-cost reductions of 60% to 91%.ConclusionsAt its current price, zenocutuzumab is not cost-effective for any approved indication, whether OS is unobserved (NSCLC, PDAC) or observed (CCA). Cost-effectiveness is achievable only through substantial price reduction. NSCLC and PDAC findings are conditional on the prespecified OS scenarios; CCA findings rest on observed survival with extrapolation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42914560","pmid":"42914560","pmcid":"PMC12516970","doi":"10.1136/jitc-2025-012504","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42914560/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"J Immunother Cancer","journal_full":"Journal for ImmunoTherapy of Cancer","tier":"A","if_val":11.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Development and preclinical evaluation of tetraspecific antibodies in combination with ex vivo expanded NK cells infusion for improved control of esophageal cancer.","title_en":"Development and preclinical evaluation of tetraspecific antibodies in combination with ex vivo expanded NK cells infusion for improved control of esophageal cancer.","authors":"Liu Y, Fan X, Zuo X, Zhao J, Wang Y, Wu B, Sheng Y, Huang L et al.","affiliation_highlight":"Department of Thoracic Surgery, The First Affiliated Hospital of Zhengzhou University, Zhengzhou, Henan, China.","results":"BACKGROUND: Esophageal squamous cell carcinoma (ESCC) is highly heterogeneous, leading to limited drug effectiveness and resistance. Antibody therapies offer limited benefits due to low response rates.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Esophageal squamous cell carcinoma (ESCC) is highly heterogeneous, leading to limited drug effectiveness and resistance. Antibody therapies offer limited benefits due to low response rates. Multispecific antibodies, targeting multiple tumor antigens and natural killer (NK)-cell receptors, may overcome these challenges, but their effectiveness in ESCC therapy is not yet understood. METHODS: Transcriptome sequencing and database analysis were performed on samples from patients with ESCC to identify tumor antige
