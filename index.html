se,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902388","pmid":"42902388","pmcid":"PMC11696223","doi":"10.1038/s41392-024-02088-5","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902388/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-23","journal_abbr":"Cancer Cell Int","journal_full":"Cancer Cell International","tier":"B","if_val":7.0,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"High xCT expression indicates poor prognosis and chemoradiotherapy resistance in rectal cancer patients.","title_en":"High xCT expression indicates poor prognosis and chemoradiotherapy resistance in rectal cancer patients.","authors":"Li Y, LiuFu H, Yuan Z, Gan W, Peng S, Li J, Xin H, Cai C et al.","affiliation_highlight":"Department of General Surgery, Hernia and Abdominal Wall Surgery, The Sixth Affiliated Hospital, Sun Yat-sen University,…","results":"BACKGROUND: xCT/SLC7A11, an amino acid transporter, is implicated in various cancers. However, its role in rectal cancer remains unclear.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: xCT/SLC7A11, an amino acid transporter, is implicated in various cancers. However, its role in rectal cancer remains unclear. This study aimed to explore its predictive value for prognosis and chemoradiotherapy response in rectal cancer patients. METHODS AND MATERIALS: xCT expression was assessed using immunohistochemistry and RT-qPCR, and its associations with clinicopathological features and prognosis were analyzed. Single-cell RNA sequencing data and the TIMER platform were used to examine xCT's correlation with immune cell infiltration. A prognostic nomogram model was developed and evaluated with ROC, calibration, and decision curve analysis. Cell proliferation and cytotoxicity assays were conducted to assess xCT's role in ferroptosis and chemoradiotherapy sensitivity. RESULTS: xCT expression was elevated in rectal cancer tissues and correlated with adverse clinicopathological features, including tumor regression grade (P < 0.001). Single-cell and immune infiltration analyses indicated that xCT was associated with the immune microenvironment. High xCT expression predicted worse overall and disease-free survival, and multivariate analysis confirmed it as an independent prognostic factor. The xCT-based nomogram accurately predicted 1- and 3-year survival rates. Additionally, xCT knockout inhibited cell proliferation and enhanced chemoradiotherapy sensitivity in vitro and in vivo by promoting ferroptosis. CONCLUSION: High expression of xCT was associated with poor prognosis and chemoradiotherapy response in rectal cancer, representing a potential prognostic marker and therapeutic target.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902874","pmid":"42902874","pmcid":"PMC8637569","doi":"10.1002/1878-0261.12998","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902874/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-23","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cyclopiane Suppresses Gastric Cancer Invasion and Angiogenesis via the CYR61/αvβ3 Integrin/NF-κB Pathway.","title_en":"Cyclopiane Suppresses Gastric Cancer Invasion and Angiogenesis via the CYR61/αvβ3 Integrin/NF-κB Pathway.","authors":"Zhang Y, Tian H, Wang S, Lin F, Li W, Jiang R, Jiang Z, Wang W et al.","affiliation_highlight":"Department of General Surgery, The Second Affiliated Hospital of Anhui Medical University, Hefei, China.","results":"BACKGROUND: Cysteine-rich angiogenic inducer 61 (CYR61), a matricellular protein, has been implicated in gastric cancer aggressiveness through activation of integrin-mediated NF-κB signaling; however, effective pharmacol…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Cysteine-rich angiogenic inducer 61 (CYR61), a matricellular protein, has been implicated in gastric cancer aggressiveness through activation of integrin-mediated NF-κB signaling; however, effective pharmacological strategies targeting this axis remain limited. Cyclopiane, a bioactive small-molecule compound, has shown potential anti-tumor activity, but its role and underlying mechanisms in gastric cancer have not been fully elucidated. This study aimed to investigate whether Cyclopiane suppresses gastric cancer invasion and angiogenesis via modulation of the CYR61/αvβ3 integrin/NF-κB signaling pathway. METHODS: Human gastric cancer cell lines AGS and MKN45 were treated with increasing concentrations of Cyclopiane. Cell viability was assessed using MTT assays, while invasive capacity was evaluated using Matrigel-coated Transwell assays. TUNEL staining was used to assess changes in apoptosis in tumor cells. The expression of invasion-, angiogenesis-, and inflammation-related proteins was analyzed by Western blot (WB) and enzyme-linked immunosorbent assay (ELISA). Transcriptomic profiling of AGS cells treated with Cyclopiane versus vehicle control was performed to identify differentially expressed genes and enriched signaling pathways. CYR61 overexpression was achieved via adeno-associated virus (AAV-CYR61), with its pathway involvement further validated using integrin αvβ3 antagonists. The conventional anticancer drug 5-fluorouracil (5-FU) was employed to compare Cyclopiane's therapeutic effects. In vivo experiments utilized a nude mouse xenograft model to evaluate changes in tumor growth, angiogenesis, and inflammatory responses following Cyclopiane treatment. RESULTS: We found that Cyclopiane significantly reduced cell viability, invasive capacity of AGS and MKN45 cells and promoted apoptosis in a dose-dependent manner, with its high-dose effects comparable to those of 5-FU. Transcriptomic analysis revealed that Cyclopiane downregulated CCN1/CYR61, ITGAV and ITGB3 expression, with pathway enrichment identifying integrin signaling, ECM-receptor interaction, focal adhesion and NF-κB pathways as the top modulated terms. In vivo experiments demonstrated that Cyclopiane significantly inhibited tumor growth and progression. Both in vivo and in vitro studies showed Cyclopiane significantly downregulated vascular endothelial growth factor (VEGF), matrix metalloproteinase-2 (MMP-2), and MMP-9 expression while inhibiting integrin αvβ3 expression and NF-κB activation, as evidenced by reduced phosphorylation levels of p65 and IκBα. Overexpression of CYR61 partially reversed the inhibition of invasion, angiogenic factor production, and NF-κB signaling mediated by Cyclopiane. The αvβ3/αvβ5 integrin antagonist Cilengitide also exhibited tumor-suppressive effects, and the co-treatment of Cyclopiane with Cilengitide achieved the strongest tumor-suppressive effect. CONCLUSION: These findings suggest that modulation of the CYR61/integrin/NF-κB signaling axis contributes, at least in part, to the anti-invasive and anti-angiogenic effects of Cyclopiane in preclinical gastric cancer models. Further studies are required to establish its molecular target specificity, safety, selectivity, and translational potential.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42904335","pmid":"42904335","pmcid":"","doi":"10.14670/HH-25-158","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904335/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Histol Histopathol","journal_full":"Histology and histopathology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Rab7a promotes the progression of esophageal squamous cell carcinoma via the Hippo signaling pathway.","title_en":"Rab7a promotes the progression of esophageal squamous cell carcinoma via the Hippo signaling pathway.","authors":"Liu B, Tian Y, Lv Y","affiliation_highlight":"Department of Pathology, First Affiliated Hospital of Hebei North University, Zhangjiakou, Hebei, China.","results":"Ras-related protein Rab7a participates in fundamental cancer cell processes; however, its role in esophageal squamous cell carcinoma (ESCC) remains unclear. In this study, we aimed to define Rab7a's oncogenic functions i…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Ras-related protein Rab7a participates in fundamental cancer cell processes; however, its role in esophageal squamous cell carcinoma (ESCC) remains unclear. In this study, we aimed to define Rab7a's oncogenic functions in ESCC and its involvement in the Hippo signaling pathway. Rab7a expression was assessed using ESCC datasets and validated by immunohistochemical analysis of ESCC tissues. We examined functional effects using small interfering RNA knockdown and Yes-associated protein 1 (YAP1) overexpression rescue experiments, primarily by evaluating proliferation, migration, invasion, and apoptosis in ESCC TE-1 cells. We also established a xenograft model for in vivo validation. Regarding its mechanism(s) of action, we analyzed the effects of Rab7a on Hippo core kinases (LATS1/2 and MOB1) and further assessed YAP nuclear localization in ESCC cells. Rab7a was overexpressed in ESCC tissues, and elevated expression correlated with aggressive clinicopathological features, including advanced tumor, node, metastasis stage, positive lymph node metastasis, deep tumor invasion, and poor differentiation. Rab7a knockdown suppressed cellular proliferation, migration, and invasion and induced apoptosis in vitro while inhibiting tumor growth and decreasing Ki-67 expression in vivo. Mechanistically, Rab7a silencing downregulated YAP1, p-YAP1, CTGF, and survivin without affecting MST1. Furthermore, Rab7a knockdown significantly increased p-LATS1/2 levels without altering total LATS1/2 or MOB1 expression and decreased YAP nuclear accumulation. Importantly, YAP1 overexpression effectively reversed the suppressive effects of Rab7a knockdown on malignant phenotypes at both the functional and molecular levels, and restored the expression of downstream targets. Rab7a depletion also reversed an epithelial-mesenchymal transition (EMT)-like phenotype, as evidenced by upregulated E-cadherin and downregulated vimentin and Snail. This effect was rescued by YAP1 overexpression. Our findings demonstrate that Rab7a promotes ESCC progression by regulating the Hippo pathway effector YAP, thus inducing an EMT-like phenotype. Rab7a may serve as a promising prognostic biomarker and therapeutic target in ESCC that functions upstream of LATS1/2 to modulate YAP-mediated tumor progression.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903845","pmid":"42903845","pmcid":"PMC13682387","doi":"10.1016/j.isci.2026.117854","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903845/","notice_url":"","trial_url":"","pub_date":"2026-Nov-20","briefing_date":"2026-10-23","journal_abbr":"iScience","journal_full":"iScience","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Quantitative systems pharmacology modeling of class I-III BRAF-mutant NSCLC enables subgroup treatment analysis and combination therapy design.","title_en":"Quantitative systems pharmacology modeling of class I-III BRAF-mutant NSCLC enables subgroup treatment analysis and combination therapy design.","authors":"Hu J, Rao Q, Li Z, Li G, Bi Z, Wen D, Zhao C, Zhou G et al.","affiliation_highlight":"Department of Clinical Pharmacy, Jinling Hospital, Affiliated Hospital of Medical School, Nanjing University, Nanjing, C…","results":"BRAF-mutant non-small cell lung cancer (NSCLC) comprises three functional classes (I-III) with distinct driving mechanisms, yet effective therapies for classes II and III remain limited. To address this, we developed a q…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BRAF-mutant non-small cell lung cancer (NSCLC) comprises three functional classes (I-III) with distinct driving mechanisms, yet effective therapies for classes II and III remain limited. To address this, we developed a quantitative systems pharmacology (QSP) model that mechanistically recapitulates signaling networks and drug responses across all three classes, integrating multiscale preclinical-to-clinical datasets. The model enabled high-throughput prediction of clinical efficacy for monotherapies and combination therapies across diverse dosing regimens, and we identified that combining MEK and ERK inhibition represents a novel strategy for class II/III mutants, validated by original in vivo MiniPDX data using NSCLC patient tumors. Simulations further revealed that only triple blockade of EGFR, IGF1R, and FGFR pathway initiation can potently reduce tumor growth and overcome resistance in these classes. Our work is the first multiscale QSP platform mechanistically addressing class I-III BRAF mutations at the systems level for disease-centric translational combination therapy discovery and precision medicine design.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903378","pmid":"42903378","pmcid":"PMC13681281","doi":"10.7759/cureus.116578","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903378/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-23","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Association Between Electronic Health Record Health Maintenance Topic and Lung Cancer Screening Completion in a Resident-Run Clinic.","title_en":"Association Between Electronic Health Record Health Maintenance Topic and Lung Cancer Screening Completion in a Resident-Run Clinic.","authors":"Stawkowski LJ, Davenport C, Zaffiri K, Slenker A","affiliation_highlight":"Internal Medicine, Lehigh Valley Health Network, Allentown, USA.","results":"INTRODUCTION: Lung cancer screening (LCS) with low-dose computed tomography (LDCT) reduces lung cancer-specific mortality in high-risk populations, yet screening rates remain low nationwide. Electronic health record (EHR…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Lung cancer screening (LCS) with low-dose computed tomography (LDCT) reduces lung cancer-specific mortality in high-risk populations, yet screening rates remain low nationwide. Electronic health record (EHR) health maintenance tracking may support guideline-concordant screening, but implementation varies across outpatient settings. OBJECTIVE: To evaluate the association between manually adding the LCS health maintenance topic in the EHR and completion of LDCT screening in a resident-run outpatient clinic. METHODS: This retrospective cross-sectional study evaluated adult patients at a resident-run Federally Qualified Health Center Look-Alike clinic who met age and smoking history criteria for LCS in October 2024. Patients were categorized based on whether the LCS health maintenance topic was manually added within the Epic EHR and whether LDCT screening had been completed. Screening completion rates were compared using a chi-square test. RESULTS: Among 305 eligible patients, 130 (43%) completed LDCT screening. Of screened patients, 96 (74%) had the LCS health maintenance topic added, compared with 86 (49%) of 175 (57%) unscreened patients. Adding the LCS health maintenance topic was significantly associated with LDCT screening completion (p<0.001). CONCLUSION: Having the LCS health maintenance topic activated in the EHR was associated with higher rates of LDCT screening completion in a resident-run clinic compared with not having the LCS health maintenance topic activated. These findings support the role of having the LCS health maintenance topic added in the EHR as a practical strategy to reinforce preventive care delivery in outpatient practice.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903982","pmid":"42903982","pmcid":"PMC13681576","doi":"10.1016/j.hlife.2024.09.001","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903982/","notice_url":"","trial_url":"","pub_date":"2025-Aug","briefing_date":"2026-10-23","journal_abbr":"Hlife","journal_full":"hLife","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Dissection of intratumor microbiome-host interactions at the single-cell level in lung cancer.","title_en":"Dissection of intratumor microbiome-host interactions at the single-cell level in lung cancer.","authors":"Ma YJ, Sun YC, Wang L, Xu WX, Fan XD, Ding J, Heeschen C, Wu WJ et al.","affiliation_highlight":"State Key Laboratory of Systems Medicine for Cancer, Center for Single-Cell Omics, School of Public Health, Shanghai Jia…","results":"The intratumor microbiome, one of the hallmarks of cancer, plays a crucial role in cancer progression through its interaction with the host. However, the underlying mechanisms remain poorly understood.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The intratumor microbiome, one of the hallmarks of cancer, plays a crucial role in cancer progression through its interaction with the host. However, the underlying mechanisms remain poorly understood. In this study, six publicly available single-cell transcriptomic lung cancer datasets (comprising 178 samples) from multiple centers (Shanghai, New York, Seoul) were integrated to investigate the heterogeneity of host-microbiome interactions at the single-cell level using single-cell analysis of host-microbiome interactions (SAHMI). The results indicate that primary tumor tissues have a high proportion of fungi-associated cells, whereas metastatic brain tissues predominantly contain bacteria-associated cells. There are also distinct microbial distributions across cell types. Notably, the presence of specific bacteria significantly influences the transcriptome of resident host cells, including T cells and macrophages, by modulating pathways related to ribosomal RNA (rRNA) processing, cellular responses to stress and stimuli, and RNA and protein metabolism. Finally, specific cell-associated bacteria are significantly correlated with clinical features, such as lung cancer stages and smoking frequency. These single-cell insights into microbiome-host interactions improve current understanding about lung cancer development and progression and offer potential micro-ecological and diagnostic insights.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903193","pmid":"42903193","pmcid":"PMC13680210","doi":"10.3389/fonc.2026.1960604","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903193/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Gastric involvement in multiple myeloma-associated AL amyloidosis: a case with serial endoscopy and a pooled analysis of 30 published cases.","title_en":"Gastric involvement in multiple myeloma-associated AL amyloidosis: a case with serial endoscopy and a pooled analysis of 30 published cases.","authors":"Wang L, You J, Cheng G, Shen X","affiliation_highlight":"Department of Hematology, Gansu Provincial Hospital of TCM, Lanzhou, China.","results":"OBJECTIVE: To describe serial endoscopic findings in a patient with relapsed/refractory multiple myeloma (MM) and gastric amyloidosis and to summarize 30 published cases, with emphasis on their clinical, endoscopic, and …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To describe serial endoscopic findings in a patient with relapsed/refractory multiple myeloma (MM) and gastric amyloidosis and to summarize 30 published cases, with emphasis on their clinical, endoscopic, and histopathologic features and common diagnostic challenges. METHODS: This study comprised a case report and an individual-patient pooled analysis of published cases. We reviewed the clinical course and serial endoscopic assessments of the index patient and searched PubMed, Web of Science, Cochrane Library, and Embase from inception through June 1, 2026. Reports of MM-associated gastric amyloidosis with extractable clinical information were included. Demographic characteristics, symptoms, sites of involvement, endoscopic findings, diagnostic methods, clonal characteristics, treatment, and outcomes were analyzed descriptively. RESULTS: During myeloma relapse, the index patient developed refractory nausea and vomiting. Routine histopathologic examination of a biopsy from a proliferative lesion in the gastric fundus showed a fundic gland polyp, while Congo red staining was weakly positive. Symptoms improved substantially after anti-multiple myeloma treatment was resumed, and repeat endoscopy after two cycles of anti-multiple myeloma treatment showed fewer and smaller polypoid elevations. As the disease subsequently progressed, nausea and vomiting recurred intermittently and the polypoid elevations gradually increased, raising the possibility that the gastric manifestations tracked plasma-cell clonal activity. Thirty previously published patients were included. Bleeding-related manifestations were most common (20/30, 66.7%), followed by nausea and vomiting (10/30, 33.3%). The antrum was the most frequently involved site (16/26, 61.5%). Endoscopic findings were available for 28 patients; nodules, polyps, masses, or other nonhematomatous elevated lesions predominated (16/28, 57.1%). Among 25 patients with a clear diagnostic sequence, 14/25 (56.0%) were diagnosed with MM or smoldering multiple myeloma after gastrointestinal amyloid deposition was identified, whereas 11/25 (44.0%) developed gastric involvement in the setting of previously diagnosed MM. CONCLUSIONS: MM-associated gastric amyloidosis lacks specific symptoms and endoscopic features. Bleeding, refractory vomiting or obstruction, and tumor-like lesions are important presentations. In patients with MM who have unexplained persistent gastrointestinal symptoms, or discordance among the clinical presentation, endoscopic phenotype, and histopathologic findings, multiple adequate biopsies should be obtained, with deeper sampling when necessary, followed by Congo red staining, confirmation under polarized light, and amyloid protein typing.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903147","pmid":"42903147","pmcid":"PMC3645302","doi":"10.1126/science.1224820","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903147/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Ecological drivers of the colon cancer microbiome: evidence for niche-based selection over stochastic colonization.","title_en":"Ecological drivers of the colon cancer microbiome: evidence for niche-based selection over stochastic colonization.","authors":"Su W, Ma ZS","affiliation_highlight":"Department of Radiology, Affiliated Hospital of Yunnan University, Kunming, China.","results":"Colon cancer is a leading global malignancy influenced by genetic, environmental, and microbial factors. This study integrates ecological theories, including Hubbell's neutral theory, augmented by Ning et al.'s (2019, PN…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Colon cancer is a leading global malignancy influenced by genetic, environmental, and microbial factors. This study integrates ecological theories, including Hubbell's neutral theory, augmented by Ning et al.'s (2019, PNAS) stochasticity analysis framework, and classic niche theory, to assess the contributions of stochastic colonization and deterministic niche selection in shaping microbiome assembly and dynamics in colon cancer tissues. Specialist species were identified using Levins' niche breadth analysis. By reanalyzing the datasets from Nejman et al., including 22 normal adjacent tissue (NT) and 22 primary tumor (PT) samples, we find: (i) deterministic niche selection appears to dominate community assembly and diversity maintenance in both NT and PT microbiomes, as demonstrated by the normalized stochasticity ratio (NSR: 0.267 for NT, 0.287 for PT; both below 0.5; Wilcoxon PT>NT, p=0.027). Only 18.2% NT and 27.3% PT samples fit the neutral model, confirming stochastic drift plays a limited role and niche selection predominates in structuring tissue microbiomes. (ii) Through niche breadth analysis, we identified 106 specialist species, of which 14 are known CRC-associated taxa, including Fusobacterium nucleatum, Escherichia coli, Enterococcus faecalis, and Peptostreptococcus anaerobius. These species have established roles in inflammation, genotoxicity, immune modulation, and chemoresistance. (iii) These findings suggest that deterministic niche-based selection, rather than stochastic colonization, appears to govern microbial community assembly in colon cancer tissues. (iv) We postulate that the tumor microenvironment imposes biochemical filters-including hypoxia, lactate accumulation, and altered pH-that select for specialist species capable of adapting to these conditions. (v) While the sample size is modest and validation in independent cohorts is needed, our study demonstrates an integrative framework for understanding colon cancer microbiome dynamics. We propose testable hypotheses for future research: (i) specialist species abundance may correlate with tumor stage or patient survival; (2) depletion of specialists may alter tumor progression in preclinical models; and (3) hybrid neutral-niche models may better fit larger longitudinal datasets. By integrating ecological theory with microbiome research, this study offers insights into the forces driving microbial community assembly in tumor tissues and highlights potential targets for microbiome-based diagnostics and therapeutics.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903137","pmid":"42903137","pmcid":"PMC8230482","doi":"10.1038/modpathol.2017.54","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903137/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Case Report: Solitary fibrous tumor of the pelvis associated with Doege-Potter syndrome.","title_en":"Case Report: Solitary fibrous tumor of the pelvis associated with Doege-Potter syndrome.","authors":"Tan X, Dong W, Chang W, Chen X","affiliation_highlight":"Department of Gastrointestinal Surgery, Binzhou Medical University Hospital, Binzhou, Shandong, China.","results":"INTRODUCTION: Solitary fibrous tumor (SFT) is an uncommon mesenchymal spindle cell neoplasm (incidence ~1.4 per million). Although most SFT occur in the thoracic cavity, they can also arise in the retroperitoneum, pelvis…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Solitary fibrous tumor (SFT) is an uncommon mesenchymal spindle cell neoplasm (incidence ~1.4 per million). Although most SFT occur in the thoracic cavity, they can also arise in the retroperitoneum, pelvis, head, and neck. While the majority exhibit benign behavior, approximately 5% are associated with paraneoplastic syndromes, most notably Doege-Potter syndrome (DPS). DPS is characterized by non-islet cell tumor hypoglycemia (NICTH) resulting from tumor hypersecretion of high-molecular-weight insulin-like growth factor 2 (IGF2), which saturates insulin and IGF receptors causing refractory, life-threatening hypoglycemia. Due to nonspecific presentation and low incidence, DPS secondary to pelvic SFT is frequently misdiagnosed, underscoring the need for heightened clinical awareness. CASE REPORT: A 56-year-old man presented to the neurology department with acute loss of consciousness, aphasia, and urinary incontinence. He had a 3-year history of hypertension but no diabetes mellitus. Initial laboratory tests showed a blood glucose of 4.76 mmol/L; however, during hospitalization, he developed recurrent severe hypoglycemia, with a nadir glucose of 1.6 mmol/L. Further biochemical evaluation during fasting hypoglycemia revealed undetectable insulin (<0.2 mIU/L) and low C-peptide (0.14 ng/mL). Contrast-enhanced abdominopelvic CT demonstrated a 17.8 cm heterogeneously enhancing pelvic mass causing bladder compression and left ureteral displacement. The patient declined preoperative biopsy. Preoperative euglycemia was maintained with continuous intravenous dextrose infusion, and open en bloc surgical resection was performed. Histopathology and immunohistochemistry (positive for STAT6, CD34, and CD99; Ki-67 8%) confirmed an atypical solitary fibrous tumor. Postoperatively, hypoglycemic symptoms resolved completely, and the patient was discharged on postoperative day 6 without further hypoglycemic episodes. CONCLUSION: Pelvic SFT with DPS frequently presents with recurrent hypoglycemia or altered consciousness rather than local compressive symptoms. Early recognition of non-islet cell tumor hypoglycemia (NICTH) and prompt cross-sectional imaging are essential for accurate diagnosis. Complete surgical resection is definitive and results in full resolution of hypoglycemia. Given the unpredictable biological behavior of SFT, long-term follow-up is essential. Heightened clinical awareness may improve diagnostic accuracy and patient outcomes.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903127","pmid":"42903127","pmcid":"PMC3041807","doi":"10.1016/j.media.2017.06.015","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903127/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"HSV-Net: hybrid state-space and self-supervised vision fusion with progressive contour learning for CT pulmonary nodule segmentation.","title_en":"HSV-Net: hybrid state-space and self-supervised vision fusion with progressive contour learning for CT pulmonary nodule segmentation.","authors":"Cheng L, Wan X","affiliation_highlight":"Dexing People's Hospital, Dexing, Jiangxi, China.","results":"Accurate voxel-level segmentation of pulmonary nodules on chest CT is needed for diameter and volume measurement, growth tracking, and quantitative assessment in lung cancer screening. The task remains difficult: nodules…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Accurate voxel-level segmentation of pulmonary nodules on chest CT is needed for diameter and volume measurement, growth tracking, and quantitative assessment in lung cancer screening. The task remains difficult: nodules vary in attenuation, size, and contact with vessels or pleura, and clinically relevant morphology often lies in a thin, ambiguous margin. Existing systems commonly trade contour fidelity for speed-large prompt-driven foundation models can be accurate but slow, whereas compact CNN or SSM decoders are efficient yet tend to smooth spiculated and ground-glass borders. We propose HSV-Net (Hybrid State-space-Vision Network), a dual-stream 3D network that is prompt-free after nodule localization: an SSM3D stream provides whole-patch context with linear-complexity state-space blocks, and an OrthoLoRA stream adapts frozen DINOv2 features on axial, coronal, and sagittal slices. A Hybrid Gated Mixer (HGM) fuses the two streams before FPN decoding, and Progressive Contour Learning (PCL) supervises overlap, signed-distance-field geometry, and uncertainty-weighted contour refinement. On a 10-patient QIN Lung CT/QIN-LungCT-Seg development subset (n = 12 tumors; nested patient-level 5-fold CV), HSV-Net obtained the highest mean Dice (90.1% ± 1.0%; 95% CI [88.9, 91.3]) and Boundary F1 (86.3% ± 1.3%) among the compared methods on 128 × 128 × 64 patches, with a latency of 58 ms. A standard full-volume nnU-Net v2 baseline reached 88.6% ± 1.0% Dice on the same QIN folds, still below HSV-Net. On an independent LIDC-IDRI benchmark with expert volumetric consensus masks (186 patients/294 nodules; patient-level 5-fold CV within LIDC, not QIN→LIDC transfer), HSV-Net achieved 87.8% ± 1.1% Dice and 83.6% ± 1.3% Boundary F1, outperforming full-volume nnU-Net (87.1% ± 1.0% Dice). LUNA16 was retained only as a proxy size/localization check with diameter-matched spherical references, not as contour external validation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903106","pmid":"42903106","pmcid":"PMC11261188","doi":"10.1002/cncr.34244","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903106/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Immune-related adverse events are associated with favorable clinical outcomes in esophageal cancer treated with immune checkpoint inhibitors: a systematic review and meta-analysis.","title_en":"Immune-related adverse events are associated with favorable clinical outcomes in esophageal cancer treated with immune checkpoint inhibitors: a systematic review and meta-analysis.","authors":"Fan J, Chen D, Jia L","affiliation_highlight":"Graduate School, Beijing University of Chinese Medicine, Beijing, China.","results":"INTRODUCTION: Immune-related adverse events (irAEs) are distinctive toxicities associated with immune checkpoint inhibitors (ICIs) and have been reported to correlate with clinical outcomes in several cancers. However, w…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Immune-related adverse events (irAEs) are distinctive toxicities associated with immune checkpoint inhibitors (ICIs) and have been reported to correlate with clinical outcomes in several cancers. However, whether this association also exists in patients with esophageal cancer (EC) receiving ICIs remains uncertain. This systematic review and meta-analysis aimed to evaluate the association between irAEs and clinical outcomes in this population. METHODS: This systematic review and meta-analysis was conducted and reported in accordance with the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) 2020 statement. PubMed, Embase, Web of Science, and the Cochrane Library were searched from inception to March 2, 2026. Eligible studies evaluated the association between irAEs and progression-free survival (PFS), overall survival (OS), objective response rate (ORR), or disease control rate (DCR). Hazard ratios (HRs) with 95% confidence intervals (CIs) were pooled for PFS and OS, whereas odds ratios (ORs) with 95% CIs were pooled for ORR and DCR using random-effects models. Between-study heterogeneity, 95% prediction intervals (PIs), sensitivity analyses, publication bias, prespecified subgroup analyses, and immortal-time bias were also assessed. RESULTS: 14 studies involving 1, 546 patients were included. The occurrence of irAEs was associated with improved PFS (HR, 0.45; 95% CI, 0.31-0.63), OS (HR, 0.54; 95% CI, 0.46-0.64), ORR (OR, 4.00; 95% CI, 1.58-10.12), and DCR (OR, 3.85; 95% CI, 2.40-6.20). The 95% PIs were 0.16-1.24, 0.44-0.66, 0.19-82.57, and 1.42-10.44 for PFS, OS, ORR, and DCR, respectively, crossing the null value for PFS and ORR. Subgroup estimates were generally similar in direction but remained exploratory. No eligible survival estimates using landmark or time-varying approaches were available for the comparison between patients with and without irAEs. CONCLUSIONS: In patients with EC receiving ICIs, the occurrence of irAEs may be a prognostic marker of favorable outcomes. However, wide PIs for PFS and ORR indicate that these associations may vary across future studies and immortal time bias may overestimate survival associations. This observational evidence derives mainly from East Asian patients with esophageal squamous cell carcinoma and is primarily applicable to these patients. Subgroup findings remain exploratory and require prospective validation. SYSTEMATIC REVIEW REGISTRATION: https://www.crd.york.ac.uk/prospero/, identifier CRD420261346294.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903105","pmid":"42903105","pmcid":"PMC13212781","doi":"10.1007/s00520-026-10781-0","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903105/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Network analysis of core symptom changes in hepatocellular carcinoma survivors after transarterial chemoembolization: A longitudinal study.","title_en":"Network analysis of core symptom changes in hepatocellular carcinoma survivors after transarterial chemoembolization: A longitudinal study.","authors":"Wang S, Wang X, Jiang N, Hu Y, Guo L, Zhang L, Liu Y, Kong S et al.","affiliation_highlight":"School of Nursing, Kunming Medical University, Kunming, Yunnan, China.","results":"OBJECTIVE: The aims of this study were to explore the longitudinal trajectories of core symptoms in survivors with hepatocellular carcinoma (HCC) after transarterial chemoembolization (TACE) and to analyze their associat…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: The aims of this study were to explore the longitudinal trajectories of core symptoms in survivors with hepatocellular carcinoma (HCC) after transarterial chemoembolization (TACE) and to analyze their associations with health-related quality of life (HRQoL) and unmet supportive care needs. METHODS: This longitudinal study enrolled 271 HCC survivors undergoing TACE in China. Patient-reported outcomes were assessed at three time points-24 h (T1), 7 days (T2), and 1 month (T3) post-TACE-using four validated instruments: the MD Anderson Symptom Inventory-Chinese Version (MDASI-C), the Tumor Symptom Measure for Primary Liver Cancer (TSM-PLC), the Quality of Life Instrument for Liver Cancer (QOL-LC V2.0), and the Short Form of Survivors' Unmet Needs Scale (SF-SUNS). Exploratory factor analysis was conducted to extract discrete symptom clusters, and network analysis was used to calculate strength centrality (rs)-an index quantifying the sum of absolute edge weights connecting each symptom to all others-to identify core symptoms. RESULTS: Five symptom clusters were identified at T1: Fatigue-Cognitive, Post-embolization, Somatic, Emotional, and Hepatobiliary-Specific. The Post-embolization cluster was present only at T1, whereas the remaining four clusters persisted at T2 and T3. However, the core symptom shifted over time: nausea at T1 (rs = 1.154), lack of appetite at T2 (rs = 1.229), and sadness at T3 (rs = 1.107). HRQoL was lowest at T1, improved at T2, and declined at T3, with all pairwise comparisons significant (all p < 0.001). Unmet needs were highest at T3, with all time-point differences significant (all p < 0.001). The largest gaps were observed in information provision, care continuity, and emotional support. Greater symptom severity was significantly associated with poorer HRQoL at all time points (all p < 0.01). CONCLUSIONS: During the first month post-TACE, the sequence of core symptoms transitioned from nausea to lack of appetite and then to sadness, suggesting time-specific supportive care strategies-including antiemetic prophylaxis, nutritional support, and psychosocial care. Routine assessment of unmet needs may help reduce symptom burden and optimize long-term HRQoL for these survivors.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42901984","pmid":"42901984","pmcid":"1347506","doi":"10.5281/zenodo.21704762","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901984/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-23","journal_abbr":"Nat Genet","journal_full":"NATURE GENETICS","tier":"A","if_val":25.5,"zone":"JCR Q1 · 1区","warned":false,"study_type":"方法学研究 · 模拟数据与真实GWAS汇总统计数据验证（非临床研究）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":34,"score_breakdown":{"clinical":1,"methodology":24,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"方法实现","metric":"运行速度（相对GCTA-COJO）","val":">120倍","stat":"","grounded":true,"checks":[{"num":"120","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"方法实现","metric":"运行速度（相对GCTA-COJO）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「方法实现」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Manc-COJO：多祖源条件与联合分析较单祖源COJO提升独立关联信号检出并减少假阳性（模拟与真实GWAS汇总数据验证）","title_en":"Multiancestry conditional and joint analysis applied to GWAS summary statistics.","authors":"Wang X, Wang Y, Yang J, Visscher PM, Wray NR, Yengo L","affiliation_highlight":"Department of Psychiatry, University of Oxford, Oxford, UK.","results":"C++实现版本的Manc-COJO较GCTA-COJO速度提升>120倍；其余模拟与真实数据分析结果摘要未给出具体数值","authors_conclusion":"模拟与真实数据分析显示，与GCTA中的单祖源COJO及其临时多祖源改装版本相比，Manc-COJO在更好地检出独立关联信号的同时减少假阳性；并提出Manc-COJO:FIX用于识别祖源特异性独立关联；C++实现较GCTA-COJO快逾120倍，且支持来自个体基因型数据或预计算矩阵的连锁不平衡参考，便于数据共享受限时的分析。","ai_note":"摘要未报告模拟与真实数据中的效应量、假阳性率、灵敏度等具体数值及置信区间或P值，无法核验“改善检出、减少假阳性”的幅度；性能优势主要基于作者自建模拟框架，缺乏独立外部验证数据；该文献为统计遗传学后GWAS分析方法，与胸部肿瘤临床结局、手术或结节决策无任何直接关联，归入ai_digital仅为分类适配，契合度极低。","pico":{"p":"","ic":"干预：Manc-COJO（多祖源条件与联合分析）及后续算法Manc-COJO:FIX；对照：GCTA中的单祖源COJO及其临时性多祖源改装版本"},"reason":"与胸部肿瘤临床判断无直接关系，不能影响手术患者选择、随访决策或结节风险判断；仅在多祖源遗传关联研究的后处理（独立信号筛选、LD参考受限场景）层面提供方法学参考。","abstract_en":"Conditional and joint (COJO) analysis of genome-wide association study (GWAS) data is a standard post-GWAS analysis for identifying statistically independent associations. Although GWAS meta-analyses are increasingly conducted across multiple ancestry groups, the optimal strategy for multiancestry COJO analysis remains unclear. Here we introduce Manc-COJO, a method for multiancestry COJO analysis. Simulations and real-data analyses show that Manc-COJO improves detection of independent association signals while reducing false positives compared with single-ancestry COJO implemented in genome-wide complex trait analysis (GCTA) and its ad-hoc multiancestry adaptations. We also introduce Manc-COJO:FIX, a follow-up algorithm to identify ancestry-specific independent associations. The C++ implementation of Manc-COJO is over 120-fold faster than GCTA-COJO and supports linkage disequilibrium references derived from either individual-level genotype data or pre-computed matrices, facilitating analyses when data sharing is limited.","tags":["GWAS","统计遗传学","多祖源","条件与联合分析","方法学"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903238","pmid":"42903238","pmcid":"PMC13680641","doi":"10.1002/rcr2.70791","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903238/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-23","journal_abbr":"Respirol Case Rep","journal_full":"Respirology case reports","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"病例报告（单例）· 晚期肺浸润性黏液腺癌治疗中的影像反应评估","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":33,"score_breakdown":{"clinical":11,"methodology":6,"specialty":16,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"晚期浸润性黏液腺癌治疗后多灶空洞化致影像反应评估矛盾：一例病例报告","title_en":"Discordant Cavitary Changes: A Radiological Dilemma in Invasive Mucinous Adenocarcinoma: A Case Report.","authors":"Nigi A, Miya N, Iwamoto K, Itani H, Kondou S","affiliation_highlight":"Department of Respiratory Medicine Japanese Red Cross Ise Hospital Ise Mie Japan.","results":"2周期后CT示空洞成分增大而实性肿瘤成分缩小；再2周期后肺部病灶变化不大，Th4骨转移进展，总体评估为PD并改为多西他赛+雷莫芦单抗；此后空洞进一步增大、洞壁逐渐变薄、实性成分似缩小；诊断时及全程血清CEA、SLX均正常。","authors_conclusion":"This case illustrates that marked multifocal cavitary transformation may produce discordant morphological changes, limiting response assessment based on imaging alone.","ai_note":"单例病例报告，无对照；将空洞化归因于治疗相关缺乏病理或时序对照支持；影像反应评估基于主观CT描述，未提供测量值或RECIST细节；肿瘤标志物正常与疾病进展并存，提示不能依赖标志物判断；结论外推受限。","pico":{"p":"1例70余岁男性，IVA期浸润性黏液腺癌","ic":"阿替利珠单抗+贝伐珠单抗+卡铂+紫杉醇治疗，后续改为多西他赛+雷莫芦单抗；无对照"},"reason":"提示晚期浸润性黏液腺癌治疗后多灶空洞化可造成影像形态改变与病灶成分反应不一致，影响基于影像的疗效判断，为胸部肿瘤影像随访与罕见亚型治疗评估提供个案警示。","abstract_en":"Treatment-related cavitary transformation in lung cancer may complicate radiological response assessment. We report a man in his 70s with stage IVA invasive mucinous adenocarcinoma treated with atezolizumab, bevacizumab, carboplatin and paclitaxel. After two cycles, CT showed enlargement of cavitary components despite regression of solid tumour components, making response assessment difficult. After two additional cycles, the pulmonary lesions showed little change, whereas progression of the Th4 bone metastasis led to an overall assessment of progressive disease and a change to docetaxel plus ramucirumab. Thereafter, the cavities further enlarged while the cavity walls progressively thinned and the solid components appeared to regress. This case illustrates that marked multifocal cavitary transformation may produce discordant morphological changes, limiting response assessment based on imaging alone. Serum CEA and SLX levels remained within the normal ranges at diagnosis and throughout treatment.","tags":["浸润性黏液腺癌","空洞化","影像反应评估","病例报告","晚期NSCLC"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902761","pmid":"42902761","pmcid":"","doi":"10.1080/14656566.2026.2732052","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902761/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Expert Opin Pharmacother","journal_full":"Expert opinion on pharmacotherapy","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述/专家意见（非系统综述，无原始数据）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":32,"score_breakdown":{"clinical":11,"methodology":4,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"广泛期小细胞肺癌药物治疗前景：免疫联合、Tarlatamab与ADC的叙述性综述","title_en":"Extensive-stage small-cell lung cancer pharmacotherapy: what is on the horizon?","authors":"Maione P, Palma V, Pucillo G, Gridelli C","affiliation_highlight":"Division of Medical Oncology, S.G.","results":"","authors_conclusion":"As never in the past, the prognosis of ES-SCLC patients seems characterized by a new light, with innovative drugs that used combined or sequentially, have the potential of a substantial change of the natural history of this aggressive disease.","ai_note":"叙述性专家意见，无系统检索、偏倚评估或原始效应量，摘要未报告任何数值；将lurbinectedin联合atezolizumab一线维持和tarlatamab二线称为已建立两个新标准，但未呈现关键终点数据与证据强度；对ifinitamab deruxtecan、sacituzumab govitecan使用“very promising”属乐观表述；主要终点与样本量信息不足。","pico":{"p":"广泛期小细胞肺癌（ES-SCLC）患者；综述无样本量","ic":"不适用（叙述性综述，无原始干预对照）"},"reason":"梳理ES-SCLC一线免疫联合后维持治疗及二线Tarlatamab、ADC等新药方向，可为胸部肿瘤临床科研判断治疗格局演变和试验设计切入点提供背景，但不提供可直接引用的疗效估计。","abstract_en":"INTRODUCTION: Extensive-stage small cell lung cancer (ES-SCLC) is yet to be considered an oncologic clinical condition characterized by a dismal prognosis. However, about 5 years ago, the introduction of immunotherapy in the first-line regimens, combined with platin-based chemotherapy, has produced an improvement of survival outcomes for this patient population. AREAS COVERED: In the last year, two innovative approaches have further improved efficacy outcomes for ES-SCLC patients. The addition of lurbinectedin to the immunotherapeutic drug atezolizumab in the maintenance phase of first-line treatment, and the introduction of the bispecific T-cell engager antibody tarlatamab as second-line treatment, have established two new standards of care for the treatment of ES-SCLC. Moreover, ongoing phase III trials are testing the possibility to introduce tarlatamab in the first-line setting, as induction or as maintenance. Simultaneosusly, phase II trials have reported very promising antitumor activity for ifinitamab deruxtecan and sacituzumab govitecan, two antibody drug conjugates in the second-line setting, and phase III trials are ongoing. EXPERT OPINION: As never in the past, the prognosis of ES-SCLC patients seems characterized by a new light, with innovative drugs that used combined or sequentially, have the potential of a substantial change of the natural history of this aggressive disease.","tags":["ES-SCLC","免疫治疗","Tarlatamab","Lurbinectedin","ADC","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":true,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903229","pmid":"42903229","pmcid":"PMC13680233","doi":"10.3389/fonc.2026.1967294","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903229/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"病例报告（2例）· 诊断性个案观察，无对照","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":32,"score_breakdown":{"clinical":11,"methodology":5,"specialty":16,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"留置引流系统中胸腔组织碎屑用于恶性胸腔积液病理诊断与分子分型的2例病例报告","title_en":"Case Report: Diagnostic utility of pleural tissue debris retrieved during percutaneous drainage for the diagnosis of malignant pleural effusion and molecular profiling.","authors":"Kim J, Kim HG, Lee SH","affiliation_highlight":"Division of Pulmonary, Allergy, and Critical Care Medicine, Department of Internal Medicine, Kyung Hee University Hospit…","results":"病例1（67岁女性，类风湿关节炎相关间质性肺病）：引流系统内组织碎屑病理诊断为肺鳞状细胞癌，未检出基因组变异，未再行有创操作即启动化疗联合免疫治疗；病例2（78岁女性，左侧胸腔积液伴脑部病灶）：引流瓶内组织碎屑诊断为肺腺癌，分子检测示EGFR L858R突变，据此启动一线靶向治疗。摘要未报告定量终点、样本可评估率、95%CI或P值","authors_conclusion":"据作者所知，这是首篇描述胸腔组织碎屑用于恶性胸腔积液诊断及其分子检测适用性的病例报告；该报告提示，这一既往被忽视的常规胸腔引流副产物可为恶性胸腔积液患者（尤其是存在常规活检禁忌或拒绝活检者）提供足以完成组织病理诊断、免疫组化与分子检测的材料","ai_note":"仅2例成功案例，存在明显的发表偏倚（只报告取材成功者），无法估计组织碎屑的可获得率、细胞量不足率与诊断失败率；无标准活检或胸腔细胞学对照，未验证诊断一致性；“组织碎屑偶然发现”说明取材非预设流程，可重复性未知；病例2的脑部病灶未述及病理确认；标题称经皮引流而正文表述为导管/胸腔引流管，术语略不一致；由2例即外推至“恶性胸腔积液患者”整体，人群限定过宽；摘要无随访与治疗反应数据","pico":{"p":"2例女性患者（67岁、78岁），均表现为胸腔积液并疑似肺癌胸膜/远处转移；摘要未提供连续病例基数","ic":"干预：经导管/胸腔引流过程中偶然获得的胸腔组织碎屑行病理检查、免疫组化及分子检测；对照：无（未与常规胸膜活检或细胞学对照）"},"reason":"为“不可活检或拒绝活检的恶性胸腔积液患者”提供一条潜在的免活检病理与分子分型取材路径假设，提示引流标本留取流程可能影响后续治疗决策；同时为后续前瞻性队列设定需报告的可获得率、充分率与一致性等关键指标提供线索","abstract_en":"BACKGROUND: Although pleural tissue debris is occasionally encountered in the drainage systems of patients undergoing catheter or chest tube drainage, its clinical utility has not been reported. Here, we report two cases in which pleural tissue debris retrieved during catheter drainage enabled a definitive diagnosis of malignant pleural effusion (MPE) and molecularly guided treatment decisions. CASE PRESENTATION: The first case involved a 67-year-old woman with rheumatoid arthritis-associated interstitial lung disease who developed a right pleural effusion suggestive of lung cancer with pleural metastasis. Invasive procedures for tissue acquisition were required; however, biopsy was withheld because of the high risk of pneumothorax and acute exacerbation of the underlying lung disease. Tissue debris was incidentally found in the drainage system. The tissue was adequate for pathological examination and revealed lung squamous cell carcinoma without genomic alterations. Chemoimmunotherapy was initiated without further invasive procedures. The second case involved a 78-year-old woman who presented with a left pleural effusion and a brain lesion, highly suggestive of lung cancer with brain metastasis. She declined invasive diagnostic procedures; however, tissue debris was incidentally collected from the drainage bottle and diagnosed as lung adenocarcinoma. Molecular testing revealed that the tumor harbored an epidermal growth factor receptor (EGFR) L858R mutation, allowing first-line targeted therapy to be initiated without further invasive testing. CONCLUSION: To the best of our knowledge, this is the first case report to describe the clinical utility of pleural tissue debris for the diagnosis of MPE and its suitability for molecular profiling. Our report highlights that this previously overlooked byproduct of routine pleural drainage can provide adequate material for histopathological diagnosis, immunohistochemistry, and molecular testing in patients with MPE, particularly those for whom conventional biopsy is contraindicated or declined.","tags":["恶性胸腔积液","胸腔引流组织碎屑","分子分型","EGFR L858R","病例报告","诊断路径"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42904195","pmid":"42904195","pmcid":"PMC13682456","doi":"10.1016/j.radcr.2026.09.030","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904195/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-23","journal_abbr":"Radiol Case Rep","journal_full":"Radiology case reports","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告 · 影像-病理相关性分析","category":"surgery","category_label":"微创与无管化胸外科","score_total":30,"score_breakdown":{"clinical":9,"methodology":6,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例","metric":"纵隔肿块最大径线","val":"10.5 × 8.9 × 9.6 cm","stat":"","grounded":true,"checks":[{"num":"10.5","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"8.9","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"9.6","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"PET/CT SUVmax","val":"4.8","stat":"","grounded":true,"checks":[{"num":"4.8","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"单例","metric":"切除标本EHE最长径","val":"9.5 cm","stat":"","grounded":true,"checks":[{"num":"9.5","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"分子检测融合基因","val":"WWTR1::CAMTA1","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"单例","metric":"手术切缘","val":"阴性","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"单例","metric":"纵隔肿块最大径线","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"PET/CT SUVmax","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"切除标本EHE最长径","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"分子检测融合基因","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"手术切缘","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"前纵隔上皮样血管内皮瘤合并骨髓脂肪瘤及髓外造血、影像上误判为成熟畸胎瘤：一例影像-病理对照病例报告","title_en":"Anterior mediastinal epithelioid hemangioendothelioma associated with myelolipoma and extramedullary hematopoiesis mimicking a mature teratoma: A radiologic-pathologic correlation.","authors":"Dhakal S, Savoia P, Mitra S, Sharma M","affiliation_highlight":"Department of Radiology, University of Iowa Hospitals & Clinics, Iowa City, IA, USA.","results":"肿块 10.5 × 8.9 × 9.6 cm；FDG PET/CT SUVmax 4.8，无淋巴结或远处转移；切除标本为 9.5 cm 经典型EHE，伴骨髓脂肪瘤成分、广泛髓外造血及化生性骨化；肿瘤细胞表达内皮标志物，RNA融合分析检出 WWTR1::CAMTA1；手术切缘阴性，术后早期及腹盆腔影像未见残留或转移病灶","authors_conclusion":"尽管类似的EHE-骨髓脂肪瘤/髓外造血共存已有报道，本病例强调其在多模态影像上可模仿成熟畸胎瘤，并提供了含脂肪、实性及骨化成分的直接影像-病理对照","ai_note":"单例报告，无对照与系统随访，'术后早期'未见复发的时间窗未界定，不足以支撑'监测即可、无需辅助治疗'的普适结论；摘要未给出随访时长与影像复查间隔；标题与结论侧重影像模仿成熟畸胎瘤这一'教学点'，属病例报告的典型叙事性强调，非疗效证据","pico":{"p":"52岁男性，单例；左前上纵隔混合密度肿块 10.5 × 8.9 × 9.6 cm，含宏观脂肪、软组织成分及粗大钙化","ic":"无对照组（单例）；行手术切除，术后多学科讨论建议随访观察、不予辅助治疗"},"reason":"提示前纵隔含脂肪、钙化、实性成分的肿块在术前不能仅凭影像断定成熟畸胎瘤，需将罕见血管源性肿瘤纳入鉴别并影响切除范围与病理取材策略；为纵隔罕见肿瘤的影像-病理对照提供个案基线","abstract_en":"Epithelioid hemangioendothelioma (EHE) is an ultra-rare vascular neoplasm with variable biologic behavior. Mediastinal EHE is particularly uncommon and may mimic more prevalent prevascular mediastinal tumors. We report a 52-year-old man with a 10.5 × 8.9 × 9.6 cm mixed-density left upper anterior mediastinal mass containing macroscopic fat, soft-tissue components, and coarse calcification. FDG PET/CT demonstrated mild-to-moderate uptake (SUVmax 4.8) without nodal or distant metastatic disease, and the imaging appearance favored mature teratoma. Resection demonstrated a 9.5 cm conventional EHE intimately associated with a myelolipomatous component containing extensive extramedullary hematopoiesis and metaplastic ossification. The neoplastic cells expressed endothelial markers, and RNA fusion analysis detected WWTR1::CAMTA1. Surgical margins were negative, early postoperative and abdominopelvic imaging showed no residual or metastatic disease, and multidisciplinary review recommended surveillance without adjuvant therapy. Although similar EHE-myelolipoma/extramedullary hematopoiesis associations have been reported, this case emphasizes the multimodality imaging mimic of mature teratoma and provides direct radiologic-pathologic correlation of the fat-containing, solid, and ossified components.","tags":["纵隔肿瘤","上皮样血管内皮瘤","影像-病理对照","成熟畸胎瘤鉴别","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903379","pmid":"42903379","pmcid":"PMC13680759","doi":"10.34172/mejdd.3376","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903379/","notice_url":"","trial_url":"","pub_date":"2026-Jan","briefing_date":"2026-10-23","journal_abbr":"Middle East J Dig Dis","journal_full":"Middle East journal of digestive diseases","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（narrative review）· 非系统评价，无定量合成或证据分级","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":30,"score_breakdown":{"clinical":10,"methodology":6,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"叙述性综述：诊断与治疗创新能否改变胃食管癌诊疗格局（无定量证据合成）","title_en":"Can Current Innovations in Diagnostic and Therapeutic Strategies Transform Gastroesophageal Cancer Care?","authors":"Alshwayyat S, Almasri N, Maraqa K, Abu Samrah S, Aljawabrah S, Abuhalaweh N, Alshwaiyat Y, Al-Shami R et al.","affiliation_highlight":"Kern Medical (UCLA David Geffen School of Medicine affiliate), Bakersfield, California, USA.","results":"","authors_conclusion":"尽管这些创新前景可期，仍需进一步验证；将先进影像、基于生物标志物的治疗与AI驱动工具整合入临床实践，有望优化治疗策略并改善胃食管癌生存结局。","ai_note":"叙述性综述，未报告检索策略、纳入排除标准、文献数量或质量评价，无可提取的效应量与置信区间；文中以“显著改善生存”“降低诊断变异”等定性表述代替具体数据，属选择性强调阳性创新而缺乏阴性或矛盾证据的呈现；对临床决策仅有背景参考价值，信息不足。","pico":{"p":"","ic":""},"reason":"为胃食管癌影像、内镜、分子分型、液体活检、类器官与AI辅助等创新方向提供选题背景与证据缺口提示，但因无原始数据与定量合成，不能直接支撑手术方式、新辅助方案或随访策略的具体判断。","abstract_en":"Gastric and esophageal cancers pose major global health challenges due to high incidence, frequent late-stage diagnosis, and poor survival outcomes. This review synthesized current evidence on emerging technologies and innovative approaches shaping research and practice. We included studies that evaluated diagnostic imaging, endoscopic and surgical treatments, molecular biomarkers, staging, screening, and innovative therapeutic approaches in gastric and esophageal cancers. The review revealed notable demographic and geographic disparities in disease incidence and outcomes. Recent advancements in endoscopic techniques, imaging modalities, and staging systems have enhanced early detection and prognostic stratification. Intriguing findings include significant improvements in survival with HER2-targeted and immune checkpoint inhibitor (ICI) therapies, the ability of liquid biopsy to detect resistance mutations and monitor treatment efficacy in real time, and the use of patient-derived organoids to predict individualized responses. Additionally, artificial intelligence (AI) applications have reduced diagnostic variability, thereby refining therapeutic decision-making. Despite promising innovations, further validation of these emerging technologies is required. Integrating advanced imaging, biomarker-based treatments, and AI-driven tools into clinical practice holds the potential to optimize treatment strategies and improve survival outcomes in gastroesophageal cancers.","tags":["胃食管癌","叙述性综述","液体活检","AI辅助诊断","HER2与免疫治疗"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903681","pmid":"42903681","pmcid":"PMC13681366","doi":"10.3389/fimmu.2026.1971880","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903681/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 非系统评价","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":29,"score_breakdown":{"clinical":10,"methodology":8,"specialty":3,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"胰腺导管腺癌相关成纤维细胞从亚型分类转向临床相关功能状态：叙述性综述","title_en":"From CAF subtypes to clinically relevant states: cancer-associated fibroblasts in pancreatic ductal adenocarcinoma.","authors":"Hao Y, Wang Y, Du Q, Li G","affiliation_highlight":"Third Hospital of Shanxi Medical University, Shanxi Bethune Hospital, Shanxi Academy of Medical Sciences, Tongji Shanxi …","results":"","authors_conclusion":"Clinical translation will require state definitions that integrate function, spatial context and treatment history, supported by reproducible markers, prospective validation and models that retain human stromal diversity.","ai_note":"叙述性综述，未报告系统检索、纳入排除标准、偏倚评估或定量合成；无原始样本与效应量。将Hedgehog/透明质酸靶向治疗失败用于论证“靶点丰度不足以选患者”，但摘要未给出试验数据。CAF“状态”定义仍停留在概念层面，缺乏可复现marker与前瞻验证。","pico":{"p":"","ic":""},"reason":"为PDAC基质靶向治疗（Hedgehog、透明质酸）失败提供机制层面的解释框架，并提示CAF状态定义需整合功能、空间背景与治疗史；对胸部肿瘤日常手术或随访决策直接影响有限，但可作为TME与基质靶向研究的概念参照。","abstract_en":"Pancreatic ductal adenocarcinoma (PDAC) develops within a dense, poorly perfused tumor microenvironment (TME) in which cancer-associated fibroblasts (CAFs) are prominent cellular and structural components. Once viewed as a uniform population of activated matrix-producing cells, CAFs now include myofibroblastic, inflammatory, antigen-presenting and other populations identified by single-cell and spatial studies. These categories sharpen experimental resolution but do not form a stable hierarchy. CAF phenotypes overlap across spatial niches and disease stages, and they change under metabolic stress or treatment. We frame this heterogeneity as a set of context-dependent functional states. This review synthesizes evidence on fibroblast origins, canonical and recently reported states, and the signals that drive state transitions. It then examines CAF functions in extracellular matrix organization, tumor-cell plasticity and dissemination, metabolic support and immune regulation. Findings on tumor-restraining fibroblasts and protective collagen pools challenge indiscriminate stromal depletion. We also assess CAF states as prognostic and predictive biomarkers, their roles in treatment resistance and therapeutic strategies based on depletion, pathway blockade or stromal normalization. Failures of Hedgehog and hyaluronan-directed therapies show that target abundance alone cannot select patients. Clinical translation will require state definitions that integrate function, spatial context and treatment history, supported by reproducible markers, prospective validation and models that retain human stromal diversity.","tags":["CAF","PDAC","肿瘤微环境","基质靶向治疗","生物标志物"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42904475","pmid":"42904475","pmcid":"","doi":"10.1002/mp.70701","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904475/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-23","journal_abbr":"Med Phys","journal_full":"Medical physics","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"软件资源开发与验证（技术性描述，非临床研究）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":29,"score_breakdown":{"clinical":6,"methodology":14,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"pyCERR与癌症基因组云平台构建可重复医学影像AI分析工作流：软件资源开发与验证","title_en":"Artificial intelligence apps for medical image analysis using pyCERR and cancer genomics cloud.","authors":"Apte AP, LoCastro E, Iyer A, Elguindi S, Jiang J, Thor M, Oh JH, Veeraraghavan H et al.","affiliation_highlight":"Department of Medical Physics, Memorial Sloan Kettering Cancer Center, New York, New York, USA.","results":"","authors_conclusion":"该框架有助于端到端放射学图像分析与可重复研究，包括从公共和私有仓库获取数据、AI模型训练与推理，以及数据管理、可视化和影像元数据便捷访问。","ai_note":"摘要称示例应用基于“经临床验证”的模型，但未报告任何分割性能指标、样本量、验证设计或对照；验证主要限于IBSI参考值和单元测试；本文展示平台能力而非临床效用，信息不足，无法判断其临床可推广性。","pico":{"p":"无患者样本；未报告样本量","ic":"pyCERR图像处理环境联合癌症基因组云平台（CGC）的容器化AI工作流；无对照干预"},"reason":"为胸外科/胸部肿瘤影像AI研究提供可重复、容器化的图像处理与云平台工作流参考，尤其涉及肺结节分割和OAR分割，但不直接改变临床判断。","abstract_en":"PURPOSE: To provide a software resource that enables medical researchers and practitioners to develop and apply reproducible, out-of-the-box, AI-based analysis workflows for radiological and radiotherapy data. DEVELOPMENT AND VALIDATION METHODS: The framework comprises two main components: the Python-native computational environment for radiological research (pyCERR) for radiological image processing, and the cancer genomics cloud (CGC), a National Cancer Institute-funded resource that supports cloud-hosted collaborative projects, with tools for managing collaborators and compute-hardware from providers such as Amazon Web Services and Google Cloud Platform. pyCERR is open-source (GNU GPL) and distributed at https://github.com/cerr/pycerr; it provides user-friendly data structures, simplified access to metadata across radiological imaging modalities, and tools for data transformation, AI-based image segmentation, radiomics, dynamic contrast-enhanced MRI analysis, radiotherapy dose-volume histogram (DVH) feature extraction, and normal-tissue complication and tumor-control models. Radiomics features comply with the Image biomarker standardization initiative (IBSI) standards and are validated against published reference values. Unit tests covering data input/output, radiomics, DVH features, and visualization run on every code update. Workflows are containerized for reproducible, identical execution on the CGC and on local hardware. The CGC enables AI inference from radiological images to be combined with other data types such as genomics and proteomics. Our public CGC project (https://cgc.sbgenomics.com/u/sevenbridges/pycerr-radiological-radiotherapy-imageanalysis), accessible with free registration, currently includes apps for organ-at-risk (OAR) and lung-nodule segmentation based on published models trained in-house and clinically validated. These apps can be run interactively from a web browser or programmatically via a REST API with client support for multiple programming languages. Notebooks demonstrating the CGC API and pyCERR capabilities are provided at https://github.com/cerr/pycerr-notebooks. POTENTIAL APPLICATIONS: The framework facilitates end-to-end radiological image analysis and reproducible research, including data access from public and private repositories, training and inference with AI models, and utilities for data management, visualization, and simplified access to image metadata.","tags":["医学影像AI","软件资源","云平台","可重复研究","肺结节分割"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903663","pmid":"42903663","pmcid":"PMC13681299","doi":"10.3389/fimmu.2026.1932718","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903663/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 概念框架（无原始数据）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":28,"score_breakdown":{"clinical":8,"methodology":7,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_err
