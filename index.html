for assessing proportionality should be normal clinical care rather than the label alone. Evidence-supported TOS involving authorized medicinal products, particularly studies corresponding to OECD categories A and B1, should be considered for a risk-proportionate regulatory pathway when the proposed intervention introduces minimal additional risk and burden compared with normal clinical care. Selected OECD B2 studies could potentially qualify where additional evidence and expert assessment demonstrate similarly low incremental risk. The assessment should be performed on a trial-specific basis. Relevant standards of routine care should be defined by the respective medical societies in the field. Ethics committees, supported by physicians experienced in the relevant disease area, should assess incremental risk and burden. Monitoring, oversight and reporting requirements should likewise be risk-proportionate and prospectively justified in the trial protocol. The objective is not deregulation of academic clinical research but risk-proportionate regulation. A risk-adapted framework for academic TOS could strengthen investigator-initiated evidence generation, particularly for questions with limited commercial incentives, and improve the evidence base for optimizing routine clinical care in Europe.","tags":["政策观点","学术临床试验","监管框架","欧盟","治疗优化研究","非原始研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927410","pmid":"42927410","pmcid":"PMC13695538","doi":"10.1159/cde/abvag021","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927410/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Case Rep Dermatol","journal_full":"Case reports in dermatology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（Case Report），无对照、无随访方案预设","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":20,"score_breakdown":{"clinical":6,"methodology":6,"specialty":8,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例","metric":"BP起病时间","val":"38周（第9周期）","stat":"","grounded":true,"checks":[{"num":"38","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"9","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"血清抗BP180抗体","val":"115.4 U/mL","stat":"参考值<9.0 U/mL","grounded":true,"checks":[{"num":"115.4","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"9.0","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"CTCAE分级","val":"grade 3","stat":"CTCAE v5.0","grounded":false,"checks":[{"num":"0","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["0"]},{"group":"单例","metric":"初始激素剂量","val":"泼尼松龙90 mg/day（约1 mg/kg）","stat":"","grounded":true,"checks":[{"num":"90","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"恢复仑伐替尼单药时间","val":"7周后","stat":"","grounded":true,"checks":[{"num":"7","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"腹膜复发时间","val":"30个月","stat":"","grounded":true,"checks":[{"num":"30","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":["0"],"semantic_passed":false,"semantic_audit":[{"group":"单例","metric":"BP起病时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"血清抗BP180抗体","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"CTCAE分级","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"初始激素剂量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"恢复仑伐替尼单药时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"腹膜复发时间","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"帕博利珠单抗联合仑伐替尼治疗期间出现直接免疫荧光阴性的免疫检查点抑制剂相关大疱性类天疱疮：一例病例报告","title_en":"Immune Checkpoint Inhibitor-Related Bullous Pemphigoid with Negative Direct Immunofluorescence during Pembrolizumab Plus Lenvatinib Therapy: A Case Report.","authors":"Seko A, Nagai S, Hino M, Takatsuji N, Shirane T, Iijima M, Hattori Y, Kurahashi T et al.","affiliation_highlight":"Department of Obstetrics and Gynecology, National Hospital Organization Saitama Hospital, Saitama, Japan.","results":"治疗38周（第9周期）出现躯干及四肢广泛紧张性大疱并硬腭糜烂；血清抗BP180抗体115.4 U/mL（参考值<9.0）；皮肤活检示表皮下水疱形成伴嗜酸性粒细胞丰富浸润；直接免疫荧光（DIF）阴性；仍按CTCAE v5.0诊断为3级ICI相关大疱性类天疱疮；泼尼松龙90 mg/日（约1 mg/kg）后临床迅速改善、抗体下降；帕博利珠单抗永久停用，7周后恢复仑伐替尼单药；因手足综合征需减量，未见BP复发。","authors_conclusion":"在接受LP治疗出现紧张性大疱的患者中，即使DIF阴性也应考虑大疱性类天疱疮；对伴黏膜受累的重症病例，选择性停用帕博利珠单抗而继续仑伐替尼单药可能是合理的个体化策略；随着LP治疗在妇科肿瘤中扩大应用，皮肤科参与识别与多学科管理罕见皮肤irAE日益重要。","ai_note":"单例报告，无对照与系统随访，无法评估该处理策略的获益归因（激素、停ICI、停/续TKI效应混杂）；DIF阴性而诊断成立，说明诊断依赖临床+血清学+病理，需排除获得性大疱性表皮松解症等其他表皮下大疱病，摘要未报告排除过程；结论中的“合理个体化策略”属经验外推，随访时长与抗体复查具体数值未给出；与胸部肿瘤的相关性仅来自ICI类药物共性，人群为子宫内膜癌，不涉及胸科结局。","pico":{"p":"53岁日本女性，FIGO IA期子宫内膜样癌，术后辅助紫杉醇-卡铂，30个月后腹膜复发，再挑战后进展并接受仑伐替尼+帕博利珠单抗治疗（n=1）","ic":"仑伐替尼+帕博利珠单抗治疗期间发生皮肤irAE的处理：停用帕博利珠单抗、泼尼松龙90 mg/日（约1 mg/kg）、7周后恢复仑伐替尼单药并逐步减激素；无同期对照"},"reason":"为胸部肿瘤常用的帕博利珠单抗相关罕见皮肤irAE（大疱性类天疱疮）的识别提供单例参照，尤其提示DIF阴性不能排除诊断；并示范“选择性停ICI、保留TKI”的个体化处理思路，可作为免疫治疗毒性管理宣教与病例对照讨论的素材，但不足以改变具体临床决策。","abstract_en":"INTRODUCTION: Bullous pemphigoid (BP) is a rare but clinically significant cutaneous immune-related adverse event (irAE) of immune checkpoint inhibitor (ICI) therapy. It is most often described during treatment of melanoma, lung cancer, and renal cell carcinoma, whereas reports in gynecologic oncology, and specifically during lenvatinib plus pembrolizumab (LP) therapy, remain scarce. CASE PRESENTATION: A 53-year-old Japanese woman with International Federation of Gynecology and Obstetrics (FIGO) stage IA endometrioid carcinoma underwent hysterectomy followed by adjuvant paclitaxel-carboplatin. Peritoneal recurrence occurred 30 months later. After paclitaxel-carboplatin rechallenge and subsequent progression, LP therapy was initiated. At 38 weeks (cycle 9), erythema progressed to widespread tense bullae on the trunk and extremities with hard-palate erosion. Serum anti-BP180 antibody was markedly elevated (115.4 U/mL; reference: <9.0). Skin biopsy showed subepidermal cleft formation with an eosinophil-rich infiltrate. Direct immunofluorescence (DIF) was negative; nevertheless, ICI-related BP (Common Terminology Criteria for Adverse Events [CTCAE] v5.0, grade 3) was diagnosed on the basis of clinical, serological, and histopathological findings. LP therapy was discontinued and prednisolone 90 mg/day (approximately 1 mg/kg) was started, achieving rapid clinical improvement and antibody decline. Pembrolizumab was permanently discontinued, and lenvatinib monotherapy was resumed 7 weeks later under tapering steroids. Dose reduction was required for hand-foot syndrome, but no BP recurrence has been observed. CONCLUSION: BP should be considered in patients who develop tense bullae during LP therapy, even when DIF is negative. In severe cases with mucosal involvement, selective discontinuation of pembrolizumab while continuing lenvatinib monotherapy may represent a reasonable individualized strategy. As LP therapy expands in gynecologic oncology, recognition and multidisciplinary management of rare cutaneous irAEs by dermatologists is increasingly important.","tags":["免疫检查点抑制剂","免疫相关不良事件","大疱性类天疱疮","帕博利珠单抗","仑伐替尼","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42927194","pmid":"42927194","pmcid":"PMC13694847","doi":"10.1016/j.lanepe.2026.101899","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927194/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-26","journal_abbr":"Lancet Reg Health Eur","journal_full":"Lancet Reg Health Eur","tier":"A","if_val":15.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"叙述性综述 · 欧洲孕产妇疫苗系列总结与政策建议","category":"pulm","category_label":"非肿瘤呼吸病","score_total":18,"score_breakdown":{"clinical":2,"methodology":7,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"欧洲下一代孕产妇疫苗：科学进展、监管准备与战略规划（系列综述）","title_en":"The next generation of maternal vaccines: scientific advances, regulatory readiness, and strategic planning in Europe.","authors":"Heath PT, Galiza EP, Salcedo PJ, Karafillakis E, Khalil A, Maertens K, Le Doare K, Jones CE et al.","affiliation_highlight":"Centre for Neonatal and Paediatric Infection and Vaccine Institute, City St George's, University of London, Cranmer Terr…","results":"","authors_conclusion":"Realising this potential will require integrated action across research, regulation, implementation, and communication.","ai_note":"叙述性综述，未报告系统检索、纳入排除标准或证据分级；结论以政策建议为主，非临床疗效证据；摘要无主要终点或定量结果；主题非胸外科/胸部肿瘤，仅RSV等呼吸道病原体预防有边缘关联。","pico":{"p":"","ic":""},"reason":"不直接影响胸外科或胸部肿瘤临床判断；仅可作为RSV等呼吸道病原体孕产妇免疫预防的背景参考，对胸科业务关联极低。","abstract_en":"With the recent approval of maternal RSV vaccines and late-phase trials underway for a GBS vaccine, Europe is entering a new era of maternal immunisation. Yet scientific progress is outpacing pregnancy-specific evidence and preparedness for equitable implementation. Pregnant women are often excluded from early vaccine trials, while national recommendations, surveillance and delivery vary across Europe, even after regulatory authorisation. Without coordinated planning, new maternal vaccines risk reproducing the delays and inequities seen with influenza, pertussis and COVID-19 vaccination. In this Review, we examine scientific advances in the next generation of maternal vaccines, including mRNA, protein conjugate, nanoparticle and combination approaches, and candidates against emerging and other priority pathogens. We discuss barriers to including pregnant women in trials, assess regulatory and pharmacovigilance readiness, and identify health-system and vaccine-confidence risks to equitable rollout. We offer strategic recommendations for Europe's maternal immunisation roadmap, from research investment to policy integration, provider education, and equity-centred planning. Realising this potential will require integrated action across research, regulation, implementation, and communication. This is the final paper in the Series on the future of maternal vaccination in Europe and synthesises its findings into a framework for Europe and beyond.","tags":["孕产妇免疫","RSV疫苗","欧洲","综述","卫生政策"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42923778","pmid":"42923778","pmcid":"PMC11766512","doi":"10.3390/medicina61010012","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923778/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"叙述性综述（非系统评价，无定量合并）","category":"surgery","category_label":"微创与无管化胸外科","score_total":16,"score_breakdown":{"clinical":8,"methodology":6,"specialty":2,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"开放、腹腔镜与机器人肝切除治疗肝细胞癌的角色演变、比较结局与未来展望：一篇叙述性综述","title_en":"Open, laparoscopic, and robotic liver resection for hepatocellular carcinoma: evolving roles, comparative outcomes, and future perspectives.","authors":"Mascherini J, Eid MK, Vanterpool G, Sucandy I","affiliation_highlight":"AdventHealth Tampa, Digestive Health Institute, Tampa, FL, United States.","results":"","authors_conclusion":"现有证据一致提示，在筛选后的患者中，微创入路较开放手术失血更少、术后并发症更少、住院时间更短，同时肿瘤学结局相当；腹腔镜仍是最成熟的微创平台，机器人可能通过更好的灵活性、三维视野与缝合能力在复杂切除中提供技术优势；但现有证据多为回顾性，受选择偏倚与机构经验影响，平台选择应依据肿瘤解剖、肝功能、技术复杂度与中心经验个体化决定。","ai_note":"本文为叙述性综述，未报告检索策略、纳入排除标准、文献数量或任何定量数据，因此“失血更少、并发症更少、住院更短、肿瘤学结局相当”均为定性概括，无法核验效应量与异质性；作者亦自认证据以回顾性为主并存在选择偏倚，故“肿瘤学结局相当”属筛选人群下的弱推论；此外该主题为肝细胞癌肝切除，与胸科业务无直接关联。","pico":{"p":"","ic":"开放肝切除 vs 腹腔镜肝切除 vs 机器人肝切除（叙述性比较，无对照数据）"},"reason":"为肝细胞癌外科平台选择（开放/腹腔镜/机器人）提供叙述性证据框架与场景化决策思路，可作为肝胆对比类研究立题与对照设计的背景参考；对胸部肿瘤临床判断无直接影响。","abstract_en":"Hepatocellular carcinoma remains one of the leading causes of cancer-related mortality worldwide and frequently arises in the setting of chronic liver disease, cirrhosis, and portal hypertension. Liver resection represents a cornerstone of curative-intent treatment, but its role is uniquely influenced by the need to balance oncologic radicality with preservation of functional liver parenchyma. Over the last two decades, minimally invasive liver surgery has progressively expanded from selected laparoscopic minor resections to complex laparoscopic and robotic hepatectomies, challenging the historical dominance of open surgery. This narrative review critically examines the evolving roles of open, laparoscopic, and robotic liver resection for hepatocellular carcinoma, emphasizing patient selection, technical considerations, scenario-based platform choice, and comparative outcomes. Particular attention is given to hepatocellular carcinoma-specific challenges, including impaired liver function, clinically significant portal hypertension, future liver remnant adequacy, recurrence risk, and the need for parenchymal-sparing strategies. The review also discusses distinct clinical scenarios, including small solitary tumors, posterosuperior lesions, central or deeply located tumors, multifocal disease, and recurrent HCC. Current evidence consistently suggests that minimally invasive approaches are associated with reduced blood loss, fewer postoperative complications, and shorter hospital stay compared with open surgery, while maintaining comparable oncologic outcomes in selected patients. Laparoscopy remains the most established minimally invasive platform, whereas robotics may offer technical advantages in complex resections through improved dexterity, three-dimensional visualization, and enhanced suturing capability. However, available evidence remains largely retrospective and influenced by selection bias and institutional expertise. Platform selection should therefore be individualized according to tumor anatomy, liver function, technical complexity, and center experience, with the goal of maximizing oncologic benefit while minimizing functional liver loss.","tags":["肝细胞癌","肝切除","微创手术","机器人手术","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923011","pmid":"42923011","pmcid":"PMC4734373","doi":"10.1002/pros.23111","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923011/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"生物信息学再分析＋体外功能验证 · 诊断标志物探索性研究（非胸科）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":15,"score_breakdown":{"clinical":2,"methodology":12,"specialty":1,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"基于多组学与机器学习的衰老相关基因筛选：GSTP1 被提为前列腺癌诊断候选标志物并伴体外功能验证","title_en":"GSTP1 as a senescence-associated diagnostic candidate in prostate cancer: integrative bioinformatics and functional validation.","authors":"Li H, Lu S, Wang H, Yu D, Zhang Z, Liu S, Zhong M, Xiao H et al.","affiliation_highlight":"Department of Urology, The Third Affiliated Hospital, Sun Yat-sen University, Guangzhou, China.","results":"","authors_conclusion":"研究确认 GSTP1 是一个衰老相关应激反应基因，为前列腺癌发病机制提供新视角，并显示针对衰老与免疫关联的治疗策略前景；该研究为在精准肿瘤学中利用衰老生物标志物提供了系统性框架，并突出 GSTP1 作为 PCa 临床转化 promising candidate 的价值。","ai_note":"摘要未报告任何效应量、AUC、敏感性/特异性或样本量，“high predictive performance”“robust diagnostic model”仅为定性表述，诊断价值无法评估；亦未见外部独立验证队列。功能实验方向与“诊断标志物”定位存在张力：GSTP1 敲低后增殖、迁移、侵袭增强且衰老与DNA损伤受抑，提示其呈抑癌样表型，但作者仍将其定位为诊断候选并强调“促进衰老而抑制恶性进展”，结论口径偏乐观。主题为前列腺癌且无任何胸科病种，category 归入 ai_digital 仅为方法学归类，与胸部肿瘤临床无关。","pico":{"p":"前列腺癌（PCa）转录组数据，整合4个GEO数据集（各数据集样本量摘要未报告）","ic":"多组学整合（转录组谱＋衰老相关基因筛选＋机器学习）构建诊断模型，并以GSTP1敲低的体外功能实验进行验证；具体对照与实验体系摘要未详"},"reason":"本研究对胸科临床判断无直接影响；其可借鉴之处仅限于方法学层面——GEO多队列整合＋机器学习筛选＋敲低功能验证的标志物发现流程，可作为胸部肿瘤诊断标志物研究的流程对照，但其统计报告完整度不足，参考价值有限。","abstract_en":"INTRODUCTION: Prostate cancer (PCa) is a common malignancy of the male genitourinary system with high metastatic potential and poor clinical outcomes, for which effective biomarkers and therapeutic targets remain limited. METHODS: This study employed a multi-omics approach, integrating transcriptome profiles, age-related gene screening, and machine learning techniques, to analyze four GEO datasets, in order to identify key diagnostic biomarkers for prostate cancer (PCa). RESULTS: Differentially expressed aging-related genes were identified, with enrichment analyses revealing significant involvement in PCa. Using machine learning algorithms, a robust diagnostic model centered on GSTP1 was developed, demonstrating high predictive performance. GSTP1 depletion drove multiple oncogenic phenotypes, including enhanced proliferation, migration, invasion, and the inhibition of cellular aging and DNA damage, suggesting that GSTP1 may promote cellular senescence while restraining malignant progression. Furthermore, its expression correlated with distinct immunocyte profiles, highlighting a role in shaping the PCa immune landscape. DISCUSSION: Our findings confirm that GSTP1 functions as an aging-associated stress response gene, offering new perspectives on prostate cancer pathogenesis and showing promise for advancing therapeutic strategies that target both aging and immune associations. This study provides a comprehensive framework for leveraging aging biomarkers in precision oncology and highlights GSTP1 as a promising candidate for clinical translation in PCa management.","tags":["前列腺癌","生物信息学","机器学习","GSTP1","细胞衰老","非胸科文献"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42921021","pmid":"42921021","pmcid":"PMC11163786","doi":"10.1186/s12885-024-12463-8","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921021/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"非系统性叙述性综述（narrative review）· 方法学与证据框架述评","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":14,"score_breakdown":{"clinical":4,"methodology":7,"specialty":3,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"液体活检在胰腺导管腺癌中的应用：从诊断准确性到临床效用的叙述性综述（强调按预期用途分层评价，未做系统检索与偏倚评估）","title_en":"Liquid biopsy in pancreatic ductal adenocarcinoma from diagnostic accuracy to clinical utility.","authors":"Kossenas K, Garmpis N, Karountzos N, Damaskos C","affiliation_highlight":"Laiko General Hospital, Athens, Greece.","results":"","authors_conclusion":"临床转化需要可重复的检测方法，以及生物标志物指导的决策能够改善结局的证据；液体活检应在明确的临床路径内、与影像、病理及现有分子检测并行评估。","ai_note":"本篇为非系统性叙述性综述：作者自陈证据选择为目的性且非穷尽，且未进行正式偏倚风险或证据确定性分级，因此文中对各类标志物（ctDNA、CTC、EV、循环RNA、蛋白、多模态与AI模型）的比较与排序均不具系统性证据强度。作者明确指出，病例对照队列中的高判别力不能外推至无症状人群或临床获益，不能用已发表的AUC对标志物类别做可靠排序；但这类限定性表述本身也未配套定量合成。术后ctDNA检测与纵向变化“提供预后信息但不单独足以支持改变治疗”系作者判断而非本文新数据。","pico":{"p":"","ic":""},"reason":"直接临床判断影响限于胰腺癌领域，对胸科决策影响有限；但其“按预期用途（筛查/高危监测/诊断/分子分型/疗效监测/术后复发）分层评价”的框架与“术后ctDNA阳性本身不足以改变治疗、需与影像/病理/CA19-9及预设阈值对照并做外部验证与危害-成本评估”的判断，可直接迁移用于胸部肿瘤液体活检与MRD研究的证据解读与试验设计对照基线。","abstract_en":"Pancreatic ductal adenocarcinoma (PDAC) is often diagnosed after the opportunity for curative treatment has passed. Blood-based biomarkers offer opportunities for earlier detection and serial molecular assessment, but their value depends on the intended clinical use. This nonsystematic narrative review critically examines circulating tumor DNA (ctDNA), circulating tumor cells, extracellular vesicles, circulating RNAs, proteins and multimodal panels, including models developed using artificial intelligence. We distinguish population screening, high-risk surveillance, diagnostic evaluation, molecular profiling, treatment monitoring and postoperative recurrence assessment. High discrimination in selected case-control cohorts does not establish performance in asymptomatic populations or clinical benefit. Differences in disease stage, comparator groups, sample handling and validation design preclude reliable ranking of biomarker classes using published area-under-the-curve values. ctDNA has a more established role in selected molecular-profiling situations than in early detection; postoperative detection and longitudinal changes provide prognostic information, but do not by themselves justify treatment modification. Multimodal assays require comparison with clinical assessment and CA19-9 at prespecified thresholds, external validation, calibration and evaluation of downstream harms and costs. This review presents an intended-use framework and a summary of representative prospective studies. Limitations include purposive, non-exhaustive evidence selection and the absence of formal risk-of-bias or certainty grading. Clinical translation requires reproducible assays and evidence that biomarker-informed decisions improve outcomes. Liquid biopsy should therefore be evaluated within defined clinical pathways alongside imaging, pathology and established molecular testing.","tags":["液体活检","胰腺导管腺癌","ctDNA","叙述性综述","生物标志物","预期用途框架"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}}]};

function journalUniverse(items){
  const map=new Map();
  items.forEach(p=>{const name=journalName(p);map.set(name,(map.get(name)||0)+1)});
  return [...map].map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
}
function positions(items,journals){
  const map={},scores=items.map(p=>Number(p.score_total)).filter(Number.isFinite);
  const high=scores.length?Math.max(...scores):1,low=scores.length?Math.min(...scores):0,span=high-low||1;
  const sectorSize=360/Math.max(journals.length,1);
  journals.forEach((journal,sector)=>{
    const group=items.filter(p=>journalName(p)===journal.name).sort((a,b)=>(Number(b.score_total)||0)-(Number(a.score_total)||0)||String(a.id||'').localeCompare(String(b.id||'')));
    group.forEach((p,i)=>{
      const offset=(i-(group.length-1)/2)*Math.min(5,sectorSize*.16);
      const angle=(-90+(sector+.5)*sectorSize+offset)*Math.PI/180;
      const score=Number(p.score_total);
      const base=Number.isFinite(score)?20+(high-score)/span*18:40;
      const radius=Math.max(19,Math.min(41,base+((i%3)-1)*2.2));
      map[p.id]={left:50+Math.cos(angle)*radius,top:50+Math.sin(angle)*radius};
    });
  });
  return map;
}
function point(angle,radius){
  const rad=angle*Math.PI/180;
  return {x:300+Math.cos(rad)*radius,y:300+Math.sin(rad)*radius};
}
function sectorMarkup(journal,index,total){
  const active=state.journal===journal.name;
  const attrs=`class="journal-sector ${active?'active':''}" data-journal="${esc(journal.name)}" tabindex="0" role="button" aria-pressed="${active}" aria-label="筛选刊源：${esc(journal.name)}"`;
  const title=`<title>${esc(journal.name)} · ${journal.count} 篇</title>`;
  if(total===1)return `<circle cx="300" cy="300" r="284" ${attrs}>${title}</circle>`;
  const wedge=360/total,start=-90+index*wedge,end=start+wedge,a=point(start,284),b=point(end,284);
  const d=`M300 300L${a.x.toFixed(3)} ${a.y.toFixed(3)}A284 284 0 ${wedge>180?1:0} 1 ${b.x.toFixed(3)} ${b.y.toFixed(3)}Z`;
  return `<path d="${d}" ${attrs}>${title}</path>`;
}
function renderCategoryFilters(base){
  const eligible=base.filter(p=>tierOk(p)&&journalOk(p));
  $('#category-filters').innerHTML=CATEGORIES.map(c=>{
    const count=c.id==='all'?eligible.length:eligible.filter(p=>p.category===c.id).length;
    return `<button class="filter-btn ${state.category===c.id?'active':''}" data-category="${c.id}" title="${esc(c.label)}" aria-pressed="${state.category===c.id}"><span>${esc(c.label)}</span><em>${count}</em></button>`;
  }).join('');
}
function renderTierFilters(base){
  $('#tier-filters').innerHTML=TIERS.map(tier=>{
    const active=state.tiers.has(tier),count=base.filter(p=>String(p.tier||'').toUpperCase()===tier).length;
    return `<button class="tier-chip ${active?'active':''}" data-tier="${tier}" aria-pressed="${active}" title="切换 ${tier} 档">${tier}<small> · ${count}</small></button>`;
  }).join('');
}
function renderWindow(){
  $('#window-range').value=String(state.days);
  $('#window-value').textContent=`${state.days} 天`;
  if(!ANCHOR){$('#window-label').textContent=`数据窗口 — · ${state.days} 天`;return}
  const start=isoDate(dateMs(ANCHOR)-(state.days-1)*DAY_MS);
  $('#window-label').textContent=`数据窗口 ${monthDay(start)} ~ ${monthDay(ANCHOR)} · ${state.days} 天`;
}
function renderQueue(list){
  $('#filter-counter').textContent=`${String(list.length).padStart(2,'0')} / ${PAPERS.length}`;
  if(!list.length){$('#queue-list').innerHTML='<li class="queue-empty">没有匹配信号。<br>清除条件或调整数据窗口后再扫。</li>';return}
  $('#queue-list').innerHTML=list.map((p,i)=>`<li class="queue-item ${state.read.has(p.id)?'read':''}">
    <button class="queue-btn ${state.selected===p.id?'selected':''}" data-select="${esc(p.id)}" aria-label="锁定：${esc(p.title_zh||p.title_en||'—')}">
      <span class="queue-index">${state.read.has(p.id)?'✓':String(i+1).padStart(2,'0')}</span>
      <span class="queue-text"><strong>${esc(p.title_zh||p.title_en||'—')}</strong><small>${esc(journalName(p))} · ${esc(p.category_label||categoryOf(p.category).short)}</small></span>
      <span class="queue-score">${esc(show(p.score_total))}</span>
    </button></li>`).join('');
}
function renderJournalLegend(journals){
  $('#journal-selection').textContent=`刊源：${state.journal||'全部'}`;
  $('#journal-selection').title=state.journal||'全部刊源';
  $('#journal-clear').disabled=!state.journal;
  $('#journal-legend').innerHTML=journals.map(j=>`<button class="journal-btn ${state.journal===j.name?'active':''}" data-journal="${esc(j.name)}" title="${esc(j.name)}" aria-pressed="${state.journal===j.name}">${esc(j.name)}<em>${j.count}</em></button>`).join('')||'<span class="filter-label">当前窗口无刊源</span>';
}
function renderDesignLegend(list){
  const count=kind=>list.filter(p=>designOf(p)===kind).length;
  $('#design-legend').innerHTML=`<span><i class="legend-shape rct"></i>RCT · ${count('rct')}</span><span><i class="legend-shape cohort"></i>队列 · ${count('cohort')}</span><span><i class="legend-shape"></i>待评定 · ${count('pending')}</span><span>点按信号锁定 · 点按扇区筛刊</span>`;
}
function renderScope(list,base,journals){
  const visible=new Set(list.map(p=>p.id)),POSITIONS=positions(base,journals);
  $('#journal-sectors').innerHTML=journals.map((j,i)=>sectorMarkup(j,i,journals.length)).join('');
  $('#blips').innerHTML=base.map(p=>{
    const pos=POSITIONS[p.id]||{left:50,top:50};
    const cls=[designOf(p),state.selected===p.id&&visible.has(p.id)?'selected':'',state.read.has(p.id)?'read':'',visible.has(p.id)?'':'dim'].join(' ');
    return `<button class="blip ${cls}" style="left:${pos.left.toFixed(2)}%;top:${pos.top.toFixed(2)}%" data-select="${esc(p.id)}" title="${esc(journalName(p))} · ${esc(show(p.score_total))}分 · ${esc(p.title_zh||p.title_en||'—')}" aria-label="${esc(p.title_zh||p.title_en||'—')}"></button>`;
  }).join('');
  const sectorSize=360/Math.max(journals.length,1);
  $('#scope-labels').innerHTML=journals.map((j,i)=>{
    if(journals.length>8&&j.count<2&&state.journal!==j.name)return '';
    const a=(-90+(i+.5)*sectorSize)*Math.PI/180,r=45.5,name=j.name.length>13?j.name.slice(0,12)+'…':j.name;
    return `<span class="scope-label" title="${esc(j.name)}" style="left:${50+Math.cos(a)*r}%;top:${50+Math.sin(a)*r}%">${esc(name)}</span>`;
  }).join('');
  $('#scope-empty').classList.toggle('show',!list.length);
  $('#scope-empty').innerHTML=!base.length?'当前数据窗口内无论文。<br>请调整滑杆或刊源档位。':'当前条件下没有信号。<br>试试清除检索、刊源或切换专科。';
  $('#hub-count').textContent=list.length;
}
function statusOf(p){
  const kind=String(p.status?.kind||'');
  if(kind==='retracted')return {kind,label:'🚫 已撤稿',cls:'retracted'};
  if(kind==='concern')return {kind,label:'⚠ 关注声明',cls:'concern'};
  if(kind==='corrected')return {kind,label:'📄 更正启事',cls:'corrected'};
  if(kind==='ok')return {kind,label:'未见异常标记',cls:''};
  return {kind,label:'出版状态 —',cls:'unknown'};
}
function noticeMarkup(p,status){
  const note=String(p.status?.note||'').trim();
  if(!['retracted','concern','corrected'].includes(status.kind)&&!note)return '';
  const ref=p.status?.notice_ref||p.status?.notice_pmid||'';
  const link=safeUrl(p.notice_url);
  const label=status.kind==='retracted'?'🚫 已撤稿':status.kind==='concern'?'⚠ 关注声明':status.kind==='corrected'?'📄 更正启事':'题录状态说明';
  return `<div class="notice-banner ${status.cls||'neutral'}"><strong>${label}</strong>${note?`<br>${esc(note)}`:''}${ref?`<br>关联：${esc(ref)}`:''}${link?`<br><a href="${esc(link)}" target="_blank" rel="noopener">查看出版方声明 ↗</a>`:''}</div>`;
}
function issueOf(p){
  const volume=show(p.volume),issue=show(p.issue);
  if(volume!=='—'||issue!=='—')return `${volume}${issue!=='—'?`(${issue})`:''}`;
  return show(p.journal_issue||p.issue_info||p.volume_issue);
}
function interpretationMarkup(p,degraded){
  if(degraded)return '<div class="interpretation-paused"><strong>解读暂停</strong><br>当前仅展示题录与原始摘要，不展示生成解读。</div>';
  const blocks=[];
  if(hasValue(p.authors_conclusion))blocks.push(`<p class="honesty-note"><strong>作者结论</strong><br>${esc(p.authors_conclusion)}</p>`);
  if(hasValue(p.ai_note))blocks.push(`<p class="honesty-note"><strong>生成解读 · 未经人审</strong><br>${esc(p.ai_note)}</p>`);
  if(!blocks.length)blocks.push('<p class="honesty-note">作者结论与疑点未生成，本版留白不硬写。评分只用于信号排序，不代表临床推荐。</p>');
  return blocks.join('');
}
function renderDetail(list){
  const p=PAPERS.find(item=>item.id===state.selected);
  if(!p||!list.some(item=>item.id===p.id)){
    $('#detail').innerHTML='<div class="detail-empty">信号已移出当前视野。<br>清除筛选或调整数据窗口后可继续查看详情。</div>';return;
  }
  const index=list.findIndex(item=>item.id===p.id),marked=state.read.has(p.id),status=statusOf(p),degraded=p.publish_state==='degraded';
  const paperUrl=safeUrl(p.url),trialUrl=safeUrl(p.trial_url),doi=String(p.doi||'').trim();
  const score=Number(p.score_total),hasScore=hasValue(p.score_total)&&Number.isFinite(score);
  const trial=p.nct_id?(trialUrl?`<a class="action-btn wide" href="${esc(trialUrl)}" target="_blank" rel="noopener">查看 ${esc(p.nct_id)} 试验记录 ↗</a>`:`<span class="action-btn wide">试验号 ${esc(p.nct_id)} · 链接 —</span>`):'';
  const paperLink=paperUrl?`<a class="action-btn primary" href="${esc(paperUrl)}" target="_blank" rel="noopener">打开题录 ↗</a>`:'<span class="action-btn primary">题录链接 —</span>';
  const doiLink=doi?`<a class="action-btn" href="https://doi.org/${encodeURIComponent(doi)}" target="_blank" rel="noopener">DOI 原文 ↗</a>`:'<span class="action-btn">DOI —</span>';
  const scoreTrack=hasScore?`<div class="score-track" aria-label="评分 ${score} 分"><i style="width:${Math.max(0,Math.min(100,score))}%"></i></div>`:'';
  const abstract=p.abstract_en||p.results||'';
  $('#detail').innerHTML=`<div class="detail-inner ${status.kind==='retracted'?'is-retracted':''}">
    <div class="detail-top"><span class="lock-id">SIGNAL LOCK / ${String(index+1).padStart(2,'0')}</span><span class="status-pill ${['retracted','concern','corrected'].includes(status.kind)?'has-icon':''} ${status.cls}">${status.label}</span></div>
    ${noticeMarkup(p,status)}
    <div class="detail-journal"><div><div class="journal-name">${esc(p.journal_full||p.journal_abbr||'—')}</div><div class="journal-meta">${esc(journalName(p))} · ${esc(show(p.pub_date))} · ${esc(show(p.tier))} 档</div></div><div class="score-box"><b>${esc(show(p.score_total))}</b><small>评分 · ${esc(show(p.score_source))}</small></div></div>
    ${scoreTrack}
    <h2 class="detail-title">${esc(p.title_zh||p.title_en||'—')}</h2>
    <div class="badges"><span class="badge accent">${esc(p.category_label||categoryOf(p.category).label)}</span><span class="badge">${esc(show(p.study_type))}</span>${p.nct_id?`<span class="badge">${esc(p.nct_id)}</span>`:''}${degraded?'<span class="badge paused">解读暂停</span>':''}</div>
    <div class="meta-grid">
      <div class="meta-cell"><small>PMID</small><b>${esc(show(p.pmid))}</b></div><div class="meta-cell"><small>出版状态</small><b>${esc(status.label)}</b></div>
      <div class="meta-cell"><small>影响因子 · 源值</small><b>${esc(show(p.if_val || null))}</b></div><div class="meta-cell"><small>分区 · 源值</small><b>${esc(show(p.zone))}</b></div><div class="meta-cell"><small>预警状态</small><b>${p.warned ? '⚠ 在预警名单' : '正常'}</b></div>
      <div class="meta-cell"><small>雷达日期</small><b>${esc(show(p.briefing_date))}</b></div><div class="meta-cell"><small>卷 / 期</small><b>${esc(issueOf(p))}</b></div>
      <div class="meta-cell"><small>评分口径</small><b>${esc(show(p.score_source))}</b></div><div class="meta-cell"><small>精选状态</small><b>${p.curated?'已入选':'未入选 · 不凑数'}</b></div>
    </div>
    <div class="interpretation">
      <div class="excerpt-label"><b>摘要导读</b><span>原始字段 · 非全文</span></div>
      <p class="excerpt">${esc(abstract||'摘要摘录暂缺，请通过题录链接查阅原文。')}</p>
      ${interpretationMarkup(p,degraded)}
    </div>
    <div class="detail-actions">${paperLink}${doiLink}${trial}<button class="action-btn wide ${marked?'marked':''}" id="mark-read">${marked?'✓ 已扫 · 点击撤销':'标记本篇已扫'}</button></div>
    <div class="detail-nav"><button class="nav-btn" id="prev-btn">← 上一信号</button><span class="nav-position">${index+1} / ${list.length}</span><button class="nav-btn" id="next-btn">下一信号 →</button></div>
  </div>`;
  $('#mark-read')?.addEventListener('click',()=>{state.read.has(p.id)?state.read.delete(p.id):state.read.add(p.id);render()});
  $('#prev-btn')?.addEventListener('click',()=>step(-1));
  $('#next-btn')?.addEventListener('click',()=>step(1));
}
function renderFunnel(){
  const f=SITE_DATA.funnel||{};
  $('#funnel').innerHTML=[['初抓',f.fetched],['刊源匹配',f.journal_matched],['简报入库',f.final],['规则精选',f.curated]].map(([label,value])=>`<div class="funnel-step"><b>${esc(show(value))}</b>${label}${label==='规则精选'&&value===0?' · 空缺':''}</div>`).join('');
}
function renderHeader(){
  $('#scan-date').textContent=ANCHOR?ANCHOR.replaceAll('-','.')+' / ANCHOR':'— / NO DATA';
  const generated=String(SITE_DATA.generated_at||SITE_DATA.updated_at||'');
  $('#scan-time').textContent=`${generated?generated.slice(0,16):'生成时间 —'} · 状态分项标注`;
}
function render(){
  const base=windowPapers(),tierBase=base.filter(tierOk),journals=journalUniverse(tierBase),list=filtered();
  if(list.length&&!list.some(p=>p.id===state.selected))state.selected=list[0].id;
  renderWindow();renderCategoryFilters(base);renderTierFilters(base);renderQueue(list);renderJournalLegend(journals);renderDesignLegend(list);renderScope(list,tierBase,journals);renderDetail(list);
  const readCount=PAPERS.filter(p=>state.read.has(p.id)).length;
  $('#read-count').textContent=`${String(readCount).padStart(2,'0')} / ${PAPERS.length}`;
  document.querySelectorAll('[data-quick]').forEach(btn=>btn.classList.toggle('active',btn.dataset.quick===state.quick));
}
function selectPaper(id,scroll=false){
  if(!PAPERS.some(p=>p.id===id))return;
  state.selected=id;render();
  if(scroll&&matchMedia('(max-width:900px)').matches)document.querySelector('.detail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function step(direction){
  const list=filtered();if(!list.length)return;
  const index=list.findIndex(p=>p.id===state.selected);
  state.selected=list[(index+direction+list.length)%list.length].id;render();
}
function toggleJournal(name){
  state.journal=state.journal===name?null:name;render();
}
document.addEventListener('click',event=>{
  const select=event.target.closest('[data-select]');
  if(select){selectPaper(select.dataset.select,true);return}
  const category=event.target.closest('[data-category]');
  if(category){state.category=category.dataset.category;render();return}
  const quick=event.target.closest('[data-quick]');
  if(quick){state.quick=quick.dataset.quick;render();return}
  const tier=event.target.closest('[data-tier]');
  if(tier){const name=tier.dataset.tier;state.tiers.has(name)?state.tiers.delete(name):state.tiers.add(name);render();return}
  const journal=event.target.closest('[data-journal]');
  if(journal){toggleJournal(journal.dataset.journal);return}
  if(event.target.closest('#journal-clear')){state.journal=null;render();return}
});
$('#window-range').addEventListener('input',event=>{state.days=Number(event.target.value);render()});
$('#search').addEventListener('input',event=>{state.query=event.target.value;render()});
$('#theme-btn').addEventListener('click',()=>{
  const dark=document.documentElement.classList.toggle('dark');
  $('#theme-btn').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');
  $('#theme-icon').innerHTML=dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/>';
});
document.addEventListener('keydown',event=>{
  if(event.key==='/'&&document.activeElement!==$('#search')){event.preventDefault();$('#search').focus()}
  if(event.key==='Escape'){state.query='';state.category='all';state.quick='all';state.journal=null;state.tiers=new Set(TIERS);$('#search').value='';render();$('#search').blur()}
  if((event.key==='Enter'||event.key===' ')&&document.activeElement?.classList.contains('journal-sector')){event.preventDefault();toggleJournal(document.activeElement.dataset.journal);return}
  if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    if(event.key==='ArrowLeft')step(-1);if(event.key==='ArrowRight')step(1);
  }
});
async function loadRollingPapers(){
  try{
    const response=await fetch('data/radar_latest.json');
    if(!response.ok)throw new Error('rolling window unavailable');
    const payload=await response.json(),latest=Array.isArray(payload)?payload:payload?.papers;
    if(!Array.isArray(latest))throw new Error('rolling window schema mismatch');
    PAPERS=mergePapers(latest);ANCHOR=findAnchor(PAPERS);renderHeader();render();
  }catch(error){
    console.info('滚动窗数据不可用，已静默降级为注入数据。');
  }
}
ANCHOR=findAnchor(PAPERS);
renderHeader();renderFunnel();render();
loadRollingPapers();
</script>
