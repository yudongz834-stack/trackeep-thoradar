on_highlight":"Department of Ophthalmology, The Second Affiliated Hospital of Fujian Medical University, Quanzhou, Fujian, China.","results":"PURPOSE: To investigate genetically supported molecular factors associated with uveitis and to evaluate the clinical, transcriptomic, and retinal relevance of intercellular adhesion molecule 5 (ICAM-5) across major immun…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: To investigate genetically supported molecular factors associated with uveitis and to evaluate the clinical, transcriptomic, and retinal relevance of intercellular adhesion molecule 5 (ICAM-5) across major immune-mediated non-infectious uveitis subtypes. METHODS: Two-sample Mendelian randomization (MR) was conducted using eQTLGen eQTL data and two independent pQTL resources (Icelandic SomaScan and FinnGen R10), with uveitis GWAS summary statistics as the outcome. ICAM5 was evaluated using complementary MR estimators, sensitivity analyses, reverse MR, and Bayesian colocalization. Plasma ICAM-5 concentrations were measured by ELISA in 90 patients with active non-infectious uveitis (30 each with Vogt-Koyanagi-Harada disease, Behçet's disease-associated uveitis, and HLA-B27-associated acute anterior uveitis) and 40 healthy controls using age- and sex-adjusted models. ICAM5 expression was further examined in the peripheral-blood transcriptomic dataset GSE194060, whereas retinal Icam5 expression and cellular distribution were evaluated using experimental autoimmune uveitis retinal single-cell RNA-sequencing data and GSE132229. RESULTS: Genetically predicted higher ICAM5 expression and ICAM-5 protein levels were associated with increased uveitis susceptibility in the eQTLGen dataset (OR = 2.46, 95% CI 1.48-4.11, P = 5.69 × 10-4; nSNP =8), the Icelandic SomaScan cis-pQTL analysis (OR = 1.27, 95% CI 1.11-1.46, P = 5.30 × 10-4; nSNP =89), and the FinnGen R10 cis-pQTL analysis (OR = 1.21, 95% CI 1.07-1.38, P = 3.13 × 10-³; nSNP =4). Sensitivity analyses showed no significant heterogeneity or horizontal pleiotropy, and reverse MR provided no evidence of an association from uveitis liability to ICAM-5 levels. Plasma ICAM-5 concentrations were higher in all three uveitis subgroups than in healthy controls and remained elevated after age and sex adjustment, with the greatest increase in Vogt-Koyanagi-Harada disease. In the GSE194060 peripheral-blood transcriptomic dataset, ICAM5 expression was higher in the uveitis group. Analysis of the retinal single-cell RNA-sequencing data showed that Icam5 was predominantly detected in neuronal populations. CONCLUSION: Multi-omics MR, clinical protein quantification, transcriptomic analysis, and retinal single-cell profiling provide convergent evidence linking ICAM-5 to immune-mediated non-infectious uveitis. These findings support ICAM-5 as a genetically supported candidate mediator and circulating biomarker.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903166","pmid":"42903166","pmcid":"PMC7212357","doi":"10.3389/fimmu.2020.00676","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903166/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"TREM2+ macrophages mediate anticancer therapy-induced immune evasion in lung adenocarcinoma via the CCL5/CCL22-Treg axis.","title_en":"TREM2+ macrophages mediate anticancer therapy-induced immune evasion in lung adenocarcinoma via the CCL5/CCL22-Treg axis.","authors":"Kim CY, Cha YJ, Park MK, Chang YS","affiliation_highlight":"Department of Internal Medicine, Yonsei University College of Medicine, Seoul, Republic of Korea.","results":"INTRODUCTION: Osimertinib and cisplatin are widely used as standard treatments for non-small cell lung cancer (NSCLC); however, their effects on tumor microenvironment remodeling remain poorly understood. This study inve…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Osimertinib and cisplatin are widely used as standard treatments for non-small cell lung cancer (NSCLC); however, their effects on tumor microenvironment remodeling remain poorly understood. This study investigated whether TREM2-positive tumor-associated macrophages (TAMs) promote immune evasion through the CCL5/CCL22-CCR5/CCR4-Treg axis under anticancer treatment. METHODS: The spatial and quantitative correlations between TREM2+ and FOXP3+ cells were assessed using NSCLC patient-derived single-cell RNA sequencing (scRNA-seq) datasets, human lung adenocarcinoma tissue microarrays, and cisplatin-treated mouse lung cancer models. Mediators linking TREM2+ and FOXP3+ cells were identified by cell-cell communication analysis using CellChat and gene expression profiling of THP-1-derived macrophages treated with osimertinib or cisplatin, with validation in bone marrow-derived macrophages. RESULTS: scRNA-seq dataset analysis showed significantly enriched TREM2+ and FOXP3+ cells in lung adenocarcinoma tissues compared with adjacent normal lung, with a significant positive correlation at the aggregated single-cell level (Spearman's rho = 0.7323, P < 0.001). CCL5 and CCL22 were identified as key mediators linking TREM2+ TAMs and FOXP3+ Tregs and were markedly induced by treatment but suppressed by TREM2 knockdown or pharmacologic inhibition. TREM2 overexpression further enhanced their induction. Mechanistically, CCL22 induction was broadly dependent on SYK, Src, AKT, NF-κB, or STAT3 signaling pathways, whereas CCL5 upregulation depended on Src, NF-κB, and STAT3, with SYK involvement varying by cell type. In the orthotopic Lewis lung carcinoma (LLC) model, Trem2 inhibition reduced Treg infiltration and mitigated chemotherapy-associated immune evasion. CONCLUSION: These findings indicate that TREM2+ TAMs drive CCL5/CCL22-mediated Treg recruitment and support targeting TREM2 to enhance therapeutic efficacy of standard NSCLC treatments.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901987","pmid":"42901987","pmcid":"9392466","doi":"10.1038/s41586-022-04434-5","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901987/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-23","journal_abbr":"Nat Genet","journal_full":"NATURE GENETICS","tier":"A","if_val":25.5,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The landscape of gene loss and missense variation across the mammalian tree informs on gene essentiality.","title_en":"The landscape of gene loss and missense variation across the mammalian tree informs on gene essentiality.","authors":"Liao C, Ye R, Ivankovic F, Fu JM, Walters R, Lowther C, Valkanas E, Churchhouse C et al.","affiliation_highlight":"Analytic and Translational Genetics Unit, Department of Medicine, Massachusetts General Hospital, Boston, MA, USA.","results":"Patterns of gene and sequence preservation across species provide insight into gene essentiality under natural selection. Here we developed two interspecies constraint metrics across 462 mammalian species: Gene Identity …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Patterns of gene and sequence preservation across species provide insight into gene essentiality under natural selection. Here we developed two interspecies constraint metrics across 462 mammalian species: Gene Identity Score of Mammalian Orthologs (GISMO), which quantifies gene loss weighted by evolutionary distance to humans, and GISMO-mis, which measures missense constraint using the ratio of missense to synonymous variation across mammals. Both metrics are strongly correlated with human loss of function, missense and dosage constraint derived from large-scale sequencing studies, yet are largely independent of coding sequence length. GISMO and GISMO-mis identify essential genes missed by existing human-only metrics, particularly short genes. Genes in the most constrained deciles are enriched for rare variant associations in disorders linked to reduced fecundity, including schizophrenia, autism and neurodevelopmental disorders, and show strong enrichment for common variant heritability. These deciles also exhibit reduced copy number variation, consistent with dosage sensitivity. In addition, GISMO improves prioritization of recessive disease genes and captures signatures of homozygous selection across the mammalian tree. Taken together, GISMO and GISMO-mis leverage deep mammalian evolution to provide complementary, length-robust measures of gene essentiality that strengthen disease-gene prioritization and illuminate the selective forces shaping human biology.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42904835","pmid":"42904835","pmcid":"PMC7714649","doi":"10.2196/18759","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904835/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-23","journal_abbr":"Psychooncology","journal_full":"PSYCHO-ONCOLOGY","tier":"A","if_val":3.9,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Co-Designing the iCanBlend Model: A Blended Psychological Therapy Intervention for Treating Anxiety and Depression in the Context of Cancer.","title_en":"Co-Designing the iCanBlend Model: A Blended Psychological Therapy Intervention for Treating Anxiety and Depression in the Context of Cancer.","authors":"Nunes-Zlotkowski KF, Shepherd H, Beatty L, Butow P, Shaw J","affiliation_highlight":"Psycho-Oncology Co-Operative Research Group (PoCoG), School of Psychology, The University of Sydney, Sydney, Australia.","results":"BACKGROUND: Treatment uptake for depression and anxiety in psycho-oncology is low. Blended psychological therapy (BT), which combines self-guided digital content with clinician-delivered sessions, may improve treatment a…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Treatment uptake for depression and anxiety in psycho-oncology is low. Blended psychological therapy (BT), which combines self-guided digital content with clinician-delivered sessions, may improve treatment access and engagement. In Australia, no BT program exists in routine cancer care. OBJECTIVE: To co-design a BT intervention clinically appropriate for anxiety/depression treatment in cancer patients and investigate its potential acceptability and feasibility for implementation in psycho-oncology in Australia. METHOD: Qualitative, co-design focus groups were conducted via videoconference with psycho-oncology psychologists in two stages: co-design of a cancer-specific BT model prototype (stage I) and confirmation of prototype content and structure acceptability (stage II). Participants provided iterative feedback on cancer-specific CBT elements to include in the BT intervention. Data were analyzed using an Interpretive Description approach. RESULTS: Fourteen clinicians participated across five co-design workshops. In stage I, identified themes were: (i) importance of the intake interview and orientation to the program; (ii) the prominent role of face-to-face contact in the BT model; and (iii) suitability of content for digital delivery. Stage II themes were: (i) feasibility of BT in psycho-oncology; and (ii) perceived importance of face-to-face for improved content delivery. The resulting BT intervention model (\"iCanBlend\") had a higher dose of face-to-face over digital sessions to promote treatment engagement and enhance duty-of-care online. CONCLUSION: Overall, iCanBlend was acceptable and clinically appropriate for the cancer context in Australia, although feasibility was not confirmed, given participants' preference for face-to-face support for digital content. Future research is required with clinicians and patients to determine usability.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42904134","pmid":"42904134","pmcid":"PMC13682193","doi":"10.1016/j.phro.2026.101105","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904134/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-23","journal_abbr":"Phys Imaging Radiat Oncol","journal_full":"Physics & Imaging in Radiation Oncology","tier":"A","if_val":3.2,"zone":"JCR Q2 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Benchmarking intermediate dose spillage in single target stereotactic radiosurgery for brain metastases.","title_en":"Benchmarking intermediate dose spillage in single target stereotactic radiosurgery for brain metastases.","authors":"Nour Y, Wiegreffe S, Tekin T, Caglayan L, Leitzen C, Dejonckheere CS, Scafa D, Layer JP et al.","affiliation_highlight":"Department of Radiation Oncology, University Hospital Bonn, Venusberg-Campus 1, Bonn, Germany.","results":"BACKGROUND AND PURPOSE: Intermediate-dose spillage is central to normal-brain sparing in stereotactic radiosurgery, yet fixed adverse-event and relative indices do not define achievable plan quality for single-target lin…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND AND PURPOSE: Intermediate-dose spillage is central to normal-brain sparing in stereotactic radiosurgery, yet fixed adverse-event and relative indices do not define achievable plan quality for single-target linear accelerator treatments. The aim was to derive a volume-dependent absolute benchmark for the 50% prescription isodose volume (V50%; equivalent to V10 Gy for 20 Gy plans) for brain metastases. MATERIALS AND METHODS: In total, 276 single-isocenter single-target plans were analyzed: 178 idealized model plans and 98 clinical plans. Power-law regression in log-log space modeled spillage against planning target volume (PTV, cm3). The volume-scaling exponents were 0.83 for the ideal references and 0.75 for the simplified clinical threshold. The clinical upper threshold was derived using q = 0.90 quantile regression. Threshold-exceeding plans were reviewed for anatomical or technical justification. RESULTS: In the model cohort V50% value correlated strongly with PTV (r = 0.994, p < 0.001). The ideal mean model was V50% = 3.71 × PTV0.83, the conservative ideal-planning reference was V50% = 4.10 × PTV0.83, and the clinical upper threshold was V50% = 5.00 × PTV0.75. Ten of 98 clinical plans (10%) exceeded the threshold. Seven lacked anatomical justification and were replanned, reducing V50% by a median of 14% (range 7-29%) without compromising target coverage. CONCLUSIONS: A volume-based V50% benchmark provided a complementary quality-assurance reference for single-target linear accelerator radiosurgery for brain metastases. It flagged plans that warranted structured review alongside target coverage, organs of interest, conformity, and gradient metrics.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903664","pmid":"42903664","pmcid":"PMC13682176","doi":"10.1016/j.phro.2026.101106","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903664/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-23","journal_abbr":"Phys Imaging Radiat Oncol","journal_full":"Physics & Imaging in Radiation Oncology","tier":"A","if_val":3.2,"zone":"JCR Q2 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Evidence-based design of a patient-specific quality assurance program through retrospective analysis of pretreatment and in vivo results.","title_en":"Evidence-based design of a patient-specific quality assurance program through retrospective analysis of pretreatment and in vivo results.","authors":"Decabooter E, Nijsten SMJJG","affiliation_highlight":"Maastro, Maastricht Radiation Oncology Institute, Maastricht, The Netherlands.","results":"BACKGROUND AND PURPOSE: As radiotherapy techniques become increasingly complex, patient-specific quality assurance (PSQA) must evolve to detect a broad spectrum of potential failure modes across the treatment chain. This…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND AND PURPOSE: As radiotherapy techniques become increasingly complex, patient-specific quality assurance (PSQA) must evolve to detect a broad spectrum of potential failure modes across the treatment chain. This study presents a extensive evaluation of a multi-modal PSQA program by assessing its ability to detect clinically relevant failure modes and quantifying its efficacy. MATERIALS AND METHODS: A five-year retrospective analysis was conducted of an integrated PSQA program implemented at Maastro, combining secondary dose calculations, log-file based verification, and Electronic Portal Dosimetry (EPD) in both pretreatment and in vivo workflows. The efficacy of individual QA methods and the overall program was quantified using positive predictive values (PPVs). PSQA outcomes were linked to potential improvements in treatment planning strategies and delivery techniques. RESULTS: A total of 18,558 treatment plans were analyzed in the pretreatment workflow and 1817 treatment plans in the in vivo workflow. Nearly all high-priority failure modes could be detected except machine output miscalibration. Combining PSQA methods substantially improved PPVs across failure categories. The in vivo workflow flagged the most failure modes and additionally gives insight into possible improvements in planning strategies or treatment techniques. CONCLUSIONS: This retrospective analysis demonstrated that a comprehensive framework incorporating independent, purpose-specific PSQA methods is essential to detect a wide range of treatment deviations. Combining complementary methods improves the reliability and interpretability of results. The clinical impact of a PSQA program can be further enhanced by adopting more clinically meaningful evaluation metrics and using the results to guide the optimization of new treatment strategies.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42905016","pmid":"42905016","pmcid":"","doi":"10.1148/ryai.260234","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42905016/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Radiol Artif Intell","journal_full":"Radiology-Artificial Intelligence","tier":"A","if_val":20.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Agentic Automation of BT-RADS Scoring Using an End-to-End System for Standardized Glioma Follow-up Assessment.","title_en":"Agentic Automation of BT-RADS Scoring Using an End-to-End System for Standardized Glioma Follow-up Assessment.","authors":"Jabal MS, Zhang J, LaBella D, Houk JL, Zhang D, Rudie JD, Mazurowski MA, Magudia K et al.","affiliation_highlight":"Department of Radiology, Duke University Medical Center, 2301 Erwin Rd, Box 3808, Durham, NC 27710.","results":"The Brain Tumor Reporting and Data System (BT-RADS) standardizes posttreatment MRI response assessment in patients with diffuse gliomas but requires complex integration of imaging trends, medication effects, and radiatio…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The Brain Tumor Reporting and Data System (BT-RADS) standardizes posttreatment MRI response assessment in patients with diffuse gliomas but requires complex integration of imaging trends, medication effects, and radiation timing. An end-to-end multiagent large language model and convolutional neural network system for automated BTRADS classification was developed and evaluated. Five hundred nine consecutive posttreatment glioma MRI examinations (March 2017-July 2021) from a single center were retrospectively evaluated. An extractor agent identified clinical variables from notes using gpt-oss (OpenAI, 20-billion parameters). A scorer agent applied BTRADS decision logic integrating these with quantitative volumetrics. System accuracy was compared against initial assessments, using expert annotation as the reference standard. Four hundred ninety-two examinations were evaluable. Overall system accuracy was 76.0% (374/492) versus 57.5% (283/492) for initial assessments, an absolute difference of +18.5 percentage points (P < .001). Cohen kappa between the system and the reference standard was 0.71. The system achieved high sensitivity in context-dependent categories (BT-1b; 100%; BT-1a, 92.7%; BT-3a, 87.5%) and moderate sensitivity for threshold-dependent categories (BT-3c, 74.8%; BT-2, 69.2%; BT-4, 69.3%; BT-3b, 57.1%). The BT-4 positive predictive value was 92.9%. These results support further evaluation of this system as a clinical decision-support tool, with local open-weight inference preserving data privacy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42905015","pmid":"42905015","pmcid":"","doi":"10.1148/ryai.260538","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42905015/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Radiol Artif Intell","journal_full":"Radiology-Artificial Intelligence","tier":"A","if_val":20.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"TRAM-AI: A Framework for Transparency in Reporting of Medical Imaging Datasets for Artificial Intelligence Development.","title_en":"TRAM-AI: A Framework for Transparency in Reporting of Medical Imaging Datasets for Artificial Intelligence Development.","authors":"Bose K, Gupta P, Adams L, Agrawal R, Aboian M, Basu S, Brunak S, Chang K et al.","affiliation_highlight":"Department of Radiodiagnosis and Imaging, Postgraduate Institute of Medical Education and Research (PGIMER), Chandigarh,…","results":"Purpose To develop and evaluate TRAM-AI, a consensus-based checklist for verifying whether medical imaging datasets described as publicly accessible are functionally usable for AI development. Materials and Methods A mod…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Purpose To develop and evaluate TRAM-AI, a consensus-based checklist for verifying whether medical imaging datasets described as publicly accessible are functionally usable for AI development. Materials and Methods A modified Delphi study was conducted. A steering committee generated candidate checklist items through a targeted literature review. An international expert panel (n = 33) rated items on criticality and feasibility across two Delphi rounds. Consensus was defined as ≥ 75% agreement on both dimensions. The checklist was pilot-validated in 10 publicly available datasets. An advisory group of four experts from Latin America and sub-Saharan Africa evaluated cross-regional applicability. Results Of 16 candidate items, 14 were retained in the final checklist; one item was removed because of feasibility concerns, and another was merged with an existing item because of conceptual redundancy. All 14 final items achieved consensus for both criticality and feasibility. The final TRAM-AI checklist comprises 14 items across four domains: Dataset Access and Persistence (3 items), Technical Interoperability (4 items), Metadata and Reproducibility (4 items), and Ethical, Legal, and Maintenance considerations (3 items). In pilot validation, all items were applicable to all 10 datasets, compliance was 90% for trusted repository, de-dentification, and subject-level mapping, 10% for archive validation, and 30% for partition keys. All four advisory group members endorsed the checklist. Conclusion TRAM-AI provides a practical framework for verifying the functional accessibility of medical imaging datasets, complementing existing methodological reporting standards. Further evaluation and broader validation across diverse geographic settings are warranted. ©RSNA, 2026.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901916","pmid":"42901916","pmcid":"PMC12378427","doi":"10.1002/hep.30361","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901916/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Signal Transduct Target Ther","journal_full":"Signal Transduction and Targeted Therapy","tier":"A","if_val":81.2,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Nanotherapeutic macrophage reprogramming through immunometabolic and microbial modulation for sepsis treatment.","title_en":"Nanotherapeutic macrophage reprogramming through immunometabolic and microbial modulation for sepsis treatment.","authors":"Lu X, Wang W, Zhang B, Li Q, Chen Y, Hai Y, Fan R, Fu S et al.","affiliation_highlight":"School of Pharmaceutical Engineering, Shenyang Pharmaceutical University, Shenyang, China.","results":"Sepsis is a life-threatening syndrome characterized by dysregulated immune responses and metabolic dysfunction, and remains a major cause of global mortality. While nanomedicine offers new opportunities for sepsis therap…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Sepsis is a life-threatening syndrome characterized by dysregulated immune responses and metabolic dysfunction, and remains a major cause of global mortality. While nanomedicine offers new opportunities for sepsis therapy, current strategies rarely achieve comprehensive modulation of macrophage immunometabolism and microenvironmental signaling. Here, we develop a glutathione-responsive nanotherapeutic platform (EONPs) by conjugating the stimulator of interferon genes (STING) inhibitor 4-octyl itaconate to polyethylene glycol, followed by encapsulation of the dihydroorotate dehydrogenase (DHODH) inhibitor EA6. Integrated transcriptomic, metabolomic, and metagenomic analyses combined with pharmacological assessments reveal that EONPs suppress systemic hyperinflammation, reprogram macrophages toward an anti-inflammatory phenotype, restore gut microbial homeostasis, and protect against multi-organ injury in septic models. Notably, EONPs enhance the production of the microbiota-derived metabolite 5-hydroxyindoleacetic acid (5-HIAA), which is functionally linked to the anti-inflammatory response and may further support macrophage reprogramming. Our findings establish a previously unrecognized strategy for precise metabolic and microbiota-driven modulation of macrophages, offering a conceptual framework for further investigation of macrophage-targeted nanotherapeutics in sepsis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901709","pmid":"42901709","pmcid":"PMC7970441","doi":"10.1016/j.rmed.2024.107612","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901709/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-23","journal_abbr":"BMJ Open Respir Res","journal_full":"BMJ Open Respiratory Research","tier":"B","if_val":4.0,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"nodule","category_label":"肺结节与早筛管理","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Obesity and the risk of idiopathic pulmonary fibrosis: a nationwide population-based study.","title_en":"Obesity and the risk of idiopathic pulmonary fibrosis: a nationwide population-based study.","authors":"Kim M, Lee KN, Shin DW, Han K, Lee SW","affiliation_highlight":"Department of Pulmonary and Critical Care Medicine, Asan Medical Center, University of Ulsan Colledge of Medicine, Songp…","results":"BACKGROUND: Obesity is a chronic inflammatory and metabolic condition implicated in the pathogenesis of several fibrotic diseases. However, population-based evidence regarding the association between obesity and the risk…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Obesity is a chronic inflammatory and metabolic condition implicated in the pathogenesis of several fibrotic diseases. However, population-based evidence regarding the association between obesity and the risk of idiopathic pulmonary fibrosis (IPF) remains limited. METHODS: This is a nationwide population-based cohort study using the National Health Information Database of South Korea. Adults aged ≥20 years who participated in the National Health Screening Program in 2012 were included. Individuals with prevalent IPF or those diagnosed within 1 year after baseline were excluded. Obesity was assessed using body mass index (BMI ≥25 kg/m² by Asian criteria) and waist circumference (WC). Incident IPF was defined by insurance claims with the International Classification of Diseases, 10th Revision code J84.1 in conjunction with registration in the Rare Intractable Diseases programme. RESULTS: Among 4 788 202 participants followed for a mean of 10.15 years, 1 591 830 (33.2%) were classified as obese. Higher BMI was associated with an increased risk of IPF in a dose–response manner after multivariable adjustment. Compared with participants with BMI 18.5–22.9 kg/m², adjusted HRs for IPF were 1.25 (95% CI 1.16 to 1.35) for BMI 23–24.9 kg/m², 1.55 (95% CI 1.45 to 1.66) for BMI 25–29.9 kg/m² and 1.66 (95% CI 1.42 to 1.94) for BMI ≥30 kg/m². In contrast, underweight individuals (BMI <18.5 kg/m²) had a lower risk of IPF. WC demonstrated a similar trend, with higher values independently associated with increased IPF risk. CONCLUSIONS: In this large nationwide cohort, both general and abdominal obesity were independently associated with an increased risk of incident IPF. These findings provide population-based evidence supporting a potential role of increased adiposity in IPF pathogenesis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901708","pmid":"42901708","pmcid":"PMC10772854","doi":"10.1136/bmj-2023-074819","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901708/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-23","journal_abbr":"BMJ Open Respir Res","journal_full":"BMJ Open Respiratory Research","tier":"B","if_val":4.0,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Automated quantitative analysis can support the identification of progressive pulmonary fibrosis in fibrotic interstitial lung disease.","title_en":"Automated quantitative analysis can support the identification of progressive pulmonary fibrosis in fibrotic interstitial lung disease.","authors":"Janska E, Dixon G, Page J, Hartley TM, Sturney SC, Harper JC, Tsaneva-Atanasova K, Gibbons MA et al.","affiliation_highlight":"University of Bristol Medical School, Bristol, UK.","results":"BACKGROUND: Identifying progression in fibrotic interstitial lung disease (f-ILD) is essential for treatment decisions and prognostication. Quantitative CT (qCT) may improve detection of progressive pulmonary fibrosis (P…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Identifying progression in fibrotic interstitial lung disease (f-ILD) is essential for treatment decisions and prognostication. Quantitative CT (qCT) may improve detection of progressive pulmonary fibrosis (PPF). We evaluated whether routine qCT enhances identification of disease progression. METHODS: We conducted a retrospective observational study of patients presenting to an ILD service over 2 years. Patients with f-ILD who underwent two CT scans within 24 months prior to ILD multidisciplinary team (ILD-MDT) review were included. CTs were initially reported by a mixed pool of radiologists and subsequently reviewed by an expert thoracic radiologist at ILD-MDT. The contextflow ADVANCE Chest CT was used to quantify lung abnormalities. The cohort was divided 70:30 into derivation and validation sets, stratified by ILD-MDT-defined progression. In the derivation cohort, optimal qCT thresholds were defined using Youden’s index and applied to the validation cohort to assess detection of previously unreported progression. RESULTS: 127/502 patients met inclusion criteria and were stratified into derivation (n=89) and validation (n=38) cohorts. In the derivation cohort, a 0.39% increase in combined honeycombing and reticulation yielded an AUC of 0.64 for identifying progression. In the validation cohort, this threshold achieved sensitivity and specificity of 0.71 for PPF detection. Although 27/38 (71.1%) patients were initially reported as stable or without comment on progression, 12/27 (44.4%) were later classified as having radiological progression at ILD-MDT. Of these discordant cases, qCT correctly identified progression in 10/12 (83.3%). DISCUSSION: This study demonstrates that qCT may assist the non-specialist radiologist in identifying fibrotic disease progression enabling earlier access to appropriate treatment.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902936","pmid":"42902936","pmcid":"PMC11842471","doi":"10.1002/cam4.72393","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902936/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-23","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Incidence, Mortality, and Survival Trends of Liver Cancer in the Canton of Zurich, Switzerland, Between 1980 and 2022.","title_en":"Incidence, Mortality, and Survival Trends of Liver Cancer in the Canton of Zurich, Switzerland, Between 1980 and 2022.","authors":"Zuber N, Suter F, Wanner M, Korol D, Rohrmann S","affiliation_highlight":"Cancer Registry of the Canton Zurich, Zug, Schaffhausen and Schwyz, University Hospital Zurich, Zurich, Switzerland.","results":"BACKGROUND: The global burden of liver cancer has been increasing over recent decades, whereas the incidence in Switzerland has remained relatively stable. This study assessed long-term trends in incidence, mortality, an…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The global burden of liver cancer has been increasing over recent decades, whereas the incidence in Switzerland has remained relatively stable. This study assessed long-term trends in incidence, mortality, and 1- and 5-year relative survival of primary liver cancer in the Swiss canton of Zurich from 1980 to 2022, stratified by sex and age. METHODS: This population-based retrospective analysis included all primary liver cancer cases diagnosed in the canton of Zurich and registered in the Cancer Registry of the cantons of Zurich, Zug, Schaffhausen and Schwyz between 1980 and 2022. Mortality data were obtained from the Federal Statistical Office. Cases were classified according to ICD-O-3 topography and morphology and, from 2003 onward, TNM stage. Age-standardised incidence and mortality rates were calculated using the 1976 European standard population. Temporal trends were analysed using Joinpoint regression and reported as Average Annual Percentage Changes (AAPCs) with 95% confidence intervals (CIs). Relative survival was estimated using the Ederer II method and standardised according to international standards. RESULTS: Among 3866 incident cases, 71.3% were hepatocellular carcinomas and 70.7% occurred in men. Overall age-standardised incidence remained stable in both men (AAPC -0.1%, 95% CI -0.6 to 0.3%) and women (-0.2%, -0.9% to 0.4%). However, incidence increased significantly among individuals younger than 65 years, particularly in women (AAPC 2.3%, 1.3%-3.3%) and men (1.2%, 0.6%-1.9%). Mortality remained broadly stable in men and increased modestly in women. One- and five-year relative survival improved substantially, from 13.8% and 3.5% in 1980-1999 to 53.9% and 25.8% in 2016-2022, respectively. Improvements were greater in men than women. CONCLUSION: These findings reflect major advances in liver cancer diagnosis and treatment over the past four decades. Continued prevention, targeted screening of high-risk groups, and epidemiological monitoring remain important.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903161","pmid":"42903161","pmcid":"PMC5513004","doi":"10.1111/hex.12481","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903161/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Public Health","journal_full":"Frontiers in public health","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Area-level socioeconomic deprivation and cause-specific survival after lung cancer diagnosis: a population-based cohort study in Naples, Italy.","title_en":"Area-level socioeconomic deprivation and cause-specific survival after lung cancer diagnosis: a population-based cohort study in Naples, Italy.","authors":"Scala A, Cristillo S, Loperto I, Gubitosi M, Ortolani R, Improta G","affiliation_highlight":"Department of Public Health, University of Naples Federico II, Naples, Italy.","results":"BACKGROUND: Lung cancer remains a major public health priority, with survival shaped by clinical, behavioral, socioeconomic, and organizational factors. Socioeconomic disadvantage may affect risk exposure, diagnosis, tre…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lung cancer remains a major public health priority, with survival shaped by clinical, behavioral, socioeconomic, and organizational factors. Socioeconomic disadvantage may affect risk exposure, diagnosis, treatment access, continuity of care, and data completeness. OBJECTIVE: To assess the association between area-level socioeconomic deprivation and cause-specific survival in lung cancer and apply the M.A.S.T.E.R. (Methodological Approach for Strategic Transformation, Evaluation, and Redesign) framework to translate epidemiological evidence into organizational design and implementation planning. METHODS: A retrospective population-based registry cohort study within ASL Napoli 1 Centro included incident malignant tumors of the trachea, lung, and bronchi recorded between 2010 and 2023. Cancer Registry data were integrated with the 2021 Socioeconomic Disadvantage Index (IDISE), Hospital Discharge Records, and progressi delle Aziende Sanitarie per la Salute in Italia (PASSI) 2022-2024 contextual smoking prevalence by sex and Primary Health Care District (DSB). Cause-specific survival was analyzed using multivariable Cox regression with district-clustered robust variance; Fine-Gray competing-risk regression was used as sensitivity analysis. M.A.S.T.E.R. comprised six phases: Mapping and contextualization, analysis and diagnosis, strategic design, testing and adaptive execution, embedding and sustainability, and resilience and renewal. RESULTS: Of 11,162 cases, 10,039 were included in the main analysis, totaling 207,600 person-months. There were 8,514 deaths, including 6,990 cause-specific deaths. In the primary model without contextual smoking prevalence, adjusted hazard ratios (HRs) increased across deprivation quintiles (Q5 vs. Q1: HR 1.11; 95% CI: 1.05-1.18; p < 0.001). Adding PASSI smoking prevalence attenuated the estimates (Q5 vs. Q1: HR 1.09; 95% CI: 0.99-1.19; p = 0.069); smoking prevalence was not statistically associated with mortality. M.A.S.T.E.R. outputs included a qualitative failure mode and effects analysis (FMEA), a plan, do, study, act (PDSA) protocol with control plan, a completeness dashboard, and plans for updates, audits, and strategic review. CONCLUSIONS: Greater area-level socioeconomic deprivation was associated with higher cause-specific mortality in the primary model; the association was attenuated and no longer statistically significant after adding contextual PASSI smoking prevalence. M.A.S.T.E.R. clarified the transition from epidemiological analysis to candidate interventions for prevention, smoking cessation, early diagnosis, patient navigation, and information integration. Outputs from the final four phases are design-oriented and require prospective implementation and validation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902792","pmid":"42902792","pmcid":"","doi":"10.1093/jncics/pkag113","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902792/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"JNCI Cancer Spectr","journal_full":"JNCI Cancer Spectrum","tier":"B","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Targeted therapy use following Medicare's coverage expansion for next-generation sequencing in older adults with lung cancer.","title_en":"Targeted therapy use following Medicare's coverage expansion for next-generation sequencing in older adults with lung cancer.","authors":"Kang SY, Roney PC, Ahn J, Lobo T, Gresenz CR, Potosky AL, Kinney AY, Schwartz MD et al.","affiliation_highlight":"Department of Health Management and Policy, Georgetown University School of Health, Washington, DC, United States.","results":"PURPOSE: To examine whether Medicare's 2018 National Coverage Determination (NCD) for next-generation sequencing (NGS) was associated with changes in the use of targeted oral anticancer therapies among older adults with …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: To examine whether Medicare's 2018 National Coverage Determination (NCD) for next-generation sequencing (NGS) was associated with changes in the use of targeted oral anticancer therapies among older adults with lung cancer. METHODS: Retrospective cohort study. Multivariable logistic regression was used to estimate the probability of initiating an oral targeted therapy within 12 months of diagnosis. Key exposures were (1) diagnosis before versus after the NCD and (2) residence in a region with versus without pre-NCD NGS. Data were drawn from the SEER-Medicare linked data with Part D claims, including diagnosis years 2016-2019 with follow-up through 2020. The analytic sample included Medicare fee-for-service Part D beneficiaries aged 65 years or older with newly diagnosed lung cancer. RESULTS: Among 30,855 Medicare fee-for-service Part D beneficiaries with lung cancer, 7.1% used targeted oral anticancer therapies. The NCD was not associated with a significant overall change in targeted therapy use (0.4 Percentage Point; 95% CI, -1.6 to 2.4; p = 0.71). Before NCD implementation, targeted therapy use was 1.0 PP higher in regions with pre-NCD NGS coverage than in regions without such coverage (95% CI, 0.2-1.9; p = 0.015). In stage-stratified analyses, the additional post-NCD change was significant among patients with distant-stage disease (3.2 PPs; 95% CI, 2.6-4.0; p < 0.001) but not among those with regional-stage disease (p = 0.29). CONCLUSIONS: Medicare's NCD for NGS was not associated with a significant overall increase in targeted oral anticancer therapy use but was associated with increased use among patients with distant-stage disease. Targeted therapy use remained higher in regions with preexisting NGS coverage.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903215","pmid":"42903215","pmcid":"PMC13680239","doi":"10.3389/fonc.2026.1939245","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903215/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Expression of estrogen receptor and progesterone receptor in endometrial cancer and their correlations with clinicopathological features.","title_en":"Expression of estrogen receptor and progesterone receptor in endometrial cancer and their correlations with clinicopathological features.","authors":"Li EP, Hong Y, Wei JZ, Li CK, Liang HQ","affiliation_highlight":"Department of Obstetrics and Gynecology, Kiang Wu Hospital, Macau SAR, China.","results":"OBJECTIVE: To investigate the expression levels of estrogen receptor (ER) and progesterone receptor (PR) in endometrial carcinoma (EC) and their correlations with standardized clinicopathological parameters in a single-c…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To investigate the expression levels of estrogen receptor (ER) and progesterone receptor (PR) in endometrial carcinoma (EC) and their correlations with standardized clinicopathological parameters in a single-center surgical cohort. METHODS: Retrospective clinical and pathological data of 78 EC patients receiving primary surgery at the Department of Obstetrics and Gynecology of Kiang Wu Hospital between Jan 2016 and Aug 2022 were collected. ER/PR expression was quantified via immunohistochemistry (IHC) using the Allred scoring system. Dichotomous receptor positivity (Allred 0-2 negative/3-8 positive) and continuous total Allred scores were analyzed separately. Fisher's exact test or χ² test was used for categorical comparison; Kruskal-Wallis H test with adjusted post-hoc pairwise tests and Wilcoxon rank-sum test were applied for ordinal Allred score data. Exact P values, test statistics and degrees of freedom were reported for all analyses. RESULTS: The overall cohort included 71 endometrioid carcinoma (EC) and 7 non-endometrioid carcinoma (NEC) cases. ER and PR positive rates were significantly higher in endometrioid lesions (97.2% and 94.4%) than non-endometrioid subtypes (57.1% for both, P = 0.018/P = 0.018). Continuous Allred scores of ER and PR declined significantly with worsening tumor differentiation (all adjusted P<0.05). For FIGO staging, significantly reduced ER and PR Allred scores were observed in Stage II compared with Stage I. The single Stage-III case was reported descriptively and was not included in formal statistical testing. Patients with lymph node metastasis exhibited lower PR Allred scores (P = 0.021), while ER expression showed no statistically significant difference (P = 0.076). No significant associations were found between ER/PR scores and depth of myometrial invasion or lymphovascular space invasion (LVSI) (all P>0.05). CONCLUSION: Reduced ER and PR expression correlates with poorer tumor differentiation and advanced FIGO stage in endometrioid endometrial carcinoma; PR loss is independently associated with lymph node metastasis. This study only identifies crude cross-sectional correlations without survival or multivariable adjustment data, so ER/PR may merely serve as auxiliary morphological markers reflecting tumor aggressive potential, rather than standalone indicators for prognosis or individualized hormone therapy guidance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903142","pmid":"42903142","pmcid":"PMC4724785","doi":"10.1002/sim.9025","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903142/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"High-volume cervical lymph node metastasis in papillary thyroid carcinoma: development and external validation of an interpretable prediction model.","title_en":"High-volume cervical lymph node metastasis in papillary thyroid carcinoma: development and external validation of an interpretable prediction model.","authors":"Wang D, Wang J, Wu Z, Cui Z","affiliation_highlight":"School of Medicine, Shandong First Medical University, Jinan, China.","results":"BACKGROUND: The transportability of models for postoperative high-volume cervical nodal disease in papillary thyroid carcinoma (PTC) and the incremental predictive value of molecular variables remain uncertain. METHODS: …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The transportability of models for postoperative high-volume cervical nodal disease in papillary thyroid carcinoma (PTC) and the incremental predictive value of molecular variables remain uncertain. METHODS: We developed models in the public Deyang cohort (521 patients; 90 events) and performed geographic external validation in the independent Liaocheng cohort (193 patients; 73 events). The outcome was >5 pathologically confirmed metastatic cervical lymph nodes. Five algorithms were compared using repeated stratified nested cross-validation with a prespecified 10-variable postoperative feature set. Ridge logistic regression (C = 0.1) was selected and applied without refitting. Paired comparisons of 8-variable clinicopathological and 10-variable clinicopathological-molecular models assessed the incremental value of high-risk co-mutation status and mutation count in both cohorts. RESULTS: Internal validation yielded an area under the receiver operating characteristic curve (AUROC) of 0.795 (95% CI, 0.745-0.842), average precision (AP) of 0.497 (0.406-0.598), and Brier score of 0.115 (0.098-0.134). External AUROC was 0.752 (0.678-0.821), AP 0.601 (0.498-0.728), and Brier score 0.217 (0.180-0.254). Observed and mean predicted risks were 37.8% and 23.9%, respectively; the observed-to-expected ratio was 1.582 (1.319-1.860) and the weak-calibration slope was 0.831 (0.542-1.191). At the prespecified threshold of 0.158, sensitivity was 0.795 and specificity 0.600. Net benefit was 0.254 for the model and 0.261 for classifying all patients as high risk (difference, -0.008; 95% CI, -0.051 to 0.033). External paired differences after adding molecular variables were +0.002 for AUROC (-0.005 to 0.010), -0.002 for AP (-0.016 to 0.010), -0.001 for Brier score (-0.002 to 0.000), and +0.009 for net benefit (-0.003 to 0.026). CONCLUSION: The model retained moderate discrimination across centers but underestimated absolute risk and did not demonstrate a net benefit advantage over classifying all patients as high risk at the prespecified threshold. High-risk co-mutation status and mutation count showed no clear incremental predictive value. Further validation with standardized lymph-node assessment and patient outcomes is required before clinical application.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903090","pmid":"42903090","pmcid":"PMC12311131","doi":"10.1038/s41523-025-00803-1","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903090/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Integrated CDK4/6 inhibitor resistance and primary-metastatic discordance in hormone receptor-positive/HER2-negative metastatic breast cancer: a translational framework focused on invasive ductal carcinoma with gastric metastasis.","title_en":"Integrated CDK4/6 inhibitor resistance and primary-metastatic discordance in hormone receptor-positive/HER2-negative metastatic breast cancer: a translational framework focused on invasive ductal carcinoma with gastric metastasis.","authors":"Cheng M, Wang D, Lin Y, Wu C, Hong R, Zhang J, Li J","affiliation_highlight":"Department of Breast Cancer, Cancer Center, Guangdong Provincial People's Hospital (Guangdong Academy of Medical Science…","results":"BACKGROUND: CDK4/6 inhibitors have reshaped treatment for hormone receptor-positive (HR+)/HER2-negative metastatic breast cancer, but resistance frequently emerges and may interact with metastatic phenotypic evolution. W…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: CDK4/6 inhibitors have reshaped treatment for hormone receptor-positive (HR+)/HER2-negative metastatic breast cancer, but resistance frequently emerges and may interact with metastatic phenotypic evolution. We developed an integrated resistance-discordance framework and explored its clinical interpretability in invasive ductal carcinoma (IDC) with gastric metastasis. METHODS: Public MSK-INK4 (cBioPortal study ID: breast_ink4_msk_2021) and MBCproject (brca_mbcproject_wagle_2017) cohorts were curated for HR+/HER2-negative disease. A five-module CDK4/6 inhibitor resistance score (0-5) was constructed from predefined mutation and copy-number events. In MBCproject RNA-seq samples, single-sample gene-set enrichment analysis quantified proliferation and estrogen-response activity. Discordance burden was defined as z(proliferation score) minus z(ER score), using primary tumors as the reference. Three institutional IDC gastric-metastasis cases were projected onto the framework for interpretability but not inferential testing. RESULTS: Seventy HR+/HER2-negative MBCproject samples and 1116 deduplicated MSK-INK4 metastatic samples were analyzed. MBCproject metastases had higher resistance scores than primary tumors (P = 0.001), whereas metastatic scores were similar between MBCproject and MSK-INK4 (P = 0.202). Metastases showed higher proliferation activity (P = 0.014) and a trend toward lower ER activity (P = 0.071). The high-resistance/high-discordance quadrant was enriched for PI3K-axis events (OR = 16.52; P = 0.034), chromatin-remodeling loss-of-function events (OR = 12.47; P = 0.001), and cell-cycle/RB-axis events (OR = 9.03; P = 0.001). Among the three IDC gastric-metastasis cases, two available gastric NGS profiles mapped to predefined resistance modules, and the case with increased gastric Ki-67 showed the strongest IHC-adapted discordance and projected toward the high-resistance/high-discordance phenotype. CONCLUSION: Coupling resistance-associated genomic events with metastatic phenotype discordance may provide a clinically interpretable lens for HR+/HER2-negative metastatic breast cancer and for rare IDC gastric-metastasis presentations.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42904094","pmid":"42904094","pmcid":"PMC13682186","doi":"10.1016/j.mtbio.2026.103745","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904094/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-23","journal_abbr":"Mater Today Bio","journal_full":"Materials today. Bio","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前实验研究 · 2×2 析因设计（手性×形貌）的体外与体内验证","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":39,"score_breakdown":{"clinical":8,"methodology":16,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"手性与形貌调控的金纳米颗粒递送 PD-L1 siRNA 在 H460 肺癌模型中增强基因沉默和抑瘤","title_en":"Chirality and morphology-dependent siRNA delivery for targeted lung cancer therapy with intrinsically chiral gold nanoparticles.","authors":"Li Q, Xu J, Zhang E, Liu C, Liu W, Yan K, Xu D, Wang J et al.","affiliation_highlight":"Key Laboratory of Biomedical Analytics (Southwest University), Chongqing Science and Technology Bureau, College of Pharm…","results":"","authors_conclusion":"手性和形貌是可共同设计的基因递送参数，并为将手性纳米材料转化为实体瘤治疗提供机制蓝图。","ai_note":"摘要未报告样本量、统计检验、效应量及安全性/毒性数据；主要结论基于 H460 细胞和单一动物模型，外推至实体瘤治疗需更多验证；“mechanistic blueprint”表述偏乐观。","pico":{"p":"H460 肺癌细胞及体内肺癌模型；样本量未报告","ic":"干预：D/L/DL 手性及 RCO/立方形貌金纳米颗粒递送 PD-L1 siRNA；对照：左手性、消旋及立方形貌对应颗粒"},"reason":"为肺癌 siRNA/PD-L1 纳米递送提供手性-形貌协同设计的前临床依据，可用于判断该递送平台的转化潜力与后续实验设计。","abstract_en":"The clinical translation of RNA interference (RNAi) for lung cancer treatment remains hampered by the lack of delivery vectors that concurrently optimize cellular uptake, target specificity, and in vivo stability. This work reports an intrinsically chiral gold nanoparticle (Au NP) platform with precisely controlled morphology for targeted siRNA delivery. Through a full 2 × 2 factorial design (2 chiralities × 2 morphologies), the work decouples the individual and combined contributions of these two parameters. It is found that right-handed chiral nanoparticles (D-NPs) show significantly faster cellular internalization and higher gene silencing potency than left-handed (L-NPs) and achiral (DL-NPs) counterparts. Beyond chirality, nanoparticle morphology serves as an equally critical parameter: the rhombicuboctahedral (RCO) architecture yields markedly higher silencing efficacy than cubic counterparts with D-chirality. Furthermore, proteomic analysis revealed that Au RCO nanoparticles with different chirality displayed distinct functional enrichment profiles. By D-RCO combination with minimal surface modification, siRNA targeting PD-L1 achieves potent knockdown and robust inhibition of H460 lung cancer proliferation both in vitro and in vivo. This work establishes chirality and morphology as co-designable parameters for gene delivery and provides a mechanistic blueprint for translating chiral nanomaterials into solid tumor therapy.","tags":["肺癌","siRNA递送","手性金纳米颗粒","PD-L1","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42904604","pmid":"42904604","pmcid":"PMC10757715","doi":"10.1111/cbdd.70420","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904604/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-23","journal_abbr":"Chem Biol Drug Des","journal_full":"Chemical biology & drug design","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单细胞转录组与TCGA-LUAD队列生物信息学分析 · 体外验证的探索性机制研究","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":38,"score_breakdown":{"clinical":9,"methodology":14,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"单细胞分析提示晚期肺癌恶性积液中上皮细胞炎症信号受抑、干性增强，STMN1与干性维持相关","title_en":"Single-Cell Dissection of Inflammatory Suppression and Stemness Plasticity Reveals STMN1-Associated Malignant Epithelial Cells in Severe Lung Cancer.","authors":"Chen Y, Chen S, Cheng B, Tang Y, Huang Y, Chen M","affiliation_highlight":"Department of Endocrinology, The Affiliated Yongchuan Hospital of Chongqing Medical University, Chongqing, China.","results":"","authors_conclusion":"本研究揭示晚期肺癌恶性上皮细胞干性状态显著增强，伴炎症信号受抑和代谢适应增强，并确定STMN1是驱动干性维持和疾病进展的关键分子。","ai_note":"摘要未给出样本量、干性评分或相关性分析的具体数值与统计量；将相关网络、通路富集及体外标志物上调解读为STMN1驱动疾病进展，因果性证据有限；“mRNAi”含义不明；“severe lung cancer”定义不清；缺乏生存、治疗反应等临床终点及独立外部验证信息。","pico":{"p":"晚期肺癌伴恶性浆膜腔积液（ALC-MSE）患者；摘要未报告样本量","ic":"单细胞转录组数据与TCGA-LUAD队列分析；体外诱导干性后检测STMN1及干性标志物（摘要未描述具体对照设置）"},"reason":"为晚期肺癌恶性积液相关恶性上皮细胞的干性机制提供探索性假说和候选分子，可供胸部肿瘤转化研究选题与后续验证设计参考；不直接改变临床决策。","abstract_en":"The disease course in patients with advanced lung cancer with malignant serous effusions (ALC-MSE) is complex, and treatment outcomes are difficult to predict; systematic studies on the tumor stem cell-like characteristics and regulatory mechanisms of this condition are still lacking. Based on single-cell transcriptomic data and the TCGA-LUAD cohort, this study systematically analyzed the functional characteristics and key regulatory networks of malignant epithelial cells in severe lung cancer. Key findings include: epithelial cells in severe lung cancer exhibit significantly attenuated inflammation- and immunity-related signaling pathways (including NF-κB, TNF, and JAK-STAT signaling pathways), enhanced stem cell-like properties, and metabolic reprogramming; we identified a highly stem-like malignant epithelial cell subpopulation, represented by Cluster 3, which is enriched in stem-like pathways such as Notch, Hippo, TGF-β, and FoxO, and is accompanied by enhanced mitochondrial metabolism and stress adaptability; STMN1 is a key molecule regulating this stem-like state, showing a significant positive correlation with stemness scores and mRNAi; cells with high STMN1 expression gain a survival advantage and may maintain their stemness by attenuating CAF/ECM signaling with other cells (COL1A1-CD44), inhibiting complement activation and antigen presentation signaling (such as C3, ANXA1, and MHC-II-related molecules), and enhancing stemness niche signaling (MIF-CD74/CD44). Furthermore, NELFE, MYBL2, FOXN3, POLR2A, and RAD21 were identified as potential upstream regulators of STMN1. In vitro experiments confirmed that, following induction of stem cell-like properties, STMN1 was significantly overexpressed in lung adenocarcinoma cells, accompanied by upregulation of related stem cell markers (SOX2, NANOG, OCT4, and CD44). In summary, this study reveals a significantly enhanced stemness state in malignant epithelial cells in advanced lung cancer, accompanied by suppressed inflammatory signaling and enhanced metabolic adaptation, and identifies STMN1 as a key molecule driving stemness maintenance and disease progression.","tags":["单细胞转录组","肺癌恶性浆膜腔积液","STMN1","肿瘤干性","生物信息学"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902931","pmid":"42902931","pmcid":"","doi":"10.1002/cncy.70150","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902931/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-23","journal_abbr":"Cancer Cytopathol","journal_full":"CANCER CYTOPATHOLOGY","tier":"B","if_val":2.9,"zone":"JCR Q2 · 3区","warned":false,"study_type":"叙述性综述（非系统评价）· 细胞学/小活检诊断路径与免疫细胞化学panel应用","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":37,"score_breakdown":{"clinical":14,"methodology":8,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"综述：细胞学与小活检样本中非小细胞肺癌及其类似病变的诊断思路——与WHO报告系统对接的形态学与免疫细胞化学实践要点（无原始数据）","title_en":"Non-small cell lung carcinoma and its mimics on cytology and small biopsy samples: a practical approach aligned with the WHO Reporting System.","authors":"Silva RSD, Schmitt F","affiliation_highlight":"IPATIMUP Diagnostics, IPATIMUP - Institute of Molecular Pathology and Immunology of Porto University, Porto, Portugal.","results":"","authors_conclusion":"通过将形态学评估与辅助检测相结合，细胞病理学家可实现准确的肿瘤亚型判定、区分类似病变，并提供可指导临床管理与靶向治疗选择的精准诊断。","ai_note":"全文为叙述性综述，摘要未给出检索策略、纳入文献数量、任何诊断准确性数值（敏感度/特异度/一致率）或验证数据，故“可实现准确亚型判定”属作者主张而非本研究证据；亦未说明对小活检/细胞学取材量受限时分子检测保留的具体阈值，信息不足。","pico":{"p":"","ic":""},"reason":"为晚期NSCLC在细胞学与小活检标本上的亚型判定和免疫组化panel精简提供实践性对照框架，直接影响标本有限时靶向治疗前的诊断路径与分子检测留样决策；但无原始数据，不能作为疗效或诊断准确性的证据引用。","abstract_en":"Accurate classification of lung tumors in cytology specimens and small biopsies remains a diagnostic challenge because of limited cellularity, preanalytical variables, and significant morphologic overlap among entities. This review summarizes key cytomorphologic characteristics and practical immunocytochemical strategies, and common diagnostic pitfalls encountered in the evaluation of non-small cell lung carcinoma, small cell lung carcinoma, neuroendocrine tumors, secondary pulmonary neoplasms, and uncommon thoracic entities in endobronchial ultrasound-guided transbronchial needle aspiration and fine-needle aspiration samples. Particular emphasis is placed on the appropriate use of limited immunohistochemical panels to optimize tumor subtyping while preserving material for molecular testing. Diagnostic challenges such as crush artifact, necrosis, reactive mimics, overlapping morphologic patterns, and the risk of misclassification of rare tumors are addressed with practical guidance for differential diagnosis. By integrating morphologic assessment with ancillary testing, cytopathologists can achieve accurate tumor subtyping, distinguish mimics, and provide precise diagnoses that guide clinical management and selection of targeted therapies.","tags":["细胞病理学","小活检","NSCLC亚型判定","免疫细胞化学","WHO报告系统","EBUS-TBNA"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903410","pmid":"42903410","pmcid":"PMC13681363","doi":"10.3389/fimmu.2026.1961903","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903410/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"概念性与转化性叙述综述（非系统评价，无系统检索与偏倚评估，无原始患者数据）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":36,"score_breakdown":{"clinical":9,"methodology":8,"specialty":11,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"靶向KAT6A/B的表观遗传治疗：机制证据、肿瘤免疫微环境重塑与作者自拟“双腔室假说”的概念性转化综述（无原始数据）","title_en":"Targeting lysine acetyltransferase 6A/B in cancer: a conceptual and translational review of epigenetic regulation, immune microenvironment remodeling, and the dual-compartment hypothesis.","authors":"Ma C, Wang J, Qiao G, Wu X, Zheng H","affiliation_highlight":"Breast Cancer Center, Hubei Cancer Hospital, Tongji Medical College, Huazhong University of Science and Technology, Wuha…","results":"","authors_conclusion":"KAT6A/B药理靶向“是有前景的治疗途径”；本文提出“双腔室假说”作为组织现有证据、生成可检验假设的解释框架：原发瘤腔室内阻断可能经铁死亡、cGAS-STING激活与IL-6抑制等临床前通路间接促进局部抗肿瘤免疫，而全身暴露可能直接影响造血与淋巴细胞发育；作者同时承认肿瘤微环境内免疫细胞也可能被KAT6A/B抑制这一替代结局尚待系统研究，并强调需区分基因KO/KD与药理抑制/降解及KAT6A与KAT6B亚型选择性，提出间歇给药与合理免疫联合等可检验转化框架，并指出现有早期临床ORR/CBR为复合治疗反应、需配对生物标志物验证方能隔离免疫介导效应。","ai_note":"“双腔室假说”为作者自创解释框架，无直接实验或临床数据支持，文中免疫相关机制（铁死亡、cGAS-STING、IL-6、免疫检查点）多为临床前推测性通路；核心机制证据主要来自基因敲除/敲低模型，外推至药物抑制或降解存在系统性缺口（作者已部分自陈）；作者自列“免疫细胞被直接抑制”这一相反可能，说明效应方向本身未定，结论应视为假说而非证据；提及早期临床ORR/CBR却未给出任何数值、研究来源或引用细节，属叙述性概括，无法核验；无系统检索策略、纳入标准、证据分级或偏倚评估，存在选择性引用风险。","pico":{"p":"无（叙述性综述，未界定纳入人群或样本量）","ic":"无（综述对象为KAT6A/KAT6B的基因敲除/敲低、催化抑制剂与PROTAC降解剂等干预手段，未设对照比较）"},"reason":"为KAT6A/B抑制剂与PROTAC的免疫联合策略、给药节律（间歇给药）及生物标志物配对设计提供假说来源与反面思考；明确提示早期ORR/CBR不能归因于免疫机制，影响对该类靶向药早期单臂数据解读与后续试验终点设计的科研判断。","abstract_en":"While lysine acetyltransferase 6A (KAT6A; MOZ/MYST3) and 6B (KAT6B; MORF/MYST4) function as context-dependent oncogenic drivers-with KAT6B also displaying tissue-specific tumor-suppressive roles-their pharmacological targeting holds promise as a therapeutic avenue. This conceptual and translational review synthesizes evidence from genetic depletion models, pharmacological catalytic inhibitors, and emerging proteolysis-targeting chimera (PROTAC) degraders, introducing the \"Dual-Compartment Hypothesis\" as a conceptual interpretive framework to organize current evidence and generate testable hypotheses regarding their putative impacts on the tumor immune microenvironment (TIME). Under this framework, KAT6A/B blockade within the primary tumor compartment is proposed to indirectly foster regional antitumor immunity via preclinically implicated pathways, including tumor cell ferroptosis, cyclic GMP-AMP synthase-stimulator of interferon genes (cGAS-STING) activation, and interleukin-6 (IL-6) suppression, alongside putative downstream influences on immune checkpoints. In contrast, systemic drug exposure in the secondary compartment may directly alter hematopoiesis and lymphocyte development, creating a tension between local immune activation and systemic constraints. Importantly, immune cells within the tumor microenvironment may also be directly suppressed by KAT6A/B inhibition-an alternative outcome that remains to be systematically investigated. Resolving these divergent outcomes necessitates distinguishing genetic knockout/knockdown (KO/KD) from pharmacological inhibition or degradation-a distinction that is critical because much of the mechanistic evidence derives from genetic models, while accounting for KAT6A versus KAT6B isoform selectivity. Finally, we outline testable translational frameworks, such as intermittent dosing schedules and rational immunotherapeutic combinations, to direct subsequent experimental and clinical validation, while acknowledging that current early-phase clinical observations (objective response rate [ORR]/clinical benefit rate [CBR]) reflect composite therapeutic responses and require further paired biomarker validation to definitively isolate immune-mediated effects.","tags":["KAT6A/KAT6B","表观遗传靶向治疗","PROTAC","肿瘤免疫微环境","叙述性综述","假说性框架"],"curated":fal
