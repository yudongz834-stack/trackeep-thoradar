ion, scalable secondary analysis, and reproducible characterization of imaging practices across institutions.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902038","pmid":"42902038","pmcid":"12417914","doi":"10.1037/h0026256","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902038/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Imaging Inform Med","journal_full":"Journal of Imaging Informatics in Medicine","tier":"B","if_val":5.1,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"TurkRadLLM: A Compact MedGemma-Based Model for Structuring Turkish Lumbar and Cervical Spine MRI Reports-A Multi-reader Validation Study.","title_en":"TurkRadLLM: A Compact MedGemma-Based Model for Structuring Turkish Lumbar and Cervical Spine MRI Reports-A Multi-reader Validation Study.","authors":"Turgan AH, Çolakoğlu H, Demir A, Sakcı Z","affiliation_highlight":"Department of Radiology, Ümraniye Training and Research Hospital, University of Health Sciences, Istanbul, Turkey.","results":"To develop and validate a compact, locally deployable MedGemma-based model converting unstructured Turkish spine MRI reports into structured six-field output. In this retrospective single-institution study, 5210 lumbar a…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"To develop and validate a compact, locally deployable MedGemma-based model converting unstructured Turkish spine MRI reports into structured six-field output. In this retrospective single-institution study, 5210 lumbar and 5017 cervical Turkish spine MRI reports were used to fine-tune MedGemma 4B IT with QLoRA. Silver-standard labels from a proprietary large language model served as training targets and as the reference for automated fidelity analyses, but not as the clinical reference standard. Evaluation comprised multi-reader validation of 180 authentic reports interleaved with 20 adversarial cases, a second round in which the readers scored the silver labels themselves, and comparison on the full held-out set against a rule-based baseline, the non-fine-tuned base model, and a much larger model. Every output was valid, schema-conformant JSON, and the grouped acceptance rate was 100% (95% CI 97.9-100), though one reader judged negative-finding lists incomplete in 57.8% of reports. On the full held-out set (1025 reports), fine-tuning increased agreement with the silver-label impression from 17.7% to 67.1% and urgent-flag sensitivity against the silver reference from 18.8% to 62.5% (both p < .001); the larger non-fine-tuned model reached 27.5% and 50.0%, and a rule-based baseline 99.0% on body region. When the readers scored the silver labels themselves, the model was rated higher on negative findings and lower on the impression. Deployment required 14.75 GB of GPU memory on a consumer card. Fine-tuning a compact medical language model produced structured output rated acceptable by clinicians, though negative-finding completeness remained reader-dependent. The gain lay in content-level fidelity rather than output validity.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42900966","pmid":"42900966","pmcid":"","doi":"10.1016/j.jss.2026.09.014","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900966/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Surg Res","journal_full":"JOURNAL OF SURGICAL RESEARCH","tier":"B","if_val":1.6,"zone":"JCR Q3 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Epithelial-Mesenchymal Transition Is Associated With Perineural Invasion in Pancreatic Ductal Adenocarcinoma.","title_en":"Epithelial-Mesenchymal Transition Is Associated With Perineural Invasion in Pancreatic Ductal Adenocarcinoma.","authors":"Khan A, Kawashima K, Seavey C, Olecki E, Takabe K, Dhir M","affiliation_highlight":"Department of Surgical Oncology, Roswell Park Comprehensive Cancer Center, Buffalo, New York.","results":"INTRODUCTION: Perineural invasion (PNI) is a high-risk feature of pancreatic ductal adenocarcinoma (PDAC) and is associated with aggressive behavior and poor outcomes. The biological programs associated with PNI in PDAC …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Perineural invasion (PNI) is a high-risk feature of pancreatic ductal adenocarcinoma (PDAC) and is associated with aggressive behavior and poor outcomes. The biological programs associated with PNI in PDAC remain incompletely characterized. METHODS: PDAC patients in The Cancer Genome Atlas were stratified by PNI status. Gene set enrichment analysis using Hallmark gene sets was performed to characterize transcriptomic differences between PNI-positive and PNI-negative tumors. Established immune, proliferative, and genomic annotations curated from prior The Cancer Genome Atlas analyses were used for downstream comparisons. RESULTS: A total of 101 PNI-positive and 26 PNI-negative tumors were identified. PNI was associated with higher grade (P < 0.05). Gene set enrichment analysis demonstrated enrichment of multiple gene sets in PNI-positive tumors, including pathways related to cell proliferation (G2M checkpoint, mTORC1 signaling, E2F targets, MYC targets, and mitotic spindle), immune signaling (tumor necrosis factor-α signaling via NF-κB, interferon-α, and γ responses), and epithelial-mesenchymal transition (EMT). Yet, no differences were observed in measures of tumor proliferation, aggressiveness, mutational burden, immune response, or immune cell infiltration within the tumor microenvironment. In contrast, EMT enrichment was supported by concordant biological features, including increased infiltration of mesenchymal cells and elevated expression of EMT-associated genes in PNI-positive tumors. CONCLUSIONS: PNI-positive PDAC demonstrate enrichment of EMT-related transcriptional programs with concordant microenvironmental and gene-level support.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42900964","pmid":"42900964","pmcid":"","doi":"10.1016/j.jss.2026.09.021","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900964/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Surg Res","journal_full":"JOURNAL OF SURGICAL RESEARCH","tier":"B","if_val":1.6,"zone":"JCR Q3 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Histological Stages of Appendicitis Associated With Imaging Characteristics: A Computed Tomography and Ultrasound-Based Comparative Study.","title_en":"Histological Stages of Appendicitis Associated With Imaging Characteristics: A Computed Tomography and Ultrasound-Based Comparative Study.","authors":"Alvarez-Lozada LA, Rodríguez-Garza MS, Arrambide-Garza FJ, Fernández-Reyes BA, Medellín-Vallejo RDC, Rivas-Sanchez EA, Ramirez-Sanchez A, Quiroga-Garza A et al.","affiliation_highlight":"Human Anatomy Department, School of Medicine, Clinical-Surgical Research Group (GICQx), Universidad Autonoma de Nuevo Le…","results":"INTRODUCTION: Appendicitis diagnosis relies heavily on medical imaging procedure studies; however, a definite diagnosis is obtained through histological assessment. Understanding the imaging characteristics and their rel…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Appendicitis diagnosis relies heavily on medical imaging procedure studies; however, a definite diagnosis is obtained through histological assessment. Understanding the imaging characteristics and their relation to various histological phases enhance the quality of treatment recommendations. This study analyzed imaging characteristics of acute appendicitis in relation to its histological severity. METHODS: A cross-sectional study was conducted using data from a third-level hospital. Appendectomy specimens from patients with prior computed tomography (CT) scans or ultrasound (US) imaging were included. Histological stages were categorized into simple, suppurative, abscessed, and perforated phases, depending the presence of edema, vascular congestion, neutrophilic infiltrate into the muscular layer, microabscess formation, mucosal ulceration, purulent exudate, macroscopic pus, and perforation with transmural inflammation. Imaging features as fat stranding, presence of free fluid, contrast enhancement within the appendix, appendicolith detection, reactive lymph nodes in the vicinity, appendix diameter itself, increased echogenicity, and detecting heightened perfusion via Doppler imaging were compared across these stages. RESULTS: Among 760 patients included (51.4% women, mean age 30.1 ± 5.3), 196 (25.8%) had CT scans and 361 (47.5%) had US. CT confirmed appendicitis in 59.2% of cases, yielded a negative result in 19.4%, and provided an inconclusive diagnosis in 21.4% of cases, commonly identifying fat stranding, free liquid, and contrast enhancement. US diagnosed appendicitis in 67.6% of cases, whereas 32.4% were reported as negative, with findings including increased echogenicity, Doppler perfusion, appendix identification, and free liquid in the right parietocolic gutter. All imaging characteristics were less prevalent in early stages compared to advanced stages, with a higher negativity rate in earlier stages. CONCLUSIONS: Imaging findings are associated with the histopathological severity of appendicitis. Increased histopathological severity is associated with greater frequency of CT and US findings. These relations suggest the potential for managing appendicitis based on the histological phase suspected from imaging findings. Further research is warranted.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42896500","pmid":"42896500","pmcid":"PMC3974746","doi":"10.1080/13645579.2023.2228600","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42896500/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-22","journal_abbr":"J Surg Res","journal_full":"JOURNAL OF SURGICAL RESEARCH","tier":"B","if_val":1.6,"zone":"JCR Q3 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Understanding Colorectal Cancer Screening Gaps Among Adults Aged 45-49.","title_en":"Understanding Colorectal Cancer Screening Gaps Among Adults Aged 45-49.","authors":"Myers S, Ueland T, Davis ES, Franks JA, Davids JS, Kenzik KM","affiliation_highlight":"Department of Surgery, Chobanian & Avedisian School of Medicine, Boston Medical Center, Boston University, Boston, Massa…","results":"INTRODUCTION: The United States Preventative Task Force recommends initiating colorectal cancer (CRC) screening at age 45, but screening rates among 45-49 y-olds has been lower than older age groups. Reasons for low scre…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: The United States Preventative Task Force recommends initiating colorectal cancer (CRC) screening at age 45, but screening rates among 45-49 y-olds has been lower than older age groups. Reasons for low screening rates among younger individuals are not clear. METHODS: Using Behavioral Risk Factor Surveillance System data from 2022 to 2024, we investigated factors associated with CRC screening among adults aged 45-49; stratified analyses were conducted among the insured and uninsured. Among screened individuals, associations with undergoing endoscopy versus another screening modality were studied. We characterized preventative care behaviors including seeking primary care, time since last checkup, and completion of other age-appropriate cancer screening. RESULTS: Of 50,132 individuals, 21,566 (42.6%) underwent CRC screening. Those with primary care physicians had higher odds of screening (odds ratio = 1.71; 95% confidence interval = 1.47-1.98, ref: no primary care physician), but increasing time since one's last visit was associated with decreasing odds of screening at all time intervals (5+ y ago: odds ratio = 0.29; 95% confidence interval = 0.23-0.38, ref: <1 y). Lower income, rural residence, no insurance, and lower educational attainment were associated with lower odds of screening. CRC screening was completed in only 41.3% of women who had mammograms and 48% who were screened for cervical cancer. CONCLUSIONS: Uptake of CRC screening lags in adults aged 45-49, with differences in socioeconomic factors and preventative care utilization. A majority of eligible but unscreened individuals accessed other age-appropriate cancer screening tests, directing focus to patient- and provider-specific factors as potential targets for intervention.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42900980","pmid":"42900980","pmcid":"","doi":"10.1016/j.jgo.2026.104656","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900980/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Geriatr Oncol","journal_full":"Journal of Geriatric Oncology","tier":"B","if_val":2.9,"zone":"JCR Q3 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Patient education for older adults with cancer and their caregivers: A scoping review.","title_en":"Patient education for older adults with cancer and their caregivers: A scoping review.","authors":"Lin L, Sattar S, Steenstra I, Ku NW, Anand S, Ho H, Oleynikov C, Haase K et al.","affiliation_highlight":"The First Affiliated Hospital of Soochow University, Suzhou, Jiangsu, China; Lawrence Bloomberg Faculty of Nursing, Univ…","results":"INTRODUCTION: Patient education is essential for older adults with cancer and their caregivers to support understanding of diagnosis and treatment. However, the evidence describing patient education interventions has not…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Patient education is essential for older adults with cancer and their caregivers to support understanding of diagnosis and treatment. However, the evidence describing patient education interventions has not been comprehensively mapped. Our objective was to characterize the features, delivery approaches, and outcomes of patient education interventions developed for older adults with cancer and/or their caregivers across any study design, and to identify gaps in the evidence. MATERIALS AND METHODS: A scoping review was conducted using the Arksey and O'Malley framework and reported according to the PRISMA-ScR guideline. MEDLINE, EMBASE, EMCARE, CENTRAL, PsycINFO, and Scopus were searched on January 23, 2025. Studies published from 2000 onward were included if they evaluated healthcare professional-delivered patient education. RESULTS: From 26,898 records screened, 93 studies met inclusion criteria. Most interventions were delivered pre-treatment (n = 63), with surgery the most common context (n = 31). Common aims included side-effect prevention (n = 32) and supporting treatment decision-making (n = 26). Caregiver involvement was limited. Outcomes were clustered into 20 domains. Frequent reported domains were satisfaction/acceptability (52 occurrences) and knowledge/understanding (46 occurrences), while caregiver outcomes and clinical endpoints were rarely assessed. DISCUSSION: Patient education interventions generally improved knowledge and satisfaction, but evidence for clinical or system-level impacts remains limited. Key gaps include minimal integration of geriatric assessment, limited adaptation for cognitive impairment, sparse caregiver-specific outcomes, and inconsistent reporting of unintended effects. Future research should better integrate caregiver needs and geriatric principles into patient education design.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901474","pmid":"42901474","pmcid":"","doi":"10.1016/j.jprot.2026.105751","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901474/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Proteomics","journal_full":"Journal of Proteomics","tier":"B","if_val":3.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Proteomic analysis identifies proteins involved in increased vascular permeability in vestibular schwannoma patients.","title_en":"Proteomic analysis identifies proteins involved in increased vascular permeability in vestibular schwannoma patients.","authors":"Maiorov V, Soloveva N, Novikova S, Farafonova T, Shimansky V, Kugushev I, Poshataev V, Tikhonova O et al.","affiliation_highlight":"Institute of Biomedical Chemistry, Pogodinskaya 10, 119121 Moscow, Russia.","results":"Vestibular schwannomas (VS) are benign neoplasms of the VIII cranial nerve; they account for 6-8% of all intracranial tumors and about 80% of tumors of the cerebellopontine angle. Cystic forms of VS may be particularly d…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Vestibular schwannomas (VS) are benign neoplasms of the VIII cranial nerve; they account for 6-8% of all intracranial tumors and about 80% of tumors of the cerebellopontine angle. Cystic forms of VS may be particularly dangerous, as they demonstrate faster growth and worse postoperative outcomes. In this study, we performed proteomic analysis of cerebrospinal fluid (CSF) samples obtained from patients with solid and cystic forms of VS, as well as cyst fluid from patients with cystic VS. CSF samples from patients with hemifacial spasm were used as controls. Mass spectrometric (MS) analysis resulted in identification of 816 proteins in all samples and 111 proteins were upregulated in samples obtained from VS patients compared to the control group. The upregulated proteins belonged to the groups of components and regulators of the complement system, proteins associated with glucose and lipid metabolism. MS analysis of CSF obtained from patients with cystic and solid forms of VS resulted in identification of two proteomic clusters enriched in proteins associated with the development of the nervous system, cell adhesion, and myelination processes. The data obtained suggest the involvement of these biological processes in the pathogenesis of cystic VS. SIGNIFICANCE: This study provides a comprehensive proteomic characterization of cerebrospinal fluid (CSF) and cyst fluid from patients with solid and cystic vestibular schwannomas (VS), offering valuable insights into the molecular mechanisms underlying these tumors. Our discovery that complement system components and regulators are consistently upregulated in CSF and cyst fluid from VS patients, along with proteins involved in lipid metabolism, points to a potential mechanism of blood-brain barrier disruption and cyst formation, which is particularly relevant given the more aggressive clinical course of cystic VS. These findings not only contribute to understanding of VS pathogenesis but also suggest candidate protein targets for future diagnostic, prognostic, and therapeutic strategies, particularly for the more challenging cystic form of the disease.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902387","pmid":"42902387","pmcid":"8782635","doi":"10.1001/jamasurg.2017.0111","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902387/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-22","journal_abbr":"Patient Saf Surg","journal_full":"Patient Safety in Surgery","tier":"B","if_val":3.3,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Postoperative anaesthesia follow-up via telemedicine after outpatient surgery: a proof-of-concept study.","title_en":"Postoperative anaesthesia follow-up via telemedicine after outpatient surgery: a proof-of-concept study.","authors":"Huerter BL, Rossaint R, Larmann J, Czaplik M, Follmann A","affiliation_highlight":"Department of Anaesthesiology, Faculty of Medicine, RWTH Aachen University, Pauwelsstraße 30, 52074, Aachen, Germany.","results":"BACKGROUND: Postoperative anaesthesia visits after inpatient procedures guarantee a comprehensive assessment of the patient's status. As the number of outpatient surgical cases in hospitals increases, more patients are r…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Postoperative anaesthesia visits after inpatient procedures guarantee a comprehensive assessment of the patient's status. As the number of outpatient surgical cases in hospitals increases, more patients are recovering at home. Telemedicine may provide an efficient and effective link between anaesthesiologists and patients at home without restricting their freedom and self-determination. METHODS: After an initial acceptance survey, a single-arm, observational pilot study piloted an optional postoperative anaesthesia visit for patients undergoing outpatient surgery under general anaesthesia. It was implemented using videochats and patient-reported outcome measure (PROM) questionnaires. RESULTS: Of the 300 people initially surveyed in the initial acceptance survey, nearly two-thirds (62.0%) expressed interest in using videochats to contact an anaesthesiologist after discharge. One hundred patients (n = 100) were included in the subsequent observational pilot study. The offer of an optional postoperative visit was used by 65 participants (n = 65, 65%). Videochats were considered a reliable tool for communicating medical issues and perceived as superior to telephone calls. The use of PROM questionnaires was considered meaningful by more than 80% of participants. Sixty-two of the sixty-five participants considered the postoperative anaesthesia visit a useful and beneficial part of the treatment and recovery process. CONCLUSIONS: Postoperative anaesthesia visits via videochat combined with PROM questionnaires after outpatient surgery were successfully piloted and consistently perceived positively by participants. Telemedicine-assisted postoperative anaesthesia visits may be a feasible component of patient-centred care in settings with limited resources. TRIAL REGISTRATION: German Clinical Trials Register; https://drks.de/search/en; registration number: DRKS00028755, registration date: 26th January 2023.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901131","pmid":"42901131","pmcid":"","doi":"10.1016/j.rmed.2026.109236","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901131/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Respir Med","journal_full":"RESPIRATORY MEDICINE","tier":"B","if_val":3.3,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Foot-to-foot lower-limb phase angle as a predictor of reduced exercise capacity in patients with interstitial lung disease: A comparative study with muscle mass and pulmonary function.","title_en":"Foot-to-foot lower-limb phase angle as a predictor of reduced exercise capacity in patients with interstitial lung disease: A comparative study with muscle mass and pulmonary function.","authors":"Kaneko K, Ishizaka M, Hara T, Chiba K, Takei K, Ishikawa F, Sakamoto K, Awano N et al.","affiliation_highlight":"Rehabilitation Technology Department, Japanese Red Cross Medical Center, 4-1-22 Hiroo, Shibuya-ku, Tokyo, 150-8935, Japa…","results":"BACKGROUND: Reduced exercise capacity, measured by the 6-min walk distance (6MWD), is a critical prognostic factor in interstitial lung disease (ILD). However, conventional physiological markers often fail to identify ea…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Reduced exercise capacity, measured by the 6-min walk distance (6MWD), is a critical prognostic factor in interstitial lung disease (ILD). However, conventional physiological markers often fail to identify early functional decline. We aimed to evaluate whether the foot-to-foot lower-limb phase angle (F-F PhA), a non-invasive surrogate marker of muscle quality, predicts reduced exercise capacity better than traditional muscle mass and pulmonary function indices. METHODS: In this retrospective study of 68 patients with ILD, F-F PhA was measured using bioelectrical impedance analysis, and erector spinae muscle area (ESM_CSA) via computed tomography. Reduced exercise capacity was defined as 6MWD < 450 m. Multivariable logistic regression models adjusted for age and pulmonary function (%DLCO or %FVC), with internal validation performed via 1000-resample bootstrapping. RESULTS: In multivariable analysis, F-F PhA was independently associated with a 6MWD < 450 m when adjusted for age and %DLCO (OR: 0.228, 95% CI: 0.088-0.591, p = 0.002; bootstrap p = 0.005) or %FVC (OR: 0.213, 95% CI: 0.091-0.496, p = 0.001; bootstrap p = 0.001). ROC analysis showed F-F PhA had the highest discriminative accuracy (AUC: 0.802), outperforming %DLCO (AUC: 0.729) and ESM_CSA (AUC: 0.701). Combining age, %DLCO, and F-F PhA achieved the highest performance (AUC: 0.833). CONCLUSIONS: F-F PhA serves as a robust, independent indicator for predicting reduced exercise capacity in ILD, outperforming conventional muscle mass. As a non-invasive tool, F-F PhA complements established functional tests in screening for early physical decline.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902021","pmid":"42902021","pmcid":"10180005","doi":"10.1111/1471-0528.17567","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902021/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-22","journal_abbr":"Support Care Cancer","journal_full":"SUPPORTIVE CARE IN CANCER","tier":"B","if_val":3.4,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Thresholds for clinical importance to improve interpretation of the EORTC QLQ-COMU26 communication questionnaire.","title_en":"Thresholds for clinical importance to improve interpretation of the EORTC QLQ-COMU26 communication questionnaire.","authors":"Arraras JI, Giesinger J, Kikawa Y, Shamieh O, Bahar I, Koller M, Bredart A, Costantini A et al.","affiliation_highlight":"Medical Oncology Department, Hospital Universitario de Navarra, Navarra Institute for Health Research (IdiSNA), Irunlarr…","results":"PURPOSE: This study defined thresholds for clinical importance (TCIs) for the European Organisation for Research and Treatment of Cancer Communication Questionnaire (EORTC QLQ-COMU26). TCIs support the clinical evaluatio…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: This study defined thresholds for clinical importance (TCIs) for the European Organisation for Research and Treatment of Cancer Communication Questionnaire (EORTC QLQ-COMU26). TCIs support the clinical evaluation of individual patients' communication with professionals. METHODS: In this cross-sectional study, an international sample of cancer patients with mixed diagnoses and treatments completed the EORTC QLQ-COMU26, which comprises six scales and four individual items. Item 26, which evaluates patients' satisfaction with communication with professionals, served as the anchor for detecting a negative event (unsatisfactory communication). Diagnostic accuracy for each domain was determined using ROC analysis, and the sensitivity of the TCIs was evaluated. Sensitivity analyses using multivariate binary logistic regression explored potential variability in TCIs across patient groups. RESULTS: A total of 988 patients from 13 countries participated (mean age, 60.7; 50.0% female). TCIs ranged from 80.3 to 92.5 on the 0-100 metric of the QLQ-COMU26 scales. All TCIs demonstrated sensitivity of at least 0.75, and ROC AUC values ranged from 0.80 to 0.90. Separate TCIs were identified for communication with nurses and doctors, with thresholds > 4 points higher for nurses in five QLQ-COMU26 domains. No evidence supported separate thresholds by age, gender, or treatment intention. CONCLUSION: This study established TCIs with high diagnostic accuracy for the EORTC QLQ-COMU26, supporting its use in clinical practice and research. The findings suggest that the questionnaire can identify patients who report low communication for specific domains and help improve communication in clinical settings.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902539","pmid":"42902539","pmcid":"","doi":"10.1002/wjs.70630","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902539/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"World J Surg","journal_full":"WORLD JOURNAL OF SURGERY","tier":"B","if_val":2.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Optimal Resources for Children's Surgery 2: Tiered Recommendations for Minimum Essential Children's Surgical Procedures Across Health System Levels.","title_en":"Optimal Resources for Children's Surgery 2: Tiered Recommendations for Minimum Essential Children's Surgical Procedures Across Health System Levels.","authors":"Biswangree A, Ameh EA, Lakhoo K, Shalaby M, Cairo SB","affiliation_highlight":"Global Initiative for Children's Surgery (GICS), Sacramento, California, USA.","results":"BACKGROUND: In 2015 the World Health Assembly (WHO), based on recommendations by the Lancet Commission on Global Surgery, passed resolution (68:15) on strengthening emergency and essential surgical care and anesthesia as…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: In 2015 the World Health Assembly (WHO), based on recommendations by the Lancet Commission on Global Surgery, passed resolution (68:15) on strengthening emergency and essential surgical care and anesthesia as a component of universal health coverage. However, children's surgery was not adequately represented and in response, the Global Initiative for Children's Surgery (GICS) published the Optimal Resources for Children's Surgical Care (OReCS) in 2019 providing insight into procedures which should be performed at different facility types. OReCS 2 addresses a gap in both policy and published literature to further define surgical conditions and procedural capabilities by hospital level. METHODS: We performed a review of the literature to identify procedures routinely performed in a variety of settings. We then used an iterative Delphi like approach to identify specialty-specific procedures and nursing skills by hospital level. Participation was open to all members of GICS with representation from 21 working groups and more than 50 low-middle income countries (LMICs) and high-income countries (HICs). Data on essential procedures were collected for twelve specialty groups. Modifications of the recommendations provided by the working groups were made by the executive board based on firsthand knowledge of capabilities at lower-level facilities where subspecialists have less experience. Final recommendations were made based on greater than 75% agreement by respondents and review of the executive board of GICS. RESULTS: Procedures performed at health centers were limited to those not requiring anesthesia or sedation and were largely identified to help triage and stabilize patients for transfer to higher level care. Similarly, first level hospital procedures focused on stabilization and transfer to referral level hospitals for most specialties. Alternatively, specialties such as ophthalmology and dental surgery have identified definitive procedures for lower-level facilities. Procedures performed at the National Children's Hospital level include those requiring specialty providers and equipment such as transplantation, repair of congenital heart disease, and reconstructive surgery for complex trauma, congenital anomalies, and burns. CONCLUSIONS: This updated version of OReCS provides specific examples of procedural capabilities for twelve subspecialties at the health center, first, second, third, and referral level hospitals in LMICs. Whereas the list is not meant to be all inclusive, it provides a framework within which to define the minimum essential material resources, equipment, and personnel by hospital level.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42897936","pmid":"42897936","pmcid":"","doi":"10.1002/wjs.70619","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42897936/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-22","journal_abbr":"World J Surg","journal_full":"WORLD JOURNAL OF SURGERY","tier":"B","if_val":2.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Early and Late Outcomes Following Cardiac Surgery in Patients With Immune-Mediated Inflammatory Diseases.","title_en":"Early and Late Outcomes Following Cardiac Surgery in Patients With Immune-Mediated Inflammatory Diseases.","authors":"Amano K, Takami Y, Akita K, Matsuhashi K, Niwa W, Okamoto K, Kawamoto N, Abe T et al.","affiliation_highlight":"Department of Cardiac Surgery, Fujita Health University School of Medicine, Toyoake, Japan.","results":"BACKGROUND: Immune-mediated inflammatory diseases (IMIDs) are associated with increased cardiovascular risk, but surgical outcomes in the modern era of immunosuppressive therapy remain unclear. We evaluated early and lat…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Immune-mediated inflammatory diseases (IMIDs) are associated with increased cardiovascular risk, but surgical outcomes in the modern era of immunosuppressive therapy remain unclear. We evaluated early and late outcomes after cardiac and thoracic aortic surgery in patients with IMIDs, focusing on the impact of glucocorticoids and disease-modifying antirheumatic drugs (DMARDs). METHODS: A total of 140 patients with IMIDs who underwent cardiac or thoracic aortic surgery between 2008 and 2025 were retrospectively analyzed. The primary endpoints were in-hospital mortality and long-term overall survival. RESULTS: Median age was 70 [61-76] years, and 62% were women. Rheumatoid arthritis was the most common IMID (36%). Prednisolone and DMARDs were used in 68% and 33% of patients, respectively. Procedures included valve (43%), ischemic (26%), and thoracic aortic surgery (23%). In-hospital mortality was 4.3%. During a median follow-up of 5.9 years (93% completeness), overall survival was 91% at 1 year, 87% at 3 years, 78% at 5 years, and 62% at 10 years, respectively. Outcomes did not differ by a surgical category or IMID subtype. Glucocorticoid use was independently associated with worse late survival (HR, 2.91; 95% CI, 1.01-8.41; p = 0.048), whereas DMARD use showed a trend toward improved survival (HR 0.46; 95% CI, 0.19-1.09; p = 0.08). Notably, a dose-dependent relationship was observed, with high-dose prednisolone (≥ 5 mg/day) showing significantly worse survival compared with low-dose (< 5 mg/day) or no glucocorticoid use (p = 0.004). Diabetes mellitus and preoperative anemia were also independent predictors of late mortality. CONCLUSIONS: Cardiac surgery in patients with IMIDs provides acceptable early outcomes but suboptimal long-term survival. Glucocorticoid use was associated with worse late survival, with a dose-dependent relationship, whereas DMARD use showed a nonsignificant trend toward better survival, underscoring the importance of optimized immunosuppressive management.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42897889","pmid":"42897889","pmcid":"","doi":"10.1002/wjs.70611","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42897889/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-22","journal_abbr":"World J Surg","journal_full":"WORLD JOURNAL OF SURGERY","tier":"B","if_val":2.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Optimal Resources for Children's Surgery 2: Tiered Quality Improvement Recommendations for Children's Surgical Care Across Health System Levels.","title_en":"Optimal Resources for Children's Surgery 2: Tiered Quality Improvement Recommendations for Children's Surgical Care Across Health System Levels.","authors":"Sedano S, Ameh EA, Lakhoo K, Shalaby M, Cairo SB","affiliation_highlight":"School of Medicine, University of California, San Francisco, California, USA.","results":"BACKGROUND: The previously published Optimal Resources for Children's Surgical Care (OReCS) addressed disparities in access to high-quality children's surgery in low- and middle-income countries (LMICs) with an emphasis …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The previously published Optimal Resources for Children's Surgical Care (OReCS) addressed disparities in access to high-quality children's surgery in low- and middle-income countries (LMICs) with an emphasis on physical and human resources. Data from high-income countries (HICs) show a clear advantage in outcomes when there is an investment in quality improvement (QI) programs. In-hospital adverse events, many of which are avoidable through implementation of quality improvement programs, contribute disproportionately to morbidity in LMICs. The objective of this document is to make recommendations for quality improvement programming at the hospital level. METHODS: We performed a systematic review of the literature to identify quality improvement programming appropriate for a variety of healthcare settings. We then used an iterative Delphi like approach to rank specific quality improvement programs by hospital level according to the DCP3 and WHO classification systems. Participation was open to all members of the Global Initiative for Children's Surgery (GICS) with representation from 21 working groups and 50 LMICs and HICs. Final recommendations were made based on greater than 75% agreement by respondents and review by the GICS executive board. RESULTS: After three rounds of an iterative Delphi like approach, it is recommended that facilities of all levels, participate in a minimum of local data collection and review and establish an antibiotic stewardship program. Recommendations increased by the complexity of work done at each hospital level with the addition of surgical safety checklists, and protocols for multiple domains including the operating room, radiology, and transfusion medicine at first level hospitals. Surgical quality improvement committees and routine mortality and serious event review processes should be implemented at second level hospitals and above. At the National Children's Hospital level, program recommendations mirror those of most HICs, including continuous data collection and monitoring, multidisciplinary review boards, morbidity and mortality conferences and more. CONCLUSION: Quality improvement is defined in the literature as a systematic, data driven approach to improve outcomes and safety of healthcare delivery. Despite significant barriers in data collection, we recommend a minimum level of quality improvement programming and standardization of care for facilities of various levels.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902389","pmid":"42902389","pmcid":"11983890","doi":"10.1186/s12959-025-00718-8","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902389/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-22","journal_abbr":"J Cardiothorac Surg","journal_full":"Journal of cardiothoracic surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Effect of non-intubated spontaneous breathing video-assisted thoracoscopic surgery (NI-VATS) versus intubated general anesthesia (I-VATS) on the risk of postoperative venous thromboembolism.","title_en":"Effect of non-intubated spontaneous breathing video-assisted thoracoscopic surgery (NI-VATS) versus intubated general anesthesia (I-VATS) on the risk of postoperative venous thromboembolism.","authors":"Ye J, Chen D, Tang Z","affiliation_highlight":"Department of Cardiothoracic Surgery, Affiliated Jinhua Hospital, Zhejiang University School of Medicine (Jinhua Central…","results":"BACKGROUND: By preserving spontaneous breathing and avoiding mechanical ventilation, Non-intubated video-assisted thoracoscopic surgery may attenuate perioperative inflammatory responses and promote early mobilization, t…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: By preserving spontaneous breathing and avoiding mechanical ventilation, Non-intubated video-assisted thoracoscopic surgery may attenuate perioperative inflammatory responses and promote early mobilization, thereby influencing the risk of venous thromboembolism. However, whether the risk of postoperative venous thromboembolism differs between Non-intubated video-assisted thoracoscopic surgery and conventional Intubated video-assisted thoracoscopic surgery remains unclear due to a lack of definitive evidence. We hypothesized that patients undergoing Non-intubated video-assisted thoracoscopic surgery would have a lower risk of postoperative venous thromboembolism. METHODS: A single-center retrospective study was conducted. Patients with lung cancer who underwent video-assisted thoracoscopic lung surgery at the Department of Cardiothoracic Surgery, Jinhua Central Hospital between March 2025 and July 2025 were enrolled and, based on the anesthetic approach, divided into the Non-intubated video-assisted thoracoscopic surgery group (n = 25) and the Intubated video-assisted thoracoscopic surgery group (n = 30). The primary outcome was the risk of venous thromboembolism, as assessed by thrombotic complications, postoperative coagulation parameters, time to early postoperative ambulation, time to first flatus, and time to first defecation. RESULTS: No perioperative venous thromboembolic complications occurred in either group. Regarding coagulation parameters, the D-dimer level in the Non-intubated video-assisted thoracoscopic surgery group was 0.30 (0.04, 0.70) µg/L, which was significantly lower than 0.77 (0.34, 1.46) µg/L in the I-VATS group (P = 0.006). There were no statistically significant differences in prothrombin time (PT) or activated partial thromboplastin time (APTT) between the two groups (P > 0.05). The time to early postoperative ambulation was significantly shorter in the Non-intubated video-assisted thoracoscopic surgery group [0 (0, 0) days] than in the Intubated video-assisted thoracoscopic surgery group [1 (1, 1) days] (P < 0.001). The time to first flatus and defecation was 1 (1, 1) day in the Non-intubated video-assisted thoracoscopic surgery group, significantly shorter than 2 (2, 3) days in the Intubated video-assisted thoracoscopic surgery group (P < 0.001). Furthermore, the Non-intubated video-assisted thoracoscopic surgery group exhibited a significantly attenuated elevation in the inflammatory marker (leukocyte count: 2.24 ± 0.39 × 10⁹/L) compared with the Intubated video-assisted thoracoscopic surgery group (5.82 ± 0.60 × 10⁹/L). CONCLUSIONS: Non-intubated video-assisted thoracoscopic surgery may reduce the risk of venous thromboembolism through several mechanisms: maintaining negative intrathoracic pressure generated by spontaneous breathing, lowering the risk of elevated intra-abdominal pressure, and facilitating early mobilization - all of which enhance venous return; substituting general anesthesia with combined regional anesthesia; and avoiding muscle relaxants, thereby attenuating surgery-induced hypercoagulability and preserving endothelial function.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902007","pmid":"42902007","pmcid":"6084892","doi":"10.1016/j.biopha.2024.117539","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902007/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-22","journal_abbr":"J Mater Sci Mater Med","journal_full":"Journal of materials science. Materials in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Construction of polyethylene glycol-cloaked mesoporous polydopamine nanomaterials co-loaded with anticancer drugs for photo/chemotherapy of lung cancer cells and elucidation of the cell death mechanism.","title_en":"Construction of polyethylene glycol-cloaked mesoporous polydopamine nanomaterials co-loaded with anticancer drugs for photo/chemotherapy of lung cancer cells and elucidation of the cell death mechanism.","authors":"Hu Y, Han X","affiliation_highlight":"Department of the Laboratory, Anting Hospital, Jiading District, Shanghai, 201805, China.","results":"Lung cancer is one of the leading causes of cancer-related deaths worldwide. The mortality rate can be reduced through the development of novel therapeutic drugs for lung cancer.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Lung cancer is one of the leading causes of cancer-related deaths worldwide. The mortality rate can be reduced through the development of novel therapeutic drugs for lung cancer. In this study, we developed nanoparticles (NPs) consisting of polyethylene glycol (PEG)-cloaked mesoporous polydopamine (MP) loaded with indocyanine green (IG) and talazoparib (TZ), designed to combine therapies for lung cancer. MP NPs were synthesized and surface-capped with methoxypolyethylene glycol amine. PEG2K-MP and PEG5K-MP NPs were analyzed using dynamic light scattering, scanning electron microscopy, and transmission electron microscopy. PEG2K-MP@IG&TZ and PEG5K-MP@IG&TZ NPs were developed using the solvent diffusion technique to co-load IG and TZ. The reduction in drug-feeding ratios led to a decrease in the amount of drug loaded and an increase in the encapsulation efficiency. PEG2K-MP@IG&TZ and PEG5K-MP@IG&TZ NPs, which showed excellent drug loading efficiency (IG: 9.9 ± 0.4% and 9.1 ± 0.2%; TZ: 6.8 ± 0.3% and 6.5 ± 0.2%), were chosen for further investigation. The hydrodynamic sizes ranged from 200 to 300 nm. These nanoparticles exhibited improved stability of IG in water, near-infrared laser-stimulated release of TZ, effective photothermal activity, excellent biocompatibility, and increased cellular uptake. These two nanoparticles demonstrated a stronger anticancer effect on lung cancer A549 cells than the combination of IG and TZ when irradiated with 808 nm light in vitro. Fluorescence microscopy revealed that PEG5K-MP@IG&TZ NPs efficiently triggered apoptosis in A549 cells. This study presents an innovative and efficient method for combination therapy against lung cancer cells.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901917","pmid":"42901917","pmcid":"11566285","doi":"10.1016/j.diff.2025.100860","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901917/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-22","journal_abbr":"Cell Death Dis","journal_full":"Cell death & disease","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Identification and validation of NCOA5-ZCCHC3/FGF22 axis as a prognostic marker in lung adenocarcinoma migration and invasion.","title_en":"Identification and validation of NCOA5-ZCCHC3/FGF22 axis as a prognostic marker in lung adenocarcinoma migration and invasion.","authors":"Yu Y, Jin W, Chaogetu E, Zhang X, Liu X, Gao Y, Li F, Su R et al.","affiliation_highlight":"Graduate School of Inner Mongolia Medical University, Hohhot, China.","results":"Lung adenocarcinoma (LUAD), the most common subtype of lung cancer, is associated with substantial global mortality. Nuclear receptor coactivator 5 (NCOA5) has been implicated in several malignancies; however, its functi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Lung adenocarcinoma (LUAD), the most common subtype of lung cancer, is associated with substantial global mortality. Nuclear receptor coactivator 5 (NCOA5) has been implicated in several malignancies; however, its functional role and regulatory mechanisms in LUAD remain largely unknown. In this study, NCOA5 expression was evaluated in 94 paired LUAD and adjacent tissues using immunohistochemistry, RT-PCR, and Western blotting. Functional analyses were conducted using shRNA knockdown, CRISPR-mediated knockout, and overexpression models to assess the effects of NCOA5 on LUAD cell proliferation, migration, invasion, apoptosis, cell cycle progression, and organoid formation. Xenograft models were used to validate tumorigenicity in vivo. IP-MS and co-immunoprecipitation identified NCOA5-interacting proteins, while ChIP-seq and dual-luciferase assays interrogated downstream transcriptional regulation. NCOA5 was significantly upregulated in LUAD tissues and associated with advanced stage, poor differentiation, and reduced overall survival, serving as an independent prognostic factor (P < .040). NCOA5 knockdown inhibited LUAD cell proliferation, migration, invasion, induced G0/G1 arrest, promoted apoptosis, reduced organoid formation, and suppressed xenograft growth, whereas NCOA5 overexpression produced the opposite effects. Among 39 candidate interacting proteins identified by IP-MS, ZCCHC3 was validated as a direct NCOA5-binding partner. ZCCHC3 depletion phenocopied NCOA5 loss and reversed NCOA5-induced proliferation, migration, invasion, and colony formation, supporting a functional NCOA5-ZCCHC3 interaction. ChIP-seq analysis identified fibroblast growth factor 22 (FGF22) as a direct transcriptional target of NCOA5. FGF22 was markedly downregulated in LUAD tissues and higher FGF22 expression was associated with improved patient survival. NCOA5 suppressed FGF22 transcription, while NCOA5 inhibition increased FGF22 expression. Functionally, FGF22 knockdown enhanced LUAD aggressiveness, whereas FGF22 restoration abrogated the oncogenic effects of NCOA5 in vitro and in vivo. Collectively, these findings identify a previously unrecognized NCOA5-ZCCHC3/FGF22 axis that drives LUAD progression and provide new mechanistic insight into the role of NCOA5 in LUAD biology.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901893","pmid":"42901893","pmcid":"4122333","doi":"10.1038/nbt.2859","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901893/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Nat Commun","journal_full":"Nature communications","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Type I IFN promotes ILC2-to-ILC1 plasticity in pre-clinical radiation-induced lung injury.","title_en":"Type I IFN promotes ILC2-to-ILC1 plasticity in pre-clinical radiation-induced lung injury.","authors":"Kim J, Li H, Mannan R, Doherty TA, McGee HM","affiliation_highlight":"Department of Radiation Oncology, City of Hope, Duarte, CA, USA.","results":"Radiation-induced lung injury (RILI) is a common dose-limiting toxicity after radiotherapy for lung cancer, but the immunological mechanisms contributing to RILI pathogenesis remain poorly understood. Here we analyze a R…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Radiation-induced lung injury (RILI) is a common dose-limiting toxicity after radiotherapy for lung cancer, but the immunological mechanisms contributing to RILI pathogenesis remain poorly understood. Here we analyze a RILI mouse model using high-dose, restricted-field irradiation to the left lung. Flow cytometry and cytokine profiling analysis of innate lymphoid cells (ILC) reveals a radiation-induced shift from lung-resident type 2 ILCs (ILC2) toward pro-inflammatory type 1 ILCs (ILC1). Single-cell RNA-sequencing analysis of mouse lung ILC populations after radiation suggests that type I interferon (IFN) promotes radiation-induced ILC2-to-ILC1 plasticity. In vitro, IFN-β stimulation of mouse ILC2s leads to increased expression of the ILC1 markers T-bet and IFN-γ, while IFN-β stimulation of human peripheral blood mononuclear cells increases the ILC1-to-ILC2 ratio. In vivo, inhibition of type I IFN signaling attenuates lung damage after irradiation in our RILI model. Thus, our findings indicate that radiation-induced type I IFN induces ILC2-to-ILC1 plasticity to contribute to RILI pathogenesis, and suggest that targeting type I IFN signaling may be a therapeutic strategy to mitigate radiation-induced lung injury.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901539","pmid":"42901539","pmcid":"","doi":"10.1111/ases.70390","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901539/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-22","journal_abbr":"Asian J Endosc Surg","journal_full":"Asian journal of endoscopic surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Associations Between Tumor-Left Brachiocephalic Vein Distance and Operative Time in Minimally Invasive Subxiphoid Surgery for Thymoma.","title_en":"Associations Between Tumor-Left Brachiocephalic Vein Distance and Operative Time in Minimally Invasive Subxiphoid Surgery for Thymoma.","authors":"Kimura T, Miyashita Y, Nagata H, Kimura K, Kanou T, Ose N, Shintani Y","affiliation_highlight":"Department of General Thoracic Surgery, The University of Osaka Graduate School of Medicine, Suita, Japan.","results":"INTRODUCTION: Tumor proximity to the left brachiocephalic vein (LBCV) may affect vascular exposure and dissection during the subxiphoid approach (SXA). We investigated the association between tumor-LBCV distance and oper…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Tumor proximity to the left brachiocephalic vein (LBCV) may affect vascular exposure and dissection during the subxiphoid approach (SXA). We investigated the association between tumor-LBCV distance and operative time in patients undergoing subxiphoid robot-assisted or video-assisted thoracoscopic surgery for thymoma. METHODS: Consecutive patients who underwent minimally invasive SXA for thymoma between 2019 and 2024 were retrospectively reviewed. The shortest tumor-LBCV distance (d-LBCV) was measured on preoperative computed tomography. Associations of d-LBCV and tumor size with operative time were evaluated using correlation, interaction, and multivariable linear regression analyses. RESULTS: Among 64 patients with clinical Stage I thymoma without radiological evidence of vascular invasion, 45 and 19 underwent robot- and video-assisted thoracoscopic surgery, respectively. Overall, shorter d-LBCV (r = -0.357, p = 0.0037) and larger tumor size (r = 0.328, p = 0.0082) were correlated with longer operative time. In multivariable analysis adjusting for tumor size, surgical platform, and surgical procedure, shorter d-LBCV remained significantly associated with longer operative time (regression coefficient, -7.62 min per 10-mm increase; 95% CI, -13.21 to -2.03; p = 0.008). Surgical procedure was also significantly associated with operative time, whereas tumor size and surgical platform were not. Although platform-specific analyses showed different association patterns, interaction analyses showed no significant differences between RATS and VATS for tumor size or d-LBCV. CONCLUSION: Shorter d-LBCV was independently associated with longer operative time during minimally invasive SXA for thymoma, despite adjustment for tumor size, surgical platform, and surgical procedure. d-LBCV may provide useful anatomical information for preoperative planning; although further validation is required.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901462","pmid":"42901462","pmcid":"","doi":"10.1016/j.ypmed.2026.108683","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901462/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Prev Med","journal_full":"Preventive medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"横断面在线问卷调查 · 描述性分析与线性回归（知识得分预测因素）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":12,"methodology":13,"specialt
