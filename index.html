ns. Multispecific antibodies were designed to target tumor antigens and NK-cell surface markers. Fast protein liquid chromatography and surface plasmon resonance were applied for quality control of antibodies. Using multiple ESCC cell lines and NK cells from different donors, flow cytometry was performed to assess NK cell cytotoxicity and activation. Immunofluorescence assays were used to confirm colocalization. Transcriptome sequencing, flow cytometry and western blots were performed to explore molecular mechanisms. Subcutaneous and metastatic xenograft tumor models were established to evaluate the in vivo antitumor efficacy of antibodies combined with adoptive transfer of NK cells. RESULTS: The expression of EGFR was consistently highly expressed in all ESCC samples, while MET was specifically upregulated in recurrent ESCC, whereas the database also validated two antigens overexpression in tumor tissues. Antibodies were successfully engineered for multiple antigens binding. The tetraspecific antibodies significantly enhanced NK-cell cytotoxicity by up to 30% against ESCC and paclitaxel-resistant cell lines compared with the NK-only group in vitro. Transcriptomic analysis and experimental validation revealed that antibodies triggered immune activation pathways and increased the expression of tumor necrosis factor-α, interferon-γ, and granzyme B in NK cells, but also induced NK cell exhaustion. In vivo, tetraspecific antibodies combined with NK cell infusions exerted superior antitumor efficacy, with an 82.3% tumor volume reduction in the early-stage model and 65.7% in the advanced-stage model compared with controls. The therapeutic efficacy was also observed in the metastatic tumor model. Meanwhile, the combination therapy was well tolerated, with enhanced NK cell infiltration in tumor tissues. CONCLUSIONS: We developed tetraspecific antibodies to effectively bridge ESCC cells and NK cells. The antibodies have the potential to enhance the antitumor activity of NK cells against ESCC. This study supports the clinical translation of tetraspecific antibodies for NK cell-based immunotherapy for ESCC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42925741","pmid":"42925741","pmcid":"","doi":"10.1016/j.lungcan.2026.109663","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925741/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-25","journal_abbr":"Lung Cancer","journal_full":"LUNG CANCER","tier":"A","if_val":5.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"From whole-exome sequencing to functional insight: Characterization of rare germline variants in lung cancer.","title_en":"From whole-exome sequencing to functional insight: Characterization of rare germline variants in lung cancer.","authors":"Bonora S, Daw M, Tabolacci C, Cortellini A, Citarella F, Scattoni ML, Adamo L, Marabotti A et al.","affiliation_highlight":"Department of Chemistry and Biology \"A.","results":"BACKGROUND: Whole-exome sequencing (WES) has greatly expanded the identification of rare germline variants in hereditary cancer predisposition. However, the interpretation of variants of uncertain significance (VUS), par…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Whole-exome sequencing (WES) has greatly expanded the identification of rare germline variants in hereditary cancer predisposition. However, the interpretation of variants of uncertain significance (VUS), particularly in novel candidate genes, remains a major challenge in lung cancer genetics. OBJECTIVE: To functionally characterize selected germline variants identified by WES in patients with familial or suspected hereditary lung cancer and provide evidence for their prioritization. MATERIALS AND METHODS: Three splicing variants in HGS, CDK12, and CEACAM5 genes were investigated by RT-PCR and Sanger sequencing to assess their effect on splicing. Candidate missense variants were analyzed through protein-protein interaction network analysis, gene expression profiling, and structure-based computational modeling to evaluate their potential impact on protein stability and molecular interactions. RESULTS: RNA analysis confirmed that the CDK12 variant produced the previously reported in-frame one amino acid deletion, whereas the HGS variant activated a cryptic splice acceptor site, resulting in an in-frame deletion affecting a region containing a known ubiquitination site. No aberrant splicing was detected for CEACAM5. Network analyses highlighted convergence of three candidate genes (ERBB3, MAP2K1 and RASA2) on receptor tyrosine kinase signaling and the RAS/MAPK pathway. Structural analyses predicted local perturbations affecting membrane interactions, residue interaction networks, or protein stability for variants in the three previous genes and in USP4, supporting their functional relevance. CONCLUSIONS: Integrating RNA-based functional assays with network and structural analyses provides a practical framework for interpreting and prioritizing rare germline VUS identified by WES, supporting the identification of candidate lung cancer susceptibility genes and improving genetic risk assessment.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921453","pmid":"42921453","pmcid":"PMC13693340","doi":"10.1016/j.lana.2026.101652","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921453/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"HIV pre-exposure prophylaxis in US prison settings: a model-based cost-effectiveness study.","title_en":"HIV pre-exposure prophylaxis in US prison settings: a model-based cost-effectiveness study.","authors":"Park Y, Goldhaber-Fiebert JD, Cipriano LE","affiliation_highlight":"Department of Epidemiology and Biostatistics, Schulich School of Medicine & Dentistry, Western University, London, ON, C…","results":"BACKGROUND: HIV prevalence in prisons is three times higher than in the general community, and ongoing transmission risks highlight the importance of prevention, including pre-exposure prophylaxis (PrEP). We evaluated th…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: HIV prevalence in prisons is three times higher than in the general community, and ongoing transmission risks highlight the importance of prevention, including pre-exposure prophylaxis (PrEP). We evaluated the effectiveness and cost-effectiveness of prison-based PrEP programs in four US states. METHODS: We developed a dynamic compartmental model simulating HIV transmission in both general and incarcerated populations, instantiated for four representative US states (standardized population of five million people). We assessed five strategies involving PrEP for specific risk groups in prison compared to the status quo of no PrEP. We assumed 25% uptake among eligible individuals for 20 years. We estimated total lifetime costs (in 2024 USD) and quality-adjusted life-years (QALYs), discounted at 3% annually, incremental cost-effectiveness ratios (ICERs), and HIV infections averted from a healthcare sector perspective. FINDINGS: In Washington, New York, and Georgia, providing PrEP to 25% of people who inject drugs (PWID) in prison prevented 12%-14% of new infections in incarcerated people, and 0.01%-0.02% of new infections in the community, and was cost-saving compared to no PrEP. Expanding eligibility to all high-risk persons (PWID and men who have sex with men (MSM)) prevented more infections and cost less than $60,000 per QALY gained compared to more restrictive policies. In California, where the epidemic is concentrated among MSM rather than PWID, providing PrEP to only MSM costs $32,000 per QALY gained. INTERPRETATION: Prison-based PrEP programs can be cost-saving or cost-effective, averting infections within and outside the prison system. These findings support expanding access to PrEP in prisons, with implementation and funding decisions guided by local HIV epidemiology. FUNDING: Canada Research Chairs Program, Natural Sciences and Engineering Research Council of Canada, National Institute on Drug Abuse.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921383","pmid":"42921383","pmcid":"PMC13693109","doi":"10.1016/j.lana.2026.101662","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921383/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Oropouche virus attack rate in an urban setting outside the Amazon Basin: findings from a post-outbreak seroprevalence survey.","title_en":"Oropouche virus attack rate in an urban setting outside the Amazon Basin: findings from a post-outbreak seroprevalence survey.","authors":"Cavalcanti LPG, Barreto FKA, Lima Neto AS, Oliveira RS, Monteiro HDS, Alencar CH, Freitas ARR, Garcia Filho C et al.","affiliation_highlight":"Faculdade de Medicina, Centro Universitário Christus, Rua João Adolfo Gurgel, 133, Fortaleza, Ceará, 60192-345, Brazil.","results":"BACKGROUND: Oropouche virus (OROV) is transmitted by the biting midge Culicoides paraensis. Historically, it was restricted to small outbreaks in the Amazon region.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Oropouche virus (OROV) is transmitted by the biting midge Culicoides paraensis. Historically, it was restricted to small outbreaks in the Amazon region. Since 2023, genomic reassortment and human-environment interactions facilitated its geographic expansion, including into urban areas. We estimate the OROV attack rate and identify factors associated with infection in an urban area outside the Amazon. METHODS: A randomised cross-sectional serosurvey in the urban area of Baturité, Brazil. Households were selected using stratified probability sampling proportional to census tract population; one resident per household was randomly chosen. Participants completed a questionnaire, and serum samples were tested for OROV IgM using MAC-ELISA. Associations were estimated using prevalence ratios (PR) with 95% confidence intervals from Poisson regression with robust variance. Spatial clustering of seropositives was assessed using kernel density and nearest-neighbours. FINDINGS: Of 392 participants, 212 were seropositive (54·0%). Most infections were asymptomatic/oligosymptomatic (72·6%-154/212). Living near rivers (PR = 1·80; 95% CI: 1·20-2·50) and working from home (PR = 1·70; 95% CI: 1·30-2·30) were associated with higher prevalence of infection. Clustering of seropositivity was found in census tracts close to cultivated and forested areas, and in central urban neighbourhoods. INTERPRETATION: We show large-scale urban OROV transmission, with attack rates exceeding 50%. The high proportion of infections among low mobility individuals suggests peridomestic transmission and vector adaptation to urban microenvironments. Results highlight the need to incorporate OROV into routine surveillance, outbreak preparedness, and differential diagnoses of acute febrile illnesses. FUNDING: Health Surveillance Secretariat/Brazilian Ministry of Health, and Japan International Cooperation Agency.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊，直接影响可切除胸部肿瘤围术期/新辅助方案选择","curation_clinical_value":"阅读后可直接核对可切除胸部肿瘤围术期/新辅助方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921361","pmid":"42921361","pmcid":"PMC13693108","doi":"10.1016/j.lana.2026.101669","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921361/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Safety and sustainability of potable tap water irrigation in endoscopy in Canada: an interrupted time series study.","title_en":"Safety and sustainability of potable tap water irrigation in endoscopy in Canada: an interrupted time series study.","authors":"Ahn HS, Moloo H, Kelly K, Zhang L, Dube C, Rostom A, Shamess J, Bourque M et al.","affiliation_highlight":"Department of Surgery, The Ottawa Hospital, Ottawa, ON, Canada.","results":"BACKGROUND: International guidelines recommend sterile water for endoscopic irrigation despite limited evidence. Single-use plastic sterile water bottles generate substantial costs, greenhouse gas emissions, and micropla…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: International guidelines recommend sterile water for endoscopic irrigation despite limited evidence. Single-use plastic sterile water bottles generate substantial costs, greenhouse gas emissions, and microplastics. We sought to estimate whether replacing sterile water with potable tap water for endoscopic irrigation affected clinical outcomes. METHODS: This quasi-experimental study involved an interrupted time series design at a multi-campus tertiary care academic health system (The Ottawa Hospital, Canada). All adults undergoing esophagogastroduodenoscopy, colonoscopy, flexible sigmoidoscopy, enteroscopy, ileoscopy, or pouchoscopy between February 2024 and August 2025 were included. A system-wide switch to tap water took place on February 10, 2025. The primary outcome was a composite of emergency department visits, unplanned admissions, or deaths within 7 days post-procedure. Infectious complications within 30 days constituted secondary endpoints. Data were obtained from validated institutional databases. Segmented regression modeled the weekly outcome proportion to estimate the step change post-implementation, with a non-inferiority margin of <0.5% absolute risk increase. FINDINGS: A total of 29,522 procedures were performed on 29,423 patients (18,863 pre-implementation; 10,560 post-implementation). Patient and procedural characteristics were comparable. The weekly proportion experiencing the primary outcome was 1.6% in both phases. The post-implementation step change was -0.40% (95% confidence interval [CI] -1.16 to 0.35), with the upper boundary of the 95% CI below the pre-specified non-inferiority margin of 0.5%. Results were similar for infectious complications (step change -0.23%, 95% CI -0.75 to 0.29). INTERPRETATION: Potable tap water was non-inferior to sterile water for endoscopic irrigation with respect to clinical outcomes. These findings provide an evidence base for revising current guideline recommendations that mandate sterile water for endoscopic irrigation. FUNDING: This project was supported by the 2024 Canadian Society of Colorectal Surgeons Research Operating Grant.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921066","pmid":"42921066","pmcid":"PMC13693067","doi":"10.1016/j.lana.2026.101657","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921066/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Clinical and virological characterisation of Oropouche, dengue, and chikungunya during simultaneous co-circulation in the State of Espírito Santo, Brazil: a retrospective observational study.","title_en":"Clinical and virological characterisation of Oropouche, dengue, and chikungunya during simultaneous co-circulation in the State of Espírito Santo, Brazil: a retrospective observational study.","authors":"de Azevedo SSD, Rossi A, Miossi R, Tavares EA, Pereira JDP, Rodrigues IR, Damasceno TCD, Goulart JP et al.","affiliation_highlight":"Laboratório Central de Saúde Pública do Estado do Espírito Santo, Secretaria de Saúde do Estado do Espírito Santo, Vitór…","results":"BACKGROUND: Dengue (DENV), chikungunya (CHIKV), and Oropouche (OROV) viruses co-circulate in Brazil and present with overlapping acute febrile syndromes, complicating clinical differentiation. Comparative data integratin…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Dengue (DENV), chikungunya (CHIKV), and Oropouche (OROV) viruses co-circulate in Brazil and present with overlapping acute febrile syndromes, complicating clinical differentiation. Comparative data integrating clinical phenotyping and viral load dynamics across these arboviruses are limited. METHODS: We conducted a retrospective observational study using linked surveillance and laboratory databases from Espírito Santo State, Brazil (2024-2025). We aimed to compare DENV, CHIKV, and OROV infections and to explore their virological correlates. Cycle threshold (Ct) values, used as a relative semi-quantitative proxy for viral RNA levels, were analysed within each virus to characterise temporal dynamics and clinical expression. Multinomial logistic regression identified clinical features associated with arboviral infection; associations between Ct values and clinical domain scores were assessed using multivariable linear regression adjusted for age, sex, and time since symptom onset. FINDINGS: Among 10,793 cases (4058 DENV, 2508 CHIKV, 4227 OROV), Oropouche affected older individuals (median age 49 years, interquartile range [IQR] 43-56) and was characterised by near-universal fever (97·8%), headache (96·2%), and intense arthralgia (86·4%), with fewer gastrointestinal and mucocutaneous manifestations. After adjustment for age, sex, and time since symptom onset, increased odds of arthritis (OR 5·22, 95% CI 4·08-6·68) and rash (OR 2·39, 95% CI 1·83-3·12) were observed for CHIKV versus OROV. Conversely, nausea (OR 2·98, 95% CI 2·52-3·53), vomiting (OR 2·54, 95% CI 2·01-3·21), and retro-orbital pain (OR 8·00, 95% CI 6·69-9·56) were positively associated with DENV versus OROV. Dengue and chikungunya showed progressive Ct increases over time, consistent with viral decay. Oropouche displayed a non-monotonic, with lower Ct values and higher systemic and musculoskeletal domain scores after adjustment for age, sex, and time since symptom onset. INTERPRETATION: The distinct clinical and temporal patterns identified provide descriptive foundations that may inform future development of diagnostic algorithms and sampling strategies, pending formal predictive validation. FUNDING: This study was partially funded by the Fundação de Amparo à Pesquisa e Inovação do Espírito Santo (FAPES), with additional institutional support from the Brazilian Ministry of Health and the Government of the State of Espírito Santo.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926861","pmid":"42926861","pmcid":"PMC13694901","doi":"10.1016/j.lanepe.2026.101894","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926861/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Eur","journal_full":"Lancet Reg Health Eur","tier":"A","if_val":15.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Treatment restrictions after acute stroke across nine European countries and their association with 90-day mortality: a post hoc analysis of the PRECIOUS randomised controlled trial.","title_en":"Treatment restrictions after acute stroke across nine European countries and their association with 90-day mortality: a post hoc analysis of the PRECIOUS randomised controlled trial.","authors":"Sluis WM, van Amsterdam WAC, de Jonge JC, Reinink H, Ntaios G, Kõrv J, Aamodt AH, Thomalla G et al.","affiliation_highlight":"Department of Neurology and Neurosurgery, Brain Center, University Medical Center Utrecht, Heidelberglaan 100, 3584 CX, …","results":"BACKGROUND: In patients with acute stroke, early withholding or withdrawal of life-sustaining therapies is associated with an increased risk of death. We used practice variation across nine European countries to assess w…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: In patients with acute stroke, early withholding or withdrawal of life-sustaining therapies is associated with an increased risk of death. We used practice variation across nine European countries to assess whether this relation may be causal. METHODS: We performed a post hoc analysis of the PREvention of Complications to Improve OUtcome in elderly patients with acute Stroke (PRECIOUS) trial, a randomised clinical trial of metoclopramide, paracetamol, and/or ceftriaxone started within 24 h of symptom onset in older patients with acute ischaemic stroke or intracerebral haemorrhage (ISRCTN82217627). The frequency of early treatment restrictions, defined as those installed within 24 h after randomisation, was calculated per participating country and their relation with the primary outcome 'death at 90 days' was estimated through: 1) adjustment for confounders with regression analysis with inverse-propensity score reweighting; and 2) comparing patients enrolled in countries with and without early restrictions, adjusted for confounders with regression analysis. FINDINGS: Of 1493 patients enrolled in PRECIOUS between 2016 and 2022, 1451/1493 (97%) were included in this analysis, of whom 276/1451 (19%) had an early treatment restriction. The rate of these restrictions ranged from 0% to 48% across the participating countries. Patients with restrictions were more likely to die within 90 days (inverse propensity-weighted odds ratio (OR) 3.39; 95% CI 2.71-4.25). However, there was no difference in the rate of death at 90 days between countries with and those without restrictions (21.3% vs 23.5%, adjusted OR 1.39; 95% CI 0.8-2.39). INTERPRETATION: The use of treatment restrictions early after stroke varied widely across Europe. Although restrictions were independently associated with an increased rate of death, the comparison of death rates between countries with and those without such restrictions provides no indication that this relation is causal. FUNDING: European Union's Horizon 2020 research and innovation programme; grant agreement No. 634809.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊且明确陈述主要终点，直接影响可切除胸部肿瘤围术期/新辅助方案选择","curation_clinical_value":"阅读后可直接核对可切除胸部肿瘤围术期/新辅助方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42922890","pmid":"42922890","pmcid":"PMC8728295","doi":"10.1002/mco2.71078","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922890/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Applying Proteogenomics to Characterize Molecular Features Associated With a High-Risk HOXB13 Gene Variant in Prostate Cancer Tumors.","title_en":"Applying Proteogenomics to Characterize Molecular Features Associated With a High-Risk HOXB13 Gene Variant in Prostate Cancer Tumors.","authors":"Raspin K, Noor Z, Aref AT, Marthick JR, Jung CH, Donovan S, Williams S, Hains PG et al.","affiliation_highlight":"Menzies Institute for Medical Research University of Tasmania Hobart Tasmania Australia.","results":"The rare HOXB13 G84E variant is one of few established high-risk prostate cancer (PrCa) variants, yet the underlying molecular mechanisms by which it drives tumor development remain unknown. Prostate tumors from six hete…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The rare HOXB13 G84E variant is one of few established high-risk prostate cancer (PrCa) variants, yet the underlying molecular mechanisms by which it drives tumor development remain unknown. Prostate tumors from six heterozygous G84E variant carriers and 18 non-carriers (wild-type) were examined using the Human AmpliSeq Transcriptome Gene Expression Panel, and proteomes were generated by mass spectrometry (SWATH). We identified a 799-gene expression profile and a 75-protein expression profile in G84E-positive tumors when compared with wild-type tumors. Cluster analysis revealed a top-ranked 23 protein profile, which mapped to lipogenesis pathways. Integration of transcriptome and proteome data revealed overlapping differential expression of three genes (NCLN, NFIB, and VASN), two of which have an established link to lipid metabolic pathways. Examination of publicly available transcriptome data from 493 primary PrCa tumors from the The Cancer Genome Atlas (TCGA)   tumors revealed 52 tumors with a similar differential expression profile for these three genes. Herein, an innovative proteogenomic approach was used to map molecular changes unique to HOXB13 perturbation in prostate tumors, revealing upregulation of genes in the steroid metabolic, lipid biosynthesis, and fatty acid metabolic pathways.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921569","pmid":"42921569","pmcid":"PMC13693916","doi":"10.1002/mco2.71088","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921569/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Multi-Omics Insights Into Circulating T-Cell Metabolic Reprogramming and Treg Dysfunction in Moyamoya Disease.","title_en":"Multi-Omics Insights Into Circulating T-Cell Metabolic Reprogramming and Treg Dysfunction in Moyamoya Disease.","authors":"Zheng Z, He Q, Ma X, Zhang B, Li J, Liu C, Mou S, Sun W et al.","affiliation_highlight":"Department of Neurosurgery Beijing Tiantan Hospital Capital Medical University Beijing China.","results":"Moyamoya disease (MMD) is a progressive cerebrovascular disease linked to immune dysregulation, yet T-cell metabolic reprogramming and regulatory T-cell (Treg) function remain poorly understood. Here, we integrated multi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Moyamoya disease (MMD) is a progressive cerebrovascular disease linked to immune dysregulation, yet T-cell metabolic reprogramming and regulatory T-cell (Treg) function remain poorly understood. Here, we integrated multi-omics approaches, including mass cytometry, single-cell RNA sequencing, bulk RNA sequencing, metabolomics, and flow cytometry to characterize T-cell metabolic alterations and Treg dysfunction in MMD, uncovering a key metabolic-immune axis. Compared with healthy controls, MMD patients showed chronic immune activation and broad suppression of amino acid, glycolytic, and fatty acid metabolic pathways. Although Tregs were aberrantly expanded, they displayed metabolic inflexibility, together with impaired intercellular communication. Single-cell transcriptomics indicated Treg-to-Th17 conversion, while flow cytometry confirmed increased IL-17A+ cells within the CD4+FOXP3+ compartment. Besides, these dysfunctional Tregs correlated with advanced Suzuki stages, ischemic stroke, and posterior cerebral artery involvement. Bulk transcriptomic and serum metabolomic analyses further confirmed coordinated immune activation and metabolic suppression at the gene, protein, pathway, and metabolite levels. These findings define a metabolic-immune axis in MMD in which metabolically constrained, functionally unstable Tregs may contribute to neuroinflammation and vascular remodeling, suggesting that restoring Treg metabolic fitness could represent a therapeutic strategy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921308","pmid":"42921308","pmcid":"PMC13693921","doi":"10.1002/mco2.71087","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921308/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Comprehensive Immune Repertoires of T Cell Receptor and B Cell Receptor Identify Key Immune Features Associated With Disease Activity of Systemic Lupus Erythematosus.","title_en":"Comprehensive Immune Repertoires of T Cell Receptor and B Cell Receptor Identify Key Immune Features Associated With Disease Activity of Systemic Lupus Erythematosus.","authors":"Wu J, Zhou Z, Yu A, Lin X, Ren Y, Teng J, Zhu D, Wang F et al.","affiliation_highlight":"Department of Rheumatology and Immunology Ruijin Hospital Shanghai Jiao Tong University School of Medicine Shanghai Chin…","results":"We integrated immune repertoire sequencing (CD4+ and CD8+ T cell receptor [TCR], B cell receptor [BCR]) and transcriptional profiling to characterize the peripheral immune landscape in 32 active systemic lupus erythemato…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"We integrated immune repertoire sequencing (CD4+ and CD8+ T cell receptor [TCR], B cell receptor [BCR]) and transcriptional profiling to characterize the peripheral immune landscape in 32 active systemic lupus erythematosus (SLE) patients, 30 stable SLE patients, and 35 healthy donors. CD4+ and CD8+ TCR α- and β-chain repertoires in SLE patients showed lower diversity, reduced similarity, and more heterogeneous V-J usage, with CD8+ TCR profiles exhibiting relatively consistent stepwise changes across healthy, stable, and active groups. CD8+ T-cell transcriptomics revealed activity-associated upregulation of CD38, S100A11, IFITM3, and LAG3. In addition, BCR immunoglobulin heavy chain (IGH) repertoire analysis showed isotype-specific remodeling in SLE, characterized by contracted IgM/IgD repertoires, increased IgA isotype ratio and richness, and enhanced IgG diversity. Active SLE showed further increased IgG richness with rare-clone enrichment and higher IgM diversity. Among the TCR, BCR, and CD8+ T-cell transcriptomic features evaluated, IGH-derived metrics, particularly IgG- and IgA-associated features, showed apparent within-cohort discrimination between active and stable SLE. Genetic algorithm-based label-guided feature selection followed by hierarchical clustering revealed a multi-omics pattern associated with disease activity within the current cohort. Our study characterized peripheral immune repertoire and transcriptional alterations in SLE and highlighted their value for characterizing disease activity.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921278","pmid":"42921278","pmcid":"PMC13693918","doi":"10.1002/mco2.71086","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921278/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"YAP Fuels Cerebral Cavernous Malformations by Regulating KLF4 Transcriptional Activity and Protein Stability.","title_en":"YAP Fuels Cerebral Cavernous Malformations by Regulating KLF4 Transcriptional Activity and Protein Stability.","authors":"Ye T, Zheng Q, Hu Z, Fan H, Sun Z, Li X, Mo H, Chang C et al.","affiliation_highlight":"Life Sciences Institute Zhejiang University Hangzhou Zhejiang China.","results":"Cerebral cavernous malformations (CCMs), which frequently predispose patients to strokes or seizures, primarily arise from endothelial specific loss-of-function mutations in the CCM genes, and occasionally accompanied by…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Cerebral cavernous malformations (CCMs), which frequently predispose patients to strokes or seizures, primarily arise from endothelial specific loss-of-function mutations in the CCM genes, and occasionally accompanied by gain-of-function mutations in PIK3CA and MAP3K3. While the Hippo pathway is a well-established regulator of tissue homeostasis, its emerging relevance in vascular pathology particularly its precise role in CCM pathogenesis remains poorly understood. In this study, we demonstrate that CCM gene deficiency suppresses endothelial Hippo signaling, as evidenced by diminished LATS activity, alongside concomitant elevation of YAP expression and nuclear translocation in both human and mouse CCM lesions. Notably, endothelial-specific deletion of Yap mitigates CCM lesion formation, reinforces endothelial junctions, enhances inflammatory resistance, and decreases KLF4 protein levels in a CCM mouse model. Conversely, intracranial Adeno-associated virus (AAV)-mediated inhibition of LATS or activation of YAP promoted CCMs formation under Ccm2 deficiency. Mechanistically, under the dual coordination of negative regulation by LATS and positive regulation by MAP3K3, YAP orchestrates KLF4 transcriptional activity and protein stability. This is achieved through a direct interaction with KLF4 that shields it from β-TrCP-mediated proteasomal degradation, thereby driving CCM progression. Collectively, our findings unveil a novel dimension to Hippo pathway regulation and underscore YAP as a pivotal driver of CCM pathogenesis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921250","pmid":"42921250","pmcid":"PMC13693920","doi":"10.1002/mco2.71089","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921250/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Estimating Individualized Survival Benefit of Consolidative Metastasis-Directed Radiotherapy Following Chemoimmunotherapy in Nasopharyngeal Carcinoma With Exclusive Distant Metastasis.","title_en":"Estimating Individualized Survival Benefit of Consolidative Metastasis-Directed Radiotherapy Following Chemoimmunotherapy in Nasopharyngeal Carcinoma With Exclusive Distant Metastasis.","authors":"Wang X, Chen S, Zhang X, Mao L, Chen J, Yan S, Xie J, Gao X et al.","affiliation_highlight":"Department of Head and Neck Surgery Sun Yat-sen University Cancer Center Guangzhou China.","results":"Optimal patient selection for consolidative metastasis-directed radiotherapy (MDRT) after chemoimmunotherapy (CIT) remains uncertain in nasopharyngeal carcinoma (NPC) with exclusive distant metastasis, defined as distant…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Optimal patient selection for consolidative metastasis-directed radiotherapy (MDRT) after chemoimmunotherapy (CIT) remains uncertain in nasopharyngeal carcinoma (NPC) with exclusive distant metastasis, defined as distant metastasis without synchronous locoregional recurrence. This study was aimed at estimating the survival benefit of MDRT and identifying patients most likely to benefit. A total of 1083 patients from two independent centers were analyzed using a target trial emulation with cloning, artificial censoring, and inverse probability of censoring weighting. The emulation estimated a 4.2-month gain in 3-year progression-free survival (PFS) restricted mean survival time with the MDRT strategy (95% CI: 2.4-5.9; bootstrap p < 0.001). Eight survival machine-learning algorithms were developed and compared, among which the gradient boosting machine achieved 3-year PFS AUROCs of 0.875 in internal validation and 0.877 in geographical external validation. Heterogeneous treatment effects were further estimated using a T-learner framework across risk groups defined by recursive partitioning analysis. In the external cohort, model-estimated 3-year absolute risk reductions with MDRT were 21.6%, 14.7%, and 5.7% in intermediate-, low-, and high-risk groups, respectively. The framework was subsequently implemented as a web-based clinical decision-support system. These findings support individualized selection of consolidative MDRT after CIT and provide a practical framework for multidisciplinary decision-making.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926325","pmid":"42926325","pmcid":"","doi":"10.1002/ctm2.70878","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926325/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Clin Transl Med","journal_full":"Clinical and Translational Medicine","tier":"A","if_val":7.9,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Live-cell FRET imaging-based efficacy prediction of EGFR-TKIs in EGFR L858R-mutant NSCLC.","title_en":"Live-cell FRET imaging-based efficacy prediction of EGFR-TKIs in EGFR L858R-mutant NSCLC.","authors":"Li X, Dai L, Yang P, Li S, Peng C, Li S, Sun B, Cai S et al.","affiliation_highlight":"Department of Pain Management, the First Affiliated Hospital of Jinan University, Guangzhou, China.","results":"OBJECTIVES: Functional assays can assist individualised selection of treatment regimens by evaluating the ex vivo response of tumour cells to anticancer therapeutics. However, the two major strategies used to assess resp…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: Functional assays can assist individualised selection of treatment regimens by evaluating the ex vivo response of tumour cells to anticancer therapeutics. However, the two major strategies used to assess responses to targeted drugs, target-based profiling and phenotypic profiling, have inherent limitations. Target-based profiling does not directly capture downstream cell-fate outcomes, whereas phenotypic profiling provides limited mechanistic information on drug action. METHODS: Live-cell fluorescence resonance energy transfer (FRET) microscopy was used to integrate the interaction between EGFRL858R and GRB2 with cellular phenotypic features, thereby predicting the efficacy of EGFR-tyrosine kinase inhibitors (TKIs) at the single-cell level. RESULTS: The target-based drug score (T-score), derived from the interaction between EGFRL858R and GRB2 in living cells co-expressing CFP-EGFRL858R and YFP-GRB2, enabled evaluation of the on-target activity of EGFR-TKIs against EGFRL858R. The phenotype drug score (P-score), constructed from cellular phenotype features, characterised the phenotypic responses induced by EGFR-TKIs. The TP-score, integrating the T- and P-scores, accurately predicted the efficacy of EGFR-TKIs. In living H3255 cells, the TP-score of osimertinib (OSI) was higher than that of gefitinib (GEF). Notably, in H3255 cell-derived xenograft (CDX) mouse models, OSI showed superior in vivo antitumour efficacy compared with GEF. Furthermore, live-cell TP scoring revealed that primary tumour cells from a patient with NSCLC did not respond to OSI, a finding consistent with the absence of actionable EGFR mutations in this patient. CONCLUSIONS: This study demonstrates the clinical feasibility of predicting EGFR-TKI efficacy by integrating EGFRL858R-GRB2 interactions with cellular phenotypic features in single living cells.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926662","pmid":"42926662","pmcid":"PMC13692191","doi":"10.64898/2026.10.08.757672","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926662/","notice_url":"","trial_url":"","pub_date":"2026-Oct-09","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前机制研究 · 基因工程小鼠肺癌恶病质模型的多组学与干预实验（bioRxiv预印本）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":42,"score_breakdown":{"clinical":8,"methodology":20,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":true,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺癌小鼠模型中单靶点细胞因子阻断未能逆转恶病质，而肿瘤诱导前热量限制预适应可减轻恶病质并延长生存","title_en":"Engaging the host adaptive response to nutrient limitation delays cancer cachexia.","authors":"Gomez-Jenkins M, Das T, Ibrahim M, Fard D, Lopez-Darwin S, Raeber J, Powers J, Hu Z et al.","affiliation_highlight":"","results":"","authors_conclusion":"这些发现提示，代谢预适应可广泛抑制系统性炎症，并延缓癌症恶病质的发生和进展。","ai_note":"信息不足：摘要未报告样本量、效应量、置信区间或P值；为bioRxiv预印本，未经同行评审。单靶点细胞因子阻断的剂量、时机、疗程及靶点验证未描述，阴性结果不能外推为所有联合阻断无效。热量限制在肿瘤诱导前实施，临床可转化性有限，且“宿主适应性反应”被概括为保护程序，需警惕机制过度解读。","pico":{"p":"基因工程小鼠肺癌恶病质模型；样本量摘要未报告","ic":"干预/暴露：单靶点阻断IL-6、TNF-α、GDF15、CCL2、LIF、IL17A；或在肿瘤诱导前开始热量限制。对照：摘要未明确描述"},"reason":"为肺癌恶病质的系统代谢与炎症机制提供临床前证据，提示单靶点细胞因子阻断可能不足，并影响恶病质试验的联合干预或代谢预适应策略设计；对胸部肿瘤营养与代谢干预研究有间接启发。","abstract_en":"UNLABELLED: Cancer cachexia is a debilitating wasting syndrome associated with involuntary weight loss, reduced appetite and food intake, adipose and muscle atrophy, and systemic inflammation with induction of a myriad of candidate cachexia factors. Using a multi-omic approach in a genetically engineered mouse model of lung cancer cachexia, we found that early circulating metabolic alterations preceded overt weight loss. Although both cachexia and fasting are characterized by a reduction in food intake, we show that the systemic metabolic changes in cachexia are distinct, indicating a lack of induction in the normal protective response to negative energy balance during cachexia. Cancer cachexia causes profound hepatic reprogramming, and activation of inflammatory programs, alongside muscle atrophy and elevation of circulating cytokines. However, targeting individual candidate cachectic factors such as IL-6, TNF-α, GDF15, CCL2, LIF, and IL17A failed to rescue weight loss or prolong survival. In contrast, caloric restriction initiated prior to tumor induction elicited a program of protection during tumor progression that attenuated multi-tissue inflammatory and catabolic transcriptional responses, preserved lean mass, and prolonged survival. Together, these findings suggest that metabolic preconditioning broadly dampens systemic inflammation and delays the onset and progression of cancer cachexia. HIGHLIGHTS: Despite both fasting and cachexia involve reduced nutrient intake, the metabolic alterations are distinct.Cachexia induces a systemic inflammatory response.Single targeting of implicated cachectic factors fails to rescue weight loss or survival in cancer cachexia.Caloric restriction pre-conditioning to enforce the protective response to nutrient limitation attenuates cachexia.","tags":["肺癌","癌症恶病质","临床前小鼠模型","代谢重编程","热量限制","细胞因子阻断"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924245","pmid":"42924245","pmcid":"PMC13255454","doi":"10.1186/s13019-026-04229-z","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924245/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Surg","journal_full":"Frontiers in surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述 · 肺切除术后肺功能与患者报告结局变化","category":"surgery","category_label":"微创与无管化胸外科","score_total":41,"score_breakdown":{"clinical":16,"methodology":7,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺切除术后肺功能与患者报告结局的变化：叙述性综述（早期下降且多不完全恢复）","title_en":"Postoperative changes in pulmonary function testing and patient reported outcomes following lung resection: a review.","authors":"Parness S, Rierson A, Tasoudis P, Haithcock B","affiliation_highlight":"UNC School of Medicine, Chapel Hill, United States.","results":"","authors_conclusion":"总体而言，术后肺功能呈早期下降后逐渐恢复的模式，但完全恢复至基线并不常见；评估肺切除后果时应同时关注肺功能与患者报告结局。","ai_note":"叙述性综述，未报告检索策略、纳入研究数量、样本量、随访时间及效应量，无法判断是否存在选择性引用；结论为定性综合；‘术后体力活动下降与DLCO未恢复相关’仅为相关性，不能推断因果；肺叶/全肺与亚肺叶之间的差异可能受适应证、切除范围和患者选择混杂影响。","pico":{"p":"可切除非小细胞肺癌接受肺切除的患者；样本量未报告","ic":"比较不同术式（肺叶/全肺切除 vs 亚肺叶切除）及不同术后时间点的肺功能与患者报告结局变化；无系统对照或定量合并"},"reason":"为肺切除术前咨询与术后肺功能、症状随访提供定性框架，并提示DLCO及术后体力活动与恢复的关联，但缺乏可引用的量化效应。","abstract_en":"Pulmonary resection is a primary treatment for patients with resectable non-small cell lung cancer, but removal of lung tissue can result in significant changes in postoperative pulmonary function and patient recovery. This review examines changes in pulmonary function tests (PFTs) and patient-reported outcomes following lung resection, with consideration of differences among surgical procedures and postoperative timepoints. Across studies, pulmonary function demonstrated its greatest decline during the early postoperative period, followed by gradual improvement during subsequent follow-up. However, pulmonary function generally remained below preoperative values, with the magnitude of decline influenced by the extent of lung tissue removed. Patients undergoing lobectomy or pneumonectomy generally experienced greater postoperative reductions than those undergoing sublobar procedures, although outcomes also varied according to the lobe and number of segments resected. Patient-reported outcomes, including dyspnea, pain, physical function, and quality of life, similarly worsened during early recovery but generally improved over time, with some measures returning to baseline. Preoperative pulmonary function, particularly DLCO, remains important for assessing a patient's ability to tolerate resection, while postoperative oxygen requirements are influenced by pulmonary function, patient characteristics, and postoperative complications. Additionally, decreased physical activity after surgery was associated with non-recovery of DLCO. Overall, postoperative pulmonary function follows a pattern of early decline followed by gradual recovery, although complete return to baseline is uncommon. These findings emphasize the importance of evaluating both pulmonary function and patient-reported outcomes when considering the consequences of pulmonary resection.","tags":["肺切除","肺功能","患者报告结局","术后恢复","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923270","pmid":"42923270","pmcid":"PMC10066460","doi":"10.1001/jamanetworkopen.2023.4149","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923270/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述/观点文章 · 提出机制证据矩阵与概念框架，非系统评价，无原始患者数据","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":9,"methodology":8,"specialty":15,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"超越基因签名：NSCLC铜死亡易感性的机制导向框架——代谢-免疫界面的分层构想（叙述性综述，无原始数据）","title_en":"Beyond gene signatures: a mechanism-based framework for cuproptosis susceptibility in non-small cell lung cancer at the metabolism-immunity interface.","authors":"Liang Z, Cheng M, Song Q, Zhou M, Wang Y, Jiang M, Liu S, Zhao X et al.","affiliation_highlight":"The First Affiliated Hospital of Dalian Medical University, Dalian, Liaoning, China.","results":"","authors_conclusion":"现有NSCLC铜死亡文献以基因评分、lncRNA模型和免疫关联签名为主，多可用于假设生成，但罕有展示铜通量、FDX1依赖性、脂酰化DLAT/DLST结合、铁硫簇蛋白丢失或通路特异性药效学证据；因此将铜死亡易感性重构为一个连续的、基于机制的构念，由铜可获得性、TCA/OXPHOS依赖、脂酰化底物负荷、解毒能力与免疫背景共同定义；其临床价值取决于带药效学确认的生物标志物富集试验，而非仅靠回顾性基因签名。","ai_note":"本文为观点/框架类综述，未进行系统检索策略、文献筛选流程或偏倚评估的交代，证据矩阵的分级标准与评分者一致性未描述；'铜死亡易感性'作为连续构念缺乏可操作的阈值与验证数据，属概念性主张；全文无任何定量结果，无法评估其对临床决策的实际影响；对既有基因签名研究的批评方向合理但未提供定量比较。","pico":{"p":"","ic":""},"reason":"为NSCLC铜死亡相关生物标志物研究提供机制分层思路，提示以基因签名替代机制验证的常见缺陷，可作为生物标志物富集试验设计与选题批判的参考框架，但不直接改变当前临床判断。","abstract_en":"Non-small cell lung cancer (NSCLC) has become a biomarker-driven disease, yet durable control remains limited by therapeutic resistance, metabolic heterogeneity, and incomplete predictors of response. Cuproptosis, a copper-dependent form of regulated cell death linked to mitochondrial respiration and lipoylated TCA-cycle proteins, offers a potential metabolic layer for patient stratification. However, the current NSCLC literature is dominated by cuproptosis-related gene scores, lncRNA models, and immune-association signatures. These studies are useful for hypothesis generation but rarely demonstrate copper flux, FDX1 dependence, lipoylated DLAT/DLST engagement, iron-sulfur cluster protein loss, or pathway-specific pharmacodynamics. We therefore organize the NSCLC literature using a mechanistic evidence matrix that separates transcriptomic association, copper-access enrichment, mitochondrial-dependence evidence, canonical target engagement, and clinical pharmacodynamic confirmation. Rather than proposing a new molecular subtype or diagnostic label, we conceptualize cuproptosis susceptibility as a continuous, mechanism-based construct defined by copper access, TCA/OXPHOS dependence, lipoylated substrate burden, detoxification capacity, and immune context. This framework reframes cuproptosis from universal copper toxicity to a conditional therapeutic vulnerability. Its clinical value will depend on biomarker-enriched trials with pharmacodynamic confirmation rather than retrospective gene signatures alone.","tags":["NSCLC","铜死亡","生物标志物","机制框架","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926231","pmid":"42926231","pmcid":"13424186","doi":"10.1038/sj.leu.2404284","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926231/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-25","journal_abbr":"BMC Cancer","journal_full":"BMC CANCER","tier":"B","if_val":4.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Patient-reported outcomes and skeletal symptoms in multiple myeloma stratified by proteasome inhibitor-based therapy: a prospective interdisciplinary cohort study.","title_en":"Patient-reported outcomes and skeletal symptoms in multiple myeloma stratified by proteasome inhibitor-based therapy: a prospective interdisciplinary cohort study.","authors":"Maier JP, Pietsch C, Schmal H, Ntanasis-Stathopoulos I, Terpos E, Ihorst G, Wäsch R, Engelhardt M et al.","affiliation_highlight":"Department of Orthopedics and Trauma Surgery, Faculty of Medicine, Medical Center - University of Freiburg, Freiburg, Ge…","results":"BACKGROUND: Multiple myeloma (MM) frequently causes osteolytic bone disease and skeletal symptoms. Proteasome inhibitors (PIs) are central to MM treatment and in routine practice, PI-based therapy is preferentially selec…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Multiple myeloma (MM) frequently causes osteolytic bone disease and skeletal symptoms. Proteasome inhibitors (PIs) are central to MM treatment and in routine practice, PI-based therapy is preferentially selected for patients with more active or symptomatic disease. Hereby, PIs may also exert bone-modulating effects beyond their antimyeloma activity. Whether these biological effects are reflected in patient-reported outcomes or skeletal symptoms during routine care remains unclear. METHODS: We prospectively enrolled 209 patients with MM during routine interdisciplinary follow-up and stratified them by current PI-based versus non-PI-based treatment status. Sixty-nine patients were reassessed after at least 6 months. Patient-reported outcomes and skeletal symptoms were evaluated using multivariable regression and sensitivity analyses addressing baseline imbalances and treatment selection. RESULTS: Seventy-eight patients (37%) were currently receiving PI-based treatment. In adjusted analyses, current PI-based treatment status was not associated with Quality of Life (β = -0.08, 95% CI -0.45 to 0.29; p = 0.662), health-related status (β = -0.06, 95% CI -0.42 to 0.30; p = 0.740), bone pain (OR 0.92, 95% CI 0.48 to 1.74; p = 0.791), or prevalent osteolytic lesions (OR 1.26, 95% CI 0.53 to 2.96; p = 0.601). QoL and health-related status remained comparable during follow-up. MM-related bone pain was numerically more frequent among patients currently receiving PI-based treatment (46% vs. 33%), although the association did not reach statistical significance after multivariable adjustment (OR 1.80, 95% CI 0.93 to 3.48; p = 0.081). CONCLUSIONS: In this prospective real-world cohort, current PI-based treatment status was not associated with measurable differences in global patient-reported outcomes, overall bone pain, or prevalent osteolytic lesions compared with non-PI-based treatment. MM-related bone pain was numerically more frequent among patients currently receiving PI-based treatment, although the association did not reach statistical significance after multivariable adjustment. These findings provide a real-world description of patient-reported and skeletal outcomes according to current treatment status but do not establish whether the biological effects of proteasome inhibitors on bone remodeling translate into clinically meaningful patient-reported or structural skeletal benefits.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42914145","pmid":"42914145","pmcid":"PMC12572958","doi":"10.1097/ACI.0b013e3283609831","nct_id":"NCT01455129","url":"https://pubmed.ncbi.nlm.nih.gov/42914145/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT01455129","pub_date":"2026-Oct-21","briefing_date":"2026-10-25","journal_abbr":"BMJ Open Respir Res","journal_full":"BMJ Open Respiratory Research","tier":"B","if_val":4.0,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":15,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Tiotropium and clinically important deterioration in mild-to-moderate chronic obstructive pulmonary disease: a post hoc win ratio analysis of the Tie-COPD study.","title_en":"Tiotropium and clinically important deterioration in mild-to-moderate chronic obstructive pulmonary disease: a post hoc win ratio analysis of the Tie-COPD study.","authors":"Jiang Y, Wu F, Lin J, Wan Q, Zhou K, Wu X, Deng Z, Wang Z et al.","affiliation_highlight":"State Key Laboratory of Respiratory Disease & National Clinical Research Center for Respiratory Diseases & National Cent…","results":"BACKGROUND: Clinically important deterioration (CID) has been used to assess chronic obstructive pulmonary disease (COPD) progression by time-to-first-event analysis. However, this does not reveal the clinical importance…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Clinically important deterioration (CID) has been used to assess chronic obstructive pulmonary disease (COPD) progression by time-to-first-event analysis. However, this does not reveal the clinical importance of the CID components. The win ratio may provide a complementary assessment by comparing outcomes according to a prespecified hierarchy. We reanalysed data from the Tie-COPD studywith win ratio to assess the overall treatment benefit associated with tiotropium in patients with mild-to-moderate COPD. METHODS: In this exploratory post hoc study, the unmatched win ratio method was applied to the outcomes observed in the Tie-COPD study comparing 18 µg tiotropium with placebo in patients with mild-to-moderate COPD over 24 months. CID was defined as an occurrence of moderate-to-severe exacerbation, an increase of ≥2 units in COPD Assessment Test (CAT) score or a decrease of ≥100 mL in the forced expiratory volume in 1 s (FEV1). We evaluated the win ratio across all possible hierarchies of CID components. Exploratory inverse-probability-of-censoring weighted (IPCW), and covariate-adjusted IPCW (CovIPCW) analyses were performed to account for censoring. Subgroup analyses were performed with stratification by sex, smoking status, Global Initiative for Chronic Obstructive Lung Disease stage, CAT score and modified Medical Research Council score at baseline. RESULTS: Of the 841 randomised patients, 771 were included in the full analysis set (tiotropium=388; placebo=383). With the clinical hierarchy of CID defined by FEV1, exacerbation and CAT, the win ratio was 2.26 (95% CI 1.87 to 2.73, p<0.001), and the net benefit was 0.35 (95% CI 0.27 to 0.44, p<0.001). Win ratios were greater than 1 across all hierarchies, subgroups and censoring-adjusted analyses. No treatment-by-subgroup interaction was detected (all p for interaction >0.05). CONCLUSIONS: In this exploratory post hoc analysis, tiotropium was associated with a greater overall treatment benefit than placebo in patients with mild-to-moderate COPD. This benefit was also observed in patients with mild disease or fewer respiratory symptoms. The direction of the findings was consistent across alternative CID hierarchies and censoring-adjusted analyses. TRIAL REGISTRATION NUMBER: NCT01455129.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922019","pmid":"42922019","pmcid":"PMC11324377","doi":"10.1002/cam4.72413","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922019/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Pre-Existing and Post-Cancer Major Cardiovascular Disease and Their Association With Mortality Outcomes Among Cancer Survivors in Australia.","title_en":"Pre-Existing and Post-Cancer Major Cardiovascular Disease and Their Association With Mortality Outcomes Among Cancer Survivors in Australia.","authors":"Rahman MM, Bell K, Joshy G, David M, Canfell K, Goldsbury D, Koczwara B, Banks E et al.","affiliation_highlight":"Collaboration for Cancer Outcomes Research and Evaluation (CCORE), School of Clinical Medicine, University of New South …","results":"BACKGROUND: As cancer survival improves, cardiovascular disease (CVD) has emerged as a major competing cause of death. However, population-level evidence on the burden of pre-existing and post-cancer CVD remains limited.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: As cancer survival improves, cardiovascular disease (CVD) has emerged as a major competing cause of death. However, population-level evidence on the burden of pre-existing and post-cancer CVD remains limited. This study aims to quantify pre-existing and post-cancer newly documented major CVD and their association with mortality outcomes among people with cancer. METHODS: Major CVD was identified using linked hospital records among 344,336 adults registered with primary invasive cancer in the New South Wales Cancer Registry from 2006 to 2016. The cohort was followed up until 31 December 2021. Fine-Grey modelling estimated sub-distributional hazard ratios (sHR) for cancer and cardiovascular mortality, and Cox proportional hazard modelling estimated hazard ratio for mortality from any cause across 20 common cancers. RESULTS: Overall, 18% (n = 62,675) of participants had pre-existing CVD within 5 years before cancer diagnosis, varying by age (3% for age < 50 vs. 40% for ≥ 80). Of those without pre-existing CVD (n = 281,661), 27% (n = 76,924) had post-cancer newly documented CVD, with the highest age-standardised incidence rates in pancreatic cancer (716 per 10,000 person-years), followed by lung (657). The median follow-up period was 6.8 years with an interquartile range: 2.1-10.3 The sHR of pre-existing CVD for cancer mortality ranged from 0.99 (95% CI: 0.85-1.13) in cancer of kidney to 1.81 (95% CI = 1.71-1.91) in lymphoma, and for cardiovascular mortality, 1.98 (1.78-2.18) in lymphoma to 4.74 (4.39-5.09) in pancreatic cancer. The sHR of post-cancer newly documented CVD for cancer mortality, ranging from 0.87 (95% CI: 0.69-1.05) in liver cancer to 2.33 (95% CI = 2.04-2.62) in cervical cancer and cardiovascular mortality, ranging from 1.45 (95% CI: 1.18-1.72) in myeloma to 3.39 (95% CI = 2.90-3.88) in liver cancer. CONCLUSION: CVD is prevalent both before and after cancer diagnosis, with strong relations to increased cancer, cardiovascular and all-cause mortality. Population-based strategies to strengthen holistic survivorship care and address key risk factors are essential to improve both cancer and cardiovascular outcomes.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922016","pmid":"42922016","pmcid":"PMC10046843","doi":"10.1007/s10388-019-00675-y","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922016/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The Predictive Value of the Systemic Immune-Inflammation Index Combined With Clinical Stage for the Prognosis of Oesophageal Cancer Patients Treated With Radiotherapy: A Retrospective Cohort Study and Meta-Analysis.","title_en":"The Predictive Value of the Systemic Immune-Inflammation Index Combined With Clinical Stage for the Prognosis of Oesophageal Cancer Patients Treated With Radiotherapy: A Retrospective Cohort Study and Meta-Analysis.","authors":"Ou Y, Liu Q, Yang D, Chen L, Yu J","affiliation_highlight":"Department of Radiotherapy, Changzhou Cancer Hospital (Changzhou Fourth People's Hospital), Changzhou, Jiangsu, China.","results":"OBJECTIVE: This study aimed to investigate the relationship between the systemic immune-inflammation index (SII) and prognosis in patients with oesophageal cancer undergoing radiotherapy, and to evaluate the incremental …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: This study aimed to investigate the relationship between the systemic immune-inflammation index (SII) and prognosis in patients with oesophageal cancer undergoing radiotherapy, and to evaluate the incremental prognostic value of combining SII with clinical TNM stage. METHOD: A retrospective analysis was performed on 159 patients with locally advanced oesophageal squamous cell carcinoma who received radiotherapy. The optimal cut-off value for pre-radiotherapy SII was determined using receiver operating characteristic (ROC) curve analysis, and patients were stratified into low- and high-SII groups accordingly. Univariate and multivariate Cox regression analyses were employed to identify independent prognostic factors. The predictive performance of SII alone, TNM stage alone, and their combination was compared. Primary endpoints were overall survival (OS) and progression-free survival (PFS). RESULTS: The optimal pre-radiotherapy SII cut-off was 506.63. SII showed a tendency to increase during the course of radiotherapy. Short-term efficacy in the low-SII group was significantly better than that in the high-SII group (p = 0.042). Significant differences were observed between the two groups in 1-year, 3-year, and 5-year OS and PFS rates (all p < 0.05). Multivariate Cox regression analysis identified tumour location, TNM stage, gross tumour volume, and pre-radiotherapy SII as independent prognostic factors (all p < 0.05). The area under the curve (AUC) for the combination of SII and TNM stage in predicting survival was significantly larger than that of SII or TNM stage alone. The combined SII-TNM model demonstrated superior predictive performance compared with either parameter individually (both p < 0.05). CONCLUSION: Pre-radiotherapy SII serves as an independent prognostic factor in oesophageal cancer patients undergoing radiotherapy, with higher SII values associated with poorer survival outcomes. Integrating SII with TNM stage provides enhanced predictive accuracy for prognosis in this patient population.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921908","pmid":"42921908","pmcid":"PMC9908297","doi":"10.1002/cam4.72411","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921908/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"RAS-Pathway Mutation Profiles and Clinical Outcomes Among Patients With Colorectal Cancer.","title_en":"RAS-Pathway Mutation Profiles and Clinical Outcomes Among Patients With Colorectal Cancer.","authors":"Kazemian E, Liu L, Waissengrin B, Matejcic M, Sobieski D, Tsai YY, Loroña NC, Nguyen NT et al.","affiliation_highlight":"Cedars-Sinai Cancer, Cedars-Sinai Health Sciences University, Los Angeles, California, USA.","results":"BACKGROUND: Somatic alterations in the RAS-RAF-MAPK and PI3K pathways are key in colorectal cancer (CRC), yet their distribution, co-occurrence patterns, and clinical significance remain incompletely defined. We characte…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Somatic alterations in the RAS-RAF-MAPK and PI3K pathways are key in colorectal cancer (CRC), yet their distribution, co-occurrence patterns, and clinical significance remain incompletely defined. We characterized RAS/MAPK- and PI3K-pathway alterations in a large cohort and assessed their prognostic implications. METHODS: We analyzed whole-exome sequencing data from 1243 paired samples from patients with CRC. Somatic variants in KRAS, NRAS, HRAS, BRAF, and PIK3CA were analyzed to quantify frequencies, codon-level distributions, and co-occurrence patterns. Descriptive somatic mutation status and demographic and clinical characteristics were evaluated using chi-square or Fisher exact tests, and associations with overall survival (OS) were evaluated using multivariable Cox proportional hazards models. RESULTS: Any RAS-family mutation was detected in 507 tumors (40.8%); KRAS, NRAS, and HRAS mutations occurred in 35.3%, 5.4%, and 0.6%, respectively. BRAF V600E was detected in 85 tumors (6.8%), PIK3CA in 221 (17.8%), and KRAS G12C in 38 (3.1%). KRAS codon 12 was the dominant RAS hotspot. KRAS-PIK3CA co-mutations occurred in 126 tumors (10.1% overall; 28.7% of KRAS-mutant tumors), whereas KRAS-BRAF and KRAS-NRAS co-mutations were uncommon, consistent with MAPK pathway mutual exclusivity. RAS-mutant tumors were enriched in right-sided and microsatellite-stable disease (p < 0.001 for both). KRAS, BRAF V600E, and PIK3CA mutation frequencies were higher in right-sided than left-sided tumors. In unadjusted analyses, Hispanic patients had lower KRAS, BRAF V600E, and PIK3CA mutation frequencies than non-Hispanic patients. After adjustment for age, sex, tumor location, and MSI status, the associations with KRAS and PIK3CA were attenuated, whereas the lower frequency of BRAF V600E among Hispanic patients persisted (p < 0.01). Mutation status was not significantly associated with 5-year overall survival. CONCLUSIONS: RAS/MAPK and PI3K pathway alterations in CRC varied primarily by tumor subtype and molecular context, with clinically relevant co-mutation patterns and a targetable KRAS G12C subset. These findings may support future clinical trials targeting the BRAF-RAS axis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924750","pmid":"42924750","pmcid":"","doi":"10.3390/proteomes14040052","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924750/","notice_url":"",
