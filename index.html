anning target volumes (PTVs). Delivery of SBRT in conjunction with systemic therapies was feasible and associated with manageable toxicity profiles. CONCLUSION: In this multicenter real-world cohort, SBRT for C and UC lung tumors was associated with acceptable toxicity and clinically meaningful outcomes when delivered using contemporary techniques and cautious fractionation. Observations in selected subgroups, including patients with EGFR-mutant disease and smaller PTVs, should be interpreted as hypothesis-generating and support individualized clinical decision-making in anatomically high-risk settings.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922006","pmid":"42922006","pmcid":"PMC13106625","doi":"10.1038/s41598-026-43607-4","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922006/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Eosinophil Dynamics May Help Differentiate Immune-Related From TKI-Related Adverse Events During IO-TKI Therapy for Metastatic Renal Cell Carcinoma: A Multicenter Retrospective Study.","title_en":"Eosinophil Dynamics May Help Differentiate Immune-Related From TKI-Related Adverse Events During IO-TKI Therapy for Metastatic Renal Cell Carcinoma: A Multicenter Retrospective Study.","authors":"Tomita M, Tasaki Y, Hamamoto S, Osawa T, Yamashita S, Matsumoto R, Ikoma H, Kawase K et al.","affiliation_highlight":"Department of Clinical Pharmaceutics, Nagoya City University Graduate School of Medical Sciences, Nagoya, Japan.","results":"BACKGROUND: Combination therapy with immune checkpoint inhibitors and tyrosine kinase inhibitors (IO-TKI) is a key treatment option for metastatic renal cell carcinoma (mRCC), but distinguishing immune-related adverse ev…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Combination therapy with immune checkpoint inhibitors and tyrosine kinase inhibitors (IO-TKI) is a key treatment option for metastatic renal cell carcinoma (mRCC), but distinguishing immune-related adverse events (irAEs) from TKI-related adverse events (TKI-AEs) is challenging because of overlapping clinical features. We aimed to evaluate whether eosinophil counts can help differentiate between them. METHODS: In this retrospective multicenter study, 123 patients with mRCC treated with IO-TKI therapy were analyzed. Patients were classified into an irAE group (n = 64) and a TKI-AE group (n = 59). Changes in eosinophil counts from baseline to the start of the second treatment cycle were compared. Receiver operating characteristic (ROC) and logistic regression analyses were performed to assess associations with irAE occurrence. RESULTS: Baseline eosinophil counts did not differ between groups. Eosinophil counts at the start of the second treatment cycle were higher in the irAE group than those in the TKI-AE group (269.6 vs. 189.6 eosinophils/μL; p < 0.05). No significant differences were observed in other blood parameters, including neutrophil, lymphocyte, monocyte, and platelet counts, the neutrophil-to-lymphocyte ratio, or the platelet-to-lymphocyte ratio. Although the overall discriminatory performance was modest (area under the ROC curve = 0.57, sensitivity = 0.30, specificity = 0.94), eosinophil counts ≥ 380/μL were associated with irAEs in both univariate (odds ratio = 7.21) and multivariable (odds ratio = 8.39; p < 0.05) analyses. CONCLUSIONS: Early increases in eosinophil counts were associated with irAEs and may help distinguish irAEs from TKI-AEs during IO-TKI therapy. Given their high specificity but limited sensitivity, eosinophil counts may have utility as an adjunctive rather than stand-alone marker, and prospective validation is warranted.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921979","pmid":"42921979","pmcid":"PMC11564678","doi":"10.1089/jayao.2024.0021","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921979/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Legal Frameworks, Institutional Barriers and Unmet Needs of Young University Students With Cancer in Italy: A Call to Action.","title_en":"Legal Frameworks, Institutional Barriers and Unmet Needs of Young University Students With Cancer in Italy: A Call to Action.","authors":"Toss A, Marziali L, Quarello P, Milano GM, Mascarin M, Puccini A, Maruzzo M, Tornesello A et al.","affiliation_highlight":"Department of Oncology and Hematology, Azienda Ospedaliero-Universitaria di Modena, Modena, Italy.","results":"University students with cancer in Italy face major barriers in maintaining their academic pathways despite existing disability legislation. This brief communication combines an overview of the Italian legal and institut…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"University students with cancer in Italy face major barriers in maintaining their academic pathways despite existing disability legislation. This brief communication combines an overview of the Italian legal and institutional context with findings from a community-led qualitative descriptive needs-assessment. Following a national social media call, the analysis included semi-structured interviews with 69 eligible participants. Interviews were documented through contemporaneous written notes and analyzed manually using descriptive content analysis, combining domains from the interview guide with recurrent categories identified in open-ended responses. Participants described administrative burdens, inconsistent recognition of cancer-related needs, limited access to remote learning and flexible examinations, marked variability in university support, emotional distress, and social isolation. These findings provide preliminary real-world evidence of how existing arrangements are experienced by Italian university students affected by cancer. Although specific interventions were not evaluated, the findings may inform the development and prospective assessment of more consistent academic accommodations, accessible information, individualized support, and integrated psychosocial services.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921956","pmid":"42921956","pmcid":"PMC7254179","doi":"10.1080/07347332.2025.2559636","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921956/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cancer Med","journal_full":"Cancer Medicine","tier":"B","if_val":3.5,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Quality Appraisal of Clinical Practice Guidelines in Psychosocial Oncology Using the AGREE-II Instrument.","title_en":"Quality Appraisal of Clinical Practice Guidelines in Psychosocial Oncology Using the AGREE-II Instrument.","authors":"Bergeron C, Azzi M, Hébert C, Watkins-Martin K, Coroiu A, Loiselle CG, Drapeau M, Körner A et al.","affiliation_highlight":"Department of Educational and Counselling Psychology, McGill University, Montreal, Quebec, Canada.","results":"OBJECTIVE: The use of evidence in clinical practice is essential for the provision of best practice care in psychosocial oncology. However, research demonstrates gaps in the implementation of evidence-based interventions…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: The use of evidence in clinical practice is essential for the provision of best practice care in psychosocial oncology. However, research demonstrates gaps in the implementation of evidence-based interventions and important resource barriers for clinicians. Clinical practice guidelines (CPGs) are designed to translate the latest evidence into recommendations applicable within various clinical domains. A recent study identified 23 English-language, up-to-date psychosocial oncology CPGs. The present study sought to systematically assess the quality of these tools. METHODS: CPGs were independently evaluated by four trained appraisers using the AGREE II tool, consisting of 23 items across six domains. Quality was determined using aggregate and consensus domain scores (0%-100%), with an acceptability cut-off score of 60%. RESULTS: Findings revealed that 20 of the 23 CPGs (87%) met the acceptability threshold (M = 76.45, SD = 12.35). The highest average domain scores were observed for Clarity of Presentation (M = 96.26, SD = 6.25) and Scope and Purpose (M = 87.38, SD = 19.55) while Applicability received the lowest score (M = 33.83, SD = 10.72). Rigor of Development scores (M = 71.17, SD = 17.46) demonstrated substantial variations across CPGs. CONCLUSIONS: Findings indicate that psychosocial oncology CPGs are specific and clear but may benefit from more transparency in reporting procedures and greater consideration of applicability and implementation strategies. These findings may help illuminate guideline developers on gaps in current tools and serve to inform clinicians on the strengths and shortcomings of these tools prior to selecting which ones to integrate within their clinical practice.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42913624","pmid":"42913624","pmcid":"","doi":"10.14309/ctg.0000000000001115","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42913624/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"Clin Transl Gastroenterol","journal_full":"Clinical and Translational Gastroenterology","tier":"B","if_val":3.6,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Psychometric Validation of PROMIS Measures in Acute and Chronic Pancreatitis.","title_en":"Psychometric Validation of PROMIS Measures in Acute and Chronic Pancreatitis.","authors":"Askew RL, Park SK, Bellin M, Fisher WE, Fogel EL, Forsmark CE, Hart PA, Li L et al.","affiliation_highlight":"Department of Psychology, Stetson University, DeLand, FL.","results":"OBJECTIVE: Patient-reported outcome (PRO) measures are essential for evaluating symptom burden and quality of life (QoL) in acute and chronic pancreatitis (AP/CP), yet many instruments used in this patient population lac…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: Patient-reported outcome (PRO) measures are essential for evaluating symptom burden and quality of life (QoL) in acute and chronic pancreatitis (AP/CP), yet many instruments used in this patient population lack robust psychometric evidence. The Patient-Reported Outcomes Measurement Information System (PROMIS) offers standardized measures designed for comparability across populations, but their suitability for AP/CP has not been comprehensively evaluated. The objective of this study was to assess the psychometric properties of PROMIS-29, PROMIS-Global Health, and PROMIS Pain Quality scales in individuals with AP/CP and provide an overview of psychometric standards that facilitate selection of PROs for use in clinical research and patient care. METHODS: Data were drawn from 1,927 participants enrolled in PROCEED, a multi-site longitudinal study across the pancreatitis spectrum, including healthy controls, chronic abdominal pain, acute/recurrent acute pancreatitis and definite CP. Factor models and regressions were used to psychometrically evaluate univariate construct validity, known-groups validity, convergent validity, reliability, structural validity and population invariance. RESULTS: PROMIS measures exceeded all psychometric benchmarks tested. Scores were approximately normally distributed and comprehensively covered the range of each symptom domain. Correlations with other commonly used QoL measures supported convergent validity. PROMIS scores discriminated effectively among diagnostic subgroups and exhibited excellent structural validity and internal consistency reliability. Population invariance assessments indicated that scores are comparable across age, sex, race, and diagnostic subgroups. CONCLUSIONS: This study provides strong preliminary evidence that PROMIS measures meet rigorous psychometric standards that supports their use in patient research and care in AP/CP. Their adoption may enhance measurement consistency and support core outcome sets in clinical research and trials of AP/CP.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926875","pmid":"42926875","pmcid":"PMC13694918","doi":"10.1016/j.ctro.2026.101321","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926875/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Clin Transl Radiat Oncol","journal_full":"Clinical and Translational Radiation Oncology","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Feasibility of reduced PTV margins in magnetic resonance image-guided online adaptive radiotherapy for bladder cancer: a personalised approach.","title_en":"Feasibility of reduced PTV margins in magnetic resonance image-guided online adaptive radiotherapy for bladder cancer: a personalised approach.","authors":"Williams B, Sandoughdaran S, Chick J, Dunlop A, Herbert T, Huddart R, Mitchell A, Nill S et al.","affiliation_highlight":"The Royal Marsden NHS Foundation Trust, London, United Kingdom.","results":"INTRODUCTION: Bladder MRI-guided online adaptive radiotherapy (MRIgART) has enabled a reduction in planning target volume (PTV) margins, reducing normal tissue irradiation. Yet, further margin reduction is limited due to…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Bladder MRI-guided online adaptive radiotherapy (MRIgART) has enabled a reduction in planning target volume (PTV) margins, reducing normal tissue irradiation. Yet, further margin reduction is limited due to workflow duration and intra-fractional bladder variation. This study reports the feasibility of a 5 mm isotropic PTV in whole bladder MRIgART, 55 Gy in 20 fractions daily, and 36 Gy in 6 fractions weekly, with a personalised approach to margin expansion. METHODS: Patients voided their bladders prior to treatment. Following setup, a daily MRI (MRDAILY) was acquired, and an adaptive workflow was performed. An MRI was acquired during delivery to coincide with treatment completion (MRPOST). Time from MRDAILY to MRPOST was recorded. Offline, target coverage of the clinical target volume (CTV) was visually monitored by comparing MRDAILY and MRPOST images. Images were reviewed by the radiation oncologist (RO) if the CTV was outside of the PTV on the MRPOST. Under RO discretion, margins were personalised to the minimum margin that would have encompassed the CTV and applied online for subsequent fractions. In retrospective analysis, MRPOST CTVs were recontoured, and the adaptive plan recalculated. CTV coverage was deemed acceptable if V95% ≥ 95%. If this objective was not met, the gross tumour volume (GTV) was delineated and the dose reported; coverage was deemed acceptable if GTV V95% ≥ 95%. RESULTS: A total of 138 fractions from ten patients were analysed. Median (interquartile range) workflow time was 25.6 (20.8-30.7) minutes. PTV margins were personalised for 31 fractions in three patients. 119 MRPOST images were available for analysis. CTV coverage was achieved in 94% (112/119) of fractions. Where the CTV mandatory objectives were missed (6%; 7/119 fractions), GTV coverage was acceptable in 6 of the 7 fractions. CONCLUSION: Whole bladder MRIgART with 5 mm isotropic PTV margins with a personalised approach to margin expansion is feasible in achieving acceptable CTV coverage.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926552","pmid":"42926552","pmcid":"PMC13692055","doi":"10.64898/2026.10.02.756334","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926552/","notice_url":"","trial_url":"","pub_date":"2026-Oct-09","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Restoration of deficient IL-15 signaling enhances innate lymphoid cell immunity in brain metastasis.","title_en":"Restoration of deficient IL-15 signaling enhances innate lymphoid cell immunity in brain metastasis.","authors":"McMullen TP, Naef P, Zagni E, Tian L, Zhao E, Wechter N, Longworth AJ, Adam I et al.","affiliation_highlight":"","results":"UNLABELLED: Natural killer (NK) cells and type 1 innate lymphoid cells (ILC1s), collectively known as group 1 innate lymphoid cells (ILCs), are critical mediators of anti-tumor immunity, yet their role in brain metastasi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"UNLABELLED: Natural killer (NK) cells and type 1 innate lymphoid cells (ILC1s), collectively known as group 1 innate lymphoid cells (ILCs), are critical mediators of anti-tumor immunity, yet their role in brain metastasis remains poorly defined. Using single-cell RNA sequencing and functional depletion models, we show that group 1 ILCs fail to provide adequate tumor control in breast cancer brain metastasis (BCBM). In contrast to the liver, where diverse, functionally competent group 1 ILC populations facilitate excellent metastatic control, group 1 ILCs in BCBM show limited diversity and profound tissue-specific dysfunction such that their depletion had no effect on tumor burden despite modest parenchymal infiltration. We attribute this group 1 ILC dysfunction to severely restricted IL-15 availability, with IL-15Rα protein detected at 500-fold lower concentration in the brain than in the liver. Local IL-15 complex administration restored group 1 ILC accumulation, cytotoxicity, and tissue residency, significantly reducing brain metastatic burden independent of T cells. Intracranial delivery of IL-15-secreting induced pluripotent stem-cell-derived (iPSC)-NK cells, already in clinical testing for non-small cell lung cancer, significantly reduced tumor burden. Collectively, these findings reveal how tissue-specific differences in cytokine availability shape group 1 ILC population diversity and disease response, establishing localized IL-15 signaling as a compelling strategy to unlock innate immunity against intracranial malignancies. ONE SENTENCE SUMMARY: Group 1 ILCs, including NK cells and ILC1s, can be pharmacologically enhanced with IL-15 to improve control of breast cancer brain metastasis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925469","pmid":"42925469","pmcid":"2905285","doi":"10.1038/sj.bjc.6605682","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925469/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"Chin J Integr Med","journal_full":"Chinese journal of integrative medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Siwuyin Inhibits Esophageal Cancer Metastasis by Modulating PHD 2/3-HIF1α Signal Pathway Mediated by Fumaric Acid.","title_en":"Siwuyin Inhibits Esophageal Cancer Metastasis by Modulating PHD 2/3-HIF1α Signal Pathway Mediated by Fumaric Acid.","authors":"Zhang CC, Li XB, Guo JX, Yuan JF, Ouyang YH, Li J, Shi HJ","affiliation_highlight":"Graduate School of Hebei Medical University, Shijiazhuang, 050011, China.","results":"OBJECTIVE: To explore the specific mechanism by which Siwuyin (SWY) inhibits esophageal cancer metastasis, verification focused on whether its effect is mediated by the fumarate-prolyl hydroxylase domain (PHD)-hypoxia-in…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To explore the specific mechanism by which Siwuyin (SWY) inhibits esophageal cancer metastasis, verification focused on whether its effect is mediated by the fumarate-prolyl hydroxylase domain (PHD)-hypoxia-inducible factor-1 (HIF1α) signaling axis. METHODS: Network toxicology was employed to predict potential targets for exploring the pathways through which fumarate promotes esophageal cancer metastasis. In vitro, KYSE150 and Eca109 cells were treated with monomethyl fumarate (MMF, 50 or 100 µmol/mL) or SWY (150 µg/mL) for 24 h. Scratch and Transwell assays were used to detect cell migration and invasion abilities. Western blot was performed to examine the protein expression of prolyl hydroxylase (PHDs) family members, HIF1α, and epithelial-mesenchymal transition (EMT) markers E-cadherin and vimentin. For in-vivo experiments, C57BL/6 mice were allocated into 5 groups. Esophageal carcinogenesis was induced by 4NQO in drinking water during weeks 1-16. The MMF-treated groups received intragastric administration of MMF at a dose of 30 mg/kg daily druing weeks 17-18. The SWY-treated groups were given 20% SWY solution at a dose of 400 mg/kg daily via drinking water druing weeks 17-24, and the remaining groups received plain drinking water. Western blot, immunofluorescence and immunohistochemistry were applied to detect PHDs and HIF1α expression in mouse esophageal tissues, and HE staining was used to verify tumor metastasis. RESULTS: Network toxicology analysis suggestd that fumarate promoted esophageal cancer development by acting on the HIF1α signaling pathway. Fumarate accumulation promoted esophageal cancer cell migration and invasion. The underlying mechanism involved the downregulation of PHD2 and PHD3 by fumarate accumulation (P<0.01), leading to the stabilization and increased expression of HIF1α (P<0.01). This, in turn, facilitated a decrease in E-cadherin protein expression and an increase in vimentin protein expression, thereby promoting esophageal cancer cell metastasis (P<0.05 or P<0.01). SWY effectively suppressed the promotion of esophageal cancer cell migration and invasion by fumarate accumulation and acted on the PHD2/3-HIF1α signaling pathway (P<0.05 or P<0.01). CONCLUSION: Fumarate accumulation promotes esophageal squamous cell carcinoma (ESCC) metastasis, and SWY could inhibit ESCC cell metastasis by regulating the fumarate accumulation-mediated PHD2/3-HIF1α signaling pathway.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925289","pmid":"42925289","pmcid":"","doi":"10.1016/j.vhri.2026.102152","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925289/","notice_url":"","trial_url":"","pub_date":"2026-Oct-23","briefing_date":"2026-10-25","journal_abbr":"Value Health Reg Issues","journal_full":"Value in health regional issues","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Pricing, Availability, and Affordability of Cancer Medicines in 5 Upper-Middle-Income South American Countries.","title_en":"Pricing, Availability, and Affordability of Cancer Medicines in 5 Upper-Middle-Income South American Countries.","authors":"Torres-Nolasco MF, Villa-Ponce D, Gentille C","affiliation_highlight":"Department of Internal Medicine, Jacobi Medical Center / Albert Einstein College of Medicine, Bronx, NY, USA.","results":"OBJECTIVES: This study aimed to describe the pricing, availability, and affordability of antineoplastics approved by the Food and Drug Administration from 2016 to 2021 and those on the 2021 World Health Organization Esse…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: This study aimed to describe the pricing, availability, and affordability of antineoplastics approved by the Food and Drug Administration from 2016 to 2021 and those on the 2021 World Health Organization Essential Medicine List (WHO EML) in 5 upper-middle-income South American countries (availability data only for Peru). METHODS: We collected publicly available data from Peru, Colombia, Brazil, Argentina, and Paraguay. Prices were converted to US dollars (USD) using purchasing power parities and reported per defined daily dose (DDD). Availability data were only available in Peru and were determined by the number of pharmacies stocking each drug. Affordability was measured as the number of days a minimum-wage worker would need to work to afford 1 DDD. RESULTS: Forty-one medications were included: 18 WHO EML and 23 non-EML drugs. Median prices were 230.42 USD/DDD and 761.25 USD/DDD for WHO EML and non-EML drugs, respectively. In Peru, >99% of cancer drugs were exclusively sold in privately owned pharmacies; only 13 non-EML drugs were available. Median affordability was 10.36 days and 27.55 days for the WHO EML and non-EML drugs, respectively. WHO EML drugs were most affordable for breast cancer (0.26 days) and least affordable for melanoma (37.68 days), whereas non-EML drugs were most affordable for prostate cancer (15.5 days) and least affordable for lung cancer (31.76 days). CONCLUSION: Prices are variable in upper-middle-income South American countries; newer therapies are more expensive and unaffordable, requiring more than 25 days of minimum wage work to afford 1 DDD of most non-EML drugs. Limited availability was evident in Peru. This highlights the need for policies to improve access to treatment in the region.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924621","pmid":"42924621","pmcid":"","doi":"10.7189/jogh.16.01005","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924621/","notice_url":"","trial_url":"","pub_date":"2026-Oct-23","briefing_date":"2026-10-25","journal_abbr":"J Glob Health","journal_full":"Journal of global health","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Improving equity in respiratory disease outcomes in Africa using data-driven tools: National Institute of Health Care and Research's (NIHR) EQUI-RESP-AFRICA project.","title_en":"Improving equity in respiratory disease outcomes in Africa using data-driven tools: National Institute of Health Care and Research's (NIHR) EQUI-RESP-AFRICA project.","authors":"Rudan I, Ozoh OO, Agbre-Yace ML, Bigogo G, Dangor Z, Saidu Y, Uneke C, Kourouma KR et al.","affiliation_highlight":"Centre for Global Health, Usher Institute, University of Edinburgh, UK.","results":"Chronic obstructive pulmonary disease, pneumonia, influenza, asthma, tuberculosis, lung cancer, and COVID-19 are all prevalent in Africa, where they cause a very large burden on the population's health, but are managed b…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Chronic obstructive pulmonary disease, pneumonia, influenza, asthma, tuberculosis, lung cancer, and COVID-19 are all prevalent in Africa, where they cause a very large burden on the population's health, but are managed by health systems with a limited capacity for prevention, diagnosis, and treatment. They are also underlaid by substantial inequities in outcomes, with the poorest who have no access to care being affected the most. An interdisciplinary group of academics, policymakers, representatives of non-governmental organisations (NGOs), patients, and civil society are implementing a programme to address key respiratory diseases (RD) in five African countries where morbidity and mortality from RD is very large: Nigeria, Kenya, Cameroon, Cote d'Ivoire, and South Africa. The aim is to build capacity, conduct quality research and an intervention trial, and engage communities and policymakers in order to achieve demonstrable and equitable reductions in morbidity and mortality from RD through evidence-based improvements in prevention, diagnosis, treatment, interventions, and policies. The EQUI-RESP-AFRICA project will map the landscape of respiratory medicine in partner countries through rapid reviews of the available literature and data; engage relevant in-country stakeholders; study patients' and providers' preferences and needs; identify research priorities using the Child Health and Nutrition Research Initiative method; and conduct summer schools for capacity building in data science and machine learning/artificial intelligence, in community engagement, and in advocacy for and the use of the Equitable Impact Sensitive Tool (EQUIST) and Pathways to Survival (PATHS) tool. The project will also assess national health system preparedness for emerging infections, identify bottlenecks for early response, assess oxygen capacity and security, study adherence to international guidelines, and conduct qualitative studies to understand barriers to seeking care. It will also explore the feasibility of delivering a pulmonary rehabilitation programme through a randomised controlled trial. Ultimately, the programme will link evidence with policy using the EQUIST and PATHS tools to improve equity in outcomes and identify bottlenecks that lead to morbidity and mortality from respiratory causes. Through high-level meetings, it will prioritise the implementation of equitable interventions that are appropriate to each African context and tailored to patients' needs. A team of social scientists and NGOs, joined by a team of researchers of diverse backgrounds, will engage communities, stakeholders and policymakers to build capacity through summer schools, and disseminate the results through a dedicated project website, the Journal of Global Health, the Journal of the Pan-African Thoracic Society, collaborating NGOs, and mainstream and social media.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924474","pmid":"42924474","pmcid":"","doi":"10.1039/d6ob01399f","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924474/","notice_url":"","trial_url":"","pub_date":"2026-Oct-23","briefing_date":"2026-10-25","journal_abbr":"Org Biomol Chem","journal_full":"Organic & biomolecular chemistry","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Nile Blue: a versatile scaffold for modulating DNA-interacting properties.","title_en":"Nile Blue: a versatile scaffold for modulating DNA-interacting properties.","authors":"Kamzeeva P, Dolgusheva V, Alferova V, Nolde D, Abdullaev L, Lubenskaya A, Belyaev E, Ryskina A et al.","affiliation_highlight":"Shemyakin-Ovchinnikov Institute of Bioorganic Chemistry of Russian Academy of Sciences, Moscow 117997, Russia.","results":"Nile Blue (NB) is a red-emitting phenoxazine dye with affinity for DNA G-quadruplexes (G4s), yet its low fluorescence quantum yield in aqueous media and limited selectivity restrict biological applications. We synthesize…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Nile Blue (NB) is a red-emitting phenoxazine dye with affinity for DNA G-quadruplexes (G4s), yet its low fluorescence quantum yield in aqueous media and limited selectivity restrict biological applications. We synthesized three NB derivatives bearing hydroxy (5a), amino (5b), or carboxyl (5c) substituents. These derivatives exhibit blue-shifted absorption/emission maxima (approximately 40 nm) relative to NB, enhanced quantum yields (19-27% vs. 3% in aqueous buffer), and up to a 4-fold increase in brightness. Their interactions with parallel, hybrid, and antiparallel DNA G4s and a DNA hairpin were systematically investigated. The neutral 5a and positively charged 5b bound G4s presumably via stacking, resulting in hypochromism, red-shifted absorbance maxima, and fluorescence quenching. In turn, the negatively charged 5c showed negligible binding. Circular dichroism melting experiments revealed that 5a stabilizes only parallel G4s, whereas 5b stabilizes all G4 topologies, with neither compound affecting the DNA hairpin. Microscale thermophoresis demonstrated that 5b binds parallel G4s with submicromolar affinity, exhibiting up to 100- and 1000-fold selectivity over other G4 topologies and the DNA hairpin, respectively. Leveraging the efficient quenching of 5b by G4s, we suggested a red-fluorescent Nile Blue Displacement Assay (NBDA) for profiling G4 ligands, which provided dissociation constants comparable to those obtained in the standard thiazole orange-based displacement assay but with the advantage of monitoring emission enhancement in the red region. In cytotoxicity tests, 5b inhibited the proliferation of lung adenocarcinoma A549 cells with an IC50 value comparable to that of the G4 ligand pyridostatin and a superior selectivity index vs. non-cancerous HEK293T cells. Due to its enhanced photophysical properties and selective cytotoxicity, 5b is a promising lead for further studies as an antitumor and/or theranostic agent.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924072","pmid":"42924072","pmcid":"PMC8776973","doi":"10.1159/cro/abzag008","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924072/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Case Rep Oncol","journal_full":"Case reports in oncology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"病例报告 · 单例（含术前CT回顾性复核与病理/Ki-67评估）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":12,"methodology":5,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"患者（单例）","metric":"肺结节1直径变化（7年）","val":"3 mm→10 mm","stat":"","grounded":true,"checks":[{"num":"10","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者（单例）","metric":"肺结节2直径变化（7年）","val":"3 mm→7 mm","stat":"","grounded":true,"checks":[{"num":"7","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"原发灶","metric":"Ki-67标记指数","val":"7%","stat":"","grounded":true,"checks":[{"num":"7%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"转移灶","metric":"Ki-67标记指数","val":"20%","stat":"","grounded":true,"checks":[{"num":"20%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者（单例）","metric":"PET氟脱氧葡萄糖摄取","val":"无异常摄取","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"患者（单例）","metric":"肺结节1直径变化（7年）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者（单例）","metric":"肺结节2直径变化（7年）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"原发灶","metric":"Ki-67标记指数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「原发灶」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"转移灶","metric":"Ki-67标记指数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「转移灶」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者（单例）","metric":"PET氟脱氧葡萄糖摄取","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"常规A型胸腺瘤术后7年出现缓慢增大的双肺转移并呈非典型A型胸腺瘤组织学特征：一例病例报告","title_en":"Atypical Type A Thymoma Identified in Slowly Growing Pulmonary Metastases from Type A Thymoma: A Case Report.","authors":"Shintani H, Wakama S, Tokuhara K, Kataoka N","affiliation_highlight":"Department of Surgery, Kishiwada Tokushukai Hospital, Osaka, Japan.","results":"双肺结节在7年间分别由3 mm增大至10 mm、由3 mm增大至7 mm；PET未见异常氟脱氧葡萄糖摄取；转移灶示A型胸腺瘤肺转移，伴局灶细胞密度增高和核分裂活性增加，符合非典型A型胸腺瘤，未见坏死；原发灶与转移灶Ki-67标记指数分别为7%和20%","authors_conclusion":"即使表面低风险的A型胸腺瘤也可能表现为惰性但转移性的生物学行为，并可在长期病程中出现非典型组织学特征；对A型胸腺瘤患者进行仔细的长期监测和详细病理评估（包括Ki-67标记指数）可能很重要","ai_note":"单例病例报告，无分母、无对照，不能据此推断A型胸腺瘤的转移风险、最佳随访间隔或Ki-67阈值；PET阴性而病理证实转移，提示影像随访策略需结合病史，但该推断的证据级别很低；非典型A型胸腺瘤为较新实体，本例原发灶为常规A型胸腺瘤而转移灶呈非典型特征，其诊断可重复性与临床意义信息不足","pico":{"p":"79岁男性，既往因前纵隔肿瘤行完整切除，术后病理为常规A型胸腺瘤；本次因双肺结节逐渐增大就诊（n=1）","ic":"胸腔镜左肺下叶楔形切除；回顾性复核术前CT、PET及原发灶与转移灶病理/Ki-67；无对照组"},"reason":"提示A型胸腺瘤术后长期随访中，缓慢增大的肺结节可能是转移灶，并可能伴随组织学非典型转化；为胸腺瘤患者肺结节判读和随访决策提供个案警示，但不足以改变常规实践","abstract_en":"INTRODUCTION: Type A thymoma is generally considered a low-risk thymoma subtype with an excellent prognosis and low rates of distant metastasis. Atypical type A thymoma is a recently established entity characterized by more aggressive biological behavior despite retaining the morphology of conventional type A thymoma. Patients with primary conventional type A thymoma who subsequently develop recurrence with atypical histological features are extremely rare. CASE PRESENTATION: A 79-year-old man was referred to our hospital due to gradual enlargement of bilateral pulmonary nodules. Seven years earlier, he had undergone complete resection of an anterior mediastinal tumor, which had been diagnosed as conventional type A thymoma. Retrospective review of preoperative computed tomography images revealed that small pulmonary nodules had already been present at the time of the initial surgery but had yet to be identified. The nodules enlarged slowly from 3 mm to 10 mm and from 3 mm to 7 mm over the 7-year period. Positron emission tomography showed no abnormal fluorodeoxyglucose uptake. After thoracoscopic wedge resection of the left lower lobe lesion, histopathological examination demonstrated pulmonary metastasis of type A thymoma with focal hypercellularity and increased mitotic activity, consistent with atypical type A thymoma. No necrosis was identified. The Ki-67 labeling indices of the primary and metastatic lesions were 7% and 20%, respectively. CONCLUSION: This case demonstrates that even apparently low-risk type A thymoma may exhibit indolent but metastatic behavior and may develop atypical histological features during a prolonged clinical course. Careful long-term surveillance and detailed pathological evaluation, including assessment of the Ki-67 labeling index, may be important in patients with type A thymoma.","tags":["A型胸腺瘤","肺转移","非典型转化","Ki-67","长期随访"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924008","pmid":"42924008","pmcid":"PMC9006838","doi":"10.1159/cop/acaag004","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924008/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Case Rep Ophthalmol","journal_full":"Case reports in ophthalmology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Severe Intraocular Inflammation Mimicking Masquerade Syndrome in a Patient Treated with Dupilumab: A Case Report.","title_en":"Severe Intraocular Inflammation Mimicking Masquerade Syndrome in a Patient Treated with Dupilumab: A Case Report.","authors":"Hu L, Scupola A, Caputo CG, Pagliara MM, Mottola F, Campaniello G, Savino G, Fossataro C et al.","affiliation_highlight":"Department of Ophthalmology, \"Fondazione Policlinico Universitario A.","results":"INTRODUCTION: The aim of the study was to report a case of severe vision-threatening intraocular inflammation with exudative retinal detachment presenting as a masquerade syndrome in a patient receiving dupilumab therapy…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: The aim of the study was to report a case of severe vision-threatening intraocular inflammation with exudative retinal detachment presenting as a masquerade syndrome in a patient receiving dupilumab therapy for severe bronchial asthma. CASE PRESENTATION: A 51-year-old male with severe bronchial asthma developed sudden-onset no light perception (NLP) vision, iris rubeosis, pupillary seclusion, and total exudative retinal detachment in the right eye during his second cycle of dupilumab treatment. The clinical presentation raised strong suspicion for intraocular malignancy. Comprehensive evaluation including fluorescein and indocyanine green angiography, B-scan ultrasonography, magnetic resonance imaging, and positron emission tomography-computed tomography (PET-CT) was performed. PET-CT demonstrated intense metabolic activity in the right eye (SUV max 19.6) and a pulmonary nodule (SUV max 3.5). Lung biopsy revealed inflammatory changes only, and vitreous sampling excluded malignancy. Dupilumab was discontinued, and systemic and topical corticosteroids were administered. Despite treatment, the eye remained NLP. The course was further complicated by sinusitis and orbital cellulitis, requiring hospitalization. Over more than 12 months of follow-up, the right eye progressed to chronic hypotony and gradual phthisis bulbi. Application of the Naranjo Adverse Drug Reaction Probability Scale yielded a score of 6, classifying the association as probable. CONCLUSION: This case represents a severe dupilumab-associated ocular complication. Clinicians prescribing dupilumab should be vigilant for severe ocular adverse events beyond the commonly recognized conjunctivitis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923993","pmid":"42923993","pmcid":"PMC10317875","doi":"10.1007/s00259-023-06249-6","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923993/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-25","journal_abbr":"ACS Omega","journal_full":"ACS omega","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Synthesis and Preliminary Biological Evaluation of a Structurally Modified Niraparib-Based PARP-Targeted PET Tracer for Tumor Imaging.","title_en":"Synthesis and Preliminary Biological Evaluation of a Structurally Modified Niraparib-Based PARP-Targeted PET Tracer for Tumor Imaging.","authors":"Deng J, You D, Zhang C, Tian C, Liu X, Dou X, Zhao Y, Chen Y et al.","affiliation_highlight":"Department of Nuclear Medicine, Affiliated Hospital of Southwest Medical University, No.","results":"Poly-(ADP-ribose) polymerase (PARP) is highly expressed in various malignancies and represents an important therapeutic target. Noninvasive evaluation of PARP expression is therefore of potential clinical significance fo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Poly-(ADP-ribose) polymerase (PARP) is highly expressed in various malignancies and represents an important therapeutic target. Noninvasive evaluation of PARP expression is therefore of potential clinical significance for patient stratification. In this study, we developed and evaluated [68Ga]-Ga-DOTA-MK-4827, a structurally modified PARP-targeted radiotracer derived from niraparib, featuring a two-carbon linker between the DOTA chelator and the pharmacophore. [68Ga]-Ga-DOTA-MK-4827 demonstrated high uptake in MDA-MB-231 and OE-19 tumors with elevated PARP-1 expression, which was significantly reduced by blocking, supporting a PARP-related component of tumor accumulation. The tracer exhibited favorable pharmacokinetics, including high hydrophilicity and predominantly renal clearance, resulting in low abdominal background activity. Positron emission tomography (PET) imaging enabled clear tumor visualization with good contrast, supported by biodistribution findings. Preliminary clinical imaging further showed notable uptake in an esophageal cancer lesion, with immunohistochemical confirmation of PARP-1 expression in the biopsied tissue. These results suggest that [68Ga]-Ga-DOTA-MK-4827 has potential as a PARP-targeted PET tracer for tumor imaging and merits further investigation in larger clinical cohorts.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923858","pmid":"42923858","pmcid":"PMC11542414","doi":"10.1002/art.27728","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923858/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"Exp Ther Med","journal_full":"Experimental and therapeutic medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Postoperative polymyalgia rheumatica after lung cancer resection in the absence of immune checkpoint inhibitors: A case report and literature review.","title_en":"Postoperative polymyalgia rheumatica after lung cancer resection in the absence of immune checkpoint inhibitors: A case report and literature review.","authors":"Wen Y, Zhang Y, Wu M, Zhang P, Jin X","affiliation_highlight":"Department of Geriatrics, Jiangsu Province (Suqian) Hospital, Suqian, Jiangsu 223800, P.R.","results":"The present case report describes the development of polymyalgia rheumatica (PMR) in a 73-year-old male patient following lung cancer resection in the absence of prior exposure to immune checkpoint inhibitors (ICIs). Fol…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The present case report describes the development of polymyalgia rheumatica (PMR) in a 73-year-old male patient following lung cancer resection in the absence of prior exposure to immune checkpoint inhibitors (ICIs). Following a left upper lobectomy, the patient presented with a persistent fever and diffuse myalgia and arthralgia, which was unresponsive to antibiotic therapy. Subsequently, the patient was treated with non-steroidal anti-inflammatory therapy, which led to rapid clinical improvement and complete resolution of PMR-associated symptoms during the 6-month follow-up. Unlike the well-recognized ICI-associated PMR, the present case highlights a distinct postoperative presentation, suggesting that tumor-associated inflammation and surgical stress may act as independent triggers. Through a literature review, the present study further explores the potential mechanistic links between lung cancer and PMR, including the role of pro-inflammatory cytokines such as interleukin-6. These findings provide additional insight into PMR pathogenesis beyond immunotherapy-related mechanisms and may aid in the differential diagnosis of an unexplained fever and musculoskeletal symptoms in postoperative patients with cancer.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923658","pmid":"42923658","pmcid":"PMC11463108","doi":"10.62347/UKYY2328","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923658/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Am J Transl Res","journal_full":"American journal of translational research","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Intrapleural anti-PD-1 injection enhances T-cell immune responses and improves clinical outcomes in elderly patients with advanced lung cancer and malignant pleural effusion.","title_en":"Intrapleural anti-PD-1 injection enhances T-cell immune responses and improves clinical outcomes in elderly patients with advanced lung cancer and malignant pleural effusion.","authors":"Liu Y, Cong Y, Liang M, Hou X, Ding H","affiliation_highlight":"The First Dongguan Affiliated Hospital, Guangdong Medical University Dongguan, Guangdong, China.","results":"OBJECTIVE: To investigate the efficacy of intrapleural anti-PD-1 therapy in elderly patients with advanced non-small cell lung cancer (NSCLC) complicated by malignant pleural effusion (MPE), and to assess its impact on T…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To investigate the efficacy of intrapleural anti-PD-1 therapy in elderly patients with advanced non-small cell lung cancer (NSCLC) complicated by malignant pleural effusion (MPE), and to assess its impact on T-cell subset dynamics. METHODS: A total of 152 elderly patients (≥65 years) with advanced NSCLC and MPE were enrolled. All patients received a single intrapleural injection of anti-PD-1 antibody (Sintilimab, 100 mg) after thoracentesis and drainage. Clinical outcomes, adverse events, and quality-of-life measures were evaluated at baseline, 5 weeks, and 10 weeks after treatment. Concurrently, peripheral blood and pleural effusion T-cell subsets, as well as pleural effusion levels of lactate dehydrogenase (LDH), tumor necrosis factor-α (TNF-α), and interleukin-6 (IL-6) were also measured. RESULTS: The pleural atresia rates at 5 and 10 weeks were 75.7% and 64.5%, respectively. The objective response rate (ORR) increased from 29.0% at 5 weeks to 38.2% at 10 weeks, and disease control rate (DCR) from 59.9% to 76.4%. Karnofsky Performance Status (KPS) score improved significantly from baseline (57.3 ± 9.6) to 5 weeks (66.5 ± 9.2) and 10 weeks (74.5 ± 8.3), Borg scores decreased from (6.1 ± 1.3) to (3.8 ± 0.9) and (3.1 ± 0.7), and Visual Analogue Scale (VAS) scores decreased from (4.5 ± 1.1) to (2.8 ± 0.5) and (2.2 ± 0.6) (all P<0.01). At 5 weeks, peripheral blood CD3+, CD4+, and CD8+ T cells increased from baseline (53.3 ± 8.6%, 28.25 ± 5.64%, 20.5 ± 4.6%) to (60.5 ± 9.5%, 32.5 ± 7.2%, and 25.2 ± 6.3%), while the CD4+/CD8+ ratio decreased from (1.38 ± 0.11) to (1.29 ± 0.12) (all P<0.01); in pleural effusion, corresponding values rose to (69.5 ± 4.3%, 34.5 ± 6.4%, and 28.8 ± 7.7%), with the ratio falling to (1.19 ± 0.04) (P<0.01). By 10 weeks, peripheral values further increased to (68.7 ± 8.4%, 36.2 ± 6.9%, and 30.5 ± 5.2%), and the ratio dropped to (1.19 ± 0.06) (P<0.01); pleural effusion values reached 74.5 ± 7.4% (CD3+), 37.1 ± 6.2% (CD4+), and 32.9 ± 7.3% (CD8+), with a ratio of 1.13 ± 0.05 (P<0.001). Pleural effusion levels of LDH, TNF-α, and IL-6 all declined from baseline (856.6 ± 130.2 U/L, 48.4 ± 2.3 pg/mL, 74.81 ± 9.17 pg/mL) to 5 weeks (512.5 ± 95.7 U/L, 32.3 ± 3.8 pg/mL, 52.8 ± 7.1 pg/mL) and 10 weeks (385.6 ± 74.8 U/L, 24.9 ± 2.6 pg/mL, 36.6 ± 5.4 pg/mL) (all P<0.01). Multivariable logistic regression identified that a higher baseline KPS score (OR = 1.18, 95% CI: 1.05-1.32, P<0.01) and a lower baseline pleural effusion LDH level (OR = 0.72, 95% CI: 0.58-0.89, P<0.01) were independent protective factors, while a higher baseline peripheral blood CD4+/CD8+ ratio (OR = 0.65, 95% CI: 0.48-0.88, P<0.01) was an independent negative predictor for 10-week DCR. CONCLUSION: Intrapleural administration of anti-PD-1 antibody is relatively safe and demonstrates effective control of MPE in elderly patients with advanced NSCLC. It improves performance status and quality of life, enhances both systemic and local T-cell immune responses, and reduces inflammatory cytokines and LDH levels in pleural effusion.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923625","pmid":"42923625","pmcid":"PMC7399058","doi":"10.1210/jcemcr/luag324","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923625/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"JCEM Case Rep","journal_full":"JCEM case reports","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Persistent atherogenic lipoprotein changes during lorlatinib therapy.","title_en":"Persistent atherogenic lipoprotein changes during lorlatinib therapy.","authors":"Shibue K, Kunimasa K, Hamasaki A","affiliation_highlight":"Department of Diabetes and Endocrinology, Medical Research Institute KITANO HOSPITAL, PIIF Tazuke-Kofukai, Osaka 530-848…","results":"Lorlatinib, a third-generation anaplastic lymphoma kinase (ALK)/ROS1 tyrosine kinase inhibitor, frequently induces hypercholesterolemia and hypertriglyceridemia, but longitudinal qualitative lipoprotein changes remain in…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Lorlatinib, a third-generation anaplastic lymphoma kinase (ALK)/ROS1 tyrosine kinase inhibitor, frequently induces hypercholesterolemia and hypertriglyceridemia, but longitudinal qualitative lipoprotein changes remain incompletely characterized. We describe a 52-year-old woman with ALK-rearranged non-small cell lung cancer who developed persistent dyslipidemia despite lipid-lowering therapy. Before lorlatinib, total cholesterol was 164 mg/dL (SI [International System of Units]: 4.24 mmol/L) (reference range, 148-248 mg/dL [SI: 3.83-6.41 mmol/L]), low-density lipoprotein (LDL) cholesterol was 52 mg/dL (SI: 1.34 mmol/L) (reference range, 65-139 mg/dL [SI: 1.68-3.59 mmol/L]), and triglycerides were 54 mg/dL (SI: 0.61 mmol/L) (reference range, 30-117 mg/dL [SI: 0.34-1.32 mmol/L]). Within 3 weeks after lorlatinib initiation, these increased to 340, 245, and 166 mg/dL, respectively. Longitudinal profiling showed persistent apolipoprotein B (ApoB) elevation, increased oxidized LDL, and a prominent pre-β-lipoprotein fraction. Subclinical hypothyroidism was later detected, and pitavastatin was switched to rosuvastatin. This case highlights the potential value of ApoB and qualitative lipid assessment during prolonged lorlatinib therapy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922838","pmid":"42922838","pmcid":"PMC13684731","doi":"10.64898/2026.08.29.26361733","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922838/","notice_url":"","trial_url":"","pub_date":"2026-Aug-31","briefing_date":"2026-10-25","journal_abbr":"medRxiv","journal_full":"medRxiv : the preprint server for health sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"LLM-assisted evidence audit of late-stage cancer incidence as a screening trial endpoint.","title_en":"LLM-assisted evidence audit of late-stage cancer incidence as a screening trial endpoint.","authors":"Li S, Zhang W, Xing X, Shen Z, Wang Y, Chen Z, Neto OBL, Yu Y et al.","affiliation_highlight":"","results":"BACKGROUND: Late-stage cancer incidence is being considered as an earlier endpoint in cancer-screening trials, but its trial-level association with cancer-specific mortality may depend on evidence selection and endpoint …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Late-stage cancer incidence is being considered as an earlier endpoint in cancer-screening trials, but its trial-level association with cancer-specific mortality may depend on evidence selection and endpoint harmonization. We evaluated the robustness of this association to source-verified additions. METHODS: We reconstructed the PubMed corpus underlying a 41-comparison review. Gemini 3.1 Pro Preview was used only to prioritize reports for blinded human reassessment. Reviewers determined eligibility, linked reports from the same trial, harmonized endpoints, and verified comparison-level data. We recalculated unweighted Pearson correlations overall and by cancer type after adding earliest-compatible trial comparisons. RESULTS: Among 1209 candidate records, 996 PDFs were assessed. Thirty-three reports absent from the source review were prioritized; 26 were eligible, representing 18 trials, and 8 provided compatible comparisons. Adding these comparisons increased the dataset from 41 to 49 and attenuated the overall correlation from 0.73 (95% confidence interval [CI] = 0.55 to 0.85) to 0.59 (95% CI = 0.37 to 0.75). Updated correlations were 0.49 (95% CI = -0.26 to 0.87) for breast, - 0.23 (95% CI = -0.71 to 0.40) for colorectal, and 0.83 (95% CI = 0.54 to 0.95) for lung cancer. One sparse-event comparison influenced the colorectal estimate. CONCLUSIONS: The overall association was sensitive to evidence composition, and cancer-specific stability varied. Late-stage incidence should be evaluated by cancer type and with prespecified sensitivity analyses for evidence selection and endpoint definitions. Model-assisted prioritization cannot replace human eligibility review, trial reconciliation, and source verification.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922774","pmid":"42922774","pmcid":"PMC13684694","doi":"10.64898/2026.08.27.26361302","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922774/","notice_url":"","trial_url":"","pub_date":"2026-Sep-03","briefing_date":"2026-10-25","journal_abbr":"medRxiv","journal_full":"medRxiv : the preprint server for health sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Predicting COVID-19 hospitalisation and common disease risk from comorbid diagnoses in 13 million individuals.","title_en":"Predicting COVID-19 hospitalisation and common disease risk from comorbid diagnoses in 13 million individuals.","authors":"Liu H, Mizani MA, Zhao Y, Wood A, Inouye M, Price AL, Jiang X","affiliation_highlight":"","results":"Predicting disease risk from prior diagnoses is fundamental to clinical decision-making, particularly during health emergencies such as the COVID-19 pandemic, when individuals with long-term conditions may be disproporti…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Predicting disease risk from prior diagnoses is fundamental to clinical decision-making, particularly during health emergencies such as the COVID-19 pandemic, when individuals with long-term conditions may be disproportionately vulnerable to adverse outcomes. Despite intense interest in developing models to predict disease risk from prior diagnoses 1-3 , most prediction models do not estimate effects of each prior diagnosis on disease risk conditional on other diagnoses, limiting interpretability and clinical utility. We developed the Comorbidity Risk Score (CRS), trained on 13 million individuals (age 40-69) from linked electronic health record (EHR) datasets of the entire population of England, to predict COVID-19 hospitalisation and 87 other disease outcomes. CRS was trained at close to saturated sample size and precisely estimated the effects of 212 prior diagnoses on the 88 disease outcomes, conditional on all other prior diagnoses. Correlations of CRS effect sizes across outcomes (e.g. 0.76 for myocardial infarction vs. hyperlipidaemia) matched the corresponding genetic correlations (e.g. 0.79 for myocardial infarction vs. hyperlipidaemia), confirming that comorbidity architectures capture disease aetiology. On average, CRS identified 5% of the population with 3.4-fold higher disease risk, including myocardial infarction (4.4-fold), lung cancer (6.5-fold), and COVID-19 hospitalisation (6.3-fold). Using prior diagnoses alone, CRS outperformed state-of-the-art clinical COVID-19 models 4 . Furthermore, CRS ( N =13 million) substantially outperformed state-of-the-art AI 1 ( N =0.5 million) and linear 3 ( N =0.5 million) models in predicting disease risk, suggesting that training sample size outweighs model complexity. CRS attained near-perfect transferability across self-reported ethnicities (e.g., Black vs. White: AUROC ratio = 97.3%). Finally, CRS distinguished independently predictive comorbidities from indirect associations, e.g., lipid metabolism disorder was a strong predictor of myocardial infarction risk but not ischaemic stroke, after conditioning on other prior diagnoses. In conclusion, CRS provides a comprehensive resource for understanding the impact of comorbidities on COVID-19 and other future diseases, revealing disease aetiology while enabling powerful prediction of disease risk.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922773","pmid":"42922773","pmcid":"PMC7834494","doi":"10.1590/S2237-96222026v35e20240909.en","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922773/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Epidemiol Serv Saude","journal_full":"Epidemiologia e servicos de saude : revista do Sistema Unico de Saude do Brasil","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Disparities in lung cancer case registration, treatment, and mortality: descriptive study, Brazil, 2013-2019.","title_en":"Disparities in lung cancer case registration, treatment, and mortality: descriptive study, Brazil, 2013-2019.","authors":"Faria LV, Emmerick IM, Campos MR","affiliation_highlight":"Fundação Oswaldo Cruz, Escola Nacional de Saúde Pública Sérgio Arouca, Rio de Janeiro, RJ, Brazil Fundação Oswaldo Cruz …","results":"OBJECTIVE: To analyze factors associated with lung cancer case registration, treatment and mortality in Brazil, 2013-2019. METHODS: This was a retrospective study using the Brazilian Mortality Information System (Sistema…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To analyze factors associated with lung cancer case registration, treatment and mortality in Brazil, 2013-2019. METHODS: This was a retrospective study using the Brazilian Mortality Information System (Sistema de Informação de Mortalidade - SIM) and the Hospital Cancer Registries (Registros Hospitalares de Câncer - RHC). Outcomes analyzed were: (Model 1) \"absence of lung cancer case registration\" in the RHC, and (Model 2) \"rate of registered cases above the 3rd quartile.\" Descriptive and bivariate analyses were performed to compare groups, as well as multivariate logistic regression, identifying, at the municipal level, factors associated with the outcomes. Adjusted odds ratios (OR) and 95% confidence intervals (95%CI) were obtained. RESULTS: A total of 206,703 deaths and 89,265 cases (43% coverage) were analyzed. Approximately 85.7% of patients were diagnosed at a late stage, and half of the cases with initial staging did not receive adequate treatment. In Model 1, a lack of RHC coverage was associated with municipalities in the Central-West region compared to those in the North [OR 3.9; 95%CI 2.7; 5.7] and with those having a Gross Domestic Product below the national average [OR 1.3; 95%CI 1.1; 1.7]. In Model 2, municipalities in the South [OR 9.1; 95% CI 6.8; 12.2], small-sized municipalities [OR 7.1; 95%CI 4.0; 12.3], and those with below-average travel distances for treatment [OR 4.2; 95%CI 2.3; 7.7] had increased odds of a high registration rate. CONCLUSION: Localities with better infrastructure were more likely to register cases and have greater coverage of registries, while areas with poorer infrastructure were more likely not to register cases, despite presenting deaths due to lung cancer.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922756","pmid":"42922756","pmcid":"PMC13684686","doi":"10.64898/2026.08.26.26361466","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922756/","notice_url":"","trial_url":"","pub_date":"2026-Aug-31","briefing_date":"2026-10-25","journal_abbr":"medRxiv","journal_full":"medRxiv : the preprint server for health sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"ICONIC: An R Package for Integrating Instrumental Variable- and Negative-Control-Informed Causal Discovery and Diagnostics in Multiomic Studies.","title_en":"ICONIC: An R Package for Integrating Instrumental Variable- and Negative-Control-Informed Causal Discovery and Diagnostics in Multiomic Studies.","authors":"Bresnahan ST, Xiong C, Head T, Chang YH, Bhattacharya A, Huang JY","affiliation_highlight":"","results":"Unmeasured confounding threatens causal inference and replicability in observational multi-omic studies across variable environments. Genetic instrumental variables (Mendelian randomization) and negative-control calibrat…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Unmeasured confounding threatens causal inference and replicability in observational multi-omic studies across variable environments. Genetic instrumental variables (Mendelian randomization) and negative-control calibration each address complementary sources of unmeasured confounding, yet no existing framework unifies them for omics-scale mediation analysis. We introduce ICONIC, an R package that embeds genetic instruments and negative controls within a proximal causal inference framework for total-effect and mediation analysis. ICONIC implements eight estimators spanning five confounding-control strategies, supports continuous, binary, and time-to-event outcomes, and provides extensive diagnostics including sensitivity analyses that map estimator performance across plausible assumptions. Ground-truth benchmarks are calibrated to real-omics covariance structures via a hybrid generative model (GAN + feature-level Gaussian copula) rather than parametric simulation, and a companion planning tool predicts performance gains from collecting additional omic data. We demonstrate ICONIC in two case studies: screening for placental transcriptomic mediators of gestational diabetes on birth weight (n = 164), and tumor-expression mediators of smoking intensity on lung cancer survival (n = 494). Notably, ICONIC's diagnostics recommended different estimation strategies across the two scenarios, reflecting differences in the likely influence of unmeasured confounding. ICONIC is freely available at https://github.com/sbresnahan/iconic/ .","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922703","pmid":"42922703","pmcid":"PMC13684617","doi":"10.64898/2026.08.26.26361331","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922703/","notice_url":"","trial_url":"","pub_date":"2026-Sep-02","briefing_date":"2026-10-25","journal_abbr":"medRxiv","journal_full":"medRxiv : the preprint server for health sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Point-of-Care Breath Volatile Organic Compound Analysis as a Tool for Lung Cancer Screening: A Pilot Feasibility Study.","title_en":"Point-of-Care Breath Volatile Organic Compound Analysis as a Tool for Lung Cancer Screening: A Pilot Feasibility Study.","authors":"Pichkar Y, Manolakos S, Phillips KM, Schabath MB, Chaudhary A","affiliation_highlight":"","results":"BACKGROUND: Low-dose computed tomography (LDCT) screening reduces lung cancer mortality but is limited by low uptake and associated with high rates of false-positives and indeterminate-nodules. Breath volatile organic co…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Low-dose computed tomography (LDCT) screening reduces lung cancer mortality but is limited by low uptake and associated with high rates of false-positives and indetermin
