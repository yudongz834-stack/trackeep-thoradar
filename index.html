or":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"表观遗传与生物样本库驱动的黑色素瘤精准免疫治疗：概念框架综述","title_en":"Towards epigenetically informed and biobank-driven precision immunotherapy in melanoma.","authors":"Ciuffreda L, Falcone I, Sorino C, Valenti A, Accetta C, De Nicola F, Roglia V, Fanciulli M et al.","affiliation_highlight":"Gene expression and Cancer Model Unit, Department of Research, Advanced Diagnostics and Technological Innovation, Transl…","results":"","authors_conclusion":"we propose an integrative model connecting epigenetic vulnerability, immune reconfiguration, and biobank-driven systems biology. This model is proposed as a research framework for investigating future biomarker informed immunotherapy strategies in melanoma.","ai_note":"信息不足：未见系统检索策略、纳入排除标准、样本量及效应量；结论为概念框架，不能提供疗效或生物标志物验证证据；主题为黑色素瘤而非胸部肿瘤，外推至胸外科临床决策需谨慎。","pico":{"p":"","ic":""},"reason":"为黑色素瘤免疫治疗耐药、表观遗传调控与生物样本库联合研究提供概念框架；对胸外科临床判断直接影响有限，可作为跨瘤种免疫耐药与生物标志物研究思路参考。","abstract_en":"Cutaneous melanoma (CM) is a highly immunogenic and therapeutically intricate solid tumor, exemplifying the interactions between tumors and the immune system. Despite the significant enhancement in survival rates for patients with advanced melanoma due to immune checkpoint inhibitors (ICIs), numerous patients either exhibit resistance to these agents or develop immune evasion mechanisms. This underscores the pressing necessity to identify biological determinants of drug responses. A significant body of research indicates that epigenetic alterations, including DNA methylation, histone modifications, and ATP-dependent chromatin remodeling, are essential in modulating melanoma immunogenicity. This encompasses the modulation of antigen presentation, innate immune detection, interferon (IFN) signaling, melanoma plasticity, and the reconfiguration of the immune microenvironment. Furthermore, in contrast to genetic mutations, these mechanisms are reversible, positioning melanoma as a prime example of epigenetically regulated and potentially therapeutically targeted immune resistance. This review examines the novel insight that epigenetic therapies can enhance the immunological activity of \"cold\" or immune-excluded melanomas, transforming them into inflamed, drug-responsive tumors. This is achievable by restoring antigenicity and reactivating IFN-related pathways, leading to enhanced immune cell infiltration. The paper also addresses the necessity of longitudinal biobanking combined with integrated multi-omics analyses of epigenomics, transcriptomics, proteomics, and spatial profiling to investigate dynamic tumor-immune configurations, support the validation of candidate biomarkers, and explore biologically informed patient stratification. In conclusion, we propose an integrative model connecting epigenetic vulnerability, immune reconfiguration, and biobank-driven systems biology. This model is proposed as a research framework for investigating future biomarker informed immunotherapy strategies in melanoma.","tags":["黑色素瘤","免疫检查点抑制剂","表观遗传","生物样本库","精准免疫治疗","综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903557","pmid":"42903557","pmcid":"PMC13681187","doi":"10.3389/fimmu.2026.1977224","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903557/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述（非系统评价）· 空间组学与肺巨噬细胞微环境的概念整合","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":28,"score_breakdown":{"clinical":5,"methodology":4,"specialty":11,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺巨噬细胞的空间细胞微环境：修复相关多细胞niche在部分肺疾病中未消退并组织化为病理性niche的叙述性综述","title_en":"Macrophages in spatial context: cellular niches in lung disease.","authors":"Yamamoto A, Fujii N, Maeda Y","affiliation_highlight":"Department of Hematology and Oncology, Okayama University Hospital, Okayama, Japan.","results":"","authors_conclusion":"我们进一步提出一个空间框架：共享的免疫—上皮—间质相互作用，可依据其锚定于肺泡—间质区域还是围绕小气道，而产生不同的纤维化构筑；并讨论如何对空间方法识别出的病理性细胞niche进行功能验证并转化为可治疗干预的细胞间回路。","ai_note":"本文为叙述性综述，无系统检索策略、无纳入排除标准、无定量合成，未提供任何样本量或效应量；'病理性细胞niche'与'肺泡—间质 vs 小气道'双构筑框架属作者概念性推论，摘要中无原始数据支撑；摘要以框架提出与展望为主，读者不应将其当作已验证的机制结论或疗效证据。","pico":{"p":"","ic":""},"reason":"为肺纤维化/慢性重塑的机制研究提供空间微环境层面的假说框架，可用于启发胸外科围手术期肺损伤、术后肺纤维化及空间组学课题的假设生成，但不直接改变任何临床决策。","abstract_en":"Advances in spatial omics are shifting the study of lung macrophages from the characterization of isolated transcriptional states toward an understanding of their function in the context of cellular origin, anatomical location, neighboring cells, and tissue architecture. Here, we distinguish the macrophage niche in the strict sense-the local microenvironment that sustains tissue-resident macrophage survival and identity-from the broader cellular niche, in which macrophages are spatially organized with multiple interacting cell populations, and integrate recent insights into lung repair and chronic remodeling. Following injury, remodeling of the resident macrophage compartment, recruitment of monocyte-derived macrophages, and the emergence of regenerative epithelial intermediates and stromal responses generate transient multicellular environments that normally resolve as tissue homeostasis is restored. Spatial analyses, however, indicate that in at least some lung diseases, these repair-associated states fail to resolve and instead become organized into pathological cellular niches characterized by recurrent proximity among aberrant epithelial cells, inflammatory and profibrotic macrophages, activated stromal cells, and extracellular matrix. We further propose a spatial framework in which shared immune-epithelial-stromal interactions can give rise to distinct fibrotic architectures depending on whether they are anchored within alveolar-interstitial regions or around small airways. Finally, we discuss how pathological cellular niches identified by spatial approaches can be functionally validated and translated into therapeutically actionable intercellular circuits.","tags":["空间组学","肺巨噬细胞","细胞微环境","肺纤维化","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42904154","pmid":"42904154","pmcid":"PMC13682354","doi":"10.1016/j.rmcr.2026.102502","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904154/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Respir Med Case Rep","journal_full":"Respiratory medicine case reports","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单中心病例报告（1例）· 诊断与治疗随访","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":28,"score_breakdown":{"clinical":9,"methodology":4,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例患者","metric":"奥希替尼治疗后无活动性疾病随访时间","val":"2.5年","stat":"","grounded":true,"checks":[{"num":"2.5","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"单例患者","metric":"奥希替尼治疗后无活动性疾病随访时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"EGFR突变肺腺癌表现为粟粒性肺内癌病并模拟结核：1例病例报告","title_en":"EGFR-mutated lung adenocarcinoma presenting as miliary intrapulmonary carcinomatosis: A diagnostic mimic of tuberculosis.","authors":"Paletta G, Kancharla S, Magre A, Tyagi N","affiliation_highlight":"Texas A&M University Naresh K.","results":"支气管镜活检示低分化腺癌（TTF-1+），携带EGFR exon 21 L858R突变；分期示脑、骨、胸膜转移（IVB期NSCLC）；奥希替尼80 mg每日联合姑息放疗及唑来膦酸后，系列PET-CT及脑MRI显示2.5年时无活动性疾病证据。","authors_conclusion":"本病例强调对未明确病因的粟粒样模式进行组织学诊断、对肺腺癌早期进行分子分型，以及EGFR突变NSCLC接受奥希替尼可获得持久且异常良好缓解的潜力。","ai_note":"单例病例报告，无对照、无系统随访方案，无法据此推断奥希替尼在该影像表型中的疗效或持久缓解率；“exceptional response”属于病例层面的观察，存在发表偏倚与选择性报告可能。","pico":{"p":"53岁菲律宾女性，终身不吸烟，既往潜伏性结核，双肺弥漫性粟粒样结节，最终诊断为IVB期EGFR exon 21 L858R突变肺腺癌；样本量1例","ic":"奥希替尼80 mg每日联合姑息放疗及唑来膦酸；无对照组（病例报告）"},"reason":"为粟粒样肺内癌病与结核的鉴别提供组织诊断警示，并展示EGFR L858R晚期肺腺癌奥希替尼持久缓解的单例基线；对罕见影像模拟病例的分子检测决策有教育价值。","abstract_en":"Miliary intrapulmonary carcinomatosis (MIPC) is a rare metastatic pattern of lung cancer that closely mimics disseminated tuberculosis (TB), posing a significant diagnostic challenge. We present a 53-year-old Filipino woman, a lifelong nonsmoker with prior latent TB, who presented with progressive cough and a diffuse bilateral miliary nodular pattern on chest imaging. An extensive infectious workup was unrevealing, and bronchoscopic biopsy revealed poorly differentiated adenocarcinoma (TTF-1+) harboring an EGFR exon 21 L858R mutation. Staging demonstrated brain, osseous, and pleural metastases (stage IVB NSCLC). The patient was initiated on osimertinib 80 mg daily with palliative radiation and zoledronic acid, achieving no evidence of active disease at 2.5 years on serial PET-CT and brain MRI. This case underscores the importance of tissue diagnosis in unresolved miliary patterns, early molecular profiling in lung adenocarcinoma, and the potential for durable exceptional responses with osimertinib in EGFR-mutated NSCLC.","tags":["EGFR exon 21 L858R","粟粒性肺内癌病","结核模拟","奥希替尼","IVB期NSCLC","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903066","pmid":"42903066","pmcid":"PMC12962898","doi":"10.1021/acs.jcim.0c01227","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903066/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"整合性临床前研究（网络药理学/生物信息学分析 + 单一细胞系体外实验）· 初步探索","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":27,"score_breakdown":{"clinical":5,"methodology":10,"specialty":12,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"黄芩素-LUAD 重叠靶点","metric":"候选重叠靶点数","val":"117","stat":"","grounded":true,"checks":[{"num":"117","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"候选核心基因","metric":"优选核心基因数","val":"6","stat":"","grounded":false,"checks":[{"num":"6","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["6"]},{"group":"A549 细胞活力","metric":"黄芩素 IC50（24 h）","val":"54.93 μM","stat":"","grounded":true,"checks":[{"num":"54.93","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"A549 细胞活力","metric":"黄芩素 IC50（48 h）","val":"22.83 μM","stat":"","grounded":true,"checks":[{"num":"22.83","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":["6"],"semantic_passed":false,"semantic_audit":[{"group":"黄芩素-LUAD 重叠靶点","metric":"候选重叠靶点数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「黄芩素」无英文锚（词典未收录，宁误杀）","人群限定「重叠靶点」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"候选核心基因","metric":"优选核心基因数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「候选核心基因」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"A549 细胞活力","metric":"黄芩素 IC50（24 h）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「549」未在原摘要出现","人群限定「活力」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"A549 细胞活力","metric":"黄芩素 IC50（48 h）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「549」未在原摘要出现","人群限定「活力」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"黄芩素作用于肺腺癌的候选靶点网络构建与A549细胞初步验证：体外抑制活力并降低AKT1磷酸化与BCL2蛋白水平","title_en":"Exploring the mechanisms of baicalein in lung adenocarcinoma: an integrative preliminary study with focused experimental assessment in A549 cells.","authors":"Yuan J, Zhong J, Chen R, Mao J, Wang Z","affiliation_highlight":"The First School of Clinical Medicine, Zhejiang Chinese Medical University, Hangzhou, China.","results":"共识别 117 个黄芩素-LUAD 重叠候选靶点，优选 6 个候选核心基因（EGFR、AKT1、TP53、BCL2、HIF1A、ESR1）；CCK-8 显示黄芩素降低 A549 细胞活力，IC50 为 24 h 54.93 μM、48 h 22.83 μM；黄芩素处理后 A549 细胞 AKT1 磷酸化水平与 BCL2 蛋白表达下降，总 AKT1 基本不变；HIF1A 表达与计算估计的免疫细胞分数及更差的总生存相关（未报告效应量与统计值）。","authors_conclusion":"这些发现优先确立了 LUAD 中一个与黄芩素相关的候选网络，涉及激酶信号、凋亡相关调控、氧化应激反应与免疫微环境关联；CCK-8 结果支持黄芩素在体外对 A549 细胞活力的抑制作用，AKT1 磷酸化与 BCL2 蛋白表达的变化为候选网络的选定组分提供了聚焦的实验支持；仍需进一步体外与体内研究验证其生物学相关性与转化潜力。","ai_note":"摘要未预设主要终点，结论建立在“候选网络优先排序”这一探索性目标上，阳性表述（prioritize/支持）部分来自计算推断而非实验验证；蛋白层面结果仅有“降低/基本不变”的定性描述，缺定量灰度、重复次数与统计检验；分子对接、CIBERSORT 免疫浸润与 GEPIA2/HPA 生存关联均属计算性推断，HIF1A 与总生存的关联未给出 HR、95%CI 或 P 值，无法判断效应量；体外证据仅来自 A549 单细胞系、无正常细胞或对照药物对照，IC50 值无置信区间；富集分析结果为“suggested”层面，通路富集的具体统计量与校正方法未披露；全文题目标注为 preliminary，结论外推至临床或体内需谨慎。","pico":{"p":"TCGA-LUAD 转录组数据（样本量未在摘要中给出）与 A549 肺腺癌细胞系","ic":"黄芩素（baicalein）处理；对照与具体给药方案、重复次数摘要未描述"},"reason":"为肺腺癌天然产物多靶点研究提供候选靶点清单与体外 IC50 基线数据（24 h 54.93 μM、48 h 22.83 μM），可作为同类网络药理学+单细胞系验证研究的对照参考与方法学警示，对临床决策判断影响有限。","abstract_en":"BACKGROUND: Lung adenocarcinoma (LUAD) continues to present therapeutic challenges because of pathway redundancy and treatment resistance, underscoring the need for multi-target and systems-level strategies. Baicalein (BA), a flavonoid metabolite from Scutellaria baicalensis Georgi, shows antitumor potential, yet integrative and immune-related evaluations of BA in LUAD remain limited. METHODS: We integrated network analyses with TCGA-LUAD transcriptomics, weighted gene co-expression network analysis (WGCNA), network topology, GO/KEGG enrichment, bulk RNA-seq-based immune-infiltration estimation (CIBERSORT), molecular docking, and clinical association analysis (GEPIA2/HPA). Cell viability was assessed in A549 cells​ using the CCK-8 assay, and AKT1 phosphorylation and BCL2 protein expression were further examined experimentally by western blot analysis. RESULTS: A total of 117 candidate BA-LUAD overlapping targets were identified, and six candidate hub genes (EGFR, AKT1, TP53, BCL2, HIF1A, and ESR1) were prioritized. Enrichment analyses suggested that the candidate network was associated with oncogenic signaling and stress-response programs, particularly PI3K-AKT/MAPK signaling, ROS-related processes, apoptosis, and p53 signaling. CCK-8 assays showed that BA reduced A549 cell viability in vitro, with IC50 values of 54.93 μM at 24 h and 22.83 μM at 48 h. Among the prioritized candidates, AKT1 and BCL2 were selected for focused experimental assessment in A549 cells. BA treatment reduced AKT1 phosphorylation and BCL2 protein expression in A549 cells, whereas total AKT1 remained largely unchanged. HIF1A expression showed broad associations with computationally estimated immune-cell fractions and poorer overall survival. CONCLUSION: These findings prioritize a BA-associated candidate network in LUAD involving kinase signaling, apoptosis-related regulation, oxidative-stress responses, and immune-microenvironment associations. The CCK-8 results support an inhibitory effect of BA on A549 cell viability in vitro, and the observed changes in AKT1 phosphorylation and BCL2 protein expression provide focused experimental support for selected components of the candidate network; further in vitro and in vivo studies are required to validate biological relevance and translational potential.","tags":["黄芩素","肺腺癌","网络药理学","A549","PI3K-AKT","BCL2"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903631","pmid":"42903631","pmcid":"PMC13681195","doi":"10.3389/fimmu.2026.1920627","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903631/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 免疫生物学概念框架梳理（非系统评价，无定量合成）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":25,"score_breakdown":{"clinical":4,"methodology":8,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"综述：γδ T细胞在发育、组织驻留与疾病中桥接固有与适应性免疫——概念框架梳理及治疗转化证据的批判性评估","title_en":"γδ T cells: bridging innate and adaptive immunity in development, tissue residency, and disease.","authors":"Lou J, Zou N","affiliation_highlight":"Department of Pediatrics, the Second Hospital of Dalian Medical University, Dalian, China.","results":"","authors_conclusion":"This review provides a structured framework for understanding γδ T cells as pivotal connectors of innate and adaptive immunity.","ai_note":"该文为叙述性综述，摘要未交代文献检索策略、纳入排除标准与证据分级方法，却声称对“证据等级”予以明确关注，方法学可溯源性不足；治疗应用（过继回输、CAR工程化细胞、细胞外囊泡疫苗）仅作“批判性评估”定性表述，无任何疗效数值；主要未解问题（TCR配体谱、组织驻留维持机制、小鼠-人转化鸿沟）为作者自述的局限，提示结论属概念性框架而非可直接转化的临床证据。","pico":{"p":"","ic":""},"reason":"为胸部肿瘤γδ T细胞相关免疫治疗与转化研究提供概念框架与背景引用来源，但不直接改变手术、结节评估或围手术期决策。","abstract_en":"γδ T cells are a unique lymphocyte lineage that bridges innate and adaptive immunity through MHC-unrestricted recognition of phosphoantigens, lipids, and stress-induced proteins. Their tissue-resident subsets, shaped by Vγ/Vδ chain usage, play essential roles in barrier surveillance, tissue homeostasis, and host defense.This review synthesizes recent advances that fundamentally reshape our understanding of γδ T cell biology. We highlight two conceptual frameworks: (1) dual recognition modalities of γδ TCRs, distinguishing structurally resolved ligand interactions from functionally supported recognition; and (2) a developmental wave model in which TCR signal strength and transcriptional networks program effector fates. Mouse and human studies are presented in dedicated species-specific sections and tables, with explicit attention to species-specific nomenclature and evidence levels.We cover γδ T cell development, tissue-resident programs, antigen recognition mechanisms (including butyrophilin-mediated phosphoantigen sensing, antibody-like foreign antigen recognition, and intracellular self-protein recognition), and the dual roles of γδ T cells in infection, cancer, and chronic inflammation. Therapeutic applications-adoptive transfer, CAR-engineered cells, and extracellular-vesicle vaccines-are critically appraised against current clinical evidence.Finally, we identify major unanswered questions: the complete γδ TCR ligand repertoire, the mechanisms maintaining tissue residency, and the translational gaps between mouse models and human disease. This review provides a structured framework for understanding γδ T cells as pivotal connectors of innate and adaptive immunity.","tags":["γδ T细胞","固有与适应性免疫","组织驻留","磷酸抗原","过继细胞治疗","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903210","pmid":"42903210","pmcid":"PMC13680243","doi":"10.3389/fonc.2026.1921935","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903210/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"单例病例报告（Case report）· 诊断与治疗经过描述","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":24,"score_breakdown":{"clinical":8,"methodology":5,"specialty":11,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例病例","metric":"年龄","val":"42岁","stat":"","grounded":true,"checks":[{"num":"42","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例病例","metric":"症状持续时间","val":"6个月（近2个月加重）","stat":"","grounded":true,"checks":[{"num":"6","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例病例","metric":"左锁骨上淋巴结大小","val":"3×2 cm","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"单例病例","metric":"年龄","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"症状持续时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"左锁骨上淋巴结大小","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"超声表现酷似心包积液的弥漫性心包间皮瘤一例：复发性不明原因心包积液需警惕絮状回声与不规则心包增厚","title_en":"Ultrasonic manifestations of diffuse pericardial mesothelioma masquerading as pericardial effusion: a case report.","authors":"Zhu S, Zhou Y","affiliation_highlight":"Department of Ultrasound, Affiliated Jinhua Hospital, Zhejiang University School of Medicine, Jinhua, Zhejiang, China.","results":"超声引导下心包穿刺仅抽出少量红色胶冻样物，细胞学提示上皮样肿瘤细胞；锁骨上淋巴结活检证实转移性恶性间皮瘤；纳武利尤单抗免疫治疗无改善；心包肿瘤切除见弥漫鱼肉样肿瘤侵犯心肌及大血管；最终病理证实为上皮样型原发心包间皮瘤；查体见3×2 cm质硬固定左锁骨上淋巴结","authors_conclusion":"对于复发性不明原因心包积液且伴不典型超声特征（如絮状回声、不规则心包增厚）的患者，应警惕原发心包间皮瘤；早期识别这些征象并及时取得病理确诊，对避免诊断延误、可能改善预后至关重要。","ai_note":"单例病例报告，无对照、无连续病例，所提“絮状回声、不规则心包增厚”等超声征象未给出敏感性/特异性或与心包积液病因队列的对照，仅属假设生成；单例纳武利尤单抗无效不能提示免疫治疗在该病中的疗效；“may improve outcomes”为推测性表述，缺乏随访数据支持；摘要未提供生存、随访时长及治疗后续信息。","pico":{"p":"单例：42岁男性，反复胸闷胸痛6个月、加重2个月，既往两次因不明原因心包积液住院","ic":"无对照与干预分组；描述超声心动图/超声引导心包穿刺、锁骨上淋巴结活检、心包肿瘤切除及纳武利尤单抗免疫治疗的过程"},"reason":"为复发性不明原因心包积液的鉴别诊断路径提供罕见病因提示，强调超声不典型征象与尽早病理确诊，可影响心包积液患者的穿刺/活检决策与影像随访警觉性；作为极罕见瘤种的个案基线，仅可用于假设生成与病例对照设计参考。","abstract_en":"BACKGROUND: Primary pericardial mesothelioma (PPM) is an exceedingly rare, highly invasive cardiac neoplasm with insidious onset and non-specific clinical symptoms. Due to the lack of typical early manifestations and effective routine diagnostic methods, PPM is often misdiagnosed and missed, resulting in delayed treatment and poor prognosis. CASE PRESENTATION: A 42-year-old male presented with 6 months of recurrent chest tightness and pain, worsening over 2 months, and two prior admissions for unexplained pericardial effusion. On admission, he had tachycardia, distant heart sounds, bilateral lower extremity edema, and a 3×2 cm hard, fixed left supraclavicular lymph node. Imaging confirmed pericardial effusion with abnormal pericardial lesions. Ultrasound-guided pericardiocentesis yielded only a small amount of red jelly-like material, with cytology suggesting epithelioid neoplastic cells. Supraclavicular lymph node biopsy confirmed metastatic malignant mesothelioma. Nivolumab immunotherapy showed no improvement. Pericardial tumor resection revealed diffuse, fish-flesh-like tumor invading the myocardium and great vessels. Final pathology confirmed epithelioid-type PPM. CONCLUSION: Patients with recurrent unexplained pericardial effusion and atypical sonographic features, such as flocculent echoes and irregular pericardial thickening, should raise suspicion for PPM. Early recognition of these signs and timely pathological confirmation are critical to avoid diagnostic delays and may improve outcomes.","tags":["原发心包间皮瘤","心包积液","超声诊断","病例报告","免疫治疗"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42903344","pmid":"42903344","pmcid":"PMC13681182","doi":"10.3389/fimmu.2026.1816598","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903344/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 免疫学机制与转化应用整合","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":22,"score_breakdown":{"clinical":3,"methodology":8,"specialty":3,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"GPR183/EBI2通过感知7α,25-二羟基胆固醇梯度调控免疫细胞定位与功能：跨配体梯度、组织环境与疾病阶段的整合综述","title_en":"GPR183-mediated immune cell positioning and function: an integrative perspective across ligand gradients, tissue environments, and disease stages.","authors":"Lin X, Dong X, Jiang Z, Xing X","affiliation_highlight":"School of Public Health, Guilin Medical University, Guilin, China.","results":"","authors_conclusion":"This review integrates current evidence across four dimensions - immune-cell type, the 7α,25-OHC gradient, tissue microenvironment, and disease stage - and organizes the disease-related actions of GPR183 and potential stratified interventions around pathogenic recruitment, protective recruitment, tissue repair, tumor-immune remodeling, and biomarker applications.","ai_note":"叙述性综述，无系统检索策略、纳入排除标准、偏倚评估或定量合并；主要证据来自动物与机制研究，人类组织与队列数据仅为关联性；未提供胸部肿瘤特异性样本量、终点或效应值；与胸外科手术、结节评估或围术期决策的直接相关性弱；不能据此推断临床疗效或预后。信息不足：缺乏胸癌亚型、分期及治疗背景下的具体证据。","pico":{"p":"","ic":""},"reason":"为理解GPR183/7α,25-OHC轴在免疫细胞定位和肿瘤免疫微环境中的机制提供背景，但不足以影响胸外科手术、结节或围术期临床判断；仅可作为免疫机制与转化研究假设来源。","abstract_en":"G protein-coupled receptor 183 (GPR183), also known as EBI2, is a chemoattractant receptor whose principal endogenous ligand is 7α,25-dihydroxycholesterol (7α,25-OHC). Its expression varies dynamically across immune-cell subsets and activation states. By sensing local 7α,25-OHC gradients, GPR183 converts tissue metabolic cues into spatial information, thereby regulating immune-cell migration, tissue distribution, and function. Dynamic receptor expression, ligand synthesis and degradation, responding cell type, and the tissue microenvironment collectively shape the direction of pathway activity, whereas intervention studies in animals and longitudinal observations establish disease stage as a temporal coordinate for interpreting divergent effects. Genetic, pharmacological, and cell-engineering studies provide functional evidence that GPR183 contributes to lymphoid-tissue compartmentalization, host defense, inflammatory responses, tissue repair, and tumor-immune remodeling. Analyses of patient tissues and clinical cohorts extend this mechanistic framework to associations with disease activity, treatment response, and prognosis. Three intervention strategies have emerged: receptor agonism, pharmacological inhibition, and immune-cell engineering. The oral antagonist IPG11406 has entered early clinical evaluation, whereas preclinical assessment of other candidate strategies has focused on ligand stability, tissue selectivity, and long-term immune safety. This review integrates current evidence across four dimensions - immune-cell type, the 7α,25-OHC gradient, tissue microenvironment, and disease stage - and organizes the disease-related actions of GPR183 and potential stratified interventions around pathogenic recruitment, protective recruitment, tissue repair, tumor-immune remodeling, and biomarker applications.","tags":["GPR183","EBI2","7α,25-二羟基胆固醇","免疫细胞迁移","肿瘤免疫微环境","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903281","pmid":"42903281","pmcid":"PMC13680422","doi":"10.3389/fimmu.2026.1909384","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903281/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"Perspective · 对226项儿童CAR-T试验的注册库描述性分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":22,"score_breakdown":{"clinical":4,"methodology":8,"specialty":2,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"儿童B-ALL","metric":"CAR-T缓解率","val":">80%","stat":"","grounded":true,"checks":[{"num":"80%","grounded":true,"note":"数值命中+邻句锚命中"}],"missing_tokens":[]},{"group":"复发/难治性儿童B-ALL","metric":"首年内复发比例","val":"40-50%","stat":"","grounded":true,"checks":[{"num":"40","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"50%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"儿童适用CAR-T试验","metric":"I-II期试验占比","val":"95.6%","stat":"","grounded":true,"checks":[{"num":"95.6%","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"儿童适用CAR-T试验","metric":"III/IV期试验占比","val":"3.5% (8/226)","stat":"","grounded":true,"checks":[{"num":"3.5%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"8","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"226","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"已完成CAR-T试验","metric":"源数据库无结局记录比例","val":"56.9% (58/102)","stat":"","grounded":true,"checks":[{"num":"56.9%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"58","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"102","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"儿童B-ALL","metric":"CAR-T缓解率","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「儿童」无英文锚（词典未收录，宁误杀）"]},{"group":"复发/难治性儿童B-ALL","metric":"首年内复发比例","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「难治性儿童」无英文锚（词典未收录，宁误杀）"]},{"group":"儿童适用CAR-T试验","metric":"I-II期试验占比","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「儿童适用」无英文锚（词典未收录，宁误杀）","人群限定「试验」无英文锚（词典未收录，宁误杀）"]},{"group":"儿童适用CAR-T试验","metric":"III/IV期试验占比","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「儿童适用」无英文锚（词典未收录，宁误杀）","人群限定「试验」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"已完成CAR-T试验","metric":"源数据库无结局记录比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「已完成」无英文锚（词典未收录，宁误杀）","人群限定「试验」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"儿童B-ALL CAR-T耐药机制与转化瓶颈：一项视角文章及226项试验注册分析","title_en":"Resistance mechanisms and translational bottlenecks in CAR-T cell therapy for pediatric acute lymphoblastic leukemia: a perspective.","authors":"Xu J, Sui L, Yang W, Xu L, Shan M","affiliation_highlight":"College of Traditional Chinese Medicine, Shandong Medical and Pharmaceutical University, Yantai, China.","results":"CAR-T缓解率超过80%；40-50%患者在首年内最终复发；226项试验中95.6%为I-II期，3.5%（8/226）注册为III/IV期；102项已完成试验中58项（56.9%）在源数据库无结局记录","authors_conclusion":"进展取决于更聪明的受体设计以及试验设计、结局透明度和全球合作方面的结构性改革","ai_note":"为视角文章而非原始系统评价；226项试验分析仅基于源数据库，未报告检索策略、筛选流程、偏倚评估或合并分析；'儿童适用'定义不清；缓解率与复发率数值未给置信区间及来源研究异质性；主要论述为机制与观点，不能作为疗效或注册完整性的确证证据；与胸部肿瘤无直接关系","pico":{"p":"复发/难治性儿童B细胞急性淋巴细胞白血病；226项儿童适用CAR-T试验","ic":"CAR-T细胞治疗；对照不适用（视角文章/试验注册分析）"},"reason":"不改变胸外科临床判断；仅可作为了解CAR-T试验注册透明度和儿童B-ALL耐药机制的背景材料，对胸部肿瘤科研设计参考价值有限","abstract_en":"Chimeric antigen receptor (CAR)-T cell therapy has achieved remarkable remission rates exceeding 80% in relapsed/refractory pediatric B-cell acute lymphoblastic leukemia (B-ALL), yet 40-50% of patients eventually relapse within the first year. This therapeutic ceiling is not a single failure mode but the convergence of at least four interrelated layers: loss of CAR-T persistence, antigen escape driven by CD19 splicing variants and lineage switch, CAR-T cell-intrinsic exhaustion from chronic tonic signaling, and an immunosuppressive bone marrow microenvironment that actively extinguishes effector function. Our systematic analysis of 226 pediatric-eligible CAR-T trials shows that 95.6% are Phase I-II, 3.5% (8/226) are registered as Phase III/IV, and 58 of 102 completed trials (56.9%) had no outcome recorded in the source database. In this Perspective, we synthesize the molecular mechanisms of CAR-T resistance, contextualize them within the current clinical trial landscape, and critically evaluate emerging engineering strategies-from dual-targeting and armored CAR architectures to CRISPR-edited allogeneic products and in vivo mRNA delivery. We argue that progress depends on both smarter receptor design and structural reforms in trial design, outcome transparency and global collaboration.","tags":["CAR-T","儿童B-ALL","耐药机制","试验注册","视角文章"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":true,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903607","pmid":"42903607","pmcid":"PMC13681213","doi":"10.3389/fimmu.2026.1944056","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903607/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述（非系统评价）· 无原始数据、无定量合成","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":20,"score_breakdown":{"clinical":6,"methodology":3,"specialty":3,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"乳腺肿瘤内微生物组作为肿瘤免疫微环境可干预组分：机制、生物标志物与治疗潜力的叙述性综述（无原始数据）","title_en":"The intratumoral microbiome in breast cancer: an actionable component of the tumor immune microenvironment.","authors":"Cossu C, Adamo M, Di Lorenzo A, Conti L","affiliation_highlight":"Department of Molecular Biotechnology and Health Sciences, University of Turin, Turin, Italy.","results":"","authors_conclusion":"A deeper understanding of host-microbe interactions within the breast tumor microenvironment may ultimately enable microbiome-informed approaches for personalized prevention, diagnosis, prognostication, and treatment of breast cancer.","ai_note":"全文为叙述性综述：无系统检索策略、纳排标准、偏倚风险评估与证据分级，结论为展望性表述（may ultimately enable），不可作为疗效、预后或生物标志物效能的证据；摘要自述该领域受低微生物生物量、污染、方法学缺乏标准化及患者混杂因素限制，提示现有文献结论稳健性存疑；所引“特定菌群与分子亚型及临床结局相关”均为定性描述，未给出任何效应量，存在引用选择性可能。","pico":{"p":"","ic":""},"reason":"为肿瘤内微生物组与免疫微环境的交互提供概念框架与假设来源，可作为肺癌等胸部肿瘤微生物组研究的选题背景与机制假设参考；因无原始数据与定量结果，不改变当前临床决策或结节/手术患者管理判断。","abstract_en":"Breast cancer remains one of the leading causes of cancer-related deaths in women. The discovery of a breast tumor microbiota has deeply changed our understanding of the breast tumor microenvironment, identifying microorganisms as active players in tumor progression. Increasing evidence suggests that intratumoral bacteria may influence multiple hallmarks of breast cancer, including chronic inflammation, immune modulation, metabolic reprogramming, epithelial plasticity, metastatic dissemination, and therapeutic response. Distinct microbial communities have been associated with specific breast cancer subtypes and clinical outcomes, and some mechanistic studies have demonstrated that individual bacterial species and their metabolites can directly regulate oncogenic signaling pathways, reshape the tumor immune microenvironment, and alter sensitivity to chemotherapy and immunotherapy. These findings have generated growing interest in exploiting the breast tumor microbiota as a source of novel diagnostic, prognostic, and predictive biomarkers, as well as a therapeutic target for breast cancer treatment. In this review, we summarize current knowledge on the composition and origin of the breast tumor microbiota, discuss the molecular mechanisms through which tumor-associated microorganisms may influence breast cancer initiation and progression, examine their impact on treatment response, and highlight emerging microbiota-based therapeutic strategies. Finally, we discuss the major technical and biological challenges that currently limit clinical translation, including low microbial biomass, contamination, lack of methodological standardization, and patient-related confounding factors, and outline future perspectives for integrating microbial profiling into precision oncology. A deeper understanding of host-microbe interactions within the breast tumor microenvironment may ultimately enable microbiome-informed approaches for personalized prevention, diagnosis, prognostication, and treatment of breast cancer.","tags":["叙述性综述","乳腺肿瘤","瘤内微生物组","肿瘤免疫微环境","生物标志物","无原始数据"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903324","pmid":"42903324","pmcid":"PMC13681192","doi":"10.3389/fimmu.2026.1976894","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903324/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 靶向PubMed检索的机制证据整合（非系统评价，无质量评价与定量合成）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":19,"score_breakdown":{"clinical":2,"methodology":8,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"乙酰化-泛素化交互作用于NLRP3-GSDMD焦亡：一个与溃疡性结肠炎相关的“底物状态”描述性框架（叙述性综述，未证实人类UC中存在修饰偶联）","title_en":"Acetylation-ubiquitination crosstalk in NLRP3-gasdermin pyroptosis: a substrate-state framework with relevance to ulcerative colitis.","authors":"Zhao Y, Zhu X, Lu E, Meng H","affiliation_highlight":"Department of Gastroenterology, Binhai County People's Hospital, Yancheng, China.","results":"","authors_conclusion":"我们将这些发现归纳为四项底物属性：丰度、激活能力、定位与持续性。该框架是描述性整合，并非经验证证据等级或临床生物标志物；其与UC的相关性取决于在明确肠道细胞类型中确立修饰偶联，并将该偶联与更广泛的抗炎或屏障保护效应区分开来。","ai_note":"1) 检索截止日期标注为2026年8月10日，与常规发表时序不符，需核对该日期是否为笔误或预印本设定；2) 全文为叙述性综述，未提供检索式、纳入排除流程、PRISMA流程图或纳入研究偏倚风险评估，证据强度无法独立核验；3) 作者自述人类UC中“完整偶联通路尚未被证实”，却以非肠道系统（PHGDH、GITR、HDAC4）证据支撑框架，存在跨系统外推；4) 摘要未给出任何效应量或统计数值，无法评估证据一致性；5) 主题为溃疡性结肠炎与焦亡机制，与本评审的胸部肿瘤/胸外科范畴无实质交集。","pico":{"p":"无患者样本；为文献综述，分别汇总人类、肠道与非肠道系统证据","ic":"无干预与对照比较；检索策略为截至2026年8月10日的定向PubMed文献检索"},"reason":"该文与胸部肿瘤及胸外科临床决策无直接关联，不能影响手术患者选择、结节风险判断或围手术期方案；仅可作为NLRP3-焦亡通路机制的背景阅读，同时提示跨领域检索时需筛除主题不匹配的综述，以免稀释评审结论。","abstract_en":"Acetylation and ubiquitination regulate inflammatory cell death, but evidence that they act together in ulcerative colitis (UC) remains limited. This review examines their interactions in nucleotide-binding oligomerisation domain-, leucine-rich repeat- and pyrin domain-containing protein 3 (NLRP3) and gasdermin D (GSDMD), drawing on a targeted PubMed search for literature published through 10 August 2026. We distinguish coupling tested within one study from separate mechanisms affecting the same substrate, and report human, intestinal and non-intestinal evidence separately. Studies of phosphoglycerate dehydrogenase, the glucocorticoid-induced tumour necrosis factor receptor and histone deacetylase 4 support acetylation-ubiquitination coupling in non-intestinal systems. These findings differ in site resolution and do not establish competition between the modifications at one lysine. Other studies show that acetylation affects NLRP3 assembly or GSDMD activity, while ubiquitination regulates substrate abundance, assembly and degradation. In experimental colitis, selected NLRP3 ubiquitin pathways and GSDMD acetylation mechanisms influence inflammation, but the complete coupled pathways have not been demonstrated in human UC. We organise these findings around four substrate properties: abundance, activation competence, localisation and persistence. This framework is a descriptive synthesis, not a validated evidence hierarchy or clinical biomarker. Its relevance to UC depends on establishing modification coupling in defined intestinal cell types and distinguishing that coupling from broader anti-inflammatory or barrier-protective effects.","tags":["叙述性综述","NLRP3炎症小体","GSDMD焦亡","乙酰化-泛素化交互","溃疡性结肠炎","主题不匹配"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42904892","pmid":"42904892","pmcid":"","doi":"10.1097/PRS.0000000000013552","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904892/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Plast Reconstr Surg","journal_full":"PLASTIC AND RECONSTRUCTIVE SURGERY","tier":"A","if_val":3.6,"zone":"JCR Q1 · 2区","warned":false,"study_type":"基于连续病例的描述性解剖观察研究（74例上睑成形术，148个眼睑）","category":"surgery","category_label":"微创与无管化胸外科","score_total":18,"score_breakdown":{"clinical":0,"methodology":10,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"全部眼睑","metric":"下位横韧带识别率","val":"94%","stat":"","grounded":true,"checks":[{"num":"94%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"全部眼睑","metric":"提上睑肌腱膜平均长度","val":"17.6 mm","stat":"range 14-21 mm","grounded":true,"checks":[{"num":"17.6","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"14","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"21","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"全部眼睑","metric":"提上睑肌腱膜融合近端部分平均长度","val":"5.4 mm","stat":"range 4.0-8.0 mm","grounded":true,"checks":[{"num":"5.4","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"4.0","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"8.0","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"全部眼睑","metric":"下位横韧带识别率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部眼睑」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部眼睑","metric":"提上睑肌腱膜平均长度","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部眼睑」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部眼睑","metric":"提上睑肌腱膜融合近端部分平均长度","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部眼睑」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"上睑解剖的手术显微镜观察：下位横韧带识别率及提上睑肌腱膜长度测量","title_en":"Upper Eyelid Anatomy Revisited based on Detailed Operating Microscope Observations.","authors":"Wong CH, Hsieh MKH, Goy TWT, Minelli L, Mendelson B","affiliation_highlight":"W Aesthetic Plastic Surgery, Singapore.","results":"下位横韧带在94%的眼睑中被识别；提上睑肌腱膜平均长度17.6 mm（范围14-21 mm）；其融合近端部分平均长度5.4 mm（范围4.0-8.0 mm）","authors_conclusion":"This paper provides a clearer surgical roadmap, offering practical anatomical guidance for various cosmetic and reconstructive upper eyelid procedures.","ai_note":"该研究主题为眼睑解剖与整形外科，非胸部肿瘤/胸外科，临床相关性不适用；描述性研究无对照、无统计推断，94%未报告置信区间，范围不能替代离散度；作者“clearer surgical roadmap”属推断性表述，需外部验证。","pico":{"p":"74例连续原发性上睑成形术患者（148个眼睑），其中亚洲人54例、白种人20例","ic":"手术显微镜下解剖观察与测量；无对照组"},"reason":"与胸部肿瘤临床判断无关；仅可作为非胸部描述性解剖研究的方法学参照，不能影响胸外科患者选择、随访或结节风险判断。","abstract_en":"This anatomical study of the upper eyelid is based on detailed analysis of 74 consecutive primary upper blepharoplasty procedures (148 eyelids) performed under the operating microscope. There were 54 Asian and 20 Caucasian patients. Visualization under the miscroscope provided a unique operative perspective on the structural anatomy and relationships of the upper eyelid. The anatomy of the orbital septum and its relationships to the retro-orbicularis oculi fat (ROOF), levator aponeurosis, and retroseptal fat pads are presented in detail. The lower-positioned transverse ligament, its relationship to the anterior fascial sheath of the levator aponeurosis and the bilaminar nature of the levator aponeurosis, consisting of anterior and posterior layers, were clearly demonstrated. The lower-positioned transverse ligament was identified in 94% of eyelids. The mean length of the levator aponeurosis was 17.6 mm (range, 14-21 mm), and the mean length of its fused proximal portion was 5.4 mm (range, 4.0-8.0 mm). The clinical relevance of these anatomical findings in upper blepharoplasty is discussed. An anterior approach to the Müller muscle and its dissection is also presented. Finally, danger zones for bleeding are detailed with videographic demonstration. This paper provides a clearer surgical roadmap, offering practical anatomical guidance for various cosmetic and reconstructive upper eyelid procedures.","tags":["眼睑解剖","整形外科","非胸部肿瘤","描述性研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903340","pmid":"42903340","pmcid":"PMC13681183","doi":"10.3389/fimmu.2026.1929816","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903340/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 机制整合与治疗前景讨论（非系统评价）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":16,"score_breakdown":{"clinical":0,"methodology":8,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"TSPO在全身-眼部免疫代谢交互中的机制综述：提出三阶段模型并讨论生物标志物与治疗靶点","title_en":"TSPO in systemic-ocular immunometabolic crosstalk: mechanisms and therapeutic implications.","authors":"Yang Z, Zhang X, Tian D, Li X, Zhao X, Wang E, Chen Y","affiliation_highlight":"Department of Ophthalmology, Key Laboratory of Ocular Fundus Diseases, Peking Union Medical College Hospital, Chinese Ac…","results":"","authors_conclusion":"Current evidence suggests that TSPO is a promising immunometabolic node and underscores the need for cross-organ disease models, cell-specific TSPO manipulation, spatial multi-omics, and local ocular delivery strategies.","ai_note":"非胸外科/胸部肿瘤文献，与所列六类胸外科选题不匹配；摘要未说明系统检索、纳入排除标准或偏倚评估，属叙述性综述；将TSPO作为影像/体液生物标志物及治疗靶点的表述主要基于机制推断，缺乏临床验证数据；‘three-stage working model’为概念框架而非实证结果。","pico":{"p":"","ic":""},"reason":"与胸外科/胸部肿瘤临床判断无直接关系，不能用于手术患者选择、随访决策或结节风险判断；仅可作为TSPO相关免疫代谢交叉机制的背景概念阅读。","abstract_en":"The eye is increasingly recognized as a tissue shaped by systemic immune and metabolic states rather than an isolated immune-privileged organ. Translocator protein (TSPO), an 18-kDa outer mitochondrial membrane protein enriched in myeloid and glial cells, links mitochondrial homeostasis, redox signaling, lipid metabolism, and immune polarization. This review synthesizes evidence for TSPO involvement in systemic-ocular immunometabolic crosstalk and organizes it into a three-stage working model: peripheral immunometabolic priming, blood-retinal barrier vulnerability, and intraocular glial amplification. We review evidence from systemic autoimmune diseases with ocular manifestations, metabolic diseases with ocular complications, and primary ocular diseases with systemic contributions. We then assess the potential of TSPO as an imaging or fluid biomarker and as a therapeutic target. Current evidence suggests that TSPO is a promising immunometabolic node and underscores the need for cross-organ disease models, cell-specific TSPO manipulation, spatial multi-omics, and local ocular delivery strategies.","tags":["TSPO","免疫代谢","全身-眼部交互","叙述性综述","非胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903605","pmid":"42903605","pmcid":"PMC13681186","doi":"10.3389/fimmu.2026.1994058","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903605/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述（机制综述）· 非系统评价","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":15,"score_breakdown":{"clinical":1,"methodology":5,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"lncRNA–蛋白相互作用作为先天免疫精准调控分子开关的叙述性综述","title_en":"LncRNA-protein interactions: molecular switches for the precise regulation of innate immunity.","authors":"Yang C, Feng Y, Li C, He T, Xu L, Qiao Z, Wang J, Liu Z et al.","affiliation_highlight":"School of Bioengineering, Northwest Minzu University, Lanzhou, China.","results":"","authors_conclusion":"这些发现共同支持一个层级模型：lncRNA将特定的分子相互作用转化为蛋白质功能改变，并最终改变先天免疫状态；该框架为理解lncRNA–蛋白相互作用如何精细调控先天免疫以及评估其作为选择性免疫调节靶点的潜力提供了基础。","ai_note":"本文为机制叙述性综述，无系统检索策略、纳入排除标准、定量合成或偏倚评估，结论属框架性整合而非证据分级；主题为先天免疫分子机制，与胸外科/胸部肿瘤临床问题无直接对接；文中提出部分lncRNA可作用于特定蛋白状态而不改变总丰度，但作者亦承认该功能选择性的普遍性尚未确立，属推断性外推。信息不足：无任何临床或转化终点数据。","pico":{"p":"","ic":""},"reason":"与胸外科/胸部肿瘤的诊疗决策无直接关联，不能影响手术选择、结节风险判断或围术期方案；仅可能作为免疫机制背景参考，对临床科研选题的direct价值有限。","abstract_en":"Long non-coding RNAs (lncRNAs) have emerged as important regulators of innate immunity, acting across multiple molecular layers to shape antiviral and inflammatory responses. Among their diverse functions, protein-centered regulation provides a particularly versatile means of controlling immune signaling by altering the functional state, interactions, localization, or turnover of proteins without necessarily changing their transcription. In this review, we synthesize current evidence for lncRNA-mediated protein regulation in innate immunity and propose a protein-centered framework that connects molecular regulatory mechanisms with their functional and immunological consequences. At the mechanistic level, lncRNA-protein interactions can modulate post-translational modifications, alter protein conformations, and facilitate or disrupt protein-protein interactions. These regulatory modes, in turn, affect four major properties of immune proteins: protein stability, subcellular localization, molecular activity, and protein-protein interaction-dependent signal transmission, ultimately reshaping innate immune responses. Across these mechanisms, several recurrent principles emerge, including preferential regulation of functionally important signaling nodes, integration of multiple regulatory mechanisms, and strong dependence on cellular and immunological context. Emerging evidence further suggests that some lncRNAs may act on defined protein states or regulatory interfaces without altering total protein abundance, although the generality of such functional selectivity remains to be established. Together, these findings support a hierarchical model in which lncRNAs translate specific molecular interactions into changes in protein function and, ultimately, innate immune states. This framework provides a basis for understanding how lncRNA-protein interactions contribute to the fine-tuning of innate immunity and for evaluating their potential as targets for selective immune modulation.","tags":["lncRNA","先天免疫","蛋白相互作用","机制综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903463","pmid":"42903463","pmcid":"PMC13680831","doi":"10.3389/fimmu.2026.1921148","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903463/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述（非系统评价）· 机制与治疗策略整合","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":14,"score_breakdown":{"clinical":2,"methodology":4,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"综述：TGF-β在慢性肾脏病中的作用争议——从全局通路抑制转向细胞来源、时空与转录辅因子依赖的信号重编程","title_en":"TGF-β in chronic kidney disease: a controversy for decades.","authors":"Wang H, Tian J, Zheng G, Zhou Y","affiliation_highlight":"Centre for Transplant and Renal Research, Westmead Institute for Medical Research, The University of Sydney, Sydney, NSW…","results":"","authors_conclusion":"未来TGF-β靶向治疗应超越全局通路抑制，转向空间、时间与分子层面信息指导的信号重编程，并以生物标志物引导的患者分层及新兴单细胞与空间技术为支撑；这种精准调控有望在抑制病理性纤维化的同时保留免疫稳态与再生能力。","ai_note":"本文为慢性肾脏病领域的叙述性综述，与胸部肿瘤及胸外科临床决策无直接关联；摘要未交代检索策略、纳入标准与证据分级，属观点性整合而非系统评价，其提出的β-catenin-TCF/FOXO1轴“概念验证”仅停留在机制假设层面，缺乏临床结局数据；摘要中无任何可核查的原始研究数值。","pico":{"p":"","ic":""},"reason":"该文讨论的是CKD肾纤维化中TGF-β的细胞来源与时空依赖性调控，对胸部肿瘤围手术期、肺结节评估、手术决策或胸部肿瘤药物治疗均无可直接转化的证据；仅在TGF-β通路生物学层面（如纤维化与免疫稳态平衡的通路重编程思路）对胸部肿瘤相关转化研究设计有间接参考价值。","abstract_en":"Chronic kidney disease (CKD) is characterized by persistent inflammation, maladaptive repair and progressive renal fibrosis, yet therapeutic strategies capable of effectively targeting these interconnected processes remain limited. Transforming growth factor-β1 (TGF-β1) is a central mediator of renal fibrosis but also exerts essential immunoregulatory and tissue-protective functions, creating a fundamental therapeutic paradox. Emerging evidence indicates that these divergent effects are determined not simply by TGF-β1 abundance, but by its cellular source and target, spatial and temporal context, interactions with other signaling pathways, and the transcriptional cofactors that determine downstream gene expression. This context dependence may partly explain why systemic TGF-β neutralization has shown limited clinical efficacy despite compelling preclinical evidence. In this Review, we discuss the cell-specific and stage-dependent functions of TGF-β1 in CKD, controversies surrounding the cellular origins of renal myofibroblasts, and the integration of TGF-β signaling with some signaling pathways. We further examine lessons from clinical trials and emerging therapeutic approaches designed to selectively modulate pathological TGF-β signaling, including regulation of latent TGF-β activation, receptor and Smad signaling, transcriptional cofactors, tissue-targeted delivery, and gene- and cell-based strategies. Particular attention is given to transcriptional partner selection as a mechanism of signal reprogramming. The β-catenin-TCF/FOXO1 axis provides a proof of concept whereby redirecting β-catenin from profibrotic TCF-dependent transcription toward FOXO1-associated anti-inflammatory and reparative programs may preserve beneficial TGF-β functions while limiting fibrosis. We propose that future TGF-β-targeted therapy should move beyond global pathway inhibition toward spatially, temporally and molecularly informed signal reprogramming, supported by biomarker-guided patient stratification and emerging single-cell and spatial technologies. Such precision modulation may provide a more rational strategy to suppress pathological fibrosis while preserving immune homeostasis and regenerative capacity in CKD.","tags":["TGF-β","肾纤维化","慢性肾脏病","信号重编程","叙述性综述","非胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901985","pmid":"42901985","pmcid":"8664836","doi":"10.1038/s41467-021-27423-0","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901985/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-23","journal_abbr":"Nat Genet","journal_full":"NATURE GENETICS","tier":"A","if_val":25.5,"zone":"JCR Q1 · 1区","warned":false,"study_type":"Perspective · 概念性综述（非原始研究、非系统综述）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":14,"score_breakdown":{"clinical":0,"methodology":6,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"单等位基因先天性免疫缺陷的系统视角：表型由分子、细胞与免疫系统缓冲遗传变异所塑造","title_en":"A systems perspective on monoallelic inborn errors of immunity.","authors":"Werner M, Spaan AN, Mogensen TH","affiliation_highlight":"Department of Biomedicine, Aarhus University, Aarhus, Denmark.","results":"","authors_conclusion":"we revisit and extend classic concepts of genetic dominance and genetic pleiotropy and suggest that these are not sole properties of alleles but emerge from the complex and dynamic behavior of molecular, cellular and immune systems to buffer genetic variance.","ai_note":"非胸外科/胸部肿瘤文献；无样本量、临床终点或统计结果；概念性论述不能作为临床决策依据；无法评估偏倚风险。","pico":{"p":"","ic":""},"reason":"与胸部肿瘤临床判断无直接关系；仅提供单等位基因变异表型解释的概念框架，对胸外科患者选择、随访或结节风险判断无直接影响。","abstract_en":"The genetic architecture of inborn errors of immunity continues to grow in complexity, exposing the limitations of variant-centric concepts that have long shaped the field. While complete loss-of-function genotypes have been instrumental in defining essential gene functions in human immunity and inflammation, they have also entrenched binary interpretations of causality that fail to account for pleiotropy, variable expressivity and incomplete penetrance-especially in monoallelic disease. Monoallelic variants often perturb signaling rather than abolishing it. The integration of these perturbations into molecular and cellular systems, and eventually immune circuits, governs phenotypic expression. Here, we revisit and extend classic concepts of genetic dominance and genetic pleiotropy and suggest that these are not sole properties of alleles but emerge from the complex and dynamic behavior of molecular, cellular and immune systems to buffer genetic variance.","tags":["先天性免疫缺陷","单等位基因变异","系统生物学","概念框架"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903121","pmid":"42903121","pmcid":"PMC8781383","doi":"10.1093/schbul/sbab103","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903121/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"单例病例报告（Case report，n=1），无对照","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":10,"score_breakdown":{"clinical":4,"methodology":4,"specialty":2,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例","metric":"中性粒细胞绝对计数（化疗后4天）","val":"0.2 × 10^9/L","stat":"","grounded":false,"checks":[{"num":"0.2","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"10","grounded":false,"note":"数值未在原摘要出现"},{"num":"9","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["10","9"]},{"group":"单例","metric":"Bush-Francis紧张症评定量表评分（停药2周后）","val":"27","stat":"","grounded":true,"checks":[{"num":"27","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":["10","9"],"semantic_passed":false,"semantic_audit":[{"group":"单例","metric":"中性粒细胞绝对计数（化疗后4天）","population_ok":false,"metric_ok":false,"mismat  cessation, AB displayed catatonic symptoms characterised by mutism, posturing, and automatic obedience, scoring 27 on the Bush-Francis Catatonia Rating Scale (BFCRS). A positive lorazepam challenge confirmed the diagnosis of clozapine-withdrawal catatonia. Despite regular high-dose benzodiazepines and treatment with antipsychotics, AB's presentation continued to deteriorate, characterised by prominent delusions and hallucinations, impeding oncological treatment. AB was seen extensively by liaison psychiatry and treated with high-dose typical and atypical antipsychotics; however, she failed to respond adequately to treatment. Given AB's extensive previous history of management on clozapine without previous haematological disturbance and ongoing decline in mental state, coupled with the timeline of symptoms 4 days after the administration of chemotherapy agents associated with neutropenia, namely, carboplatin, the decision was taken to reinstate clozapine. Following titration of clozapine and transfer to a specialist psychiatric unit, AB's symptoms resolved rapidly, allowing for the successful completion of chemotherapy. Carboplatin was omitted in subsequent cycles, with no further episodes of neutropenia. DISCUSSION: This case highlights the diagnostic challenge of neutropenia in psychiatric patients on clozapine, who are also undergoing treatment for comorbid medical conditions. The presence of neutropenia in clozapine patients may lead to diagnostic overshadowing and delay the diagnosis of the underlying cause of neutropenia, resulting in delays to treatment as well as unnecessary cessation of clozapine and risk of relapse. Furthermore, this case highlights the risk of catatonia associated with the withdrawal of clozapine and the importance of its rapid identification and management. CONCLUSIONS: Clinicians should consider differing aetiologies of neutropenia in clozapine patients, especially those undergoing chemotherapy. Furthermore, clinicians should be skilled     $('#detail').innerHTML='<div class="detail-empty">信号已移出当前视野。<br>清除筛选或调整数据窗口后可继续查看详情。</div>';return;
  }
  const index=list.findIndex(item=>item.id===p.id),marked=state.read.has(p.id),status=statusOf(p),degraded=p.publish_state==='degraded';
  const paperUrl=safeUrl(p.url),trialUrl=safeUrl(p.trial_url),doi=String(p.doi||'').trim();
  const score=Number(p.score_total),hasScore=hasValue(p.score_total)&&Number.isFinite(score);
  const trial=p.nct_id?(trialUrl?`<a class="action-btn wide" href="${esc(trialUrl)}" target="_blank" rel="noopener">查看 ${esc(p.nct_id)} 试验记录 ↗</a>`:`<span class="action-btn wide">试验号 ${esc(p.nct_id)} · 链接 —</span>`):'';
  const paperLink=paperUrl?`<a class="action-btn primary" href="${esc(paperUrl)}" target="_blank" rel="noopener">打开题录 ↗</a>`:'<span class="action-btn primary">题录链接 —</span>';
  const doiLink=doi?`<a class="action-btn" href="https://doi.org/${encodeURIComponent(doi)}" target="_blank" rel="noopener">DOI 原文 ↗</a>`:'<span class="action-btn">DOI —</span>';
  const scoreTrack=hasScore?`<div class="score-track" aria-label="评分 ${score} 分"><i style="width:${Math.max(0,Math.min(100,score))}%"></i></div>`:'';
  const abstract=p.abstract_en||p.results||'';
  $('#detail').innerHTML=`<div class="detail-inner ${status.kind==='retracted'?'is-retracted':''}">
    <div class="detail-top"><span class="lock-id">SIGNAL LOCK / ${String(index+1).padStart(2,'0')}</span><span class="status-pill ${['retracted','concern','corrected'].includes(status.kind)?'has-icon':''} ${status.cls}">${status.label}</span></div>
    ${noticeMarkup(p,status)}
    <div class="detail-journal"><div><div class="journal-name">${esc(p.journal_full||p.journal_abbr||'—')}</div><div class="journal-meta">${esc(journalName(p))} · ${esc(show(p.pub_date))} · ${esc(show(p.tier))} 档</div></div><div class="score-box"><b>${esc(show(p.score_total))}</b><small>评分 · ${esc(show(p.score_source))}</small></div></div>
    ${scoreTrack}
    <h2 class="detail-title">${esc(p.title_zh||p.title_en||'—')}</h2>
    <div class="badges"><span class="badge accent">${esc(p.category_label||categoryOf(p.category).label)}</span><span class="badge">${esc(show(p.study_type))}</span>${p.nct_id?`<span class="badge">${esc(p.nct_id)}</span>`:''}${degraded?'<span class="badge paused">解读暂停</span>':''}</div>
    <div class="meta-grid">
      <div class="meta-cell"><small>PMID</small><b>${esc(show(p.pmid))}</b></div><div class="meta-cell"><small>出版状态</small><b>${esc(status.label)}</b></div>
      <div class="meta-cell"><small>影响因子 · 源值</small><b>${esc(show(p.if_val || null))}</b></div><div class="meta-cell"><small>分区 · 源值</small><b>${esc(show(p.zone))}</b></div><div class="meta-cell"><small>预警状态</small><b>${p.warned ? '⚠ 在预警名单' : '正常'}</b></div>
      <div class="meta-cell"><small>雷达日期</small><b>${esc(show(p.briefing_date))}</b></div><div class="meta-cell"><small>卷 / 期</small><b>${esc(issueOf(p))}</b></div>
      <div class="meta-cell"><small>评分口径</small><b>${esc(show(p.score_source))}</b></div><div class="meta-cell"><small>精选状态</small><b>${p.curated?'已入选':'未入选 · 不凑数'}</b></div>
    </div>
    <div class="interpretation">
      <div class="excerpt-label"><b>摘要导读</b><span>原始字段 · 非全文</span></div>
      <p class="excerpt">${esc(abstract||'摘要摘录暂缺，请通过题录链接查阅原文。')}</p>
      ${interpretationMarkup(p,degraded)}
    </div>
    <div class="detail-actions">${paperLink}${doiLink}${trial}<button class="action-btn wide ${marked?'marked':''}" id="mark-read">${marked?'✓ 已扫 · 点击撤销':'标记本篇已扫'}</button></div>
    <div class="detail-nav"><button class="nav-btn" id="prev-btn">← 上一信号</button><span class="nav-position">${index+1} / ${list.length}</span><button class="nav-btn" id="next-btn">下一信号 →</button></div>
  </div>`;
  $('#mark-read')?.addEventListener('click',()=>{state.read.has(p.id)?state.read.delete(p.id):state.read.add(p.id);render()});
  $('#prev-btn')?.addEventListener('click',()=>step(-1));
  $('#next-btn')?.addEventListener('click',()=>step(1));
}
function renderFunnel(){
  const f=SITE_DATA.funnel||{};
  $('#funnel').innerHTML=[['初抓',f.fetched],['刊源匹配',f.journal_matched],['简报入库',f.final],['规则精选',f.curated]].map(([label,value])=>`<div class="funnel-step"><b>${esc(show(value))}</b>${label}${label==='规则精选'&&value===0?' · 空缺':''}</div>`).join('');
}
function renderHeader(){
  $('#scan-date').textContent=ANCHOR?ANCHOR.replaceAll('-','.')+' / ANCHOR':'— / NO DATA';
  const generated=String(SITE_DATA.generated_at||SITE_DATA.updated_at||'');
  $('#scan-time').textContent=`${generated?generated.slice(0,16):'生成时间 —'} · 状态分项标注`;
}
function render(){
  const base=windowPapers(),tierBase=base.filter(tierOk),journals=journalUniverse(tierBase),list=filtered();
  if(list.length&&!list.some(p=>p.id===state.selected))state.selected=list[0].id;
  renderWindow();renderCategoryFilters(base);renderTierFilters(base);renderQueue(list);renderJournalLegend(journals);renderDesignLegend(list);renderScope(list,tierBase,journals);renderDetail(list);
  const readCount=PAPERS.filter(p=>state.read.has(p.id)).length;
  $('#read-count').textContent=`${String(readCount).padStart(2,'0')} / ${PAPERS.length}`;
  document.querySelectorAll('[data-quick]').forEach(btn=>btn.classList.toggle('active',btn.dataset.quick===state.quick));
}
function selectPaper(id,scroll=false){
  if(!PAPERS.some(p=>p.id===id))return;
  state.selected=id;render();
  if(scroll&&matchMedia('(max-width:900px)').matches)document.querySelector('.detail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function step(direction){
  const list=filtered();if(!list.length)return;
  const index=list.findIndex(p=>p.id===state.selected);
  state.selected=list[(index+direction+list.length)%list.length].id;render();
}
function toggleJournal(name){
  state.journal=state.journal===name?null:name;render();
}
document.addEventListener('click',event=>{
  const select=event.target.closest('[data-select]');
  if(select){selectPaper(select.dataset.select,true);return}
  const category=event.target.closest('[data-category]');
  if(category){state.category=category.dataset.category;render();return}
  const quick=event.target.closest('[data-quick]');
  if(quick){state.quick=quick.dataset.quick;render();return}
  const tier=event.target.closest('[data-tier]');
  if(tier){const name=tier.dataset.tier;state.tiers.has(name)?state.tiers.delete(name):state.tiers.add(name);render();return}
  const journal=event.target.closest('[data-journal]');
  if(journal){toggleJournal(journal.dataset.journal);return}
  if(event.target.closest('#journal-clear')){state.journal=null;render();return}
});
$('#window-range').addEventListener('input',event=>{state.days=Number(event.target.value);render()});
$('#search').addEventListener('input',event=>{state.query=event.target.value;render()});
$('#theme-btn').addEventListener('click',()=>{
  const dark=document.documentElement.classList.toggle('dark');
  $('#theme-btn').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');
  $('#theme-icon').innerHTML=dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/>';
});
document.addEventListener('keydown',event=>{
  if(event.key==='/'&&document.activeElement!==$('#search')){event.preventDefault();$('#search').focus()}
  if(event.key==='Escape'){state.query='';state.category='all';state.quick='all';state.journal=null;state.tiers=new Set(TIERS);$('#search').value='';render();$('#search').blur()}
  if((event.key==='Enter'||event.key===' ')&&document.activeElement?.classList.contains('journal-sector')){event.preventDefault();toggleJournal(document.activeElement.dataset.journal);return}
  if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    if(event.key==='ArrowLeft')step(-1);if(event.key==='ArrowRight')step(1);
  }
});
async function loadRollingPapers(){
  try{
    const response=await fetch('data/radar_latest.json');
    if(!response.ok)throw new Error('rolling window unavailable');
    const payload=await response.json(),latest=Array.isArray(payload)?payload:payload?.papers;
    if(!Array.isArray(latest))throw new Error('rolling window schema mismatch');
    PAPERS=mergePapers(latest);ANCHOR=findAnchor(PAPERS);renderHeader();render();
  }catch(error){
    console.info('滚动窗数据不可用，已静默降级为注入数据。');
  }
}
ANCHOR=findAnchor(PAPERS);
renderHeader();renderFunnel();render();
loadRollingPapers();
</script>
</body>
</html>
