ate-nodules. Breath volatile organic compound (VOC) analysis is a non-invasive candidate biomarker approach that could complement LDCT, but prior work has relied on laboratory-based high-resolution mass spectrometry (HRMS), limiting point-of-care deployment. METHODS: In this pilot study, breath samples were collected from 40 patients with treatment-naïve, pathologically confirmed non-small cell lung cancer (NSCLC) and 25 lung-cancer-screening-eligible healthy controls. Paired samples were analyzed via a compact point-of-care GC-MS platform (CLARION) and a laboratory HRMS reference. Diagnostic classification models were built independently for each platform using elastic net logistic regression with leave-one-out cross-validation, and performance was evaluated by area under the receiver operating characteristic curve (AUC). RESULTS: CLARION identified 103 VOCs across breath specimens, compared to over 900 identified by HRMS. Despite this difference in panel size, CLARION achieved diagnostic performance nearly identical to HRMS for distinguishing NSCLC cases from controls (AUC 0.864 vs. 0.863). Compared to controls, performance statistics were similar for early-stage NSCLC (AUC 0.854 vs. 0.841) and adenocarcinoma (AUC 0.770 vs. 0.787). VOCs of interest include p-cymene, phenol, propylbenzene, tetradecane, β-ocimene, 2,3-dihydro-indole, and 1-methylthio-(Z)-1-propene. CONCLUSION: A compact, point-of-care breath GC-MS platform achieved diagnostic performance for NSCLC detection comparable to a laboratory HRMS reference despite a substantially smaller detected VOC panel. These findings support continued development of point-of-care breath VOC testing as a non-invasive, field-deployable complement to LDCT-based lung cancer screening.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922693","pmid":"42922693","pmcid":"PMC13684634","doi":"10.64898/2026.08.27.747606","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922693/","notice_url":"","trial_url":"","pub_date":"2026-Sep-02","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"spatialMET: an open and scalable framework for spatial metabolomics analysis.","title_en":"spatialMET: an open and scalable framework for spatial metabolomics analysis.","authors":"Mekonnen YA, Ospina OE, Rubio V, Welsh E, Uddin R, Ackerman HD, Soupir A, Cox JE et al.","affiliation_highlight":"","results":"Mass spectrometry imaging (MSI) enables spatially resolved metabolomics in intact tissue sections, but analysis remains challenging at scale. Existing MSI workflows often require users to combine multiple software tools,…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Mass spectrometry imaging (MSI) enables spatially resolved metabolomics in intact tissue sections, but analysis remains challenging at scale. Existing MSI workflows often require users to combine multiple software tools, while others rely on proprietary vendor software that limits interoperability and reproducibility. To address these challenges, we developed spatialMET, an open-source framework that provides an end-to-end workflow for MSI analysis. spatialMET provides a unified platform for preprocessing, spatial domain detection, and visualization. Downstream analyses include differential abundance testing, spatial autocorrelation and gradient analysis, dimensionality reduction, and correlation network analysis. Spatial domain detection uses hcdist, a C-based hierarchical clustering implementation that substantially reduces runtime and memory use relative to existing R-based approaches. spatialMET can be run through an interactive R Shiny application or as a standalone command-line workflow for larger datasets or high-performance computing environments. Applied to mouse small cell lung cancer MALDI-MSI data containing 284,673 pixels, spatialMET identified tumor-associated, stromal, and adjacent lung spatial domains that aligned with matched histology. Differential abundance analysis identified 117 m/z features that differed between tumor and stromal regions, while spatial autocorrelation analyses revealed spatially structured abundance patterns. Applying spatialMET to mouse lung adenocarcinoma data from an entire lung lobe containing 338,477 pixels further demonstrated scalability and captured spatial heterogeneity across tumor and surrounding lung tissue. In summary, spatialMET provides a scalable, open-source framework for end-to-end spatial metabolomics analysis, and it is distributed as a Docker container for reproducible deployment. Source code and installation instructions are available at https://github.com/biodatalab/spatialMET .","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922629","pmid":"42922629","pmcid":"PMC13684644","doi":"10.64898/2026.08.31.748151","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922629/","notice_url":"","trial_url":"","pub_date":"2026-Sep-01","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Immunizing small cell lung cancer mice with isoaspartylated Elavl4 after chemotherapy mimics improved survival of anti-ELAVL4 antibody-positive small cell lung cancer patients.","title_en":"Immunizing small cell lung cancer mice with isoaspartylated Elavl4 after chemotherapy mimics improved survival of anti-ELAVL4 antibody-positive small cell lung cancer patients.","authors":"Velarde DA, Valdes JA, Lee H, Yan C, Elmalh S, Moreno AD, Mullen DJ, Gladstone MA et al.","affiliation_highlight":"","results":"INTRODUCTION: Small cell lung cancer (SCLC) patients have an ∼8% 5-year survival; new therapies are urgently needed. Approximately 15% of SCLC patients have naturally-occurring low-titer antibodies against neuronal ELAVL…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Small cell lung cancer (SCLC) patients have an ∼8% 5-year survival; new therapies are urgently needed. Approximately 15% of SCLC patients have naturally-occurring low-titer antibodies against neuronal ELAVL proteins, associated with improved response to therapy and significantly improved survival. We previously determined that the anti-ELAVL4 response is triggered by isoaspartylation in the unstructured ELAVL4 N-terminal region. METHODS: We used a Tp53 fl/fl ; Rb1 fl/fl inducible SCLC mouse model to test whether 1) immunization with isoaspartylated Elavl4 (isoAsp-Elavl4) prior to SCLC induction improves survival in the absence of any other treatment, and 2) immunization with isoAsp-Elavl4 following completion of 3 rounds of cisplatin+etoposide therapy improves survival. Immunizations contained incomplete Freund's adjuvant with either a recombinant N-terminal fragment of Elavl4 (amino acids 1-117), incubated under isoaspartyl-inducing conditions, or phosphate-buffered saline (used as the negative control, since Elavl4 spontaneously isoaspartylates). Mice were monitored by blinded assessors until euthanasia was indicated. RESULTS: IsoAsp-Elavl4-immunized animals all became immune responsive, and spontaneous anti-isoAsp-Elavl4 antibodies were observed in 7% of the control animals. Kaplan-Meier analyses revealed that pre-SCLC immunization with isoAsp-ELAVL4 in the absence of other treatments did not affect survival. In contrast, immunization of SCLC mice following chemotherapy significantly improved survival. CONCLUSIONS: An anti-isoAsp-ELAVL4 response can be actively induced in mice and significantly increases SCLC survival when given following chemotherapy. This indicates that the anti-isoAsp-ELAVL4 immune response can be leveraged to develop new therapies for SCLC patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922570","pmid":"42922570","pmcid":"PMC13684533","doi":"10.64898/2026.08.30.748130","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922570/","notice_url":"","trial_url":"","pub_date":"2026-Sep-03","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"HiC-LEGO: Biologically Guided High-Resolution 3D Genome Reconstruction Preserves Chromatin Organization at Kilobase Resolution.","title_en":"HiC-LEGO: Biologically Guided High-Resolution 3D Genome Reconstruction Preserves Chromatin Organization at Kilobase Resolution.","authors":"Pandeya A, Chowdhury MFK, Oluwadare O","affiliation_highlight":"","results":"Three-dimensional (3D) chromosome reconstruction from Hi-C contact maps remains challenging because genome organization is hierarchical and fine-resolution models must reconcile local structure with chromosome-scale cons…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Three-dimensional (3D) chromosome reconstruction from Hi-C contact maps remains challenging because genome organization is hierarchical and fine-resolution models must reconcile local structure with chromosome-scale constraints. Here we present HiC-LEGO, a domain-aware hierarchical framework integrating ensemble chromatin domains with graph-based structural learning and progressive chromosome assembly. By combining ensemble domain selection with hierarchical reconstruction, HiC-LEGO reduces dependence on individual domain definitions while maintaining local organization during chromosome-scale assembly. Across five human cell lines at 5-kb resolution, HiC-LEGO achieves higher reconstruction concordance than evaluated state-of-the-art methods while better preserving domain organization. At 1-kb resolution, HiC-LEGO reconstructs complete GM12878 chromosome 8 and recovers close spatial proximity between an epigenomically supported distal MYC enhancer and its promoter. Reconstructions from 5-kb Micro-C data show that 249 experimentally defined RCMC microcompartment interactions at the Ppm1g locus occupy compact 3D configurations. In the breast cancer dataset, HiC-LEGO reconstructs structures that maintain stable TAD organization across healthy breast, primary tumors, and liver metastases, while revealing greater inter-patient structural heterogeneity in malignant pleural effusion samples. Pore-C validation shows that experimentally observed multi-way contacts spanning 1-5 Mb are enriched in compact reconstructed configurations across all 23 chromosomes. Thus, HiC-LEGO preserves regulatory interactions, disease-associated chromatin organization and higher-order spatial relationships beyond pairwise contact-map concordance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922153","pmid":"42922153","pmcid":"","doi":"10.1177/13591053261494284","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922153/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"J Health Psychol","journal_full":"Journal of health psychology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A longitudinal study of lung cancer stigma across 6 months in a trial of supportive care interventions.","title_en":"A longitudinal study of lung cancer stigma across 6 months in a trial of supportive care interventions.","authors":"Rose S, Boyes A, Kelly B, Cox M, Palazzi K, Paul C","affiliation_highlight":"The University of Sydney, and Cancer Council NSW, Sydney, NSW, Australia.","results":"People with lung cancer commonly experience stigma, however, the temporal impacts are poorly understood. This study investigated changes (using linear mixed modelling) and trajectories (using latent growth modelling) of …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"People with lung cancer commonly experience stigma, however, the temporal impacts are poorly understood. This study investigated changes (using linear mixed modelling) and trajectories (using latent growth modelling) of stigma over a 6-month period in people newly diagnosed with lung cancer, who were participants of a larger trial of supportive care interventions (ACTRN12615000932561). Participants (n = 192) completed surveys which included the Cataldo Lung Cancer Stigma Scale. Lung cancer stigma did not vary significantly over time, with mean scores of 53.2 ± 15.6 and 54.0 ± 16.7 reported at recruitment and 6 months respectively (range 31-124, higher scores indicate greater stigma). Two main trajectory patterns were identified: (1) 'Relatively lower stigma trajectory'; and (2) 'Relatively higher stigma trajectory'. Relatively higher stigma trajectories were associated with younger age and a history of smoking. Further research is warranted to identify strategies to reduce lung cancer stigma and explore differences across sub-groups and stages of the lung cancer continuum.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921941","pmid":"42921941","pmcid":"","doi":"10.1177/10668969261489627","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921941/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"Int J Surg Pathol","journal_full":"International journal of surgical pathology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Two-Stage Deep Learning Framework for Histopathological Subtyping of Non-Small Cell Lung Carcinoma in Small Biopsies.","title_en":"Two-Stage Deep Learning Framework for Histopathological Subtyping of Non-Small Cell Lung Carcinoma in Small Biopsies.","authors":"Ozbek B, Dogan HN, Vural C, Yetim K, Celik A, Urhan O, Yaprak Bayrak B","affiliation_highlight":"Department of Pathology, Kocaeli University School of Medicine, Kocaeli, Turkey.","results":"Artificial intelligence (AI)-based technologies have the potential to improve diagnostic accuracy while reducing tissue loss in small biopsies. In non-small-cell lung carcinoma (NSCLC), small biopsies often limit ancilla…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Artificial intelligence (AI)-based technologies have the potential to improve diagnostic accuracy while reducing tissue loss in small biopsies. In non-small-cell lung carcinoma (NSCLC), small biopsies often limit ancillary testing. We aimed to develop a deep learning-based framework for automated histopathological classification of NSCLC subtypes. Archived hematoxylin and eosin-stained whole-slide images from 341 NSCLC and benign specimens were digitized and annotated by two expert pathologists. A two-stage Dense Net121-based cascade was employed: Stage 1 differentiated not otherwise specified (NOS) from not-NOS specimens; Stage 2 classified not-NOS into adenocarcinoma, squamous cell carcinoma, or non-cancerous tissue. Patient-level predictions were derived via majority voting. Performance was evaluated using accuracy, precision, recall, and F1-score. In Stage 1, NOS versus not-NOS classification achieved 0.92 patient-level accuracy. In Stage 2, accuracy for adenocarcinoma, squamous cell carcinoma, and non-cancer was 0.94, with perfect classification of non-cancer patients (precision, recall, and F1 = 1.00). In the final step, the combined analysis demonstrated an overall accuracy of 0.88, with recall rates of 1.00 for adenocarcinoma and non-cancer, 0.83 for squamous cell carcinoma, and 0.67 for NOS. The proposed two-stage model demonstrated strong performance across NSCLC subtypes, including the diagnostically challenging NOS group. This approach may reduce reliance on ancillary tests, accelerate diagnosis, and optimize tissue preservation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921660","pmid":"42921660","pmcid":"","doi":"10.1021/acssensors.6c02774","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921660/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"ACS Sens","journal_full":"ACS sensors","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A DNA Logic-Gated Cascade Amplification Biosensor for Highly Specific Electrochemical Detection of Circulating Tumor Cells.","title_en":"A DNA Logic-Gated Cascade Amplification Biosensor for Highly Specific Electrochemical Detection of Circulating Tumor Cells.","authors":"Zhao X, Su L, Ren H, Zhang Y, Ou S, Peng Y","affiliation_highlight":"School of Medicine and Health Management, Guizhou Medical University, Guiyang550025, China.","results":"Circulating tumor cells (CTCs) are rare cancer-derived cells in peripheral blood, carrying vital information about tumor heterogeneity and progression. Their reliable detection remains challenging due to extreme rarity a…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Circulating tumor cells (CTCs) are rare cancer-derived cells in peripheral blood, carrying vital information about tumor heterogeneity and progression. Their reliable detection remains challenging due to extreme rarity and high background interference. Herein, we report an electrochemical biosensor that integrates a DNA-based AND logic gate with cascaded signal amplification for the specific and sensitive determination of CTCs. The system requires the co-recognition of EpCAM and MUC1 on the cell surface via corresponding aptamers, which initiates an amplification cascade comprising hybridization chain reaction, DNAzyme-mediated cleavage, and entropy-driven assembly. This cascade ultimately results in the in situ formation of a DNA network on the electrode, enabling the capture of platinum-coated gold nanoparticles (Au@PtNPs) via biotin-streptavidin interaction, thereby significantly enhancing the electrocatalytic signal. The biosensor exhibits a linear response from 50 to 2.5 × 105 cells mL-1 with a detection limit down to 14 cells mL-1. It also exhibits high selectivity against nontarget cells, isolated proteins, and cellular debris, and displays excellent stability in serum and whole blood. Thus, this work may provide a reliable and clinically translatable strategy for CTC-based liquid biopsy, highlighting its potential for personalized lung cancer management.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921262","pmid":"42921262","pmcid":"PMC13693799","doi":"10.2147/CMAR.S635356","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921262/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Cancer Manag Res","journal_full":"Cancer management and research","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（narrative review）· 文献综述与展望","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":12,"methodology":8,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"纵向影像联合时序深度学习用于肺癌动态风险预测：叙述性综述，梳理从静态图像分析向持续风险更新建模的进展与转化障碍","title_en":"Longitudinal Imaging and Temporal Deep Learning for Dynamic Risk Prediction in Lung Cancer: Current Progress and Future Perspectives.","authors":"Li Y, Lu J, Tan X, Cai J, Wang Y, Wang Z, Ye Q","affiliation_highlight":"Department of Oncology, The First Affiliated Hospital of Yangtze University, Jingzhou, People's Republic of China.","results":"","authors_conclusion":"纵向影像与时序深度学习正推动肺癌AI从静态图像分析转向动态疾病管理，有望支持持续风险评估，并可能在全流程肺癌诊疗中为适应性临床决策提供信息；同时仍存在大规模纵向数据集稀缺、时间采样不规则、模型泛化性有限、因果可解释性不足以及缺乏稳健的真实世界部署证据等障碍。","ai_note":"叙述性综述，未提供系统检索流程图、纳入/排除标准、文献筛选数量与质量评价方法，结论属叙述性归纳而非证据合成；摘要称检索截至“September 2026”，为未来日期，存在时间标注错误或预印/排版问题；通篇以“encouraging applications”“potential”等表述呈现前景，缺乏对现有纵向时序模型与静态模型头对头性能比较的量化证据；对真实世界部署证据不足的表述与前述乐观应用并列，存在选择性强调倾向。","pico":{"p":"","ic":""},"reason":"为胸部肿瘤AI研究提供纵向影像+时序建模的框架性梳理，可用于确定结节随访、复发监测与生存预测等场景的模型设计变量（时间采样、多模态融合、持续风险更新）与常见偏倚来源，并提示该方向目前缺乏可支持临床部署的稳健证据。","abstract_en":"Lung cancer is a dynamically evolving disease characterized by marked temporal heterogeneity across tumor progression, treatment response, resistance development, and clinical outcomes. Nevertheless, the majority of existing artificial intelligence (AI) systems continue to rely predominantly on single time-point imaging, imposing inherent constraints on their capacity to characterize disease evolution and capture continuously shifting risk states. The growing availability of longitudinal imaging data, combined with ongoing advances in temporal deep learning, is driving a transition in lung cancer AI from static image interpretation toward dynamic risk prediction. In this narrative review, relevant literature was identified through searches of PubMed/MEDLINE, Web of Science Core Collection, and Scopus from database inception to September 2026, using terms related to lung cancer, longitudinal imaging, temporal deep learning, and dynamic risk prediction, with representative studies selected according to their methodological relevance, clinical applications, and implications for clinical translation. Longitudinal imaging tracks disease trajectories over time and offers distinct opportunities to characterize tumor growth dynamics, treatment-induced changes, and evolving recurrence risk. Temporal deep learning, in turn, enables the modelling of complex time-dependent relationships that conventional static approaches are poorly suited to represent. The field has progressed from early dual time-point analyses to long-range temporal modelling, multimodal temporal fusion, and continuous risk updating, with encouraging applications spanning pulmonary nodule management, treatment response assessment, recurrence surveillance, survival prediction, and individualized disease management. Nonetheless, substantial obstacles persist, including the scarcity of large-scale longitudinal datasets, irregular temporal sampling, limited model generalizability, insufficient causal interpretability, and a lack of robust evidence supporting real-world clinical deployment. Addressing these challenges will require coordinated efforts toward standardized longitudinal data infrastructure, continuous-time modelling frameworks, multimodal integration strategies, and closer alignment of AI systems with clinical workflows. Taken together, longitudinal imaging and temporal deep learning are steering lung cancer AI away from static image analysis and toward dynamic disease management, with the potential to support continuous risk assessment and potentially inform adaptive clinical decision-making throughout the full spectrum of lung cancer care.","tags":["纵向影像","时序深度学习","肺癌","动态风险预测","叙述性综述","结节随访"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42920909","pmid":"42920909","pmcid":"PMC3298961","doi":"10.32614/CRAN.package","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42920909/","notice_url":"","trial_url":"","pub_date":"2026-Nov-20","briefing_date":"2026-10-25","journal_abbr":"iScience","journal_full":"iScience","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Epigenetic age acceleration enhances prediction of overall survival in early-stage non-small cell lung cancer.","title_en":"Epigenetic age acceleration enhances prediction of overall survival in early-stage non-small cell lung cancer.","authors":"Gandara I, Du M, Li Y, Su L, Kothari J, Lanuti M, Gainor JF, Christiani DC et al.","affiliation_highlight":"Department of Biological Engineering, Massachusetts Institute of Technology, Cambridge MA, USA.","results":"Epigenetic age, influenced by environmental factors like smoking, predicts mortality in general populations but remains under-explored in early-stage lung cancer. We analyzed blood DNA methylation from 75 Boston Lung Can…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Epigenetic age, influenced by environmental factors like smoking, predicts mortality in general populations but remains under-explored in early-stage lung cancer. We analyzed blood DNA methylation from 75 Boston Lung Cancer Study participants with early-stage non-small cell lung cancer (NSCLC), of whom 63 died during follow-up. Epigenetic age acceleration (EAA) was estimated using Horvath, Hannum, PhenoAge, and GrimAge2 clocks and assessed using Cox models and random survival forests (RSFs). Across clocks, EAA significantly predicted survival in early-stage NSCLC. GrimAge2 EAA achieved the highest predictive accuracy (C index = 0.73±0.04) and emerged as the dominant predictor of survival among RSF models (variable importance = 5.7%), surpassing smoking and age. GrimAge2 EAA showed a non-linear association with mortality in which current smokers had >10% higher predicted mortality risk than former or never smokers at equivalent EAA, a pattern confirmed in Kaplan-Meier analyses. GrimAge2 EAA is a promising biomarker for personalizing risk stratification alongside traditional clinical factors.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924167","pmid":"42924167","pmcid":"PMC12660860","doi":"10.1016/j.jtocrr.2026.101037","nct_id":"NCT04585035","url":"https://pubmed.ncbi.nlm.nih.gov/42924167/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT04585035","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"JTO Clin Res Rep","journal_full":"JTO Clinical and Research Reports","tier":"C","if_val":3.6,"zone":"JCR Q2 · 未收录","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Garsorasib (D-1553) in Combination With Pembrolizumab and Chemotherapy for First-Line Metastatic NSCLC With KRAS G12C Mutation: Results of a Phase 1b Study.","title_en":"Garsorasib (D-1553) in Combination With Pembrolizumab and Chemotherapy for First-Line Metastatic NSCLC With KRAS G12C Mutation: Results of a Phase 1b Study.","authors":"Yan D, Liu C, Li X, Moore M, Xu R, Sanborn RE, Gadgeel SM, Millward M et al.","affiliation_highlight":"Department of Oncology, Beijing Luhe Hospital, Capital Medical University, Beijing, People's Republic of China.","results":"INTRODUCTION: Garsorasib (D-1553) is an orally administered selective KRAS G12C inhibitor. We report results from group 1 of the phase 1b D1553-101 study assessing garsorasib plus pembrolizumab and platinum-based chemoth…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Garsorasib (D-1553) is an orally administered selective KRAS G12C inhibitor. We report results from group 1 of the phase 1b D1553-101 study assessing garsorasib plus pembrolizumab and platinum-based chemotherapy in participants with KRAS G12C-mutated advanced or metastatic NSCLC. METHODS: Eligible participants had locally advanced or metastatic NSCLC with KRAS G12C mutation and were candidates for pembrolizumab plus platinum-based chemotherapy. Participants received garsorasib 600 mg once daily or twice daily combined with pembrolizumab 200 mg once every 3 weeks plus 4 to 6 cycles of cisplatin or carboplatin and pemetrexed (nonsquamous histology) or carboplatin and paclitaxel (squamous histology). The primary end points were safety and the incidence of dose-limiting toxicities (DLTs). RESULTS: As of February 24, 2024, 17 participants received garsorasib 600 mg once daily (n = 10) or twice daily (n = 7) combined with pembrolizumab plus platinum-based chemotherapy. Overall, 94% of participants experienced grade 3 or higher treatment-related adverse events (AEs), and 88% had a dose reduction or interruption due to treatment-related AEs. One participant in the twice-daily group experienced a DLT of grade 2 diarrhea; no other DLTs occurred. Among all participants, the objective response rate was 59%, and the median progression-free survival was 7.4 months. CONCLUSION: In participants with KRAS G12C-mutated locally advanced or metastatic NSCLC, despite an encouraging signal of efficacy, the incidence of treatment-related AEs with garsorasib plus pembrolizumab and platinum-based chemotherapy was high, and participants frequently had dose modifications or interruptions due to treatment-related AEs. Based on these findings, the study did not proceed to phase 2. CLINICALTRIALSGOV IDENTIFIER: NCT04585035.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923766","pmid":"42923766","pmcid":"PMC4920070","doi":"10.1038/nchembio.2079","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923766/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Ferroptosis-driven radio-immunosensitization: an emerging mechanistic framework for enhancing response to immune checkpoint inhibitor therapy.","title_en":"Ferroptosis-driven radio-immunosensitization: an emerging mechanistic framework for enhancing response to immune checkpoint inhibitor therapy.","authors":"Cao Z, Ao X","affiliation_highlight":"Department of Tumor Biological Therapy, Affiliated Cancer Hospital of Inner Mongolia Medical University, Hohhot, China.","results":"Immune checkpoint inhibitors (ICIs) provide durable tumor control in some patients, but resistance can develop through tumor-intrinsic and microenvironmental mechanisms. This narrative review examines the metabolic and i…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Immune checkpoint inhibitors (ICIs) provide durable tumor control in some patients, but resistance can develop through tumor-intrinsic and microenvironmental mechanisms. This narrative review examines the metabolic and immune conditions under which ferroptosis may enhance ICI responsiveness or resensitize selected ICI-refractory tumors. Radiotherapy (RT) increases oxidizable phospholipids and can repress SLC7A11, the light-chain component of system xc-. ICI-activated CD8+ T cells provide convergent interferon-γ signaling. Tumors can resist this pressure through GPX4, FSP1-CoQ10, mitochondrial DHODH, NRF2-dependent programs, and iron-export pathways. Recent preclinical studies have tested RT with ferroptosis-directed interventions and ICIs. These studies include functional evidence of ferroptosis dependence in radioresistant lung cancer and resensitization of LKB1-deficient, primarily ICI-refractory tumors. The findings support a preclinical rationale for combination therapy, although their causal strength varies. Reversal of clinically defined acquired ICI resistance remains unestablished, and the clinical RT-ICI studies reviewed here did not measure ferroptosis in patients. The immune effects also vary by cell type. Tumor-cell ferroptosis may support immunity, whereas lipid peroxidation in CD8+ T cells, dendritic cells, or polymorphonuclear myeloid-derived suppressor cells can impair antitumor responses. Translation will require functional validation, cell-resolved biomarkers, achievable drug exposures, and evaluation of RT dose, fractionation, and sequence alongside normal-tissue and immune-cell safety.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923081","pmid":"42923081","pmcid":"PMC7925608","doi":"10.1016/j.ejca.2026.116936","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923081/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Case Report: Coexpression of somatic EGFR, BRCA1, and BRCA2 mutations in metastatic non-small cell lung cancer.","title_en":"Case Report: Coexpression of somatic EGFR, BRCA1, and BRCA2 mutations in metastatic non-small cell lung cancer.","authors":"Negin A, Sachdeva K, Weiss J","affiliation_highlight":"Southern Oncology Hematology Associates, Inspira Health System, Vineland, NJ, United States.","results":"BACKGROUND: Treatment of non-small cell lung cancer (NSCLC) has evolved dramatically over the past decade with the advent of widespread genetic testing, immunotherapy, and targeted therapies. Treatments directed against …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Treatment of non-small cell lung cancer (NSCLC) has evolved dramatically over the past decade with the advent of widespread genetic testing, immunotherapy, and targeted therapies. Treatments directed against epidermal growth factor receptor (EGFR) and other driver mutations have reduced toxicity and improved efficacy for selected patients. CASE PRESENTATION: We present a 59-year-old man with metastatic NSCLC harboring coexisting EGFR, BRCA1, and RNA-binding motif protein 10 (RBM10) mutations and high programmed death-ligand 1 (PD-L1) expression. A BRCA2 mutation was later detected on peripheral blood testing. The patient presented with a debilitating stroke that included dysphagia and hemiparesis. During his course of care, he received osimertinib, after which EGFR and RBM10 variant allele frequencies (VAFs) increased on peripheral blood testing. He also received immunotherapy and olaparib. Despite high response rates reported in the literature, he did not respond to these agents. He had a response to chemotherapy but tolerated it poorly. Ultimately, given the lack of durable response and his inability to tolerate chemotherapy, the patient opted for palliative care. DISCUSSION: Patients with actionable targets such as EGFR, BRCA1/2, or elevated PD-L1 generally have superior outcomes with targeted and combination therapy compared with patients who lack targetable options. However, coexisting mutations can interact and provide escape mechanisms. The lack of response in our patient is consistent with studies showing reduced efficacy of EGFR-directed therapy in the presence of RBM10 loss-of-function (LOF) alterations. Further research in patients with multiple concurrent mutations is needed to improve treatment options for this group.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923069","pmid":"42923069","pmcid":"PMC5340677","doi":"10.1159/000365595","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923069/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"N-WASP deficiency enhances oncogenic KRAS-mediated lung adenocarcinoma progression in mice.","title_en":"N-WASP deficiency enhances oncogenic KRAS-mediated lung adenocarcinoma progression in mice.","authors":"Verma A, Li N, Kalailingam P, Kim C, Sharma A, Lee YH, Thanabalu T","affiliation_highlight":"School of Biological Sciences, Nanyang Technological University, Singapore, Singapore.","results":"OBJECTIVE: Oncogenic KRAS mutations drive 25-30% of western lung adenocarcinoma (LUAD) cases, however the mechanisms that restrain tumor progression remain poorly defined. N-Wiskott-Aldrich syndrome protein (N-WASP) regu…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: Oncogenic KRAS mutations drive 25-30% of western lung adenocarcinoma (LUAD) cases, however the mechanisms that restrain tumor progression remain poorly defined. N-Wiskott-Aldrich syndrome protein (N-WASP) regulates actin cytoskeleton dynamics and epithelial architecture, but its role in KRAS-driven lung tumorigenesis is unclear. METHODS: We generated a conditional N-WASP knockout in KRASG12D-driven lung adenocarcinoma mice (N-WASPLKO/KRASG12D) using Sftpc-CreERT2, and assessed N-WASP knockdown A549 cells (A549KD) in 3D culture for tumor burden, ERK signaling, transcriptomic changes, and E-cadherin expression. RESULTS: Conditional deletion of N-WASP in type II alveolar cells (N-WASPLKO) markedly increased tumor number and size in KRASG12D mice. The tumors isolated from these mice retained strong pro-surfactant protein C expression, confirming alveolar epithelial origin and predominantly adopted a solid growth pattern, indicative of disrupted epithelial organization. Mechanistically, N-WASP loss enhanced KRAS-driven ERK1/2 activation in lung tissue, consistent with increased mitogenic signaling. In A549 cells, N-WASP deficiency disrupted cytoskeletal architecture, promoted proliferation, and impaired cell-cell adhesion, recapitulating in vivo tumor phenotypes. A kinase inhibitor screen identified Rho-associated protein kinase (ROCK) activity as a driver of this hyperproliferative phenotype, with ROCK inhibition normalizing proliferation in N-WASP-deficient cells, linking elevated Rho/ROCK signaling to the increased ERK1/2 activation observed upon N-WASP loss. Transcriptomic profiling of N-WASP-deficient lungs revealed coordinated upregulation of genes regulating proliferation, cytoskeletal remodeling, and tumor-promoting pathways, alongside downregulation of epithelial differentiation and adhesion programs. CONCLUSION: These results establish N-WASP as a critical suppressor of KRAS-driven lung adenocarcinoma, linking cytoskeletal integrity to oncogenic signaling and transcriptional regulation. Our findings highlight the interplay between actin dynamics, epithelial architecture, and KRAS signaling, suggesting that targeting N-WASP dependent pathways could modulate lung cancer aggressiveness and offer novel therapeutic opportunities.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42921029","pmid":"42921029","pmcid":"PMC6611418","doi":"10.1177/03009858261489590","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921029/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A large animal lung cancer model for the evaluation of intratumoural cisplatin delivery strategies.","title_en":"A large animal lung cancer model for the evaluation of intratumoural cisplatin delivery strategies.","authors":"Meehan J, Collie D, Chang Z, Gregson R, Clutton RE, Greenhalgh SN, Grant L, Kennedy S et al.","affiliation_highlight":"The Royal (Dick) School of Veterinary Studies and Roslin Institute, University of Edinburgh, Edinburgh, United Kingdom.","results":"INTRODUCTION: Cisplatin has been a standard chemotherapeutic agent for advanced non-small cell lung cancer for decades. Conventionally administered intravenously, it undergoes systemic distribution, exposing both tumour …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Cisplatin has been a standard chemotherapeutic agent for advanced non-small cell lung cancer for decades. Conventionally administered intravenously, it undergoes systemic distribution, exposing both tumour and healthy tissues to the drug. Endobronchial ultrasound-guided transbronchial needle injection of cisplatin is emerging as a potential intratumoural drug delivery (ITDD) strategy. However, rigorous preclinical research is needed before ITDD can be more widely adopted. METHODS: We used our experimentally induced ovine pulmonary adenocarcinoma (OPA) model, generated by Jaagsiekte sheep retrovirus (JSRV) infection, to evaluate transthoracic and transbronchial ITDD techniques. We compared systemic platinum exposure following intravenous cisplatin delivery with that following intratumoural cisplatin administration. Both non-recovery and recovery studies were conducted in a total of eight sheep. RESULTS: ITDD techniques were successfully developed and performed in three tumour bearing sheep during non-recovery procedures. To provide a reference for systemic platinum exposure, intravenous cisplatin was administered to three JSRV-infected sheep that did not develop OPA. Intravenous administration produced a rapid plasma platinum peak followed by a rapid decline. ITDD resulted in preferential platinum deposition within targeted lung tumours while producing substantially lower systemic platinum exposure compared with intravenous administration. Intratumoural cisplatin delivery was also evaluated in a recovery procedure using a single sheep, comparing single-site and fractionated administration over a 28-day period, with tumour biopsies confirming lesion presence before treatment. Following ITDD, tumour volumes were observed to decrease over the study period. The recovery experiments demonstrated the feasibility of repeated tumour biopsies, intratumoural injections, longitudinal CT monitoring and recovery anaesthesia using the OPA model. DISCUSSION: To our knowledge, this is the first report of direct intratumoural cisplatin administration into ovine lung tumours. This study also provides proof-of-concept that this clinically relevant large animal lung cancer model can serve as a translational platform for evaluating intratumoural therapeutic delivery strategies relevant to human lung cancer.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42921371","pmid":"42921371","pmcid":"PMC13693057","doi":"10.1016/j.lana.2026.101661","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921371/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"成本-效用分析 · 队列状态转移（Markov）模型 · 美国支付方视角 · 15年时限 · 概率敏感性分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":34,"score_breakdown":{"clinical":6,"methodology":19,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"全体模型队列","metric":"QALY增益（早期vs延迟）","val":"0.56","stat":"95% UI 0.32-0.83","grounded":true,"checks":[{"num":"0.56","grounded":true,"note":"数值+语境锚命中"},{"num":"0.32","grounded":true,"note":"数值+语境锚命中"},{"num":"0.83","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"全体模型队列","metric":"每例患者增量成本（US$）","val":"-43,902.94","stat":"95% UI -147,096.29 至 61,615.86","grounded":true,"checks":[{"num":"43902.94","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"147096.29","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"61615.86","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"全体模型队列","metric":"ICER（US$/QALY）","val":"-78,398.11","stat":"","grounded":true,"checks":[{"num":"78398.11","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"全体模型队列","metric":"INMB（US$，WTP=50,000/QALY）","val":"71,902.94","stat":"95% UI -36,663.51 至 176,658.91","grounded":true,"checks":[{"num":"71902.94","grounded":true,"note":"数值+语境锚命中"},{"num":"36663.51","grounded":true,"note":"数值+语境锚命中"},{"num":"176658.91","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"全体模型队列","metric":"概率敏感性分析中早期启动优选的比例","val":"90.6%","stat":"","grounded":true,"checks":[{"num":"90.6%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"全体模型队列","metric":"QALY增益（早期vs延迟）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「全体模」无英文锚（词典未收录，宁误杀）"]},{"group":"全体模型队列","metric":"每例患者增量成本（US$）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全体模」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全体模型队列","metric":"ICER（US$/QALY）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「全体模」无英文锚（词典未收录，宁误杀）"]},{"group":"全体模型队列","metric":"INMB（US$，WTP=50,000/QALY）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「全体模」无英文锚（词典未收录，宁误杀）"]},{"group":"全体模型队列","metric":"概率敏感性分析中早期启动优选的比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全体模」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"银屑病关节炎早期（≤1年）与延迟（>1年）启用DMARD的成本效用模型：早期治疗增加QALY且增量成本为负","title_en":"Cost-effectiveness of early versus delayed disease-modifying antirheumatic drugs for psoriatic arthritis.","authors":"Hundal S, Cappelli J, Haidar S, Osman M, Kaouache M, Rahme E, Goldberg SR, Gladman DD et al.","affiliation_highlight":"Department of Medicine, University of Calgary, Calgary, Alberta, Canada.","results":"早期启动相对延迟启动每例患者多获得0.56个QALY（95% UI 0.32-0.83），增量成本为-US$43,902.94（95% UI -US$147,096.29 至 US$61,615.86），ICER为-US$78,398.11/QALY；在US$50,000/QALY的支付意愿阈值下，平均INMB为US$71,902.94（95% UI -US$36,663.51 至 US$176,658.91），90.6%的模拟中早期启动为优选策略。","authors_conclusion":"早期启用DMARD与长期健康产出改善且费用降低相关，提示及时启用DMARD可能是高价值策略；鉴于关键的治疗时机参数基于观察性研究，结果支持对现有III期试验按疾病病程分层分析，并进一步刻画治疗可及性延迟。","ai_note":"关键治疗时机（早期vs延迟）的效应量来自观察性研究，模型结论直接依赖该假设，存在指征混杂/时间偏倚向模型传导的风险；增量成本的95%UI跨越0（-147,096.29 至 61,615.86），成本节约的确定性不足，而“90.6%模拟优选”主要由QALY获益驱动；摘要未交代模型结构假设、不良事件与依从性处理及多项敏感性分析结果，信息不足；本文属风湿免疫领域，与胸部肿瘤/胸外科无直接关联，仅可作为方法学（模型化成本效果分析、PSA报告规范）的参考范例。","pico":{"p":"DMARD初治的成人银屑病关节炎（PsA）患者；模型模拟队列，摘要未报告样本量","ic":"早期启动DMARD（诊断后≤1年）vs 延迟启动（>1年）；月度循环、15年时限、美国支付方视角；入组后先在前治疗状态停留6个月再分配应答状态"},"reason":"为模型化成本效果研究提供方法学参照（概率敏感性分析、以INMB与ICER并列报告不确定性），但研究问题与胸外科/胸部肿瘤临床决策无交集，不改变胸部肿瘤领域的任何诊疗或科研判断。","abstract_en":"BACKGROUND: Disease-modifying antirheumatic drugs (DMARDs) are standard first-line therapy for psoriatic arthritis (PsA). Observational studies suggest earlier initiation is associated with superior minimal disease activity (MDA) attainment, yet the economic and health implications of treatment timing remain uncertain. This cost-utility analysis evaluated the cost-effectiveness of early versus delayed DMARD initiation in DMARD-naive adults with PsA from a U.S. payer perspective. METHODS: We built a cohort state-transition (Markov) model (monthly cycles, 15-year horizon) from published data (2000-2025). Patients initiated a DMARD under two strategies: early (≤1 year post-diagnosis) and delayed initiation (>1 year). Patients remained in the pre-treatment state for six months prior to response assignment, then transitioned among complete response (sustained MDA), partial response (non-sustained MDA), non-response, no treatment, and death. Primary outcomes included the incremental cost-effectiveness ratio (ICER) and incremental net monetary benefit (INMB). Uncertainty intervals (UIs) were derived from probabilistic sensitivity analyses. FINDINGS: Early DMARD initiation provided an additional 0.56 (95% UI, 0.32-0.83) QALYs at an incremental cost of -US$43,902.94 (95% UI, -US$147,096.29 to US$61,615.86) per patient relative to delayed initiation, yielding a favourable ICER (-US$78,398.11/QALY). At a willingness-to-pay threshold of US$50,000/QALY, mean INMB was US$71,902.94 (95% UI, -US$36,663.51 to US$176,658.91), with early initiation preferred in 90.6% of simulations. INTERPRETATION: Early DMARD initiation was associated with improved long-term health outcomes at reduced costs, suggesting timely DMARD initiation may represent a high-value strategy. Given the observational basis of the key treatment-timing input, findings support disease-duration stratified analyses of existing phase III trials and further characterization of access delays. FUNDING: None.","tags":["银屑病关节炎","DMARD治疗时机","成本效用分析","Markov模型","观察性数据外推"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":true,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42923200","pmid":"42923200","pmcid":"PMC9688736","doi":"10.62347/JTRW8729","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923200/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Am J Transl Res","journal_full":"American journal of translational research","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前研究 · 生物信息学分析联合两种LUAD细胞系功能实验，非随机、无体内验证","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":34,"score_breakdown":{"clinical":5,"methodology":12,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺腺癌中Wrap53-1α与Wrap53-1β以p53依赖方式产生不同放射敏感性效应：一项细胞与生物信息学临床前研究","title_en":"Wrap53-1α and Wrap53-1β exert distinct p53-dependent effects on radiosensitivity in lung adenocarcinoma.","authors":"Zhu Y, Hu Y, Wen Q, Zhao X, Guan B","affiliation_highlight":"Department of Oncology, The First People's Hospital of Jingzhou, The First Affiliated Hospital of Yangtze University Jin…","results":"","authors_conclusion":"Our findings reveal a previously unappreciated inverse correlation between Wrap53-1α and p53 in LUAD cells and establish a molecular network where Wrap53 isoforms and p53 status collectively determine LUAD radiosensitivity.","ai_note":"摘要未给出任何效应量、置信区间或P值，主要结论基于两种细胞系的沉默实验和相关性生物信息学分析；无体内模型或临床放疗样本验证；仅凭TCGA药物敏感性推断化疗反应需谨慎；将Wrap53-1α与p53描述为“反向相关”及“决定放射敏感性”存在过度外推风险。","pico":{"p":"肺腺癌（LUAD）；p53野生型A549与p53突变H1975细胞系；TCGA LUAD数据（摘要未报告样本量）","ic":"干预：沉默Wrap53-1α或Wrap53-1β；对照：未沉默/对照；关联分析：Wrap53表达与预后、化疗反应；功能终点包括放疗后克隆形成、凋亡、DNA修复和G2/M阻滞"},"reason":"为肺腺癌放射敏感性研究提供Wrap53亚型与p53状态交互的临床前假说，但尚不足以直接影响患者选择或放疗决策，主要可供后续机制研究和生物标志物筛选参考。","abstract_en":"This study elucidates the distinct roles of Wrap53 isoforms (1α/1β) in lung adenocarcinoma (LUAD) radiosensitivity through integrated bioinformatics and functional analyses. Bioinformatics revealed Wrap53-associated enrichment in DNA repair and p53 pathways, with TCGA data linking its expression to prognosis and chemotherapy response. Functional studies demonstrated isoform- and p53 context-dependent effects: In p53-wild type A549 cells, Wrap53-1α silencing upregulated p53, enhanced radiosensitivity through Bax/Bcl-2-mediated apoptosis, and impaired DNA repair through RAD51 recombinase (RAD51)/Breast cancer susceptibility gene 1 (BRCA1) regulation. Conversely, in p53-mutant H1975 cells, silencing either Wrap53-1α or Wrap53-1β individually increased colony formation. Wrap53-1α was found to modulate post-radiation G2/M arrest through cyclin-dependent kinase 1 (CDK1) regulation, with effects contingent on p53 status. Importantly, Wrap53 expression correlated with differential chemosensitivity. High Wrap53 tumors showed increased cisplatin sensitivity but resistance to docetaxel, while low-expressing tumors were resistant to paclitaxel and vinca alkaloids. Our findings reveal a previously unappreciated inverse correlation between Wrap53-1α and p53 in LUAD cells and establish a molecular network where Wrap53 isoforms and p53 status collectively determine LUAD radiosensitivity.","tags":["肺腺癌","Wrap53","p53","放射敏感性","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923123","pmid":"42923123","pmcid":"PMC6859528","doi":"10.1016/j.redox.2018.101084","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923123/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Nutr","journal_full":"Frontiers in nutrition","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"前瞻性观察性队列研究（UK Biobank）· 多膳食指数横向比较与滞后敏感性分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":33,"score_breakdown":{"clinical":8,"methodology":20,"specialty":5,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":true,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":["11"],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"六种预设膳食模式与特定部位癌症风险的比较关联：UK Biobank 11.8万人队列中方向性关联存在，但膳食指数间优劣无统计学差异","title_en":"Comparative associations of six predefined dietary patterns with site-specific cancer risk in the UK Biobank.","authors":"Gao L, Feng P, Shi G, Li Y, Ma B, Zhang C, Chen Y, Li S et al.","affiliation_highlight":"Department of Urology, First Hospital of Shanxi Medical University, Taiyuan, China.","results":"识别出 11 个稳健的膳食-癌症关联：AHEI-2010 与 DASH 与结直肠癌风险呈负相关；AHEI-2010、aMED、CDAI、DASH 及反向 E-DII 与肾癌风险呈负相关；AHEI-2010、aMED 及反向 E-DII 与肺癌风险呈负相关；反向 E-DII 与较低总体癌症风险相关；DRLCD 无稳健关联。总体人群中 HR 最低者为 DASH（结直肠癌）、反向 E-DII（肾癌）、AHEI-2010（肺癌）；高 PRS 组中为 DASH（结直肠癌）、AHEI-2010（肾癌）、反向 E-DII（肺癌）。但 bootstrap 两两比较均无统计学显著性。","authors_conclusion":"研究识别出显著且稳定的膳食-癌症风险关联，并观察到不同膳食指数间关联方向或幅度存在差异；由于 bootstrap 两两比较未达统计学显著，结果应解释为方向性趋势与假设生成，而非确定最优膳食策略或膳食优越性的证据。","ai_note":"摘要通篇未给出任何 HR、95%CI 或 P 值，仅以“稳健关联”定性表述，稳健性的判定标准（校正层级、滞后年限一致性阈值）未交代；6 种指数×多癌种存在大量多重比较，11 个“稳健关联”如何控制假阳性不明；主要分析定义（逐步校正+滞后敏感性）与探索性分析边界模糊，肺癌相关结果属探索性分析却与主要结果并列呈现；bootstrap 两两比较阴性后仍列举“最低 HR”排序，存在以排序替代统计检验的选择性强调风险；膳食暴露依赖 24 小时回顾自报，测量误差与残余混杂不可忽略。","pico":{"p":"118,056 名无癌症史的 UK Biobank 参与者，且至少完成两次有效 24 小时膳食回顾","ic":"六种预设膳食指数（DRLCD、aMED、AHEI-2010、DASH、CDAI、E-DII）经标准化后相互比较，并与特定部位癌症（含肺癌）风险关联；采用逐步校正 Cox 回归及 1、3、5 年滞后敏感性分析；未设单一对照干预"},"reason":"为胸部肿瘤（尤其肺癌）人群队列研究提供膳食暴露与遗传风险分层的对照基线，并提示膳食-肺癌关联仅为方向性趋势、不足以支撑膳食干预推荐；其多指数标准化与 bootstrap 比较框架对同类营养流行病学设计有方法学参照价值。","abstract_en":"BACKGROUND: Previous studies on diet and cancer have mainly examined individual dietary indices in relation to specific cancer outcomes, limiting direct comparison across dietary patterns. A unified population with consistent adjustment and standardized dietary-index scales is needed to explore whether different dietary patterns show different statistical associations with each specific cancer outcome. METHODS: We included 118,056 cancer-free UK Biobank participants with at least two valid 24-h dietary assessments. Six predefined dietary indices were evaluated: DRLCD, aMED, AHEI-2010, DASH, CDAI, and E-DII. All indices were standardized to enable direct comparison. Progressively adjusted Cox regression models and 1-, 3-, and 5-year lagged sensitivity analyses were used as the primary analysis to identify the most stable diet-cancer outcome pairs. In the exploratory analysis, after excluding potential non-linear associations, standardized dietary indices were compared for colorectal, kidney, and lung cancers in the overall population and high genetic risk group to compare the direction and magnitude of associations across dietary patterns for each cancer outcome. RESULTS: Eleven robust diet-cancer associations were identified. AHEI-2010 and DASH were inversely associated with colorectal cancer; AHEI-2010, aMED, CDAI, DASH, and reversed E-DII were inversely associated with kidney cancer; AHEI-2010, aMED, and reversed E-DII were inversely associated with lung cancer; and reversed E-DII was associated with lower overall cancer risk. DRLCD showed no robust association. In cross-index comparisons, the lowest HRs in the overall population were for DASH (colorectal cancer), reversed E-DII (kidney cancer), and AHEI-2010 (lung cancer); in the higher PRS group, they were for DASH (colorectal cancer), AHEI-2010 (kidney cancer), and reversed E-DII (lung cancer). However, bootstrap pairwise comparisons were not statistically significant, suggesting directional trends, not evidence of superiority. CONCLUSION: We identified significant and stable diet-cancer risk associations and observed differences in the direction or magnitude of associations across dietary indices. Because bootstrap pairwise comparisons were not statistically significant, these findings should be interpreted as directional trends and hypothesis-generating, not as evidence of a definitively optimal dietary strategy or dietary superiority.","tags":["膳食模式","肺癌风险","UK Biobank","观察性队列","假设生成"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925305","pmid":"42925305","pmcid":"","doi":"10.1177/10781552261500125","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925305/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"J Oncol Pharm Pract","journal_full":"Journal of oncology pharmacy practice : official publication of the International Society of Oncology Pharmacy Practitioners","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述 · 实体瘤双特异性T细胞衔接器（BTCE）机制、临床 efficacy、安全性与研发进展","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":31,"score_breakdown":{"clinical":10,"methodology":8,"specialty":13,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"实体瘤中双特异性T细胞衔接器的应用扩展：机制、已获批药物与安全性综述（无原始疗效数据）","title_en":"Bispecific T-cell engagers beyond hematology: Expanding uses in solid tumors.","authors":"Rychalsky K, Luon D, Tracchia J","affiliation_highlight":"Smilow Cancer Hospital at Yale New Haven Hospital, New Haven, CT, USA.","results":"","authors_conclusion":"Tebentafusp and tarlatamab have established proof of concept for BTCE therapy in solid tumors, bridging the gap from hematologic malignancies. This class of therapy represents a promising platform for expanding applications across tumor types. Continued advances in target selection and strategies to overcome the tumor microenvironment and T-cell evasion barriers are expected to further expand the role of BTCEs in solid tumors.","ai_note":"叙述性综述，无系统检索方案、PRISMA流程、纳入排除标准或偏倚评估；未报告任何疗效或安全性的定量结果；结论主要基于FDA批准与会议资料，可能存在选择性引用；对tarlatamab在SCLC中的具体证据强度与安全性数据未在摘要中展开，信息不足。","pico":{"p":"","ic":""},"reason":"为胸部肿瘤医师提供tarlatamab等BTCE在SCLC等实体瘤中的机制、毒性管理与研发方向背景；不直接改变手术或随访决策，主要作为系统性治疗进展的综述参考。","abstract_en":"ObjectiveTo review the mechanism of action, clinical efficacy, safety considerations and future development of bispecific T-cell engagers (BTCEs) in solid tumors.Data sourcesA literature search was conducted using PubMed for clinical trials leading to FDA approvals and major oncology conference proceedings through February 2026. Major ongoing clinical trials were identified through a search of clinicaltrials.gov. Search terms included \"bispecific T-cell engager,\" \"BiTE,\" \"solid tumors,\" \"tarlatamab,\" and \"tebentafusp.\" Prescribing information was also evaluated.Data summaryBTCEs are antibodies designed to redirect cytotoxic T-cells toward tumor cells through binding of CD3 and tumor-associated antigens. FDA approvals of tebentafusp for HLA-A*02:01-positive metastatic uveal melanoma and tarlatamab for extensive stage small cell lung cancer have established utility of BTCE therapy in solid malignancies, with improved outcomes over conventional chemotherapy and immunotherapy. BTCEs have unique toxicities, such as cytokine release syndrome, that must be monitored and treated appropriately. Ongoing investigations are evaluating novel targets, optimized molecular constructs to overcome development challenges, including toxicity and tumor microenvironment barriers, as well as combination treatment strategies to improve the efficacy of BTCEs in solid tumors.ConclusionsTebentafusp and tarlatamab have established proof of concept for BTCE therapy in solid tumors, bridging the gap from hematologic malignancies. This class of therapy represents a promising platform for expanding applications across tumor types. Continued advances in target selection and strategies to overcome the tumor microenvironment and T-cell evasion barriers are expected to further expand the role of BTCEs in solid tumors.","tags":["双特异性T细胞衔接器","实体瘤","tarlatamab","tebentafusp","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924050","pmid":"42924050","pmcid":"PMC2747452","doi":"10.1159/cro/abzag015","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924050/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Case Rep Oncol","journal_full":"Case reports in oncology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"病例报告（单例）· 诊断与手术处理描述","category":"surgery","category_label":"微创与无管化胸外科","score_total":31,"score_breakdown":{"clinical":10,"methodology":4,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"病例","metric":"年龄","val":"35岁","stat":"","grounded":true,"checks":[{"num":"35","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"病例","metric":"前纵隔肿块大小","val":"7×5×3 cm","stat":"","grounded":true,"checks":[{"num":"7","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"病例","metric":"囊内容物培养","val":"Staphylococcus aureus","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"病例","metric":"年龄","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"病例","metric":"前纵隔肿块大小","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"病例","metric":"囊内容物培养","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"前纵隔感染性表皮样囊肿误诊为成熟囊性畸胎瘤并粘连心包：一例VATS完整切除病例报告","title_en":"Infected Anterior Mediastinal Epidermoid Cyst Mimicking Mature Cystic Teratoma and Adherent to the Pericardium: A Case Report.","authors":"Abbas Y, Aldakak MA, Al-Jawalah R, Abo Dakka YA, Mahmoud R, Dandashy A, Chaban H","affiliation_highlight":"National University Hospital, Faculty of Medicine, Damascus University, Damascus, Syrian Arab Republic.","results":"35岁男性，前纵隔肿块约7×5×3 cm；CT引导活检和抽液初判为成熟囊性畸胎瘤；行三孔VATS完整切除，囊内为厚脓性物，培养出Staphylococcus aureus；最终病理为鳞状上皮衬覆、慢性炎症、肉芽组织和纤维化，确诊感染性纵隔表皮样囊肿；肉眼可见毛发样物和软骨样区，但未获组织学证实。","authors_conclusion":"完整手术切除可提供明确诊断和有效治疗；囊性前纵隔肿物的鉴别诊断应包括表皮样囊肿；在仔细选择的患者中，即使存在致密心包粘连，VATS切除可能可行。","ai_note":"单例病例报告，无对照，不能评估VATS在致密心包粘连条件下的可行性或安全性；术前活检与最终病理不一致，提示取样和诊断局限；肉眼毛发样物及软骨样区未获组织学证实，与畸胎瘤鉴别仍有不确定性；“carefully selected patients”的选择标准未说明；随访、复发和并发症信息不足。","pico":{"p":"1例35岁男性，前纵隔囊性肿物，约7×5×3 cm，病程2个月胸骨后胸痛","ic":"CT引导活检及抽液后行三孔VATS完整切除；无对照组"},"reason":"为前纵隔囊性病变的鉴别诊断及术前活检局限性提供具体警示：活检可能误判为成熟囊性畸胎瘤，最终诊断依赖切除病理；同时为VATS处理粘连心包囊肿提供个案经验，仅可作假设生成。","abstract_en":"INTRODUCTION: Mediastinal epidermoid cysts are exceptionally rare benign lesions, particularly in the anterior mediastinum. Their nonspecific clinical and radiological features may resemble other anterior mediastinal masses, including thymic lesions and mature cystic teratomas, making preoperative diagnosis challenging. CASE PRESENTATION: A 35-year-old man with no relevant medical or surgical history presented with a 2-month history of retrosternal chest pain. Clinical examination and cardiac evaluation were unremarkable. Chest radiography demonstrated mediastinal widening, while contrast-enhanced computed tomography (CT) revealed a well-defined anterior mediastinal mass measuring approximately 7 × 5 × 3 cm. CT-guided biopsy and fluid aspiration initially suggested a mature cystic teratoma without immature or malignant elements. The patient underwent complete excision using a three-port video-assisted thoracoscopic approach. Intraoperatively, the cyst was densely adherent to the pericardium and contained thick purulent material. Hair-like material and firm cartilage-like areas were observed grossly but were not confirmed histologically. Culture of the cyst contents yielded Staphylococcus aureus. Histopathological examination demonstrated a squamous epithelial lining with chronic inflammation, granulation tissue, and fibrosis, confirming an infected mediastinal epidermoid cyst. The discrepancy between the initial cytological impression and the final histopathological diagnosis highlights the limitations of imaging and needle biopsy in evaluating rare cystic mediastinal lesions. CONCLUSION: Complete surgical excision provides both definitive diagnosis and effective treatment. Epidermoid cysts should be considered in the differential diagnosis of cystic anterior mediastinal masses. Video-assisted thoracoscopic excision may be feasible in carefully selected patients, even in the presence of dense pericardial adhesions.","tags":["前纵隔囊肿","表皮样囊肿","成熟囊性畸胎瘤","VATS","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921880","pmid":"42921880","pmcid":"","doi":"10.1093/icvts/ivag280","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921880/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"Interdiscip Cardiovasc Thorac Surg","journal_full":"Interdisciplinary cardiovascular and thoracic surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例个案报道 · 新辅助靶向治疗后手术可行性观察","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":31,"score_breakdown":{"clinical":10,"methodology":4,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例","metric":"肿瘤体积缩小","val":"61%","stat":"","grounded":true,"checks":[{"num":"61%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"原发灶病理完全缓解","val":"pCR","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"单例","metric":"肿瘤体积缩小","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"原发灶病理完全缓解","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"ALK阳性肺鳞癌新辅助劳拉替尼治疗后病理完全缓解并接受微创肺叶切除的个案报道","title_en":"Minimally invasive lobectomy following pathologic complete response to neoadjuvant Lorlatinib in ALK-positive squamous cell carcinoma.","authors":"Molkova A, Li R, Li S","affiliation_highlight":"Department of Thoracic Surgery, The First Affiliated Hospital of Guangzhou Medical University, Guangzhou, China.","results":"连续影像学显示肿瘤体积缩小61%，并伴淋巴结退缩；最终病理显示原发肿瘤达到病理完全缓解（pCR）","authors_conclusion":"本病例提示，尽管存在治疗相关肺门纤维化及血管-支气管粘连，新辅助劳拉替尼后行微创解剖性肺切除仍可行且安全。","ai_note":"单例、无对照、无统计推断，“可行且安全”仅基于1例经验，不可外推；未量化手术时间、出血量、并发症分级等安全性指标；未报告pCR的独立病理复核、影像评效标准与随访时长；ALK阳性肺鳞癌罕见，需排除腺鳞癌或腺癌伴鳞状分化方能确立组织学前提；61%缩瘤与pCR属描述性结果，存在选择性报告阳性结局的倾向。","pico":{"p":"52岁从不吸烟女性，IIIB期ALK阳性肺鳞状细胞癌，n=1","ic":"新辅助劳拉替尼治疗12周后行单孔胸腔镜（uVATS）肺叶切除；无同期对照"},"reason":"为ALK阳性肺癌（尤其罕见鳞癌组织学）新辅助靶向治疗后微创手术可行性提供单例基线，可提示围术期靶向研究在组织学入组标准与手术安全性终点设计上的空白。","abstract_en":"ALK rearrangements are uncommon in lung squamous cell carcinoma, and neoadjuvant ALK inhibition remains investigational. We report a 52-year-old never-smoking female with stage IIIB ALK-positive squamous cell carcinoma treated with neoadjuvant lorlatinib for 12 weeks. Serial imaging demonstrated a 61% reduction in tumor size with nodal regression. The patient subsequently underwent a uniportal video-assisted thoracoscopic (uVATS) lobectomy, and final pathology revealed a complete pathological response (pCR) of the primary tumor. This case highlights the feasibility and safety of minimally invasive anatomical lung resection following neoadjuvant lorlatinib despite treatment-related hilar fibrosis and vascular-bronchial adhesions.","tags":["ALK阳性","肺鳞癌","新辅助靶向","劳拉替尼","uVATS","个案报道"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924229","pmid":"42924229","pmcid":"PMC10847398","doi":"10.7759/cureus.116724","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924229/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-25","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（胸腺囊肿机器人辅助切除及邻近胸腺组织病理发现）","category":"surgery","category_label":"微创与无管化胸外科","score_total":28,"score_breakdown":{"clinical":8,"methodology":5,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"患者","metric":"显微镜下胸腺瘤大小","val":"0.6 mm","stat":"","grounded":true,"checks":[{"num":"0.6","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者","metric":"A型微胸腺瘤大小","val":"2.0 mm","stat":"","grounded":true,"checks":[{"num":"2.0","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者","metric":"术后无复发时间","val":"18个月","stat":"","grounded":true,"checks":[{"num":"18","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"患者","metric":"显微镜下胸腺瘤大小","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者","metric":"A型微胸腺瘤大小","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者","metric":"术后无复发时间","population_ok":true,"metric_ok":true,"mismatch_reasons":[]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"胸腺囊肿旁偶发0.6 mm显微镜下胸腺瘤与2.0 mm A型微胸腺瘤的罕见病例报告","title_en":"Synchronous Nodular Epithelial Hyperplasia and Type A Microthymoma Adjacent to a Thymic Cyst: A Report of a Rare Case.","authors":"Bunno Y, Yamamoto M, Miyazaki R, Okada H, Tamura M","affiliation_highlight":"Department of Thoracic Surgery, Kochi Medical School, Kochi University, Nankoku, JPN.","results":"组织病理检查示单房胸腺囊肿，邻近胸腺组织内见0.6 mm显微镜下胸腺瘤和2.0 mm A型微胸腺瘤；术后18个月无复发。","authors_conclusion":"据作者所知，显微镜下胸腺瘤与A型微胸腺瘤并存于胸腺囊肿旁极为罕见；病变位置邻近且组织学特征相似，提示它们可能代表显微胸腺上皮增生连续形态谱中的不同阶段而非完全独立实体；本病例还提示对切除胸腺囊肿邻近胸腺组织进行仔细病理检查以发现隐匿显微上皮病变并改进病理评估的潜在价值。","ai_note":"单例病例报告，无对照与系统取样，不能验证“连续形态谱”假说；摘要称两处病变依据大小和组织学特征而未行额外免疫组化即诊断，诊断阈值与可重复性信息不足；标题提及同步结节性上皮增生，摘要主要描述显微镜下胸腺瘤与A型微胸腺瘤，术语与病变归类存在不一致；18个月随访不足以评估复发风险。","pico":{"p":"54岁女性，常规胸部CT偶然发现前纵隔病变，影像符合胸腺囊肿","ic":"机器人辅助胸腔镜切除胸腺囊肿及邻近胸腺组织；无对照"},"reason":"为胸腺囊肿切除标本邻近胸腺组织的病理取材与显微胸腺上皮病变识别提供罕见个案线索，但不足以改变当前手术或随访决策。","abstract_en":"Thymic cysts are uncommon benign lesions of the anterior mediastinum and are frequently detected incidentally on imaging studies. Microsc
