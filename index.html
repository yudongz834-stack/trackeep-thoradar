<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

"authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Pediatric obesity is a major global public health challenge, associated with increased risk for numerous sequelae, persistence into adulthood, and growing economic burden. STARKIDS is a stepwise, tailored, e-health-enhanced, family-focused intervention in primary care. It integrates nutritional counseling targeting dietary energy density reduction, physical activity promotion, behavioral strategies, and psychosocial support. METHODS: We tested whether STARKIDS improves weight development and quality of life (QoL) compared with usual care. A cluster-randomized controlled trial was conducted in pediatric/family practices enrolling children/adolescents with overweight/obesity. Practices were stratified and block-randomized (no blinding) to STARKIDS or one-time counseling (optimized treatment-as-usual, TAU-O). Outcomes were assessed at baseline, 12, and 18 months. Primary outcomes were changes in BMI z-scores and QoL. Trial registration: DRKS00022813. FINDINGS: 89 practices were cluster-randomized (44 intervention, 45 TAU-O). Between April 2022 and July 2023, 379 families were assigned to STARKIDS and 232 to TAU-O. 343 and 216 families were included into the intention-to-treat analysis. After 12 months, 114 (33%) participants in the STARKIDS group and 47 (22%) in the TAU-O group achieved a BMI z-score reduction ≥0.2 (risk difference = 0.11, 95% CI 0.03, 0.20, p = 0.0256). After 18 months, no group differences in BMI z-score reductions were found (p = 0.6940). No significant differences in QoL were observed between study arms at either time point among adolescents. Among parents/guardians, a statistically significant between-group difference was observed at 18 months (-2.10, 95% CI -4.13 to -0.06; p = 0.044), though not considered clinically meaningful. No treatment-related serious adverse events were reported. INTERPRETATION: STARKIDS improved BMI z-score over 12 months with effects comparable to more intensive programs. The German Federal Joint Committee recommended transferring step 1 into routine care for children/adolescents with obesity. Effects were not sustained at 18 months, indicating a need for adaptations including additional contact hours to reinforce achieved outcomes, followed by a gradual reduction. FUNDING: Innovation Committee of the German Joint Federal Committee (G-BA).","tags":[],"curated":true,"curation_reason":"严谨阴性/证伪结果（RCT/III 期证据发表于 A 级期刊且明确陈述主要终点），直接影响可切除胸部肿瘤围术期/新辅助方案选择","curation_clinical_value":"阅读后可直接核对可切除胸部肿瘤围术期/新辅助方案选择的现有依据是否需要更新","curation_research_value":"阴性结果可限定现有证据边界，其设计与分析可借鉴","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":true,"tier":"A"}},{"id":"pmid_42923097","pmid":"42923097","pmcid":"PMC12707946","doi":"10.1159/000549355","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923097/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Efficacy and safety of hepatic arterial infusion chemotherapy combined with tyrosine kinase inhibitors and PD-1 inhibitors for unresectable hepatocellular carcinoma: a meta-analysis.","title_en":"Efficacy and safety of hepatic arterial infusion chemotherapy combined with tyrosine kinase inhibitors and PD-1 inhibitors for unresectable hepatocellular carcinoma: a meta-analysis.","authors":"Ouyang R, Li X, Huang K, Chen D, Yang Y, Li X, Zhu L, Liang C et al.","affiliation_highlight":"Department of Hepatobiliary Surgery, Loudi Central Hospital, Loudi, China.","results":"BACKGROUND: The triplet combination of hepatic arterial infusion chemotherapy (HAIC), a tyrosine kinase inhibitor (TKI), and a programmed cell death-1 (PD-1) inhibitor has emerged as a highly promising strategy for unres…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The triplet combination of hepatic arterial infusion chemotherapy (HAIC), a tyrosine kinase inhibitor (TKI), and a programmed cell death-1 (PD-1) inhibitor has emerged as a highly promising strategy for unresectable hepatocellular carcinoma (uHCC). This study aimed to comprehensively evaluate the efficacy and safety of this triple-therapy compared with the dual-therapy of a TKI plus a PD-1 inhibitor. METHODS: We systematically searched PubMed, Embase, and the Cochrane Library for randomized controlled trials or comparative cohort studies that assessed HAIC plus a TKI and a PD-1 inhibitor (H-T-P) versus a TKI plus a PD-1 inhibitor (T-P) for uHCC. The primary endpoints were overall survival (OS), progression-free survival (PFS), objective response rate (ORR), and disease control rate (DCR). The secondary endpoint was treatment-related adverse events (AEs). A random-effects model was employed to pool data, calculating hazard ratios (HRs) or relative risks (RRs) with their 95% confidence intervals (CIs). RESULTS: A total of 12 studies involving 2,386 patients with uHCC were included. Compared with T-P dual therapy, the H-T-P triple therapy was associated with significantly improved OS (HR, 0.51; 95%CI, 0.47-0.56; P < 0.001) and PFS (HR, 0.59; 95%CI, 0.51-0.68; P < 0.001). Furthermore, the H-T-P group demonstrated a significantly higher ORR (RR, 1.97; 95%CI, 1.73-2.24; P < 0.001) and DCR (RR, 1.19; 95%CI, 1.11-1.28; P < 0.001). Regarding safety, while no significant difference was observed in the overall incidence of all-grade AEs (P = 0.238), the incidence of grade ≥3 AEs was significantly higher in the triple-therapy arm (RR, 1.29; 95%CI, 1.13-1.48; P = 0.004), consisting primarily of manageable hepatotoxicity and hematologic toxicities. CONCLUSION: Our findings indicate that for patients with uHCC, the H-T-P triple-therapy regimen is superior to dual therapy in terms of survival benefits and tumor response. The associated increase in severe toxicity is considered predictable and clinically manageable. SYSTEMATIC REVIEW REGISTRATION: https://www.crd.york.ac.uk/PROSPERO/, identifier CRD420251113276.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":true,"tier":"C"}},{"id":"pmid_42914134","pmid":"42914134","pmcid":"","doi":"10.1038/s41586-026-11312-x","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42914134/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-26","journal_abbr":"NATURE","journal_full":"Nature","tier":"S","if_val":56.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":50,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":15},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Current-Driven Molecular Machine with Rotation-Enhanced Conductance.","title_en":"Current-Driven Molecular Machine with Rotation-Enhanced Conductance.","authors":"Singh AK, Martin L, Sršen M, Guttesen FS, Hu BZ, Ito Y, Pedersen SK, Kamounah FS et al.","affiliation_highlight":"Department of Chemical and Biological Physics, Weizmann Institute of Science, Rehovot, Israel.","results":"For more than two millennia, Archimedean screws have been used for water pumping and, more recently, as turbines in hydroelectric power stations[1]. Their helical-blade structure, essential to their function, is also fou…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"For more than two millennia, Archimedean screws have been used for water pumping and, more recently, as turbines in hydroelectric power stations[1]. Their helical-blade structure, essential to their function, is also found in chiral molecules and nanostructures, where injected electric current has been proposed to generate torque-mediated rotation[2,3]. Here, we present a torque-driven molecular machine with a rotor actuated by electric current and conductance enhanced by its rotation. Suspending a helicene molecule between two electrode tips, we show that an applied voltage induces cyclic molecular motion with 100% directional preference that can be inverted by the voltage's polarity. Above a voltage threshold, the current through the rotating molecule is significantly enhanced, and the enhancement onset is tuned by stretching or compressing the helical molecule. Such effects were absent in previous helical molecular junctions, likely due to structural and operational differences[4-6]. Calculations show that molecular rotation by current-induced forces explains both the observed cyclic motion and current enhancement. This mechanism predicts a transition from stepwise to continuous rotation at a threshold voltage, yielding a current increase as rotation allows adopting highly conducting configurations not accessible at rest. Our work introduces a prototype for a new class of torque-driven molecular machines with perfect rotor unidirectionality and significant current modulation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"S"}},{"id":"pmid_42919412","pmid":"42919412","pmcid":"PMC11016640","doi":"10.4143/crt.2024.253","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42919412/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-26","journal_abbr":"Biomark Res","journal_full":"Biomarker Research","tier":"A","if_val":14.6,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Impact of SARS-CoV-2 vaccination on cancer trends: a nationwide interrupted time series study.","title_en":"Impact of SARS-CoV-2 vaccination on cancer trends: a nationwide interrupted time series study.","authors":"Na Y, Radnaabaatar M, Jung J","affiliation_highlight":"Department of Preventive Medicine, Korea University College of Medicine, 73 Goryeodae-ro, Seongbuk-gu, Seoul, 02841, Rep…","results":"BACKGROUND: A recent population-based cohort study of Seoul residents in South Korea reported increased incidence of several cancers within one year of SARS-CoV-2 vaccination. We examined whether a short-term, population…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: A recent population-based cohort study of Seoul residents in South Korea reported increased incidence of several cancers within one year of SARS-CoV-2 vaccination. We examined whether a short-term, population-level change in cancer incidence trends was detectable at the national vaccination rollout, using a design that does not compare vaccinated with unvaccinated individuals. METHODS: We conducted an interrupted time series analysis of Korea National Health Insurance Service data for 36,024,394 individuals born between 1955 and 2004, covering February 2011 to September 2025 (176 months). The intervention point was August 2021, when cumulative first-dose coverage exceeded 50%. Monthly incidence of 13 cancer categories defined by ICD-10 code ranges and of four site-specific cancers (stomach, colorectum, lung and prostate) was compared with counterfactual forecasts from ARIMA/SARIMA models, and segmented regression estimated immediate level and trend changes (significance threshold P < 0.01). The placement of the intervention point was varied from 0 to 18 months, and the resulting estimates were compared with those obtained at 30 placebo points in the pre-pandemic period. RESULTS: Overall, 89.3% of the population received at least one dose. No immediate level change (relative risk 0.923-1.072) or trend change (0.995-1.005) reached significance for any of the 13 categories, and none reached significance for the four site-specific cancers. Across the lag grid, 2.0% of estimates met the threshold, compared with 4.1% at placebo points. The 99% confidence limits excluded immediate increases larger than 8.9% to 23.0% across the 13 categories and 8.1% to 23.4% across the four site-specific cancers. CONCLUSIONS: The national SARS-CoV-2 vaccination rollout in South Korea was not accompanied by a detectable short-term, population-level change in cancer incidence trends over the 50 months that followed. TRIAL REGISTRATION: Not applicable.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927277","pmid":"42927277","pmcid":"PMC13695118","doi":"10.1016/j.gmg.2026.100142","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927277/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-26","journal_abbr":"Glob Med Genet","journal_full":"Global medical genetics","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前/体外研究 · 患者来源胸腔积液类器官（PEO）四臂药物敏感性实验","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":48,"score_breakdown":{"clinical":14,"methodology":17,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"CD73靶向联合治疗在PD-L1阴性NSCLC胸腔积液来源类器官中逆转PD-1抑制剂耐药（体外药敏研究）","title_en":"CD73 targeted combination therapy reverses PD-1 inhibitor resistance in CD73-high PD-L1-negative NSCLC: Evidence from pleural effusion organoids.","authors":"Ren ZR, Wu L, Huang QL, Cai DX, Peng YL, Tang LB, Li JT, Zhu HY et al.","affiliation_highlight":"Guangdong Lung Cancer Institute, Guangdong Provincial Key Laboratory of Translational Medicine in Lung Cancer, Guangdong…","results":"","authors_conclusion":"本研究验证CD73可作为分层PD-L1阴性NSCLC患者的潜在预测生物标志物，并建立抗PD-1+抗CD73联合方案，可有效逆转CD73高表达PD-L1阴性NSCLC患者的PD-1抑制剂耐药。","ai_note":"结果为离体类器官替代终点（ATP细胞活力、T细胞活化标志物、IFN-γ/TNF-α分泌），不能直接等同于临床逆转耐药；摘要未报告样本量、重复次数、具体抑制率数值及P值/相关系数，'显著正相关'无量化依据；PD-L1阴性与CD73高表达的具体判读阈值未说明；抗PD-1单药无效的判定依赖单一活力检测方法，缺乏与临床疗效的对照锚定。","pico":{"p":"驱动基因野生型、PD-L1阴性NSCLC患者胸腔积液来源类器官（PEO）；摘要未报告患者/类器官例数","ic":"四组干预：对照、抗PD-1单药（特瑞普利单抗Toripalimab）、抗CD73单药（Uliledlimab）、抗PD-1+抗CD73联合；终点检测为ATP法细胞活力、流式T细胞活化标志物、ELISPOT检测IFN-γ与TNF-α分泌"},"reason":"为PD-L1阴性NSCLC免疫治疗耐药人群提供CD73分层假设与联合用药的离体证据，可作为后续生物标志物分层临床试验与类器官药敏平台设计的参考基线，但尚不足以改变当前临床决策。","abstract_en":"OBJECTIVES: Patients with PD-L1-negative non-small cell lung cancer (NSCLC) often exhibit inherent PD-1 inhibitor resistance, leading to poor monotherapy efficacy and unfavorable clinical outcomes. Notably, no effective stratification biomarkers are currently available to overcome this resistance. Thus, this study aimed to reverse PD-1 inhibitor resistance in PD-L1-negative NSCLC by identifying novel predictive biomarkers and developing effective targeted immunotherapeutic regimens. METHODS: Pleural effusion-derived organoids (PEOs) were established and validated from driver gene wild-type, PD-L1-negative NSCLC patients. Four treatment groups were set: control, anti-PD-1 monotherapy (Toripalimab), anti-CD73 monotherapy (Uliledlimab), and anti-PD-1 + anti-CD73 combination (Toripalimab + Uliledlimab). ATP assay was used to detect tumor cell viability. Spearman's rank correlation analysis was applied to evaluate the association between CD73 expression and tumor inhibition rates. Flow cytometry was employed to measure T cell activation markers. Enzyme-linked Immunospot assay was used to detect IFN-γ and TNF-α secretion. RESULTS: PEO models recapitulated the biological features of primary pleural effusion. Toripalimab monotherapy showed no antitumor efficacy in PD-L1-negative subgroup regardless of CD73 expression levels, whereas Toripalimab + Uliledlimab combination significantly reversed PD-1 inhibitor resistance in CD73-high PD-L1-negative NSCLC patients. Furthermore, a significant positive correlation was observed between CD73 expression levels and tumor inhibition rates. CONCLUSION: This study validates CD73 as a potential predictive biomarker for stratifying PD-L1-negative NSCLC patients and establishes anti-PD-1+ anti-CD73 combination regimen that effectively reverses PD-1 inhibitor resistance in CD73-high PD-L1-negative NSCLC patients.","tags":["NSCLC","PD-L1阴性","CD73","Uliledlimab","类器官","免疫治疗耐药"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923287","pmid":"42923287","pmcid":"PMC10502470","doi":"10.1097/JU.0000000000005280","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923287/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":28,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Research progress and clinical translation prospects of multiple urinary biomarkers in non-invasive diagnosis of urothelial carcinoma.","title_en":"Research progress and clinical translation prospects of multiple urinary biomarkers in non-invasive diagnosis of urothelial carcinoma.","authors":"Li S, Wang L, Gao B","affiliation_highlight":"Department of Urology, The First Hospital of Jilin University, Changchun, China.","results":"Urothelial carcinoma is a common urinary malignancy with high incidence, recurrence, and mortality. Early diagnosis is pivotal for improving patient outcomes.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Urothelial carcinoma is a common urinary malignancy with high incidence, recurrence, and mortality. Early diagnosis is pivotal for improving patient outcomes. Current standards have important limitations: cystoscopy, although the cornerstone of diagnosis and surveillance, is invasive and costly, while cytology has limited sensitivity for low-grade or early-stage lesions. Urine, as a liquid biopsy, offers a non-invasive and repeatable approach for sampling urogenital pathology, with the potential for longitudinal monitoring through serial collection. The review covers urinary multi-omics biomarkers, including cfDNA/methylation, miRNAs, extracellular vesicles (EVs), and proteomic/metabolomic signatures. We summarize their performance in early detection, staging, and postoperative monitoring. Integrated multi-analyte models, including true multi-omics assays and multiplex single-omics panels, generally outperform single biomarkers, with some panels achieving >90% sensitivity and >95% specificity in prospective cohorts. Despite progress, several challenges remain: standardization, large-scale prospective validation, and regulatory/reimbursement barriers. We conclude that urinary multi-omics diagnostics are promising complementary tools that may optimize surveillance and risk stratification. Still, limited prospective validation, lack of standardization, and the persistent risk of false-negative results constrain adoption. On current evidence, they are not positioned to replace cystoscopy, which remains the cornerstone of diagnosis and surveillance, particularly in non-muscle-invasive bladder cancer (NMIBC). However, their most realistic and immediate clinical role is as a triage tool to optimize the selective use of cystoscopy-particularly for risk-stratifying patients with hematuria, adjudicating equivocal cytology, and potentially reducing the frequency of invasive surveillance in low-risk NMIBC patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42927456","pmid":"42927456","pmcid":"","doi":"10.1111/pin.70198","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927456/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-26","journal_abbr":"Pathol Int","journal_full":"Pathology international","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"方法学比较研究（负压固定 vs 常规固定，含动物组织机制验证，非随机）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":45,"score_breakdown":{"clinical":16,"methodology":17,"specialty":12,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"肺癌等FFPE样本","metric":"ODxTT检测成功率（负压固定 vs 常规固定）","val":"96.5% vs 81.2%","stat":"","grounded":true,"checks":[{"num":"96.5%","grounded":true,"note":"数值+语境锚命中"},{"num":"81.2%","grounded":true,"note":"数值命中+邻句锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"肺癌等FFPE样本","metric":"ODxTT检测成功率（负压固定 vs 常规固定）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「癌等」无英文锚（词典未收录，宁误杀）","人群限定「样本」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"负压固定法改善肺癌FFPE样本RNA保存质量并提高Oncomine Dx Target Test检测成功率","title_en":"Negative-Pressure Fixation Improves RNA Preservation and Increases the Success Rate of the Oncomine Dx Target Test in Lung Cancer Formalin-Fixed Paraffin-Embedded Samples.","authors":"Kinoshita F, Yano H, Nambu S, Kakoki M, Miyake M, Tanoue K, Kamio T, Yamamoto M et al.","affiliation_highlight":"Department of Pathology, Saiseikai Kumamoto Hospital, Kumamoto, Japan.","results":"ODxTT成功率负压固定法高于常规法（96.5% vs. 81.2%），伴RNA质量与产量提高；DNA未见明显差异；在结肠癌、胰腺癌、前列腺癌FFPE样本中负压固定一致提高RNA DV200","authors_conclusion":"负压固定法通过加速福尔马林渗透、可能抑制RNase介导的RNA降解并保存RNA质量，从而提高ODxTT成功率","ai_note":"摘要未报告各组样本量、统计检验方法与P值/置信区间，96.5% vs 81.2%的差异无不确定性度量；RNA不稳定性与RNase机制的实验证据来自小鼠肝组织，向人肺癌FFPE样本外推属推论；仅报告检测成功率这一替代终点，未提供临床相关结局（如可靶向变异检出率、避免重取活检比例）；跨癌种结果仅报告RNA DV200，未报告成功率","pico":{"p":"肺癌及其他癌种（结肠癌、胰腺癌、前列腺癌）的FFPE样本，以及切除的小鼠肝组织；具体样本量摘要未报告","ic":"干预：使用真空固定装置的负压固定法；对照：常规固定法；结局为ODxTT检测成功率与核酸（RNA/DNA）质量与产量"},"reason":"为肺癌FFPE样本分子检测失败这一常见临床瓶颈提供可操作的标本前处理改进方案，可作为病理科与胸科协作优化活检/手术标本处理流程、减少因核酸质量不足而重取活检的参考依据","abstract_en":"Genetic tests for lung cancer, such as the Oncomine Dx Target Test (ODxTT), are essential for patient management, and require RNA and DNA of sufficient quality and quantity from formalin-fixed paraffin-embedded (FFPE) samples. ODxTT fails due to poor nucleic acid preservation. Although enhancing the penetration of formalin into tissues improves nucleic acid preservation, the clinical utility of negative-pressure fixation methods remains unclear. Therefore, we investigated whether the negative-pressure fixation method using a vacuum fixation device improves ODxTT success rates and the quality of nucleic acids in FFPE samples from lung and other cancers, and examined the underlying mechanisms. The ODxTT success rate was higher with the negative-pressure fixation method than with the conventional method (96.5% vs. 81.2%), accompanied by increased RNA quality and yield; however, no marked differences were observed in DNA. RNA deteriorated more rapidly than DNA in resected mouse liver tissues, indicating that RNA is more labile than DNA during cold ischemia. Furthermore, in FFPE samples from colon, pancreatic, and prostate cancers, negative-pressure fixation consistently improved RNA DV200. These results indicate that the negative-pressure fixation method improves ODxTT success by accelerating formalin penetration, which may suppress RNase-mediated RNA degradation and preserve RNA quality.","tags":["FFPE样本","负压固定","RNA保存","Oncomine Dx Target Test","分子病理质控"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926176","pmid":"42926176","pmcid":"","doi":"10.1016/j.acra.2026.10.003","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926176/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-26","journal_abbr":"Acad Radiol","journal_full":"ACADEMIC RADIOLOGY","tier":"A","if_val":4.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Explainable WinDWS-SwinNet: Optimizing Ultrasound Deep Radiomics for Multipathology Breast Lesion Classification.","title_en":"Explainable WinDWS-SwinNet: Optimizing Ultrasound Deep Radiomics for Multipathology Breast Lesion Classification.","authors":"Sharma D, Chauhan S","affiliation_highlight":"Plaksha University, Sahibzada Ajit Singh Nagar, Punjab, India (D.S.","results":"RATIONALE AND OBJECTIVES: Timely and accurate characterization of breast lesions into different pathological classes through noninvasive imaging techniques is crucial for early cancer diagnosis and effective patient mana…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"RATIONALE AND OBJECTIVES: Timely and accurate characterization of breast lesions into different pathological classes through noninvasive imaging techniques is crucial for early cancer diagnosis and effective patient management. This study aims to develop a novel, explainable attention-based deep network to analyze radiomic patterns for predicting heterogeneous breast cancer types using ultrasound imaging. MATERIALS AND METHODS: A multicentric retrospective dataset comprises brightness-mode ultrasound images of breast tissue collected across five different centers/databases. A total of 3256 images, having biopsy-proven 2068 benign and 1188 malignant lesions, were analyzed. A lightweight and computationally scalable network, WinDWS-SwinNet, is developed for binary and multipathology breast cancer classification. An optimized image preprocessing algorithm is proposed to enhance ultrasound radiomic features, thereby improving data generalizability and diagnostic accuracy. RESULTS: The WinDWS-SwinNet architecture demonstrated superior performance in breast cancer classification, achieving an area under the curve of 0.96, an overall test accuracy of 95.79%, and robust class-wise results with 95.11% precision and 98.51% sensitivity for benign tumors and 97.13% precision and 90.86% sensitivity for malignant tumors. For multipathology classification, the model achieved a test accuracy of 93%, with class-wise accuracies ranging from 94% to 99.5%. External validation on the independent unseen dataset resulted in an accuracy of 95.36%, highlighting the robustness and generalizability of the proposed model beyond the training data. CONCLUSION: The developed methodology shows promising results in characterizing breast lesions into pathological subtypes noninvasively, effectively mimicking real-world diagnostic workflows, thereby supporting radiologists in reducing diagnostic uncertainty and enhancing confidence in clinical decision-making.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926320","pmid":"42926320","pmcid":"","doi":"10.1002/ctm2.70880","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926320/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-26","journal_abbr":"Clin Transl Med","journal_full":"Clinical and Translational Medicine","tier":"A","if_val":7.9,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The long isoform of FABP6 facilitates WWP2-mediated PTEN ubiquitination to activate AKT/mTOR signalling and contributes to reduced everolimus sensitivity in clear cell renal cell carcinoma.","title_en":"The long isoform of FABP6 facilitates WWP2-mediated PTEN ubiquitination to activate AKT/mTOR signalling and contributes to reduced everolimus sensitivity in clear cell renal cell carcinoma.","authors":"Yin H, Wang Z, Ge L, Liu W, Shu F, Yan Y, Liang H, Zhang S et al.","affiliation_highlight":"Department of Urology, Peking University Third Hospital, Beijing, China.","results":"How PTEN function is impaired in clear cell renal cell carcinoma (ccRCC) without detectable genomic alterations remains unresolved. We investigated whether the long isoform of fatty acid-binding protein 6 (FABP6L) contri…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"How PTEN function is impaired in clear cell renal cell carcinoma (ccRCC) without detectable genomic alterations remains unresolved. We investigated whether the long isoform of fatty acid-binding protein 6 (FABP6L) contributes to this process. Analyses that distinguished FABP6 isoforms identified FABP6L as the principal tumour-upregulated variant, whereas the short isoform, FABP6S, did not show a comparable increase. SHOX2 depletion preferentially reduced FABP6L expression. Biochemical experiments linked FABP6L to increased association between PTEN and the E3 ligase WWP2, enhanced PTEN polyubiquitination, and reduced PTEN protein stability. These changes were accompanied by increased AKT/mTOR signalling. Gain- and loss-of-function experiments supported a growth-promoting role for FABP6L in cultured ccRCC cells and xenografts, while genetic rescue experiments indicated a major contribution of PTEN to the signalling and growth phenotypes. In preclinical models with reduced everolimus sensitivity, FABP6L depletion increased PTEN abundance and enhanced the response to mTOR inhibition. The findings support an isoform-specific mechanism connecting FABP6L to PTEN turnover and ccRCC growth. They also provide a basis for investigating FABP6L-directed approaches to improve everolimus response, although their clinical relevance requires further validation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927180","pmid":"42927180","pmcid":"PMC13694819","doi":"10.1016/j.eclinm.2026.104268","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927180/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-26","journal_abbr":"EClinicalMedicine","journal_full":"EClinicalMedicine","tier":"A","if_val":12.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Sex work or male-with-male sexual activity and the risks of HIV and hepatitis C acquisition among people who inject drugs: a global systematic review and meta-analysis.","title_en":"Sex work or male-with-male sexual activity and the risks of HIV and hepatitis C acquisition among people who inject drugs: a global systematic review and meta-analysis.","authors":"Dawe J, Trickey A, Walker J, Barrass L, Njiro BJ, Kundu B, Hickman M, Abramovitz D et al.","affiliation_highlight":"Bristol Population Health Science Institute, Bristol Medical School, Bristol, England, United Kingdom.","results":"BACKGROUND: People who inject drugs (PWID) may engage in sexual behaviours that increase their HIV and hepatitis C virus (HCV) risk, including sex work and male-with-male sexual activity. We undertook a global systematic…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: People who inject drugs (PWID) may engage in sexual behaviours that increase their HIV and hepatitis C virus (HCV) risk, including sex work and male-with-male sexual activity. We undertook a global systematic review to assess whether PWID who engage in these behaviours have higher HIV and HCV acquisition risks. METHODS: In this systematic review and meta-analysis, we searched MEDLINE, Embase, and PsycINFO for studies among PWID published between 01/01/2000 and 09/06/2026 that included estimates of the association between male-with-male sex or sex work and our primary outcomes of HIV or HCV incidence. Studies that estimated incidence by longitudinally re-testing people at risk of infection or by using assays for recent infection were eligible for inclusion. We also contacted authors for unpublished estimates. We pooled estimates using random-effects meta-analysis. We used I2 to assess heterogeneity, and we used Egger's test to assess publication asymmetry. This review is registered with Prospero (CRD42020220884). FINDINGS: We included 57 studies comprising 164 estimates. Among men, recent male-with-male sex was associated with higher HIV acquisition (pooled incidence rate ratio (IRR):2.35; 95% CI: 1.51-3.66; I2: 51%).) but not HCV (IRR: 1.28; 95% CI: 0.95-1.72; I2: 21%). Recent sex work had a 1.72-fold (95% CI: 1.30-2.28; I2: 65%) and 1.59-fold (95% CI: 1.29-1.96; I2: 60%) higher HIV and HCV acquisition risk among all PWID, respectively. When stratified, sex work was associated with higher HIV acquisition among women (IRR: 2.30; 95% CI: 1.44-3.68; I2: 68%) but not men (IRR: 1.43; 95% CI: 0.92-2.22; I2: 51%), and was associated with HCV acquisition among men (IRR: 1.51; 95% CI: 1.22-1.87; I2: 0%), but not women (IRR: 1.26; 95% CI: 0.90-1.77; I2: 55%). For lifetime behaviours, only male-with-male sex was associated with HIV acquisition (IRR: 2.44; 95% CI: 1.18-5.02; I2 = 87%). Results from Egger's tests did not provide evidence of asymmetry bias for our pooled estimates, while I2 measures suggested considerable heterogeneity for many outcomes. INTERPRETATION: PWID who also engage in sex work or male-with-male sex were found to have higher HIV or HCV acquisition risks. Future research should aim to understand the mechanisms driving these associations. FUNDING: Medical Research Council Greater Western Four Partnership Doctoral Training Partnership, Wellcome Trust, Canadian Institutes of Health Research and Medical Research Council.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927168","pmid":"42927168","pmcid":"PMC13694810","doi":"10.1016/j.eclinm.2026.104247","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927168/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-26","journal_abbr":"EClinicalMedicine","journal_full":"EClinicalMedicine","tier":"A","if_val":12.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Systematized scoping review of instruments for measuring adolescent digital technology use.","title_en":"Systematized scoping review of instruments for measuring adolescent digital technology use.","authors":"Vedechkina M, Banati P, Baltag V","affiliation_highlight":"Adolescent and Young Adult Health (AYH) Unit, Sexual, Reproductive, Maternal, Newborn, Child and Adolescent Health and A…","results":"UNLABELLED: Digital technology is a ubiquitous part of adolescent life, yet progress in understanding its implications for health and development is constrained by the lack of standardised, developmentally appropriate me…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"UNLABELLED: Digital technology is a ubiquitous part of adolescent life, yet progress in understanding its implications for health and development is constrained by the lack of standardised, developmentally appropriate measurement tools. This systematized scoping review, conducted following PRISMA-ScR guidelines, identifies and evaluates instruments used to measure adolescent digital technology use between 2014 and December 14 2025. Searches in PubMed, Scopus, and Web of Science yielded 533 peer-reviewed studies, from which 135 validated measurement instruments were identified. We extracted data on instrument characteristics and conducted a secondary search to evaluate psychometric properties using adapted COSMIN criteria. Most tools relied on self-reported frequency or duration of use, with 63% designed to detect problematic behaviours-such as social media addiction or gaming disorder-often using adult-derived clinical criteria. Fewer than 2% of instruments assessed positive or developmentally beneficial use. Tools frequently lacked adolescent-specific content, cultural adaptation, and validation across sociodemographic subgroups, and objective or multi-method measures were rare. Current measurement practices are heavily risk-focused and often insufficiently tailored to adolescents' developmental and sociocultural contexts. This review lays the foundation for WHO's efforts to develop more balanced, psychometrically robust, and culturally sensitive approaches to measuring adolescent digital technology use. FUNDING: None.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927154","pmid":"42927154","pmcid":"PMC13694774","doi":"10.1016/j.eclinm.2026.104261","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927154/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-26","journal_abbr":"EClinicalMedicine","journal_full":"EClinicalMedicine","tier":"A","if_val":12.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The effects of the arts and arts therapies on mental health outcomes of children and young people: a systematic review and meta-analysis.","title_en":"The effects of the arts and arts therapies on mental health outcomes of children and young people: a systematic review and meta-analysis.","authors":"Cheung PS, Rhodes S, Bahr E, Lakena W, Sajnani N, Fietje N, Karkou V","affiliation_highlight":"Faculty of Health, Social Care and Medicine, Research Centre for Arts and Wellbeing, Health Research Institute, Edge Hil…","results":"BACKGROUND: There is growing evidence on the positive effects of the arts and arts therapies for mental health (MH) outcomes. This review aims to fill a research gap by establishing the evidence on the effects of arts-ba…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: There is growing evidence on the positive effects of the arts and arts therapies for mental health (MH) outcomes. This review aims to fill a research gap by establishing the evidence on the effects of arts-based interventions on selected MH outcomes for children and young people (CYP). METHODS: Our systematic review and meta-analysis included randomised controlled trials with CYP aged 5-24 years receiving any type of arts-based intervention. Five databases (CINAHL, Embase.com, MEDLINE, PsycINFO, and Web of Science) were searched for studies published between 1/1/2005 and 18/5/2025. Two reviewers independently screened all records and assessed risk-of-bias using Cochrane Risk of Bias 2 (RoB2) and certainty using Grading of Recommendations Assessment, Development, and Evaluation (GRADE). Data were initially extracted using the AI-assisted review tool Elicit and independently verified by two reviewers. All data were pooled using random-effects meta-analysis, and effect estimates for MH outcomes are summarised as Standardised Mean Differences (SMD) with 95% confidence intervals (CI). Heterogeneity was assessed using the I 2 statistic, with pre-specified subgroup and sensitivity analyses conducted to explore possible sources of inconsistency. This study is registered with PROSPERO (CRD420251015352). FINDINGS: One hundred trials across 29 countries involving CYP aged 5-24 years with a range of health conditions, alongside healthy populations, were included in this review. Based on studies with some concerns or high risk-of-bias, arts-based interventions were found to reduce individuals' depression (1.06 SMD lower [95% CI 0.45-1.67, n = 1655, I 2 = 97%]), anxiety (0.75 SMD lower [95% CI 0.57-0.94, n = 3898, I 2 = 87%]), and increase individuals' wellbeing (0.53 SMD higher [95% CI 0.26-0.80, n = 538, I 2 = 49%]) and quality of life (0.54 SMD higher [95% CI 0.25-0.83, n = 441, I 2 = 53%]) on average post-intervention. Certainty of results relating to wellbeing and quality of life was low due to imprecision and concerns about risk of bias, and very low for depression and anxiety due to additional inconsistency associated with high heterogeneity. Findings relating to anxiety were further supported by biomarker data (blood pressure and heart rate) with moderate certainty. INTERPRETATION: This systematic review provides a comprehensive synthesis of evidence from randomised controlled trials assessing the effects of a wide variety arts-based interventions on the mental health of CYP. Although the strength of any conclusions is limited by heterogeneity, imprecision and bias of the studies assessed, average effects were similar to those typically reported for established non-arts-based psychosocial interventions, including talking therapies. These findings advance our understanding of arts-based therapeutic strategies for CYP's MH. Further high-quality trials, with larger sample sizes and standardised outcome measures and timepoints, are needed to improve the certainty of evidence in this area. FUNDING: UKRI.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊，直接影响可切除胸部肿瘤围术期/新辅助方案选择","curation_clinical_value":"阅读后可直接核对可切除胸部肿瘤围术期/新辅助方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927255","pmid":"42927255","pmcid":"PMC13694981","doi":"10.1016/j.lana.2026.101671","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927255/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-26","journal_abbr":"Lancet Reg Health Am","journal_full":"Lancet Reg Health Am","tier":"A","if_val":9.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Suicide mortality and suicide method trends in the Region of the Americas, 2015-2021: a population-based time-series analysis of progress toward a one-third reduction target.","title_en":"Suicide mortality and suicide method trends in the Region of the Americas, 2015-2021: a population-based time-series analysis of progress toward a one-third reduction target.","authors":"Lange S, Martinez R, Guo K, Hennis AJM, Oliveria E Souza R","affiliation_highlight":"Population & Global Health Institute, Centre for Addiction and Mental Health, 250 College St., Toronto, ON, M5S 2S1, Can…","results":"BACKGROUND: The suicide mortality rate is a key global indicator for monitoring progress toward improved mental health and well-being under the Sustainable Development Goals, and the World Health Organization Comprehensi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The suicide mortality rate is a key global indicator for monitoring progress toward improved mental health and well-being under the Sustainable Development Goals, and the World Health Organization Comprehensive Mental Health Action Plan has set an explicit suicide-specific target of reducing the age-standardized suicide mortality rate by one-third by 2030 (with a baseline year of 2015). This study assessed temporal trends in suicide mortality and suicide methods in the Region of the Americas using average annual percent change (AAPC) for the period 2015-2021. METHODS: Age-standardized and age group-specific suicide mortality rates (per 100,000 population) for the region, subregions, and by country for 2000-2021, and proportion of suicides by method by country, overall and by sex for 2015-2021, were obtained from the World Health Organization Global Health Estimates and the Pan American Health Organization Regional Mortality Database, respectively. In this population-based time-series analysis, AAPC was estimated using joinpoint regression analyses. The AAPCs for suicide mortality rates between 2015 and 2021 were compared with the compound annual reduction required to achieve a one-third reduction by 2030 (-2·67%). FINDINGS: The regional age-standardized suicide mortality rate increased by 1·05% (95% CI: 0·85%, 1·26%; p ≤ 0·0001) annually on average between 2015 and 2021, driven by males (AAPC: 0·99%, 95% CI: 0·81%, 1·17%; p ≤ 0·0001), as the rate among females remained relatively stable during this period (AAPC: 0·02%, 95% CI: -1·38%, 1·45%; p = 0·97). Only 10 countries (30·3%; out of 33) showed significant declines exceeding the 2·67% annual reduction needed to achieve the one-third reduction target by 2030. Across countries, the distribution of recorded suicide methods shifted over time, with increases in the proportion of suicides involving hanging and decreases in the proportions involving firearms and poisoning. INTERPRETATION: Suicide mortality in the region is rising, and the target of a one-third reduction by 2030 is unlikely to be met regionally; however, progress varies considerably across countries, with 10 (30·3%) making substantial progress toward the target. Urgent, coordinated action is needed in the countries with high and increasing suicide mortality rates, combining evidence-based means restriction strategies with broader upstream interventions that address social, economic and health-system determinants of suicide risk. FUNDING: None.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42925958","pmid":"42925958","pmcid":"","doi":"10.1016/j.radonc.2026.111822","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925958/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-26","journal_abbr":"Radiother Oncol","journal_full":"RADIOTHERAPY AND ONCOLOGY","tier":"A","if_val":5.8,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"pulm","category_label":"非肿瘤呼吸病","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Photon FLASH spares radiation-induced lung injury and pulmonary hypertension in a preclinical model.","title_en":"Photon FLASH spares radiation-induced lung injury and pulmonary hypertension in a preclinical model.","authors":"Brown KH, Ghita-Pettigrew M, McCabe L, McDowell MP, Kerr BN, Walls GM, McMahon SJ, Butterworth KT et al.","affiliation_highlight":"Johnston Cancer Research Centre, Queen's University Belfast, Northern Ireland, UK.","results":"INTRODUCTION: Ultra-high dose rate (UHDR) radiotherapy has shown significant promise in reducing normal tissue toxicities with equivalent tumour control compared to conventional (CONV) dose rates termed the FLASH effect.…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Ultra-high dose rate (UHDR) radiotherapy has shown significant promise in reducing normal tissue toxicities with equivalent tumour control compared to conventional (CONV) dose rates termed the FLASH effect. In this study, we compared radiation-induced lung injury and changes in the pulmonary circulation following localised right lung irradiation at UHDR and CONV exposures using photons. METHODS: Acute and late pulmonary radiation responses were assessed in pneumonitis (C3H/NeJ) and fibrosis prone (C57BL/6) mice. 18 Gy was delivered to the right lung at CONV (0.05 Gy/s), FLASH (76.2 Gy/s) and FLASH split dose (FSD, average 2.6 Gy/s) exposures. Early responses (72 h and 4 weeks after irradiation) were investigated by immunohistochemistry (Ly6G, F4/80), fluorescence staining (EdU) and serum profiling (cytokines and lipid peroxidation assays). Fibrosis was assessed at 30 weeks after irradiation by cone-beam CT (CBCT) analysis and quantification of collagen, senescence (p21) and TGF-β levels. Changes in pulmonary vasculature and transthoracic echocardiography (TTE) was assessed in C57BL/6 mice at 30 weeks to characterise changes in pulmonary circulation associated with pulmonary hypertension (PH). RESULTS: At early timepoints, UHDR exposures led to reduced immune cell infiltration (neutrophils and macrophages) and tissue damage in comparison to CONV and FSD groups. Serum analysis supported FLASH sparing with decreased levels of markers associated with chronic inflammation and increased markers of tissue repair in comparison to CONV and FSD groups. At 30 weeks after irradiation at a UHDR, the lung parenchyma was structurally similar to controls (p = 0.33) with minimal collagen deposition supported by CBCT tissue density analysis. In contrast, CONV and FSD animals showed significant collagen deposition (p < 0.01) with thickened alveolar septa and reduced alveolar air spaces. UHDR exposures significantly reduced functional and histological metrics of PH (p < 0.05) compared to CONV. CONCLUSIONS: UHDR photons significantly reduce radiation-induced pneumonitis and fibrosis with secondary effects on the pulmonary circulation sparing PH.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42925963","pmid":"42925963","pmcid":"","doi":"10.1016/j.healun.2026.10.013","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925963/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-26","journal_abbr":"J Heart Lung Transplant","journal_full":"JOURNAL OF HEART AND LUNG TRANSPLANTATION","tier":"A","if_val":6.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"叙述性综述（非系统评价）· 供体保存技术整合","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":41,"score_breakdown":{"clinical":11,"methodology":9,"specialty":13,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"现代供体时代整块心肺联合移植的双器官获取与保存挑战：一篇叙述性综述","title_en":"En Bloc Heart-Lung Transplantation in the Modern Donor Era: Dual-Organ Recovery and Preservation Challenges.","authors":"Leon M, Ruaengsri C, Shudo Y","affiliation_highlight":"Department of Cardiothoracic Surgery, Stanford University School of Medicine, Stanford, California, USA.","results":"","authors_conclusion":"现有证据仍为观察性研究，并受该手术操作罕见性制约。未来进展需要开展多中心、专门针对保存的数据收集，并开发将心肺整块视为一个整合的生理单元、而非两个被一起转运的孤立器官的移植物特异性系统。","ai_note":"摘要未报告系统检索策略、数据库来源、纳入排除标准或偏倚评价方法，不属于系统评价，结论主要基于专家意见与单器官外推；文中声称对“整块直接证据”与“单器官外推”加以区分，但摘要未给出任何可核验的定量数据或证据分级，该区分的可靠程度信息不足。","pico":{"p":"","ic":""},"reason":"为心肺联合移植的供体获取与保存（静态冷存、控制性低温转运、10°C保存、气道压力调控、DCD通路）提供现状梳理框架，可作为该领域课题设计与单器官外推边界判断的背景参考，对胸外科/移植方向选题有边际价值，但不直接改变肿瘤患者临床决策。","abstract_en":"Combined heart-lung transplantation remains a rare but essential therapy for selected patients with end-stage cardiopulmonary disease that cannot be addressed by isolated heart or lung transplantation. Modern donor allocation, increasing recipient acuity, donation after circulatory death, and longer transport distances have made graft preservation a critical determinant of whether scarce en bloc grafts can be used safely. Unlike isolated organs, the intact heart-lung bloc presents competing preservation requirements: the heart and lungs differ in ischemic tolerance, optimal storage temperature, perfusate chemistry, airway management, and tolerance of pressure and volume during recovery. Across conventional static cold storage, controlled hypothermic transport, regulated airway-pressure devices, 10°C storage, and emerging donation after circulatory death recovery pathways, this review integrates contemporary approaches for donation after brain death and donation after circulatory death while distinguishing direct en bloc evidence from single-organ extrapolation. The evidence base remains observational and constrained by procedural rarity. Future progress will require multicenter preservation-specific data collection and graft-specific systems that treat the heart-lung bloc as an integrated physiologic unit rather than as two isolated organs transported together.","tags":["心肺联合移植","供体保存","循环死亡后捐献","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927325","pmid":"42927325","pmcid":"PMC13695302","doi":"10.1016/j.ctro.2026.101310","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927325/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-26","journal_abbr":"Clin Transl Radiat Oncol","journal_full":"Clinical and Translational Radiation Oncology","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Timing of cranial radiotherapy in HER2-positive breast Cancer brain metastases treated with Pyrotinib: a multicentre real-world cohort study.","title_en":"Timing of cranial radiotherapy in HER2-positive breast Cancer brain metastases treated with Pyrotinib: a multicentre real-world cohort study.","authors":"Chen Z, Jing H, Huang S, Wang M, Mao D, Li L, Lu S, Zhou X et al.","affiliation_highlight":"Department of Radiation Oncology, The Third Affiliated Hospital of Kunming Medical University, Yunnan Cancer Hospital, P…","results":"BACKGROUND AND PURPOSE: Cranial radiotherapy (RT) and pyrotinib both demonstrate efficacy in HER2-positive breast cancer brain metastases (BCBM); however, the optimal sequencing of these modalities remains to be establis…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND AND PURPOSE: Cranial radiotherapy (RT) and pyrotinib both demonstrate efficacy in HER2-positive breast cancer brain metastases (BCBM); however, the optimal sequencing of these modalit
