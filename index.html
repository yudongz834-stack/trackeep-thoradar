点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部提供者","metric":"所在机构提供肺癌筛查的比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部提供者」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部提供者","metric":"转诊患者至肺癌筛查项目的比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部提供者」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部提供者","metric":"具备筛查阳性随访策略的比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部提供者」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部提供者","metric":"提供戒烟服务的比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部提供者」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"实施策略评价子样本","metric":"参与实施策略评价的提供者数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「实施策略评价子样本」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"美国佐治亚州基层医生肺癌筛查知识、态度与实践的问卷调查：知识水平中等偏上但患者教育与戒烟服务落实不足","title_en":"Lung cancer screening knowledge, attitudes, and practices among primary care providers in Georgia, USA: A survey analysis.","authors":"Escoffery C, Lynam M, Kodali T, Hotz J, Anderson S, Haardörfer R, Dupont S, Yanis J et al.","affiliation_highlight":"Rollins School of Public Health, Emory University, 1534 Clifton Rd NE, Atlanta, GA 30322, USA.","results":"知识平均得分 3.72/5（SD=1.11）；医生得分显著高于护士/执业护士（β=-1.0, 95% CI: -1.6, -0.44）；约45%报告所在机构提供肺癌筛查，50%报告转诊患者至筛查项目；75.5%具备筛查阳性患者的随访策略，但仅22.6%提供戒烟服务；主要障碍为费用、患者知识/兴趣不足与交通，主要促进因素为费用援助、患者教育材料与患者导航；N=86 的提供者将“分发患者教育材料”和“提醒临床医生”评为高度可行且重要的实施策略。","authors_conclusion":"尽管多数提供者知识充足、态度积极且肺癌筛查服务可及性高，但极少有人开展患者教育或提供戒烟资源；患者教育与临床医生提醒可能是基层肺癌筛查有益的实施策略。","ai_note":"疑点：①便利样本、单一州、在线自报告，摘要未报告应答率与抽样框，选择偏倚与代表性不明；②知识得分为自建5分制量表，信效度未交代，“知识充足”的结论与均值3.72/5之间存在口径松动；③实践指标全部为自报“是否提供/转诊”，无电子病历或筛查完成率等客观验证，易高估；④知识预测因素仅报告提供者类型的单变量/回归系数，未说明协变量调整与模型拟合；⑤实施策略仅在N=86子样本中评价，与主样本关系及子样本选择规则未说明。","pico":{"p":"美国佐治亚州基层医疗服务提供者，有效样本 N=112（医生 N=73；实施策略评价子样本 N=86）","ic":"无干预对照比较；暴露/分组因素为提供者类型（医生 vs 护士/执业护士），结局为肺癌筛查知识、态度、实践及实施策略可行性/重要性评价"},"reason":"为基层肺癌筛查的实施科学提供需求侧基线：量化了“筛查可及性较高但戒烟转介与患者教育严重不足”的落差，可供筛查项目设计与随访闭环改进参考；同时为问卷类研究在抽样与客观验证上的局限提供方法学对照。","abstract_en":"OBJECTIVE: To inform lung cancer screening (LCS) in primary care settings, the study assessed providers' knowledge, attitudes, and practices around LCS and recommended implementation strategies. METHODS: The online survey was administered from May-August 2025 among primary care providers in Georgia, USA. We ran descriptive analyses for all data and linear regression for predictors of greater knowledge. RESULTS: Providers (N = 112) had an average knowledge score of 3.72/5 (SD = 1.11). Physicians (N = 73) scored significantly higher than nurses/nurse practitioners (β = -1.0, 95% CI: -1.6, -0.44). Overall, participants viewed LCS positively, and about 45% reported offering LCS at their facility while 50% reported referring patients to LCS programs. Most (75.5%) had strategies to follow-up with patients who screened positive, but few (22.6%) offered tobacco cessation services. Top barriers were cost, lack of patient knowledge/interest, and transportation; cost assistance, patient education materials, and patient navigation were the top facilitators. Providers (N = 86) identified 'Distributing patient educational materials' and 'Reminding clinicians' as highly feasible and important implementation strategies. CONCLUSIONS: While most providers had sufficient knowledge, positive perceptions, and high availability of LCS services, few engage in patient education or offer smoking cessation resources. Patient education and clinician reminders may be beneficial implementation strategies for primary care-based LCS.","tags":["肺癌筛查","基层医疗","实施科学","戒烟干预","问卷调查","横断面研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901161","pmid":"42901161","pmcid":"","doi":"10.1016/j.molcel.2026.09.037","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901161/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Mol Cell","journal_full":"Mol Cell","tier":"C","if_val":16.0,"zone":"JCR Q1 · 未收录","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Regulatable in vivo gene expression via adaptamers.","title_en":"Regulatable in vivo gene expression via adaptamers.","authors":"Bryant J, Herron L, Doctor Y, McRae F, Wang J, Hirsch T, Portell A, Kumar S et al.","affiliation_highlight":"Department of Bioengineering, University of California San Diego, La Jolla, CA, USA.","results":"Precise, reversible control of transgene expression is essential for safe and durable gene therapy, yet current inducible systems remain difficult to translate in vivo due to large size, limited induction duration, and d…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Precise, reversible control of transgene expression is essential for safe and durable gene therapy, yet current inducible systems remain difficult to translate in vivo due to large size, limited induction duration, and dependence on immunogenic regulators. Here, we present the adaptamer (adenosine deaminases acting on RNA [ADAR]-modulatable aptamer), a compact (<120 base pair) RNA switch that couples FDA-approved small-molecule-responsive aptamers with endogenous ADAR-mediated RNA editing to regulate expression. Ligand binding stabilizes a double-stranded RNA structure that recruits ADAR to convert a stop codon into a sense codon, restoring downstream protein translation. This cleavage-free, post-transcriptional mechanism enables precise, small-molecule-dependent modulation without exogenous protein machinery. We demonstrate that adaptamers are highly functional across multiple cell lines, including human T cells. In mice, adeno-associated virus (AAV)-delivered adaptamer-controlled FGF21 expression induced metabolic remodeling, reversing obesity and hepatic steatosis. This minimal, programmable system offers a clinically compatible approach for tunable genetic medicines and safe deployment of pleiotropic and dose-limited proteins.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42901160","pmid":"42901160","pmcid":"","doi":"10.1016/j.molcel.2026.09.036","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901160/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Mol Cell","journal_full":"Mol Cell","tier":"C","if_val":16.0,"zone":"JCR Q1 · 未收录","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Proteome-wide C-degron activity profiling connects conditional regulation of the CTLH E3 ligase complex to ribosome biogenesis.","title_en":"Proteome-wide C-degron activity profiling connects conditional regulation of the CTLH E3 ligase complex to ribosome biogenesis.","authors":"Grant DW, Tan S, Ramage DE, Li MZ, Di Y, Tchasovnikarova IA, Weekes MP, Elledge SJ et al.","affiliation_highlight":"Cambridge Institute for Therapeutic Immunology and Infectious Disease, Department of Medicine, University of Cambridge, …","results":"Many E3 ubiquitin ligases recognize degrons located at protein termini, but the paucity of bona fide substrates of N-degron and C-degron pathways hampers our understanding of their physiological significance. Devising an…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Many E3 ubiquitin ligases recognize degrons located at protein termini, but the paucity of bona fide substrates of N-degron and C-degron pathways hampers our understanding of their physiological significance. Devising an expression screening strategy to assess the effect of C-terminal \"capping\" on the stability of thousands of human proteins, we systematically identify substrates harboring C-degrons. Interrogating one leading candidate, ZMYND19, we characterize a C-degron pathway governed via the C-terminal to LisH (CTLH) E3 ligase complex subunit Muskelin. Cell-to-cell variability in ZMYND19 stability uncovered conditional regulation, with CTLH-mediated degradation impaired by TNF-α stimulation but enhanced by mTOR inhibition. Parallel genetic and proteomic screens identified angio-associated migratory protein (AAMP) and apoptosis-enhancing nuclease (AEN) as additional substrates of the CTLHMuskelin C-degron pathway, leading us to define an essential role for AAMP in ribosome maturation through chaperone activity toward uL16. Altogether, these data define a C-degron pathway connecting conditional regulation of the CTLH E3 ligase complex to ribosome biogenesis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42902303","pmid":"42902303","pmcid":"9077940","doi":"10.1186/s13019-022-01853-3","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902303/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"J Cardiothorac Surg","journal_full":"Journal of cardiothoracic surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"技术报告（technical note）· 单中心手术技术描述，非对照研究","category":"surgery","category_label":"微创与无管化胸外科","score_total":34,"score_breakdown":{"clinical":11,"methodology":6,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"仅离断靶段动脉后充气-排气法在胸腔镜肺段切除中显示段间平面的技术报告（无临床验证数据）","title_en":"A novel and simple Inflation-deflation method with inflated targeted segments for confirming the intersegmental border under video-assisted thoracoscopic surgery: a technical note.","authors":"Chen W, Yu Z","affiliation_highlight":"Department of Thoracic Surgery, Cancer Hospital of Dalian University of Technology, Liaoning Cancer Hospital & Institute…","results":"","authors_conclusion":"该新技术与其他现有方法相比具有气道损伤更小、段间平面更易确定、容错率更高、无需额外设备且易于操作等优势；尚需进一步临床研究验证该新技术的可行性与适用性。","ai_note":"全文无样本量、无病例数、无成功率或任何定量数据，属纯技术描述，所声称的“气道损伤更小、更易确定平面、容错率更高”均无对照数据支持，属作者主观判断；仅凭摘要无法评估安全性、段间平面准确性及对切缘/复发的影响；摘要亦未说明适应证（结节位置、段别）与失败病例处理。","pico":{"p":"","ic":"干预：仅离断靶段动脉、保留靶段静脉与支气管后，采用充气-排气（Inflation-deflation）法显示段间平面；对照：与现有其他方法的非定量比较（未设对照研究）"},"reason":"为胸腔镜肺段切除中段间平面识别这一关键技术环节提供一种简化、不依赖额外设备的操作思路，可作为后续对照研究或器械/技术改进研究的假说来源，但当前证据级别不足以改变术式选择。","abstract_en":"With the increase in the diagnosis rate of small pulmonary nodules, the segmentectomy has been increasingly used in clinical practice worldwide. However, for the segmentectomy, the confirmation of intersegmental plane has always puzzled many thoracic surgeons. This paper described a new method, named artery-based Inflation-deflation method, used to confirm the intersegmental border under video-assisted thoracoscopic surgery. After only dividing the targeted segment artery and preserving the targeted segmental veins and bronchi, the intersegmental plane was successfully generated by this novel Inflation-deflation method. Compared with other current methods, this new technique had some advantages including the smaller airway damage, easier to determine the intersegmental plane, the higher fault-tolerant rate and easy to operate without any additional devices. And a further clinical study should be carried out to verify the feasibility and applicability of this new technique.","tags":["肺段切除","段间平面","充气-排气法","VATS","技术报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902412","pmid":"42902412","pmcid":"4384884","doi":"10.1016/j.ccell.2025.02.014","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902412/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Hematol Oncol","journal_full":"Journal of Hematology Oncology","tier":"A","if_val":47.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"叙述性综述 · 转化药理学与纳米递送平台评述","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":33,"score_breakdown":{"clinical":8,"methodology":12,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"纳米工程化STING激动剂治疗癌症：从递送增强转向免疫动力学控制（综述）","title_en":"Nanoengineered STING agonists for cancer therapy: toward immunodynamic control.","authors":"Liu N, Wang X, Zhang W, Kan Y, Petrovna BM, Wang Z, Kong X, Wang J et al.","affiliation_highlight":"Department of Breast Surgical Oncology, National Cancer Center, National Clinical Research Center for Cancer, Cancer Hos…","results":"","authors_conclusion":"Overall, nano-STING therapy should be developed toward immunodynamic control rather than simple delivery enhancement, with benefit judged by the relationship among delivery, cell-resolved pharmacodynamics, antitumor efficacy, and toxicity.","ai_note":"叙述性综述，无系统检索、定量合成或原始疗效数据；对第一代STING激动剂临床活性有限的判断为定性陈述，摘要未给出具体数值；结论属概念性主张，需原始研究验证；信息不足：未报告各纳米平台间比较的定量证据。","pico":{"p":"","ic":""},"reason":"为STING激动剂纳米递送与免疫动力学控制提供概念框架，影响免疫治疗药物设计与转化终点选择，但对胸外科即时临床决策影响有限。","abstract_en":"Activation of the cyclic GMP-AMP synthase-stimulator of interferon genes (cGAS-STING) pathway is a mechanistically compelling strategy for cancer immunotherapy, but first-generation STING agonists have shown limited clinical activity despite clear pharmacodynamic induction of interferon-related signals. This translational gap suggests that therapeutic benefit depends not only on pathway engagement but also on where, in which cells, at what amplitude, and for how long STING is activated. In this review, we summarize the cellular context of cGAS-STING signaling, the pharmacological evolution and clinical experience of STING agonists, and the major barriers imposed by route, species differences, biological heterogeneity, and systemic inflammatory toxicity. We then examine how nanoengineering may improve agonist protection, cytosolic access, tissue and cell-type selectivity, and temporal exposure. Importantly, we distinguish improved delivery or tumor accumulation from direct evidence of altered signaling kinetics or a wider therapeutic window. Representative lipid, polymeric, inorganic, biogenic, biomimetic, antibody-directed, and prodrug-based platforms are evaluated together with mechanism-based combination sequencing, hematologic malignancy-specific considerations, biomarker-guided patient selection, repeated-dose safety, and manufacturability. Overall, nano-STING therapy should be developed toward immunodynamic control rather than simple delivery enhancement, with benefit judged by the relationship among delivery, cell-resolved pharmacodynamics, antitumor efficacy, and toxicity.","tags":["STING激动剂","纳米递送","肿瘤免疫治疗","转化医学","综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901164","pmid":"42901164","pmcid":"","doi":"10.1016/j.xcrm.2026.103115","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901164/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cell Rep Med","journal_full":"Cell Rep Med","tier":"A","if_val":14.0,"zone":"JCR Q1 · 1区","warned":false,"study_type":"临床前小鼠机制研究（基因敲除与受体激动剂干预）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":28,"score_breakdown":{"clinical":1,"methodology":18,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肠源性胰高血糖素样肽通过GLP-1R/GLP-2R信号减轻小鼠T细胞介导的肠损伤","title_en":"Gut-derived glucagon-like peptides attenuate T cell-induced intestinal injury.","authors":"Koehler JA, Baggio LL, Cao X, Shang R, Yusta B, Wong CK, Matthews D, Sandoval DA et al.","affiliation_highlight":"Department of Medicine, Lunenfeld-Tanenbaum Research Institute, Mt.","results":"","authors_conclusion":"Collectively, these findings demonstrate distinct biological roles for endogenous GLP-1R/GLP-2R activity in immune-mediated intestinal injury and highlight the therapeutic potential of glucagon-like peptides, alone or together, for ameliorating T cell-mediated mucosal injury.","ai_note":"摘要无样本量、效应量、统计检验与主要/次要终点预设；仅为小鼠临床前数据，作者由机制发现外推至“治疗潜力”，跨人群外推需谨慎；未报告肠损伤的具体量化指标。信息不足：无法判断偏倚风险与效应大小。与胸部肿瘤无直接关联。","pico":{"p":"小鼠模型：Glp1r-/-、Glp2r-/-、肠道特异性proglucagon敲除（GcgGut-/-）及αCD3诱导肠损伤模型；样本量摘要未报告","ic":"干预与对照：内源性GLP-1R/GLP-2R信号缺失 vs 完整信号；在GcgGut-/-小鼠中给予GLP-2R激动剂teduglutide、GLP-1R激动剂semaglutide（单药或联合） vs 对照，评估αCD3诱导肠损伤"},"reason":"与胸外科/胸部肿瘤临床判断无直接关联；仅可作为免疫相关肠损伤机制的临床前参考，不能影响胸部肿瘤患者选择、手术决策或随访策略。","abstract_en":"Glucagon-like peptide-1 (GLP-1) and glucagon-like peptide-2 (GLP-2) are produced in enteroendocrine L cells and control energy homeostasis. GLP-1 receptor (GLP-1R) activation improves glucose homeostasis and induces satiety and weight loss, whereas GLP-2 receptor (GLP-2R) signaling promotes intestinal growth and nutrient absorption. GLP-1R and GLP-2R agonism also reduce intestinal damage in preclinical studies. Here, we demonstrate that endogenous GLP-1R and GLP-2R signaling are essential for protecting the intestine from T cell-mediated enteropathy. Gut injury induced by T cell activation is increased in Glp1r-/- and Glp2r-/- mice, as well as in mice with selective loss of intestinal proglucagon gene expression (GcgGut-/-). Conversely, the GLP-2R agonist teduglutide and the GLP-1R agonist semaglutide, administered separately or together, attenuate αCD3-induced intestinal damage in GcgGut-/- mice. Collectively, these findings demonstrate distinct biological roles for endogenous GLP-1R/GLP-2R activity in immune-mediated intestinal injury and highlight the therapeutic potential of glucagon-like peptides, alone or together, for ameliorating T cell-mediated mucosal injury.","tags":["临床前小鼠研究","GLP-1/GLP-2","肠损伤","免疫介导","非胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902326","pmid":"42902326","pmcid":"8360766","doi":"10.1016/j.immuni.2020.04.014","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902326/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Hematol Oncol","journal_full":"Journal of Hematology Oncology","tier":"A","if_val":47.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"叙述性综述 · 机制与治疗策略整合（非系统评价，无原始数据）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":28,"score_breakdown":{"clinical":8,"methodology":7,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"转移性癌症各阶段治疗瓶颈与新兴干预策略的机制整合综述（无原始研究数据）","title_en":"Cancer metastasis: biological mechanisms, therapeutic bottlenecks, and emerging interventions.","authors":"Ye H, Wei Y, He X, Wei X","affiliation_highlight":"Laboratory of Aging Research and Immunology, State Key Laboratory of Biotherapy and Cancer Center, National Clinical Res…","results":"","authors_conclusion":"通过整合转移生物学、治疗失败机制与新兴干预，本综述为理解和靶向限制转移性癌症持久疾病控制的瓶颈提供了框架。","ai_note":"摘要未报告系统检索策略、文献纳入/排除标准、证据分级或任何定量合成，属叙述性综述，结论性表述（如“提供框架”）不可作为疗效证据引用；全文为泛瘤种视角，未对胸部肿瘤（肺癌/食管癌）作专门分层，向胸外科临床外推需谨慎；摘要中“液体活检指导动态治疗调整”“先进临床前模型”均为展望性表述，无支持数据。","pico":{"p":"","ic":""},"reason":"为胸部肿瘤转移灶耐药与联合方案设计提供分阶段机制框架与假设来源，可用于课题立题背景与转化研究方向梳理，但不直接改变手术或系统治疗决策。","abstract_en":"Metastatic cancer remains a major clinical challenge, which is driven by the continuous adaptation of disseminated tumor cells to diverse tissue environments and therapeutic pressures. Although current treatments, including conventional therapies, small-molecule drugs, antibody-drug conjugates, and immunotherapies, have improved clinical outcomes in selected patients, they rarely achieve durable disease control, largely because each stage of the metastatic cascade presents distinct therapeutic bottlenecks. This review examines these bottlenecks and identifies therapeutic vulnerabilities that can be targeted at each metastatic stage. Cross-stage adaptive programs, encompassing genetic, epigenetic, metabolic, immune, and microenvironmental alterations, are linked to the specific modes of therapeutic failure they drive, thereby connecting underlying mechanisms with their corresponding clinical consequences. Emerging therapeutic strategies are discussed in the context of the metastatic stage, and general design principles for combination regimens are proposed. We also highlight the potential of liquid biopsy-guided dynamic treatment adjustment and advanced preclinical models to inform patient selection, treatment timing, and the design of therapies aimed at overcoming resistance. By integrating metastatic biology, mechanisms of therapeutic failure, and emerging interventions, this review provides a framework for understanding and targeting the bottlenecks that limit durable disease control in metastatic cancer.","tags":["转移机制","治疗耐药","叙述性综述","液体活检","联合治疗设计"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42900992","pmid":"42900992","pmcid":"","doi":"10.1016/j.ejon.2026.103353","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900992/","notice_url":"","trial_url":"","pub_date":"2026-Oct-17","briefing_date":"2026-10-22","journal_abbr":"Eur J Oncol Nurs","journal_full":"European Journal of Oncology Nursing","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"质性研究 · 半结构化访谈与框架分析（RREAL RAP）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":28,"score_breakdown":{"clinical":6,"methodology":18,"specialty":4,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"英国TYA癌症外展工作人员对跨院照护协调角色的质性体验：促进因素与障碍","title_en":"The role of outreach workers in care coordination for teenagers and young adults with cancer: The BRIGHTLIGHT_2021 programme.","authors":"Iqbal S, McLeod A, Taylor RM, Fern LA, Barber JA, Cargill J, Feltbower RG, Haddad L et al.","affiliation_highlight":"Rapid Research Evaluation and Appraisal Lab (RREAL), Department of Targeted Intervention, University College London, Lon…","results":"","authors_conclusion":"Outreach workers described their role as highly skilled, complex and varied. Incorporating the identified facilitators and barriers into outreach strategies, including integration into healthcare settings, increased resourcing, and staff awareness may help inform future TYA care coordination, workforce planning and integration of outreach workers into routine TYA cancer healthcare settings.","ai_note":"仅10名工作人员、单国目的抽样、自述体验，无患者结局或照护结局数据；将促进/障碍直接推及劳动力规划与服务整合需谨慎；摘要未报告样本饱和、访谈时长、编码一致性或反思性等质性严谨性细节，信息不足。","pico":{"p":"英国PTC及指定医院工作的10名外展工作人员与照护协调人员","ic":"无干预对照；采用半结构化质性访谈探索外展工作人员协调TYA癌症照护的经验"},"reason":"为TYA癌症跨院照护协调与外展工作人员整合提供质性证据，可辅助理解PTC与地方医院协作障碍；对胸外科围手术期、结节或手术决策影响有限，不改变肿瘤治疗选择。","abstract_en":"PURPOSE: Teenagers and young adults (TYA) with cancer have distinct developmental, psychosocial, and clinical needs that require age-appropriate care. Healthcare policy in the United Kingdom advocates care in centralised specialist age-appropriate TYA Principal Treatment Centres (PTCs). The responsibility of coordination and delivery of 'joint care' is reliant on outreach workers who bridge the gap between the PTC and hospitals and support young people closer to home. We aimed to explore outreach workers' experiences of their role in coordinating TYA cancer care. METHOD: Semi-structured qualitative interviews were conducted with 10 outreach workers and care coordination staff working across PTCs and designated hospitals in the United Kingdom. Data were analysed thematically using framework analysis informed by rapid assessment procedure (RREAL RAP) sheets. RESULTS: Outreach workers described their role as providing coordinated care and liaison across multidisciplinary teams, addressing TYA needs and filling a perceived gap in services. Participants reported that their role contributed to continuity of care and facilitated equitable access to age-appropriate care closer to home. Potential barriers included isolation due to large geographic coverage and travel time and limited staff understanding outreach roles, alongside inconsistent referral routes. Outreach workers emphasised the need for skills such as communication, relationship-building and strong clinical knowledge. CONCLUSIONS: Outreach workers described their role as highly skilled, complex and varied. Incorporating the identified facilitators and barriers into outreach strategies, including integration into healthcare settings, increased resourcing, and staff awareness may help inform future TYA care coordination, workforce planning and integration of outreach workers into routine TYA cancer healthcare settings.","tags":["TYA癌症","照护协调","外展工作人员","质性研究","肿瘤护理"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902371","pmid":"42902371","pmcid":"8981341","doi":"10.1016/0003-4975(92)90412-W","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902371/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Gen Thorac Cardiovasc Surg Cases","journal_full":"General thoracic and cardiovascular surgery cases","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"个案报道（单例）· 影像随访与手术病理描述","category":"surgery","category_label":"微创与无管化胸外科","score_total":28,"score_breakdown":{"clinical":10,"methodology":3,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例病例","metric":"囊肿最大径（8年前CT）","val":"4.8 cm","stat":"","grounded":true,"checks":[{"num":"4.8","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例病例","metric":"囊肿最大径（本次CT）","val":"13 cm","stat":"","grounded":true,"checks":[{"num":"13","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例病例","metric":"增大间隔","val":"8年","stat":"","grounded":true,"checks":[{"num":"8","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"单例病例","metric":"囊肿最大径（8年前CT）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"囊肿最大径（本次CT）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"增大间隔","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"未识别支气管源性囊肿8年间由4.8 cm增大至13 cm伴囊内出血并需复杂手术切除：一例病例报告","title_en":"Massive enlargement of a previously unrecognized bronchogenic cyst over 8 years with intracystic hemorrhage and complex surgical resection: a case report.","authors":"Kobayashi S, Fukui E, Nagata H, Kimura K, Kimura T, Kanou T, Ose N, Shintani Y et al.","affiliation_highlight":"Department of General Thoracic Surgery, Graduate School of Medicine, The University of Osaka, 2-2-L5 Yamadaoka, Suita, O…","results":"囊肿在8年间由4.8 cm增大至13 cm；本次CT示13 cm肿块，8年前CT示4.8 cm囊性病变；术中发现大量血肿，组织病理学证实支气管源性囊肿伴囊内出血","authors_conclusion":"本病例显示既往未识别的支气管源性囊肿在8年间由4.8 cm显著增大至13 cm，伴囊内出血、症状进展及技术难度较高的手术切除；在决定支气管源性囊肿切除时机时，应考虑其显著增大及手术复杂度增加的可能性","ai_note":"单例病例报告，无对照，不能推断最佳切除时机；8年前与本次影像的测量方法、切面一致性及随访间隔原因未说明；“未识别”与临床决策之间的关系信息不足；结论外推至所有支气管源性囊肿需谨慎","pico":{"p":"1例20余岁男性，既往未识别支气管源性囊肿，8年前CT示4.8 cm囊性病变，本次CT示13 cm肿块","ic":"尝试保守治疗后因压迫症状持续行手术切除；术中因严重炎性粘连行右开胸及食管肌层部分切除；无对照组"},"reason":"提示支气管源性囊肿可长期显著增大并增加手术复杂度，为未识别或无症状囊肿的随访策略与切除时机讨论提供个案依据","abstract_en":"BACKGROUND: Bronchogenic cysts are usually asymptomatic and are often detected incidentally; however, they may become symptomatic due to infection, hemorrhage, or enlargement. We report a case of a previously unrecognized bronchogenic cyst that showed substantial enlargement from 4.8 to 13 cm over an 8-year interval, with intracystic hemorrhage, ultimately requiring partial resection of the esophageal muscularis. CASE PRESENTATION: A man in his 20s presented with upper abdominal pain and nausea. Computed tomography revealed a 13-cm mass extending from below the tracheal bifurcation to the level of the gastric cardia. A CT scan obtained eight years earlier during the evaluation of abdominal pain had shown a 4.8-cm cystic lesion below the tracheal bifurcation, demonstrating substantial enlargement over the intervening period. Although conservative treatment was attempted, compressive symptoms persisted; therefore, surgical resection was performed for definitive diagnosis and symptom relief. Severe inflammatory adhesions necessitated right open thoracotomy with partial resection of the esophageal muscularis. The cyst contained a large hematoma, and histopathological examination confirmed the diagnosis of a bronchogenic cyst with intracystic hemorrhage. CONCLUSION: This case demonstrates substantial enlargement of a previously unrecognized bronchogenic cyst from 4.8 to 13 cm over an 8-year interval, with intracystic hemorrhage, symptomatic progression, and technically demanding surgical resection. The potential for substantial enlargement and increasing surgical complexity should be considered when determining the timing of resection for bronchogenic cysts.","tags":["支气管源性囊肿","病例报告","囊内出血","手术切除","随访时机"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902345","pmid":"42902345","pmcid":"PMC12616960","doi":"10.1186/s12967-025-07307-3","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902345/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Exp Hematol Oncol","journal_full":"Experimental Hematology Oncology","tier":"A","if_val":17.5,"zone":"JCR Q1 · 2区","warned":false,"study_type":"临床前体外研究 · 细胞系功能实验、共培养与分泌组分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":26,"score_breakdown":{"clinical":3,"methodology":13,"specialty":2,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"MEK抑制剂cobimetinib在BRAF V600E突变未分化甲状腺癌模型中降低MAPK通路活性并减少免疫抑制性成纤维细胞亚群及IL-8分泌","title_en":"Cobimetinib impairs tumor survival and immune escape by altering my-CAFs in BRAFV600E-mutated anaplastic thyroid carcinoma.","authors":"Udinotti M, Ramm N, Hamdan TAAA, Khan MSA, Siebolts U, Bauer M, Lorenz K, Dierks C et al.","affiliation_highlight":"Institute of Pathology, Section Immunopathology, Martin Luther University Halle-Wittenberg, Halle, Germany.","results":"","authors_conclusion":"数据提供临床前证据表明下游MEK抑制改变ATC模型中的肿瘤细胞信号及IL-8相关肿瘤-成纤维细胞通讯；未确立cobimetinib单药可替代临床已建立的BRAF/MEK联合治疗，但支持MEK抑制剂靶向肿瘤进展和免疫逃逸的更广泛治疗潜力。","ai_note":"仅体外细胞系/共培养/分泌组证据，无体内模型、无临床样本验证；摘要未给出样本量、重复数及统计量，无法判断效应大小与稳健性；标题强调my-CAFs，但摘要仅描述成纤维细胞表型组成及免疫抑制亚型，未明确myCAF标志物或定量定义；与直接BRAF抑制的比较缺少具体药物、剂量及定量结果；“替代联合治疗”的限定显示作者对转化外推有所保留。","pico":{"p":"BRAF V600E突变未分化甲状腺癌细胞系及人成纤维细胞；具体样本量摘要未报告","ic":"cobimetinib（MEK抑制）对比直接BRAF抑制；并包含IL-8暴露及肿瘤-成纤维细胞共培养实验"},"reason":"为BRAF V600E实体瘤中MEK抑制调控MAPK通路、IL-8及免疫抑制性成纤维细胞的机制假设提供临床前参照；对胸外科手术选择或随访决策直接影响有限，但可作为系统治疗耐药与CAF免疫逃逸研究的旁证基线。","abstract_en":"Anaplastic thyroid carcinoma is one of the most aggressive thyroid cancers characterized by rapid progression and high resistance to conventional therapies. Although mutations in the BRAF gene are common in thyroid cancer, targeted therapies against this mutation show limited clinical benefit. This study investigated whether inhibition of downstream signaling pathways using the selected MEK inhibitor cobimetinib provides advantages over direct BRAF inhibition. Genomic and expression analyses of thyroid cancer datasets confirmed frequent BRAF alterations and activation of MAPK-pathway-associated signaling. Functional studies using thyroid cancer cell lines demonstrated that cobimetinib more effectively reduced MAPK pathway activity specifically reducing ERK1/2 phosphorylation compared to direct BRAF inhibition. This pathway suppression was associated with decreased tumor cell invasion, migration, and expression of epithelial-mesenchymal transition markers, alongside increased induction of late apoptosis. Furthermore, cobimetinib altered immune-related features of tumor cells by reducing expression of immune inhibitory molecules and cytokine secretion, while simultaneously enhancing expression of molecules involved in antigen presentation, such as HLA-ABC. Co-culture experiments with human fibroblasts showed that cobimetinib modulates tumor-fibroblast communication and fibroblast phenotype composition. Cobimetinib reduced the formation of specific immune-suppressive fibroblast subtypes, whereas exposure to interleukin-8 promoted their development and increased tumor cell migration. Secretome profiling confirmed that cobimetinib markedly depleted pro-tumorigenic cytokines, particularly reducing IL-8 secretion. While data provide preclinical evidence that downstream MEK inhibition alters tumor cell signaling and IL-8-associated tumor-fibroblast communication in ATC-centered models, they do not establish cobimetinib monotherapy as a replacement for clinically established BRAF/MEK combination therapies. Instead, these data support the broader therapeutic potential of MEK inhibitors as a strategy to target both tumor progression and immune evasion in aggressive endocrine malignancies.","tags":["未分化甲状腺癌","BRAF V600E","MEK抑制剂","肿瘤相关成纤维细胞","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902385","pmid":"42902385","pmcid":"PMC7906796","doi":"10.1158/2326-6066.CIR-18-0572","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902385/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"J Transl Med","journal_full":"Journal of Translational Medicine","tier":"A","if_val":9.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"临床前转化研究 · 细胞系与PDX类器官的体外及体内实验","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":25,"score_breakdown":{"clinical":2,"methodology":14,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"表观遗传药物上调NKG2D配体，并在临床前模型中增强NKG2D-CAR T细胞对神经母细胞瘤的杀伤","title_en":"Epigenetic modulation of NKG2D ligands enhances NKG2D-CAR T cell efficacy in neuroblastoma.","authors":"Navarro-Zapata A, De Santisteban MO, Regojo-Zapata RM, Ibáñez-Navarro M, Clares-Villa L, de la Hoz M, Romero A, Mestre-Durán C et al.","affiliation_highlight":"Translational Research in Pediatric Oncology, Hematopoietic Transplantation and Cell Therapy, IdiPAZ, La Paz University …","results":"","authors_conclusion":"靶向表观遗传通路可增强神经母细胞瘤细胞对NKG2D-CAR T细胞治疗的易感性，为治疗高危神经母细胞瘤提供潜在新方法。","ai_note":"摘要仅以文字称“显著”增加NKG2DL表达并改善杀伤，未报告样本量、效应量、P值或主要终点；证据限于细胞系、PDX类器官和动物模型，向临床外推有限；背景中“NKG2DL低表达与预后差相关”未在本研究验证。","pico":{"p":"神经母细胞瘤细胞系和患者来源异种移植类器官（PDXOs）；摘要未报告样本量","ic":"干预：表观遗传药物丙戊酸（VPA）和tazemetostat（TZM），联合NKG2D-CAR T细胞；对照：基础条件或未处理"},"reason":"为儿童神经母细胞瘤的NKG2D-CAR T联合表观遗传药物提供临床前概念验证；对胸外科或胸部肿瘤临床判断的直接影响有限，但可作为免疫治疗转化研究的方法学参考。","abstract_en":"BACKGROUND: Neuroblastoma (NB) is the most common extracranial solid tumor in children and is associated with high mortality despite aggressive multimodal therapies for high-risk patients. Novel treatments such as CAR T cell therapy offer promise, yet challenges persist due to immune evasion mechanisms by tumor cells. Specifically, the interaction between the natural killer group 2D (NKG2D) receptor on cytotoxic immune cells and its ligands (NKG2DL) is critical for antitumor immunity. However, the expression of NKG2DL is tightly regulated by different means, including epigenetic mechanisms. NB cells often downregulate NKG2DL expression to evade immune control, and this reduction is associated with poorer survival and worse prognosis. METHODS: The NKG2DL expression was assessed in a set of NB cell lines and patient-derived xenograft organoids (PDXOs) under basal conditions and following treatment with epigenetic drugs, valproic acid (VPA) and tazemetostat (TZM). NKG2D-CAR T cells were generated, and their proliferation, phenotype, cell-killing assays and cytokine production were performed in vitro. Cell-based assays were performed combining epigenetic drugs and NKG2D-CAR T cells in the different NB models. RESULTS: Our study revealed that NKG2DL expression in NB models and patient samples exhibited considerable heterogeneity, but it was low overall. Although NKG2DL expression does not necessarily preclude susceptibility, its downregulation may compromise the cytotoxicity of NKG2D-CAR T cells. Treatment with epigenetic drugs, VPA and TZM, significantly increased NKG2DL expression and improved NKG2D-CAR T cell-mediated killing in vitro and in vivo. CONCLUSION: This work suggests that targeting epigenetic pathways can enhance the susceptibility of NB cells to NKG2D-CAR T cell therapy, thereby providing a potential new approach to treat high-risk NB.","tags":["神经母细胞瘤","NKG2D-CAR T","表观遗传调控","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42900703","pmid":"42900703","pmcid":"","doi":"10.1126/scisignal.aed6605","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900703/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Sci Signal","journal_full":"Sci Signal","tier":"A","if_val":7.0,"zone":"JCR Q1 · 1区","warned":false,"study_type":"临床前小鼠机制研究 · 条件性基因敲除与挽救实验","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":24,"score_breakdown":{"clinical":0,"methodology":16,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"内皮PRMT5-ANGPTL4轴调控小脑抑制性突触生成与运动协调：小鼠条件性敲除研究","title_en":"A PRMT5-ANGPTL4 axis in brain endothelial cells regulates cerebellar inhibitory synaptogenesis and motor coordination.","authors":"Lu J, Zhang Y, Hao Y, Ning H, Fan Z, Hao S, Cui Y, Han Y et al.","affiliation_highlight":"State Key Laboratory of Medical Proteomics, National Center for Protein Sciences (Beijing), Beijing 102206, China.","results":"","authors_conclusion":"Together, these findings define the endothelial PRMT5-ANGPTL4 axis as a key regulator of cerebellar inhibitory circuitry and motor function, highlighting cerebrovascular mechanisms as potential therapeutic targets for motor coordination disorders.","ai_note":"非胸部肿瘤研究；摘要仅报告定性结果，无样本量、效应量、置信区间或P值；仅雄性小鼠，外推受限；“治疗靶点”为机制研究推断，尚无人体验证。分类无基础研究选项，暂归advanced。","pico":{"p":"雄性小鼠；脑内皮细胞特异性Prmt5条件性敲除模型及Angptl4敲除挽救模型（摘要未给样本量）","ic":"干预：内皮细胞特异性Prmt5缺失、Angptl4缺失；对照：摘要未明确描述"},"reason":"与胸外科/胸部肿瘤临床判断无直接关系；不改变结节、手术或围术期决策，仅提供脑血管-小脑基础机制背景。","abstract_en":"Brain vasculature is essential for central nervous system function. Here, we found a cerebrovascular signaling axis in which the arginine methyltransferase PRMT5 in endothelial cells promoted proper inhibitory synaptogenesis and motor coordination in male mice. Cerebrovascular endothelial cell-specific deletion of Prmt5 in mice led to excessive inhibitory synaptic input onto Purkinje cells and progressive motor deficits. Mechanistically, Prmt5 deficiency epigenetically increased the expression of the gene encoding the secreted angiocrine ANGPTL4 through reduced symmetric dimethylation of Arg8 in histone H3 and Arg3 in histone H4, which coincided with increased acetylation of Lys9 in histone H3, at the Angptl4 promoter. Angptl4 deletion in brain endothelium normalized inhibitory synaptic input onto Purkinje cells and partially restored motor coordination in mice with a conditional Prmt5 deficiency. Together, these findings define the endothelial PRMT5-ANGPTL4 axis as a key regulator of cerebellar inhibitory circuitry and motor function, highlighting cerebrovascular mechanisms as potential therapeutic targets for motor coordination disorders.","tags":["基础研究","小鼠","脑血管","小脑","PRMT5","ANGPTL4"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42899417","pmid":"42899417","pmcid":"","doi":"10.1002/wjs.70617","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42899417/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"World J Surg","journal_full":"WORLD JOURNAL OF SURGERY","tier":"B","if_val":2.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"述评/政策倡导性观点文章（非系统评价、无原始数据）","category":"surgery","category_label":"微创与无管化胸外科","score_total":24,"score_breakdown":{"clinical":9,"methodology":6,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"儿童外科被主张纳入全球儿童生存议程：一篇无原始数据的政策倡导性述评","title_en":"Children's Surgery: The Missing Link in the Global Child Survival Agenda.","authors":"De Costa A, Wallis L","affiliation_highlight":"Department of Sexual, Reproductive, Maternal, Child, Adolescent Health and Ageing, World Health Organization, Geneva, Sw…","results":"","authors_conclusion":"儿童外科不应被视为边缘亚专科，而应被理解为改善儿童健康结局的整合型服务中不可或缺的组成部分；全球儿童生存议程的下一阶段必须将儿童外科照护视为需要规划、充分筹资并常规监测的基本服务，将外科、麻醉、围手术期与康复照护整合进儿童健康规划，以避免可预防死亡、减少终身残疾、保护家庭免于灾难性支出，并确保各地儿童不仅能够存活而且能够茁壮成长。","ai_note":"全文为观点/倡导性述评，摘要中未提供任何原始数据、系统检索策略或结局指标，所有流行病学论断（如出生缺陷与外科可治疗疾病占残余疾病负担比例上升、结局随环境悬殊）均无量化引用；以'拐点''明确授权'等修辞推动政策议题，证据层级不足以支持因果或效果推断；信息不足，不能据此外推任何疗效或负担数值。","pico":{"p":"","ic":""},"reason":"提示胸外科／儿童外科相关的全球卫生政策语境与卫生系统能力建设议题，可作为学科发展方向与政策论证背景引用，但不提供可用于患者选择、随访决策或结节风险判断的临床证据。","abstract_en":"Global child health is at an inflection point. Under-five mortality has fallen substantially over recent decades, yet progress is slowing and preventable deaths and disability remain concentrated in low- and middle-income countries. As mortality from vaccine-preventable diseases and other infections declines, birth defects and other surgically treatable conditions account for an increasing share of the residual burden. For many children, access to timely, safe and affordable surgical, anesthesia and perioperative care is the difference between survival, disability and death. Yet these services remain insufficiently embedded in child health policy, service delivery and universal health coverage. Children's surgery should therefore be understood not as a peripheral specialty, but as an essential component of integrated services to improve child health outcomes. Congenital anomalies make this case clear. Outcomes for surgically treatable conditions differ starkly by setting, reflecting inequities in early recognition, safe referral, anesthesia, operative and postoperative care, infection prevention, and follow-up. The same services are also required for injuries, burns, surgical infections, complications of sickle cell disease and acute abdominal emergencies. Strengthening them would extend well beyond specialist surgery; it would build the capacity of health systems to respond to some of the most time-sensitive and disabling conditions affecting children. Recent World Health Assembly resolutions on operative care, universal health coverage and newborn screening provide a clear mandate for action. The next phase of the global child survival agenda must recognize children's surgical care as an essential service to be planned, adequately financed and routinely monitored. Integrating surgical, anesthesia, perioperative and rehabilitation care into child health programmes is critical to avert preventable deaths, reduce lifelong disability, protect families from catastrophic costs and ensure that children everywhere have the opportunity not only to survive but also to thrive.","tags":["儿童外科","全球儿童健康","卫生政策与全民健康覆盖","先天畸形","围手术期照护"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902391","pmid":"42902391","pmcid":"7861919","doi":"10.1155/2021/6647753","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902391/","notice_url":"","trial_url":"","pub_date":"2026-Jul-23","briefing_date":"2026-10-22","journal_abbr":"Patient Saf Surg","journal_full":"Patient Safety in Surgery","tier":"B","if_val":3.3,"zone":"JCR Q1 · 3区","warned":false,"study_type":"系统评价（PRISMA，PubMed/EMBASE 2000–2025，定性综合+NOS质量评价，未做定量合并）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":21,"score_breakdown":{"clinical":4,"methodology":15,"specialty":2,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":true,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"全部纳入研究","metric":"样本量加权平均入院白细胞计数","val":"10.26 × 10^9/L","stat":"","grounded":true,"checks":[{"num":"10.26","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"10","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"9","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"全部纳入研究","metric":"钝性创伤比例与平均白细胞计数的相关性","val":"rho = 0.775","stat":"p = 0.04","grounded":true,"checks":[{"num":"0.775","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.04","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"纳入研究合计","metric":"纳入研究数与患者数","val":"12项研究，15,658例","stat":"","grounded":true,"checks":[{"num":"12","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"15658","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"全部纳入研究","metric":"样本量加权平均入院白细胞计数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部纳入」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"全部纳入研究","metric":"钝性创伤比例与平均白细胞计数的相关性","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「全部纳入」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"纳入研究合计","metric":"纳入研究数与患者数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「纳入」无英文锚（词典未收录，宁误杀）","人群限定「合计」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"成人严重多发伤入院白细胞计数与创伤后并发症及死亡相关性的系统评价：证据仍不足以支持预后结论","title_en":"The relevance of leukocytosis in patients with severe trauma: a systematic review.","authors":"Hübner CT, van Wagenveld P, Klingebiel FK, Kalbas Y, Halvachizadeh S, Pfeifer R, Pape HC, Teuben MPJ et al.","affiliation_highlight":"Department of Traumatology, University Hospital Zurich, University of Zurich, Raemistrasse 100, Zurich, 8091, Switzerlan…","results":"最终纳入12项研究，共15,658例患者；研究间样本量加权平均入院白细胞计数为10.26 × 10^9/L；钝性创伤比例与平均白细胞计数呈正相关（rho = 0.775，p = 0.04）；肺炎与SIRS分别在3项和4项研究中报告；1项研究报告创伤后持续白细胞增高者死亡率更高。","authors_conclusion":"本综述显示创伤后白细胞计数普遍升高。尽管部分研究提示与并发症和死亡存在关联，但因异质性大且纳入研究以回顾性设计为主，现有证据不足以得出可靠的预后结论；后续研究应关注白细胞亚群尤其是中性粒细胞。","ai_note":"主要分析均为研究水平的生态学相关（样本量加权均值、Spearman秩相关），未做患者水平的效应量合并，故rho=0.775不能外推为个体风险关联；死亡率仅来自单项研究，未给出合并OR/RR及CI；未报告异质性统计量、发表偏倚评估及亚组敏感性分析；仅限英文文献；12项研究中多数为回顾性设计，暴露时点（入院vs持续白细胞增高）定义不统一。","pico":{"p":"成人多发伤患者；最终纳入12项研究，共15,658例","ic":"入院白细胞计数（暴露/指标）与创伤后并发症（SIRS、肺炎、ARDS、MODS）及死亡的关联；无对照组干预设定"},"reason":"该文提示单纯入院白细胞计数作为创伤预后标志物的证据等级偏低，可用于避免在围手术期/创伤路径中过度依赖该指标做决策，并为后续炎症标志物研究的设计（需患者水平合并、统一暴露时点）提供反面参照。","abstract_en":"BACKGROUND: Polytrauma remains a leading cause of death in individuals younger than 40 years and poses major challenges during early resuscitation and subsequent clinical management. Beyond early mortality from hemorrhage, post-traumatic inflammatory and infectious complications such as systemic inflammatory response syndrome (SIRS), acute respiratory distress syndrome (ARDS), and multiple organ dysfunction syndrome (MODS) are of increasing clinical relevance. Leukocyte count is a simple and routinely available laboratory parameter. This systematic review aimed to evaluate whether leukocyte count on admission is associated with post-traumatic complications and mortality. METHODS: A systematic review in accordance with the PRISMA guidelines was conducted. PubMed/MEDLINE and EMBASE were systematically searched for original English-language clinical studies published between January 1, 2000, and July 31, 2025, that investigated leukocyte counts following adult polytrauma. After deduplication, 2,169 records were independently screened by three investigators based on titles and abstracts. Thirty-two reports were sought for retrieval, and 12 studies were finally included. Disagreements were resolved by consensus. Data on study characteristics, patient and injury characteristics, leukocyte counts and kinetics, and clinical outcomes were extracted and qualitatively synthesized. Study quality and risk of bias were assessed using the Newcastle-Ottawa Scale. A sample-size-weighted mean admission leukocyte count was calculated from the reported study-level means, and associations were analyzed using Spearman's rank correlation. RESULTS: After subsequent screening 12 studies with overall 15,658 patients were finally included in the current review. Across all studies, leukocyte counts after trauma were elevated compared with reference values. The weighted mean leukocyte count across studies was 10.26 × 10^9/L. The proportion of blunt trauma was positively correlated with mean leukocyte count (rho = 0.775, p = 0.04). Pneumonia and SIRS were reported in three and four studies, respectively. One study reported higher mortality in patients with persistent leukocytosis after trauma. CONCLUSIONS: This review demonstrates that leukocyte counts are consistently elevated following trauma. Although some studies suggested associations with morbidity and mortality, the available evidence remains insufficient for firm prognostic conclusions because of substantial heterogeneity and the predominantly retrospective design of the included studies. Further research should focus on leukocyte subpopulations, particularly neutrophils, to improve understanding of post-traumatic immune responses and their clinical relevance.","tags":["多发伤","白细胞增多","系统评价","预后标志物","SIRS"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902020","pmid":"42902020","pmcid":"11698826","doi":"10.1088/1361-648X/acd831","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902020/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Nat Nanotechnol","journal_full":"Nat Nanotechnol","tier":"A","if_val":37.5,"zone":"JCR Q1 · 1区","warned":false,"study_type":"基础材料科学研究 · 化学气相沉积生长结合原子分辨电镜、非线性光学与第一性原理计算的表征研究，附原型器件测试（非临床研究）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":20,"score_breakdown":{"clinical":0,"methodology":12,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"2H/3R 铁电同质结忆阻器","metric":"on/off ratio","val":"∼2.6 × 10⁴","stat":"","grounded":false,"checks":[{"num":"2.6","grounded":true,"note":"数值+语境锚命中"},{"num":"10","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["10"]},{"group":"2H/3R 同质结 vs 单堆垛 α-In2Se3 器件","metric":"on/off ratio 相对提升","val":"约一个数量级","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":["10"],"semantic_passed":false,"semantic_audit":[{"group":"2H/3R 铁电同质结忆阻器","metric":"on/off ratio","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「H/3R」未在原摘要出现","人群限定「铁电同质结忆阻器」无英文锚（词典未收录，宁误杀）"]},{"group":"2H/3R 同质结 vs 单堆垛 α-In2Se3 器件","metric":"on/off ratio 相对提升","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「H/3R」未在原摘要出现","人群限定「vs」未在原摘要出现","人群限定「同质结」无英文锚（词典未收录，宁误杀）","人群限定「单堆垛」无英文锚（词典未收录，宁误杀）","人群限定「器件」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"堆垛序调控二维In2Se3铁电性：2H/3R铁电同质结的受控生长与低电压忆阻器件","title_en":"Stacking-specific two-dimensional In2Se3 for ferroelectric homojunctions.","authors":"Zheng X, Yang T, He X, Zhang W, Tsang CS, Li Y, Wong LW, Yan Z et al.","affiliation_highlight":"State Key Laboratory of High Performance Roll Materials and Composite Forming, School of Materials Science and Engineeri…","results":"2H/3R 铁电同质结忆阻器 on/off ratio ∼2.6 × 10⁴，约为单堆垛 α-In2Se3 器件的十倍；β'-In2Se3 由 2H 转 3R 堆垛时发生反铁电—顺电转变；α-In2Se3 在 3R→2H 转变时面内铁电极化消失。","authors_conclusion":"堆垛序是调控二维材料铁电性的有力结构参数，堆垛工程化的多型异质结构可作为高性能铁电电子学与存储技术的通用平台。","ai_note":"本文属于二维铁电半导体材料与神经形态器件领域，与胸部肿瘤临床问题无任何交集，不构成可用的临床证据；摘要未给出器件数量、统计样本量、良率、误差范围或统计检验，on/off 比以“∼”给出且对照器件数值未列出，“高约一个数量级”为相对描述；“有力结构参数”“通用平台”等属作者推断性表述，跨器件、跨批次可重复性信息不足。","pico":{"p":"","ic":""},"reason":"该文献与胸外科及胸部肿瘤诊疗决策无关，不能影响患者选择、随访或结节风险判断；仅可作为神经形态/类脑计算硬件的材料学背景参考，用于评估未来 AI 硬件与医学影像计算平台的底层器件进展。","abstract_en":"Two-dimensional (2D) ferroelectric semiconductors offer unique opportunities for ultrathin non-volatile memory and neuromorphic devices, yet the role of stacking order in intrinsic ferroelectric systems remains largely unexplored. Here we report the stacking-controlled growth of large-area 2D β'- and α-In2Se3 with distinct 2H and 3R configurations through chemical vapour deposition by regulating selenium kinetics and strain relaxation. By combining atomic-resolution microscopy, non-linear optical characterization and first-principles calculations, we uncover a strong correlation between stacking order and ferroelectric behaviour: β'-In2Se3 undergoes an antiferroelectric-to-paraelectric transition when switching from 2H to 3R stacking, whereas in α-In2Se3, in-plane ferroelectric polarization vanishes during the 3R-to-2H transition. We further achieve the controlled synthesis of 2H/3R ferroelectric homojunctions and directly visualize polarization-dependent interfacial potential barriers using differential phase-contrast scanning transmission electron microscopy. The engineered homojunctions exhibit switchable band alignment and tunable carrier transport, yielding memristors with significantly reduced switching voltages and an on/off ratio of ∼2.6 × 104, approximately one order of magnitude higher than devices based on single-stacking α-In2Se3. These findings establish stacking order as a powerful structural parameter for tailoring ferroelectricity in 2D materials and introduce stacking-engineered polymorphic heterogeneity as a versatile platform for high-performance ferroelectric electronics and memory technologies.","tags":["二维铁电材料","In2Se3","堆垛序","忆阻器","神经形态器件","非临床研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901148","pmid":"42901148","pmcid":"","doi":"10.1016/j.xcrm.2026.103099","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901148/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cell Rep Med","journal_full":"Cell Rep Med","tier":"A","if_val":14.0,"zone":"JCR Q1 · 1区","warned":false,"study_type":"评论/展望（非原始研究）· 针对 ADC 递送策略的评述","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":18,"score_breakdown":{"clinical":3,"methodology":1,"specialty":6,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"抗体偶联药物开发的下一个点击：解耦肿瘤定位与载荷递送并双靶向的评论","title_en":"The next click in antibody drug conjugate development.","authors":"Gupta A, Chandarlapaty S","affiliation_highlight":"Human Oncology and Pathogenesis Program, Memorial Sloan Kettering Cancer Center, New York, NY, USA.","results":"","authors_conclusion":"","ai_note":"该文为评论/展望，无原始数据；摘要仅转述 Simó 等的策略目标，未提供研究设计、样本量、终点或结果；无法评估方法学与临床价值；标题“next click”带有展望/宣传色彩；信息不足。","pico":{"p":"","ic":""},"reason":"提示 ADC 领域从传统载荷递送向定位-载荷解耦及双靶向策略演进的研发方向；为胸部肿瘤 ADC 研发背景提供参考，但不直接改变临床判断。","abstract_en":"The clinical success of antibody drug conjugates has been shaped by the promise of delivering cytotoxic payloads precisely to tumors while minimizing systemic exposure. Simó and colleagues aim to improve on conventional ADC delivery by decoupling tumor localization from payload delivery to enhance pharmacokinetics and addressing antigen heterogeneity by enabling dual targeting.","tags":["抗体偶联药物","药物递送","双靶向","评论/展望"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901318","pmid":"42901318","pmcid":"","doi":"10.1016/j.trsl.2026.10.007","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901318/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Transl Res","journal_full":"Translational Research","tier":"A","if_val":6.1,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性 mini review（state-of-the-art 综述）· 无系统检索、无纳入排除标准、无定量合成","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":18,"score_breakdown":{"clinical":3,"methodology":7,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"铁死亡与焦亡在MASLD相关心脏重构中的汇聚作用：叙述性综述与尚未验证的肝-心跨器官假说","title_en":"Convergent Ferroptosis and Pyroptosis in MASLD-Associated Cardiac Remodeling.","authors":"Gui H, Yuan X, Zhang Y","affiliation_highlight":"Department of Gastroenterology, Heilongjiang Academy of Traditional Chinese Medicine, No.","results":"","authors_conclusion":"压力超负荷心力衰竭模型的直接临床前证据显示存在经ACSL4/ALOX12/12-HETE/NLRP3轴的铁死亡向焦亡信号传导；但该级联尚未在MASLD模型或MASLD相关心脏重构患者中直接验证；应区分实验已确立的器官内机制与假说的器官间肝-心联系，并据此指出未来验证方向与证据缺口。","ai_note":"该文为叙述性mini review，未报告检索策略、文献筛选流程与质量评价，无定量合成，证据层级低；作者自认核心跨器官假说（ACSL4/ALOX12/12-HETE/NLRP3在MASLD心脏重构中的作用）在MASLD模型与患者中均未验证，故全文机制推断属外推；摘要以“convergent”框定主题但实际汇聚证据来自非MASLD的心衰模型，存在框架与证据不匹配；主题为代谢性肝病与心脏重构，与胸部肿瘤学无交集，期刊与选题均超出胸部肿瘤评审范围。","pico":{"p":"无系统纳入人群；仅引用压力超负荷心力衰竭模型的临床前证据，并以MASLD全球患病率约30%作为背景；未纳入MASLD相关心脏重构患者数据","ic":"机制暴露：铁死亡（铁依赖、脂质过氧化驱动）与焦亡（炎症小体介导、gasdermin D执行）；对照：无，非对照性综述设计"},"reason":"该文与胸外科及胸部肿瘤临床决策无直接关联，不改变任何手术选择、随访或结节风险判断；仅可作为细胞死亡通路（铁死亡、焦亡）机制背景参考，对胸部肿瘤研究设计的直接借鉴价值有限。","abstract_en":"Metabolic dysfunction-associated steatotic liver disease (MASLD) affects ∼30% of the global population and is associated with increased risks of heart failure (particularly heart failure with preserved ejection fraction), atrial fibrillation, and cardiovascular mortality. Despite well-established epidemiological links between MASLD and cardiovascular disease, the molecular pathways driving MASLD-related cardiac remodeling remain incompletely understood. This state-of-the-art mini review examines ferroptosis and pyroptosis as potentially convergent regulated cell-death pathways relevant to both the steatotic liver and the remodeling heart. Ferroptosis is an iron-dependent, lipid peroxidation-driven cell death that mediates hepatocyte injury in experimental MASLD and contributes to cardiomyocyte injury under cardiac stress. Pyroptosis is an inflammasome-mediated pro-inflammatory cell death executed by gasdermin D, which amplifies tissue inflammation in hepatic and cardiac disease. Direct preclinical evidence from a pressure-overload heart-failure model demonstrates ferroptosis-to-pyroptosis signaling through the ACSL4/ALOX12/12-HETE/NLRP3 axis; however, this cascade has not yet been directly validated in MASLD models or in patients with MASLD-associated cardiac remodeling. We therefore distinguish experimentally established within-organ mechanisms from hypothesized interorgan liver-heart links, highlight shared regulators including reactive oxygen species, the cGAS/STING pathway, and the NRF2 hub, and discuss translational strategies and evidence gaps that should guide future validation.","tags":["铁死亡","焦亡","MASLD","心脏重构","叙述性综述","非胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901278","pmid":"42901278","pmcid":"","doi":"10.1016/j.rmed.2026.109238","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901278/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Respir Med","journal_full":"RESPIRATORY MEDICINE","tier":"B","if_val":3.3,"zone":"JCR Q2 · 3区","warned":false,"study_type":"叙述性综述（非系统评价，无检索策略与定量合成）· 呼吸力学与床旁超声监测","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":17,"score_breakdown":{"clinical":5,"methodology":9,"specialty":3,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"膈肌超声辅助PEEP滴定用于COPD动态肺过度充气患者：叙述性综述，尚未确立DTF目标值或临床获益","title_en":"Diaphragm Ultrasound-Guided PEEP Titration in COPD with Dynamic Hyperinflation.","authors":"Quiñones P, Sepúlveda P, Arriagada R, Cappuccio E, Rocco PRM, Battaglini D","affiliation_highlight":"Unidad de Paciente Crítico - Adulto, Hospital San Juan de Dios, La Serena, Chile; Escuela de Kinesiología, Facultad de S…","results":"","authors_conclusion":"该综述检视了以膈肌超声补充COPD动态肺过度充气患者PEEP调整的生理学基础、现有证据与局限；在该人群中尚未确立DTF目标值，也未确立超声引导PEEP滴定的临床获益。","ai_note":"信息不足：摘要未给出检索数据库、检索时间、纳入排除标准、文献数量及任何原始数据或定量合成结果，属叙述性综述，证据等级有限；文中“无DTF目标值、无临床获益”系作者定性总结，并非来自对照研究的结果数据；主题为COPD呼吸支持，与胸部肿瘤诊疗链关联薄弱，归入ai_digital仅为技术评估层面的近似归类，存在分类偏移。","pico":{"p":"COPD合并动态肺过度充气、接受有创机械通气（IMV）或无创通气（NIV）的患者；叙述性综述，未报告样本量","ic":"以膈肌超声（膈肌厚度、吸气增厚分数DTF）辅助PEEP/EPAP滴定，对照为常规经验性PEEP调节或临床反应评估；未设对照组、无定量比较"},"reason":"该文不涉及肿瘤人群或抗肿瘤决策，对可切除/晚期胸部肿瘤的治疗选择、结节风险判断与随访策略无直接影响；仅可为合并重度COPD、需机械通气的胸外科围术期呼吸管理提供背景性参考，不构成改变临床判断的证据。","abstract_en":"Chronic obstructive pulmonary disease (COPD) is characterized by airflow limitation, dynamic hyperinflation, and intrinsic positive end-expiratory pressure (iPEEP), which increase inspiratory threshold load and complicate ventilatory support. Non-invasive ventilation (NIV) is the preferred initial ventilatory support for COPD exacerbations complicated by acute or acute-on-chronic respiratory acidosis, while invasive mechanical ventilation (IMV) may be required when NIV fails. External PEEP may reduce the inspiratory threshold load in patients with expiratory flow limitation, although excessive levels can increase lung volume and compromise hemodynamics. During IMV, PEEP adjustment requires assessment of respiratory mechanics, expiratory flow, hyperinflation, and cardiovascular tolerance. During NIV, where iPEEP cannot usually be measured directly, expiratory positive airway pressure (EPAP) should be adjusted according to clinical response, patient-ventilator interaction, and signs of excessive lung inflation. Inappropriate ventilatory assistance may also contribute to diaphragm dysfunction. Diaphragm ultrasound allows bedside assessment of muscle thickness and inspiratory thickening fraction (DTF), although these measurements are influenced by ventilatory assistance, respiratory drive, and lung volume. This review examines the physiological basis, available evidence, and limitations of using diaphragm ultrasound to complement PEEP adjustment in patients with COPD and dynamic hyperinflation. No DTF target or clinical benefit of ultrasound-guided PEEP titration has been established in this population.","tags":["COPD","动态肺过度充气","膈肌超声","PEEP滴定","机械通气","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901821","pmid":"42901821","pmcid":"","doi":"10.1016/j.trecan.2026.09.007","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901821/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Trends Cancer","journal_full":"Trends Cancer","tier":"C","if_val":21.6,"zone":"JCR Q1 · 未收录","warned":false,"study_type":"综述/观点文章 · 非原始研究（无系统检索与定量合成）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":16,"score_breakdown":{"clinical":6,"methodology":5,"specialty":5,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肿瘤宏观环境作为癌症代谢研究前沿的观点综述","title_en":"The tumor macroenvironment as cancer metabolism's next frontier.","authors":"Grenell AB, Rowles JL, Fowle-Grider R, Cao Y, Shriver LP, Patti GJ","affiliation_highlight":"Department of Chemistry, Washington University in St.","results":"","authors_conclusion":"A deeper understanding of these changes may reveal previously unrecognized signatures of disease and unexplored opportunities for therapeutic intervention.","ai_note":"非原始研究，无样本量、对照、终点及统计结果；属概念性综述，结论为未来研究方向，无法评估方法学严谨性；未提供胸部肿瘤特异性证据。","pico":{"p":"","ic":""},"reason":"为理解肿瘤系统性代谢重编程提供概念框架，可能影响未来胸部肿瘤代谢标志物与治疗靶点研究选题；不直接改变当前临床决策。","abstract_en":"The deregulated utilization of nutrients by tumors, first observed over a century ago, is recognized as a hallmark of cancer and continues to be exploited clinically to image neoplastic disease. Despite this historic focus on cancer cells and, more recently, their neighbors, metabolic reprogramming is not limited to the tumor microenvironment. Tumors also have the capacity to rewire the metabolism of cells throughout the body, including those at distant sites, often referred to as the tumor macroenvironment. Alterations in the metabolism of noncancerous tissues outside the local tumor ecosystem are gaining attention, but their origins and consequences remain incompletely defined. A deeper understanding of these changes may reveal previously unrecognized signatures of disease and unexplored opportunities for therapeutic intervention.","tags":["肿瘤代谢","肿瘤宏观环境","综述观点","转化研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42902226","pmid":"42902226","pmcid":"12817985","doi":"10.1093/ofid/ofag008","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902226/","notice_url":"","trial_url":"","pub_date":"2026-Jul-23","briefing_date":"2026-10-22","journal_abbr":"BMC Infect Dis","journal_full":"BMC infectious diseases","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（Case report）· 描述性","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":11,"score_breakdown":{"clinical":3,"methodology":3,"specialty":5,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"病例（80岁男性NSCLC）","metric":"滑膜液白细胞计数","val":"87,000/µL","stat":"","grounded":true,"checks":[{"num":"87000","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"病例（80岁男性NSCLC）","metric":"滑膜液中性粒细胞比例","val":"95%","stat":"","grounded":true,"checks":[],"mi thors_conclusion":"巴西诺卡菌可在无明确环境暴露的免疫抑制患者中引起包括化脓性关节炎在内的播散性肌肉骨骼感染；慢性肾病患者标准一线治疗可能禁忌，早期菌种鉴定与药敏指导治疗至关重要，尤其需注意碳青霉烯耐药可能；经验性碳青霉烯治疗在巴西诺卡菌可能失败，肾功能不全缩窄治疗选择，及时鉴定与药敏导向治疗直接决定处理，尤其当晚期恶性肿瘤进一步限制治疗时","ai_note":"单例报告无对照、无预设终点与系统随访；'临床改善'为主观描述且患者仍住院，缺乏客观疗效判定；“经验性碳青霉烯可能失败”仅基于单株药敏，无法外推为普遍规律；将晚期恶性肿瘤作为治疗受限原因属推测性关联，信息不足","pico":{"p":"1例80岁男性，患非小细胞肺癌腺癌、COPD、慢性肾病3b期；表现为左上肢及右下肢难治性软组织感染，并出现右膝积液","ic":"无对照；干预包括右膝关节镜冲洗、清创及全滑膜切除，多次介入影像引导下引流，以及头孢曲松+利奈唑胺+米诺环素长期联合抗感染（因肾功能限制，TMP-SMX与氨基糖苷类相对禁忌）"},"reason":"提示晚期肺癌合并肾功能不全患者可出现少见播散性诺卡菌感染，为免疫抑制宿主软组织/关节感染的鉴别诊断与药敏导向治疗提供个案参照；不改变常规诊疗决策","abstract_en":"BACKGROUND: Nocardia brasiliensis is classically associated with localized cutaneous infection and is a rare cause of disseminated disease. Septic arthritis due to Nocardia species is atypical and has rarely been reported without antecedent trauma. We present a case of N. brasiliensis septic arthritis in a patient with active solid organ malignancy. CASE PRESENTATION: An 80-year-old male with non-small cell lung adenocarcinoma, chronic obstructive pulmonary disease, and chronic kidney disease stage 3b presented with refractory soft tissue infections of the left upper and right lower extremities despite prior incision and drainage and oral antibiotics. Hospital course was complicated by progressive right knee effusion. Synovial fluid analysis demonstrated 87,000 white blood cells per microliter, 95% neutrophils, glucose less than 20 mg/dL, and no crystals. Nocardia brasiliensis was cultured from multiple noncontiguous sites, including the left upper extremity abscess, right knee synovial fluid, and right lower extremity lesions. Susceptibility testing demonstrated a broad antimicrobial profile but resistance to imipenem and ciprofloxacin. Trimethoprim-sulfamethoxazole and aminoglycosides were relatively contraindicated due to renal function. The patient required right knee arthroscopy with irrigation, debridement, and complete synovectomy, multiple interventional radiology-guided drainages, and prolonged combination antimicrobial therapy with ceftriaxone, linezolid, and minocycline. His course was further complicated by persistent encephalopathy and severe malnutrition requiring enteral nutrition. At the time of reporting, the patient demonstrated clinical improvement of cutaneous and musculoskeletal lesions but remained hospitalized for non-infectious complications. CONCLUSIONS: This case highlights that Nocardia brasiliensis can cause disseminated musculoskeletal infection including septic arthritis in immunocompromised patients without clear environmental exposure. In patients with chronic kidney disease, standard first-line therapies may be contraindicated, making early species identification and susceptibility-guided therapy essential, particularly given the potential for carbapenem resistance. The central lesson is that empiric carbapenem therapy may fail in N. brasiliensis and that renal impairment narrows treatment options, so timely identification and susceptibility-directed therapy directly determine management, particularly when advanced malignancy further constrains care.","tags":["诺卡菌","化脓性关节炎","病例报告","晚期肺癌","免疫抑制感染","药敏指导治疗"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902019","pmid":"42902019","pmcid":"122734","doi":"10.1021/jacs.1c10359","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902019/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Nat Nanotechnol","journal_full":"Nat Nanotechnol","tier":"A","if_val":37.5,"zone":"JCR Q1 · 1区","warned":false,"study_type":"基础化学/高分子材料实验研究（非临床研究）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":8,"score_breakdown":{"clinical":0,"methodology":0,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"
