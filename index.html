l of Integrated Traditional Chinese and Western Medicine & Hunan Academy of Chinese Medicine, Ch…","results":"UNLABELLED: Smoking is the major environmental risk factor for lung cancer; however, the molecular basis underlying individual susceptibility to smoking-related carcinogenesis remains incompletely understood. This study …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"UNLABELLED: Smoking is the major environmental risk factor for lung cancer; however, the molecular basis underlying individual susceptibility to smoking-related carcinogenesis remains incompletely understood. This study aimed to identify smoking-specific molecular signatures associated with lung cancer development and to investigate their potential biological mechanisms. Transcriptomic datasets from smokers with and without lung cancer, as well as never-smokers with lung cancer, were analyzed using differential expression analysis and weighted gene co-expression network analysis (WGCNA). Candidate genes were further evaluated using machine learning algorithms, Mendelian randomization (MR), single-cell transcriptomic analysis, molecular docking, and in vitro validation. A total of 16 smoking-specific lung cancer-related genes were identified, which were mainly enriched in cytochrome P450-mediated xenobiotic metabolism, oxidoreductase activity, and chemical carcinogenesis-related pathways. Machine learning analysis established a four-gene signature comprising CYP1A1, CYP1B1, HLA-DRA, and IDO1, among which CYP1A1 and CYP1B1 exhibited substantial contributions to lung cancer classification. MR analysis further demonstrated that genetically predicted expression levels of CYP1A1 and CYP1B1 were positively associated with lung cancer risk. Single-cell transcriptomic analysis revealed that CYP1A1 and CYP1B1 were predominantly expressed in epithelial cells. Molecular docking analysis suggested potential interactions between CYP1A1/CYP1B1 proteins and tobacco-related carcinogens. Furthermore, cigarette smoke extract treatment significantly increased CYP1A1 and CYP1B1 expression at both the mRNA and protein levels in BEAS-2B bronchial epithelial cells. Collectively, these findings indicate that CYP1A1 and CYP1B1 may contribute to smoking-related lung carcinogenesis through regulation of carcinogen metabolism and oxidative stress responses and may serve as potential biomarkers for identifying individuals at increased risk of smoking-associated lung cancer. SUPPLEMENTARY INFORMATION: The online version contains supplementary material available at https://doi.org/10.1007/s13205-026-05099-x.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890300","pmid":"42890300","pmcid":"PMC13671274","doi":"10.7759/cureus.116285","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890300/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-18","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Clinical Characteristics and Delays in the Care Pathway of Patients With Lung Cancer Treated at a Public Hospital in Costa Rica, 2015-2020.","title_en":"Clinical Characteristics and Delays in the Care Pathway of Patients With Lung Cancer Treated at a Public Hospital in Costa Rica, 2015-2020.","authors":"Alvarado-Prado R, Ortiz-Barboza A, Blanco-Saborío A, Arguello-Méndez JC, Zavaleta-Monestel E","affiliation_highlight":"Health Promotion and Epidemiology, Universidad de Costa Rica, San Jose, CRI.","results":"INTRODUCTION: Delays in the lung cancer care pathway and limited access to molecular biomarkers, targeted therapies, and immunotherapy may affect diagnosis, treatment opportunities, and survival. This study described the…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Delays in the lung cancer care pathway and limited access to molecular biomarkers, targeted therapies, and immunotherapy may affect diagnosis, treatment opportunities, and survival. This study described the clinical profile, care pathway delays, biomarker testing, treatment access, and survival of patients with primary lung cancer treated at a public hospital in Costa Rica. METHODS: We conducted a retrospective observational study based on medical record review. Adult patients with a pathological diagnosis of primary lung cancer treated at a public tertiary-level hospital in Costa Rica between 2015 and 2020 were included (n=223). Clinical, sociodemographic, and care process variables were analyzed, including symptoms at the time of consultation, smoking history, diagnostic and therapeutic time intervals, molecular biomarker testing, treatments received, and survival from the first care episode related to suspected lung cancer until death or the end of follow-up. RESULTS: The most frequent symptoms before diagnosis were cough (n=126; 56.50%), dyspnea (n=110; 49.33%), and weight loss (n=98; 43.95%). The median time between documented suspicion and pathological diagnosis was 34 days (IQR: 21-73; n=213), although extreme values exceeding 1000 days were observed. Molecular biomarker testing was recorded in 106 patients (47.53%), and targeted therapy or immunotherapy was documented in 45 patients (30.00%). Among patients who received targeted therapy or immunotherapy, 29 (64.44%) accessed these treatments through administrative requests to higher institutional authorities outside the standard care protocol. The estimated five-year survival from the first care episode related to suspected lung cancer was 1.9% (95% CI: 0.5-5.1). CONCLUSIONS: This cohort showed frequent diagnostic delays, high variability in care pathway intervals, limited access to molecular biomarkers and innovative therapies, and low five-year survival from the first care episode related to suspected lung cancer. These findings support the need to strengthen suspicion, referral, timely diagnosis, and equitable access to diagnostic technologies and therapeutic alternatives for patients with lung cancer.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890070","pmid":"42890070","pmcid":"PMC13672012","doi":"10.3389/fonc.2026.1934583","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890070/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Association of dynamic changes in platelet-to-lymphocyte ratio during chemotherapy with survival in patients with non-small cell lung cancer.","title_en":"Association of dynamic changes in platelet-to-lymphocyte ratio during chemotherapy with survival in patients with non-small cell lung cancer.","authors":"Xu T, Wu Z, Li J, Wang L, Weng B, Chen L, Chen X, Zhu Q et al.","affiliation_highlight":"Department of Epidemiology and Health Statistics, School of Public Health, Fujian Medical University, Fuzhou, China.","results":"BACKGROUND: Inflammatory markers have been reported to be associated with outcomes in non-small cell lung cancer (NSCLC). However, whether early treatment-related changes in these markers provide additional prognostic in…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Inflammatory markers have been reported to be associated with outcomes in non-small cell lung cancer (NSCLC). However, whether early treatment-related changes in these markers provide additional prognostic information remains unclear. This study evaluated the association between dynamic changes in peripheral blood inflammatory markers during chemotherapy and survival outcomes in patients with NSCLC. METHODS: We retrospectively analyzed 479 patients with NSCLC who received chemotherapy. Changes in lymphocyte, platelet, and neutrophil counts, as well as the neutrophil-to-lymphocyte ratio and platelet-to-lymphocyte ratio (PLR), were calculated as absolute differences (D-values) between baseline measurements obtained before the first chemotherapy session and post-chemotherapy measurements obtained within 7 days after the first session. Overall survival (OS) was assessed using Kaplan-Meier analysis and Cox proportional hazards models. Additional Cox models were used to examine the association of PLR D-value with OS after accounting for baseline PLR and clinical covariates. A prognostic nomogram was constructed as an exploratory risk-estimation model. RESULTS: Greater changes in the evaluated hematological markers were associated with shorter OS in Kaplan-Meier analysis. In the primary multivariable Cox regression, high PLR D-value was associated with shorter OS (hazard ratio, 1.422; 95% confidence interval, 1.001-2.020; P = 0.049), together with sex, anemia status, and tumor extent. After adjustment for baseline PLR and clinical covariates, however, PLR D-value was no longer significantly associated with OS when analyzed either as a continuous variable (HR per 50-unit increase, 1.010; 95% CI, 0.947-1.078; P = 0.762) or using the original high/low classification (HR, 1.31; 95% CI, 0.91-1.89; P = 0.145). The nomogram had an apparent C-index of 0.630 and an optimism-corrected C-index of 0.618 after 1,000 bootstrap resamples. CONCLUSIONS: Greater changes in PLR during chemotherapy were associated with shorter OS in the primary categorical analysis. However, this association was attenuated after baseline PLR and clinical factors were taken into account, indicating that the additional prognostic contribution of PLR D-value may be limited. The nomogram should be considered exploratory and requires external validation before clinical application.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42890051","pmid":"42890051","pmcid":"PMC13672036","doi":"","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890051/","notice_url":"","trial_url":"","pub_date":"2025-Apr","briefing_date":"2026-10-18","journal_abbr":"Tanaffos","journal_full":"Tanaffos","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Galactooligosaccharides Suppress the Development of Biofilm in the Presence of Blood Polymorphonuclear Cells of Non-Small Cell Lung Cancer (NSCLC) Patients: A Pilot Study.","title_en":"Galactooligosaccharides Suppress the Development of Biofilm in the Presence of Blood Polymorphonuclear Cells of Non-Small Cell Lung Cancer (NSCLC) Patients: A Pilot Study.","authors":"Nomani M, Salimi B, Varahram M, Jamaati H, Mortaz E","affiliation_highlight":"Clinical Tuberculosis and Epidemiology Research Center, National Research Institute of Tuberculosis and Lung Diseases(NR…","results":"BACKGROUND: Bacterial biofilms pose a significant healthcare challenge due to their robust resistance to antibiotics and their involvement in various diseases, including cancer and infectious conditions. Biofilms hinder …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Bacterial biofilms pose a significant healthcare challenge due to their robust resistance to antibiotics and their involvement in various diseases, including cancer and infectious conditions. Biofilms hinder the antimicrobial activity of polymorphonuclear leukocytes (PMNs) by restricting their penetration through the extracellular matrix. With the rise of antimicrobial resistance, non-antibiotic strategies are gaining attention. Galacto-oligosaccharides (GOS) have been investigated for their potential to inhibit bacterial growth. This study investigates the impact of GOS on the biofilm development of GFP-labelled Staphylococcus aureus (GFP-SA) and Pseudomonas aeruginosa (GFP-PA) in the presence of blood PMNs from patients with non-small-cell lung cancer (NSCLC) and healthy controls.Materials and Methods: Bacterial biofilms were investigated in the presence or absence of PMNs isolated from the blood of 12 NSCLC patients and 3 healthy controls (HC), with the inclusion of GOS. These PMNs were incubated with GFP-SA or GFP-PA biofilms and exposed to various concentrations of GOS (2.5%, 5%, 10%, 15%, and 20%) for 24 hours in a microplate setting. The progress of bacterial biofilm was quantified using the crystal violet assay. RESULTS: GOS itself, with bacteria at high concentrations (10%, 15%, and 20%), suppressed biofilm formation. PMNs of NSCLC patients show higher biofilm formation than in the absence of PMNs. CONCLUSION: Based on our findings, PMNs in NSCLC patients may disrupt the natural balance of bacteria in the lungs, potentially leading to an overgrowth of biofilm-forming bacteria. GOS are known to influence immune function and may improve the ability of PMNs to fight infections. Consequently, it is proposed that GOS could enhance the ability of PMNs to phagocytose bacterial biofilms and counteract the negative effects of cancerous PMNs on biofilm formation. However, further research is needed to confirm whether GOS can effectively manage bacterial biofilms in lung cancer patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889733","pmid":"42889733","pmcid":"PMC13670921","doi":"10.3389/fmed.2026.1950636","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889733/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Med (Lausanne)","journal_full":"Frontiers in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Case Report: Synchronous double primary male breast cancer and non-small cell lung cancer: diagnostic confirmation and multidisciplinary management.","title_en":"Case Report: Synchronous double primary male breast cancer and non-small cell lung cancer: diagnostic confirmation and multidisciplinary management.","authors":"Zhang Y, Cao L, Zheng Y, Yang Y, Guan X, Zheng X, Yang P, Zhu W et al.","affiliation_highlight":"Department of Oncology, Jiangsu Province (Suqian) Hospital, Suqian, Jiangsu, China.","results":"BACKGROUND: Male breast cancer (MBC) is rare, accounting for approximately 1% of all breast cancers. When MBC is diagnosed simultaneously with a second primary lung cancer, treatment planning becomes particularly complex…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Male breast cancer (MBC) is rare, accounting for approximately 1% of all breast cancers. When MBC is diagnosed simultaneously with a second primary lung cancer, treatment planning becomes particularly complex because diagnostic certainty, technical resectability, competing treatment windows, and radiotherapy safety must all be considered. CASE PRESENTATION: We report a 72-year-old man who was synchronously diagnosed with left invasive ductal breast carcinoma and right lower lobe poorly differentiated non-small cell lung cancer (NSCLC). The breast cancer was staged as pT3N2aM0, AJCC 8th edition stage IIIA, with strong ER/PR expression and HER2 nonamplification. The lung lesion was pathologically diagnosed as poorly differentiated NSCLC without definitive glandular, squamous, or neuroendocrine differentiation and was staged as cT3N0M0, AJCC 8th edition stage IIB. Although stage IIB NSCLC is usually evaluated for surgery, this tumor closely involved the right lower lobe pulmonary vessels and bronchial structures, and thoracic surgeons considered upfront radical resection technically unsafe because of the risks of hemorrhage, extended resection, impaired blood supply to the remaining lobes, and loss of pulmonary function. After multidisciplinary team (MDT) discussion, the patient underwent left modified radical mastectomy, adjuvant AC-T chemotherapy, and simultaneous postmastectomy radiotherapy to the left chest wall/regional nodes with definitive radiotherapy to the right lung lesion plus concurrent cisplatin. Imaging shortly after radiotherapy showed marked shrinkage of the right lung lesion, but subsequent CT and liver MRI suggested systemic progression with multiple hepatic lesions. The patient declined liver biopsy, received one cycle of vinorelbine plus cisplatin with Endostar, discontinued further treatment, and died of liver failure in March 2026. CONCLUSION: This case illustrates that therapeutic prioritization in synchronous double primary cancers should not be determined solely by TNM stage or chronological order of diagnosis. Instead, treatment decisions should integrate pathological distinction, tumor biology, anatomical treatability, technical resectability, curative potential, competing treatment windows, and short-term clinical threat. In selected patients, simultaneous postmastectomy radiotherapy and definitive lung radiotherapy may be feasible when supported by MDT consensus, dosimetric review, and close toxicity monitoring.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889196","pmid":"42889196","pmcid":"PMC13668746","doi":"10.3389/fonc.2026.1898779","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889196/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Survival and prognostic factors analysis of carbon ion radiotherapy for limited-stage small cell lung cancer.","title_en":"Survival and prognostic factors analysis of carbon ion radiotherapy for limited-stage small cell lung cancer.","authors":"Liang X, Gong Q, Zhang Y, Tian L, Zhao X, Wang B, Li Z, Li P et al.","affiliation_highlight":"School of Public Health, Gansu University of Chinese Medicine, Lanzhou, Gansu, China.","results":"OBJECTIVE: To investigate the clinical efficacy, safety and prognostic influencing factors of carbon ion radiotherapy (CIRT) in patients with limited-stage small-cell lung cancer (LS-SCLC). METHODS: The clinical data of …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To investigate the clinical efficacy, safety and prognostic influencing factors of carbon ion radiotherapy (CIRT) in patients with limited-stage small-cell lung cancer (LS-SCLC). METHODS: The clinical data of 39 patients with LS-SCLC who received CIRT from June 2020 to August 2026 were retrospectively analyzed. Survival outcomes and adverse reactions were evaluated, and Cox regression was used to analyze prognostic factors. RESULTS: All patients completed the treatment. The 3-month objective response rate (ORR) was 64.10%. The 1- and 2-year local control rates were both 91.2%. The 1- and 2-year overall survival (OS) rates were 91.65% and 62.45%, with a median OS of 44 months. The 1- and 2-year progression-free survival (PFS) rates were 72.00% and 47.77%, with a median PFS of 24 months. Serum levels of NSE, CYFRA21-1, SCC and CEA decreased significantly after treatment. Acute treatment-related adverse reactions were mainly grade I-II and could be relieved after symptomatic treatment. Stratified Cox regression indicated that KPS score was an independent protective factor for OS. Univariate analysis suggested that the magnitude of post-treatment reduction in SCC and CYFRA21-1 was potentially associated with survival outcomes. CONCLUSION: CIRT achieves favorable local tumor control with low acute radiotherapy-related toxicity, and can serve as an alternative therapeutic option for LS-SCLC. This is a single-center, small-sample retrospective study, and the conclusions regarding efficacy and prognosis need to be further verified in larger-sample cohorts.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42888981","pmid":"42888981","pmcid":"PMC13668514","doi":"10.3389/fphar.2026.1878253","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888981/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Pharmacol","journal_full":"Frontiers in pharmacology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Early disease control with a biochemical response to aumolertinib after postoperative recurrence of EGFR-Mutant stage IIIA lung adenocarcinoma after icotinib, with EGFR T790M detected at recurrence: a Case Report.","title_en":"Early disease control with a biochemical response to aumolertinib after postoperative recurrence of EGFR-Mutant stage IIIA lung adenocarcinoma after icotinib, with EGFR T790M detected at recurrence: a Case Report.","authors":"Niu Z, Zhu Y, Zhou Y, Xu Y, Jin L, Shen Q","affiliation_highlight":"Huzhou Central Hospital, The Affiliated Central Hospital of Huzhou Normal University, Huzhou, Zhejiang, China.","results":"BACKGROUND: Epidermal growth factor receptor tyrosine kinase inhibitors (EGFR-TKIs) are a standard treatment for EGFR-mutant non-small cell lung cancer (NSCLC). However, acquired resistance commonly develops after treatm…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Epidermal growth factor receptor tyrosine kinase inhibitors (EGFR-TKIs) are a standard treatment for EGFR-mutant non-small cell lung cancer (NSCLC). However, acquired resistance commonly develops after treatment with first- or second-generation EGFR-TKIs. Aumolertinib, a third-generation EGFR-TKI, has demonstrated efficacy in tumors harboring the EGFR exon 20 T790M resistance mutation. CASE PRESENTATION: A 57-year-old man with stage IIIA lung adenocarcinoma and a history of hypertension and long-term smoking underwent thoracoscopic lobectomy with intrapulmonary lymph node dissection. Postoperative molecular testing identified an EGFR exon 19 deletion, and adjuvant oral icotinib (375 mg/d) was initiated. After treatment discontinuation, disease recurrence was detected on PET-CT involving the right hilar lymph nodes and a right pleural/subpleural lesion, which was confirmed by biopsy. Repeat molecular testing revealed concurrent EGFR exon 19 deletion and EGFR exon 20 T790M mutation. After 1 month of aumolertinib treatment, the target lesion decreased in size from 24 to 23 mm and was assessed as stable disease according to RECIST version 1.1, whereas the serum CEA level decreased from 24.19 to 4.35 ng/mL, indicating early disease control with a biochemical response. CONCLUSION: This case demonstrates early disease control and a biochemical response to aumolertinib treatment in recurrent NSCLC with an EGFR exon 20 T790M mutation detected at recurrence. It also highlights the importance of repeat molecular testing to guide therapeutic decisions.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888403","pmid":"42888403","pmcid":"8116465","doi":"10.1007/s40121-021-00433-7","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888403/","notice_url":"","trial_url":"","pub_date":"2026-Jul-22","briefing_date":"2026-10-18","journal_abbr":"BMC Cancer","journal_full":"BMC CANCER","tier":"B","if_val":4.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Real-world efficacy and prognostic factor analysis of tislelizumab versus sintilimab in advanced non-small cell lung cancer.","title_en":"Real-world efficacy and prognostic factor analysis of tislelizumab versus sintilimab in advanced non-small cell lung cancer.","authors":"Liu Q, Zhu X, Xie Y, Gu Y, Shen L","affiliation_highlight":"Department of Pharmacy, The First Affiliated Hospital of Dali University, Dali, China.","results":"BACKGROUND: Tislelizumab and Sintilimab are commonly used immunotherapy drugs in clinical practice. Only a portion of advanced NSCLC patients achieve sustained remission and long-term survival through ICI immunotherapy, …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Tislelizumab and Sintilimab are commonly used immunotherapy drugs in clinical practice. Only a portion of advanced NSCLC patients achieve sustained remission and long-term survival through ICI immunotherapy, while others experience disease progression post-treatment. Selecting appropriate clinical therapies and predicting treatment efficacy remain significant challenges in clinical practice. By examining the clinical efficacy and safety of tislelizumab and sintilimab combined with chemotherapy in advanced NSCLC patients within real-world settings, and analyzing prognostic factors, this study aims to provide reference for clinical treatment decisions and prognosis assessment. MATERIALS AND METHODS: A retrospective analysis of clinical data from 212 patients with advanced NSCLC treated with the combination of tislelizumab or sintilimab plus chemotherapy in The First Affiliated Hospital of Dali University between March 1, 2022, and December 31, 2024. Patients were divided into the tislelizumab group (n = 124) and the sintilimab group (n = 88) based on the administered drug. Objective response rate (ORR), disease control rate (DCR), progression-free survival (PFS), and overall survival (OS) were evaluated in both groups. Kaplan-Meier methods were used to plot PFS and OS survival curves. Univariate analysis was performed using the Log-rank test, and Cox regression models were employed to identify independent prognostic factors for PFS and OS. RESULTS: The median progression-free survival (mPFS) in the tislelizumab group and the sintilimab group was 14.0 months (95% CI: 11.79-16.21) and 7.0 months (95% CI: 4.31-9.69), respectively (P = 0.005). The difference in mPFS between the two groups was statistically significant. The median overall survival (mOS) was 27.0 months (95% CI: 20.03-33.97) and 24.0 months (95% CI: 13.85-34.15) (P = 0.113), with no statistically significant difference in mOS between groups. ORR was 39.52% versus 18.18% (P < 0.001), showing a statistically significant difference; DCR was 66.13% versus 70.54% (P = 0.506), with no statistically significant difference. After adjustment for confounders, multivariable Cox regression revealed no significant differences between the two agents for PFS (HR = 1.128, 95% CI 0.596-2.133, P = 0.712) or OS (HR = 0.664, 95% CI 0.378-1.165, P = 0.153). ADR occurrence showed a borderline association with improved OS (HR = 0.569, P = 0.093), but was not statistically significant. ALI, PNI, anti-angiogenic combination, and treatment line were not independent prognostic factors (all P > 0.05). CONCLUSION: In real-world clinical settings, tislelizumab combined with chemotherapy may bring potential improvements in objective response rate and progression-free survival in the short term for patients with advanced NSCLC. Nevertheless, sintilimab and tislelizumab exert comparable long-term survival benefits when used in combination with chemotherapy. After adjusting for confounding factors via multivariable regression analysis, no significant survival differences were confirmed between the two treatment regimens. Further prospective clinical studies with longer follow-up are required to verify the above conclusions.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42887442","pmid":"42887442","pmcid":"","doi":"10.1016/j.ctarc.2026.101479","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42887442/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Cancer Treat Res Commun","journal_full":"Cancer treatment and research communications","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Real-world analysis of treatments, healthcare costs, and overall survival among patients with metastatic non-small cell lung cancer by molecular biomarker testing approach.","title_en":"Real-world analysis of treatments, healthcare costs, and overall survival among patients with metastatic non-small cell lung cancer by molecular biomarker testing approach.","authors":"Wiedower JA, Stockl KM, Tucker J, Forbes SP, Zhang N, Clemens K, Certa JM, Morin P et al.","affiliation_highlight":"Guardant Health, Inc., 505 Penobscot Dr, Redwood City, CA, 94063, USA.","results":"PURPOSE: To evaluate biomarker-targeted therapy utilization, healthcare costs, and overall survival (OS) with comprehensive genomic profiling (CGP), small panel, or no molecular testing for patients with metastatic non-s…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: To evaluate biomarker-targeted therapy utilization, healthcare costs, and overall survival (OS) with comprehensive genomic profiling (CGP), small panel, or no molecular testing for patients with metastatic non-small cell lung cancer (mNSCLC). PATIENTS AND METHODS: This retrospective claims analysis identified patients with newly diagnosed mNSCLC (index date) from 08/01/2020-12/31/2022, using the Optum Labs Data Warehouse. Patients were grouped by first molecular testing approach: 1) CGP (>50 genes); 2) small panel (individual gene or ≤50 gene panel); or 3) no molecular testing. Post-diagnosis outcomes assessed during variable follow-up included biomarker-targeted therapy use, healthcare costs per patient per month (PPPM) during the first 180 days, and OS. RESULTS: Among 8783 patients identified, the molecular testing approach consisted of 41.4% CGP, 30.3% small panel, 23.4% no testing, and 4.9% unassigned. For CGP, the specimen type was 40.6% blood, 37.2% tissue, 2.8% blood and tissue, and 19.4% undefined. Use of biomarker-targeted therapy was higher with CGP than small panel testing (12.4%vs. 7.7%, P < 0.001). In an exploratory analysis, biomarker-targeted therapy use was higher with blood vs. tissue CGP (14.3%vs. 11.2%, P = 0.01). Among treated patients, adjusted OS did not differ significantly for CGP and small panel testing (HR 1.03, 95% CL 0.94 to 1.12, P = 0.58). Among treated patients, mean total healthcare costs PPPM were similar between CGP and small panel testing across both Medicare Advantage ($17,974 vs. $17,593, P = 0.31) and commercial ($40,655 vs. $39,802, P = 0.68) insurance and remained consistent after adjusting for baseline characteristics. CONCLUSION: In mNSCLC, patients with CGP received biomarker-targeted therapy at higher rates than patients with small panel testing. Among treated patients, adjusted analyses showed no statistically significant difference in OS between CGP and small panel testing, and total healthcare costs were comparable between testing approaches.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42886416","pmid":"42886416","pmcid":"11352260","doi":"10.3390/cancers16162882","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886416/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Clin Transl Oncol","journal_full":"Clinical & translational oncology : official publication of the Federation of Spanish Oncology Societies and of the National Cancer Institute of Mexico","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Genetic signatures of lung cancer: association and biomarker potential of EGFR, KRAS, and HER2 polymorphisms.","title_en":"Genetic signatures of lung cancer: association and biomarker potential of EGFR, KRAS, and HER2 polymorphisms.","authors":"Ortiz TC, Qasim N, Bashir K, Adnan R, Sadullayev M, Sherzodbek T, Sayed U","affiliation_highlight":"Department of Nursing, California State University, San Bernardino (CSUSB), San Bernardino, 92407, USA.","results":"BACKGROUND AND OBJECTIVE: Lung cancer is a key global health challenge. Genetic variations in the key oncogenic pathways, including EGFR, HER2, and KRAS, can contribute to personal susceptibility and disease progression.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND AND OBJECTIVE: Lung cancer is a key global health challenge. Genetic variations in the key oncogenic pathways, including EGFR, HER2, and KRAS, can contribute to personal susceptibility and disease progression. The objective of this study was to assess the association between single-nucleotide polymorphisms (SNPs) in candidate genes, including KRAS, HER2, and EGFR, and lung cancer risk in the Pakistani population. METHODOLOGY: The case-control study comprised 600 participants, including 300 patients with histologically verified lung cancer and 300 healthy controls. DNA was extracted, followed by ARMS-PCR for genotyping. RESULTS: Genetic research revealed a strong correlation between EGFR (rs712829) and lung cancer risk. The mutant (TT) genotype had a protective effect (OR = 0.11; 95% CI = 0.07-0.17; p < 0.0001), whereas the mutant (GT) significantly increased the risk (OR = 3.27; 95%CI = 2.32-4.60; p < 0.0001). The polymorphisms of the other two genes, HER2 and KRAS, did not show any significant association with disease. All demographic parameters, including age, gender, and smoking, did not show any significant association in our studied population. CONCLUSIONS: This study determined that polymorphisms in the EGFR and KRAS genes were found to be significantly associated with lung cancer risk, whereas HER2 variations were found to have a potential protective role.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883750","pmid":"42883750","pmcid":"","doi":"10.3390/ijms27198500","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883750/","notice_url":"","trial_url":"","pub_date":"2026-Sep-23","briefing_date":"2026-10-18","journal_abbr":"Int J Mol Sci","journal_full":"International journal of molecular sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"SynerHyper: Predicting Anticancer Drug Synergy for Lung Cancer Using Uni-Mol Enhanced Hypergraph Neural Networks and Multimodal Fusion.","title_en":"SynerHyper: Predicting Anticancer Drug Synergy for Lung Cancer Using Uni-Mol Enhanced Hypergraph Neural Networks and Multimodal Fusion.","authors":"Sun C, Zhang L, Huang X, Li J, Li J, Ma B, Wang Y","affiliation_highlight":"Engineering Research Center of Cell & Therapeutic Antibody (MOE), Shanghai Frontiers Science Center for Drug Target Iden…","results":"Lung cancer remains a leading cause of cancer-related mortality worldwide, and combination therapy is an important strategy for improving treatment efficacy and overcoming drug resistance. However, identifying synergisti…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Lung cancer remains a leading cause of cancer-related mortality worldwide, and combination therapy is an important strategy for improving treatment efficacy and overcoming drug resistance. However, identifying synergistic drug combinations remains challenging because of the large combinatorial search space and the strong dependence of drug responses on cellular context. Here, we present SynerHyper, a multimodal computational framework for lung cancer drug synergy prediction that integrates three-dimensional molecular representations, transcriptomic profiles, hypergraph learning, and ensemble fusion. Drug molecules are encoded using a Uni-Mol-based molecular encoder, while high-dimensional cell-line gene-expression profiles are compressed using a deep autoencoder. Each drug-drug-cell-line observation is represented as a three-node hyperedge, enabling a two-layer hypergraph neural network to model higher-order interactions among the two drugs and their cellular context. Data augmentation is applied exclusively to the training subset to increase training-data diversity and mitigate class imbalance, and predictions from the hypergraph model, multilayer perceptron, and LightGBM are combined through soft ensemble fusion. Under the split-before-augmentation evaluation protocol, the validation set was used for model selection, while the test set remained completely isolated until final evaluation. SynerHyper achieved a validation AUC of 0.815 and an independent test AUC of 0.808, outperforming the strongest baseline DeepDDS (GCN, 0.792) and other representative methods including AttenSyn (0.780), DeepSynergy (0.750), and DTSyn (0.690) under the same lung cancer dataset. Together with an accessible online prediction server (SynerHyper), SynerHyper provides a lung cancer-specific computational framework for prioritizing candidate drug combinations for downstream experimental validation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883213","pmid":"42883213","pmcid":"","doi":"10.3390/molecules31193447","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883213/","notice_url":"","trial_url":"","pub_date":"2026-Sep-27","briefing_date":"2026-10-18","journal_abbr":"Molecules","journal_full":"Molecules (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Small-Molecule Drugs Approved by the FDA in 2025.","title_en":"Small-Molecule Drugs Approved by the FDA in 2025.","authors":"Wang X, Wang Y, Luo R, Niu D, Yang L, Wang Z","affiliation_highlight":"Key Laboratory of Green Natural Products and Pharmaceutical Intermediates in Colleges and Universities of Shandong Provi…","results":"In today's pharmaceutical sector, innovation is not only the core driver of industry upgrading, but also closely tied to patient health and well-being. A drug's innovative mechanism of action, physiological effects, chem…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"In today's pharmaceutical sector, innovation is not only the core driver of industry upgrading, but also closely tied to patient health and well-being. A drug's innovative mechanism of action, physiological effects, chemical structure, and indications collectively reflect both its clinical therapeutic value and the novelty of underlying basic research. This article presents the innovative advances of 31 small-molecule drugs (accounting for 67.4%) approved by the U.S. Food and Drug Administration (FDA) in 2025. These therapeutics span multiple therapeutic areas, including oncology, autoimmune diseases, infectious diseases, cardiovascular disorders, and metabolic conditions, and target a diverse array of molecular targets such as mitogen-activated protein kinase kinases 1 and 2 (MEK1/2), colony-stimulating factor 1 receptor, protein tyrosine kinase Tec, and Bruton tyrosine kinase, among others. Among these approved small-molecule drugs, 13 are designated as \"first-in-class\" therapies, reflecting the continuous innovation in the field of new drug development. Notably, many of these drugs (e.g., Journavx, Brinsupri, Jascayd, and Kygevvi) have also been granted breakthrough therapy designation, which underscores that they not only feature novel mechanisms of action, but also deliver clinically meaningful efficacy advantages over prior therapeutic options. Notably, in 2025, the FDA approved sunvozertinib, a novel small-molecule drug independently developed by Dizal (Jiangsu, China) Pharmaceutical Co., Ltd., for locally advanced or metastatic non-small cell lung cancer (NSCLC) with epidermal growth factor receptor (EGFR) exon 20 insertion mutations, contributing Chinese wisdom and solutions to the transformative evolution of global drug development paradigms. Cross-technology integration, long-acting drug delivery, and precision medicine stand as core industrial trends, enabling innovative drugs to boost therapeutic efficacy, mitigate toxic side effects and refine patients' medical experience, offering patients expanded regimens for improved survival outcomes. With the development of first-in-class drugs, therapies targeting previously undruggable targets-or those inaccessible via conventional approaches-are entering clinical practice, creating major opportunities for novel, mechanism-based drug discovery. This article comprehensively analyzes the mechanisms of action, synthesis methods, and clinical trials of these drugs chronologically, and delineates emerging trends in novel drug development.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883199","pmid":"42883199","pmcid":"","doi":"10.3390/molecules31193433","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883199/","notice_url":"","trial_url":"","pub_date":"2026-Sep-27","briefing_date":"2026-10-18","journal_abbr":"Molecules","journal_full":"Molecules (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Design, Synthesis, In Vitro and In Silico Evaluation of Triazole-Benzimidazole Hybrid Derivatives as Potential Inhibitors of EGFR, EGFR-L858R, and EGFR-L858R/T790M.","title_en":"Design, Synthesis, In Vitro and In Silico Evaluation of Triazole-Benzimidazole Hybrid Derivatives as Potential Inhibitors of EGFR, EGFR-L858R, and EGFR-L858R/T790M.","authors":"Uslu H, Hıdır A, Yumuşak E, Osmaniye D, Göktaş B, Özkay Y, Kaplancıklı ZA","affiliation_highlight":"Department of Pharmaceutical Chemistry, Faculty of Pharmacy, Fırat University, 23119 Elazığ, Türkiye.","results":"Epidermal growth factor receptor (EGFR) has become one of the most important molecular targets for the development of anticancer agents because of its critical role in regulating cell proliferation, differentiation, and …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Epidermal growth factor receptor (EGFR) has become one of the most important molecular targets for the development of anticancer agents because of its critical role in regulating cell proliferation, differentiation, and survival. In the present study, a novel series of benzimidazole-triazole derivatives were designed by incorporating pharmacophoric features of clinically used EGFR inhibitors, synthesized, characterized, and evaluated for their anticancer potential. Cytotoxicity studies against the A549 lung cancer cell line identified 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-methylacetamide, 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-(hydroxymethyl)acetamide, 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-methoxy-N-methylacetamide, and 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-phenylacetamide as active derivatives, with compound 5a exhibiting the highest antiproliferative activity (IC50 = 6.014 ± 0.758 µM), and relatively low cytotoxicity toward NIH/3T3 cells. Based on these findings, 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-methylacetamide was further evaluated against EGFR and its clinically relevant mutant forms, EGFR-L858R and EGFR-L858R/T790M. Retrospective in silico ADME analysis indicated that the synthesized compounds generally possessed favorable drug-like properties, with 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-methylacetamide showing the most favorable overall drug-likeness profile among the series. Molecular docking and molecular dynamics studies revealed that compound 2-((4-Ethyl-5-(2-(4-hydroxyphenyl)-1H-benzo[d]imidazol-6-yl)-4H-1,2,4-triazol-3-yl)thio)-N-methylacetamide formed stable interactions with key residues in the ATP-binding site of unmutated EGFR, supporting the in vitro inhibition results. Overall, synthesized benzimidazole-triazole derivatives may be promising precursor compounds for the development of novel EGFR inhibitors, particularly against unmutated EGFR cancer cells.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882922","pmid":"42882922","pmcid":"","doi":"10.3390/cancers18193228","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882922/","notice_url":"","trial_url":"","pub_date":"2026-Oct-07","briefing_date":"2026-10-18","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"C","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Orthopaedic Management of Bone Metastases from Lung Cancer.","title_en":"Orthopaedic Management of Bone Metastases from Lung Cancer.","authors":"Martins Lopes J, Oliveira V, Cardoso P, Magalhães M, Fidalgo P, Araújo A","affiliation_highlight":"School of Medicine and Biomedical Sciences, ICBAS, University of Porto, 4050-313 Porto, Portugal.","results":"BACKGROUND/OBJECTIVES: Bone metastases from lung cancer can cause pain, pathological fracture, spinal instability, metastatic spinal cord compression and loss of independence. Lung cancer-specific evidence for orthopaedi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND/OBJECTIVES: Bone metastases from lung cancer can cause pain, pathological fracture, spinal instability, metastatic spinal cord compression and loss of independence. Lung cancer-specific evidence for orthopaedically relevant local management remains fragmented. This review assessed outcomes across spinal, appendicular and pelvic skeletal disease, while explicitly examining the anatomical distribution and limitations of the evidence. METHODS: PubMed, Web of Science, Europe PMC and Scopus were searched for original studies published from January 2015 to December 2025. Eligible studies evaluated orthopaedic, surgical, minimally invasive or percutaneous skeletal interventions, including radiotherapy when combined with or directly compared with an orthopaedically relevant local strategy. Two reviewers independently screened studies, extracted data and completed the full Joanna Briggs Institute checklist applicable to each design. Findings were synthesised narratively, with evidence certainty assessed using GRADE. RESULTS: Thirty-three studies comprising 3585 participants with lung cancer were included; 26 were retrospective observational studies. Thirty studies predominantly evaluated axial disease, mainly spinal metastases, whereas only six included appendicular lesions; these categories were not mutually exclusive. Local interventions were associated with pain relief, maintenance or recovery of ambulation, neurological improvement and local symptom control in selected patients. Comparative survival findings were inconsistent and vulnerable to selection bias and confounding by indication; no causal survival benefit of surgery was established. Complication patterns differed by intervention type. Overall certainty was low to very low and was weakest for appendicular and pelvic disease. CONCLUSIONS: Orthopaedic management can be clinically important for preserving function and controlling mechanical or neurological complications, but the evidence is substantially stronger for spinal than for extraspinal disease. Treatment should remain multidisciplinary and individualised. The proposed decision frameworks are conceptual and guideline-informed rather than validated treatment algorithms.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42882843","pmid":"42882843","pmcid":"","doi":"10.3390/cancers18193149","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882843/","notice_url":"","trial_url":"","pub_date":"2026-Sep-29","briefing_date":"2026-10-18","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"C","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Temporal Trends in Six Major Cancers: Implications for Lifestyle-Based Cancer Prevention and Early Detection Across the Life Course.","title_en":"Temporal Trends in Six Major Cancers: Implications for Lifestyle-Based Cancer Prevention and Early Detection Across the Life Course.","authors":"Sokale I, Rosales O, El-Serag H, Khalaf N, Thrift AP, Adekanmbi V, Oluyomi A","affiliation_highlight":"Section of Epidemiology and Population Sciences, Department of Medicine, Baylor College of Medicine, Houston, TX 77030, …","results":"BACKGROUND/OBJECTIVES: Cancer remains a serious public health challenge in the United States. Six major cancers (female breast, colorectal, liver, lung/bronchus, pancreas, and prostate) account for a substantial proporti…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND/OBJECTIVES: Cancer remains a serious public health challenge in the United States. Six major cancers (female breast, colorectal, liver, lung/bronchus, pancreas, and prostate) account for a substantial proportion of the national cancer burden. Understanding the changes in the incidence of these cancers over time can provide insights for prevention and control. This study examined temporal trends in the cancer incidence according to age at onset and stage at diagnosis. METHODS: This population-based study analyzed data from the United States Cancer Statistics database for 2001-2023, including all 50 states and the District of Columbia. Joinpoint regression was used to estimate annual percent changes (APCs) and average annual percent changes (AAPCs), with corresponding 95% confidence intervals (CIs), based on age-adjusted incidence rates per 100,000 people. Of note, incidence rates from 2020 data were excluded from the Joinpoint models because COVID-19 pandemic disruptions affected cancer screening, diagnosis, and reporting. RESULTS: From 2001 to 2023, the incidence of lung and colorectal cancers declined, particularly among older adults (aged ≥50 years) (lung cancer: AAPC -2.09; 95% CI: -2.27, -1.90; colorectal cancer AAPC -2.70; 95% CI: -2.83, -2.56). In contrast, the incidence of colorectal, pancreatic, and breast cancers increased among younger adults (aged <50 years), whereas the incidence of liver and lung cancer declined. Moreover, prostate cancer incidence declined over time despite modest rebound in recent years (AAPC 1.83; 95% CI: 0.53, 3.14). Stage-specific analyses revealed increasing rates of early-stage diagnoses for several cancers, while late-stage cancer incidence increased for pancreatic and colorectal cancers (especially among younger adults). CONCLUSIONS: Cancer incidence varied substantially by cancer type, age, and stage at diagnosis. The rising incidence of colorectal, pancreatic, and breast cancers among younger adults underscores the need for continued research into risk factors, early detection, and prevention strategies.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42882826","pmid":"42882826","pmcid":"","doi":"10.3390/cancers18193131","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882826/","notice_url":"","trial_url":"","pub_date":"2026-Sep-27","briefing_date":"2026-10-18","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"C","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A Retrospective Study of the Efficacy and Safety of Chemoimmunotherapy in Elderly Patients with Extensive-Stage Small Cell Lung Cancer.","title_en":"A Retrospective Study of the Efficacy and Safety of Chemoimmunotherapy in Elderly Patients with Extensive-Stage Small Cell Lung Cancer.","authors":"Kobayashi M, Watanabe S, Hirose S, Watanabe H, Kushiro K, Suzuki R, Yanagimura N, Sato M et al.","affiliation_highlight":"Department of Respiratory Medicine and Infectious Diseases, Niigata University Graduate School of Medical and Dental Sci…","results":"Background/Objectives: We evaluated the efficacy and safety of first-line treatment with a programmed death-ligand 1 (PD-L1) inhibitor plus platinum-based chemotherapy versus chemotherapy alone in patients aged ≥75 years…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: We evaluated the efficacy and safety of first-line treatment with a programmed death-ligand 1 (PD-L1) inhibitor plus platinum-based chemotherapy versus chemotherapy alone in patients aged ≥75 years with extensive-stage small cell lung cancer (ES-SCLC). Methods: We retrospectively analyzed the patients with ES-SCLC treated within the Niigata Lung Cancer Treatment Study Group between August 2019 and April 2024. Results: A total of 364 consecutive patients were enrolled. After excluding 21 patients who did not receive treatment or had ineligible histological types, 343 patients were included in the analysis. Of these, 132 were aged ≥75. Compared with chemotherapy alone, administering a PD-L1 inhibitor with chemotherapy significantly improved the median overall survival among elderly patients (13.6 vs. 8.4 months; hazard ratio, 0.543; p = 0.0277). The median progression-free and overall survivals were similar between the ≥75-year and <75-year groups treated with PD-L1 inhibitor plus chemotherapy (4.9 vs. 4.8 months; p = 0.7611 and 13.6 vs. 15 months; p = 0.732, respectively). Immune-related adverse events (irAE) of ≥grade 3 occurred in 4 and 12 patients (p = 0.7823), and non irAE of ≥grade 3 occurred in 47 and 103 patients (p = 0.5247) in the ≥75-years and <75-years subgroups, respectively. Conclusions: In this retrospective study, among patients aged ≥75 years with ES-SCLC, the addition of a PD-L1 inhibitor to platinum-based chemotherapy was associated with longer overall survival. Progression-free and overall survival outcomes were comparable between elderly and younger patients, with no clear age-related difference observed in the incidence of adverse events of ≥grade 3.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42882804","pmid":"42882804","pmcid":"","doi":"10.3390/cancers18193109","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882804/","notice_url":"","trial_url":"","pub_date":"2026-Sep-24","briefing_date":"2026-10-18","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"C","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Association of Preoperative Circulating Hsp70 Levels with Event-Free Survival in Thoracic Oncology.","title_en":"Association of Preoperative Circulating Hsp70 Levels with Event-Free Survival in Thoracic Oncology.","authors":"Lobinger D, Taylor N, Messner V, Seier S, Bodner J, Roberts E, Bashiri Dezfouli A, Pockley AG et al.","affiliation_highlight":"Department of Thoracic Surgery, München Klinik Bogenhausen, Lehrkrankenhaus der Technischen Universität München (TUM), 8…","results":"Objectives/Background: Heat shock protein 70 (Hsp70) is frequently overexpressed and released from malignant tumors and is associated with tumor aggressiveness and resistance to treatment. While elevated levels of extrac…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Objectives/Background: Heat shock protein 70 (Hsp70) is frequently overexpressed and released from malignant tumors and is associated with tumor aggressiveness and resistance to treatment. While elevated levels of extracellular Hsp70 (eHsp70) in the blood have been associated with unfavorable tumor characteristics, its prognostic significance in the context of long-term follow-up has not yet been sufficiently analyzed. The primary objective of this study was to investigate the prognostic association between preoperative circulating eHsp70 levels and subsequent event-free survival (EFS) in patients with NSCLC undergoing thoracic surgery. Patients with pulmonary metastases from other primary tumors were analyzed as an exploratory subgroup. Methods: The association between eHsp70 levels, clinical outcome, and event-free survival in patients with malignant thoracic diseases was investigated in a retrospective study. Results: A total of 76 patients undergoing thoracic surgery for non-small cell lung cancer (NSCLC) or pulmonary metastases from other primary tumors were included and subsequently followed for disease progression, metastasis, or death. Preoperative eHsp70 levels were significantly higher in patients who experienced an adverse clinical event than in event-free patients (median 194.3 ng/mL [IQR 19.9-493.0] vs. 27.8 ng/mL [IQR 14.3-53.4], p = 0.0064). ROC analysis showed moderate discriminatory performance in the overall cohort (AUC 0.68, 95% CI 0.55-0.81), with an AUC of 0.72 (95% CI 0.56-0.88) in patients with NSCLC and 0.59 (95% CI 0.34-0.83) in patients with pulmonary metastases. In patients with NSCLC, elevated preoperative eHsp70 levels were associated with significantly shorter event-free survival (log-rank p < 0.0001). In multivariable Cox regression analysis restricted to patients with NSCLC, eHsp70 remained independently associated with shorter event-free survival after adjustment for tumor stage, age, and sex (HR 1.33, 95% CI 1.07-1.65, p = 0.010). Conclusions: These findings suggest that circulating eHsp70 may have prognostic relevance in patients with NSCLC. However, prospective validation in larger and independent cohorts is required before its clinical utility can be established.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42889653","pmid":"42889653","pmcid":"PMC13669878","doi":"10.3389/or.2026.1853377","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889653/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Oncol Rev","journal_full":"Oncology reviews","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前研究 · 小鼠Lewis肺癌皮下瘤模型 · 剂量探索、五组疗效比较及蛋白质组学分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":34,"score_breakdown":{"clinical":6,"methodology":15,"specialty":13,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"放疗联合NK细胞在Lewis肺癌小鼠中增强抑瘤效果：一项蛋白质组学临床前研究","title_en":"Exploring the immune enhancement effect of radiotherapy combined with NK cells on non-small cell lung cancer based on proteomics technology.","authors":"Chang C, Youming T, Ying L, Ningning L, Chunhui G, Dekai W, Mei L, Qiyuan W et al.","affiliation_highlight":"Graduate School, Guangxi University of Chinese Medicine, Nanning, Guangxi, China.","results":"","authors_conclusion":"放疗与NK细胞治疗表现出优越的协同疗效，未观察到明显毒性，重复治疗进一步延缓肿瘤进展；机制上，蛋白质组学显示放疗破坏DNA复制/修复网络，而NK细胞治疗与多个补体成分（包括经典和凝集素通路）上调相关，提示这些通路可能参与。","ai_note":"临床前小鼠模型，摘要未报告样本量、随机化/盲法细节、具体抑瘤数值及统计检验，疗效结论主要基于定性描述；“最小有效剂量”未给出具体剂量；重复联合组与单周期联合组的比较表述不清（“with those”指代不明）；蛋白质组学为初步关联分析，无独立验证；结论不能直接外推至NSCLC患者。","pico":{"p":"C57BL/6小鼠皮下Lewis肺癌模型；样本量摘要未报告","ic":"干预：放疗、NK细胞过继输注、单周期联合治疗（RN）、重复周期联合治疗（RN2）；对照：Control组"},"reason":"为放疗联合NK细胞治疗NSCLC提供临床前疗效与蛋白质组学线索，可作为后续转化研究设计（剂量、重复给药、免疫微环境机制）的对照基线；对当前临床决策影响有限。","abstract_en":"BACKGROUND: Although radiotherapy (RT) and natural killer (NK) cell-based therapy have shown promising potential in the treatment of non-small cell lung cancer (NSCLC), the therapeutic efficacy and safety of their combination remain to be fully elucidated. In this study, we evaluated the efficacy and safety of combined RT and NK cell therapy and performed preliminary proteomic profiling to characterize its potential effects on the tumor immune microenvironment (TIME), providing new insights and a theoretical and clinical basis for the development of NK cell-based therapeutic strategies for NSCLC. METHODS: C57BL/6-derived subcutaneous Lewis lung carcinoma models were established to determine the minimal effective dose of both radiotherapy and adoptively transferred natural killer cells. Based on the MED-derived findings, the mice were further randomized into five experimental groups for therapeutic efficacy evaluation: the Control group, the RT group, the NK group, the combination therapy group (RN group), and the repeated combination therapy group (RN2 group). Tumour volume and body weight were monitored longitudinally. Differentially abundant proteins were interrogated by Gene Ontology enrichment and Kyoto Encyclopaedia of Genes and Genomes (KEGG) pathway analyses to systematically describe the synergistic antitumor efficacy of differentially expressed proteins. RESULTS: Compared with RT or NK cell-based immunotherapy as monotherapies, the RN group exhibited markedly enhanced tumor growth inhibition, with no overt treatment-related toxicities observed. Following the second cycle of combined therapy, mice in the RN2 group displayed a more pronounced reduction in tumor growth rate with those in the single-cycle combination cohort; notably, no significant adverse events associated with the combined regimen were detected throughout the entire experimental duration. Proteomic profiling unraveled that RT disrupted the core regulatory networks governing intracellular DNA replication and repair processes in tumor cells in a therapy-specific manner, whereas NK cell immunotherapy potently and selectively activated the classical pathway of the host complement system. CONCLUSION: Collectively, RT and NK cell therapy demonstrate superior synergistic efficacy and no overt toxicity was observed, with repeated treatments further delaying tumor progression. Mechanistically, proteomics shows that RT disrupts DNA replication/repair networks, whereas NK cell therapy was associated with upregulation of multiple complement components, including those belonging to the classical and lectin pathways, suggesting a potential involvement of these pathways.","tags":["NSCLC","放疗","NK细胞","临床前小鼠模型","蛋白质组学","肿瘤免疫微环境"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883206","pmid":"42883206","pmcid":"","doi":"10.3390/molecules31193440","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883206/","notice_url":"","trial_url":"","pub_date":"2026-Sep-27","briefing_date":"2026-10-18","journal_abbr":"Molecules","journal_full":"Molecules (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前药物发现研究 · 体外细胞实验与体内异种移植实验（摘要）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":34,"score_breakdown":{"clinical":7,"methodology":13,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"新型2,4-嘧啶二胺衍生物ZX-3在EGFR驱动NSCLC临床前模型中显示抗肿瘤活性","title_en":"Novel 2,4-Pyrimidinediamine Derivative as Potent EGFR Inhibitor for NSCLC Treatment.","authors":"Jia S, Lv X, Lv J, Wu Y","affiliation_highlight":"University of Science and Technology of China, Hefei 230026, China.","results":"","authors_conclusion":"ZX-3是一种基于硼酰化修饰的可逆EGFR抑制剂，在体外和体内均具有良好的抗肿瘤活性，为后续EGFR靶向抑制剂开发提供了新策略。","ai_note":"仅为临床前研究，摘要无样本量、剂量、统计量及P值，“potent”“significantly”等结论缺少数值支撑；H2228常为EML4-ALK融合模型，摘要未交代其EGFR驱动依据，模型与EGFR靶点结论一致性信息不足；未报告对照设置、随机化、盲法及毒性指标细节。","pico":{"p":"EGFR驱动NSCLC（H2228细胞及体内异种移植模型；样本量未报告）","ic":"ZX-3 vs 先导化合物ceritinib（体外/体内；具体对照、剂量与给药方案摘要未报告）"},"reason":"为EGFR驱动NSCLC的新型可逆抑制剂提供早期临床前活性信号，可作为后续靶向药物研发与实验设计的参考基线，但尚不能直接影响临床决策。","abstract_en":"Aberrant activation of EGFR drives the progression of non-small-cell lung cancer (NSCLC). As one of the most prevalent driver genes in NSCLC, EGFR represents a critical therapeutic target for patients with NSCLC. In this study, we synthesized 2,4-pyrimidinediamine derivative ZX-3. Compared to its lead compound ceritinib, which has weak cytotoxicity for EGFR-driven NSCLC, ZX-3 exhibited potent cytotoxicity against EGFR-driven NSCLC. We further investigated the antitumor activity and mechanisms of ZX-3 both in vitro and in vivo. Through high-throughput target screening using RTK protein arrays and surface plasmon resonance (SPR) assays, it was demonstrated that ZX-3 reversibly targets the EGFR protein and inhibits its downstream PI3K/AKT signaling pathway. In vitro experiments revealed that ZX-3 suppresses cell colony formation in H2228 cells, induces G1-phase cell cycle arrest, and promotes apoptosis. In in vivo xenograft studies, ZX-3 treatment significantly suppressed tumor growth without obvious toxicity. Collectively, ZX-3 represents a reversible EGFR inhibitor based on borylation modification and possesses favorable antitumor activity both in vitro and in vivo, offering a novel strategy for the subsequent development of EGFR-targeted inhibitors.","tags":["EGFR","NSCLC","临床前","靶向治疗","2,4-嘧啶二胺"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890033","pmid":"42890033","pmcid":"PMC13670790","doi":"10.1021/acsomega.6c04401","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890033/","notice_url":"","trial_url":"","pub_date":"2026-Oct-13","briefing_date":"2026-10-18","journal_abbr":"ACS Omega","journal_full":"ACS omega","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"计算生物学（网络毒理学+转录组机器学习特征筛选）联合体外细胞实验的探索性、假设生成型研究","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":30,"score_breakdown":{"clinical":6,"methodology":15,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"整合网络毒理学与机器学习优先筛选NNK相关肺癌候选分子特征：仅提供假设生成框架，未验证因果关系","title_en":"Integration of Network Toxicology and Machine Learning to Prioritize Candidate Molecular Features Associated with NNK-Related Lung Cancer.","authors":"Li Y, Wu H, Liu P, Ji J, Zhang Q, Zhang Y, Li Y","affiliation_highlight":"Tianjin Neurological Institute, Key Laboratory of Post-Neuro Injury, Neuro-repair and Regeneration in Central Nervous Sy…","results":"基于对多基因分类框架的贡献优先选出5个基因：SNAI2、PLAU、DNMT3A、FAP、CCNB1；探索性分子对接产生打分不高的计算配体放置模型；微摩尔NNK暴露后A549出现CCK-8信号升高、细胞周期分布改变、Transwell迁移与侵袭计数增加、候选基因mRNA表达变化。","authors_conclusion":"本研究提供了一个用于优先筛选候选分子特征以供未来研究的假设生成框架，而非NNK靶点结合或因果基因功能的直接证据。","ai_note":"全文无任何定量数值、效应量、置信区间或P值，无法评估差异幅度与统计稳健性；无剂量、暴露时长、重复次数与实验批次信息。作者自述对接打分偏低且仅作结构可视化、A549代谢能力有限使亲代NNK暴露不代表人体内暴露场景、平行观察不能证明候选基因介导表型——这些自我限定虽诚实，但也意味着核心结论几乎不可证伪。机器学习优先排序依赖所输入的转录组数据集，未见独立验证队列或外部复现，基因组合的稳定性未知。","pico":{"p":"预测的NNK相关蛋白与肺癌转录组数据集整合分析；体外为代谢能力有限的A549细胞模型","ic":"微摩尔浓度亲代NNK暴露的A549细胞 vs 对照；计算部分为网络分析联合机器学习多基因分类框架的特征优先级排序"},"reason":"对胸外科临床判断无直接影响；作为方法学参考，提示网络毒理学+机器学习的候选基因筛选在缺乏定量验证与独立队列时只能停留在假设层面，可用于评估同类AI驱动生物标志物研究的证据强度上限。","abstract_en":"4-(Methylnitrosamino)-1-(3-pyridyl)-1-butanone (NNK) is a tobacco-specific nitrosamine implicated in tobacco-related lung carcinogenesis. Its biological effects in vivo depend substantially on metabolic conversion to NNAL and cytochrome P450-mediated formation of reactive intermediates. In this study, predicted NNK-associated proteins were integrated with lung cancer transcriptomic data sets, followed by network analysis and machine-learning-based feature prioritization. Five genes, SNAI2, PLAU, DNMT3A, FAP, and CCNB1, were prioritized based on their contributions to the multigene classification framework. Exploratory molecular docking generated computational ligand-placement models with modest docking scores; these results were used only as structural visualizations and do not demonstrate direct biochemical binding. In the metabolically limited A549 cell model, micromolar exposure to parent NNK produced higher CCK-8 signals, altered cell-cycle distributions, increased Transwell migration and invasion counts, and changes in candidate-gene mRNA expression. These parallel observations do not establish that the candidate genes mediate the cellular phenotypes. Moreover, because intact NNK is rapidly metabolized in vivo and is not an established biomarker of systemic exposure in human blood, urine, or saliva, the parent-compound exposure used here does not represent an established human internal-exposure scenario. This study provides a hypothesis-generating framework for prioritizing candidate molecular features for future investigation rather than direct evidence of NNK target engagement or causal gene function.","tags":["NNK","网络毒理学","机器学习","肺腺癌","A549","假设生成"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890446","pmid":"42890446","pmcid":"PMC13673118","doi":"10.1155/crip/1830357","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890446/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Case Rep Pathol","journal_full":"Case reports in pathology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type"
