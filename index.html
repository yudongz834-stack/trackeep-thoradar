<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

135 died from non-lung cancer causes. With lung cancer death treated as a competing event, the 10-year cumulative incidence of non-lung cancer death after resection was 18.6%. Multivariable analysis identified older age, comorbidity, low body mass index (BMI), and lobectomy as factors associated with a higher subdistribution hazard of non-lung cancer death. In an exploratory analysis of patients aged ≥ 71 years, older age, smoking history, low BMI, and lobectomy were associated with a higher cumulative incidence of non-lung cancer death in univariable analysis. No statistically significant interaction was observed between age and surgical procedure (P for interaction = 0.079). CONCLUSION: This study investigated the cumulative incidence of and risk factors for non-lung cancer death after lung cancer surgery. These findings suggest that patient characteristics should be considered when selecting the extent of lung resection.","tags":["肺癌","肺叶切除","肺段切除","非肺癌死亡","竞争风险"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42891252","pmid":"42891252","pmcid":"PMC13674029","doi":"10.1016/j.xjtc.2026.102401","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42891252/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"JTCVS Tech","journal_full":"JTCVS techniques","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单中心回顾性倾向性评分匹配队列研究（新技术对照，非随机）","category":"surgery","category_label":"微创与无管化胸外科","score_total":57,"score_breakdown":{"clinical":23,"methodology":15,"specialty":19,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"深部cT1a-bN0M0 NSCLC（PSM后88对）","metric":"无复发生存与总生存组间差异","val":"无显著差异","stat":"P>.05","grounded":false,"checks":[ "note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"隔膜引导的肺段切除术治疗深部早期NSCLC：倾向性匹配回顾性队列显示与肺叶切除的生存及围手术期结果无显著差异，但多数病例切缘不足20mm","title_en":"Septum-guided segmentectomy for deep early-stage non-small cell lung cancer: A novel, margin-independent, parenchyma-sparing concept.","authors":"Wang Q, Wu X, Wen Z, Liu Y, Zhang J, Yao F, Li Z, Geng J et al.","affiliation_highlight":"Department of Thoracic Surgery, Shanghai Chest Hospital, Shanghai Jiao Tong University School of Medicine, Shanghai, Chi…","results":"匹配后关键协变量基线均衡；采用分层方法的生存分析显示两组无复发生存与总生存均无显著差异（P>.05）。段切除组平均切缘距离14.1 mm，相当比例患者不符合NCCN切缘标准（>20 mm或≥肿瘤大小），随访期内未观察到局部区域复发。全部患者实现R0切除。段切除手术时间更长（P<.001），两组围手术期并发症与住院时间高度相当。","authors_conclusion":"隔膜引导的肺段切除术对深部早期NSCLC显示出初步的肿瘤学安全性，围手术期结果与肺叶切除相当；以段间隔作为可靠解剖屏障，该概念建立了精确手术范式，可安全降低对固定切缘距离的依赖。","ai_note":"摘要未报告随访时间、复发/生存的具体例数与风险比或置信区间，主要终点未预先明确，‘随访期内无局部区域复发’缺乏人时与随访长度，难以支持‘肿瘤学安全’的结论；‘margin-independent’与‘安全降低对切缘距离依赖’属于概念性外推，超出回顾性小样本、事件稀少的数据支持；段切除组样本量小且选择偏倚仅靠倾向性评分控制，术者/技术学习曲线与病理选择未描述；总体生存与无复发生存均仅以P>.05呈现，无法区分真等效与把握度不足，存在将阴性结果解读为等效的风险。","pico":{"p":"深部cT1a-bN0M0非小细胞肺癌292例（隔膜引导肺段切除130例，微创肺叶切除162例；倾向性评分匹配后88对，n=176），2019年1月至2025年3月","ic":"隔膜引导肺段切除术（以段间隔与段间静脉作为解剖边界，不依赖固定线性切缘距离）对照微创肺叶切除术"},"reason":"为深部小病灶（cT1a-bN0M0）能否以解剖性亚肺叶切除替代肺叶切除、以及切缘不足20mm时是否可接受提供了对照基线，直接影响术前术式选择与切缘标准的执行尺度，并为后续前瞻性验证设定假设。","abstract_en":"OBJECTIVE: The application of segmentectomy for deep-located tumors remains controversial as the result of margin concerns. This study evaluated septum-guided segmentectomy, which uses intersegmental septa and veins as anatomical boundaries to ensure precise dissection independent of fixed linear margin requirements. METHODS: We retrospectively analyzed 292 patients with deep-located cT1a-bN0M0 non-small cell lung cancer undergoing septum-guided segmentectomy (n = 130) or lobectomy (n = 162) via a minimally invasive approach (January 2019 to March 2025). To rigorously control for selection bias, propensity-score matching incorporating key physiological and anatomical confounders was performed, generating 88 well-balanced matched pairs (n = 176). Perioperative outcomes, locoregional recurrence, recurrence-free survival, and overall survival were evaluated. RESULTS: After propensity-score matching, baseline balance was achieved across key covariates. Survival analysis using stratified methods revealed no significant differences in recurrence-free survival or overall survival between the groups (P> .05). Notably, despite a substantial proportion of patients in the segmentectomy group not fulfilling standard National Comprehensive Cancer Network margin criteria (>20 mm or greater tumor size)-with a mean margin distance of 14.1 mm-no locoregional recurrence was observed during follow-up. R0 resection was achieved in all patients. Although segmentectomy involved longer operative times (P< .001), perioperative complications and hospital stays were highly comparable between the 2 cohorts. CONCLUSIONS: Septum-guided segmentectomy demonstrates preliminary oncologic safety and perioperative outcomes comparable with lobectomy for deep-located early-stage non-small cell lung cancer. By using the intersegmental septum as a reliable anatomical barrier, this concept establishes a precise surgical paradigm that safely reduces the reliance on fixed margin distances.","tags":["早期NSCLC","肺段切除术","切缘距离","倾向性评分匹配","微创手术"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890876","pmid":"42890876","pmcid":"PMC13672550","doi":"10.3389/fphar.2026.1914046","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890876/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Pharmacol","journal_full":"Frontiers in pharmacology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Effects of multiple low-dose intranasal dexmedetomidine administration on postoperative pulmonary complications in elderly patients undergoing thoracoscopic radical resection of lung cancer: a single-center randomized controlled trial.","title_en":"Effects of multiple low-dose intranasal dexmedetomidine administration on postoperative pulmonary complications in elderly patients undergoing thoracoscopic radical resection of lung cancer: a single-center randomized controlled trial.","authors":"Li B, Liu Y, Liu X, Han M, Meng X, Sun M, Zhang J, Zhang W et al.","affiliation_highlight":"Department of Anesthesiology and Perioperative Medicine, Henan Provincial People's Hospital, Zhengzhou, China.","results":"BACKGROUND: Postoperative pulmonary complications (PPCs) ranging from 30% to 50% have been recognized as a major threat to postoperative recovery. Current conventional interventions cannot effectively reduce the occurren…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Postoperative pulmonary complications (PPCs) ranging from 30% to 50% have been recognized as a major threat to postoperative recovery. Current conventional interventions cannot effectively reduce the occurrence of PPCs. OBJECTIVE: In this study, we aimed to investigate the effects of multiple low-dose intranasal dexmedetomidine administration on PPCs in elderly patients. METHODS: In this double-blind, randomized, controlled trial, elderly patients were randomly assigned at a 1:1 ratio to receive multiple low-dose intranasal dexmedetomidine administration (MD group) or normal saline nasal spray (NS group). The primary outcome was the incidence of PPCs within 7 days after surgery. Key secondary outcomes included the severity grading and classification of PPCs. Other secondary outcomes included serum interleukin-6 (IL-6) and tumor necrosis factor-α (TNF-α) levels, Richards-Campbell sleep questionnaire (RCSQ) scores at predefined time points, and adverse reactions. RESULTS: A total of 190 patients were screened, and 186 completed the study. The incidence of PPCs was significantly lower in the MD group than in the NS group (9.68% vs. 22.58%, P = 0.017), with a risk ratio (RR) of 2.333 [95% confidence interval (CI): 1.173-6.317], absolute risk reduction (ARR) of 12.90%, and number needed to treat (NNT) of 7.75. Sensitivity analyses using the per-protocol population (PP) dataset yielded consistent results, confirming the stability and reliability of the primary outcome. The distribution of severity grading of PPCs also differed significantly between the groups (P = 0.036). After Bonferroni correction, the between-group difference in PPCs severity grading was not statistically significant (corrected P = 0.072). The distribution of pneumonia also differed significantly between the groups (P = 0.029). There were significant group effects, time effects, and interaction effects for IL-6, TNF-α, and RCSQ in the two groups after surgery (all P < 0.05). No significant between-group differences were observed in drug-related adverse events. CONCLUSION: Multiple low-dose intranasal dexmedetomidine administration significantly reduces the incidence of PPCs in elderly patients undergoing radical thoracoscopic lung-cancer resection with a favorable safety profile. CLINICAL TRIAL REGISTRATION: https://www.chictr.org.cn/showproj.html?proj=243165; identifier ChiCTR2400090593.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890327","pmid":"42890327","pmcid":"PMC13672813","doi":"10.1016/j.conctc.2026.101695","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890327/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-18","journal_abbr":"Contemp Clin Trials Commun","journal_full":"Contemporary clinical trials communications","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Implementation of oncological clinical trials in primary health care in Cuba: a program generalization study.","title_en":"Implementation of oncological clinical trials in primary health care in Cuba: a program generalization study.","authors":"Monteagudo GL, Guerra Chaviano PP, Carrodeguas RAO, Valdés LS, Del Sol AB, González CV, Reyes LN, Morales OS et al.","affiliation_highlight":"Center of Molecular Immunology, Havana, Cuba.","results":"BACKGROUND: Primary health care (PHC) offers a strategic opportunity to conduct research with immunotherapeutic products for cancer treatment. OBJECTIVES: To evaluate the implementation of a program for conducting oncolo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Primary health care (PHC) offers a strategic opportunity to conduct research with immunotherapeutic products for cancer treatment. OBJECTIVES: To evaluate the implementation of a program for conducting oncological clinical trials in PHC settings. The implementation objectives focused on assessing structure, process, and outcome indicators against predefined standards; the intervention objectives compared process and clinical outcomes (overall survival, quality of life, and patient satisfaction) in PHC settings against a historical control from secondary care. METHODS: A longitudinal, prospective, analytical implementation study was conducted in Cuba between January 2016 and August 2023. An open-label, uncontrolled, non-randomized, multicenter, phase IV clinical trial using the CIMAvax-EGF vaccine for patients with advanced lung cancer was used as a case study. The implementation was conducted in three phases: pilot study, replication, and generalization. This paper presents the outcomes of the generalization phase. For evaluation, structure, process, and outcome indicators were assessed against predefined standards and compared with a historical control from secondary health care (SHC). An indicator was considered adequate if it met the standard. The overall dimension (structure, process, or outcome) was considered acceptable if ≥ 70% of its indicators were adequate. RESULTS: The program was implemented in 119 polyclinics nationwide. For structure, 83% (5/6) of indicators were adequate; for process, 83% (5/6) were adequate; for outcome, 100% (4/4) were adequate. All three dimensions met the predefined standards. Process and outcome indicators were comparable or superior to the SHC historical control. Structure and outcome indicators improved after implementation. CONCLUSIONS: The results support the feasibility and effectiveness of implementing oncological clinical trials in Cuban PHC centers, demonstrating a positive impact on the target population.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889180","pmid":"42889180","pmcid":"PMC13669195","doi":"10.3389/fmed.2026.1923698","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889180/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Med (Lausanne)","journal_full":"Frontiers in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Ciprofol versus propofol for general anesthesia during thoracoscopic surgery: a randomized double-blind trial.","title_en":"Ciprofol versus propofol for general anesthesia during thoracoscopic surgery: a randomized double-blind trial.","authors":"Wang Y, Geng Y, Yan Y, Gao X, Shi Q","affiliation_highlight":"Department of Anesthesiology, Fuyang Normal University Second Affiliated Hospital, Fuyang, Anhui, China.","results":"BACKGROUND: Ciprofol is a novel intravenous anesthetic with potentially improved hemodynamic stability and fewer injection-related adverse effects than propofol. This study compared ciprofol and propofol for general anes…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Ciprofol is a novel intravenous anesthetic with potentially improved hemodynamic stability and fewer injection-related adverse effects than propofol. This study compared ciprofol and propofol for general anesthesia in patients undergoing video-assisted thoracoscopic surgery (VATS). METHODS: In this prospective, randomized, double-blind trial, 120 adults undergoing elective thoracoscopic surgery were randomized to ciprofol (n = 60) or propofol (n = 60). MAP, HR, and BIS were assessed at eight predefined perioperative time points using linear mixed-effects models. The repeated binary outcome of BIS ≥60 was analyzed using a generalized linear mixed-effects model. Induction characteristics, injection pain, recovery profiles, and perioperative adverse events were also evaluated. RESULTS: MAP differed significantly between groups, with higher values in the ciprofol group at loss of consciousness and after tracheal intubation. HR was modestly higher at selected early time points, without a significant group-by-time interaction. BIS was higher with ciprofol during the early intraoperative period, and BIS ≥60 was more frequent at loss of consciousness (76.7% vs. 43.3%, p < 0.001), but not thereafter. Ciprofol was associated with shorter induction time (38.3 vs. 46.0 s, p < 0.001), less injection pain (5.0% vs. 20.0%, p = 0.025), and shorter PACU stay (48.0 vs. 55.7 min, p = 0.011). No significant differences were observed in supplemental anesthetic requirements, emergence time, or perioperative adverse events. CONCLUSIONS: Ciprofol showed a perioperative profile broadly comparable to propofol, with transient differences in hemodynamic parameters and higher BIS during the early intraoperative period. Ciprofol was associated with faster induction, less injection pain, and shorter PACU stay. Larger multicenter studies are warranted to confirm these findings. CLINICAL TRIAL REGISTRATION: https://www.chictr.org.cn/showproj.html?proj=203394, Identifier: ChiCTR2400082924.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42888178","pmid":"42888178","pmcid":"","doi":"10.1080/14712598.2026.2742404","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888178/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Expert Opin Biol Ther","journal_full":"Expert opinion on biological therapy","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"An evaluation of sacituzumab tirumotecan for the treatment of NSCLC.","title_en":"An evaluation of sacituzumab tirumotecan for the treatment of NSCLC.","authors":"Wang J, Zhou Y, Wu L","affiliation_highlight":"Department of Thoracic Oncology, The Affiliated Cancer Hospital of Xiangya School of Medicine, Central South University/…","results":"INTRODUCTION: Non-small cell lung cancer (NSCLC) remains a leading cause of cancer-related mortality, and resistance to targeted therapy and immunotherapy represents a substantial unmet clinical need. Trophoblast cell-su…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Non-small cell lung cancer (NSCLC) remains a leading cause of cancer-related mortality, and resistance to targeted therapy and immunotherapy represents a substantial unmet clinical need. Trophoblast cell-surface antigen 2 (TROP2)-directed antibody-drug conjugates (ADCs) have emerged as a promising therapeutic class. AREAS COVERED: This drug evaluation summarizes the pharmacological rationale, molecular design, preclinical activity, clinical efficacy, safety profile, and regulatory development of sacituzumab tirumotecan (sac-TMT; MK-2870/SKB264) in NSCLC. Relevant evidence was identified through searches of PubMed, ClinicalTrials.gov, major oncology congress proceedings, and regulatory announcements through 20 September 2026. EXPERT OPINION: Randomized trials have demonstrated improved progression-free survival (PFS) with sac-TMT versus docetaxel and platinum-pemetrexed chemotherapy in epidermal growth factor receptor (EGFR)-mutated advanced NSCLC after EGFR tyrosine kinase inhibitor (EGFR-TKI) progression. In advanced NSCLC without actionable driver alterations, sac-TMT plus pembrolizumab improved PFS versus pembrolizumab alone in programmed death-ligand 1 (PD-L1)-positive disease; however, overall survival (OS) remains immature, and superiority over contemporary chemoimmunotherapy has not been established. The principal clinically relevant toxicities are hematologic toxicity and stomatitis. Future studies should clarify predictive biomarkers, optimal treatment sequencing, intracranial activity, and generalizability, while generating mature survival and quality-of-life data.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42886530","pmid":"42886530","pmcid":"","doi":"10.1093/oncolo/oyag404","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886530/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Oncologist","journal_full":"ONCOLOGIST","tier":"A","if_val":4.7,"zone":"JCR Q2 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":20,"methodology":15,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Whole Genome Sequencing-based tumor-informed circulating tumor DNA monitoring for early detection of recurrence in patients with solid tumors.","title_en":"Whole Genome Sequencing-based tumor-informed circulating tumor DNA monitoring for early detection of recurrence in patients with solid tumors.","authors":"George M, Schwartz GS, McHayleh W, Margulis V, Bando H, Yoshino T, Ansstas G, Scalise CB et al.","affiliation_highlight":"Rutgers Cancer Institute, New Brunswick, New Jersey, USA.","results":"BACKGROUND: Circulating tumor DNA (ctDNA) assays can transform patient management by enabling molecular residual disease (MRD) detection, prognosis prediction, and treatment monitoring. Here, we report clinical performan…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Circulating tumor DNA (ctDNA) assays can transform patient management by enabling molecular residual disease (MRD) detection, prognosis prediction, and treatment monitoring. Here, we report clinical performance of Signatera™ Genome, a whole genome sequencing (WGS)-based ctDNA assay, in a diverse pan-cancer cohort at landmark and longitudinal settings post-definitive treatment. METHODS: We performed a retrospective analysis of 386 patients with one of the following cancers: breast, colorectal, non-small cell lung, melanoma, or renal cell carcinoma. Signatera™ Genome assays, designed with high-quality variants selected from the matched tumor and normal WGS data, were used to detect ctDNA in the associated patients' longitudinal plasma samples collected post-operatively. The correlation between ctDNA-based MRD status and systemic, distant recurrence-free survival (systemic DRFS) was assessed using Cox regression analysis. RESULTS: In the pan-cancer cohort, landmark analysis at 3 months post-surgery revealed that patients with MRD-positivity had significantly inferior systemic DRFS compared to ctDNA-negative patients (HR: 23.7, p < 0.0001). Additionally, ∼30% improvement in 24-month systemic DRFS was observed among adjuvant-treated MRD-positive patients, whereas MRD-negative patients derived no clear benefit from adjuvant therapy. In the longitudinal setting, MRD positivity anytime post-definitive treatment surveillance significantly correlated with shorter systemic DRFS compared to serial MRD negativity (HR: 104.7, p < 0.0001). Tumor-specific analyses yielded similar findings. Notably, 62% (72/116) of patients had ctDNA detected in the ultra-sensitive range of < 100 ppm. CONCLUSIONS: Our findings underscore the robust clinical performance of the Signatera Genome assay for MRD detection across solid tumors. Its broad applicability and high specificity support its integration into clinical practice and prospective trials.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective_matched","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42882776","pmid":"42882776","pmcid":"","doi":"10.3390/cancers18193081","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882776/","notice_url":"","trial_url":"","pub_date":"2026-Sep-22","briefing_date":"2026-10-18","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"C","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Early and Multimodal Care for Patients with Lung Cancer: Findings from the ACCEPT Study.","title_en":"Early and Multimodal Care for Patients with Lung Cancer: Findings from the ACCEPT Study.","authors":"Grah C, Oei SL, Kindler F, Krabbe A, Wüstefeld H, Reif M, Thronicke A, Ngandeu Schepanski S et al.","affiliation_highlight":"Lung Cancer Center, Hospital Gemeinschaftskrankenhaus Havelhöhe, Kladower Damm 221, 14089 Berlin, Germany.","results":"Objective: Treating lung cancer with a combination of targeted cancer therapy, supportive, and psychosocial treatments is important in modern oncology. The ACCEPT study investigated the efficacy of a 12-week early multim…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Objective: Treating lung cancer with a combination of targeted cancer therapy, supportive, and psychosocial treatments is important in modern oncology. The ACCEPT study investigated the efficacy of a 12-week early multimodal supportive care program on quality of life. Methods: ACCEPT was a single-center, non-randomized, prospective, open-label trial, with a pragmatic real-world design guided by patient choice. Patients with newly diagnosed, stage II-IV lung cancer participated in the outpatient ACCEPT program (psycho-oncology, health education, and training-based interventions alongside standard care). Longitudinal patient-reported outcome measures (PROMs) were collected. The primary outcome was the change in quality of life at 12 weeks measured by the Trial Outcome Index (TOI). Secondary outcomes included further exploratory PROM changes and overall survival. Results: Between April 2018 and August 2021, 214 lung cancer patients (median age 67, 53% male, 57% stage IV) were enrolled, with 116 patients evaluable for longitudinal PROM changes at 12 weeks. Participation in the multimodal ACCEPT program was associated with up to 17% improvement in the TOI, psychological distress, and sleep quality (p < 0.0001). Multivariate analyses revealed that greater session attendance was significantly and dose-dependently associated with improvements in the TOI as well as reductions in depression and anxiety. Higher engagement in multimodal sessions was also linked to reduced fatigue. Furthermore, exploratory signals of improved overall survival were observed among the 40 patients (18.7%) who fully completed the ACCEPT program. Conclusions: This pragmatic, patient-centered, multimodal supportive care program for lung cancer patients was associated with dose-dependent improvements in quality of life and psychological distress. While exploratory signals of improved survival were observed, multicenter randomized controlled trials are required to confirm these findings and firmly establish the role of such supportive care programs in routine oncology.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42890422","pmid":"42890422","pmcid":"PMC13673135","doi":"10.1002/cai2.70082","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890422/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"Cancer Innov","journal_full":"Cancer innovation","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（非系统评价）· KRAS G12C靶向治疗与耐药机制","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":52,"score_breakdown":{"clinical":22,"methodology":12,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"KRAS G12C突变非小细胞肺癌的分子机制与治疗进展：迈向机制导向的全程管理","title_en":"Molecular Mechanisms and Therapeutic Advances in KRAS G12C-Mutant Non-Small Cell Lung Cancer: Toward Mechanism-Guided Longitudinal Management.","authors":"Wang H, Chen H, Li S, Zhao J","affiliation_highlight":"Department of Thoracic Medical Oncology Peking University Cancer Hospital Beijing China.","results":"","authors_conclusion":"随机试验显示sotorasib和adagrasib在经治患者中较docetaxel改善PFS和ORR，但这些获益未持续转化为明确的OS优势；提出结合PD-L1、TMB、STK11/KEAP1/TP53状态、TTF-1表达、脑转移与ctDNA的风险分层和机制导向管理框架；进展时应区分寡进展与系统进展，条件允许时行组织再活检联合血浆分析；未来优先方向包括随机一线比较、生物标志物定义的联合策略、改善中枢神经系统活性及耐药后的机制匹配治疗。","ai_note":"本文为叙述性综述，摘要未交代系统检索策略、纳入排除标准、文献筛选流程或证据分级，方法学可重复性有限；主要疗效表述仅作定性概括，未给出PFS/ORR/OS的效应量、置信区间或P值，无法核验“改善PFS/ORR但未一致转化为OS优势”的证据强度；所提多生物标志物“可实施框架”尚缺乏前瞻性验证，属作者主张而非已证实结论；中国可及性与报销覆盖的表述在摘要中无数据支撑。信息不足，无法判断是否存在选择性引用。","pico":{"p":"KRAS G12C突变非小细胞肺癌（NSCLC）患者，涵盖经治及全程管理人群","ic":"sotorasib、adagrasib等共价KRAS G12C(OFF)状态抑制剂及KRAS/RAS导向策略；对照包括多西他赛及不同治疗线数/生物标志物分层管理"},"reason":"为晚期KRAS G12C突变NSCLC的靶向治疗选择、耐药后处理及生物标志物分层提供全景式证据梳理，可作为临床决策背景与后续随机对照研究设计（尤其一线比较和联合策略）的参照。","abstract_en":"KRAS G12C-mutant non-small cell lung cancer (NSCLC) has become a clinically actionable molecular subtype. Discovery of the switch-II pocket enabled the development of covalent KRAS G12C(OFF)-state inhibitors, transforming a historically \"undruggable\" target into a therapeutic vulnerability. Drugging KRAS, however, proved to be a problem of chemistry, whereas sustaining its inhibition has proved to be a problem of biology. KRAS G12C-mutant NSCLC is biologically heterogeneous, and the magnitude and durability of clinical benefit are shaped by co-mutations, the tumor microenvironment, brain metastases status, pharmacologic differences between agents, and the dynamic evolution of resistance. Randomized trials have demonstrated that sotorasib and adagrasib improve progression-free survival (PFS) and objective response rates (ORR) over docetaxel in previously treated disease, yet these gains have not translated consistently into a definitive overall survival (OS) advantage. This review synthesizes the epidemiology, molecular biology, diagnostic strategies, first- and later-line treatment evidence, resistance mechanisms, and emerging KRAS/RAS-directed approaches. We distinguish randomized or guideline-supported practice from early-phase and translational signals, and propose an implementable framework that combines PD-L1, tumor mutational burden, STK11/KEAP1/TP53 status, TTF-1 expression, brain metastases, and circulating tumor DNA (ctDNA) for risk stratification and mechanism-guided management. At disease progression, oligoprogression should be distinguished from systemic progression, and tissue re-biopsy together with plasma profiling should be considered when feasible. In China, several domestically developed KRAS G12C inhibitors have been approved, and reimbursement coverage is expanding; the cost of molecular testing, uneven institutional access, regional disparities and limited confirmatory and real-world evidence nonetheless continue to constrain implementation. Future priorities include randomized first-line comparisons, biomarker-defined combination strategies, improved central nervous system activity and mechanism-matched treatment after resistance.","tags":["KRAS G12C","非小细胞肺癌","靶向治疗","耐药机制","生物标志物","综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888494","pmid":"42888494","pmcid":"","doi":"10.1002/sim.70773","nct_id":"NCT01903993","url":"https://pubmed.ncbi.nlm.nih.gov/42888494/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT01903993","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"Stat Med","journal_full":"Statistics in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"统计方法学研究 · 提出Max 0-1加权log-rank检验并进行模拟研究与NSCLC临床试验数据分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":52,"score_breakdown":{"clinical":12,"methodology":26,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"随机延迟治疗效应下时间事件数据的Max 0-1加权log-rank检验及NSCLC试验数据应用","title_en":"A Max 0-1 Weighted Log-Rank Test for Time-to-Event Data With Random Delayed Treatment Effect.","authors":"Liu J, Chu C, Yi B, Chen MH","affiliation_highlight":"Department of Statistics, University of Connecticut, Storrs, Connecticut, USA.","results":"","authors_conclusion":"提出基于一组0-1加权log-rank统计量最大值的检验方法并建立相关理论结果；广泛模拟研究及NSCLC临床试验真实数据分析进一步证明该检验方法的有用性。","ai_note":"摘要未给出模拟的I类错误、功效或真实数据分析的检验统计量/P值，无法判断相对传统log-rank的优势幅度；真实数据仅称“进一步证明有用”，缺少与标准方法的量化比较；样本量、随访时间及延迟效应分布未报告，信息不足。","pico":{"p":"非小细胞肺癌临床试验人群（摘要未报告样本量）","ic":"提出的Max 0-1加权log-rank检验 vs 传统log-rank检验；模拟研究及NSCLC临床试验数据分析"},"reason":"为免疫治疗延迟效应场景提供生存终点检验方法，影响晚期NSCLC免疫治疗试验的主要终点分析与统计设计，对胸部肿瘤免疫试验生存数据解读有方法学参考。","abstract_en":"In a cancer clinical trial with an immunotherapy, the treatment often becomes effective after a certain delay time. It is well known that traditional log-rank test no longer provides optimal power in this case. There has been a great interest to search for a more powerful test to detect a truly effective immunotherapy treatment. In this paper, we propose a new testing method based on the maximum value of a set of 0-1 weighted log-rank test statistics and establish useful theoretical results of the relevant test statistics. Extensive simulation studies are conducted to examine the empirical performance of the proposed method. An analysis of the real data from a non-small-cell lung cancer clinical trial is also carried out to further demonstrate the usefulness of the proposed test method. Trial Registration: ClinicalTrials.gov ID: NCT01903993, NCT02008227.","tags":["免疫治疗","延迟效应","log-rank检验","NSCLC","生存分析"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882306","pmid":"42882306","pmcid":"","doi":"10.3390/diagnostics16193151","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882306/","notice_url":"","trial_url":"","pub_date":"2026-Sep-28","briefing_date":"2026-10-18","journal_abbr":"Diagnostics (Basel)","journal_full":"Diagnostics (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（按SANRA撰写，非系统评价）· 汇总诊断率、安全性与RCT对比证据","category":"nodule","category_label":"肺结节与早筛管理","score_total":52,"score_breakdown":{"clinical":24,"methodology":13,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"RAB · 汇总meta分析","metric":"诊断率（ATS/ACCP严格定义）","val":"69.6%","stat":"","grounded":true,"checks":[{"num":"69.6%","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"RAB · 前瞻性多中心TARGET","metric":"经判定的严格诊断率","val":"61.6%","stat":"","grounded":true,"checks":[{"num":"61.6%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"RAB · 汇总分析（中间定义）","metric":"诊断率","val":"约84-87%","stat":"","grounded":true,"checks":[{"num":"84","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"87%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"RAB · 汇总分析","metric":"气胸率","val":"约2%","stat":"","grounded":true,"checks":[{"num":"2%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"CT引导经胸针吸活检","metric":"气胸率","val":"约20-25%","stat":"","grounded":true,"checks":[{"num":"20","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"25%","grounded":true,"note":"数值命中 断率69.6%；前瞻性多中心TARGET研究报告经判定的严格诊断率61.6%；采用中间定义（ATS/ACCP不建议作为主要诊断率指标）的汇总估计约为84-87%；RAB汇总分析气胸率约2%，CT引导经胸针吸活检约20-25%；随机RELIANT试验中RAB对电磁导航支气管镜为非劣效、但非优效；VERITAS中导航支气管镜作为一类对经胸针吸活检12个月诊断准确率为非劣效，且气胸更少。","authors_conclusion":"RAB是特定PPLs的有用选择，但严格定义下的表现比常被引用的中间定义诊断率更为有限；结局取决于病灶特征、取样策略、操作者经验、中心体量与影像设施。","ai_note":"叙述性综述、非系统评价，未提供系统检索流程、纳入研究的偏倚风险评估或异质性分析，汇总数值仅作定性引用；摘要同时给出严格定义（69.6%/61.6%）与中间定义（84-87%）两套诊断率，易被选择性引用为高诊断率；RAB与TTNB的气胸对比来自不同研究间的间接比较而非头对头；RELIANT为“非劣效但非优效”，摘要以“有用选择”收束，存在表述温和化的正向倾向；摘要称检索更新至2026年9月，时间点异常，需核对；对操作者经验、中心体量的影响仅有定性陈述，无量化。","pico":{"p":"外周肺病灶（PPLs）患者；具体样本量未在摘要报告","ic":"干预：机器人辅助支气管镜（RAB）；对照：电磁导航支气管镜、经胸针吸活检（TTNB）、常规/早期导航支气管镜"},"reason":"为外周肺结节的活检路径选择（机器人导航支气管镜 vs 电磁导航 vs 经胸穿刺）提供以严格定义诊断率为基准的对照数据，可用于术前谈话中的诊断率与气胸风险预期设定，并为结节诊断路径研究设定合理的效能假设与终点定义（避免采用中间定义抬高对照值）。","abstract_en":"The evaluation of peripheral pulmonary lesions (PPLs) is a persistent clinical challenge, made more pressing by the expansion of low-dose CT lung cancer screening. Conventional and earlier navigational bronchoscopy, including electromagnetic navigation, historically achieved diagnostic yields of approximately 60-70%, with CT-to-body divergence contributing to nondiagnostic sampling. This narrative review, prepared using the Scale for the Assessment of Narrative Review Articles (SANRA), summarizes robotic-assisted bronchoscopy (RAB) platform technology, procedural optimization, diagnostic performance, safety, molecular tissue adequacy, and emerging applications. A structured search was updated through September 2026; this is not a systematic review. Using the strict definition recommended by the American Thoracic Society/American College of Chest Physicians (ATS/ACCP), the most comprehensive meta-analysis reported a pooled RAB diagnostic yield of 69.6%, while the prospective multicenter TARGET study reported an adjudicated strict yield of 61.6%. Higher pooled estimates of approximately 84-87% generally use intermediate definitions that the ATS/ACCP statement recommends against as primary diagnostic-yield measures. RAB pneumothorax rates are approximately 2% in pooled analyses, compared with approximately 20-25% for CT-guided transthoracic needle biopsy. In the randomized RELIANT trial, RAB was non-inferior, but not superior, to electromagnetic navigation bronchoscopy; in VERITAS, navigational bronchoscopy as a category was non-inferior to transthoracic needle biopsy for 12-month diagnostic accuracy, with fewer pneumothoraces. RAB is a useful option for selected PPLs, but strict-definition performance is more modest than frequently quoted intermediate yields. Outcomes depend on lesion characteristics, sampling strategy, operator experience, center volume, and imaging infrastructure.","tags":["机器人辅助支气管镜","外周肺结节","诊断率","导航支气管镜","气胸","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42891250","pmid":"42891250","pmcid":"PMC13674026","doi":"10.1016/j.xjtc.2026.102497","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42891250/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"JTCVS Tech","journal_full":"JTCVS techniques","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"前瞻性单臂可行性研究（n=20）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":49,"score_breakdown":{"clinical":16,"methodology":15,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"总体","metric":"技术成功率","val":"90%","stat":"","grounded":true,"checks":[{"num":"90%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"意向治疗人群","metric":"平均定位误差","val":"7.9 mm","stat":"","grounded":true,"checks":[{"num":"7.9","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"总体","metric":"中位定位时间","val":"13.5分钟","stat":"","grounded":true,"checks":[{"num":"13.5","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"总体","metric":"中位确认性CBCT扫描次数","val":"1次","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"总体","metric":"并发症发生率","val":"5%","stat":"","grounded":true,"checks":[{"num":"5%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"总体","metric":"技术成功率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"意向治疗人群","metric":"平均定位误差","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"总体","metric":"中位定位时间","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「总体」无英文锚（词典未收录，宁误杀）"]},{"group":"总体","metric":"中位确认性CBCT扫描次数","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「总体」无英文锚（词典未收录，宁误杀）"]},{"group":"总体","metric":"并发症发生率","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「总体」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"扩展现实辅助混合手术室经皮肺结节定位的前瞻性单臂可行性研究：20例中技术成功率90%、平均定位误差7.9 mm","title_en":"Extended reality-assisted localization of lung nodules in a hybrid operating room: A prospective study.","authors":"Chang CH, Chien N, Hsieh HY, Yen KC, Zheng YA, Lee YC, Chen YS, Chiang XH et al.","affiliation_highlight":"Division of Thoracic Surgery, Department of Surgery, National Taiwan University Hospital and National Taiwan University …","results":"技术成功率90%；意向治疗人群平均定位误差7.9 mm；中位定位时间13.5分钟；中位确认性CBCT扫描1次；并发症发生率5%（1例气胸）；未发生肺内出血或空气栓塞。","authors_conclusion":"扩展现实辅助混合手术室经皮定位可行且安全，对小肺结节显示出可接受的准确性；该方法可能通过持续进针并减少重复中断来优化手术流程（相较传统CBCT引导）。","ai_note":"单臂无对照，无法验证作者关于较传统CBCT引导可优化流程的比较性结论；主要终点“技术准确性与安全性”缺乏预设可接受阈值，90%成功率与7.9 mm平均误差的临床可接受度未定义；未报告连续入组、失败原因、操作者经验及随访；样本量20例，外推受限。","pico":{"p":"20例拟行VATS亚肺叶切除的成人患者，外周肺结节≤2 cm","ic":"干预：全麻下扩展现实引导经皮染料定位（患者特异性3D全息模型+光学标记配准，随后CBCT确认）；对照：无（单臂）"},"reason":"为小肺结节VATS术前定位提供扩展现实+混合手术室的早期可行性基线，影响对新型数字引导定位流程的评估与后续对照研究设计。","abstract_en":"OBJECTIVE: To evaluate the feasibility, accuracy, and safety of a novel extended reality-assisted percutaneous localization technique in a hybrid operating room for patients with small pulmonary nodules. METHODS: In this prospective, single-arm study, 20 adult patients scheduled for video-assisted thoracoscopic surgery sublobar resection for peripheral pulmonary nodules (2 cm or less) were enrolled. Participants underwent extended reality-guided percutaneous dye localization under general anesthesia. Patient-specific 3-dimensional holographic models were registered using optical markers to guide needle insertion, followed by confirmatory cone-beam computed tomography. The primary outcomes were technical accuracy and procedural safety. RESULTS: The extended reality-assisted technique achieved a 90% technical success rate. The mean localization error was 7.9 mm in the intention-to-treat population. The procedure was efficient, with a median localization time of 13.5 minutes and a median of 1 confirmatory cone-beam computed tomography scan. The complication rate was 5%, involving a single case of pneumothorax; no intrapulmonary hemorrhage or air embolism occurred. CONCLUSIONS: Extended reality-assisted percutaneous localization in a hybrid operating room is feasible and safe, demonstrating acceptable accuracy for small pulmonary nodules. This approach may streamline surgical workflow by enabling continuous needle advancement and reducing repetitive interruptions compared with conventional cone-beam computed tomography guidance.","tags":["肺结节定位","扩展现实","混合手术室","单臂可行性","VATS亚肺叶切除"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889375","pmid":"42889375","pmcid":"PMC13669174","doi":"10.3389/fsurg.2026.1961761","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889375/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Surg","journal_full":"Frontiers in surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"Perspective/评论性论述 · 基于文献论证的决策框架，无原始研究数据","category":"surgery","category_label":"微创与无管化胸外科","score_total":49,"score_breakdown":{"clinical":24,"methodology":6,"specialty":19,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"年龄不是正确轴心：八旬早期非小细胞肺癌的手术选择应依据生理储备而非年龄","title_en":"Age is the wrong axis: rethinking surgical selection for octogenarians with early-stage non-small cell lung cancer.","authors":"Androutsopoulou V, Zotos PA, Magouliotis DE","affiliation_highlight":"Department of Cardiothoracic Surgery, Faculty of Medicine, University of Thessaly, Biopolis, Larissa, Greece.","results":"","authors_conclusion":"按生理储备而非年龄决定治疗强度，通过结构化老年评估、多学科协作、预康复和共享决策落实精细选择，并以老年患者真正重视的结局衡量成功。","ai_note":"述评/观点文章，无系统检索与原始数据；摘要所称“近期前瞻性数据”未给出引用或数值；“careful selection”标准未量化；未纳入被评估但未手术患者，存在选择偏倚；提出以衰弱工具替代年龄但未给出具体工具、阈值及验证证据。","pico":{"p":"早期、可手术NSCLC八旬患者（述评，无样本量）","ic":"干预/策略：以生理储备和衰弱评估指导治疗强度（肺叶切除、亚肺叶切除、SABR、主动监测）；对照：以年龄阈值决定手术资格（无正式比较）"},"reason":"为八旬早期NSCLC手术选择提供以生理储备/衰弱评估替代年龄阈值的决策框架，影响术前评估、治疗强度降级及共享决策。","abstract_en":"Lung cancer is increasingly a disease of older age, and as low-dose computed tomography screening extends into the ninth decade, a growing number of octogenarians present with early-stage, potentially curable non-small cell lung cancer. Faced with these patients, clinicians repeatedly ask a single question: is this patient too old for surgery? Recent prospective data show that selected octogenarians achieve long-term survival comparable to younger patients despite substantially higher complication rates, with quality of life that recovers over the first postoperative year. Yet the favorable result is attributed to careful selection that is rarely defined, and is seldom accompanied by any account of the patients who were assessed and not offered an operation. This article argues that chronological age is the wrong axis for the decision. Physiologic reserve, measurable through validated frailty instruments and established physiologic testing, predicts postoperative outcome far better than birth year, and aging is sufficiently heterogeneous that any age threshold misclassifies patients in both directions. A substantial competing risk of non-cancer death, compounded by overdiagnosis among screen-detected tumors, tempers the survival gain expected from aggressive treatment and makes overtreatment as real a hazard as age-based exclusion. A graded menu of options now exists, extending from minimally invasive lobectomy through sublobar resection and stereotactic ablative radiotherapy to active surveillance, and intensity should descend with reserve rather than with age. The task is to operationalize careful selection through structured geriatric assessment, multidisciplinary collaboration, prehabilitation, and shared decision-making, and to judge success by outcomes that older patients actually value.","tags":["老年肺癌","手术选择","衰弱评估","早期NSCLC","共享决策"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890849","pmid":"42890849","pmcid":"PMC13672329","doi":"10.3389/fimmu.2026.1970912","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890849/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Treatment context is associated with thrombocytopenia report phenotypes in lung cancer: an active-comparator analysis of FAERS and JADER.","title_en":"Treatment context is associated with thrombocytopenia report phenotypes in lung cancer: an active-comparator analysis of FAERS and JADER.","authors":"Yang F, Jiang Q, Wei Z, Hu T","affiliation_highlight":"Department of Thoracic Surgery, Leshan People's Hospital, Leshan, Sichuan, China.","results":"BACKGROUND: Thrombocytopenia during immune checkpoint inhibitor treatment in lung cancer may be coded as immune, marrow suppression, coagulation, or non-specific. We tested whether coding-defined report phenotypes differ…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Thrombocytopenia during immune checkpoint inhibitor treatment in lung cancer may be coded as immune, marrow suppression, coagulation, or non-specific. We tested whether coding-defined report phenotypes differed across co-reported treatment contexts. METHODS: We analyzed FAERS (2015Q1-2026Q2) and JADER through Japanese fiscal 2025Q4 (31 March 2026). Strict primary lung cancer reports were grouped as ICI without chemotherapy (C1), ICI plus chemotherapy (C2), or chemotherapy without ICI (C3). Firth models compared mutually exclusive immune-like and marrow-like anchors. Complementary analyses evaluated the broad cohort, treatment date compatibility, C3 small-cell influence, phenotype variants, onset windows, treatment-variable ablation in elastic-net report phenotype models, and a 120-report random stratified blinded review with independent ratings, third-person adjudication, inverse-selection weighting, and bootstrap uncertainty. RESULTS: FAERS included 1,362 immune-like or marrow-like anchors. Relative to C1, adjusted odds ratios (ORs) for immune-like versus marrow-like phenotype were 0.111 (95% CI, 0.069-0.173) in C2 and 0.014 (0.006-0.029) in C3; C3 was exploratory because only eight reports were immune-like. In 2,835 broad cohort reports, adjusted immune-like composition was 13.0% (95% bootstrap interval, 11.0%-15.1%) in C1 and 4.7% (3.4%-6.2%) in C2. Treatment date and stricter phenotype analyses were directionally consistent. JADER reproduced the C2 versus C1 direction but showed calibration shift; treatment-variable ablation reduced cross-database discrimination. Reviewers agreed on 111/120 reports (92.5%; 95% CI, 87.5%-96.7%; Cohen's κ, 0.897; Gwet's AC1, 0.901). In the locked 927-report frame, design-weighted final categories were 23.4% immune probable, 37.3% immune possible, 13.6% indeterminate, and 25.8% non-immune probable. Among 100 determinate reports, weighted AUROC was 0.892 (0.827-0.948), PR-AUC 0.956 (0.922-0.982), and calibration-in-the-large intercept 2.054 (1.707-2.432), indicating underprediction. CONCLUSION: Coding-defined thrombocytopenia report composition differed across treatment contexts. Blinded review supported reproducible structured category assignment and score-based report ordering, while calibration shift and treatment-variable ablation defined important limits. Findings support pharmacovigilance case prioritization and hypothesis generation, not clinical diagnosis, incidence estimation, patient-level etiologic attribution, or causal inference.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42887496","pmid":"42887496","pmcid":"","doi":"10.1016/j.ccell.2026.08.003","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42887496/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Cancer Cell","journal_full":"Cancer Cell","tier":"S","if_val":56.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"评论/述评（非原始研究）· 评述firmonertinib在PACC突变NSCLC的临床前与早期临床数据","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":48,"score_breakdown":{"clinical":10,"methodology":5,"specialty":18,"journal":15},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"评论：Firmonertinib用于EGFR PACC突变NSCLC的临床前特征与早期系统及颅内疗效证据","title_en":"One structural class, one treatment? Firmonertinib in PACC-mutant NSCLC.","authors":"Huang DD, Yang JC","affiliation_highlight":"Department of Medical Oncology, National Taiwan University Cancer Center, Taipei, Taiwan; Department of Oncology, Nation…","results":"","authors_conclusion":"supporting its further clinical development in this challenging mutation class","ai_note":"本文为Cancer Cell评论/述评而非原始研究；摘要无样本量、效应值、对照及统计量，所述“promising systemic and intracranial efficacy”无法在摘要层面核验；需回到Le et al.原文判断主要终点与方法学。","pico":{"p":"EGFR PACC突变非小细胞肺癌（NSCLC）；样本量摘要未报告","ic":"firmonertinib（广谱CNS穿透性TKI）；摘要未报告对照"},"reason":"提示EGFR PACC突变NSCLC可能成为firmonertinib后续临床开发方向，但当前仅为评论性证据，不能直接改变临床决策；可作为靶向治疗选题与试验设计背景。","abstract_en":"EGFR PACC-mutant non-small cell lung cancer (NSCLC) has limited treatment options. In this issue of Cancer Cell, Le et al. report preclinical profiles and promising systemic and intracranial efficacy of the broad-spectrum CNS-penetrant tyrosine kinase inhibitor firmonertinib in PACC-mutant NSCLC, supporting its further clinical development in this challenging mutation class.","tags":["EGFR PACC","firmonertinib","NSCLC","CNS穿透","评论"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"S"}},{"id":"pmid_42884445","pmid":"42884445","pmcid":"","doi":"10.3390/s26196246","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42884445/","notice_url":"","trial_url":"","pub_date":"2026-Oct-01","briefing_date":"2026-10-18","journal_abbr":"Sensors (Basel)","journal_full":"Sensors (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"算法开发与回顾性实验研究 · 基于LUNA16交叉验证协议的检测性能比较","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":48,"score_breakdown":{"clinical":14,"methodology":18,"specialty":16,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"轴位单视图基线","metric":"CPM","val":"0.553","stat":"","grounded":true,"checks":[{"num":"0.553","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"轴位单视图基线","metric":"每扫描候选数","val":"32.61","stat":"","grounded":true,"checks":[{"num":"32.61","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"多视图配置，名义20,000张背景图像","metric":"CPM","val":"0.863","stat":"","grounded":true,"checks":[{"num":"0.863","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"多视图配置，名义20,000张背景图像","metric":"每扫描平均候选数","val":"9.11","stat":"","grounded":true,"checks":[{"num":"9.11","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"轴位单视图基线","metric":"CPM","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「轴位单视图基线」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"轴位单视图基线","metric":"每扫描候选数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「轴位单视图基线」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"多视图配置，名义20,000张背景图像","metric":"CPM","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「多视图配置」无英文锚（词典未收录，宁误杀）","人群限定「名义」无英文锚（词典未收录，宁误杀）","人群限定「张背景图像」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"多视图配置，名义20,000张背景图像","metric":"每扫描平均候选数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「多视图配置」无英文锚（词典未收录，宁误杀）","人群限定「名义」无英文锚（词典未收录，宁误杀）","人群限定「张背景图像」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"基于多视图与背景负样本的YOLOv8x肺结节检测：LUNA16交叉验证中提高CPM并减少每扫描候选数","title_en":"Lung Nodule Detection and False Positive Reduction Using Multi-View and Background Images.","authors":"Silva L, Pedrini H","affiliation_highlight":"Venturus-Innovation & Technology, Campinas 13086-530, Brazil.","results":"轴位基线CPM 0.553，每扫描32.61个候选；名义预算20,000张背景图像的多视图配置CPM 0.863，每扫描平均候选数降至9.11；摘要未报告敏感度具体数值及95%CI/P值","authors_conclusion":"多解剖视图与背景负样本训练的结合可显著减少CT肺结节检测中的虚假候选。","ai_note":"摘要仅突出CPM与每扫描候选数，未给出敏感度具体数值及置信区间/统计检验；多视图与背景负样本的各自贡献未通过析因或消融结果分离；比较涉及“名义20,000张背景图像”预算，配置公平性信息不足；仅使用LUNA16/LIDC-IDRI公开数据集交叉验证，无外部数据集或临床读者研究验证。","pico":{"p":"LUNA16/LIDC-IDRI肺结节CT数据集；摘要未报告样本量","ic":"干预：YOLOv8x结合轴位、冠状位、矢状位多视图表示，加入少于3名放射科医生标注的LIDC-IDRI标注簇作为辅助阳性样本，并以无结节背景切片作为阴性训练样本；对照：轴位单视图基线及不同背景图像预算配置"},"reason":"为肺结节CAD的假阳性抑制提供多视图与背景负样本训练的实验基线，可影响后续结节检测算法设计与验证方案选择，但尚不足以直接改变临床随访决策。","abstract_en":"This paper presents a lung nodule detection and false positive reduction approach based on YOLOv8x, multi-view CT representations, and background slices used as negative samples. Lung cancer remains one of the leading causes of cancer-related mortality worldwide, and early detection is essential to improve patient survival. Although computed tomography (CT)
