ies remains to be established. We evaluated survival across treatment sequences within a real-world cohort. MATERIALS AND METHODS: This retrospective, two-centre study included 101 patients with HER2-positive BCBM treated with cranial RT plus pyrotinib (June 2018-July 2025). Based on treatment sequence, patients were categorized into: concurrent RT and pyrotinib (Group A, n = 41); RT after intracranial progression on pyrotinib (Group B, n = 38); and pyrotinib upon progression following RT (Group C, n = 22). The primary endpoint was CNS-PFS. Survival outcomes were assessed via Kaplan-Meier estimation and Cox proportional hazards models. RESULTS: At a median follow-up of 43.3 months, 63 patients (62.4%) had died and 70 (69.3%) experienced CNS-PFS events. Median CNS-PFS was 14.8 months (95% CI 10.68-19.92) overall, and 14.3, 15.0, and 21.4 months in groups A, B, and C, respectively (P = 0.252); median OS was 36.0 months (95% CI 28.0-39.7) overall, and 33.0, 35.4, and 42.0 months in groups A, B, and C, respectively (P = 0.281). Focal cranial RT was independently associated with longer OS (HR 0.56, 95% CI 0.34-0.94; P = 0.028). Any-grade adverse events occurred in 100 of 101 patients (99.0%); grade ≥ 3 events occurred in 2.4%, 7.9%, and 4.5% of groups A, B, and C, respectively (all P > 0.05), and radiation necrosis occurred in 7 patients (6.9%). An exploratory threshold of RT initiated >3.9 months before pyrotinib (OS 49.9 vs 29.8 months; HR 0.31, 95% CI 0.11-0.91; P = 0.025) did not withstand internal validation. CONCLUSIONS: Treatment sequence did not significantly affect OS or CNS-PFS. Focal cranial RT was independently associated with longer survival, and toxicity was manageable. The proposed timing threshold is hypothesis-generating and warrants prospective validation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42927245","pmid":"42927245","pmcid":"PMC13694971","doi":"10.1016/j.ctro.2026.101326","nct_id":"NCT07721181","url":"https://pubmed.ncbi.nlm.nih.gov/42927245/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT07721181","pub_date":"2027-Jan","briefing_date":"2026-10-26","journal_abbr":"Clin Transl Radiat Oncol","journal_full":"Clinical and Translational Radiation Oncology","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Radiotherapy dose escalation for the non-operative management of patients with unresectable locally recurrent rectal cancer (STEP-UP): Study protocol for a multicentre, prospective, open-label feasibility study.","title_en":"Radiotherapy dose escalation for the non-operative management of patients with unresectable locally recurrent rectal cancer (STEP-UP): Study protocol for a multicentre, prospective, open-label feasibility study.","authors":"Vande Kerckhove FEC, Beeftink JL, Tijssen RHN, Zijlstra J, Verrijssen AE, van Kuijk SMJ, van Ravensteijn SG, van Hellemond IEG et al.","affiliation_highlight":"Department of Surgery, Catharina Hospital, Eindhoven, the Netherlands.","results":"BACKGROUND: Curative-intent management of locally recurrent rectal cancer (LRRC) generally comprises neoadjuvant therapy and surgery. In patients with unresectable LRRC, where surgical intervention is not feasible, manag…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Curative-intent management of locally recurrent rectal cancer (LRRC) generally comprises neoadjuvant therapy and surgery. In patients with unresectable LRRC, where surgical intervention is not feasible, management is limited to non-operative bimodality therapy with systemic therapy and radiotherapy. Evidence guiding the optimisation of non-operative management remains limited. In this context, the therapeutic goal is to achieve prolonged local control while minimising treatment-related adverse events and preserving quality of life. Radiotherapy dose escalation has been proposed as a potential strategy to achieve this balance. However, its feasibility and safety in the non-operative management of unresectable LRRC have not yet been established. As such, this study aims to evaluate the feasibility and safety of this radiotherapeutic approach, and to determine its impact on both symptom control and oncological outcomes. METHODS: This prospective, multicentre, single-arm feasibility study will enrol 30 patients with unresectable or inoperable LRRC without distant metastases, or with (oligo)metastatic disease not requiring immediate systemic therapy. Previously irradiated patients will undergo reirradiation with stereotactic body radiotherapy (re-SBRT; 5 × 9 Gy) when feasible, or, alternatively hyperfractionated chemo-reirradiation (50.4 Gy in 1.2 Gy twice-daily fractions with concurrent capecitabine). Radiotherapy-naïve patients will receive chemoradiotherapy with a simultaneous integrated boost (25 × 2.6 Gy, EQD2Gyα/β=5Gy of 71 Gy with concurrent capecitabine). [1] The primary endpoint is treatment regimen feasibility, defined as grade ≥ 3 acute radiotherapy-related adverse events (CTCAE version 5.0) occurring in no more than seven patients (23%). Secondary endpoints include late adverse events, quality of life and symptom control, and 1- and 3-year progression-free survival, disease-free survival, and overall survival. DISCUSSION: This protocol describes the STEP-UP study, which will determine the feasibility of radiotherapy dose escalation in unresectable LRRC. If feasible and safe, this approach could provide an effective treatment intensification strategy to improve local control and symptom burden in patients with unresectable LRRC, addressing a major unmet clinical need. TRIAL REGISTRATION: ClinicalTrials.gov: NCT07721181Overview of Medical-Scientific Research in the Netherlands (OMON) Registry: NL-011150.International Clinical Trial Registry Platform (ICTRP): NL-OMON61161.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923178","pmid":"42923178","pmcid":"PMC7136175","doi":"10.1245/s10434-010-1539-5","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923178/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Prognostic value of lymph node ratio in children with wilms tumor: a systematic review and meta-analysis.","title_en":"Prognostic value of lymph node ratio in children with wilms tumor: a systematic review and meta-analysis.","authors":"Dong J, Ni J, Li L, Fang K","affiliation_highlight":"PICU of Luoyang Maternal and Child Health Hospital, Luoyang, China.","results":"BACKGROUND: Lymph node (LN) involvement is a critical determinant of staging and prognosis in Wilms tumor (WT). However, conventional binary nodal staging (positive vs.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lymph node (LN) involvement is a critical determinant of staging and prognosis in Wilms tumor (WT). However, conventional binary nodal staging (positive vs. negative) is often compromised by significant variability in surgical lymph node sampling. The lymph node ratio (LNR), which integrates metastatic burden and sampling adequacy, has emerged as a potential prognostic alternative. This systematic review and meta-analysis evaluated whether LNR serves as an independent predictor of survival outcomes in children with WT. METHODS: A systematic query of PubMed, MEDLINE, Embase, Web of Science, the Cochrane Central Register of Controlled Trials (CENTRAL), and ClinicalTrials.gov was executed, covering the period from their earliest records through May 10, 2026. Retrospective cohort studies reporting hazard ratios (HRs) or risk ratios (RRs) for survival outcomes based on LNR in children with WT were included. Overall survival (OS) was the primary outcome; 5-year, 10-year, and 20-year OS were secondary outcomes. Prespecified subgroup analyses were performed by LNR cutoff (≥0.40 vs. <0.40). RESULTS: Six retrospective cohort studies involving 4,190 patients met the inclusion criteria. High LNR was significantly associated with poorer overall survival (HR = 2.10; 95% CI: 1.67-2.64). This prognostic significance persisted across secondary outcomes, including 5-year OS (RR = 1.14; 95% CI: 1.11-1.17), 10-year OS (RR = 1.19; 95% CI: 1.15-1.23), and 20-year OS (RR = 1.14; 95% CI: 1.10-1.19). Subgroup analysis revealed no significant interaction based on the LNR cutoff (P = 0.74). Sensitivity analyses confirmed the robustness and stability of the pooled findings. CONCLUSIONS: Higher LNR appears to be associated with poorer overall survival in children with WT and may serve as a useful prognostic indicator. By accounting for both nodal disease burden and surgical effort, LNR may provide additional prognostic information beyond conventional nodal status. While LNR represents a valuable adjunct for individualized treatment decisions, prospective studies are required to establish standardized clinical cut-offs and integrate LNR into formal risk-adapted protocols. SYSTEMATIC REVIEW REGISTRATION: https://www.crd.york.ac.uk/PROSPERO/, identifier CRD420261396220.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42925957","pmid":"42925957","pmcid":"","doi":"10.1016/j.radonc.2026.111832","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925957/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-26","journal_abbr":"Radiother Oncol","journal_full":"RADIOTHERAPY AND ONCOLOGY","tier":"A","if_val":5.8,"zone":"JCR Q1 · 2区","warned":false,"study_type":"临床前转化研究 · 配对肿瘤活检转录组分析（n=42）+ 直肠癌细胞系机制实验 + SW837皮下移植瘤体内验证","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":39,"score_breakdown":{"clinical":8,"methodology":17,"specialty":6,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"背景/现存TNT疗效","metric":"完全缓解率(pCR)","val":"约30%","stat":"","grounded":true,"checks":[{"num":"30%","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"配对活检转录组队列","metric":"样本量","val":"42","stat":"","grounded":true,"checks":[{"num":"42","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"SW837移植瘤","metric":"tolinapant+放疗 vs 单纯放疗的肿瘤体积差异","val":"未报告具体数值","stat":"未达统计学显著性（未报告P值）","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"背景/现存TNT疗效","metric":"完全缓解率(pCR)","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「背景」无英文锚（词典未收录，宁误杀）","人群限定「现存」无英文锚（词典未收录，宁误杀）","人群限定「疗效」无英文锚（词典未收录，宁误杀）"]},{"group":"配对活检转录组队列","metric":"样本量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「配对活检转录组」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"SW837移植瘤","metric":"tolinapant+放疗 vs 单纯放疗的肿瘤体积差异","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「837」未在原摘要出现","人群限定「移植瘤」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"IAP抑制剂在直肠癌临床前模型中增强放化疗反应：配对抗检转录组提示TNFα凋亡通路激活，但移植瘤联合放疗疗效差异未达统计学显著","title_en":"IAP inhibition enhances response to radiotherapy and chemotherapy in preclinical models of rectal cancer.","authors":"O'Brien T, Wright T, Downs M, Sharkey S, Higgins C, Blayney J, Ishaqwala FMF, Tang L et al.","affiliation_highlight":"Johnston Cancer Research Centre, Queen's University Belfast, Northern Ireland, UK.","results":"放疗后TNFα/TNFR1信号及凋亡相关基因集显著上调，GSEA显示\"TNFα signalling via NFκB\"与\"Apoptosis\"通路富集；TNF、TNFRSF1A、RIPK1、TRADD、CFLAR(FLIP)上调，DIABLO下调。Tolinapant可降解cIAP1/2并显著增强放疗诱导的直肠癌模型凋亡；联合TNFα经caspase-8依赖机制进一步放大凋亡。体内：tolinapant联合放疗耐受良好，SW837移植瘤体积较单纯放疗缩小，但差异未达统计学显著性。Tolinapant增强化疗诱导凋亡并抑制5-FU诱导的DTP细胞出现。背景数据：TNT完全缓解率约30%。","authors_conclusion":"研究结果将TNFα相关凋亡信号确定为直肠癌放疗诱导的潜在脆弱点，并为放疗联合IAP拮抗剂提供机制学依据；tolinapant同时增强化疗诱导的凋亡并抑制耐药持久细胞，支持进一步研究IAP拮抗作为改善直肠癌新辅助TNT疗效的策略。","ai_note":"主要体内疗效终点为阴性（移植瘤联合治疗与单纯放疗差异无统计学意义），摘要未给出该差异的具体数值、样本量或P值，却在结论中以\"机制学依据\"与\"支持进一步研究\"的口径推进，属典型的以体外机制与替代终点支撑弱体内证据的选择性强调；体内实验动物数量、随机化与盲法信息不足；DTP抑制与caspase-8依赖机制均为体外结果，向人体TNT的转化跨度大；活检转录组为描述性通路富集，未与患者疗效终点（如CR/TRG）关联，不能证明IAP表达水平具有预测价值。","pico":{"p":"新辅助放疗前及放疗2周后的直肠癌活检组织配对样本 n=42（转录组分析）；体外直肠癌模型及SW837移植瘤模型（动物样本量摘要未报告）","ic":"干预：IAP拮抗剂 tolinapant（单药/联合放疗/联合5-FU，部分实验联合TNFα）；对照：单纯放疗或单纯化疗（体内为放疗单药对照）"},"reason":"为直肠癌新辅助TNT耐药（凋亡逃逸、5-FU耐药持久细胞）提供了一条可检验的机制假说与临床前对照基线，提示IAP拮抗联合放疗的体内疗效证据尚不成立；对胸外科/胸部肿瘤的直接诊疗决策影响有限，仅可作为放化疗抵抗与DTP概念的跨瘤种参考。","abstract_en":"INTRODUCTION: The modern management of locally advanced rectal cancer (LARC) involves sequential radiotherapy and chemotherapy, termed Total Neoadjuvant Therapy (TNT). Although TNT significantly improves tumour regression and achieves complete response rates of approximately 30 %, treatment efficacy remains limited in part by tumour-intrinsic resistance to apoptosis. We therefore sought to investigate the effects of radiotherapy on TNFα-associated apoptotic signalling in rectal cancer and evaluate whether inhibition of Inhibitor of Apoptosis Proteins (IAPs) could enhance treatment response. METHODS: Transcriptomic profiling was performed on rectal tumour biopsies obtained before and after two weeks of neoadjuvant radiotherapy (n = 42). Gene Set Enrichment Analysis was used to identify pathways altered following radiotherapy. The clinically relevant IAP antagonist, tolinapant, was evaluated in rectal cancer models to assess effects on cIAP1/2 degradation, radiation- and chemotherapy-induced apoptosis, and formation of 5-fluorouracil (5FU)-induced drug-tolerant persister (DTP) cells. Mechanistic studies were performed in the presence of TNFα, and in vivo efficacy was assessed in SW837 xenograft models. RESULTS: Radiotherapy induced robust upregulation of TNFα/TNFR1 signalling and apoptosis-associated gene sets. Gene Set Enrichment Analysis confirmed enrichment of both \"TNFα signalling via NFκB\" and \"Apoptosis\" pathways. Upregulation of TNF, TNFRSF1A, RIPK1, TRADD, and CFLAR (FLIP) was observed alongside downregulation of DIABLO, suggesting that radiotherapy primes tumours for TNFα-mediated apoptosis but that elevated antiapoptotic signalling may suppress this response. Tolinapant degraded cIAP1/2 and significantly enhanced radiation-induced apoptosis in rectal cancer models. Co-treatment with TNFα further amplified apoptosis through a caspase-8-dependent mechanism. The combination of tolinapant and radiation was well-tolerated in vivo and reduced SW837 xenograft tumour volume compared to radiation alone; however, this difference did not meet statistical significance. Tolinapant also potentiated chemotherapy-induced apoptosis and prevented the emergence of 5FU-induced DTP rectal cancer cells. CONCLUSION: These findings identify TNFα-associated apoptotic signalling as a potential radiation-induced vulnerability in rectal cancer and provide a mechanistic rationale for combining radiotherapy with IAP antagonists. Tolinapant also enhanced apoptosis induced by chemotherapy whilst suppressing drug-tolerant persisters, supporting further investigation of IAP antagonism as a strategy to improve TNT efficacy in the neoadjuvant management of rectal cancer.","tags":["直肠癌","TNT新辅助治疗","IAP拮抗剂","tolinapant","放疗抵抗","凋亡信号"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927416","pmid":"42927416","pmcid":"PMC13695517","doi":"10.1002/ccs3.70121","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927416/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-26","journal_abbr":"J Cell Commun Signal","journal_full":"Journal of cell communication and signaling","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前基础研究 · 转录组筛选＋LUAD细胞系与患者来源类器官功能/机制验证（无动物体内实验、无临床队列验证）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":6,"methodology":16,"specialty":13,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"去泛素化酶USP5通过去泛素化并稳定GPX3抑制肺腺癌铁死亡（细胞系与患者来源类器官水平的机制研究）","title_en":"Deubiquitinase USP5 suppresses ferroptosis in lung adenocarcinoma by deubiquitinating and stabilizing GPX3.","authors":"Fan X, Lin Y, Zhen Z, Gao Y, Zhen W, Zeng S, Ji Y, Huang K et al.","affiliation_highlight":"Department of Oncology Xiamen Haicang Hospital Xiamen Fujian China.","results":"","authors_conclusion":"USP5是LUAD中铁死亡的关键抑制因子，通过稳定GPX3发挥作用，揭示USP5-GPX3调控轴使肿瘤抵抗氧化应激；靶向该通路可能是有前景的治疗策略。","ai_note":"摘要通篇无任何具体数值（无HR/CI、无P值、无存活率或 marker 定量），仅用“significantly upregulated”“correlated with poor prognosis”等定性表述，预后相关性缺乏效应量与统计支持；机制证据全部来自体外细胞系与类器官，缺少体内模型与临床样本干预验证，向“治疗策略”的外推跨度较大；功能实验未说明USP5调控方式（敲低/过表达）与重复次数；铁死亡判定依赖“established markers”但未列明具体指标。","pico":{"p":"公共NSCLC数据集转录组分析；两株肺腺癌（LUAD）细胞系；患者来源LUAD类器官（摘要未给出样本量/株数细节）","ic":"以铁死亡诱导剂erastin处理为背景，比较USP5功能调控（敲低/过表达，摘要未明示具体操作）对铁死亡、存活、增殖与侵袭的影响；机制上检测USP5与GPX3结合、去泛素化与稳定性，并行GPX3回复（rescue）实验"},"reason":"为LUAD铁死亡逃逸机制提供可检验的USP5-GPX3轴假说，可作为铁死亡相关靶点与预后标志物研究的机制对照/立题依据，但不直接改变当前患者选择或随访决策。","abstract_en":"Ferroptosis is a regulated form of cell death driven by iron-dependent lipid peroxidation and has emerged as a promising therapeutic target in nonsmall cell lung cancer (NSCLC). However, the specific mechanisms by which nonsmall cell lung cancer cells evade ferroptosis remain to be further elucidated. We conducted integrative transcriptomic analyses of published NSCLC datasets to identify ubiquitin-specific proteases (USPs) potentially involved in the regulation of ferroptosis. Multiple USP proteins were screened and their prognostic significance evaluated, ultimately selecting USP5 for functional studies in two lung adenocarcinoma (LUAD) cell lines and patient-derived LUAD organoids. Following treatment with the ferroptosis inducer erastin, survival rates and metastatic capacity were assessed. Ferroptosis was evaluated by measuring established ferroptotic markers and examining mitochondrial ultrastructure. Protein interactions were investigated using mass spectrometry, immunoprecipitation, and GST pull-down assays. USP5 was significantly upregulated in LUAD tissues and correlated with poor patient prognosis. Functional experiments demonstrated that USP5 suppresses ferroptosis in LUAD cells treated with erastin, thereby promoting cell survival, proliferation, and invasiveness. Mechanistically, USP5 directly binds to and deubiquitinates GPX3, a key antioxidant enzyme, to enhance its stability. Rescue experiments confirmed that GPX3 is a functional mediator of USP5's ferroptosis-inhibitory role. These findings are further supported in patient-derived LUAD organoids. Our study identifies USP5 as a critical suppressor of ferroptosis in LUAD through its stabilization of GPX3, revealing a novel USP5-GPX3 regulatory axis that enables tumor resistance to oxidative stress. Targeting this pathway may represent a promising therapeutic strategy.","tags":["肺腺癌","铁死亡","去泛素化酶USP5","GPX3","类器官","临床前机制研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42927379","pmid":"42927379","pmcid":"PMC13695421","doi":"10.7717/peerj.21835","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927379/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"PeerJ","journal_full":"PeerJ","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Machine learning-derived intracellular protein-based prognostic model reflecting a senescence-associated secretory phenotype-driven immunosuppressive microenvironment in lung adenocarcinoma.","title_en":"Machine learning-derived intracellular protein-based prognostic model reflecting a senescence-associated secretory phenotype-driven immunosuppressive microenvironment in lung adenocarcinoma.","authors":"Chang X, Jiang L, Zhang L, Ren T, Fan C, Li P","affiliation_highlight":"Department of Oncology, Xi'an Chang'an District Hospital, Xi'an, Shaanxi, China.","results":"BACKGROUND: This study aimed to investigate the associations of senescence-associated secretory phenotype (SASP)-related genes with the tumor immune microenvironment (TIME) and clinical outcomes in lung adenocarcinoma (L…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: This study aimed to investigate the associations of senescence-associated secretory phenotype (SASP)-related genes with the tumor immune microenvironment (TIME) and clinical outcomes in lung adenocarcinoma (LUAD) and to develop and evaluate a prognostic signature for risk stratification and exploratory treatment-response prediction. METHODS: Non-negative matrix factorization (NMF) was conducted to identify distinct molecular subtypes. Least absolute shrinkage and selection operator (LASSO), Random Forest, and extreme gradient boosting (XGBoost) were utilized to identify core prognostic SASP genes. The expression patterns of selected SASP-related genes were explored using multi-omics datasets, LUAD cell lines, and clinical specimens. RESULTS: Cluster 1 was associated with significantly shorter overall survival (OS), enhanced senescence pathway activity, and computationally inferred immunosuppressive and immune-exclusion features. Five intracellular SASP regulators-ANGPTL4, CDKN2A, H2AX, MMP1, and CCL20-were selected through machine learning to construct the SASP Protein Regulator Score (SASP-PRS). A high SASP-PRS was associated with the activation of senescence/SASP and cell-cycle pathways, suppression of antitumor immune signatures, and distinct immune-checkpoint and chemokine expression profiles. A higher SASP-PRS was also associated with advanced disease stage, poorer OS, predicted lower responsiveness to immunotherapy, lower predicted sensitivity to erlotinib, and higher predicted sensitivity to selected chemotherapeutic agents. The nomogram incorporating the SASP-PRS demonstrated discriminatory ability and calibration for predicting 1-, 3-, and 5-year OS in the analyzed LUAD cohorts. CONCLUSION: These findings suggest that SASP-related gene-expression patterns are associated with LUAD molecular subtypes, senescence signaling, computationally inferred immune features, and treatment-related outcomes. The SASP-PRS may serve as a potential biomarker for prognostic stratification in LUAD. However, its utility for treatment-response assessment remains exploratory. Prospective external validation and functional studies are required to establish its clinical applicability and clarify the mechanisms linking SASP-related networks to the LUAD immune microenvironment.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923239","pmid":"42923239","pmcid":"PMC11497949","doi":"10.1080/14796694.2024.2376521","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923239/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Case Report: Genotype-informed management after clinically necessary cytoreduction for giant recurrent gastric gastrointestinal stromal tumor with prior rupture and KIT exon 17 N822Y mutation.","title_en":"Case Report: Genotype-informed management after clinically necessary cytoreduction for giant recurrent gastric gastrointestinal stromal tumor with prior rupture and KIT exon 17 N822Y mutation.","authors":"Rui J, Cai C, Chen Y, Xu T, Wang Z, Zhuo G, Gan L, Xue L et al.","affiliation_highlight":"Department of Abdominal Surgery, Xiamen Cancer Hospital, The First Affiliated Hospital of Xiamen University, Xiamen, Chi…","results":"Advanced recurrent gastrointestinal stromal tumor (GIST) after prolonged tyrosine kinase inhibitor (TKI) exposure requires integration of surgical oncology, molecular reassessment, and continuous systemic therapy. We rep…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Advanced recurrent gastrointestinal stromal tumor (GIST) after prolonged tyrosine kinase inhibitor (TKI) exposure requires integration of surgical oncology, molecular reassessment, and continuous systemic therapy. We report a 72-year-old man with a 21-year history of gastric GIST who underwent initial resection in 2005, resection of recurrent disease in 2009, and long-term imatinib therapy. After years of apparent disease stability, he independently reduced imatinib and had a prolonged surveillance gap before recurrence was detected in 2024. Following tumor rupture and short-interval progression on sunitinib and regorafenib, he received ripretinib. In January 2026, clinically necessary maximal cytoreductive surgery was performed for bulky recurrent peritoneal disease with bleeding, anemia, abdominal-wall involvement, high risk of re-rupture, and invasion or close involvement of the right colon. Pathology confirmed recurrent high-risk spindle-cell GIST. Postoperative next-generation sequencing identified a founding KIT exon 11 deletion and a secondary KIT exon 17 p.Asn822Tyr activation-loop mutation; ripretinib was resumed after recovery of oral intake. Three-month CT showed recurrent peritoneal tumors, while a right hepatic subcapsular low-enhancement nodule was favored to represent post-ablation change. This case illustrates that surgery in resistant recurrent GIST may be necessary for local complication control and tissue acquisition, but even after maximal macroscopic cytoreduction, durable management depends on continuous genotype-informed systemic therapy and close surveillance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923113","pmid":"42923113","pmcid":"PMC11848972","doi":"10.1002/pros.24845","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923113/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Sexual behavior-related exposures, sexually transmitted infections, and viral markers in relation to prostate cancer risk: a systematic review and meta-analysis.","title_en":"Sexual behavior-related exposures, sexually transmitted infections, and viral markers in relation to prostate cancer risk: a systematic review and meta-analysis.","authors":"Liang P, Gu H, Liu J, Liu Y, Chen L, Che P","affiliation_highlight":"Department of General Practice, People's Hospital of Chongqing Hechuan, Chongqing, China.","results":"BACKGROUND: Sexual behavior, sexually transmitted infections (STIs), and viral markers have been investigated in relation to prostate cancer, but heterogeneous exposure definitions and ascertainment methods complicate in…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Sexual behavior, sexually transmitted infections (STIs), and viral markers have been investigated in relation to prostate cancer, but heterogeneous exposure definitions and ascertainment methods complicate interpretation. We synthesized observational evidence separately across biologically and methodologically distinct exposure domains. METHODS: We followed PRISMA 2020 and searched PubMed/MEDLINE, Embase.com, and Web of Science Core Collection from inception through 27 May 2026. Eligible studies were comparative observational studies evaluating sexual behavior-related exposures, STI history or serology, or viral markers in relation to prostate cancer. Random-effects meta-analysis was performed for sufficiently comparable estimates. Risk of bias was assessed using Newcastle-Ottawa Scale domains, supplemented by design-specific epidemiological considerations. GRADE was used as a post-registration evidence-certainty assessment. RESULTS: Of 121 reports assessed for eligibility, 57 primary observational reports were included after final eligibility reconciliation. Twenty-five reports entered at least one pooled model and three additional reports appeared only in descriptive forest plots. For tissue- or PCR-based HPV detection, the observed pooled association was OR 3.01 (95% CI 1.97-4.61; I²=36.2%; prediction interval 1.15-7.91; 13 studies). HPV16 and HPV18 tissue/PCR subtype estimates were also elevated, whereas HPV serology showed no clear association. Estimates for Trichomonas vaginalis serology and history-based STI exposure were imprecise or heterogeneous, and sexual-behavior exposures were too heterogeneous for pooling. Certainty was very low across all evaluated exposure domains. CONCLUSIONS: Tissue- or PCR-based HPV detection was more frequent among prostate cancer cases in the available comparative studies, but the evidence is very uncertain because of risk of bias, limited temporal clarity, sampling and comparator differences, and other methodological limitations. These findings should not be interpreted as establishing an etiologic or causal effect and do not support prostate-cancer prevention recommendations based on HPV vaccination, STI screening, or sexual-behavior modification. SYSTEMATIC REVIEW REGISTRATION: https://www.crd.york.ac.uk/prospero/display_record.php?RecordID=1334823, identified: CRD420261334823.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42921019","pmid":"42921019","pmcid":"PMC12111985","doi":"10.3390/jcm14103574","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921019/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"From image biomarkers to treatment decisions: multimodal AI and clinical translation in gynecologic oncology.","title_en":"From image biomarkers to treatment decisions: multimodal AI and clinical translation in gynecologic oncology.","authors":"Bakir M, Al Masri MK, Mushtaha Y, Shaikh N, Raddaoui M, Mohammad KS","affiliation_highlight":"Department of Medicine, College of Medicine, Alfaisal University, Riyadh, Saudi Arabia.","results":"Artificial intelligence (AI) is rapidly expanding across gynecologic oncology, but most applications remain focused on image interpretation and retrospective prediction rather than direct support of treatment decisions. …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Artificial intelligence (AI) is rapidly expanding across gynecologic oncology, but most applications remain focused on image interpretation and retrospective prediction rather than direct support of treatment decisions. This review examines how AI is progressing from imaging biomarkers toward multimodal decision-support systems that integrate radiologic, pathologic, molecular, and clinical information. We summarize current applications in ovarian, endometrial, and cervical cancers, with particular attention to preoperative risk stratification, surgical planning, radiotherapy, systemic treatment selection, treatment-response prediction, and multidisciplinary decision-making. Multimodal approaches are especially promising because they reflect the way clinical decisions are made and may provide greater value than models based on a single data source. However, the current evidence remains dominated by retrospective and often single-center studies, with limited external and prospective validation. Data heterogeneity, domain shift, incomplete multimodal datasets, bias, workflow integration, regulatory requirements, and model monitoring remain important barriers to routine implementation. We therefore outline a stepwise pathway for clinical translation, from robust multicenter validation and prospective human-AI evaluation to clinical-impact studies and post-deployment monitoring. The next phase of AI in gynecologic oncology should prioritize clinically meaningful decisions and measurable patient or workflow benefit rather than incremental gains in predictive performance alone.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42920861","pmid":"42920861","pmcid":"PMC9278696","doi":"10.1016/j.ejca.2005.01.020","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42920861/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Genesis-progression of early jaw osteoradionecrosis in head and neck cancer survivors: dynamics of independent but interconnected factors.","title_en":"Genesis-progression of early jaw osteoradionecrosis in head and neck cancer survivors: dynamics of independent but interconnected factors.","authors":"Delanian SE","affiliation_highlight":"Département d'Oncologie-Radiothérapie, Assistance Publique des Hôpitaux de Paris (APHP), Hôpital Saint-Louis, Paris, Fra…","results":"PURPOSE: Long-term head and neck cancer survivors are few, but always exposed to a risk of mandibular osteoradionecrosis (ORN) despite the use of appropriate dose-volume constraints in today's radiotherapy. Here, ORN dev…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: Long-term head and neck cancer survivors are few, but always exposed to a risk of mandibular osteoradionecrosis (ORN) despite the use of appropriate dose-volume constraints in today's radiotherapy. Here, ORN development is approached from another look, in an attempt to explain its complexity. DEFINITIONS: Early ORN is best defined by length of the mucosal defect (<2 teeth long) and radiological assessment of the depth of areas of bone resorption (lysis below the level of the inferior alveolar canal) in the radiotherapy volume. Technical improvements have greatly reduced the incidence of ORN, but a lifelong risk remains and requires long-term follow-up. CAUSAL FACTORS: Pathogenic hypotheses have evolved over time from the \"radiation-trauma-infection\" triad to the 3H theory of \"hypoxia-hypocellularity-hypovascularity\", and then radiation-induced fibro-atrophy of the bone. ORN is a dynamic process combining interacting causal factors that worsen each other over time: (a) radiation-induced fibro-atrophy of the bone and its related radiotherapy technical parameters; (b) periodontal disease/dental trauma and their related questions on optimal timing of pre- or post-radiotherapy extractions and how many teeth; (c) infection/oral microbiota and their related mechanically inaccessible bone sequestra (residual bacteria); (d) vascular factors from capillary network destruction to artery stenosis of irradiated branches and the carotid trunk. CONCLUSION: Symptomatic medical care focusing on comorbidity parameters and devitalized tissue removal is not sufficient to protect patients against ORN. These new insights should help to treat early ORN through concomitant control of these causal factors and best dental care.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42927193","pmid":"42927193","pmcid":"PMC13694867","doi":"10.1016/j.jtocrr.2026.101059","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927193/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-26","journal_abbr":"JTO Clin Res Rep","journal_full":"JTO Clinical and Research Reports","tier":"C","if_val":3.6,"zone":"JCR Q2 · 未收录","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Dual Checkpoint Inhibition With or Without Chemotherapy in Metastatic NSCLC: A Reconstructed Individual Patient Data Meta-Analysis.","title_en":"Dual Checkpoint Inhibition With or Without Chemotherapy in Metastatic NSCLC: A Reconstructed Individual Patient Data Meta-Analysis.","authors":"Taylor S, Mamede I, Gazzoni G, Riya IJ, Piya IJ, Stecca C, Lopes G, Hazim A et al.","affiliation_highlight":"Division of Hematology & Medical Oncology, Mayo Clinic Arizona, Phoenix, Arizona.","results":"INTRODUCTION: Dual immune checkpoint inhibition (DICI) is an established first-line treatment for metastatic NSCLC. Whether the addition of chemotherapy provides an incremental survival benefit beyond DICI alone remains …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Dual immune checkpoint inhibition (DICI) is an established first-line treatment for metastatic NSCLC. Whether the addition of chemotherapy provides an incremental survival benefit beyond DICI alone remains unclear. METHODS: We performed a systematic review and reconstructed individual patient data meta-analysis of trials evaluating first-line DICI and DICI plus chemotherapy (DICI-CT) in metastatic NSCLC. Data were reconstructed from Kaplan-Meier curves. Overall survival (OS) and progression-free survival were analyzed using Cox proportional hazards and time-varying models. Prespecified subgroup analyses were conducted according to PD-L1 expression, histology, and STK11 or KEAP1 mutational status. RESULTS: Four trials comprising 1654 patients were included (699 receiving DICI-CT and 955 receiving DICI). Median OS was similar between the groups (15.4 versus 15.0 mo, hazard ratio = 0.93, 95% confidence interval: 0.81-1.08). Proportional hazards assumptions were violated, and time-varying analyses suggested modest late survival differences favoring DICI, with higher 5-year OS (19.4% versus 17.1%) and progression-free survival (10.5% versus 8.2%). In STK11-mutated tumors, DICI-CT was associated with a limited early survival benefit that was not sustained over time. No clear differences were observed in KEAP1-mutated tumors. CONCLUSIONS: The addition of chemotherapy to DICI was not associated with improved survival in an unselected population of patients with metastatic NSCLC. These findings support an individualized approach to the use of chemotherapy in combination with DICI.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42925959","pmid":"42925959","pmcid":"","doi":"10.1016/j.radonc.2026.111819","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925959/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-26","journal_abbr":"Radiother Oncol","journal_full":"RADIOTHERAPY AND ONCOLOGY","tier":"A","if_val":5.8,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性方法学综述/批判性述评（非系统评价，无原始数据）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":31,"score_breakdown":{"clinical":7,"methodology":11,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"临床前 FLASH 效应证据的获取与解读存在方法与数据陷阱：固定单剂量设计、以终点差值作为指标的做法与效应量定量不足可能夸大实际效应","title_en":"Mind the data: pitfalls and perspectives in acquiring and interpreting preclinical evidence for the FLASH effect.","authors":"Böhlen TT, Sesink A, Adrian G, Beyreuther E, Desmet A, Grilj V, Guckenberger M, Montay-Gruel P et al.","affiliation_highlight":"Institute of Radiation Physics, Lausanne University Hospital and Lausanne University, Lausanne, Switzerland.","results":"","authors_conclusion":"通过改进定量表征、统一方法学和透明报告来应对这些挑战，对于实现可靠的解读并支持 FLASH-RT 的临床转化至关重要。","ai_note":"该文为无检索策略、无纳入排除标准、无定量汇总的叙述性述评，结论属定性归纳，证据等级有限；未提供任何原始数值或效应量，无法核验其关于“效应量被高估”的论断强度；文中未限定瘤种与临床终点，向胸科临床决策外推需谨慎。摘要本身未出现选择性强调主要或次要终点的问题（无终点数据）。","pico":{"p":"","ic":""},"reason":"为评估 FLASH-RT 临床转化证据的可信度提供批判性框架，影响对临床前剂量-效应数据（固定单剂量设计、以终点差值作为指标的做法、氧合等混杂因素）能否支撑临床应用的判断，并可为胸部肿瘤大剂量率/大分割放疗的临床前研究设计与报告规范提供对照参考。","abstract_en":"FLASH radiotherapy (FLASH-RT) has rapidly emerged as a promising approach to widen the therapeutic window through differential sparing of normal tissue. However, despite substantial experimental activity, uncertainties remain regarding the magnitude, reproducibility, and determinants of the FLASH effect. This work reviews common pitfalls and sources of ambiguity in the acquisition and interpretation of preclinical FLASH data to support clinical application. In particular, the widespread use of fixed single-dose study designs, over-reliance on differential endpoint-based metrics, and limited quantification of effect size may obscure the true magnitude and clinical relevance of observed effects. Moreover, small dose-modifying effects are highly susceptible to experimental and biological variability, including dosimetric uncertainties, endpoint sensitivity, and environmental factors such as oxygenation. Heterogeneity in experimental protocols and endpoints further complicates cross-study comparisons. Addressing these challenges through improved quantitative characterisation, harmonised methodologies, and transparent reporting will be essential to enable robust interpretation and support the clinical translation of FLASH-RT.","tags":["FLASH放疗","临床前研究","方法学质量","放射生物学","证据解读","述评"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42927140","pmid":"42927140","pmcid":"PMC13694746","doi":"10.1016/j.ijnsa.2026.100705","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927140/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-26","journal_abbr":"Int J Nurs Stud Adv","journal_full":"International journal of nursing studies advances","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单中心横断面研究 · 观察性关联分析（序列中介与调节效应，bootstrap 5000次）","category":"surgery","category_label":"微创与无管化胸外科","score_total":30,"score_breakdown":{"clinical":8,"methodology":13,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"总体","metric":"韧性—自我效能关联（B）","val":"2.080","stat":"95%CI 1.826–2.334","grounded":true,"checks":[{"num":"2.080","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"1.826","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"2.334","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"中介路径","metric":"经社会支持的间接效应（B）","val":"0.118","stat":"95%CI 0.024–0.212","grounded":true,"checks":[{"num":"0.118","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.024","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.212","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"中介路径","metric":"经负性情绪的间接效应（B）","val":"0.084","stat":"95%CI 0.004–0.164","grounded":true,"checks":[{"num":"0.084","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.004","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.164","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"中介路径","metric":"经社会支持→负性情绪的序列间接效应（B）","val":"0.018","stat":"95%CI 0.004–0.032","grounded":true,"checks":[{"num":"0.018","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.004","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.032","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"调节效应","metric":"韧性×社会支持交互项（beta）","val":"0.083","stat":"p=0.010","grounded":true,"checks":[{"num":"0.083","grounded":true,"note":"数值+语境锚命中"},{"num":"0.010","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"总体","metric":"韧性—自我效能关联（B）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」未在原摘要出现","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"中介路径","metric":"经社会支持的间接效应（B）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「介路径」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"中介路径","metric":"经负性情绪的间接效应（B）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「介路径」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"中介路径","metric":"经社会支持→负性情绪的序列间接效应（B）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「介路径」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"调节效应","metric":"韧性×社会支持交互项（beta）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「调节效应」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺癌VATS术后早期心理韧性与自我效能的关联：社会支持与负性情绪的序列中介及社会支持的调节作用（横断面研究）","title_en":"Synergistic psychosocial pathways linking resilience to self-efficacy in lung cancer following video-assisted thoracic surgery: a cross-sectional study.","authors":"Chen X, Duan G, Zhong J, Wu H, Dong Y, Liu D","affiliation_highlight":"Department of Thoracic Surgery, State Key Laboratory of Oncology in South China, Collaborative Innovation Center for Can…","results":"韧性与自我效能正相关（B=2.080, 95% CI 1.826–2.334）；经社会支持的间接关联（B=0.118, 95% CI 0.024–0.212）、经负性情绪的间接关联（B=0.084, 95% CI 0.004–0.164）、经二者序列的间接关联（B=0.018, 95% CI 0.004–0.032）均有统计学意义；韧性与社会支持的交互项有统计学意义（beta=0.083, p=0.010）","authors_conclusion":"在该术后早期样本中，韧性、社会支持、负性情绪与自我效能呈现与所提出的资源基础模型一致的模式；应评估并支持这些资源的护理策略需在纵向与干预性研究中检验","ai_note":"横断面同时测量暴露、中介与结局，无法满足中介分析所需的时间顺序，路径系数只能视为相关性；便利抽样、单中心、全部为自评量表，未提及混杂因素调整（疼痛、手术方式/范围、并发症、焦虑抑郁共病等）；间接效应置信区间下限接近0（0.024、0.004），估计脆弱；调节效应 beta=0.083 量级很小，临床意义未讨论；结局与暴露量表可能存在条目内容重叠导致共同方法偏倚；作者以“与模型一致”表述，属不可证伪的措辞，摘要未报告模型拟合或解释方差","pico":{"p":"中国南方一家三级甲等肿瘤医院便利抽样，225例原发性肺癌行择期VATS的成人患者，于术后第3–5天出院前评估","ic":"无干预（观察性）：暴露为心理韧性，中介变量为社会支持与负性情绪，结局为癌症自我照护自我效能；并检验社会支持对韧性—自我效能关联的调节"},"reason":"为VATS肺癌术后早期心理社会资源（韧性、社会支持、负性情绪）与康复自我效能的关系提供相关性基线，可作为护理干预试验的假设来源与终点/样本量估算的参照；对手术方式选择、切除范围或肿瘤学决策无直接影响","abstract_en":"BACKGROUND: Recovery after video-assisted thoracic surgery (VATS) can involve pain, fatigue, distress, and reduced confidence in rehabilitation activities. OBJECTIVES: Guided by conservation of resources theory, this study examined associations between resilience and cancer-related self-care self-efficacy measured during early postoperative recovery, the indirect roles of social support and negative emotion, and whether social support moderated the resilience-self-efficacy association. DESIGN: A cross-sectional study. SETTINGS: One tertiary Grade A cancer hospital in South China. PARTICIPANTS: A convenience sample of 225 adults with primary lung cancer who underwent elective VATS was assessed on postoperative days 3 to 5 before discharge. METHODS: Participants completed a sociodemographic/clinical questionnaire and validated Chinese versions of the social support, cancer self-care self-efficacy, resilience, and negative emotion scales. Observed-variable serial mediation paths were estimated with 5000 bootstrap resamples; moderation was examined with a resilience by social support interaction. RESULTS: Resilience was positively associated with self-efficacy (B = 2.080, 95% CI 1.826 to 2.334). The indirect associations through social support (B = 0.118, 95% CI 0.024 to 0.212), negative emotion (B = 0.084, 95% CI 0.004 to 0.164), and both variables sequentially (B = 0.018, 95% CI 0.004 to 0.032) were statistically significant. The resilience by social support interaction was also significant (beta = 0.083, p = 0.010). CONCLUSIONS: In this early postoperative sample, resilience, social support, negative emotion, and self-efficacy showed patterns consistent with the proposed resource-based model. Nursing strategies that assess and support these resources should be tested in longitudinal and interventional studies.","tags":["VATS","肺癌","术后早期康复","心理韧性","自我效能","中介分析"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42927131","pmid":"42927131","pmcid":"PMC13695489","doi":"10.7759/cureus.116854","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927131/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-26","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（Case report）· 远程实时指导下的床旁急救操作","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":28,"score_breakdown":{"clinical":7,"methodology":7,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"患者","metric":"心包积液最大厚度","val":"4.6 cm","stat":"","grounded":true,"checks":[{"num":"4.6","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者","metric":"前纵隔肿块大小","val":"14.4 × 11.8 × 11.3 cm","stat":"","grounded":true,"checks":[{"num":"14.4","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"11.8","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"11.3","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者","metric":"非意愿性体重下降","val":"约7 kg","stat":"","grounded":true,"checks":[{"num":"7","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"患者","metric":"年龄","val":"40岁","stat":"","grounded":true,"checks":[{"num":"40","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"患者","metric":"心包积液最大厚度","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者","metric":"前纵隔肿块大小","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者","metric":"非意愿性体重下降","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"患者","metric":"年龄","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"远程医疗指导下的心包穿刺术处理以心脏压塞首发的原发纵隔大B细胞淋巴瘤：一例墨西哥农村患者的病例报告","title_en":"Telemedicine-Guided Pericardiocentesis for Cardiac Tamponade in Primary Mediastinal Large B-cell Lymphoma.","authors":"Cab Morales VA, Montemayor Garza EA, Mascorro-Cienfuegos CA, Aguilar-Meza JL, de la Cruz de León NA, Chavarría Martínez U","affiliation_highlight":"Internal Medicine, Hospital Universitario Dr.","results":"心包积液最大厚度4.6 cm并伴压塞生理；引流出血性浆液性液体，生化特征提示肿瘤累及；增强胸部CT示前纵隔14.4 × 11.8 × 11.3 cm肿块伴坏死区；病程前有约7 kg非意愿性体重下降；病理确诊CD20阳性PMBCL；R-CHOEP化疗后血流动力学不稳定缓解，报告随访期内压塞无复发","authors_conclusion":"该病例提示不明原因心脏压塞应早期考虑恶性肿瘤；实时远程医疗指导可使非专科医师在无专科诊疗条件下完成救命性床旁操作，该模式值得在 rural 与医疗服务不足地区进一步评估","ai_note":"单例、无对照，无法推断远程指导本身对结局的效应量；随访时长未报告，“报告随访期内压塞无复发”缺具体时点，属不可核验表述；积液“生化提示肿瘤累及”未经细胞学确认即写入叙述，与后续病理诊断存在证据层级混淆；摘要以操作可行性与救治成功为主要叙述，未报告穿刺相关并发症、操作时长或转诊延迟等可评价指标；属技术可行性描述，不宜外推为疗效证据。","pico":{"p":"1例来自墨西哥新莱昂州农村社区的40岁男性，以重度心包积液（最大厚度4.6 cm）并心脏压塞为首发表现，无奇脉，后证实为CD20阳性原发纵隔大B细胞淋巴瘤（PMBCL）","ic":"无对照。干预为在无心脏科医师在场的情况下，由内科医师在心脏科医师实时远程医疗指导下行床旁心包穿刺引流，后续行VATS心包开窗与肿瘤活检并启动R-CHOEP化疗"},"reason":"为资源匮乏地区胸部肿瘤急症（恶性心包压塞）的远程指导床旁处置提供可行性描述与操作流程雏形，可作为数字健康/远程医疗在胸科急症中应用研究的假说来源与病例层面的对照基线；对纵隔淋巴瘤以压塞首发的诊断路径有教学参考价值。","abstract_en":"Pericardial effusion has infectious, inflammatory, neoplastic, traumatic, cardiac, vascular, and idiopathic causes. When effusion accumulates rapidly enough to compromise ventricular filling, cardiac tamponade develops and becomes a life-threatening emergency requiring urgent drainage, a procedure conventionally performed by a cardiologist or cardiothoracic surgeon and rarely available on site at rural or resource-limited hospitals. Malignant pericardial effusion is most often attributed to lung and breast carcinoma, while lymphoma is the leading hematologic cause. Tamponade as the presenting feature of non-Hodgkin lymphoma, however, is distinctly uncommon. We describe a 40-year-old man from a rural community in Nuevo León, Mexico, with three weeks of intermittent chest tightness, diaphoresis, unquantified fever, and approximately 7 kg of unintentional weight loss, followed by progressive exertional dyspnea, orthopnea, and paroxysmal nocturnal dyspnea. He presented to a rural hospital with jugular venous distension, muffled heart sounds, and lower-limb edema, without pulsus paradoxus. Echocardiography demonstrated a severe pericardial effusion measuring up to 4.6 cm with tamponade physiology. With no cardiologist on site and hemodynamic collapse imminent, an internist performed pericardiocentesis under real-time telemedicine guidance from a cardiologist, draining serosanguineous fluid whose biochemical profile suggested tumor involvement. Contrast-enhanced chest computed tomography at the referral center revealed a 14.4 × 11.8 × 11.3 cm anterior mediastinal mass with necrotic areas. Video-assisted thoracoscopic surgery allowed pericardial window creation and tumor biopsy, which established a CD20-positive primary mediastinal large B-cell lymphoma (PMBCL). Chemotherapy with R-CHOEP (rituximab, cyclophosphamide, doxorubicin, vincristine, etoposide, and prednisone) was initiated, with resolution of hemodynamic instability and no recurrence of tamponade during the reported follow-up. This case illustrates that malignancy warrants early consideration in unexplained tamponade and that real-time telemedicine guidance may allow a non-specialist physician to undertake a life-saving bedside procedure where specialist care is otherwise unavailable, an approach that merits further evaluation in rural and underserved settings.","tags":["病例报告","远程医疗","原发纵隔大B细胞淋巴瘤","心脏压塞","心包穿刺","资源匮乏地区"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42927216","pmid":"42927216","pmcid":"PMC13694921","doi":"10.1016/j.ctro.2026.101306","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927216/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-26","journal_abbr":"Clin Transl Radiat Oncol","journal_full":"Clinical and Translational Radiation Oncology","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"单中心回顾性剂量学比较与NTCP建模研究（基于SLNB结果的个体化术后放疗计划对比）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":26,"score_breakdown":{"clinical":10,"methodology":12,"specialty":4,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"前哨淋巴结活检指导口腔舌鳞癌术后放疗靶区调整的回顾性剂量学与NTCP模型研究","title_en":"Sentinel lymph node-guided modification of postoperative radiotherapy in oral tongue squamous cell carcinoma: a retrospective dosimetric and NTCP modelling study.","authors":"Björgvinsson E, Kolev A, Onjukka E, Hedman M, Tedgren ÅC, Södergren L, Friesland S, Margolin G et al.","affiliation_highlight":"Department of Head and Neck Oncology, Karolinska University Hospital, 17164 Stockholm, Sweden.","results":"","authors_conclusion":"SLNB在近半数OTSCC患者中发现了超出标准选择性照射范围的淋巴引流；SLNB可能指导个体化术后放疗，包括在选定患者中省略对侧颈部照射；调整后的计划显著降低了口干与吞咽困难的估计NTCP；SLNB可能支持OTSCC选择性颈照射的个体化降阶梯与优化。","ai_note":"摘要仅为要点式条目，未给出样本量、剂量学具体数值、NTCP模型类型与参数，也无任何肿瘤学或毒性临床结局；因此“显著降低NTCP”属模型估算而非临床观察，只能视为假设生成。“近半数患者引流超出标准范围”缺少分母与判定标准。SLNB指导下调靶区若未同步报告区域控制率，存在降阶梯安全性证据缺口；同时“调整计划”与“标准计划”的对比为同一患者内的计划比较，无法反映实际实施后的复发风险。","pico":{"p":"口腔舌鳞状细胞癌（OTSCC）术后患者；样本量摘要未报告","ic":"干预：依据前哨淋巴结活检（SLNB）所示淋巴引流范围调整术后放疗靶区（含选定患者省略对侧颈照射）；对照：标准选择性颈照射范围的放疗计划；比较指标为剂量学参数与估计NTCP"},"reason":"为口腔舌癌术后选择性颈照射范围的个体化降阶梯提供剂量学与NTCP层面的假设依据；对胸科直接业务关联有限，但可作为降阶梯类研究设计、计划比较与NTCP建模方法的参照基线。","abstract_en":"•SLNB identified lymphatic drainage beyond standard elective volumes in nearly half of OTSCC patients.•SLNB may guide individualized postoperative radiotherapy, including omission of contralateral neck irradiation in selected patients.•Adapted plans significantly reduced estimated NTCPs for xerostomia and dysphagia.•SLNB may support individualized de-escalation and optimization of elective neck irradiation in OTSCC.","tags":["口腔舌鳞癌","前哨淋巴结活检","术后放疗","选择性颈照射","NTCP模型","降阶梯"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42927411","pmid":"42927411","pmcid":"PMC13695502","doi":"10.7759/cureus.116811","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927411/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-26","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（诊断性病例，无对照）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":22,"score_breakdown":{"clinical":8,"methodology":5,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"病例","metric":"年龄","val":"10岁","stat":"","grounded":true,"checks":[{"num":"10","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"病例","metric":"胸腔积液引流量","val":">1,500 mL","stat":"","grounded":true,"checks":[{"num":"1500","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"胸腔积液流式细胞术","metric":"异常未成熟T系淋巴母细胞占分析细胞比例","val":"99%","stat":"","grounded":true,"checks":[{"num":"99%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"骨髓检查","metric":"甲泼尼龙治疗至骨髓检查间隔","val":"3天","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"病例","metric":"年龄","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"病例","metric":"胸腔积液引流量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"胸腔积液流式细胞术","metric":"异常未成熟T系淋巴母细胞占分析细胞比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「胸腔积液流式」无英文锚（词典未收录，宁误杀）","人群限定「术」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"骨髓检查","metric":"甲泼尼龙治疗至骨髓检查间隔","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「骨髓检查」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"以复发性胸腔积液为首发表现的儿童T系淋巴母细胞恶性肿瘤：一例诊断挑战病例报告","title_en":"Recurrent Pleural Effusion as the Initial Presentation of T-lineage Lymphoblastic Malignancy in a Child: A Diagnostic Challenge.","authors":"Fakih H, Fakih F","affiliation_highlight":"Pediatrics, Sheikh Ragheb Harb University Hospital, Nabatieh, LBN.","results":"胸腔积液流式细胞术显示异常未成熟T系淋巴母细胞群体，约占分析细胞的99%；胸腔积液引流量超过1,500 mL；胸膜活检示非典型淋巴样细胞浸润，形态似非霍奇金淋巴瘤；在甲泼尼龙治疗3天后行骨髓检查，示弥漫性原始细胞浸润，呈未成熟T细胞免疫表型，诊断为T细胞急性淋巴细胞白血病；胸腔积液结核PCR及抗酸杆菌检测阴性；腰椎穿刺正常。","authors_conclusion":"复发性胸腔积液可能是T细胞急性淋巴细胞白血病的首发和主要表现，即使外周血无原始细胞或缺乏典型纵隔肿块；早期胸腔积液流式细胞术可能有助于诊断并避免诊断延误。","ai_note":"单例报告，无对照与随访结局数据；诊断效能不能由单一病例推断敏感性；骨髓检查在3天甲泼尼龙治疗后进行，可能影响骨髓形态学判读（虽流式仍诊断）；未报告胸腔积液细胞学/流式的重复性验证细节；『99%』仅为该例流式分析细胞占比，不能外推。信息不足：未提供诊断延误时长、治疗后反应与生存数据。","pico":{"p":"1例10岁男孩，复发性大量右侧胸腔积液，反复引流超过1500 mL","ic":"诊断性评估：胸腔积液流式细胞术、胸膜活检、淋巴结活检、骨髓检查、腰椎穿刺、结核PCR及抗酸染色（无对照组）"},"reason":"提示以复发性胸腔积液为首发表现的儿童血液系统恶性肿瘤需将胸腔积液流式细胞术纳入诊断路径，避免按感染/结缔组织病长期排查；为胸腔积液病因鉴别与送检策略提供个案级证据，对胸科积液诊疗决策有提示价值但证据等级低。","abstract_en":"Pleural effusion in children is most frequently associated with infectious diseases, particularly parapneumonic effusion. Recurrent or unexplained pleural effusion, however, should prompt consideration of less common etiologies, including autoimmune disease, tuberculosis, chylothorax, cardiac and renal disease, and malignancy. We report the case of a 10-year-old boy with recurrent large right-sided pleural effusions requiring repeated drainage of more than 1,500 mL. An extensive diagnostic evaluation for rheumatologic and infectious causes was unrevealing. During the current admission, the patient had anorexia, weight loss, axillary lymphadenopathy, leukocytosis, and mild thrombocytopenia, without reported peripheral blood blasts. Chest computed tomography demonstrated a large right pleural collection, bilateral axillary lymphadenopathy, and prominent thymic tissue without a definite bulky anterior mediastinal mass. Pleural-fluid flow cytometry demonstrated an abnormal immature T-lineage lymphoblast population comprising approximately 99% of analyzed cells. Pleural biopsy showed tissue infiltration by atypical lymphoid cells morphologically resembling non-Hodgkin lymphoma. Subsequent bone marrow examination, performed after three days of methylprednisolone therapy, demonstrated diffuse blast infiltration with an immature T-cell immunophenotype and was diagnostic of T-cell acute lymphoblastic leukemia. Lymph-node biopsy showed lymphoproliferative disease, while lumbar puncture was normal. Pleural-fluid tuberculosis PCR and acid-fast bacilli testing were negative. This case emphasizes that recurrent pleural effusion may be an initial and predominant manifestation of T-cell acute lymphoblastic leukemia, even in the absence of peripheral blood blasts or a typical mediastinal mass. Early pleural-fluid flow cytometry may facilitate diagnosis and prevent diagnostic delay.","tags":["儿童T细胞急性淋巴细胞白血病","复发性胸腔积液","胸腔积液流式细胞术","病例报告","诊断延误"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923022","pmid":"42923022","pmcid":"PMC3978705","doi":"10.1186/ar4379","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923022/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"基础转化研究 · 组织多色免疫荧光表达分析 + 细胞系体外功能学（敲低/回补）+ 转录组与通路富集分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":22,"score_breakdown":{"clinical":6,"methodology":13,"specialty":3,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"HHLA2 在喉鳞状细胞癌中高表达并促进细胞增殖、迁移与侵袭，其作用被提示经 KCTD12 及 TNF-NF-κB 通路介导（体外实验研究）","title_en":"HHLA2-KCTD12 axis: a potential mechanism regulating the biological functions of laryngeal squamous cell carcinoma.","authors":"Yu Y, You J, Wang X, Xue H, Chen H, Li W","affiliation_highlight":"Department of Otorhinolaryngology Head and Neck Surgery, the Third Affiliated Hospital of Soochow University (Changzhou …","results":"","authors_conclusion":"HHLA2 增强 LSCC 细胞的增殖、迁移与侵袭能力，并可能通过 HHLA2-KCTD12 轴调控 TNF-NF-κB 信号通路参与免疫微环境重塑。","ai_note":"全文无任何具体数值（表达倍数、P 值、样本量、生存 HR 均未给出），'associated with poor prognosis' 无生存分析数据支撑，属不可核实的表述；'免疫微环境重塑' 仅有通路富集这一间接证据，无免疫细胞功能或微环境表型实验；KCTD12 回补仅部分逆转表型，无法确立线性因果；转录组+公共数据库挖掘的结果为相关性，TNF-NF-κB 通路属推断性机制；研究为喉（上气道/头颈）鳞癌，非胸部肿瘤，与胸科业务关联度低。","pico":{"p":"喉鳞状细胞癌（LSCC）肿瘤标本及配对癌旁组织、LSCC 细胞系（摘要未报告样本量与细胞系数量）","ic":"干预：敲低 HHLA2、强制过表达 KCTD12；对照：未明确描述（推测为阴性对照/未处理细胞）；结局：增殖（CCK-8）、划痕迁移、侵袭实验，转录组测序与公共数据库挖掘，GO/KEGG/GSEA 通路富集"},"reason":"研究对象为喉鳞状细胞癌的体外分子机制，与肺癌/食管癌等胸部肿瘤的临床决策无直接关联；仅可作为 HHLA2 这一 B7 家族免疫检查点分子在鳞癌中致癌作用的旁证参考，对胸科手术患者选择、随访或结节风险判断无影响。","abstract_en":"BACKGROUND: Accumulating evidence suggests that aberrant HHLA2 expression is closely implicated not only in tumorigenesis, disease progression, and metastatic spread, but also in the intricate modulation of the tumor immune microenvironment. Nevertheless, the biological functions of HHLA2 and the molecular mechanisms underlying its action in laryngeal squamous cell carcinoma (LSCC) remain unexplored. MATERIALS AND METHODS: HHLA2 expression was systematically assessed in LSCC tumor specimens and matched adjacent tissues using multiplex immunofluorescence (mIHC). The functional consequences of HHLA2 silencing in LSCC cells were evaluated through a series of in vitro assays, including CCK-8-based proliferation analysis, wound-healing (scratch) assays, and invasion assays. Transcriptomic sequencing integrated with public database mining was subsequently performed to identify key target genes potentially governed by HHLA2 in regulating LSCC biological behavior. Furthermore, Gene Ontology (GO), Kyoto Encyclopedia of Genes and Genomes (KEGG) and Gene Set Enrichment Analysis (GSEA) pathway analyses were conducted to delineate the signaling networks and molecular pathways through which HHLA2 might exert its regulatory effects in LSCC. RESULTS: HHLA2 expression was significantly elevated in LSCC tumor tissues, and associated with poor prognosis in patients. Functional experiments revealed that suppression of HHLA2 leads to marked inhibition of LSCC cell proliferation, migration, and invasion, underscoring its essential role in sustaining malignant phenotypes. Mechanistically, we identified potassium channel tetrameric domain 12 (KCTD12) as a pivotal target of HHLA2 in mediating these oncogenic processes. Importantly, forced overexpression of KCTD12 effectively counterbalanced the inhibitory effects induced by HHLA2 depletion, thereby restoring proliferative, migratory, and invasive potential to LSCC cells. Furthermore, pathway enrichment analyses indicated that the TNF-NF-κB signalling pathway might serve as a key conduit through which HHLA2 orchestrated both tumor cell functions and immune regulatory mechanisms. The HHLA2-KCTD12 axis may regulate the phenotype of LSCC cells and reshape the tumor immune microenvironment through the TNF-NF-κB signaling pathway. CONCLUSIONS: HHLA2 enhanced the proliferative, migratory, and invasive capacities of LSCC cells and might contribute to immune microenvironment remodeling via modulation of TNF-NF-κB signaling through the HHLA2-KCTD12 axis.","tags":["HHLA2","KCTD12","喉鳞状细胞癌","TNF-NF-κB","体外细胞实验","非胸科"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923077","pmid":"42923077","pmcid":"PMC9081221","doi":"10.1097/NCC.0000000000001491","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923077/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-26","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"单中心横断面研究 · 潜在剖面分析（LPA）＋广义线性回归","category":"surgery","category_label":"微创与无管化胸外科","score_total":21,"score_breakdown":{"clinical":6,"methodology":12,"specialty":3,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"老年RARP术后患者（n=300）","metric":"心理弹性潜在剖面数","val":"3","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"老年RARP术后患者不同心理弹性剖面","metric":"身体弹性（广义线性回归关联）","val":"差异有统计学意义","stat":"P < 0.05","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"老年RARP术后患者（n=300）","metric":"心理弹性潜在剖面数","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"老年RARP术后患者不同心理弹性剖面","metric":"身体弹性（广义线性回归关联）","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「不同心理弹性剖面」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"机器人辅助根治性前列腺切除术后老年患者的心理弹性潜在剖面及其与身体弹性的横断面关联","title_en":"Latent psychological resilience profiles and their association with physical resilience in older patients after robot-assisted radical prostatectomy: a cross-sectional study.","authors":"Liu R, Xi X, Ma X, Zhao Y, Zhuo H","affiliation_highlight":"Urology Department, Chengdu Third People's Hospital, Chengdu, China.","results":"识别出3个心理弹性潜在剖面；不同心理弹性剖面者的身体弹性得分存在差异；广义线性回归显示RARP患者不同心理弹性剖面与身体弹性相关（P < 0.05）","authors_conclusion":"老年RARP术后患者心理弹性表现为异质性剖面，剖面归属与身体弹性相关；需纵向及干预性研究以确定这些剖面的时间方向与临床实用性。","ai_note":"摘要未报告各剖面的样本量与占比、各组身体弹性得分均值、回归系数、效应量及混杂因素调整情况，仅以P < 0.05表述关联，无法判断效应大小；数据采集时间标注为2025年12月至2026年5月，与当前时点关系存疑，需核对；单中心便利抽样且仅术后第3天单时点评估，剖面稳定性与时序方向均不可推断；横断面设计下“profile membership was associated with”只能表述为相关，作者结论已作相应限定。","pico":{"p":"四川省某三级甲等医院招募的300例前列腺癌患者，均为机器人辅助根治性前列腺切除术后老年患者，于术后第3天评估","ic":"无干预对照；以Connor-Davidson心理弹性量表总分行潜在剖面分析划分心理弹性亚组，比较各组老年身体弹性量表（Physical Resilience Instrument for Older Adults）得分，并以广义线性回归分析心理弹性剖面与身体弹性的关系"},"reason":"研究对象为前列腺癌术后人群，与胸外科/胸部肿瘤业务无直接交集，对胸部肿瘤临床判断影响有限；其可借鉴之处在于为胸外科术后患者“心理弹性—身体功能恢复”类研究提供潜在剖面分析＋广义线性回归的建模路径与单时点评估的对照参照，并提示该类设计在时序推断上的固有局限。","abstract_en":"OBJECTIVE: To identify latent psychological resilience profiles in older patients after robot-assisted radical prostatectomy (RARP) and examine their association with physical resilience. METHODS: A total of 300 patients with prostate cancer were recruited from a Class III Grade A hospital in Sichuan Province between December 2025 and May 2026. Assessments were conducted on postoperative day 3 using the general information questionnaire, Connor-Davidson Resilience Scale, and Physical Resilience Instrument for Older Adults. Latent profile analysis was performed using the total score on the Connor-Davidson Resilience Scale. Generalized linear regression was used to analyze the relationship between psychological and physical resilience across categories among elderly patients after RARP. RESULTS: Three latent psychological resilience profiles were identified among older patients after RARP. Physical resilience scores differed among people with different psychological resilience. The results of generalized regression analysis showed that patients in different psychological resilience profiles of RARP patients were related to their physical resilience (P < 0.05). CONCLUSIONS: Older patients after RARP showed heterogeneous psychological resilience profiles, and profile membership was associated with physical resilience. Longitudinal and intervention studies are needed to determine the temporal direction and clinical utility of these profiles.","tags":["潜在剖面分析","心理弹性","身体弹性","前列腺癌","机器人辅助根治性前列腺切除术","横断面研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42927209","pmid":"42927209","pmcid":"PMC13694884","doi":"10.1016/j.lanepe.2026.101888","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42927209/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-26","journal_abbr":"Lancet Reg Health Eur","journal_full":"Lancet Reg Health Eur","tier":"A","if_val":15.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"政策观点／述评（policy perspective），基于研究者与伦理委员会成员经验，非系统评价、无原始数据","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":20,"score_breakdown":{"clinical":5,"methodology":4,"specialty":3,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"欧盟学术性治疗优化研究的风险与负担适配监管框架：一篇政策观点文章（无原始数据）","title_en":"Academic treatment optimization studies in oncology and internal medicine: a risk- and burden-adapted regulatory framework for the European Union.","authors":"Berdel WE, Dreyling M, Schrappe M, Wanner C, Schmidt G","affiliation_highlight":"Department of Medicine A, University Hospital Münster, Albert Schweitzer Campus 1, Münster 48149, Germany.","results":"","authors_conclusion":"目标不是对学术临床研究去监管，而是风险相称的监管；针对学术治疗优化研究的风险适配框架可强化研究者发起的证据生成，尤其适用于商业激励有限的问题，并改善欧洲常规临床照护优化的证据基础。","ai_note":"本文为立场性政策观点，无系统检索策略、无纳入排除标准、无数据或量化风险估计；OECD A/B1/B2 分类与“最小额外风险与负担”缺乏可操作判定阈值，核心概念（以“常规临床照护”而非说明书为参照）依赖各专科学会自定标准，可致执行异质性与放宽解释；作者群体为学术试验发起方与伦理委员，存在推动降低行政负担的立场倾向，文中“非去监管”的自我限定与实质简化审评路径之间的张力未被实证检验。","pico":{"p":"","ic":""},"reason":"为研究者发起的外科／肿瘤治疗优化类试验（如围手术期方案加减、序贯或降阶梯设计）在欧盟申办时的监管定位提供政策背景与论点参照，可用于理解此类研究合规成本与伦理审评逻辑，但不提供任何可直接改变临床决策的数据。","abstract_en":"Academic treatment optimization studies (TOS) play an important role in determining how established and emerging treatments should be combined, sequenced, intensified, de-intensified, or otherwise optimized in routine clinical care. Unlike commercial clinical trials, which primarily support the development and regulatory approval of new medicinal products, academic TOS frequently address questions for which commercial incentives are limited. Such studies therefore contribute directly to the evidence base underlying clinical guidelines and health-care standards. A substantial proportion of academic TOS involves authorized medicinal products used outside the strict wording of their marketing authorization (label), but within evidence-supported clinical practice. Current European clinical-trial regulation does not always adequately reflect the distinction between the label of a medicinal product and the incremental risk and burden introduced by a particular treatment optimization strategy. Increasing administrative and regulatory requirements disproportionately affect investigator-initiated multicentre studies with limited resources. This article presents a policy perspective derived from the experience of investigators, clinical researchers and ethics committee members involved in academic clinical trials. We propose a risk- and burden-adapted regulatory approach for eligible academic TOS. The relevant reference point
