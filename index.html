d.ncbi.nlm.nih.gov/42902243/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"BMC Surg","journal_full":"BMC Surgery","tier":"B","if_val":2.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Comparative evaluation of Mannheim Peritonitis Index and Mansoura Scoring System for risk stratification in perforation peritonitis: a prospective study from a resource-limited setting of North India.","title_en":"Comparative evaluation of Mannheim Peritonitis Index and Mansoura Scoring System for risk stratification in perforation peritonitis: a prospective study from a resource-limited setting of North India.","authors":"Jameel H, Raza MH, Anees A, Akhtar MS","affiliation_highlight":"Department of Surgery, Jawaharlal Nehru Medical College, AMU, Aligarh, India.","results":"BACKGROUND: Perforation peritonitis is one of the most common surgical emergencies encountered in clinical practice and is associated with considerable morbidity and mortality. Prognostic scoring systems are important fo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Perforation peritonitis is one of the most common surgical emergencies encountered in clinical practice and is associated with considerable morbidity and mortality. Prognostic scoring systems are important for predicting outcomes, guiding management strategies and facilitating surgical audits. The Mannheim Peritonitis Index (MPI) is a widely used intraoperative scoring system, while the Mansoura Scoring System (MSS) is a newer model based on preoperative inflammatory parameters. The aim of this study was to evaluate the efficacy of MPI and MSS in predicting mortality and postoperative complications in patients with perforation peritonitis. MATERIALS AND METHODS: A prospective observational cohort study was conducted in the Department of Surgery at Jawaharlal Nehru Medical College, Aligarh Muslim University. A total of 200 patients diagnosed with perforation peritonitis and undergoing surgical intervention were included. MPI and MSS scores were calculated for all patients. Patients were followed up for 30 days postoperatively to evaluate outcomes including mortality, postoperative complications and hospital stay. Statistical analysis was performed using SPSS version 29. Diagnostic performance of the scoring systems was evaluated using Receiver Operating Characteristic (ROC) curve analysis. RESULTS: The mean age of patients ranged widely, with the highest proportion belonging to the 31-40 year age group. Males constituted 69.5% of the study population. The ileum was the most common site of perforation (56.5%), followed by gastric perforation (15%). Higher MPI and MSS scores were significantly associated with increased postoperative morbidity and mortality. MPI demonstrated higher specificity in predicting mortality, whereas MSS showed comparable sensitivity and allowed earlier preoperative risk assessment. CONCLUSION: Both MPI and MSS are effective prognostic tools for predicting outcomes in perforation peritonitis. While MPI has a better discriminatory ability for predicting mortality due to its incorporation of intraoperative findings, MSS offers the advantage of early preoperative risk stratification using simple laboratory parameters.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901087","pmid":"42901087","pmcid":"","doi":"10.1016/j.canep.2026.103256","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901087/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cancer Epidemiol","journal_full":"Cancer Epidemiology","tier":"B","if_val":3.0,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Temporal evolution of gastric adenocarcinoma in the United States, 2000-2023: Incidence, presentation, registry-recorded treatment, and survival.","title_en":"Temporal evolution of gastric adenocarcinoma in the United States, 2000-2023: Incidence, presentation, registry-recorded treatment, and survival.","authors":"Lai H, Zou L, Li H","affiliation_highlight":"Department of Gastrointestinal Surgery, Guangdong Provincial Hospital of Chinese Medicine, The Second Affiliated Hospita…","results":"BACKGROUND: We assessed contemporaneous changes in gastric adenocarcinoma incidence, presentation, registry-recorded treatment, and survival. METHODS: Two complementary analyses used Surveillance, Epidemiology, and End R…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: We assessed contemporaneous changes in gastric adenocarcinoma incidence, presentation, registry-recorded treatment, and survival. METHODS: Two complementary analyses used Surveillance, Epidemiology, and End Results (SEER) 17 data. Incidence during 2000-2023 was analyzed using Joinpoint regression. A clinical cohort diagnosed during 2004-2023 at prespecified stomach subsites (C16.1-C16.6, C16.8, and C16.9) was compared across four periods. Surgery trends were decomposed into stage-composition and within-stage components. Outcomes included overall survival (OS), cause-specific survival (CSS), and 36-month restricted mean survival time (RMST); adjusted Cox models separately summarized associations over 0-60 months. RESULTS: The clinical cohort comprised 66,391 tumor records from 66,025 patients. Incidence declined during 2000-2019 (annual percent change, -1.32%; 95% CI, -1.61% to -1.08%) and increased during 2019-2023 (4.96%; 95% CI, 2.51-9.91%). Comparing 2004-2008 with 2019-2023, distant-stage disease increased from 36.1% to 43.0%, whereas surgery among records with known surgery status decreased from 51.9% to 36.3%. Stage-composition change represented 25.7% of the surgery decline. Recorded chemotherapy increased from 35.7% to 54.4%. Median potential follow-up was 206.0 versus 27.4 months; latest-period fixed-time estimates were reported at 12 and 36 months. Three-year OS increased from 25.2% to 29.1% and CSS from 31.4% to 35.6%. Unadjusted 36-month RMST differences were 1.80 months (95% CI, 1.47-2.15) for OS and 1.86 months (95% CI, 1.53-2.22) for CSS. CONCLUSIONS: Distant-stage presentation became more frequent while recorded surgery declined and short-term survival improved modestly. Within-stage changes represented most of the surgery decline. Additional registry years are needed to assess persistence of the post-2019 incidence increase.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902416","pmid":"42902416","pmcid":"11251313","doi":"10.1016/j.jcmg.2019.10.016","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902416/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"Cardiooncology","journal_full":"Cardio-Oncology","tier":"B","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cardiac magnetic resonance with myocardial strain as a predictor of anthracycline-induced cardiotoxicity in patients with lymphoma: a prospective multimodality study.","title_en":"Cardiac magnetic resonance with myocardial strain as a predictor of anthracycline-induced cardiotoxicity in patients with lymphoma: a prospective multimodality study.","authors":"da Silva Costa IBS, Assunção BMBL, Cruz CBBV, Pavani AVB, Pereira J, Buccheri V, Bittar CS, Fonseca RA et al.","affiliation_highlight":"Hospital das Clinicas HCFMUSP, Faculdade de Medicina, Instituto do Cancer do Estado de Sao Paulo, Universidade de Sao Pa…","results":"BACKGROUND: Cancer therapy-related cardiac dysfunction (CTRCD) is a frequent and clinically relevant complication in patients with lymphoma treated with anthracyclines. Early identification of subclinical myocardial inju…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Cancer therapy-related cardiac dysfunction (CTRCD) is a frequent and clinically relevant complication in patients with lymphoma treated with anthracyclines. Early identification of subclinical myocardial injury is critical to prevent progression to overt heart failure and to avoid chemotherapy dose reductions that may compromise oncologic outcomes. We aimed to evaluate the role of cardiac magnetic resonance (CMR) with T1 mapping and feature-tracking myocardial strain, in comparison with transthoracic echocardiography (TTE) and circulating biomarkers, for the early detection of CTRCD in lymphoma patients receiving anthracycline-based chemotherapy. METHODS: In this prospective, single-center observational study, forty-nine adult patients with lymphoma scheduled for anthracycline-based chemotherapy underwent serial assessment of high-sensitivity cardiac troponin T (hs-cTnT), NT-proBNP, TTE, and CMR at baseline (visit 0), after the third chemotherapy cycle (visit 1), and at chemotherapy completion (visit 2). TTE was repeated at 12-month follow-up (visit 3). CMR included cine imaging, T1 mapping with extracellular volume (ECV) quantification, late gadolinium enhancement, and feature-tracking strain analysis (global longitudinal [GLS], circumferential [GCS], and radial [GRS] strain). CTRCD was defined and graded according to the 2022 ESC Cardio-Oncology Guidelines. RESULTS: The median age of patients was 46 (29.5-62) years; 53.1% were female. The mean cumulative doxorubicin dose was 295 ± 57 mg/m². hs-cTnT levels increased progressively from baseline (0.006 ± 0.005 ng/mL) to visit 2 (0.022 ± 0.016 ng/mL; p < 0.001), while NT-proBNP did not change significantly (p = 0.086). TTE showed a significant decline in LVEF by the Simpson method (62.92 ± 5.61% to 60.23 ± 5.41%; p = 0.037) and progressive worsening of GLS (- 19.84 ± 2.35% to - 18.31 ± 2.73%; p = 0.001). CMR-derived LVEF also declined (61.98 ± 6.08% to 57.34 ± 7.29%; p < 0.001), accompanied by significant deterioration of GLS, GCS, and GRS (p < 0.001 for all). CTRCD was identified in 7 patients (14.9%) by CMR and 5 (10.6%) by TTE (p = 0.625), with substantial agreement between modalities (κ = 0.619; p < 0.001). A relative GLS decline > 15% was observed by CMR in 34.1% of patients at visit 1 and 43.9% at visit 2, exceeding the corresponding TTE-detected rates (15.2% and 18.6%). CONCLUSIONS: CMR-derived strain identified myocardial functional abnormalities during anthracycline therapy. Whether these abnormalities represent earlier manifestations of clinically relevant cardiotoxicity requires confirmation in larger prospective studies with longer follow-up.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42900965","pmid":"42900965","pmcid":"","doi":"10.1016/j.jss.2026.09.015","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900965/","notice_url":"","trial_url":"","pub_date":"2026-Sep-22","briefing_date":"2026-10-22","journal_abbr":"J Surg Res","journal_full":"JOURNAL OF SURGICAL RESEARCH","tier":"B","if_val":1.6,"zone":"JCR Q3 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Risk Factors for Early Intestinal Resection in Pediatric Crohn's Disease: A Nationwide Cohort Study.","title_en":"Risk Factors for Early Intestinal Resection in Pediatric Crohn's Disease: A Nationwide Cohort Study.","authors":"Bajzát D, Imrei M, Nagy R, Párniczky A, Gede N, Hegyi P, Karoliny A, Szentannay J et al.","affiliation_highlight":"Centre for Translational Medicine, Semmelweis University, Budapest, Hungary; Heim Pál National Pediatric Institute, Buda…","results":"INTRODUCTION: Complicated disease affects a substantial proportion of pediatric Crohn's disease (CD) patients and leads to surgery. A subset of children requires intestinal resection shortly after diagnosis.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Complicated disease affects a substantial proportion of pediatric Crohn's disease (CD) patients and leads to surgery. A subset of children requires intestinal resection shortly after diagnosis. Several risk factors for surgery are known; however, the predictors of these early resections have not been well defined. We aimed to characterize this patient group and identify risk factors associated with early intestinal resections. METHODS: We performed a retrospective analysis of patients under 18 y diagnosed with CD between 2010 and 2019, based on the Hungarian Pediatric inflammatory bowel disease Registry. We compared those patients who underwent intestinal resection within 6 mo after diagnosis (very early surgery group, VES) with those who did not require resection within 6 mo. Descriptive statistics and logistic regressions were used for the analysis. RESULTS: Out of 1040 newly diagnosed pediatric CD patients, 27 (2.6%) underwent intestinal resection within 6 mo of diagnosis. The mean age of the two groups did not significantly differ. The proportion of females was significantly higher in the VES group (63.0% versus 42.3%, P = 0.03). Multivariate analysis identified abdominal pain without diarrhea (odds ratio [OR]: 5.59; P = 0.02) and higher pediatric CD activity index (OR: 1.05; P = 0.02) as risk factors for VES. Diagnostic delay (OR: 0.99; P = 0.74) and perianal involvement (OR 2.84; P = 0.12) were not predictive for VES. CONCLUSIONS: VES is rare in pediatric CD, with a possible female predominance. Higher pediatric CD activity index at diagnosis indicates greater risk for early surgery.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901132","pmid":"42901132","pmcid":"","doi":"10.1016/j.rmed.2026.109237","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901132/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Respir Med","journal_full":"RESPIRATORY MEDICINE","tier":"B","if_val":3.3,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Apnea-hypopnea index-oxygen desaturation index (AHI-ODI) discordance in obstructive sleep apnea: association with symptom burden and cardiometabolic comorbidity: A retrospective cross-sectional study.","title_en":"Apnea-hypopnea index-oxygen desaturation index (AHI-ODI) discordance in obstructive sleep apnea: association with symptom burden and cardiometabolic comorbidity: A retrospective cross-sectional study.","authors":"Ehab A, Abdelwahab HW, Hamoda M, Elhosiny MM","affiliation_highlight":"Department of Chest Medicine, Faculty of Medicine, Mansoura University, Mansoura, Egypt; DGD Hemer Lung Center, Hemer, G…","results":"BACKGROUND: The apnea-hypopnea index (AHI) counts respiratory events but not the depth or duration of accompanying desaturation. We examined AHI-ODI discordance (AHI minus oxygen desaturation index, ODI) and its associat…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The apnea-hypopnea index (AHI) counts respiratory events but not the depth or duration of accompanying desaturation. We examined AHI-ODI discordance (AHI minus oxygen desaturation index, ODI) and its associations with daytime symptom burden and prevalent cardiometabolic comorbidity. METHODS: Single-center retrospective cross-sectional study of 200 adults with OSA (January 2023-January 2025). Five indices (AHI, ODI, mean SpO2, T90 and AHI-ODI discordance) were examined; excessive daytime sleepiness (EDS; Epworth Sleepiness Scale ≥ 11) was the primary outcome. Multivariable logistic regression adjusted for age, sex, BMI and an AHI-ODI × sex interaction. RESULTS: The cohort was 77.5% male, median age 57 years (48.8-64.2). For EDS, AHI-ODI discordance showed the numerically highest AUC (0.639, p < 0.001), followed by T90 (0.627), and mean SpO2 and ODI (0.609 each); AHI was not significant (0.546, p = 0.264). No pairwise difference was significant. AHI-ODI discordance remained independently associated with EDS after adjustment (OR 1.04 per event/h, 95% CI 1.01-1.07, p = 0.008), with no significant sex interaction. Among secondary outcomes, T90 showed the highest AUCs for diabetes mellitus (0.644) and hypertension (0.615), and mean SpO2 for heart failure (0.608). No index discriminated against previous stroke or atrial fibrillation. CONCLUSIONS: AHI-ODI discordance was independently, but only modestly, associated with EDS, whereas oxygenation indices were related to prevalent cardiometabolic comorbidity. The discrimination was insufficient, and all reported cut-offs are exploratory. AHI-ODI discordance is not a measure of sleep apnea-specific hypoxic burden.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902092","pmid":"42902092","pmcid":"9433155","doi":"10.1016/j.jvir.2016.02.030","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902092/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-22","journal_abbr":"Support Care Cancer","journal_full":"SUPPORTIVE CARE IN CANCER","tier":"B","if_val":3.4,"zone":"JCR Q1 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Patient characteristics and the safety of stent placement for malignant vena cava syndrome in Japan: a nationwide analysis.","title_en":"Patient characteristics and the safety of stent placement for malignant vena cava syndrome in Japan: a nationwide analysis.","authors":"Ozawa M, Nakama R, Inoue N, Miyamoto Y, Sone M, Fushimi K","affiliation_highlight":"Department of Diagnostic Radiology, National Cancer Center Hospital, 5-1-1, Tsukiji, Chuo-ku, Tokyo, 1040045, Japan.","results":"PURPOSE: To evaluate the overall safety of stent placement for malignant superior or inferior vena cava (SVC/IVC) syndrome by assessing adverse events in a nationwide multicenter population. METHODS: We conducted a retro…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: To evaluate the overall safety of stent placement for malignant superior or inferior vena cava (SVC/IVC) syndrome by assessing adverse events in a nationwide multicenter population. METHODS: We conducted a retrospective cohort study using the Japanese Diagnosis Procedure Combination nationwide inpatient database. Patients who underwent stent placement for malignant superior or inferior vena cava (SVC/IVC) syndrome between April 2019 and March 2023 were included. The primary endpoint was the overall incidence of adverse events, which were identified using International Classification of Diseases, 10th Revision codes. Secondary evaluations included patient characteristics, underlying malignancies, therapeutic interventions, 7-day mortality after stent placement, 30-day in-hospital mortality after admission, and comparisons between the SVC and IVC groups. RESULTS: This nationwide study included 301 patients from 137 hospitals, of whom 187 underwent SVC stenting, and 114 underwent IVC stenting. Overall, 34 adverse events occurred in 32 patients (10.6%). Red blood cell transfusion was required in 10 patients (3.3%), but no invasive treatment, including embolization, was required. Seven-day mortality after stenting was 5.0%, and 30-day in-hospital mortality after admission was 11.6%. In comparisons between the SVC and IVC groups, respiratory failure was more common after SVC stenting, whereas other adverse events and mortality were comparable between groups. Lung tumors predominated in SVC cases and liver tumors in IVC cases; multiple stents were used more frequently in IVC cases. CONCLUSION: Stent placement for malignant vena cava obstruction demonstrated an overall complication rate of 10.6% with no serious adverse events requiring invasive intervention.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902489","pmid":"42902489","pmcid":"","doi":"10.1111/ans.71027","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902489/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"ANZ J Surg","journal_full":"ANZ journal of surgery","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Recurrence Risk After Resection of Typical and Atypical Pulmonary Carcinoids: A Systematic Review and Meta-Analysis.","title_en":"Recurrence Risk After Resection of Typical and Atypical Pulmonary Carcinoids: A Systematic Review and Meta-Analysis.","authors":"Guevara-Tirado A, Barra GG, Espinoza MFXB","affiliation_highlight":"Universidad Científica del Sur, Lima, Peru.","results":"BACKGROUND: Pulmonary carcinoids generally have favorable outcomes after surgery, but postoperative recurrence differs substantially by histological subtype. Existing guidance recognizes atypical histology and nodal invo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Pulmonary carcinoids generally have favorable outcomes after surgery, but postoperative recurrence differs substantially by histological subtype. Existing guidance recognizes atypical histology and nodal involvement as adverse features, yet a focused quantitative synthesis of the magnitude and consistency of this association remains limited. METHODS: MEDLINE/PubMed, Scopus, and Embase were searched from inception to July 12, 2026 for surgical cohorts reporting postoperative recurrence. Two reviewers independently screened titles and abstracts and assessed full-text eligibility, with disagreements resolved by consensus. The primary meta-analysis emphasized the risk ratio (RR) of observed recurrence in atypical versus typical carcinoids using random-effects models with restricted maximum likelihood and modified Hartung-Knapp intervals; odds ratios (ORs) and risk differences were complementary measures. Time-defined recurrence, adjusted prognostic factors, and anatomical patterns were synthesized separately because of incompatible outcome definitions and effect measures. RESULTS: Eighteen reports were included in the review, 11 contributed structured quantitative evidence, and 7 independent comparative cohorts entered the primary meta-analysis. Among 1074 resected tumors, recurrence occurred in 24 of 816 typical carcinoids and 51 of 258 atypical carcinoids. The pooled RR of observed recurrence was 6.57 (95% CI, 3.65-11.84), with a complementary OR of 8.08 (95% CI, 4.20-15.53). No statistical heterogeneity was detected (I2 = 0%), but this result was interpreted cautiously because only seven studies were available and clinically important differences in follow-up, staging, pathological review, and surveillance remained. Leave-one-out RR estimates ranged from 5.77 to 7.48. Time-defined evidence suggested recurrence of approximately 18%-25% by 5 years and 29%-32% by 10 years in atypical tumors, whereas node-negative typical tumors generally remained below 5% at 10 years, although late events occurred. Nodal involvement, advanced pT category, and larger tumor size were adverse prognostic features. CONCLUSION: Observed recurrence after resection was substantially more frequent in atypical than in typical pulmonary carcinoids. Histology and nodal status provide a clinically useful basis for postoperative risk stratification, but the available evidence does not establish the optimal surveillance modality, interval, or duration.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902446","pmid":"42902446","pmcid":"","doi":"10.1111/apt.71061","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902446/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Aliment Pharmacol Ther","journal_full":"Alimentary pharmacology & therapeutics","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Eosinophilic Oesophagitis and Incidence of Gastrointestinal Cancer: A Population-Based Cohort Study.","title_en":"Eosinophilic Oesophagitis and Incidence of Gastrointestinal Cancer: A Population-Based Cohort Study.","authors":"Kurt G, Farkas DK, Dellon ES, Jensen ET, Sørensen HT","affiliation_highlight":"Department of Clinical Epidemiology, Center for Population Medicine, Aarhus University and Aarhus University Hospital, A…","results":"BACKGROUND: Evidence concerning gastrointestinal cancer risk after eosinophilic oesophagitis (EoE) diagnosis is limited. AIMS: To examine the association between EoE and incident gastrointestinal cancer in a population-b…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Evidence concerning gastrointestinal cancer risk after eosinophilic oesophagitis (EoE) diagnosis is limited. AIMS: To examine the association between EoE and incident gastrointestinal cancer in a population-based cohort. METHODS: Using nationwide Danish health registries, we identified all patients diagnosed with EoE between 1997 and 2024, using a validated algorithm. We computed standardised incidence ratios (SIRs) for gastrointestinal cancers overall and site-specific cancers compared with the general population. To distinguish short-term diagnostic activity from longer-term risk, we stratified analyses by < 1 and ≥ 1 year after EoE diagnosis. Secondary analyses examined oesophageal cancer incidence among EoE patients with coexisting Barrett's oesophagus (BE). RESULTS: Among 9115 EoE patients, 170 developed gastrointestinal cancers. During the first year after EoE diagnosis, the SIR was 2.83 (95% confidence interval: 2.10-3.74). Beyond 1 year, the overall SIR attenuated (1.03 [0.85-1.23]) but remained elevated for oesophageal cancer (2.40 [1.42-3.79]) and hepatocellular carcinoma (2.05 [0.98-3.77]). Among patients who developed oesophageal cancer ≥ 1 year after EoE diagnosis (n = 18), most had prior BE. The SIR for oesophageal cancer was 5.44 (2.90-9.31) among patients with both EoE and BE and 4.84 (4.36-5.37) among patients with BE alone. SIR for patients with EoE alone could not be reported due to the low number of cancer cases. CONCLUSIONS: One year after EoE diagnosis, oesophageal cancer and hepatocellular carcinoma rates remained elevated. Most oesophageal cancers occurred in patients with prior BE, suggesting that the association between EoE and oesophageal cancer may be mediated largely through BE.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902261","pmid":"42902261","pmcid":"PMC10834602","doi":"10.1007/s00103-023-03831-z","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902261/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-22","journal_abbr":"BMC Health Serv Res","journal_full":"BMC health services research","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cancer care: incidence, hospitalization and medical rehabilitation statistics for Germany from 2003 to 2016.","title_en":"Cancer care: incidence, hospitalization and medical rehabilitation statistics for Germany from 2003 to 2016.","authors":"Nowossadeck E, Barnes B","affiliation_highlight":"Department of Epidemiology and Health Monitoring, Robert Koch Institute, Nordufer 20, 13353, Berlin, Germany.","results":"BACKGROUND: In Germany, inpatient hospital and rehabilitation facilities are two main settings for the delivery of cancer care. Epidemiology and demography are major forces that influence the need for care in these setti…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: In Germany, inpatient hospital and rehabilitation facilities are two main settings for the delivery of cancer care. Epidemiology and demography are major forces that influence the need for care in these settings. This article examines the extent to which cancer incidence is associated with the use of inpatient and rehabilitative care. METHODS: Population-based estimates of cancer incidence and survival came from the German Center for Cancer Registry Data. Statistical data on inpatient and rehabilitative care came from the Federal Statistical Office. Analyses included annual numbers and rates of hospitalizations and rehabilitation cases, and joinpoint regression models of these cases in relation to incident case numbers covering the period 2003-2016. To calculate the ratio of rehabilitation cases to incident cases, the number of incident cases was adjusted for 1-year survival. RESULTS: The number of incident cancers increased from 2003 to 2016 (women: +9.6%; men: +7.0), whereas the difference in inpatient cases was far smaller (women -0.4%; men +4.5%). In 2016, there were 2.46 inpatient cases per incident case for women and 2.72 for men. This indicator varied: 1.87 for breast cancer (women only) and 3.33 for lung cancer (women and men). The estimated number of 1-year cancer survivors was 180,000 women and 185,900 men in 2016. The number of estimated cases in oncological rehabilitation per 100 1-year survivors among women increased from 59.2 (2003) to 65.2 (2010) and then decreased to 57.2 (2016). There was also an initial increase among men, from 50.8 (2003) to 51.5 (2008) and a subsequent decline to 46.9 (2016). CONCLUSIONS: Inpatient cases far exceed incident cases, which may reflect multiple hospitalizations for diagnostics and therapy of primary or recurring disease. The time trends of inpatient cases differ greatly from those of incident cases. This could be due to structural changes in the German health care system, such as possible shifts of services from the inpatient to the outpatient care sector. Regarding rehabilitation, the change in the trend of utilization has not been previously reported. Whether the ratio of rehabilitation cases to incidence indicates underuse of rehabilitative services cannot be assessed solely on the basis of the analyzed data.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42896259","pmid":"42896259","pmcid":"","doi":"10.1016/j.ejon.2026.103334","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42896259/","notice_url":"","trial_url":"","pub_date":"2026-Oct-02","briefing_date":"2026-10-22","journal_abbr":"Eur J Oncol Nurs","journal_full":"European Journal of Oncology Nursing","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"范围综述（scoping review）· 遵循Arksey与O'Malley框架及PRISMA-ScR报告规范","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":39,"score_breakdown":{"clinical":12,"methodology":19,"specialty":8,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"纳入研究整体","metric":"纳入研究数量","val":"54","stat":"","grounded":true,"checks":[{"num":"54","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"纳入研究整体","metric":"纳入研究数量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「纳入」无英文锚（词典未收录，宁误杀）","人群限定「整体」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"晚期癌症患者与家庭照护者死亡焦虑的范围综述：概念、相关因素与干预证据的整合与缺口","title_en":"Death anxiety in advanced cancer patients and family caregivers: A scoping review.","authors":"Sun Q, Yorke J, Loong HHF, Luo H, Xiao X, Liu Q, Mao T, Ho KY et al.","affiliation_highlight":"School of Nursing, The Hong Kong Polytechnic University, Hong Kong Special Administrative Region of China.","results":"共纳入54项研究；摘要未报告死亡焦虑患病率、相关因素效应量或干预效果的具体数值。","authors_conclusion":"本范围综述表明，晚期癌症中的死亡焦虑是一种多维且具关系性的现象，同时影响患者与照护者。将死亡焦虑视为共同的情感负担，凸显出需要超越以个体为基础的干预，转向整合性的二元干预以应对死亡焦虑。将死亡焦虑管理纳入整体照护模式可能改善情绪适应与终末期生活质量。后续研究应完善理论框架并开发循证策略，以减轻死亡焦虑在癌症患者-照护者二元体中的相互影响。","ai_note":"研究目的声称要描绘死亡焦虑的患病率（prevalence），但结果与结论部分未给出任何患病率数值或区间，主要终点信息缺失，实际产出偏向概念与主题归纳而非量化图谱；摘要称检索截至2026年1月5日，时间点在常规刊出流程中可疑（可能为预出版或笔误），需核对；未提及纳入研究的质量评价或偏倚风险评估，符合范围综述惯例但限制了“CALM等个体疗法有效”这一有效性表述的证据强度，且该表述无效应量支撑；二元干预“稀缺”的判断未给出具体数量，无法核实。","pico":{"p":"共纳入54项研究；对象为晚期癌症患者及其家庭照护者（摘要未报告各研究的样本量合计）","ic":"无预设干预对照比较；综述范畴涵盖死亡焦虑的概念化、患病率、相关因素与管理方式，涉及Managing Cancer and Living Meaningfully等个体化疗法及稀缺的二元整合干预"},"reason":"为晚期胸部肿瘤患者及其家庭照护者的心理社会照护研究提供议题框架与明确证据缺口，可用于界定死亡焦虑相关队列研究的结局指标选择（患者-照护者二元结局）及二元干预试验的设计依据，但不直接改变外科治疗或手术决策。","abstract_en":"PURPOSE: To map the landscape of death anxiety regarding its conceptualization, prevalence, correlates, and management within both patients and caregivers. METHOD: We systematically searched PubMed, EMBASE, CINAHL, PsycINFO, Web of Science, Ovid Medline, Cochrane Library, CNKI and Wanfang from their inception to 5 January, 2026. This scoping review was conducted following the framework of Arksey and O'Malley and was reported in accordance with the PRISMA-ScR guidelines. Following the screening of abstracts and full-text articles, data were extracted and synthesized using an inductive thematic analysis. RESULTS: A total of 54 studies were included. Death anxiety is multidimensional, involving fear of one's own death and loss, with varied measurement tools. Contributing factors are demographic, disease-related, psychosocial, and relational. Consequences include psychological distress, reduced quality of life, and compromised caregiving or decisions. Individual therapies like Managing Cancer and Living Meaningfully are effective for patients, but integrated dyadic interventions are scarce. CONCLUSIONS: This scoping review demonstrates that death anxiety in advanced cancer is a multidimensional and relational phenomenon influencing both patients and caregivers. Recognizing death anxiety as a shared emotional burden highlights the need to move beyond individual-based interventions toward integrated dyadic approaches that address death anxiety. Embedding death anxiety management within holistic care models may enhance emotional adaptation and end-of-life quality. Continued research should refine theoretical frameworks and develop evidence-based strategies to mitigate the reciprocal impact of death anxiety across cancer patient-caregiver dyads.","tags":["死亡焦虑","晚期癌症","家庭照护者","范围综述","心理社会肿瘤学","二元干预"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901146","pmid":"42901146","pmcid":"","doi":"10.1016/j.xcrm.2026.103103","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901146/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cell Rep Med","journal_full":"Cell Rep Med","tier":"A","if_val":14.0,"zone":"JCR Q1 · 1区","warned":false,"study_type":"基础转化研究（人源单细胞与空间转录组描述性分析＋小鼠遗传敲除与中和/治疗性抗体干预实验）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":38,"score_breakdown":{"clinical":3,"methodology":24,"specialty":3,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"CD47通过诱导成纤维细胞吞噬逃逸促进肠道纤维化，抗体阻断CD47-SIRPα在小鼠模型中减轻纤维化","title_en":"CD47 fuels intestinal fibrosis by inducing fibroblast phagocytic evasion and represents a therapeutic target.","authors":"Zhao X, Wang Y, Wang D, Wang X, Sun S, Li M, Song J, Zhuang H et al.","affiliation_highlight":"Department of Gastroenterology, Ruijin Hospital, Shanghai Jiao Tong University, School of Medicine, Shanghai 200025, Chi…","results":"","authors_conclusion":"CD47介导的吞噬逃逸是肠道纤维化的关键致病机制，CD47-SIRPα阻断是有前景的治疗靶点。","ai_note":"摘要未报告任何效应量、置信区间或P值，'schedule-dependent efficacy'（疗效依赖给药方案）的具体比较未展开；机制证据主要来自小鼠遗传与抗体实验，人源数据仅为单细胞/空间转录组的关联性描述，未见人源功能验证；'关键致病机制'的表述强于摘要所提供的证据层级。此外该研究主题为肠道纤维化，与胸部肿瘤/胸外科无直接对应，归入现有分类属勉强归类。","pico":{"p":"克罗恩病肠道纤维化组织（单细胞与空间转录组）及小鼠肠道纤维化模型；摘要未给出样本量","ic":"干预：成纤维细胞Cd47或巨噬细胞Sirpa遗传敲除、CD47-SIRPα检查点中和/治疗性抗体阻断、IL-1β中和抗体；对照：未明确描述对照设置"},"reason":"研究对象为克罗恩病肠道纤维化，与胸外科及胸部肿瘤的临床决策无直接关联；仅可作为'吞噬检查点（CD47-SIRPα）调控纤维化微环境'这一机制的参照，供胸部肿瘤纤维化/间质微环境相关课题设计时借鉴其单细胞＋空间转录组＋遗传学验证的证据链范式，对临床判断影响极小。","abstract_en":"Intestinal fibrosis is a major complication of Crohn's disease, for which targeted therapies remain unavailable. Fibrosis is defined by excess matrix deposition, which may result from inadequate phagocytic clearance, yet how phagocytosis shifts here is unclear. Using single-cell and spatial transcriptomics, we identify fibrosis-associated CD47hi fibroblasts coupled to SIRPAhi macrophages in fibrotic regions. Cell-cell communication analyses and neutralizing-antibody experiments identify interleukin-1β as a mediator of their crosstalk, forming a profibrotic niche characterized by phagocytic evasion. Genetic disruption of fibroblast Cd47 or macrophage Sirpa enhances fibroblast clearance and attenuates fibrosis. Mechanistically, checkpoint disruption reprograms macrophages toward an NRF2-associated pro-phagocytic state, linking enhanced clearance to the antifibrotic response. Furthermore, therapeutic antibody blockade of this checkpoint attenuates intestinal fibrosis in mouse models with schedule-dependent efficacy. Collectively, these findings support CD47-mediated phagocytic evasion as a key pathogenic mechanism in intestinal fibrosis and identify CD47-SIRPα blockade as a promising therapeutic target.","tags":["CD47-SIRPα","肠道纤维化","吞噬逃逸","单细胞空间转录组","克罗恩病","非胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901820","pmid":"42901820","pmcid":"","doi":"10.1016/j.trecan.2026.09.010","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901820/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Trends Cancer","journal_full":"Trends Cancer","tier":"C","if_val":21.6,"zone":"JCR Q1 · 未收录","warned":false,"study_type":"叙述性综述/观点文章（Perspective）· 非系统评价，无原始临床或实验数据","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":37,"score_breakdown":{"clinical":11,"methodology":9,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"以网络药理学视角理解双特异性抗体在非小细胞肺癌中的应用与耐药克服：一篇概念性综述（无原始数据）","title_en":"Bispecific antibodies in NSCLC: immune reengineering to neutralize adaptive tumor resistance.","authors":"Li Z, Wang H, Diao M, Liu R, Wang X, Xiong A, Zhou C, Tang Z et al.","affiliation_highlight":"Department of Pathology, Medical School of Nantong University, Nantong, China.","results":"","authors_conclusion":"We propose that a network pharmacology perspective can be adopted to understand the application of BsAbs in NSCLC and to guide their subsequent development.","ai_note":"本文为观点/综述类文章，摘要中未提供任何检索策略、纳入标准、证据等级或定量数据，无法评估其证据强度；核心论点（网络药理学视角指导双特异性抗体开发）属作者主张而非验证性结论；摘要以'高异质性导致原发与获得性耐药、单药序贯与经验性联合均难以克服'为前提，但未引用具体证据支持该断言，存在选择性论述空间；无阳性/阴性结果可供核对，方法学与结论的一致性信息不足。","pico":{"p":"","ic":""},"reason":"为晚期NSCLC双特异性抗体的研发逻辑提供概念框架，可作为抗体工程设计类研究立题与机制假设的背景引用，但不构成可直接改变临床决策的证据。","abstract_en":"Over the past few decades, the emergence of immunotherapy and single-target drugs has brought new promise to the treatment of non-small cell lung cancer (NSCLC). Yet the high heterogeneity of NSCLC leads to both primary and acquired resistance that neither sequential monotherapy nor empirical combinations can effectively overcome. In contrast to the conventional coadministration of two separate monoclonal antibodies, bispecific antibodies (BsAbs) feature a series of molecular engineering designs that confer inherent synergistic antitumor effects. We propose that a network pharmacology perspective can be adopted to understand the application of BsAbs in NSCLC and to guide their subsequent development.","tags":["双特异性抗体","NSCLC","免疫治疗耐药","网络药理学","综述/观点"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42901839","pmid":"42901839","pmcid":"","doi":"10.1016/j.amjsurg.2026.117300","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901839/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-22","journal_abbr":"Am J Surg","journal_full":"AMERICAN JOURNAL OF SURGERY","tier":"B","if_val":2.3,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A statewide analysis of the incidence and severity of injuries from motorcycle collisions after the Pennsylvania helmet law repeal.","title_en":"A statewide analysis of the incidence and severity of injuries from motorcycle collisions after the Pennsylvania helmet law repeal.","authors":"Reichert JM, Schlessinger NA, Perea LL","affiliation_highlight":"Department of Surgery, Division of Trauma and Acute Care Surgery, Penn Medicine Lancaster General Health, 555 N.","results":"BACKGROUND: Following Pennsylvania's motorcycle helmet law repeal, motorcycle collision (MCC) rates were fixed; however, injuries increased. We investigated post-repeal injury severity.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Following Pennsylvania's motorcycle helmet law repeal, motorcycle collision (MCC) rates were fixed; however, injuries increased. We investigated post-repeal injury severity. We hypothesized helmeted (H) motorcyclists would have better outcomes than unhelmeted (UH) motorcyclists and outcomes would worsen post repeal. METHODS: We retrospectively reviewed (7/1/1998-7/1/2023) MCC patients in the Pennsylvania Trauma Outcome Study database. We compared H and UH patients and Pre- and Post-repeal data (Pre:1998-2002; Post:2003-2023). Adolescent and geriatric subgroup analyses were performed. RESULTS: We included 36,943 patients: UH:14,069 and H:22,874. UH had higher ISS (p < 0.001), more severe head injuries (p < 0.001), and greater mortality (p < 0.001). Mortality was higher in UH geriatric motorcyclists (p < 0.001) and similar in adolescents (p = 0.129). Despite decreased helmet use post-repeal, ISS (p = 0.003), severe head injuries (p < 0.001) and mortality (p = 0.021) decreased. CONCLUSIONS: Overall, 62% of motorcyclists wore helmets. Although helmet use decreased post-repeal, outcomes were comparable. Decreased helmet use leaves motorists vulnerable to head injuries and worse outcomes.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902249","pmid":"42902249","pmcid":"6159082","doi":"10.1097/SCS.0000000000006266","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902249/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"BMC Med Imaging","journal_full":"BMC MEDICAL IMAGING","tier":"B","if_val":3.9,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Impact of nasal septal deviation, age, and sex on anterior, middle, and posterior clinoid process pneumatization: a morphological computed tomography study.","title_en":"Impact of nasal septal deviation, age, and sex on anterior, middle, and posterior clinoid process pneumatization: a morphological computed tomography study.","authors":"Soyal R, Digilli Ayaş B, Çiçekcibaşı AE, Aydoğdu D","affiliation_highlight":"Department of Anatomy, Faculty of Medicine, Necmettin Erbakan University, Meram, Konya, 42090, Türkiye.","results":"BACKGROUND: Clinoid process pneumatization is a critical anatomical variation that influences surgical exposure and complication risks in skull base approaches. This study aimed to comprehensively evaluate the pneumatiza…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Clinoid process pneumatization is a critical anatomical variation that influences surgical exposure and complication risks in skull base approaches. This study aimed to comprehensively evaluate the pneumatization patterns of the anterior (ACP), middle (MCP), and posterior clinoid processes (PCP) and to determine the effects of age, sex, and nasal septal deviation (NSD) parameters, specifically angle severity and laterality, on these aeration patterns. METHODS: Computed tomography images of 250 adults (125 females, 125 males; aged 18-70 years) were retrospectively evaluated. Pneumatization patterns of the ACP and PCP were classified using a four-type grading system (Type 0-III). In addition, the presence of the MCP and its pneumatization status were evaluated. NSD was evaluated for laterality and angle severity (mild:<9°, moderate:9°-15°, severe:>15°). Statistical associations were assessed using chi-square tests and multivariate regression models. RESULTS: Type 0 (no pneumatization) predominated across all processes (ACP:81.8%, MCP:82.4%, PCP:82.6%), while Type III (total pneumatization) was rare (ACP:2.0%, PCP:2.2%). While univariate analysis showed age-related associations across all regions, multivariate logistic regression identified an independent association between age and ACP pneumatization, with younger individuals (18-34 years) exhibiting lower degrees of aeration (p < 0.01). Male sex was independently associated with bilateral MCP pneumatization (OR:3.016, p < 0.001) and right PCP pneumatization (OR:2.234, p = 0.032). Severe NSD angle (> 15°) was strongly associated with bilateral PCP pneumatization (p < 0.001) and higher-grade ACP aeration (p < 0.01). Furthermore, MCP presence showed strong ipsilateral clustering with ACP and PCP pneumatization patterns (p < 0.001). CONCLUSION: Clinoid process pneumatization demonstrates distinct anatomical associations with NSD angle severity, age, and sex. A severe NSD angle (> 15°) showed the strongest independent association with higher-grade pneumatization, particularly in the ACP and PCP, whereas NSD laterality was not independently associated with pneumatization. These findings support the inclusion of NSD angle severity in the radiological assessment of patients undergoing preoperative skull base CT, especially when extensive clinoid pneumatization may influence surgical planning.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902337","pmid":"42902337","pmcid":"11399209","doi":"10.1007/s00330-024-10705-8","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902337/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"BMC Pulm Med","journal_full":"BMC Pulmonary Medicine","tier":"B","if_val":3.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Predictive factors for prolonged hospitalization related to pneumothorax after CT-guided transthoracic needle biopsy.","title_en":"Predictive factors for prolonged hospitalization related to pneumothorax after CT-guided transthoracic needle biopsy.","authors":"Ko UW, Heo M, Park S, Hwang JH, Shin B","affiliation_highlight":"Department of Allergy, Pulmonology and Critical Care Medicine, Gil Medical Center, Gachon University College of Medicine…","results":"BACKGROUND: Pneumothorax is consistently reported as the most prevalent complication of computed tomography-guided transthoracic needle biopsy. While most cases of pneumothorax resolve with conservative management strate…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Pneumothorax is consistently reported as the most prevalent complication of computed tomography-guided transthoracic needle biopsy. While most cases of pneumothorax resolve with conservative management strategies, some cases are linked to a more protracted clinical trajectory necessitating active intervention. However, few reports have described the clinical and procedural determinants of prolonged hospitalization after post-biopsy pneumothorax. METHODS: This retrospective study analyzed 1,457 CT-guided TTNB procedures performed at a tertiary referral center between January 2021 and December 2025. The incidence of post-biopsy pneumothorax was 20.5%. Among 82 patients with prolonged hospitalization due to pneumothorax, their management strategies were categorized into two groups: (1) high-concentration oxygen therapy (n = 54) and (2) invasive interventions, including percutaneous catheter drainage (PCD) or chest tube insertion (n = 28). Logistic regression models with backward selection were used to identify predictive factors for prolonged hospitalization. RESULTS: Among the 82 patients with prolonged hospitalization due to pneumothorax, the median age was 75 years and 75.6% were male. In multivariable analysis, a lower diffusing capacity for carbon monoxide (DLCO) was independently associated with prolonged hospitalization (adjusted odds ratio [aOR], 0.980; P = 0.004). In the high-concentration oxygen group, lower DLCO (aOR, 0.974; P = 0.007) and a trans-fissural needle route (aOR, 3.968; P = 0.028) were independently associated with prolonged hospitalization. Conversely, in the PCD/chest tube group, reduced forced expiratory volume in 1 s was independently associated with prolonged hospitalization (aOR, 0.961; P = 0.002). CONCLUSIONS: In patients with post-biopsy pneumothorax, impaired pulmonary function may be linked to a prolonged clinical course. Incorporating these pre-procedural physiological markers may facilitate improved risk stratification and optimized hospital resource allocation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902296","pmid":"42902296","pmcid":"","doi":"10.1016/j.ypmed.2019.03.002","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902296/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-22","journal_abbr":"BMC Surg","journal_full":"BMC Surgery","tier":"B","if_val":2.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Impact of abdominal drainage time and bed rest duration on postoperative recovery in patients undergoing laparoscopic appendectomy: a single-center retrospective study.","title_en":"Impact of abdominal drainage time and bed rest duration on postoperative recovery in patients undergoing laparoscopic appendectomy: a single-center retrospective study.","authors":"Xie Y, Liu X, Qian XZ","affiliation_highlight":"Department of General Surgery, Renji Hospital, School of Medicine, Chongqing University, Chongqing, China; The Fifth Peo…","results":"BACKGROUND: The optimal duration of abdominal drainage and bed rest after laparoscopic appendectomy (LA) remains uncertain. This study investigated whether these modifiable factors are associated with residual intra-abdo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The optimal duration of abdominal drainage and bed rest after laparoscopic appendectomy (LA) remains uncertain. This study investigated whether these modifiable factors are associated with residual intra-abdominal infection (RII) and prolonged length of hospital stay (LOS). OBJECTIVE: To retrospectively analyze the risk factors for RII and prolonged LOS following LA and clarify the impact of abdominal drainage time and bed rest duration on postoperative recovery. METHODS: This retrospective study included 478 adults who underwent LA for acute appendicitis (2017-2020). Patients were followed weekly for 4 weeks. RII was defined as a composite endpoint occurring between postoperative day 5 and 4 weeks. Multivariable logistic regression identified factors associated with RII and prolonged LOS (≥5 days). Subgroup analyses were exploratory due to small sample sizes. RESULTS: RII occurred in 59 patients (12.3%). In the overall cohort, independent factors for RII were complicated appendicitis (OR 4.35), drainage ≥36 h (OR 3.69), bed rest ≥24 h (OR 3.27), and Neutrophil-to-lymphocyte ratio (NLR) ≥6.64 (OR 3.18) (all P<0.05). Drainage <36 h was not associated with increased risk. Exploratory subgroup analyses suggested drainage ≥36 h as the only factor for RII in uncomplicated appendicitis (OR 7.47), while bed rest ≥24 h (OR 7.21), elevated White blood cell count (WBC) (OR 4.65), and NLR (OR 6.02) were associated in complicated appendicitis. For prolonged LOS (198 events), independent factors were surgical complications (OR 6.14) and drainage ≥36 h (OR 4.74). Exploratory subgroup analyses showed surgical complications and drainage ≥36 h were significant in uncomplicated appendicitis, while only surgical complications remained in complicated appendicitis. CONCLUSION: Prolonged drainage (≥36 h) and bed rest (≥24 h) were associated with increased RII in the overall cohort; however, sensitivity analysis revealed variability in effect estimates, underscoring the need for cautious interpretation. Subgroup findings are exploratory and require confirmation. Prolonged drainage and surgical complications were associated with longer LOS. Drainage <36 h appeared safe. These findings suggest potential benefits of avoiding routine drainage, early drain removal, and early mobilization, but require confirmation in larger prospective studies.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902102","pmid":"42902102","pmcid":"6336003","doi":"10.1016/j.prp.2021.153605","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902102/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"Cancer Immunol Immunother","journal_full":"CANCER IMMUNOLOGY IMMUNOTHERAPY","tier":"B","if_val":5.8,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Impact of neck nodal yield on immune checkpoint inhibitor outcome after recurrence in head and neck squamous cell carcinoma.","title_en":"Impact of neck nodal yield on immune checkpoint inhibitor outcome after recurrence in head and neck squamous cell carcinoma.","authors":"Kim DH, Koh J, Jeon YK, Jung KC, Seok J, Chung EJ, Kwon SK, Ahn SH et al.","affiliation_highlight":"Department of Internal Medicine, Seoul National University Hospital, 101, Daehak-ro, Jongro-gu, Seoul, 03080, Republic o…","results":"INTRODUCTION: Neck dissection and adequate lymph node yield (LNY) are important in the treatment of head and neck squamous cell carcinoma (HNSCC). Cervical lymph nodes represent the primary sites for T-cell priming; howe…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Neck dissection and adequate lymph node yield (LNY) are important in the treatment of head and neck squamous cell carcinoma (HNSCC). Cervical lymph nodes represent the primary sites for T-cell priming; however, the impact of LNY on the efficacy of immune checkpoint inhibitors (ICIs) remains unclear. METHODS: A total of 120 patients with HNSCC who relapsed after surgical resection and subsequently received ICIs were included. The association of LNY, neutrophil-lymphocyte ratio (NLR), and programmed death-ligand 1 (PD-L1) expression with ICI outcomes were evaluated. RESULTS: Among 120 patients, 31 underwent unilateral, 82 bilateral, and 7 no neck dissection. The median LNY was 26 (mean, 29.9; range, 0-145). PD-L1 expression was evaluated in 80 patients, 69 of whom had combined positive score ≥ 1. The low-LNY group had a higher overall response rate to ICI than the high-LNY group (42.9% vs. 16.9%, P = 0.003). Patients with high LNY had inferior PFS (median, 1.3 vs. 5.9 months; P < 0.001) and OS (median, 9.7 vs. 21.1 months; P = 0.007) compared with those with low LNY. In multivariable analysis, high LNY and high NLR were independent predictors of poor survival, whereas PD-L1 expression was not. Among patients with PD-L1-positive tumors, those with high NLR had inferior survivals compared with those with low NLR. CONCLUSIONS: Extensive lymphatic ablation, as reflected by high LNY, may be associated with diminished ICI efficacy in relapsed HNSCC. These findings suggest that LNY warrants further investigation as a potential biomarker for ICI outcomes in patients with post-surgical recurrent HNSCC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42900993","pmid":"42900993","pmcid":"","doi":"10.1016/j.ejon.2026.103349","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900993/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-22","journal_abbr":"Eur J Oncol Nurs","journal_full":"European Journal of Oncology Nursing","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Barriers to follow-up and rehabilitation among head and neck cancer survivors in Norway: A qualitative study.","title_en":"Barriers to follow-up and rehabilitation among head and neck cancer survivors in Norway: A qualitative study.","authors":"Andreassen R, Hadler-Olsen E, Jönsson B, Jakobsen MD","affiliation_highlight":"The Public Dental Health Service Competence Centre of Northern Norway, Tromsø, Norway; Department of Medical Biology, Fa…","results":"PURPOSE: The aim was to explore head and neck cancer (HNC) survivors' experiences of barriers to follow-up care and rehabilitation in Norway 3-5 years after treatment. METHODS: This descriptive qualitative study involved…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: The aim was to explore head and neck cancer (HNC) survivors' experiences of barriers to follow-up care and rehabilitation in Norway 3-5 years after treatment. METHODS: This descriptive qualitative study involved 12 individual interviews with Norwegian HNC survivors. Data were analysed using inductive semantic thematic analysis. Haggerty's continuity-of-care framework subsequently informed the interpretation of findings in relation to informational continuity (the use of information to connect care), relational continuity (ongoing patient-provider relationships), and management continuity (coordinated and consistent care across providers). RESULTS: Four themes emerged: (1) limited continuity due to difficult access to services and frequent personnel changes, leading to fragmented care and insufficient follow-up; (2) challenges in information flow and communication, including complex and poorly tailored information, speech barriers, and increasing reliance on self-management; (3) inadequate coordination across care levels, with unclear responsibilities and limited collaboration, particularly during transitions to primary care; and (4) structural barriers affecting access, including limited availability of specialised services, financial burden, and challenges navigating digital systems. CONCLUSION: HNC survivors face substantial barriers to continuity in follow-up and rehabilitation, which may be particularly pronounced in rural areas. Targeted strategies to improve coordination, accessibility, and integration within and across healthcare services are needed to promote equitable, holistic, and long-term support for survivors with complex needs.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902041","pmid":"42902041","pmcid":"12235356","doi":"10.1080/0284186X.2016.1274049","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902041/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Imaging Inform Med","journal_full":"Journal of Imaging Informatics in Medicine","tier":"B","if_val":5.1,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"M4DTrack: A DICOM-Based Imaging Informatics Workflow for User-Supervised 4DCT Lung Tumor Motion Reporting.","title_en":"M4DTrack: A DICOM-Based Imaging Informatics Workflow for User-Supervised 4DCT Lung Tumor Motion Reporting.","authors":"Lee TK","affiliation_highlight":"Indiana University Health Arnett, Lafayette, IN, USA.","results":"Four-dimensional computed tomography (4DCT) is routinely used in radiotherapy simulation to evaluate respiration-induced tumor motion, but the motion information is often reviewed visually rather than captured as structu…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Four-dimensional computed tomography (4DCT) is routinely used in radiotherapy simulation to evaluate respiration-induced tumor motion, but the motion information is often reviewed visually rather than captured as structured, phase-resolved data. We developed and evaluated M4DTrack, a DICOM-based imaging-informatics workflow for user-supervised 4DCT lung tumor motion analysis and structured, exportable three-dimensional center-of-mass (CoM) motion reporting. M4DTrack imports phase-resolved DICOM CT images, groups images by respiratory phase, displays linked axial/coronal/sagittal views, supports crosshair-based tumor localization and HU inspection, and applies seed or linked 3D-box initialization with sequential phase-to-phase HU-volume propagation. An 8-case lower-lobe lung 4DCT dataset (80 respiratory phases) was analyzed. Directional amplitudes, 3D vector amplitude, maximum phase-wise displacement, and agreement with independent ITV-GTV reference amplitudes were quantified. HU-weighted CoM amplitudes were 2.44 ± 1.44 mm, 2.64 ± 1.37 mm, and 6.04 ± 2.48 mm in X, Y, and Z patient-coordinate directions, respectively. Mean 3D vector amplitude was 7.26 ± 2.50 mm, and mean maximum phase-wise 3D displacement was 6.20 ± 2.10 mm. Biases versus ITV-GTV reference amplitudes were 0.01, - 0.84, and 0.23 mm for X, Y, and Z, respectively, with a 3D vector amplitude bias of - 0.29 mm. M4DTrack provides a user-supervised imaging-informatics bridge between qualitative 4DCT cine review and structured quantitative motion documentation. The pilot results support feasibility for generating exportable, phase-resolved tumor-motion metrics while preserving user-supervised review of 4DCT artifacts, HU-capture uncertainty, adjacent anatomy, and differences between CoM-based and extent-based measurements.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902040","pmid":"42902040","pmcid":"","doi":"10.1007/s10278-026-02432-x","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902040/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Imaging Inform Med","journal_full":"Journal of Imaging Informatics in Medicine","tier":"B","if_val":5.1,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"3D-DDN Faster R-CNN: Pulmonary Nodule Detection Through Cross-Slice Feature Fusion and Dynamic Displacement Modeling.","title_en":"3D-DDN Faster R-CNN: Pulmonary Nodule Detection Through Cross-Slice Feature Fusion and Dynamic Displacement Modeling.","authors":"Guan C, Yang D, Leng Z, Liu S, Zu A, Luo D, Chen H, Wang J et al.","affiliation_highlight":"School of Microelectronics and Data Science, Anhui University of Technology, Ma'anshan, Anhui, China.","results":"Accurate pulmonary nodule detection in computed tomography (CT) remains challenging because small- and low-contrast nodules may resemble vessels and other anatomical structures on individual axial slices. We propose 3D-D…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Accurate pulmonary nodule detection in computed tomography (CT) remains challenging because small- and low-contrast nodules may resemble vessels and other anatomical structures on individual axial slices. We propose 3D-DDN Faster R-CNN, a multi-slice detection framework that incorporates structured local axial context into a two-stage detector. The five-slice interactive blending (5-SIB) strategy organizes five consecutive CT slices as an ordered contextual group and preserves slice-specific feature streams extracted by a shared two-dimensional backbone. The cross-slice feature fusion (CSFF) module applies slice-wise spatial self-attention at shallow feature levels and learnable cross-slice aggregation at deep feature and region-of-interest levels. The dynamic displacement constraint (DDC) models proposal displacement across adjacent slices using a positive-sample regression loss and a margin-based negative-sample contrastive loss, while a class-weighted focal loss alleviates foreground-background imbalance. The model was evaluated on a private hospital dataset, LIDC-IDRI, and LNDb using patient-level data partitions. On the private hospital dataset, 3D-DDN achieved an average precision at an IoU threshold of 0.5 (AP0.5) of 75.80% ± 1.05%, a sensitivity of 89.33% ± 1.91%, and a competition performance metric (CPM) of 91.20% ± 1.50%. The corresponding AP0.5 values on LIDC-IDRI and LNDb were 66.27% ± 0.45% and 48.20% ± 0.30%, respectively. Ablation experiments showed that direct five-slice stacking degraded performance, whereas structured feature fusion and displacement supervision recovered the performance loss and improved the overall detection profile. These results indicate that ordered cross-slice representation, hierarchical feature fusion, and proposal-displacement supervision provide complementary mechanisms for incorporating local three-dimensional context.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902039","pmid":"42902039","pmcid":"5548452","doi":"10.1016/j.is.2025.102549","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902039/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Imaging Inform Med","journal_full":"Journal of Imaging Informatics in Medicine","tier":"B","if_val":5.1,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Operational Ontology for Radiology: A Framework for Profiling and Characterizing CT Imaging Data.","title_en":"Operational Ontology for Radiology: A Framework for Profiling and Characterizing CT Imaging Data.","authors":"Alsaihati N, Cai Y, Wells J, Solomon J, Frush DP, Samei E","affiliation_highlight":"Center for Virtual Imaging Trials, Carl E.","results":"Medical imaging data are increasingly used for benchmarking, quality improvement, research, and artificial intelligence applications. However, the lack of consistent metadata characterization limits the reliability and s…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Medical imaging data are increasingly used for benchmarking, quality improvement, research, and artificial intelligence applications. However, the lack of consistent metadata characterization limits the reliability and scalability of such analyses. Existing standards provide syntactic interoperability but often fail to capture the semantic clinical context and workflow details necessary for secondary uses such as AI development and radiation safety assessment, affecting the utility for reproducible profiling of imaging examinations across institutions. In this work, we describe key gaps in current approaches to imaging data standardization. These include syntactic interoperability without semantic equivalence, limited representation of clinically relevant context, inconsistent definitions of radiology procedures across institutions, and the absence of mechanisms to systematically profile imaging examinations for analysis. These limitations make it difficult to compare imaging practices, aggregate datasets, and interpret results across sites. To address these challenges, we have devised an ontology framework, the Operational Ontology for Radiology (OOR), that models the radiology study workflow from ordering through interpretation using explicitly defined entities, relationships, and annotated data properties. A CT-focused implementation of the framework was then formed, including 34 classes, 15 object properties, and 156 data properties in this present formation. The framework was deployed in a demonstrative use case scenario to illustrate the utility of OOR in drawing more clinically relevant radiation dose aggregates from clinical CT data. The work demonstrates that OOR provides both a structured representation of imaging data and a foundation for more transparent data aggregat
