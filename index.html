<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

，3年DFS率67.7%。PSM后辅助免疫治疗显著改善DFS（77.1% vs 65.8%，log-rank P=0.037），但OS无显著改善（83.4% vs 69.4%，log-rank P=0.058）。多因素分析显示ypN、MPR及术后辅助免疫治疗为DFS独立预后因素。按MPR与ypN分层，DFS获益仅限于非MPR/ypN+亚组（HR=0.339；95% CI: 0.173-0.662；log-rank P<0.001），治疗-亚组交互P=0.025。","authors_conclusion":"在接受NCIT及高质量手术的LA-ESCC患者中，辅助免疫治疗显著改善非MPR/ypN+亚组的3年DFS，其他亚组无显著获益。","ai_note":"主要终点之一OS为阴性（P=0.058），结论与标题表述均以DFS及亚组获益为主，且亚组为事后探索性分层（交互P=0.025），样本量有限；回顾性设计下辅助免疫治疗的选择存在未测混杂（PSM仅平衡已知变量），非MPR/ypN+亚组的HR基于小样本，需前瞻性验证；摘要未提供各亚组例数及多因素HR/CI，信息不足。","pico":{"p":"2019-2023年8家中国高容量中心接受新辅助化疗免疫治疗（NCIT）的局部晚期食管鳞癌（LA-ESCC）患者，经高质量手术（R0切除+系统淋巴结清扫>19枚）筛选后共724例，中位随访40.3个月","ic":"NCIT+手术+术后辅助免疫治疗（NCIT+S+ICI） vs NCIT+手术（NCIT+S），PSM平衡基线特征"},"reason":"为LA-ESCC新辅助化疗免疫治疗后是否加用辅助免疫治疗提供分层依据，提示获益局限于非MPR/ypN+人群，可影响术后辅助治疗决策与后续前瞻试验的富集设计。","abstract_en":"BACKGROUND: In locally advanced esophageal squamous cell carcinoma (LA-ESCC), neoadjuvant chemoimmunotherapy (NCIT) plus high-quality surgery (R0 resection with systematic lymphadenectomy >19 nodes) is a promising strategy. However, the value of adjuvant immunotherapy remains unclear. This study aimed to evaluate the association between postoperative adjuvant immunotherapy and survival outcomes in a multicenter cohort. METHODS: This multicenter retrospective study enrolled LA-ESCC patients receiving NCIT from eight high-volume Chinese centers between 2019 and 2023. After screening for high-quality surgery, propensity score matching (PSM) balanced characteristics between the two groups: NCIT plus surgery (NCIT+S) and NCIT plus surgery followed by adjuvant immunotherapy (NCIT+S+ICI). The primary endpoints were overall survival (OS) and disease-free survival (DFS). A prognostic framework based on major pathological response (MPR) and postoperative pathological N stage (ypN) was constructed to refine patient selection. RESULTS: Among 724 patients with a median follow-up of 40.3 months, 3-year OS and DFS rates were 73.0% and 67.7%, respectively. After PSM, adjuvant immunotherapy significantly improved DFS (77.1% vs 65.8%, log-rank P=0.037), but not OS (83.4% vs 69.4%, log-rank P=0.058). Multivariate analysis identified ypN, MPR, and postoperative adjuvant immunotherapy as independent prognostic factors for DFS. Stratification by MPR and ypN status showed that DFS benefit from adjuvant immunotherapy was restricted to the non-MPR/ypN+ subgroup (HR=0.339; 95% CI: 0.173-0.662; log-rank P<0.001), with a significant treatment-by-subgroup interaction (P for interaction=0.025). CONCLUSIONS: Among LA-ESCC patients receiving NCIT and high-quality surgery, adjuvant immunotherapy significantly improves 3-year DFS in the non-MPR/ypN+ subgroup, with no significant benefit in other subgroups.","tags":["食管鳞癌","新辅助化疗免疫治疗","辅助免疫治疗","倾向性评分匹配","MPR/ypN分层","回顾性多中心"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901404","pmid":"42901404","pmcid":"","doi":"10.1016/j.jtcvs.2026.10.009","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901404/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Thorac Cardiovasc Surg","journal_full":"JOURNAL OF THORACIC AND CARDIOVASCULAR SURGERY","tier":"A","if_val":4.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"多中心回顾性队列 · 机器学习预测模型开发与内部验证（含医院留一法基准稳定性分析）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":70,"score_breakdown":{"clinical":26,"methodology":18,"specialty":18,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"肺切除队列","metric":"样本量","val":"16430","stat":"","grounded":true,"checks":[{"num":"16430","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"食管切除队列","metric":"样本量","val":"3068","stat":"","grounded":true,"checks":[{"num":"3068","grounded":true,"note":"数值命中（指标无可用 ry Quality Gateway Procedural Outcomes Models for General Thoracic Surgery Quality Assurance.","authors":"Ishwaran H, Blackstone EH","affiliation_highlight":"Division of Biostatistics, Cleveland Clinic, Cleveland, Ohio.","results":"共分析16,430例肺切除与3,068例食管切除；肺切除71个、食管切除63个术前变量中分别有35个与29个被识别为7个结局模型的重要预测因子。Out-of-bag几何均值：肺切除0.588–0.713，食管切除0.517–0.649；out-of-bag校准仅覆盖“适度的概率范围”。肺切除手术死亡率方面，逐一排除各焦点医院后，各医院间对比保持稳定","authors_conclusion":"使用当代机器学习，已初步建立肺癌肺切除与食管癌食管切除术后不良事件模型，为外科医生、患者及医院/医院系统提供患者风险评估工具并可用于指导普通胸外科质量改进举措","ai_note":"全文核心性能指标仅以“out-of-bag几何均值”呈现（0.588–0.713、0.517–0.649），未报告区分度（AUC/C统计量）或其置信区间，指标含义与临床可用阈值无法判断；校准仅描述为覆盖“适度概率范围”，缺校准斜率/截距等数据；验证完全为内部（out-of-bag）与医院留出，无独立外部队列或前瞻性验证；7个模型对应多项终点，摘要未给出各单项/复合结局的事件数与定义，存在复合终点掩盖单项表现的可能；“医院间风险因素量级不同”与“对比稳定”仅做定性描述，未给数值；结论口径“提供风险评估工具”超出摘要所示证据强度。","pico":{"p":"9家医院、7个医院系统内因癌症行肺切除16,430例与食管切除3,068例的患者","ic":"以术前信息（肺切除71个、食管切除63个候选变量）为基础，采用随机森林分位数分类（针对不平衡数据）加无模型变量重要性筛选，构建5个单项结局模型与2个复合结局模型；以out-of-bag预测作正则化估计与内部验证，并行医院留出/留一分析评估机构基准稳定性；无外部对照干预组"},"reason":"为胸外科质量保证与术后不良事件风险分层提供多中心建模框架与可参照的基线样本量级，同时提示当前此类ML模型仅有内部验证、缺乏区分度与校准细节，尚不足以支撑个体化患者决策或跨机构直接比较。","abstract_en":"OBJECTIVE: To develop quality assurance models for adverse procedural events after lung resection and esophagectomy for cancer. METHODS: Using procedural outcomes after 16,430 lung resections and 3,068 esophagectomies for cancer at 9 hospitals in 7 hospital systems, we developed 5 individual and 2 composite outcome models from preoperative information. Random forest quantile classification for imbalanced data with model-free variable priority screening identified predictors. Out-of-bag prediction provided regularized estimates and internal validation. Hospital-holdout analysis assessed institutional benchmark stability. RESULTS: Of 71 lung resection and 63 esophagectomy preoperative variables, 35 and 29, respectively, were identified as important predictors across the 7 outcome models. These included demographics, advanced cancer, organ dysfunction, higher acuity, and planned surgical approach and resection extent. Out-of-bag calibration covered a modest range of probabilities. Out-of-bag geometric mean ranged from 0.588 to 0.713 for lung resection and 0.517 to 0.649 for esophagectomy. Continuous risk factors, particularly pulmonary function, provided high-importance information content, with complex dependency and interaction structure among predictors. Risk-factor magnitude differed among hospitals, as did their risk-adjusted outcomes according to patient risk as determined by counterfactual inference within a framework of virtual twins. For lung resection operative mortality, hospital-specific contrasts were stable when each focal hospital was excluded from the aggregate benchmark. CONCLUSIONS: Using contemporary machine learning, initial models for adverse procedural events after lung resection and esophagectomy for cancer have been developed. They provide surgeons, their patients, and hospital and hospital systems tools for patient risk assessment and for informing quality improvement initiatives in general thoracic surgery.","tags":["机器学习","风险预测模型","质量保证","肺切除","食管切除","内部验证"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42897222","pmid":"42897222","pmcid":"6981282","doi":"10.1016/j.molcel.2019.09.030","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42897222/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-22","journal_abbr":"Oncogene","journal_full":"Oncogene","tier":"A","if_val":9.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":61,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Activation of the endocytosis pathway stratifies subtypes and therapeutic sensitivity in colorectal cancer.","title_en":"Activation of the endocytosis pathway stratifies subtypes and therapeutic sensitivity in colorectal cancer.","authors":"Arai H, Elliott A, Yang Y, Farrell A, Millstein J, Ou FS, Innocenti F, Wang J et al.","affiliation_highlight":"Division of Medical Oncology, Norris Comprehensive Cancer Center, Keck School of Medicine, University of Southern Califo…","results":"Endocytosis regulates receptor trafficking and signaling, yet its role in colorectal cancer (CRC) remains unclear. We analyzed transcriptomic data from 15,025 CRC tumors to evaluate gene expression in clathrin-mediated e…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Endocytosis regulates receptor trafficking and signaling, yet its role in colorectal cancer (CRC) remains unclear. We analyzed transcriptomic data from 15,025 CRC tumors to evaluate gene expression in clathrin-mediated endocytosis (CME) and the endosomal sorting complexes required for transport (ESCRT) pathway. Pathway-level signatures were compared across consensus molecular subtypes (CMS) and examined in relation to oncogenic signaling programs, while individual endocytosis-related genes were evaluated for associations with clinical outcomes in an independent randomized trial cohort. Expression of CME and ESCRT pathways varied by CMS, with the highest expression in CMS4 and the lowest in CMS3. Endocytosis signatures correlated with multiple oncogenic signaling pathways, including MAPK, TGF-β, WNT, PI3K, NOTCH, and angiogenesis, suggesting broad links between endocytic activity and tumor biology. In the randomized phase III CALGB/SWOG 80405 trial, low expression of AP2M1-a core adaptor in the CME complex-was significantly associated with longer overall survival and progression-free survival in patients treated with anti-EGFR agents, but not in those receiving anti-VEGF agents. These findings suggest that endocytic trafficking may be associated with oncogenic signaling and differential therapeutic benefit in patients with metastatic CRC. The endocytosis pathway reflects biologically relevant heterogeneity in CRC and may help guide therapeutic stratification.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊，直接影响可切除胸部肿瘤围术期/新辅助方案选择","curation_clinical_value":"阅读后可直接核对可切除胸部肿瘤围术期/新辅助方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":true,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901435","pmid":"42901435","pmcid":"","doi":"10.1016/j.canlet.2026.218916","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901435/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cancer Lett","journal_full":"CANCER LETTERS","tier":"A","if_val":11.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"临床前基础研究 · 细胞系、原发肿瘤免疫组化、PDX及体内外模型（非临床试验）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":59,"score_breakdown":{"clinical":12,"methodology":22,"specialty":17,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"CDK9在胃食管腺癌中高表达并与不良生存相关；其降解剂YX0597在前临床模型中抑制肿瘤生长并增强放疗敏感性","title_en":"CDK9 Degradation Suppresses Gastroesophageal Cancer Growth and Overcomes Radiation Resistance through Chromatin Remodeling and YAP1/TEAD Downregulation.","authors":"Zhang YY, Ghelfi M, Xue Y, Chen H, Calendo G, Grana G, Li Y, Athavale D et al.","affiliation_highlight":"Coriell Institute for Medical Research, 403 Haddon Ave, Camden, NJ 08103, USA; Department of Biomedical Sciences, Cooper…","results":"","authors_conclusion":"CDK9是GEAC的关键致癌驱动因子，CDK9降解尤其联合YAP/TEAD抑制是难治性GEAC有前景的治疗策略。","ai_note":"信息不足：摘要未报告样本量、效应量及统计值；CDK9高表达与不良生存相关未给出HR/CI及校正因素；疗效与协同结论主要基于体外和动物前临床模型，尚不能直接外推至临床。","pico":{"p":"胃食管腺癌（GEAC）原发肿瘤、患者来源异种移植（PDX）模型及细胞系；样本量未报告","ic":"CDK9降解剂YX0597（单药及联合YAP/TEAD抑制）；对照未明确"},"reason":"为胃食管腺癌CDK9/YAP-TEAD靶向及放疗抵抗逆转提供前临床依据，影响后续转化研究与联合治疗策略设计；尚不直接改变当前临床决策。","abstract_en":"Gastroesophageal adenocarcinoma (GEAC) remains a highly aggressive malignancy with limited effective targeted therapies. Cyclin-dependent kinase 9 (CDK9), a key regulator of transcriptional elongation, has been implicated in oncogenic processes across multiple cancer types; however, its functional role and therapeutic potential in GEAC remain poorly defined. In this study, we systematically investigated CDK9 expression, function, and therapeutic targeting in GEAC, with particular emphasis on its interaction with the YAP/TEAD signaling axis. Immunohistochemical analysis of primary GEAC tumors and patient-derived xenografts revealed elevated CDK9 expression, which correlated with poor patient survival. Mechanistic studies using immunofluorescence and co-immunoprecipitation demonstrated a reciprocal regulatory interaction between CDK9 and YAP1, promoting transcriptional programs associated with tumor progression and radiation resistance. We developed novel CDK9-targeting proteolysis-targeting chimeras (PROTACs) and identified YX0597 as a potent CDK9 degrader. YX0597 effectively suppressed RNAP II Ser2 phosphorylation (RNAP II P-S2) and downregulated oncogenic drivers, including MCL-1. Functionally, CDK9 degradation markedly inhibited GEAC cell proliferation, invasion, and tumor sphere formation, with enhanced efficacy in radiation-resistant cells. Integrated RNA sequencing and ATAC sequencing revealed that CDK9 degradation increased chromatin accessibility, reactivated epigenetically silenced genes, and profoundly suppressed YAP/TEAD transcriptional activity. These coordinated transcriptional and epigenetic alterations disrupted oncogenic homeostasis, resulting in broad cytotoxicity. Importantly, co-targeting CDK9 and YAP/TEAD signaling produced strong synergistic antitumor effects in vitro and in vivo. Collectively, our findings identify CDK9 as a critical oncogenic driver in GEAC and highlight CDK9 degradation, particularly in combination with YAP/TEAD inhibition, as a promising therapeutic strategy for refractory GEAC.","tags":["胃食管腺癌","CDK9","PROTAC","YAP/TEAD","放疗抵抗","前临床研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901436","pmid":"42901436","pmcid":"","doi":"10.1016/j.canlet.2026.218905","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901436/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cancer Lett","journal_full":"CANCER LETTERS","tier":"A","if_val":11.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"基础转化研究：分子机制实验＋小鼠同种移植肿瘤模型＋ESCC患者单细胞RNA测序队列相关性分析","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":58,"score_breakdown":{"clinical":14,"methodology":19,"specialty":17,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"上呼吸消化道鳞状细胞癌中UBL3修饰通过降低核内POLE水平增强抗肿瘤免疫并提升PD-1阻断疗效的临床前研究","title_en":"UBL3 Modification Reduces Nuclear POLE Levels to Potentiate Antitumor Immunity in Aero-upper Digestive Squamous Cell Carcinomas.","authors":"Dong Z, Huang W, Zhang L, Guo Q, Zhang X, Yang Y, Wang X, Liu Z et al.","affiliation_highlight":"Department of Anesthesiology, Department of Cancer Neuroscience, Tianjin Medical University Cancer Institute & Hospital,…","results":"","authors_conclusion":"UBL3修饰是一种调控POLE亚细胞定位及其免疫治疗应答影响的新PTM机制，因此使UBL3修饰成为增强上呼吸消化道SCC患者免疫治疗疗效的有前景的免疫调节途径。","ai_note":"摘要未给出任何样本量、效应量、置信区间或P值，无法评估统计稳健性；临床相关性仅来自单细胞RNA测序队列的正相关，不能证明因果关系或预测价值；机制实验主要基于小鼠模型和细胞系，向ESCC/LUSC患者临床决策外推有限；摘要以“显著增强疗效”“有前景”表述为主，需警惕临床转化乐观倾向。","pico":{"p":"鼠源性上呼吸消化道鳞状细胞癌细胞及小鼠体内模型；接受新辅助化疗联合αPD-1治疗的ESCC患者单细胞RNA测序队列（样本量摘要未给出）","ic":"UBL3对Pole的修饰/UBL3表达水平；对照为未修饰或低表达状态，并评估αPD-1治疗应答"},"reason":"为ESCC/LUSC免疫治疗应答提供POLE翻译后修饰与cGAS-STING通路相关机制线索，并提示UBL3可能作为免疫治疗获益的生物标志物候选，但当前证据级别尚不足以直接影响患者选择或随访决策。","abstract_en":"While immune checkpoint inhibitors (ICIs) have revolutionized treatment of the patients with aero-upper digestive squamous cell carcinomas (SCCs), including esophageal squamous cell carcinoma (ESCC) and lung squamous cell carcinoma (LUSC), only a subset of patients benefit from ICIs, therefore entailing exploration of the mechanisms to regulate treatment responsiveness. POLE, as a subunit of DNA polymerase ε, possesses 3'-5' proofreading activity, and its mutations have been associated with favourable response to ICIs in several solid tumors. However, post-translational modification (PTM) of POLE and its impact on the therapeutic efficacy of ICIs are unknown. Here, this study demonstrates that ubiquitin-like protein 3 (Ubl3), whose expression is markedly downregulated in SCCs, covalently binds to Pole, reduces nuclear Pole levels, triggers DNA damage, and activates cGAS-STING signaling pathway. Notably, Ubl3 modification of Pole significantly primes the local immune microenvironment to mitigate the growth of murine aero-upper digestive SCC cells and boost the efficacy of αPD-1 treatment in vivo. Single-cell RNA sequencing (scRNA-seq) analysis further revealed that UBL3 expression is positively correlated with better clinical outcomes in a cohort of ESCC patients receiving neoadjuvant chemotherapy combined with αPD-1. Together, our findings unravel UBL3 modification as a novel PTM mechanism governing subcellular location of POLE and its influence on immunotherapy responsiveness, thus making UBL3 modification as a promising immunomodulatory approach to enhance immunotherapy efficacy in patients with aero-upper digestive SCCs.","tags":["ESCC","LUSC","免疫检查点抑制剂","POLE","UBL3","cGAS-STING"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42898854","pmid":"42898854","pmcid":"PMC11846563","doi":"10.1016/j.eclinm.2026.104213","nct_id":"NCT04003636","url":"https://pubmed.ncbi.nlm.nih.gov/42898854/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT04003636","pub_date":"2026-Oct","briefing_date":"2026-10-22","journal_abbr":"EClinicalMedicine","journal_full":"EClinicalMedicine","tier":"A","if_val":12.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":56,"score_breakdown":{"clinical":28,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Pembrolizumab plus gemcitabine and cisplatin for advanced biliary tract cancer: longer-term follow-up from the randomised, double-blind, placebo-controlled, phase 3 KEYNOTE-966 trial.","title_en":"Pembrolizumab plus gemcitabine and cisplatin for advanced biliary tract cancer: longer-term follow-up from the randomised, double-blind, placebo-controlled, phase 3 KEYNOTE-966 trial.","authors":"Ueno M, Yoo C, Ren Z, Furuse J, Kelley RK, Chan SL, Edeline J, Klümpen HJ et al.","affiliation_highlight":"Department of Gastroenterology, Kanagawa Cancer Center, Yokohama, Japan.","results":"BACKGROUND: At the final analysis of KEYNOTE-966 (median follow-up 25·6 months), pembrolizumab plus gemcitabine and cisplatin (pembrolizumab group) versus placebo plus gemcitabine and cisplatin (placebo group) provided a…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: At the final analysis of KEYNOTE-966 (median follow-up 25·6 months), pembrolizumab plus gemcitabine and cisplatin (pembrolizumab group) versus placebo plus gemcitabine and cisplatin (placebo group) provided a statistically significant, clinically meaningful improvement in overall survival without any new safety signals in participants with advanced biliary tract cancer. We report results from a median study follow-up of 36·6 months (∼3 years). METHODS: In the randomised, double-blind, placebo-controlled, phase 3 KEYNOTE-966 trial conducted at 175 medical centres worldwide, eligible participants aged ≥18 years with previously untreated advanced biliary tract cancer were randomly assigned (1:1) to pembrolizumab 200 mg or placebo intravenously every 3 weeks plus gemcitabine 1000 mg/m2 and cisplatin 25 mg/m2 intravenously on days 1 and 8 of every 3-week cycle. Randomisation was done using a central interactive voice-response system and stratified by geographical region, disease status, and site of origin in block sizes of four. The primary endpoint of overall survival was evaluated in the intention-to-treat population (all participants randomly assigned to a treatment). Safety was evaluated in the as-treated population, comprising all participants who received at least one dose of study treatment. As the primary endpoint was met at the final analysis, updated data are reported without p values. This study is registered at ClinicalTrials.gov, NCT04003636. FINDINGS: Between Oct 4, 2019, and June 8, 2021, 1069 participants were randomly assigned to the pembrolizumab group (n = 533) or the placebo group (n = 536). Median follow-up at data cutoff (Nov 14, 2023) was 36·6 months (IQR 32·7-41·4). The hazard ratio for overall survival was 0·86 (95% CI, 0·75-0·98) with pembrolizumab versus placebo; estimated 36-month overall survival rates were 13% (95% CI, 11-17) in the pembrolizumab group and 11% (95% CI, 8-14) in the placebo group. Grade 3 or 4 treatment-related adverse events occurred in 370 (70%) of 529 participants in the pembrolizumab group and 367 (69%) of 534 participants in the placebo group. No new treatment-related deaths occurred since the final analysis. INTERPRETATION: With extended follow-up, the survival benefit of pembrolizumab plus gemcitabine and cisplatin observed at the final analysis persists with approximately 3 years of follow-up, with no new safety signals among participants with previously untreated metastatic or unresectable biliary tract cancer. FUNDING: Merck Sharp & Dohme LLC, a subsidiary of Merck & Co., Inc., Rahway, NJ, USA.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊且明确陈述主要终点，直接影响局晚/晚期治疗线序与方案选择","curation_clinical_value":"阅读后可直接核对局晚/晚期治疗线序与方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":true,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902382","pmid":"42902382","pmcid":"12802299","doi":"10.1038/s41582-020-0391-x","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902382/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"J Transl Med","journal_full":"Journal of Translational Medicine","tier":"A","if_val":9.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"回顾性多来源队列研究 · 机器学习预测模型开发与内部验证","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":56,"score_breakdown":{"clinical":24,"methodology":18,"specialty":6,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"总体队列","metric":"脑转移发生率","val":"2,982/186,351 (1.6%)","stat":"","grounded":true,"checks":[{"num":"2982","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"186351","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"1.6%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"验证集","metric":"脑转移预测AUC（LASSO正则化逻辑回归）","val":"0.907","stat":"95% CI: 0.857-0.958","grounded":true,"checks":[{"num":"0.907","grounded":true,"note":"数值+语境锚命中"},{"num":"0.857","grounded":true,"note":"数值+语境锚命中"},{"num":"0.958","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"总体队列","metric":"脑转移与生存预后关联","val":"不良预后","stat":"p < 0.001","grounded":true,"checks":[{"num":"0.001","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"总体队列","metric":"脑转移发生率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」未在原摘要出现","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"验证集","metric":"脑转移预测AUC（LASSO正则化逻辑回归）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「验证集」无英文锚（词典未收录，宁误杀）"]},{"group":"总体队列","metric":"脑转移与生存预后关联","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「总体」未在原摘要出现"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"基于186,351例多来源队列构建可解释机器学习模型预测乳腺癌脑转移：内部验证AUC 0.907","title_en":"Interpretable machine learning model for brain metastasis in breast cancer: a large-scale, multi-center study.","authors":"Yuan Q, Sha Y, Yu R, Yu H, Ye R, Du Y, Deng H, Wang L et al.","affiliation_highlight":"Department of Breast Surgery, Harbin Medical University Cancer Hospital, Harbin, Heilongjiang, 150000, China.","results":"186,351例中2,982例(1.6%)发生脑转移；最终简约模型保留AJCC N/M/T分期、年龄与手术状态；LASSO正则化逻辑回归在验证集表现最优，AUC 0.907 (95% CI: 0.857-0.958)；模型校准良好并具临床净获益；生存分析证实脑转移与不良预后相关(p < 0.001)","authors_conclusion":"开发并内部验证了一个准确、临床可转化的乳腺癌脑转移预测模型，基于逾186,000例北美与亚洲队列；该网络工具可帮助临床医生识别高危个体，实现个体化管理并可能改善患者结局","ai_note":"预测因子包含AJCC M分期（即远处转移状态）及手术等治疗后变量，与脑转移的发生存在时序与因果交叠，存在信息泄漏、AUC被高估的风险；“多中心/大样本人群”为多来源数据合并后随机划分训练/验证集，作者结论亦自述为“内部验证”，缺乏真正的外部或时间验证；脑转移的判定时点（初诊时即M1 vs 随访中新发）未说明，直接影响模型的临床用途；1.6%极低事件率下未报告校准斜率、敏感度/特异度、NRI/IDI等量化指标，决策曲线仅定性描述；突出可解释性与在线工具，但未与现有分期或指南标准进行头对头比较，也未说明基于该模型筛查能否改善结局。","pico":{"p":"186,351例初诊乳腺癌患者，来自SEER、美国国家癌症数据库(NCDB)及一个中国多中心队列；其中2,982例(1.6%)发生脑转移","ic":"干预/暴露： demographic、临床病理、生物标志物及治疗相关变量（手术、化疗、内分泌治疗、新辅助治疗、放疗）作为候选预测因子，LASSO筛选后比较9种机器学习模型；对照：不同模型间AUC与决策曲线比较，最优模型部署为在线工具"},"reason":"展示了以常规临床病理变量+手术/治疗信息构建脑转移风险模型的路径与大规模基线发生率，为胸部肿瘤（如肺癌脑转移）同类预测研究提供建模、终点定义与验证设计的对照参照；但其预测因子含M分期与治疗后变量且仅内部验证，尚不足以支持改变乳腺癌或胸部肿瘤的脑转移筛查随访决策。","abstract_en":"BACKGROUND: Brain metastasis (BM) is a devastating complication of breast cancer (BC) with a poor prognosis. Early identification of high-risk patients is essential but currently lacks accurate predictive tools. This study aimed to develop a stable machine learning model for predicting BM in a large, diverse patient population. METHODS: We conducted a retrospective cohort study of 186,351 primary BC patients from the SEER program, the National Cancer Database, and a multi-center Chinese cohort. Patients were split into training and validation sets. Candidate predictors included demographic, clinicopathological, biomarker, and treatment-related variables, including surgery, chemotherapy, endocrine therapy, neoadjuvant therapy, and radiotherapy. LASSO regression was used for feature selection. Nine machine learning models were developed and compared using area under the curve (AUC) and decision curve analysis. The optimal model was deployed as an online tool. RESULTS: Among 186,351 patients, 2,982 (1.6%) developed BM. In baseline comparisons, patients who developed BM more frequently exhibited advanced disease characteristics and different treatment patterns, likely reflecting more aggressive disease presentation. Key predictors retained in the final parsimonious model included AJCC N/M/T stage, age, and surgery status. The LASSO-regularized Logistic Regression model achieved superior discrimination in the validation set, with an AUC of 0.907 (95% CI: 0.857-0.958). The model demonstrated good calibration, clinical net benefit, and interpretability, with SHAP analysis confirming the contribution of each retained predictor to individual risk estimates. Survival analysis confirmed the poor prognosis associated with BM (p < 0.001). An interactive online tool was developed for real-time risk estimation. CONCLUSION: We developed and internally validated a accurate, clinically translatable model for predicting BM in BC using over 186,000 patients from North American and Asian cohorts. This web-based tool can assist clinicians in identifying high-risk individuals, enabling personalized management and potentially improving patient outcomes.","tags":["乳腺癌脑转移","机器学习预测模型","可解释性(SHAP)","SEER/NCDB","内部验证","低事件率"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42897686","pmid":"42897686","pmcid":"PMC7365102","doi":"10.1016/j.clon.2020.06.016","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42897686/","notice_url":"","trial_url":"","pub_date":"2026-Jul-22","briefing_date":"2026-10-22","journal_abbr":"Cardiooncology","journal_full":"Cardio-Oncology","tier":"B","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Performance status and outcomes in patients with cancer receiving thromboprophylaxis: a subanalysis of the AVERT trial.","title_en":"Performance status and outcomes in patients with cancer receiving thromboprophylaxis: a subanalysis of the AVERT trial.","authors":"Potere N, Xu Y, Mallick R, Wang TF, Hill D, Lazo-Langner A, Tagalakis V, Shivakumar S et al.","affiliation_highlight":"Department of Medicine, The Ottawa Hospital and Ottawa Hospital Research Institute, University of Ottawa, Ottawa, ON, Ca…","results":"BACKGROUND: The Eastern Cooperative Oncology Group Performance Status (ECOG-PS) is central to cancer care planning and prognostication. Whether ECOG-PS also carries prognostic value in the setting of primary thromboproph…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The Eastern Cooperative Oncology Group Performance Status (ECOG-PS) is central to cancer care planning and prognostication. Whether ECOG-PS also carries prognostic value in the setting of primary thromboprophylaxis for cancer-associated venous thromboembolism (VTE) remains unknown. OBJECTIVES: To evaluate the impact of ECOG-PS on clinical outcomes in ambulatory patients with cancer initiating chemotherapy. METHODS: This was a post-hoc analysis of the AVERT randomized controlled trial that evaluated apixaban (2.5 mg twice daily) for thromboprophylaxis in patients at intermediate-to-high VTE risk. Multivariable survival models assessed the association between ECOG-PS (0-1 versus 2-3) and the composite primary outcome of VTE or clinically relevant bleeding (CRB), as well as its individual components and all-cause mortality, over 180 days. RESULTS: Of 428 patients included, 368 (86.0%) and 60 (14.0%) had an ECOG-PS of 0-1 and 2-3, respectively. The primary composite outcome occurred in 12.8% (n = 47) in those with ECOG 0-1 and 18.3% (n = 11) with ECOG-PS 2-3 (6-month cumulative incidence: 13.0% [95% CI: 9.8%-16.7%] versus 19.9% [95% CI: 10.5%-31.4%], respectively). Worse performance status was associated with higher risks for the composite outcome (aHR: 1.76; 95% CI: 1.14-2.72; p = 0.011), CRB (aHR: 1.58; 95%CI: 1.53-1.63; p < 0.0001), and all-cause mortality (aHR: 5.77; 95% CI: 4.98-6.67; p < 0.0001). In exploratory treatment-effect analyses, apixaban reduced VTE risk across ECOG-PS strata, including among participants with ECOG-PS 2-3, without clear evidence of excess CRB in this subgroup. CONCLUSIONS: ECOG-PS predicts VTE-related outcomes in ambulatory patients with cancer and may inform individualized, value-based shared decision-making regarding anticoagulant thromboprophylaxis.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901884","pmid":"42901884","pmcid":"10114344","doi":"10.1186/s13000-023-01318-8","nct_id":"NCT04732494","url":"https://pubmed.ncbi.nlm.nih.gov/42901884/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT04732494","pub_date":"2026-Sep-18","briefing_date":"2026-10-22","journal_abbr":"Nat Commun","journal_full":"Nature communications","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Ociperlimab and tislelizumab in advanced esophageal squamous cell carcinoma (AdvanTIG-203): a phase II study.","title_en":"Ociperlimab and tislelizumab in advanced esophageal squamous cell carcinoma (AdvanTIG-203): a phase II study.","authors":"Wang F, Lin CY, Sun JM, Lu CH, Zhu X, Chen Z, Zhao Q, Kim IH et al.","affiliation_highlight":"Department of Medical Oncology, State Key Laboratory of Oncology in South China, Guangdong Provincial Clinical Research …","results":"Patients with esophageal squamous cell carcinoma (ESCC) have an unmet need for new therapies that improve survival. In this phase II trial, patients received ociperlimab and tislelizumab (A) or placebo and tislelizumab (…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Patients with esophageal squamous cell carcinoma (ESCC) have an unmet need for new therapies that improve survival. In this phase II trial, patients received ociperlimab and tislelizumab (A) or placebo and tislelizumab (B) (NCT04732494). The primary endpoint was objective response rate (ORR) assessed by the investigator per RECIST v1.1. A total of 125 patients were randomized to A (N = 62) and B (N = 63). The primary endpoint was not met, with an ORR (95% confidence interval [CI]) assessed by the investigator of 30.6% (19.6-43.7) for A and 20.6% (11.5-32.7) for B (stratified risk difference: 9.9% [95% CI - 5.4 to 25.3]; stratified 2-sided p = 0.2114). At the final analysis, median OS (95% CI) was 10.2 (7.9-19.5) months for A and 9.3 (6.4-14.8) months for B (stratified HR [95% CI]: 0.92 [0.58-1.45]). A total of 25.8% (16/62) and 20.6% (13/63) of patients in A and B, respectively, experienced grade ≥3 treatment-related treatment-emergent adverse events. Exploratory biomarker analyses showed that patients with an inflamed tumor microenvironment, shown by the enriched expression of natural killer (NK) cells, T cells, macrophages, dendritic cells, and B-cell signatures, and NK cell signature enrichment, may benefit from ociperlimab plus tislelizumab. Adding ociperlimab to tislelizumab did not provide significant efficacy improvement in recurrent/metastatic second-line ESCC; the addition of ociperlimab to tislelizumab was generally well-tolerated. Trial registration: Clinicaltrials.gov: NCT04732494.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901386","pmid":"42901386","pmcid":"","doi":"10.1016/j.jtho.2026.106162","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901386/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"J Thorac Oncol","journal_full":"Journal of Thoracic Oncology","tier":"S","if_val":23.3,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":50,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":15},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Brief Report: Characterization of the Potentially Actionable TP53 Y220C Mutation in Non-Small Cell Lung Cancer. A Multicenter, European Thoracic Oncology Platform Study.","title_en":"Brief Report: Characterization of the Potentially Actionable TP53 Y220C Mutation in Non-Small Cell Lung Cancer. A Multicenter, European Thoracic Oncology Platform Study.","authors":"Molina-Vila MA, Tsourti Z, Stenzinger A, Thüsen JV, Hillen LM, Hofman P, Rahmani-Khajouei S, Hegedüs B et al.","affiliation_highlight":"Laboratory of Oncology, Pangaea Oncology, Dexeus University Hospital, Barcelona, Spain.","results":"INTRODUCTION: The tumor suppressor TP53 is the most frequently mutated gene in human cancer, and drugs targeting specific mutant p53 proteins have been developed. Rezatapopt, which reactivates the Y220C p53 protein, was …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: The tumor suppressor TP53 is the most frequently mutated gene in human cancer, and drugs targeting specific mutant p53 proteins have been developed. Rezatapopt, which reactivates the Y220C p53 protein, was recently evaluated in the Phase I PYNNACLE trial in patients with solid tumors, with promising results. The trial did not enrol any non-small cell lung cancer (NSCLC) cases, and little is known about the clinicopathological characteristics and genetic profile of the TP53 Y220C NSCLC patients. METHODS: In this multicenter, European Thoracic Oncology Platform-sponsored study, we retrospectively collected data from NSCLC patients from several European institutions with Next Generation Sequencing data available. RESULTS: The study included 28,244 NSCLC patients. We found that 195 (0.7%) harbored the TP53 Y220C mutation, a prevalence higher than the average in solid tumors (0.4%). Half of these TP53 Y220C NSCLC patients did not carry any known drivers. No significant association was observed between the TP53 Y220C and gender, smoking status, histology or stage. However, the mutation was significantly more prevalent in EGFR-mutant than EGFR-wild-type tumors (1.7% vs. 0.7%; p=0.029). Finally, 17.0% of Y220C patients carried a second mutation in TP53. CONCLUSIONS: The TP53 Y220C has a frequency similar to other low abundance, actionable alterations in NSCLC. Patients with NSCLC should be screened and included in future trials of Y220C reactivators. Co-mutations in TP53 should also be analyzed, since they might be associated with intrinsic resistance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"S"}},{"id":"pmid_42896765","pmid":"42896765","pmcid":"","doi":"10.1016/j.healun.2026.10.010","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42896765/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-22","journal_abbr":"J Heart Lung Transplant","journal_full":"JOURNAL OF HEART AND LUNG TRANSPLANTATION","tier":"A","if_val":6.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Heart Transplantation in Adult Fontan Patients: New Insights from Fontan-Associated Liver Disease Beyond Traditional Predictors.","title_en":"Heart Transplantation in Adult Fontan Patients: New Insights from Fontan-Associated Liver Disease Beyond Traditional Predictors.","authors":"Rybicka J, Coats L, Crossland D, Patel P, Scott J, Anderson K, Hermuzi A, Adhvaryu K et al.","affiliation_highlight":"Adult Congenital and Paediatric Heart Unit, Freeman Hospital, Newcastle upon Tyne Hospitals NHS Foundation Trust, Newcas…","results":"BACKGROUND: Fontan patients are considered high risk for heart transplantation (HT) owing to their complex anatomy, multiple prior chest entries, and universal Fontan-associated liver disease (FALD). The impact of FALD a…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Fontan patients are considered high risk for heart transplantation (HT) owing to their complex anatomy, multiple prior chest entries, and universal Fontan-associated liver disease (FALD). The impact of FALD and other preoperative factors remains, however, uncertain. OBJECTIVES: We sought to identify factors associated with 90-day mortality after isolated HT in adults with Fontan circulation, with particular focus on the relationship between liver-related parameters and post-transplant outcomes. METHODS: A retrospective cohort study of all adult Fontan patients undergoing isolated HT was conducted. Factors associated with 90-day mortality were assessed using appropriate univariate analyses and penalized multivariable logistic regression. ROC analysis was used to derive liver size cut-offs and compare the discriminative performance of selected variables. A descriptive analysis of adult Fontan patients undergoing combined heart-liver transplantation (CHLT) was also performed for contextual comparison. RESULTS: Thirty-seven patients (mean age 30 years) underwent isolated HT; 19% (n=8) died within 90 days. Factors associated with increased 90-day mortality were >4 previous chest entries, major perioperative bleeding, and small liver size [total liver volume (TLV) ≤1366 mL, total liver volume indexed to body surface area (TLVi) <786 mL/m2 and liver transverse dimension (LTD) <21 cm]. Multiple chest veno-venous collaterals, >4 previous chest entries, and small liver were strongly associated with bleeding and subsequent fatal complications including sepsis, graft dysfunction, and bowel ischaemia. Within the study period, five other patients had undergone CHLT. All had biopsy confirmed advanced liver disease with features of clinically significant portal hypertension or hepatocellular carcinoma. One patient died within 90 days following prolonged cardiopulmonary bypass, major bleeding, graft dysfunction and sepsis, culminating in multiorgan failure. CONCLUSIONS: In Fontan patients undergoing isolated HT, >4 previous chest entries, major bleeding, and small liver volume were associated with increased 90-day mortality. Objective liver metrics (TLV ≤1366 mL, TLVi <786 mL/m2, TLD <21 cm) may provide adjunctive risk stratification for Fontan patients considered for isolated HT; however, these measures and proposed thresholds remain exploratory and require external validation. CHLT is a viable option, although non-liver related transplant risk factors may similarly influence outcomes. Detailed liver assessment and management at experienced, high-volume congenital transplant centres are important to optimizing outcomes in this complex population.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902351","pmid":"42902351","pmcid":"12770395","doi":"10.1002/cnm.2577","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902351/","notice_url":"","trial_url":"","pub_date":"2026-Oct-17","briefing_date":"2026-10-22","journal_abbr":"Respir Res","journal_full":"RESPIRATORY RESEARCH","tier":"A","if_val":5.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Predicting global and regional respiratory response in ARDS patients through individualized physics-based computational lung models: a prospective clinical pilot study.","title_en":"Predicting global and regional respiratory response in ARDS patients through individualized physics-based computational lung models: a prospective clinical pilot study.","authors":"Sablewski A, Ludwig M, Eichinger C, Lindner M, Frerichs I, Langguth P, Schädler D, Wall WA et al.","affiliation_highlight":"Department of Anesthesiology and Intensive Care Medicine, University Medical Center Schleswig-Holstein, Campus Kiel, Kie…","results":"BACKGROUND: Lung-protective ventilation is essential in the management of acute respiratory distress syndrome (ARDS), but current approaches are limited by the heterogeneity of lung pathology and a lack of individualized…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lung-protective ventilation is essential in the management of acute respiratory distress syndrome (ARDS), but current approaches are limited by the heterogeneity of lung pathology and a lack of individualized strategies. Patient-specific computational models may overcome these limitations by providing predictive and physiologically interpretable insights into global and regional lung behavior. METHODS: Ten mechanically ventilated patients with ARDS were evaluated in a monocentric prospective pilot study. A predefined study protocol included ventilatory maneuvers with systematic changes in ventilator mode, tidal volume, positive end-expiratory pressure (PEEP), and driving pressure. For each patient, a personalized, regionally resolved physics-based computational lung model was generated and calibrated to reproduce the individual respiratory system mechanics. Model predictions of tidal volume, airway and transpulmonary pressures, end-expiratory lung volume (EELV), and electrical impedance tomography (EIT)-derived regional ventilation distribution were simulated for different PEEP levels and evaluated against clinically assessed reference values. Model predictions were compared to clinical data using Pearson correlation coefficients (r), root mean square error (RMSE), and Bland-Altman analyses. RESULTS: A strong agreement was observed between simulated and clinical data for tidal volumes (r = 0.925, p < 0.001, RMSE = 0.053 l) and driving pressures (r = 0.940, p < 0.001, RMSE = 1.328 mbar) across all PEEP levels. At initial PEEP level, a high image correlation (r > 0.8) was found between measured and simulated regional ventilation in five of seven patients where EIT data were available. CONCLUSIONS: This pilot study demonstrates the capability of the individualized, regionally resolved physics-based computational lung model to reproduce patient-specific respiratory mechanics and key features of regional ventilation patterns in ARDS. The strong agreement between simulated and measured data supports the potential of this approach to estimate the physiological response to ventilator adjustments and lays the groundwork for future studies integrating computational modeling into clinical decision-making. TRIAL REGISTRATION: Registered at the German Clinical Trials Register (DRKS00017151, https://drks.de/search/en/trial/DRKS00017151 ) at 12th April 2019.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902005","pmid":"42902005","pmcid":"4947405","doi":"10.1016/j.jvs.2007.05.002","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902005/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Long-term follow-up in asymptomatic or oligosymptomatic inguinal hernias: watchful or watchless waiting?","title_en":"Long-term follow-up in asymptomatic or oligosymptomatic inguinal hernias: watchful or watchless waiting?","authors":"Valinoti AC, Aramburu S, Principe J, Giacone JA, Sadava EE","affiliation_highlight":"Department of Surgery, Hospital Alemán of Buenos Aires, Av.","results":"BACKGROUND: Watchful waiting (WW) for inguinal hernia has been established as a safe strategy for selected patients. However, this approach relies on regular long-term follow-up and adherence rates to WW are poorly chara…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Watchful waiting (WW) for inguinal hernia has been established as a safe strategy for selected patients. However, this approach relies on regular long-term follow-up and adherence rates to WW are poorly characterized. METHODS: A retrospective cohort study was performed including patients with inguinal hernia enrolled in a WW surveillance protocol between May 2013 and May 2026. Follow-up visits were scheduled every 6 months during the first year and annually thereafter. Demographic, clinical, and long-term adherence to surveillance protocols were analyzed Patients who were lost to follow-up were contacted via a structured questionnaire to update their clinical status and identify causes for discontinuing protocol. RESULTS: A total of 400 patients were included in the WW protocol. Overall follow-up adherence was low, with 240 patients (60.0%) failing to maintain scheduled surveillance at the end of this study. Kaplan-Meier analysis demonstrated a progressive drop out of the protocol over time. Younger age was an independent factor associated with follow-up discontinuation. Patients younger than 30 years demonstrated the highest rate of surveillance discontinuation (92.9%), compared with 63.6% among patients aged 30-50 years and 56.4% among patients older than 50 years (p = 0.015). Seventy-seven (32%) responded to the survey; the most frequent causes for discontinuation were the absence of symptoms and the lack of awareness of recommended follow-up intervals (36% and 27%, respectively). Eleven patients (14.1%) had an elective hernia repair at another institution. No emergency surgery was identified among patients who remained under institutional follow-up or among those successfully contacted after surveillance discontinuation. CONCLUSIONS: Watchful waiting appears to remain an acceptable management strategy for selected patients with asymptomatic or oligosymptomatic inguinal hernia. However, long-term adherence to surveillance beyond 2 years is low, posing a significant limitation to sustained WW management.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902004","pmid":"42902004","pmcid":"12835069","doi":"10.1186/s12893-025-03212-0","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902004/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Targeting indocyanine green where it matters most: a CRP-stratified cohort study in acute cholecystitis.","title_en":"Targeting indocyanine green where it matters most: a CRP-stratified cohort study in acute cholecystitis.","authors":"Carramiñana-Nuño R, Palacios-Gasós P, Lete-Aguirre N, Gasós-García M, Lagos-De Los Reyes Á, Fontana-Escartín S, Borrego-Estella VM","affiliation_highlight":"General and Digestive Surgery Department, Hospital Royo Villanova, Avenida de San Gregorio, s/n, 50015, Saragossa, Spain…","results":"BACKGROUND: Intraoperative indocyanine green (ICG) fluorescence cholangiography has been linked to fewer conversions to open surgery in emergency cholecystectomy, but it adds cost, and evidence for its effect on conversi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Intraoperative indocyanine green (ICG) fluorescence cholangiography has been linked to fewer conversions to open surgery in emergency cholecystectomy, but it adds cost, and evidence for its effect on conversion and operative time is graded moderate to low even by the consensus statement recommending routine use. We asked whether preoperative C-reactive protein (CRP), a marker of surgical difficulty and conversion risk, identifies patients in whom ICG's benefit is greatest. METHODS: Prospective cohort of 221 patients undergoing emergency laparoscopic cholecystectomy for acute cholecystitis, stratified by ICG use (85 ICG vs 136 conventional). We tested the interaction between CRP and ICG use on conversion using Firth penalized logistic regression, and on operative time, length of stay, and complications using linear/logistic regression with a log-CRP sensitivity analysis. We compared conversion rates across CRP tertiles and calculated a CRP-stratified estimated absolute risk reduction (ARR) and number needed to treat (NNT). RESULTS: Conversion occurred only in the conventional arm (12/136, 8.8%; 0/85 ICG), rising from 0 to 15.4% across CRP tertiles. The formal CRP×ICG interaction for conversion was not significant (Firth model, p = 0.878), reflecting the absence of ICG-arm events; the ARR associated with ICG use rose from not estimable to 9.8 points (95% CI 3.9-22.5; NNT≈10) in the middle tertile and 15.4 points (95% CI 8.0-27.5; NNT 6.5) in the highest. The interaction was significant for operative time (p = 0.045), strengthening under a log-CRP sensitivity model (p = 0.001), with CRP-related lengthening of surgery markedly smaller in the ICG arm. CONCLUSIONS: In this cohort, ICG's clinical benefit was not uniform across the CRP range. The CRP×ICG interaction reached significance for operative time; for conversion, the pattern was consistent and clinically plausible but not statistically significant, and should be regarded as hypothesis-generating. A CRP-informed strategy for prioritising ICG may be worth testing prospectively.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902003","pmid":"42902003","pmcid":"9465640","doi":"10.3389/fphar.2022.966486","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902003/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Transanal local excision reduces surgical burden without evidence of increased recurrence in lower rectal GIST: a multicenter inverse probability of treatment weighting analysis.","title_en":"Transanal local excision reduces surgical burden without evidence of increased recurrence in lower rectal GIST: a multicenter inverse probability of treatment weighting analysis.","authors":"Li Z, Huang L, Wan T, Liu H, Lv G, Luo S","affiliation_highlight":"Department of Gastrointestinal Surgery, Peking University Shenzhen Hospital, Shenzhen, 518036, Guangdong Province, China…","results":"BACKGROUND: Lower rectal gastrointestinal stromal tumors (rGISTs) pose a surgical challenge, as complete resection must be balanced against anorectal function preservation. Transanal local excision (taLE) may offer a les…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lower rectal gastrointestinal stromal tumors (rGISTs) pose a surgical challenge, as complete resection must be balanced against anorectal function preservation. Transanal local excision (taLE) may offer a less invasive alternative to transabdominal laparoscopic radical resection (tlRR), but comparative evidence, particularly for larger tumors, is limited. METHODS: We conducted a multicenter retrospective cohort study of patients with primary lower rGIST (lower tumor margin ≤ 5 cm from the anal verge; tumor size ≥ 2 cm and < 7 cm) undergoing taLE or tlRR (April 2015-April 2023). Inverse probability of treatment weighting (IPTW) balanced baseline characteristics, and doubly robust models adjusted residual imbalance. Perioperative outcomes, recurrence-free survival (RFS), and a prespecified ≥ 5 cm subgroup analysis were evaluated. RESULTS: Among 101 patients (taLE, n = 74; tlRR, n
