"trial_url":"","pub_date":"2026-Oct-02","briefing_date":"2026-10-25","journal_abbr":"Proteomes","journal_full":"Proteomes","tier":"B","if_val":null,"zone":"3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Proteomic Profiling of Immune Cell Infiltration Reveals Prognostic Immune Subtypes in Lung Adenocarcinoma.","title_en":"Proteomic Profiling of Immune Cell Infiltration Reveals Prognostic Immune Subtypes in Lung Adenocarcinoma.","authors":"Zhang R, Guo H, Li X, Zhao H, Qin J","affiliation_highlight":"Institutes of Biomedical Sciences, Fudan University, Shanghai 200032, China.","results":"BACKGROUND: Lung adenocarcinoma (LUAD) shows marked heterogeneity in its immune microenvironment, which may contribute to differences in disease-free survival (DFS) and clinical outcome. Although current LUAD classificat…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lung adenocarcinoma (LUAD) shows marked heterogeneity in its immune microenvironment, which may contribute to differences in disease-free survival (DFS) and clinical outcome. Although current LUAD classifications are largely based on genomic or transcriptomic features, immune subtypes defined directly from bulk proteomic data remain poorly characterized. Here, we used an immune-cell proteomic reference matrix to investigate proteome-defined immune states in LUAD and to identify prognostically relevant immune subtypes. METHODS: A quantitative human immune-cell proteomic reference matrix was integrated with LUAD tumor proteomic profiles. The reference matrix covered seven major immune lineages and 26 immune-cell states. The discovery cohort included 101 LUAD tumor proteomes with matched clinical information. After gene symbol matching and normalization, proteome-defined immune-cell state signals were estimated for each sample using non-negative constrained regression. These signals were then used for unsupervised subtype identification and DFS analysis. An independent Clinical Proteomic Tumor Analysis Consortium (CPTAC)-LUAD cohort was used for validation, with subtype analysis performed at the immune-cell marker protein module level. RESULTS: The immune-cell reference matrix contained 8400 quantified proteins, and 2381 proteins were retained for modeling. Based on 26 proteome-defined immune-cell state signals, LUAD samples separated into two immune proteomic subtypes. In the discovery cohort, Subtype 2 had significantly worse DFS than Subtype 1 (log-rank p = 0.0047; HR = 2.09, 95% CI 1.24-3.54). In the Clinical Proteomic Tumor Analysis Consortium (CPTAC)-LUAD validation cohort, marker protein module-based analysis again identified two subtypes with distinct DFS outcomes. The high-risk Subtype 2 showed higher Granulocyte and Myeloid/DC modules, whereas the low-risk Subtype 1 showed higher B cell, T cell, and NK-cell modules. Subtype 2 was associated with shorter DFS in the validation cohort (log-rank p = 0.0061; HR = 3.45, 95% CI: 1.35-8.82), and this association remained significant after adjustment for age, sex, and stage. CONCLUSIONS: Proteomic immune profiling identified two prognostically distinct immune subtypes in LUAD. The poor-DFS subtype was characterized by increased myeloid/granulocyte-related protein modules, whereas the favorable-DFS subtype showed stronger B cell-, T cell-, and NK cell-related signals. These findings support the use of bulk tumor proteomics to characterize clinically relevant immune heterogeneity in LUAD.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925312","pmid":"42925312","pmcid":"8645643","doi":"10.3389/fpsyt.2021.772694","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925312/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"Support Care Cancer","journal_full":"SUPPORTIVE CARE IN CANCER","tier":"B","if_val":3.4,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Prevalence, predictive factors, and the influential role of physical activity trajectories of cancer-related cognitive impairment among patients newly diagnosed with non-small cell lung cancer.","title_en":"Prevalence, predictive factors, and the influential role of physical activity trajectories of cancer-related cognitive impairment among patients newly diagnosed with non-small cell lung cancer.","authors":"Ho MH, Vardy JL, Lin YK, Chan WL, Takemura N, Wang L, Cheung DST, Lin CC et al.","affiliation_highlight":"School of Nursing, Li Ka Shing Faculty of Medicine, The University of Hong Kong, Pokfulam, Hong Kong SAR.","results":"PURPOSE: Evidence on the prevalence, trajectory, and predictors of cancer-related cognitive impairment (CRCI) in newly diagnosed non-small cell lung cancer (NSCLC) patients remains limited, particularly regarding the rol…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: Evidence on the prevalence, trajectory, and predictors of cancer-related cognitive impairment (CRCI) in newly diagnosed non-small cell lung cancer (NSCLC) patients remains limited, particularly regarding the role of physical activity patterns. This study aimed to estimate the prevalence of CRCI, assess changes in objective and subjective cognitive functions, and identify predictors of CRCI, focusing on physical activity trajectories among patients newly diagnosed with NSCLC in Hong Kong. METHODS: A prospective observational study was conducted with 327 NSCLC patients newly diagnosed within 4 weeks. Cognitive function was objectively assessed using the HK-MoCA 5-Minute Protocol and subjectively measured using the FACT-Cog scale at baseline and monthly for six months. Physical activity patterns were analyzed through group-based trajectory modelling. Multivariate logistic regression identified predictors of CRCI, adjusting for demographic and clinical factors. RESULTS: The prevalence of objective CRCI ranged from 17.5% to 29.1% over the 6-month period, with 24.1% affected at 6 months. Three distinct physical activity trajectories emerged: consistently low (43.1%), consistently high (11.9%), and declining from high to moderate activity (45%). Both consistently high and declining physical activity trajectories were associated with a significantly reduced CRCI risk (93.8% and 85.9% lower risk, respectively) compared to the consistently low activity group. Consistently high physical activity trajectories were also correlated with better objective and subjective cognitive performance. Additional predictors of CRCI included lower baseline perceived cognitive function and self-efficacy for exercise. CONCLUSION: This study provides novel evidence that physical activity trajectories are associated with CRCI in newly diagnosed lung cancer patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926932","pmid":"42926932","pmcid":"PMC13692619","doi":"10.21203/rs.3.rs-10998785/v1","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926932/","notice_url":"","trial_url":"","pub_date":"2026-Oct-06","briefing_date":"2026-10-25","journal_abbr":"Res Sq","journal_full":"Research square","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"nodule","category_label":"肺结节与早筛管理","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Baseline prevalence of lung cancer screening and associated factors among women in breast cancer screening clinics prior to the Pink &amp; Pearl program: A retrospective analysis of electronic health records.","title_en":"Baseline prevalence of lung cancer screening and associated factors among women in breast cancer screening clinics prior to the Pink &amp; Pearl program: A retrospective analysis of electronic health records.","authors":"Odeny B, Ramaswamy SG, Bowe B, Zewde E, Mnatzakanian A, Akinloye B, Odeny T, Lee MV et al.","affiliation_highlight":"","results":"Lung cancer screening (LCS) remains underutilized, with 18% uptake nationally, despite established evidence-based guidelines, particularly among women who engage with preventive care through breast cancer screening (BCS)…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Lung cancer screening (LCS) remains underutilized, with 18% uptake nationally, despite established evidence-based guidelines, particularly among women who engage with preventive care through breast cancer screening (BCS). We characterized baseline LCS uptake and its correlates among women receiving BCS at two participating hospitals. Methods We conducted a retrospective cohort study using six years of electronic health record data (October 2019-November 2025) from Barnes-Jewish West County Hospital and Christian Hospital. Women aged 50-80 with any documented smoking history were included. The primary outcome was LCS uptake, defined as evidence of at least one low-dose computed tomography scan. We conducted multivariable logistic regression models and assessed for effect modification by race and area deprivation using likelihood ratio tests. Results Of 9,686 women with smoking history, 3,209 (33.1%) had received at least one LCS. Pack-year documentation status (AOR 2.90; 95% CI: 2.63, 3.19), tobacco cessation medication use (AOR 2.21; 95% CI: 1.98, 2.48), and current smoking (AOR 1.84; 95% CI: 1.64, 2.07) were the factors most strongly associated with uptake. Non-Hispanic Black women had lower adjusted odds of obtaining LCS compared to non-Hispanic White women (AOR 0.87; 95% CI: 0.78, 0.98); estimates in the smaller pack-year subgroups were similar in direction but imprecise. Alcohol use was associated with lower odds of LCS uptake (0.81, 95% CI: 0.73, 0.89). Effect modification by race and area deprivation were not significant. Conclusions Baseline LCS uptake exceeded the national average; however, racial disparities were observed. Completeness of smoking history documentation, tobacco cessation medication use, and current smoking status were strongly associated with LCS uptake. These findings highlight the need for strategies to improve smoking history documentation and promote tobacco cessation efforts in cancer screening programs and establish the baseline against which the Pink & Pearl program, a co-located breast and lung cancer screening initiative at these sites, will be evaluated.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925639","pmid":"42925639","pmcid":"","doi":"10.1016/j.ejso.2026.112210","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925639/","notice_url":"","trial_url":"","pub_date":"2026-Oct-12","briefing_date":"2026-10-25","journal_abbr":"Eur J Surg Oncol","journal_full":"European journal of surgical oncology : the journal of the European Society of Surgical Oncology and the British Association of Surgical Oncology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A revised postneoadjuvant pathologic stage grouping for esophageal squamous cell carcinoma: A dual-center study.","title_en":"A revised postneoadjuvant pathologic stage grouping for esophageal squamous cell carcinoma: A dual-center study.","authors":"Geng Z, Li X, Zhou J, Zhang H, Xiao X, Li F, Fang P, Luan S et al.","affiliation_highlight":"Department of Thoracic Surgery, West China Hospital, Sichuan University, Chengdu, China.","results":"BACKGROUND: The 8th American Joint Committee on Cancer postneoadjuvant pathologic stage grouping is the current standard for risk stratification after neoadjuvant therapy and esophagectomy. However, its prognostic orderi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The 8th American Joint Committee on Cancer postneoadjuvant pathologic stage grouping is the current standard for risk stratification after neoadjuvant therapy and esophagectomy. However, its prognostic ordering may be unstable in esophageal squamous cell carcinoma, particularly across intermediate stage groups. METHODS: Patients with esophageal squamous cell carcinoma who underwent neoadjuvant therapy followed by esophagectomy at two centers were retrospectively identified. The West China Hospital cohort was used for development, and the First Affiliated Hospital of Zhengzhou University cohort was used for external validation. Recursive partitioning analysis using routine ypT and ypN categories was applied to develop a revised stage grouping. Prognostic ordering, model fit, and discrimination were compared with the 8th American Joint Committee on Cancer postneoadjuvant stage grouping. RESULTS: Among 1486 patients, 872 were included in the development cohort and 614 in the validation cohort. The revised system grouped patients into 5 prognostic categories and restored an ordered survival gradient in both cohorts, whereas the current American Joint Committee on Cancer stage showed survival overlap and inversion between stages II and IIIA. The revised system showed higher linear trend chi-square and likelihood ratio chi-square values and lower Akaike information criterion values in both cohorts. Concordance index and time-dependent area under the curve values were comparable between the two systems. CONCLUSIONS: The revised ypT/ypN-based stage grouping improved prognostic ordering and model fit in esophageal squamous cell carcinoma, while maintaining comparable discrimination. This approach may support postoperative risk stratification after neoadjuvant therapy and esophagectomy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924625","pmid":"42924625","pmcid":"","doi":"10.7189/jogh.16.04228","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924625/","notice_url":"","trial_url":"","pub_date":"2026-Oct-23","briefing_date":"2026-10-25","journal_abbr":"J Glob Health","journal_full":"Journal of global health","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Systemic sclerosis markedly impairs health-related quality of life: a single-centre tertiary cohort study with literature-based comparison to leading causes of global disease burden.","title_en":"Systemic sclerosis markedly impairs health-related quality of life: a single-centre tertiary cohort study with literature-based comparison to leading causes of global disease burden.","authors":"Alcacer-Pitarch B, Duarte-Fernandes R, Redmond AC, Rocamora-Gisbert C, Hensor E, Del Galdo F, Buch MH, Keenan AM et al.","affiliation_highlight":"Rheumatology Department, Leeds Teaching Hospitals NHS Trust, Leeds, UK.","results":"BACKGROUND: Systemic sclerosis (SSc) is a rare autoimmune condition that significantly impacts the physical and mental health of affected individuals, disrupting their daily life and overall well-being. However, its impa…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Systemic sclerosis (SSc) is a rare autoimmune condition that significantly impacts the physical and mental health of affected individuals, disrupting their daily life and overall well-being. However, its impact on health-related quality of life (HRQoL) has not been thoroughly compared to other chronic diseases, such as rheumatoid arthritis (RA) and stroke, the impact of which is clearly established. We explored how SSc influences HRQoL and compared its effect to that of six chronic diseases, considered the global leading causes of disease burden in high-income countries, and three common rheumatic and musculoskeletal diseases. METHODS: We collected HRQoL data from SSc patients enrolled in a cross-sectional observational study at The Leeds Teaching Hospital NHS Trust, UK. We used the Medical Outcomes Study Short Form-36 to measure HRQoL and compared the participants' scores to published data on unipolar major depression, ischaemic heart disease, stroke, chronic obstructive pulmonary disease, diabetes, lung cancer, osteoarthritis, RA, and lower back pain. Mean norm-based transformed scores (NBS) were compared for all eight SF-36 health domains. RESULTS: The 121 SSc patients (106 female; mean age = 57 years, standard deviation = 12.3), disease duration mean = 9.50 years, standard deviation = 7.4) in our study reported significantly worse perceived general health (mean (x̄) NBS = 32.82) than the other nine diseases reported in the literature. Role limitations due to physical problems (x̄ NBS = 34.77) were comparable to stroke, RA, and lung cancer. Significant impairments were noted in bodily pain (x̄ NBS = 36), similar to osteoarthritis, RA, and lower back pain, as well as vitality (x̄ NBS = 39.69), comparable to RA. Emotional role limitations (x̄ NBS = 41.78) were second only to major depression, similar to stroke and RA. CONCLUSIONS: We found that SSc has a substantial impact on HRQoL, resulting in significant physical and psychological impairment comparable to that experienced by patients with RA and stroke. These findings contextualise the burden of SSc and may inform future research and clinical practice aimed at improving patient care.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923393","pmid":"42923393","pmcid":"PMC3993088","doi":"10.1159/kdd/adkag003","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923393/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Kidney Dis (Basel)","journal_full":"Kidney diseases (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Risk Factors for Renal Injury in Lung Cancer Patients Receiving Vascular Endothelial Growth Factor Inhibitor Therapy.","title_en":"Risk Factors for Renal Injury in Lung Cancer Patients Receiving Vascular Endothelial Growth Factor Inhibitor Therapy.","authors":"Qin L, Zheng C, Chen Z, Hu H, Zeng T, Wang X, Zhang Z, Lin T et al.","affiliation_highlight":"Department of Nephrology, Guangdong Provincial People's Hospital, Guangdong Academy of Medical Sciences, Southern Medica…","results":"INTRODUCTION: Renal injury is an adverse effect of vascular endothelial growth factor (VEGF) inhibitor therapy. We investigated factors associated with renal injury and renal outcomes by VEGF inhibitor type in lung cance…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Renal injury is an adverse effect of vascular endothelial growth factor (VEGF) inhibitor therapy. We investigated factors associated with renal injury and renal outcomes by VEGF inhibitor type in lung cancer. METHODS: This retrospective cohort included 441 lung cancer patients treated with VEGF inhibitors. The primary cohort comprised 376 patients with an estimated glomerular filtration rate (eGFR) ≥60 mL/min/1.73 m2, negative dipstick proteinuria, and no hematuria at baseline; 65 patients underwent exploratory analysis. The primary composite renal outcome was incident proteinuria and/or eGFR decline >20% from baseline within 1 year. Cox models adjusted for clinical, tumor, and treatment covariates. Landmark and overlap-weighted sensitivity analyses were performed. Proteinuria and eGFR decline were analyzed separately. RESULTS: The primary composite renal outcome occurred in 250 patients (66.5%); among patients with an event, the median time to first event was 92.0 days. Diabetes mellitus (adjusted hazard ratio [aHR], 1.89; 95% confidence interval [CI], 1.17-3.05), higher body mass index (BMI) (aHR per 1-kg/m2 increase, 1.05; 95% CI, 1.00-1.09), and lower hemoglobin (aHR per 10-g/L increase, 0.86; 95% CI, 0.79-0.94) were independently associated with the primary outcome. VEGF inhibitor type was not associated with the primary outcome (overall p = 0.690), with similar overlap-weighted results. Incident proteinuria occurred in 120 patients (31.9%) and was associated with diabetes and lower hemoglobin; eGFR decline >20% occurred in 188 patients (50.0%) and was associated with lower hemoglobin. Platinum-containing chemotherapy showed a time-varying association with incident proteinuria. CONCLUSION: The primary composite renal outcome was common during the first year of VEGF inhibitor therapy. In the primary cohort, diabetes mellitus, higher BMI, and lower baseline hemoglobin were associated with this outcome, whereas no statistically significant association was observed for VEGF inhibitor type. These findings warrant validation in independent cohorts.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922499","pmid":"42922499","pmcid":"PMC13684486","doi":"10.64898/2026.09.01.748693","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922499/","notice_url":"","trial_url":"","pub_date":"2026-Sep-02","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":15,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Systemic hypoxia drives glycogen-fueled progression of lung adenocarcinoma.","title_en":"Systemic hypoxia drives glycogen-fueled progression of lung adenocarcinoma.","authors":"Clarke HA, Shedlock CJ, Peters H, Hawkinson TR, Kooser DD, Janzen O, Varma A, Bucco F et al.","affiliation_highlight":"","results":"UNLABELLED: In advanced stages, lung adenocarcinoma obstructs airways and disrupts ventilation-perfusion relationships in the lung, causing systemic hypoxemia and enabling a feed-forward loop that accelerates malignancy.…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"UNLABELLED: In advanced stages, lung adenocarcinoma obstructs airways and disrupts ventilation-perfusion relationships in the lung, causing systemic hypoxemia and enabling a feed-forward loop that accelerates malignancy. Systemic hypoxemia is also experienced due to common respiratory comorbidities such as chronic obstructive pulmonary disease (COPD) and obstructive sleep apnea (OSA), potentially accelerating malignancy. In a statewide electronic health record network, pre-existing COPD (598 matched pairs) or sleep apnea (235 matched pairs) independently predicted worse survival following incident lung cancer diagnosis. Since the mechanistic basis of the link between malignancy and hypoxia is not well understood, we created systemic hypoxia in Kras LSL- G12D/+ ;Trp53 fl/fl (KP) mice by delivering low inspired oxygen concentrations (8% inspired oxygen; 8 h daily). Hypoxia nearly doubled tumor multiplicity and selectively remodeled cancer central carbon metabolism. Spatially resolved metabolomics revealed marked tumor-compartment glycogen accumulation, elevated tricarboxylic-acid cycle intermediates, and depleted glycolytic pools. Quantitative proteomics across cellular models and autochthonous tumors demonstrated that systemic hypoxia drives glycogen mobilization selectively through the lysosomal enzyme acid α-glucosidase (GAA). Tumor-cell-autonomous deletion of GAA eliminated the hypoxia-driven growth advantage and disrupted downstream anabolic biosynthetic pathways. Thus, systemic hypoxia drives lung adenocarcinoma expansion by mobilizing lysosomal glycogen reserves through GAA to sustain proliferative growth. HIGHLIGHTS: Systemic hypoxia acts as an intrinsic driver of lung adenocarcinoma progression.Controlled systemic hypoxia doubles tumor multiplicity and reprograms cancer metabolism.Hypoxic tumors mobilize glycogen via lysosomal GAA independently of HIF-1α stabilization.Tumor-cell-autonomous deletion of GAA eliminates the hypoxia-mediated growth advantage in vivo.Pre-existing COPD and sleep apnea exacerbate hypoxemic burden and worsen clinical survival. ETOC BLURB: Lung tumors compromise pulmonary gas exchange, driving systemic hypoxemia that accelerates malignancy. Comorbidities such as chronic obstructive pulmonary disease (COPD) and obstructive sleep apnea compound this hypoxemic burden. Clarke et al. isolate systemic hypoxia in mice, showing it doubles lung tumor multiplicity by inducing glycogen degradation through lysosomal acid α-glucosidase (GAA). Deleting GAA eliminates this hypoxic growth advantage.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922296","pmid":"42922296","pmcid":"","doi":"10.4081/monaldi.2026.4380","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922296/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"Monaldi Arch Chest Dis","journal_full":"Monaldi archives for chest disease = Archivio Monaldi per le malattie del torace","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Treatment patterns and survival trends among patients with advanced-stage non-small cell lung cancer in Pakistan: a cancer registry-based flexible parametric analysis.","title_en":"Treatment patterns and survival trends among patients with advanced-stage non-small cell lung cancer in Pakistan: a cancer registry-based flexible parametric analysis.","authors":"Ali AS, Aqeel M, Rashid YA, Irfan M","affiliation_highlight":"Section of Pulmonary and Critical Care Medicine, Department of Medicine, Aga Khan University, Karachi.","results":"This study aimed to describe trends in survival by treatment modality in advanced-stage (III-IV) non-small cell lung cancer (NSCLC) patients. A retrospective observational study was conducted.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"This study aimed to describe trends in survival by treatment modality in advanced-stage (III-IV) non-small cell lung cancer (NSCLC) patients. A retrospective observational study was conducted. Patients diagnosed with primary NSCLC stage III-IV were included from the Cancer Registry of the Aga Khan University Hospital, Karachi, Pakistan. A flexible parametric (Royston-Parmar) model was used to estimate survival trends by treatment modality, sex, and age group. Overall, 663 patients were included; 489 (73.76%) were males. Eighty-one (12.22%) received 'radiotherapy only', 217 (32.73%) 'systemic therapy only', 136 (20.51%) 'systemic therapy with radiotherapy', 34 (5.13%) underwent 'surgery ± additional treatment', and 195 (29.41%) did not receive any treatment. Overall, predicted survival increased across all treatment modalities from 2011 to 2019, including the 'no treatment' group. In stage III disease, the absolute change in 1- and 2-year survival was most pronounced in the 'radiotherapy only' group, at 25.71% and 20.62%, respectively. In stage IV disease, the absolute change in 1-year survival was largest in the 'no treatment' group (24.44%) and in 2-year survival in the 'surgery ± additional treatment' group (33.46%). For 'surgery ± additional treatment' in stage III disease, patients aged >60 years had significantly lower odds of receiving surgery [odds ratio (OR) 0.25, 95% confidence interval (CI) 0.09-0.70, p=0.008]. Among stage IV patients, those diagnosed in 2017-2019 had significantly lower odds of receiving 'radiotherapy only' (OR 0.46, 95% CI 0.23-0.92, p=0.027), while squamous cell carcinoma histology was associated with significantly higher odds of receiving 'radiotherapy only' (OR 2.23, 95% CI 1.06-4.71, p=0.036). In conclusion, survival improved across all treatment modalities, including among untreated patients. Survival differences across modalities, including with surgical resection and combined therapy, most likely reflect selection of patients with more favorable prognostic profiles. Therefore, these findings should be interpreted as real-world treatment patterns and associated survival trends rather than evidence of comparative treatment efficacy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922234","pmid":"42922234","pmcid":"","doi":"10.7417/CT.2026.2165","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922234/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Clin Ter","journal_full":"La Clinica terapeutica","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Learning Curve in Thoracoscopic Mediastinal Mass Excision: A Multicenter Retrospective Cohort Study Using Cumulative Sum and Multivariable Regression Analysis.","title_en":"Learning Curve in Thoracoscopic Mediastinal Mass Excision: A Multicenter Retrospective Cohort Study Using Cumulative Sum and Multivariable Regression Analysis.","authors":"Elsayed K, Ibrahim GK, Elghanam M, Alshuhayeb A, Saleh W, Alshehri K, Badawi MW, Elsayed H et al.","affiliation_highlight":"Cardiothoracic Surgery Department, Faculty of Medicine, Al-Azhar University, Cairo, Egypt.","results":"BACKGROUND: Video-assisted thoracoscopic surgery (VATS) mediastinal mass excision has become the standard approach for anterior mediastinal lesions. Understanding its learning curve is essential for surgical training and…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Video-assisted thoracoscopic surgery (VATS) mediastinal mass excision has become the standard approach for anterior mediastinal lesions. Understanding its learning curve is essential for surgical training and quality assurance. The primary objective was to quantify the association between cumulative case experience (case sequence number) and operative time, the primary outcome, using cumulative sum (CUSUM) analysis and multivariable regression modelling. We tested the null hypothesis that operative time does not change with increasing case sequence after adjustment for patient-, tumour- and country-related factors. Secondary objectives were to estimate the number of cases required to achieve proficiency and to compare perioperative outcomes across learning phases and between participating countries. METHODS: This multicenter retrospective cohort study was conducted at five academic and tertiary-care centers in Egypt and Saudi Arabia between January 2023 and December 2025. Seventy-seven consecutive patients undergoing VATS excision of mediastinal masses were categorized into three phases: Early (first 20 cases), Intermediate (next 20 cases), and Late (last 37 cases). Cumulative sum (CUSUM) analysis was performed. Operative outcomes, including operative time, blood loss, conversion rate, and postoperative complications, were compared across phases and between countries (Egypt vs. Saudi Arabia). Multivariable linear regression and a linear mixed-effects model with participating centre as a random intercept were used to identify factors independently associated with operative time. RESULTS: Mean operative time significantly decreased across phases (189.5 ± 21.9 vs. 156.5 ± 26.4 vs. 139.7 ± 30.5 minutes; p < 0.001). CUSUM analysis demonstrated a learning curve inflection point between cases 20 and 26. After adjustment for age, sex, body mass index, myasthenia gravis, presence of a discrete mass, thymic neoplasm and country, case sequence number remained independently associated with shorter operative time (β = -1.14 min per case; 95% CI -1.47 to -0.80; p < 0.001; R² = 0.48, adjusted R² = 0.42), with consistent estimates using robust standard errors and a mixed-effects model with centre as a random intercept (β = -1.37; 95% CI -1.80 to -0.95). Patients treated in Saudi Arabia (n = 7) were older and more often had discrete neoplastic masses, but operative time did not differ significantly between countries before (p = 0.128) or after adjustment (p = 0.548). Conversion to open surgery occurred in 3.9% (n = 3), all in the Intermediate and Late phases. Overall mortality was 2.6% (n = 2), both in the Late phase and associated with complex cases. No significant differences were observed regarding ICU stay, hospital stay, or postoperative complications. CONCLUSION: VATS mediastinal mass excision is safe and feasible, with surgical proficiency achieved after approximately 20-26 cases. Operative time was the most reliable indicator of learning progression, and the learning effect persisted after multivariable adjustment for patient-, tumour- and country-related factors. Structured mentorship and careful case selection are recommended during the early learning phase.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921877","pmid":"42921877","pmcid":"","doi":"10.1021/acssensors.6c01917","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921877/","notice_url":"","trial_url":"","pub_date":"2026-Oct-23","briefing_date":"2026-10-25","journal_abbr":"ACS Sens","journal_full":"ACS sensors","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Label-Free Microfiber Biosensor Reveals PD-L1 Autoantibodies as Predictive Biomarkers in Esophageal Squamous Cell Carcinoma.","title_en":"Label-Free Microfiber Biosensor Reveals PD-L1 Autoantibodies as Predictive Biomarkers in Esophageal Squamous Cell Carcinoma.","authors":"Li Z, Xie R, Wang X, Xie Y, Liu S, Xv Z, Luo J, Chen Y et al.","affiliation_highlight":"State Key Laboratory of Information Photonics and Optical Communications, Beijing University of Posts and Telecommunicat…","results":"Heterogeneity in patient response to immunotherapy remains a major challenge in precision oncology. Here, the predictive value of serum programmed death-ligand 1 autoantibody (PD-L1 AAb) has been investigated for predict…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Heterogeneity in patient response to immunotherapy remains a major challenge in precision oncology. Here, the predictive value of serum programmed death-ligand 1 autoantibody (PD-L1 AAb) has been investigated for predicting response to neoadjuvant chemoimmunotherapy in patients with esophageal squamous cell carcinoma (ESCC), enabled by a label-free microfiber ring laser biosensor. The detection range of the microfiber biosensor for PD-L1 AAb concentrations is 1 to 250 ng/mL with a limit of detection of 0.069 ng/mL, and an assay time of 20 min. In a cohort of 42 ESCC patients, receiver operating characteristic curve analysis showed that PD-L1 AAbs achieved a higher area under the curve (AUC) than guideline-recommended PD-L1 immunohistochemistry-based combined positive score assessment, with an 11.68% increase in AUC. These results suggest that serum PD-L1 AAbs have potential as an exploratory predictive biomarker for neoadjuvant therapy response and the microfiber biosensor has potential as a tool for rapid immunotherapy stratification.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921227","pmid":"42921227","pmcid":"PMC13692503","doi":"10.7759/cureus.116793","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921227/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-25","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Standardising Pleural Management in Suspected Malignant Pleural Effusion Using a Structured Pre-Test Probability and RED Score-Guided Proforma: A Single-Centre Before-and-After Quality Improvement Project.","title_en":"Standardising Pleural Management in Suspected Malignant Pleural Effusion Using a Structured Pre-Test Probability and RED Score-Guided Proforma: A Single-Centre Before-and-After Quality Improvement Project.","authors":"Fadel AR, Al-Sarirreh H, Alrayyes A, Chinnappa N","affiliation_highlight":"Respiratory Medicine, Swansea Bay University Health Board, Swansea, GBR.","results":"Background The management of suspected malignant pleural effusion (MPE) is often variable, with many patients undergoing repeated pleural aspirations before a definitive management decision is made. The RED (respiratory …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background The management of suspected malignant pleural effusion (MPE) is often variable, with many patients undergoing repeated pleural aspirations before a definitive management decision is made. The RED (respiratory rate, effusion depth and dyspnoea) score is a recently derived and validated tool that predicts the time to the next pleural fluid drainage procedure. We describe a single-center, before-and-after quality improvement project (QIP) evaluating the introduction of a structured proforma incorporating clinical pre-test probability and the RED score into routine pleural clinic assessment. Methods A retrospective baseline cycle (Cycle 1, n=48) was compared with a prospective intervention cycle (Cycle 2, n=26) following the implementation of a structured assessment pro forma. The primary outcome was the proportion of patients experiencing unplanned emergency admission or earlier-than-planned pleural clinic review within three months of the index pleural procedure. Secondary outcomes included the proportion of patients requiring more than two pleural procedures and the proportion of patients achieving definitive pleural management within three months. Categorical variables were compared using Fisher's exact test given the small sample sizes; results are presented with risk differences, 95% confidence intervals, and odds ratios where calculable. No a priori power calculation was performed, and this exploratory before-and-after design does not permit causal inferences. Results In Cycle 1, 16/48 patients (33.3%) experienced an emergency admission or unplanned pleural clinic review, compared with 2/26 (7.7%) in Cycle 2 (Fisher's exact test, P=0.021; risk difference -25.6%, 95% CI -42.5 to -8.8; odds ratio 6.0). The proportion of patients requiring more than two pleural procedures fell from 33.3% to 22.7% (P=0.415, not statistically significant). Cytology was positive in 24/48 (50.0%) Cycle 1 patients and 10/26 (38.5%) Cycle 2 patients. The two cohorts differed descriptively in performance status (Eastern Cooperative Oncology Group (ECOG) ≥2:41.7% vs. 87.5%, P<0.001) and malignancy type distribution. RED scores were documented only anecdotally within free-text clinical notes for a subset of Cycle 2 patients and were not systematically recorded or analyzed as a distribution. Conclusions A structured pleural assessment pathway was associated with a statistically significant reduction in emergency presentations and a non-significant reduction in repeated procedures. However, given the small, single-center, non-randomised, uncontrolled before-and-after design, differing case mix between cohorts, and incomplete RED score documentation, these findings should be regarded as preliminary and hypothesis-generating. They support further, larger, multicenter evaluations rather than immediate wider adoption.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42920925","pmid":"42920925","pmcid":"PMC9083232","doi":"10.1016/j.jtocrr.2026.101077","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42920925/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"JTO Clin Res Rep","journal_full":"JTO Clinical and Research Reports","tier":"C","if_val":3.6,"zone":"JCR Q2 · 未收录","warned":false,"study_type":"队列研究（启发式判定）","category":"nodule","category_label":"肺结节与早筛管理","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Lung-Reporting and Data System Category (Lung-RADS) and Adherence to Low-Dose Computed Tomography Screening and Recommended Follow-Up: A Multicenter Cohort Study.","title_en":"Lung-Reporting and Data System Category (Lung-RADS) and Adherence to Low-Dose Computed Tomography Screening and Recommended Follow-Up: A Multicenter Cohort Study.","authors":"Shrestha P, Gould MK, Silvestri GA, Lou X, Slatore CG, Pickhardt PJ, Hochhegger B, Verma H et al.","affiliation_highlight":"Division of Population Health Sciences, Department of Surgery, College of Medicine, University of Florida, Gainesville, …","results":"BACKGROUND: Adherence to guideline-recommended low-dose computed tomography (CT) screening and follow-up remains suboptimal, and determinants may vary by Lung Imaging Reporting and Data System (Lung-RADS) category. METHO…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Adherence to guideline-recommended low-dose computed tomography (CT) screening and follow-up remains suboptimal, and determinants may vary by Lung Imaging Reporting and Data System (Lung-RADS) category. METHODS: This retrospective, multi-site cohort study used electronic medical records from adults aged 50 to 80 years. Eligible individuals had at least one primary care visit in the previous 12 months, no lung cancer diagnosis in the preceding 5 years, and underwent an index low-dose CT between 2016 and 2021. Participants were followed through 2022. Adherence to follow-up chest CT within 11 to 15 months (Lung-RADS 1-2) and category-specific recommended follow-up (Lung-RADS 3-4X) was assessed using mixed-effects logistic regression to estimate adjusted ORs (aORs) and 95% confidence intervals (CIs). RESULTS: Among 22,034 individuals with Lung-RADS 1 to 2, 21.67% completed follow-up CT within 11 to 15 months. The odds of adherence were higher among individuals aged 65 or more years (versus <65) (aOR = 1.22; 95% CI: 1.14-1.31) and those with chronic obstructive pulmonary disease (COPD) (aOR = 1.18; 95% CI: 1.09-1.27) and lower among black (versus white) individuals (aOR = 0.87; 95% CI: 0.79-0.96) and frail (versus non-frail) individuals (aOR = 0.88; 95% CI: 0.80-0.98). Among 4518 individuals with Lung-RADS 3 to 4X, 28.51% adhered to category-specific follow-up; COPD was the only factor independently associated with adherence (aOR = 1.22; 95% CI: 1.06-1.40). CONCLUSION: Adherence to follow-up CT and recommended care remains low in real-world settings; older age and COPD predicted higher adherence, while lower adherence among black individuals identifies a key target for improving lung cancer screening retention.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42914168","pmid":"42914168","pmcid":"PMC2734327","doi":"10.1016/j.clgc.2018.07.024","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42914168/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Eur Respir J","journal_full":"EUROPEAN RESPIRATORY JOURNAL","tier":"A","if_val":23.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"Comment/Letter · 对LDCT筛查偶发发现管理指南声明的评论与更新建议（非原始研究）","category":"nodule","category_label":"肺结节与早筛管理","score_total":38,"score_breakdown":{"clinical":10,"methodology":3,"specialty":17,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"对低剂量CT肺癌筛查偶发发现管理联合声明的评论：提出更新建议","title_en":"Comment on: ERS/ESTS/ESTRO/ESR/ESTI/EFOMP statement on management of incidental findings from low dose CT screening for lung cancer.","authors":"Rossi SH, Byass O, Bakewell R, Barrett T, Burbidge S, Cartledge J, Kitt J, Clark M et al.","affiliation_highlight":"Department of Surgery, University of Cambridge, Cambridge Biomedical Campus, Cambridge, UK.","results":"","authors_conclusion":"","ai_note":"摘要仅为评论/通信标题与链接，无原始研究设计、样本、终点或数值；无法判断更新建议的证据来源与严谨性，信息不足。","pico":{"p":"","ic":""},"reason":"涉及LDCT肺癌筛查偶发发现的管理口径，可能影响肺结节/偶发发现的随访与转诊判断，并为指南更新讨论提供线索。","abstract_en":"Suggested updates to the ERS/ESTS/ESTRO/ESR/ESTI/EFOMP statement on management of incidental findings from low dose CT screening for lung cancer https://bit.ly/4bavVIH","tags":["LDCT筛查","偶发发现","指南评论","肺结节管理"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42921584","pmid":"42921584","pmcid":"PMC13693919","doi":"10.1002/mco2.71082","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921584/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"基础与转化研究：5 种体外炎症衰老模型机制实验 + 两个独立横断面人群队列的相关性分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":37,"score_breakdown":{"clinical":6,"methodology":18,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"健康个体队列","metric":"样本量","val":"121","stat":"","grounded":true,"checks":[{"num":"121","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"2 型糖尿病队列","metric":"样本量","val":"93","stat":"","grounded":true,"checks":[{"num":"93","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"健康个体队列","metric":"样本量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「健康个体」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"2 型糖尿病队列","metric":"样本量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「糖尿病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"瘦素中和在多种炎症衰老细胞模型中减轻衰老与炎症表型，并与人群瘦素-炎症标志物水平相关","title_en":"Leptin Neutralization Attenuates Inflammaging in Endothelial and Immune Cell Models.","authors":"Pellegrini V, La Grotta R, Metallo A, Carreras F, Frigé C, Matacchione G, Giuliani A, Sabbatinelli J et al.","affiliation_highlight":"IRCCS MultiMedica Milan Italy.","results":"健康人群中 hs-CRP ≥ 3 mg/dL 者瘦素水平高于低于该阈值者，且经 BMI 校正后仍成立；健康人群中瘦素与 IL-6、hs-CRP 呈 BMI 校正后正相关，糖尿病人群中瘦素与 hs-CRP、IL-8 呈正相关；内皮细胞中瘦素增强衰老，瘦素中和抑制 SASP，部分经 mTOR 通路介导；巨噬细胞与内皮细胞中瘦素阻断削弱高糖诱导炎症，巨噬细胞中亦抑制 LPS 诱导的衰老及促炎表型；T 细胞中瘦素中和在常规 T 细胞中降低炎症与衰老标志物表达，在调节性 T 细胞中未见同样效应","authors_conclusion":"瘦素可能驱动炎症衰老，其中和可在多个相关模型中产生抗炎效应","ai_note":"人群部分为横断面相关性分析，无法推断瘦素与炎症衰老的因果关系；体外五种模型多集中于 mTOR 相关通路，模型间独立性有限；摘要未报告任何效应量、置信区间或 P 值，无法评估统计学稳健性；T 细胞中常规 T 与 Treg 的分离效应缺乏定量与机制证据；结论从细胞模型与相关性数据外推至“瘦素驱动炎症衰老”偏乐观。","pico":{"p":"体外：复制性衰老内皮细胞、高糖处理巨噬细胞与内皮细胞、LPS 暴露巨噬细胞、TCR 刺激 CD4+ T 细胞共 5 种模型；人群：健康个体队列 n=121 与 2 型糖尿病队列 n=93","ic":"干预：瘦素受体（LEP-R）结合阻断/瘦素中和；对照：未中和的相应刺激条件；人群部分为瘦素水平与炎症衰老标志物的横断面关联分析"},"reason":"为肥胖/糖尿病相关慢性低度炎症与衰老提供瘦素-mTOR 轴机制假设及人群相关性基线，对胸外科围手术期风险评估（肥胖、糖代谢异常、炎症状态）和免疫炎症相关研究设计仅有间接参考价值。","abstract_en":"Leptin, a proinflammatory adipokine, contributes to the chronic low-grade inflammation seen in obesity, but its role in age-related inflammation, that is inflammaging, has been poorly studied. We thus tested the effect of blocking leptin receptor (LEP-R) binding in five models of inflammaging, that is replicative senescent endothelial cells, hyperglycemia-treated macrophages or endothelial cells, lipopolysaccharide (LPS)-exposed macrophages, and TCR-stimulated CD4+ T cells. In endothelial cells, leptin enhanced senescence, while leptin neutralization suppressed the senescence-associated secretory phenotype, two effects mediated in part by the mTOR pathway. In both macrophages and endothelial cells, leptin blockade blunted hyperglycemia-induced inflammation, while in macrophages, it also suppressed the LPS-induced senescent and proinflammatory phenotype. In T cells, leptin neutralization produced divergent effects, attenuating the expression of inflammatory and senescence markers in conventional T cells but not in regulatory T cells. To assess translational relevance, we measured leptin and inflammaging markers in plasma samples from two independent cohorts, one of healthy individuals (n = 121) and another of people with Type 2 diabetes (n = 93). In healthy subjects, leptin levels were higher in people with hs-CRP ≥ 3 mg/dL compared with those below such threshold, also after adjustment for BMI. Leptin levels showed BMI-adjusted positive correlations with IL-6 and hs-CRP in healthy individuals and with hs-CRP and IL-8 in people with diabetes. These findings suggest that leptin might fuel inflammaging and that its neutralization exerts anti-inflammatory effects across multiple, related models.","tags":["瘦素","炎症衰老","内皮细胞衰老","2型糖尿病","横断面队列","mTOR通路"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42926028","pmid":"42926028","pmcid":"","doi":"10.1016/j.cellsig.2026.112957","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926028/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"Cell Signal","journal_full":"Cellular signalling","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前基础研究 · 体外/体内功能实验与通路探索","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":37,"score_breakdown":{"clinical":7,"methodology":15,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"ERO1A在肺癌中高表达并与生存下降相关，敲低可抑制细胞增殖、迁移侵袭及小鼠模型肿瘤生长","title_en":"ERO1A promotes lung cancer progression via HIF1A/EGFR.","authors":"Liu Y, Lin Y, Zhou Y, Chen S, Li J, Li Y, Xie Z, Zhou Z et al.","affiliation_highlight":"Department of Human Cell Biology and Genetics, Joint Laboratory of Guangdong-Hong Kong Universities for Vascular Homeost…","results":"","authors_conclusion":"The upregulation of ERO1A may serve as a valuable diagnostic and prognostic biomarker in lung cancer. The ERO1A-HIF1A/EGFR axis may represent a potential therapeutic target.","ai_note":"摘要未报告样本量、效应量、置信区间或P值，无法评估统计稳健性；组织表达与生存关联为相关性证据，不能支持诊断/预后生物标志物的临床价值；H₂O₂及MET/CCND1/p21参与调控为提示性机制，尚缺因果验证。","pico":{"p":"肺癌组织、肺癌细胞系及小鼠模型；样本量未报告","ic":"ERO1A沉默/抑制 vs 对照；并分析ERO1A表达与患者生存及HIF1A/EGFR通路的关系"},"reason":"为肺腺癌ERO1A-HIF1A/EGFR轴提供早期临床前证据，可影响后续生物标志物与治疗靶点研究方向，但尚不足以改变临床决策。","abstract_en":"Globally, lung cancer has emerged as a formidable public health challenge and is the primary cause of cancer-related deaths. The role of ERO1A in lung adenocarcinoma has been rarely explored. Here, we identified significant overexpression of ERO1A in lung cancer tissues, which correlates with reduced patient survival rates. Silencing ERO1A notably suppressed cell proliferation, clonogenic formation, migration, and invasion in lung cancer cell lines. ERO1A inhibition impairs tumor growth in murine models. RNA sequencing and proteomics analyses following ERO1A knockdown revealed that ERO1A is involved in multiple oncogenic pathways, particularly EGFR and HIF1A. ERO1A modulates HIF1A/EGFR may through H₂O₂. The oncogenes MET, CCND1, and p21 may also be involved in the ERO1A regulation pathway. The upregulation of ERO1A may serve as a valuable diagnostic and prognostic biomarker in lung cancer. The ERO1A-HIF1A/EGFR axis may represent a potential therapeutic target.","tags":["ERO1A","肺腺癌","HIF1A/EGFR","基础研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42922878","pmid":"42922878","pmcid":"PMC13684779","doi":"10.21203/rs.3.rs-10682967/v1","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922878/","notice_url":"","trial_url":"","pub_date":"2026-Sep-01","briefing_date":"2026-10-25","journal_abbr":"Res Sq","journal_full":"Research square","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前探索性研究 · 小鼠原位肺癌模型Xenium空间转录组图谱分析及人肺癌组织初步适用性验证（预印本）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":37,"score_breakdown":{"clinical":8,"methodology":12,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"空间转录组绘制肺癌生态图谱：小鼠模型揭示瘤内与结节间异质性，并在人肺癌组织中初步适用","title_en":"Spatial mapping of the lung cancer ecosystem reveals distinct patterns of intratumoral and internodular heterogeneity.","authors":"Park GY, Baek B, Kim KH, Kim SJ, Eccles JD, Kim M, You S, Ascoli C et al.","affiliation_highlight":"","results":"","authors_conclusion":"空间域分析可将肿瘤结节解析为由空间域组成、癌症标志程序及微环境细胞通讯模式定义的生物学不同亚型；该分析方法适用于人肺癌组织。","ai_note":"预印本，未经同行评审；仅报告描述性空间图谱，未提供样本量、统计比较或独立验证；人肺癌组织仅称“适用”，无例数、组织类型与验证细节；由小鼠原位模型外推至人肺癌的生物学与临床意义信息不足；“亚型”分型缺乏与预后或治疗反应的关联。","pico":{"p":"原位小鼠肺癌模型及人肺癌组织（样本量未报告）","ic":"干预：Xenium空间转录组及空间域分析；对照：摘要未报告"},"reason":"为肺癌空间微环境研究提供可复用的分析框架与小鼠模型基线，提示瘤周免疫抑制和瘤内结节异质性假设；对临床手术选择或随访决策的直接影响有限。","abstract_en":"The spatial organization of malignant and non-malignant cells within the tumor microenvironment critically influences tumor evolution and therapeutic response. However, the architecture of micro-niches remains incompletely understood. Leveraging Xenium-based spatial transcriptomics, we comprehensively mapped the spatial ecosystem of an orthotopic murine lung cancer model, identifying distinct spatial domains that form unique, organized cellular neighborhoods. These domains cluster into three major communities: (1) non-tumoral regions that recapitulate canonical normal lung structures; (2) a heterogeneous peri-tumoral region composed of spatial domains characterized by mesenchymal remodeling, active immune checkpoint signaling, and immunosuppressive myeloid populations; and (3) intra-tumoral regions that reveal marked tumor nodule heterogeneity, with unique tumor-specific domains exhibiting hallmark cancer pathways. Furthermore, our analytic approach was applicable to human lung cancer tissue. Here, we show that spatial domain analysis resolves tumor nodules into biologically distinct subtypes defined by domain composition, hallmark cancer programs and intercellular communication patterns within the tumor microenvironment.","tags":["空间转录组","肺癌微环境","瘤内异质性","Xenium","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42918898","pmid":"42918898","pmcid":"9439720","doi":"10.1002/gepi.22594","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42918898/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"Nat Genet","journal_full":"NATURE GENETICS","tier":"A","if_val":25.5,"zone":"JCR Q1 · 1区","warned":false,"study_type":"方法学评估/统计遗传学分析（估计TWAS效应方向假符号率）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":36,"score_breakdown":{"clinical":2,"methodology":25,"specialty":1,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":true,"critic_verified":true,"verify_error":"","tuple_audit":[{"group":"plasma proteins","metric":"TWAS false sign rate","val":"23%","stat":"","grounded":true,"checks":[{"num":"23%","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]},{"group":"complex traits","metric":"TWAS false sign rate","val":"33%","stat":"","grounded":true,"checks":[{"num":"33%","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[{"group":"plasma proteins","metric":"TWAS false sign rate","population_ok":true,"metric_ok":true,"mismatch_reasons":[]},{"group":"complex traits","metric":"TWAS false sign rate","population_ok":true,"metric_ok":true,"mismatch_reasons":[]}],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"转录组范围关联研究（TWAS）的假符号率较高：血浆蛋白约23%、复杂性状约33%","title_en":"High false sign rates in transcriptome-wide association studies.","authors":"Gerlach PA, Milind N, Spence JP, Pritchard JK","affiliation_highlight":"Department of Genetics, Stanford University, Stanford, CA, USA.","results":"TWAS false sign rate 为23%（plasma proteins）和33%（complex traits）。","authors_conclusion":"These findings show that TWAS-based direction-of-effect estimates should be interpreted with caution and raise concerns about the reliability of TWAS more broadly.","ai_note":"摘要未报告样本量、置信区间或具体检验统计量；假符号率框架依赖“表达升高通常应升高蛋白表达”和“LoF负担测试提供预期方向”等假设，结论外推至TWAS整体可靠性需谨慎；与胸外科/胸部肿瘤临床决策无直接关联。","pico":{"p":"血浆蛋白与复杂性状相关人群（摘要未报告样本量）","ic":"TWAS推断的基因效应方向 vs 基于基因表达-蛋白表达一致性及功能缺失负担测试得到的预期方向"},"reason":"提示TWAS推断的基因效应方向可能存在高假符号率，影响以TWAS结果解读胸部肿瘤相关基因方向性证据的科研判断。","abstract_en":"Transcriptome-wide association studies (TWAS) are widely used to identify genes involved in complex traits and to infer the direction of gene effects on traits. However, despite their popularity, it remains unclear how accurately TWAS recover the true direction of a gene's effect on a trait. Here we estimate the false sign rate of TWAS for plasma proteins, leveraging the expectation that increased gene expression should generally increase protein expression. We then extend this framework to complex traits, where loss-of-function burden tests provide the expected direction of effect. In both analyses, we observe high discordance with expectations, with TWAS showing a false sign rate of 23% for plasma proteins and 33% for complex traits. We propose that much of the sign discordance arises when expression quantitative trait loci in non-trait-relevant tissues tag haplotypes associated with traits in genome-wide association studies via distinct, tightly linked regulatory variants, yielding spurious TWAS associations with the correct genes but with unreliable direction of effect. These findings show that TWAS-based direction-of-effect estimates should be interpreted with caution and raise concerns about the reliability of TWAS more broadly.","tags":["TWAS","假符号率","统计遗传学","效应方向"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42922549","pmid":"42922549","pmcid":"PMC13684539","doi":"10.64898/2026.08.31.748358","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42922549/","notice_url":"","trial_url":"","pub_date":"2026-Sep-01","briefing_date":"2026-10-25","journal_abbr":"bioRxiv","journal_full":"bioRxiv : the preprint server for biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前研究 · 原位小鼠肺癌模型的空间转录组图谱分析（附人肺癌组织适用性展示）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":36,"score_breakdown":{"clinical":8,"methodology":14,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"基于Xenium空间转录组的小鼠肺癌模型描绘瘤内、瘤周及瘤间微环境异质性","title_en":"Spatial Mapping of the Lung Cancer Ecosystem Reveals Distinct Patterns of Intratumoral and Internodular Heterogeneity.","authors":"Baek BS, Kim KH, Kim SJ, Eccles JD, Kim M, You S, Ascoli C, Park GY et al.","affiliation_highlight":"","results":"","authors_conclusion":"Spatial transcriptomics reveal diverse multicellular niches that organize intratumoral, peri-tumoral, and internodular heterogeneity in lung cancer.","ai_note":"预印本未经同行评审；证据主要来自原位小鼠模型，人肺癌组织仅称“适用”，未报告样本量、独立验证队列或定量性能；研究为描述性空间图谱，无主要终点、效应量或临床结局，无法评估临床转化价值；“瘤间异质性”等结论需外部验证。","pico":{"p":"原位小鼠肺癌模型及人肺癌组织（摘要未报告样本量）","ic":"Xenium空间转录组空间域分析；无对照组（描述性图谱研究）"},"reason":"为肺癌空间微环境研究提供瘤内、瘤周及瘤间微 niche 的图谱框架，可作为后续生物标志物、免疫微环境分型及治疗靶点研究的探索基线；对临床决策的直接影响有限。","abstract_en":"UNLABELLED: The spatial organization of malignant and non-malignant cells within the tumor microenvironment (TME) critically influences tumor evolution and therapeutic response. However, the architecture of micro-niches remains incompletely understood. Leveraging Xenium-based spatial transcriptomics, we comprehensively mapped the spatial ecosystem of an orthotopic murine lung cancer model, identifying distinct spatial domains that form unique, organized cellular neighborhoods. These domains cluster into three major communities: (1) non-tumoral regions that recapitulate canonical normal lung structures; (2) a heterogeneous peri-tumoral region composed of spatial domains characterized by mesenchymal remodeling, active immune checkpoint signaling, and immunosuppressive myeloid populations; and (3) intra-tumoral regions that reveal marked tumor nodule heterogeneity, with unique tumor-specific domains exhibiting hallmark cancer pathways. Furthermore, our analytic approach was applicable to human lung cancer tissue. Notably, spatial domain analysis allowed us to resolve tumor nodules into multiple biologically distinct subtypes, defined by domain composition, hallmark cancer programs, and intercellular communication patterns within the TME. ONE SENTENCE SUMMARY: Spatial transcriptomics reveal diverse multicellular niches that organize intratumoral, peri-tumoral, and internodular heterogeneity in lung cancer.","tags":["空间转录组","肿瘤微环境","肺癌","瘤内异质性","临床前模型","Xenium"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926222","pmid":"42926222","pmcid":"11084057","doi":"10.1186/s12943-024-02006-x","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926222/","notice_url":"","trial_url":"","pub_date":"2026-Sep-09","briefing_date":"2026-10-25","journal_abbr":"BMC Cancer","journal_full":"BMC CANCER","tier":"B","if_val":4.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Locoregional and distant recurrence after neoadjuvant chemoimmunotherapy versus chemoradiotherapy in esophageal squamous cell carcinoma: a focused meta-analysis.","title_en":"Locoregional and distant recurrence after neoadjuvant chemoimmunotherapy versus chemoradiotherapy in esophageal squamous cell carcinoma: a focused meta-analysis.","authors":"Ruan Y, Cao W, Long C, Li C, Han J","affiliation_highlight":"Department of Thoracic Surgery, The First People's Hospital of Jiande, No.","results":"BACKGROUND: Neoadjuvant chemoimmunotherapy (NCIT) is used for locally advanced esophageal squamous cell carcinoma (ESCC), but its effect on postoperative recurrence patterns remains uncertain. We compared overall, locore…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Neoadjuvant chemoimmunotherapy (NCIT) is used for locally advanced esophageal squamous cell carcinoma (ESCC), but its effect on postoperative recurrence patterns remains uncertain. We compared overall, locoregional, and distant recurrence after NCIT versus neoadjuvant chemoradiotherapy (NCRT). METHODS: PubMed/MEDLINE, Embase, Web of Science Core Collection, Scopus, and the Cochrane Library were searched through 01 May 2026. Eligible studies included patients with resectable or potentially resectable locally advanced ESCC who received NCIT or NCRT followed by radical esophagectomy. Recurrence outcomes were pooled as risk ratios (RRs), and disease-free survival or recurrence-free survival (DFS/RFS) and overall survival (OS) as hazard ratios (HRs), using random-effects models. Post hoc sensitivity analyses excluded studies with marked between-group follow-up imbalance. RESULTS: Twenty comparative studies, all conducted in China, were included; 19 were retrospective observational studies and one was a randomized phase 2 trial. Five studies contributed to the overall-recurrence analysis, and six studies contributed to each of the locoregional- and distant-recurrence analyses. NCIT was associated with lower overall recurrence (RR 0.68, 95% CI 0.49-0.95; P = 0.03) and distant recurrence/metastasis (RR 0.62, 95% CI 0.43-0.89; P = 0.009), whereas locoregional recurrence did not differ significantly (RR 1.02, 95% CI 0.67-1.55; P = 0.92). In post hoc analyses excluding studies with marked follow-up imbalance, the locoregional estimate remained nonsignificant (RR 0.87, 95% CI 0.66-1.15), and the distant-recurrence/metastasis estimate was attenuated and no longer significant (RR 0.65, 95% CI 0.36-1.17). Ten studies contributed to OS, which favored NCIT (HR 0.67, 95% CI 0.48-0.93; P = 0.02; I² = 77%), whereas eight contributed to DFS/RFS, which did not differ significantly (HR 0.82, 95% CI 0.59-1.13; P = 0.21; I² = 74%). CONCLUSIONS: Compared with NCRT, NCIT was associated with fewer overall recurrences after radical esophagectomy for locally advanced ESCC. The primary distant-recurrence signal was not robust after excluding studies with marked follow-up imbalance, and no locoregional advantage was demonstrated. These findings do not establish therapeutic superiority and should be interpreted cautiously given the predominance of retrospective evidence, risk of bias, and substantial heterogeneity in survival analyses.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42914144","pmid":"42914144","pmcid":"PMC12134928","doi":"10.1183/23120541.00675-2024","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42914144/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-25","journal_abbr":"BMJ Open Respir Res","journal_full":"BMJ Open Respiratory Research","tier":"B","if_val":4.0,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A three-month physiology score correlates with CLAD after lung transplant.","title_en":"A three-month physiology score correlates with CLAD after lung transplant.","authors":"Yang J, Fu A, Belousova N, Vasileva A, Numakura T, Chaitanya B, Ryan CM, Wu JKY et al.","affiliation_highlight":"Division of Respirology, University of Toronto, Toronto, Ontario, Canada.","results":"RATIONALE: Long-term survival after lung transplant is limited by chronic lung allograft dysfunction (CLAD). Oscillometry is a novel pulmonary function technique that complements spirometry.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"RATIONALE: Long-term survival after lung transplant is limited by chronic lung allograft dysfunction (CLAD). Oscillometry is a novel pulmonary function technique that complements spirometry. We hypothesise that oscillometry and spirometry at 3 months post-transplant are associated with CLAD. METHODS: Double lung transplant recipients (n=280) were enrolled from 2017 to 2020 for oscillometry at the first post-transplant spirometry. We excluded re-transplantation and patients missing 3-month oscillometry-spirometry data. Patients who died within 3 years where a CLAD diagnosis was ascertained were included. We used Mann-Whitney U and Pearson’s χ2 tests for group comparisons, logistic regression to assess the associations of spirometry and oscillometry with CLAD, and receiver operating characteristic curves to identify the threshold values for CLAD. RESULTS: At 3 years post-transplant, 129 were alive and CLAD-free while 75 patients had CLAD. Preoperative and perioperative characteristics were similar except for higher body mass index in the CLAD group. At 3 months, CLAD patients had lower forced expiratory volume in 1 s (%FEV1) and FEV1/FVC (forced vital capacity), and worst lung mechanics with high R5 (resistance at 5 Hz), low X5 (reactance at 5 Hz) and high AX (area of reactance). %FEV1, FEV1/FVC, R5 and R5−19 (difference in resistance from 5 to 19 Hz), X5, X5 z-score and AX were independently associated with CLAD. A composite metric of %FEV1, FEV1/FVC, R5 z-score, R5−19 and AX provided the strongest association with CLAD. CONCLUSIONS: The 3-month composite spirometry-oscillometry score post-transplant provides risk stratification of CLAD. Patients at risk can be monitored closely, to enable earlier interventions and minimise progression to CLAD.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925815","pmid":"42925815","pmcid":"","doi":"10.1016/j.clon.2026.104341","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925815/","notice_url":"","trial_url":"","pub_date":"2026-Sep-15","briefing_date":"2026-10-25","journal_abbr":"Clin Oncol (R Coll Radiol)","journal_full":"CLINICAL ONCOLOGY","tier":"B","if_val":null,"zone":"3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Stereotactic Body Radiotherapy for Central and Ultracentral Lung Tumors: A Multicenter Real-world Outcomes Analysis.","title_en":"Stereotactic Body Radiotherapy for Central and Ultracentral Lung Tumors: A Multicenter Real-world Outcomes Analysis.","authors":"Akgün Z, Ahmadova A, Atalar B, Demircan V, Demir S, Güney Y, Hurmuz P, Akyürek S et al.","affiliation_highlight":"Department of Radiation Oncology, Uskudar University Faculty of Medicine, Istanbul, Turkey.","results":"AIMS: The aim of the study is to evaluate real-world clinical outcomes of stereotactic body radiotherapy (SBRT) for central (C) and ultracentral (UC) lung tumors, with a focus on toxicity, tumor control, and overall surv…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"AIMS: The aim of the study is to evaluate real-world clinical outcomes of stereotactic body radiotherapy (SBRT) for central (C) and ultracentral (UC) lung tumors, with a focus on toxicity, tumor control, and overall survival (OS). MATERIALS AND METHODS: This multicenter retrospective analysis included 133 patients with C or UC lung tumors treated with SBRT across multiple participating centers. Patient characteristics, treatment parameters, toxicity outcomes, tumor control, and OS were analyzed retrospectively. RESULTS: Grade 2 toxicity occurred in 30.1% (n = 31/103) of patients with C tumors and 26.7% (n = 8/30) with UC tumors, while grade 3 toxicity was observed in 8.7% and 16.7% of patients, respectively. Median OS was 24 months. Favorable outcomes were observed in patients with epidermal growth factor receptor (EGFR)-mutant disease and smaller pl
