<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

particle dose conformality with enhanced biological effectiveness. However, clinical development remains constrained by limited center availability, modest trial accrual, and few randomized studies. We reviewed the global landscape of CIRT studies open to enrollment to identify current priorities and gaps. METHODS: This Particle Therapy Cooperative Group (PTCOG)-sanctioned project, conducted within the CIRT Guidelines Subcommittee, identified studies through registry review and institutional verification. ClinicalTrials.gov and the Japan Registry of Clinical Trials were searched from December 2025 through February 2026. We included interventional CIRT trials and prospective registries open to new enrollment and excluded studies not open to enrollment, retrospective cohorts, proton-only studies, and preclinical studies. RESULTS: Thirty-six studies were identified: 35 interventional trials in 6 countries and 1 North American registry-based comparative-effectiveness study. Japan had the largest share, followed by Germany, China, Italy, Austria, and France. Three centers (SPHIC, QST, and HIT) accounted for 21 of 36 studies. The portfolio included 7 phase I, 23 phase II, 5 phase III, and 1 registry study. Pancreatic cancer and sarcoma-related tumors each accounted for 7 studies; head and neck cancers, 5; prostate and breast cancers, 3 each; glioblastoma, lung cancer, and gynecologic malignancies, 2 each; and mucosal melanoma, mixed solid tumors, kidney cancer, esophageal cancer, and hepatocellular carcinoma, 1 each. Most studies were conducted at a single institution and emphasized feasibility, toxicity, local control, progression-free survival, or overall survival. CONCLUSIONS: This expert-verified inventory shows that CIRT studies open to enrollment remain concentrated by center, disease site, and phase. Future progress may depend more on shared outcome definitions, transparent biological dose reporting, and registry-enabled or multicenter comparative designs than on a "","impact_known":true},"title_zh":"Elevated Blood Lead Levels in Children With Sickle Cell Disease.","title_en":"Elevated Blood Lead Levels in Children With Sickle Cell Disease.","authors":"Demopoulos B, Seifu L, Sedlar S, Ehrlich J","affiliation_highlight":"Weill Cornell Medicine, New York, New York, USA.","results":"BACKGROUND: Although prior reports suggest sickle cell disease (SCD) as a risk factor for lead poisoning, this association remains understudied. This paper assesses the relationship between SCD and elevated blood lead le…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Although prior reports suggest sickle cell disease (SCD) as a risk factor for lead poisoning, this association remains understudied. This paper assesses the relationship between SCD and elevated blood lead levels (BLLs) in New York City children. METHODS: We conducted a retrospective matched cohort study of children born in NYC from 2004 to 2016 and tested for BLLs from 2004 to 2022. Children with SCD were matched 1:2 to children without SCD based on maternal race and country of birth. Firth penalized-likelihood logistic regression estimated associations between SCD and BLLs ≥3.5, ≥5, ≥10, and ≥15 µg/dL, adjusting for Medicaid status, housing age, and maternal race. Additional analyses evaluated effect modification by age and SCD genotype. RESULTS: The cohort included 1463 children with SCD and 2982 without SCD. SCD was associated with lower odds of BLLs ≥3.5 µg/dL (odds ratio [OR] 0.81; 95% confidence interval [CI]: 0.66-0.99), no difference at ≥5 µg/dL (OR 0.86; 95% CI: 0.66-1.10), and higher odds at ≥10 µg/dL (OR 1.82; 95% CI: 1.06-3.13), with a similar estimate at ≥15 µg/dL (OR 2.23; 95% CI: 0.98-5.07). The SCD-by-age interaction was significant at ≥10 µg/dL (OR 4.47; 95% CI: 1.41-15.50), and children with HbSS had significantly higher odds of BLLs ≥10 µg/dL and BLLs ≥15 µg/dL than children without SCD (OR 2.25 and 2.98, respectively). CONCLUSION: Children with SCD have increased odds of elevated BLLs at higher thresholds, especially those aged ≥3 years and those with HbSS. Targeted rescreening of these children warrants consideration.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883448","pmid":"42883448","pmcid":"","doi":"10.3390/biology15191775","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883448/","notice_url":"","trial_url":"","pub_date":"2026-Oct-06","briefing_date":"2026-10-18","journal_abbr":"Biology (Basel)","journal_full":"Biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":45,"score_breakdown":{"clinical":20,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Reduced Detection of Human Orphan Gene Transcripts in Disease Tissue Relative to Expression- and Detection- Matched Controls.","title_en":"Reduced Detection of Human Orphan Gene Transcripts in Disease Tissue Relative to Expression- and Detection- Matched Controls.","authors":"Taguchi YH, Turki T","affiliation_highlight":"Department of Physics, Chuo University, Tokyo 112-8551, Japan.","results":"Human orphan genes are poorly annotated and lowly expressed, which makes their behavior in disease difficult to establish. We analyzed paired normal and disease RNA-seq libraries from four cohorts, quantified against a c…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Human orphan genes are poorly annotated and lowly expressed, which makes their behavior in disease difficult to establish. We analyzed paired normal and disease RNA-seq libraries from four cohorts, quantified against a combined reference in which 2190 of 198,507 transcripts are orphan. Cohorts were first screened for library-level differences between the two conditions, and one (GSE40419, lung adenocarcinoma) was excluded because sequencing depth, pseudoalignment rate, and submission provenance all differed by condition; it is retained throughout as a calibration. In the remaining three cohorts, comprising 151 matched pairs from psoriasis, laryngeal squamous cell carcinoma, and hepatocellular carcinoma, we measured the change in the fraction of transcripts with zero abundance, a quantity that does not depend on any transformation of expression. Orphan transcripts lose detection relative to non-orphan transcripts matched on abundance and on cross-patient detection frequency, by +0.0250±0.0178, +0.0553±0.0073, and +0.0659±0.0122 once the global shift in detection is held fixed. The three estimates are homogeneous (p=0.163) and pool to +0.0544±0.0059, whereas the same analysis applied to the excluded cohort returns thirteen times that value. We report the result at the level at which it is measured, and withdraw the patient-level and cohort-specific claims made in the first preprint version of this work.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893559","pmid":"42893559","pmcid":"","doi":"10.1002/wjs.70616","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893559/","notice_url":"","trial_url":"","pub_date":"2026-Oct-18","briefing_date":"2026-10-18","journal_abbr":"World J Surg","journal_full":"WORLD JOURNAL OF SURGERY","tier":"B","if_val":2.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"多阶段转化研究：GRADE指南制定＋国际Delphi共识＋五中心前瞻性前后对照研究","category":"surgery","category_label":"微创与无管化胸外科","score_total":44,"score_breakdown":{"clinical":18,"methodology":21,"specialty":5,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"实施前叙事报告","metric":"6项关键术中肿瘤学要素全部完整记录率","val":"3/73 (4.1%)","stat":"","grounded":true,"checks":[{"num":"73","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"4.1%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"实施后结构化报告","metric":"6项关键术中肿瘤学要素全部完整记录率","val":"71/92 (77.2%)","stat":"","grounded":true,"checks":[{"num":"71","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"92","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"77.2%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"实施前后比较","metric":"完整记录率绝对提升","val":"73.1 percentage points","stat":"p < 0.000001","grounded":true,"checks":[{"num":"73.1","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.000001","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"终端用户探索性评估","metric":"System Usability Scale平均分","val":"81.1","stat":"","grounded":true,"checks":[{"num":"81.1","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":["6"],"semantic_passed":false,"semantic_audit":[{"group":"实施前叙事报告","metric":"6项关键术中肿瘤学要素全部完整记录率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「实施前叙事报告」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"实施后结构化报告","metric":"6项关键术中肿瘤学要素全部完整记录率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「实施后结构化报告」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"实施前后比较","metric":"完整记录率绝对提升","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「实施前后比较」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"终端用户探索性评估","metric":"System Usability Scale平均分","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「终端用户探索性评估」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"结构化术中报告模板改善儿童实体瘤手术关键要素记录完整性：多阶段转化研究","title_en":"Development and Evaluation of an Evidence-Based Operative Reporting Framework for Pediatric Surgical Oncology: A Translational Program of Research.","authors":"Abdelhafeez A, Lakhoo K","affiliation_highlight":"Department of Surgery, Division of Pediatric Surgery, University of Rochester Medical Center, Golisano Children's Hospit…","results":"6项预设关键术中肿瘤学要素全部完整记录：叙事报告3/73（4.1%），结构化报告71/92（77.2%），绝对提升73.1个百分点（p < 0.000001）；System Usability Scale平均分81.1。","authors_conclusion":"该转化研究通过连接循证指南制定、国际共识与标准化结构化报告工具的实施，建立了儿童外科肿瘤学术中记录的循证框架；与叙事报告相比，结构化报告显著提高了关键术中肿瘤学发现记录的完整性。","ai_note":"前后对照设计无同期对照，无法排除时间趋势、实施效应与中心差异；主要终点为记录完整性而非患者临床结局；样本单位为报告份数而非患者数；可用性评估为探索性且仅报告平均SUS；摘要未说明盲法、中心间一致性及临床管理改变。","pico":{"p":"儿童实体瘤（Wilms瘤、横纹肌肉瘤等）手术相关报告；实施前73份叙事报告、实施后92份结构化报告，来自5个儿童肿瘤中心","ic":"干预：标准化结构化术中报告模板；对照：传统叙事手术报告；采用前瞻性前后对照实施"},"reason":"评估结构化术中报告能否提高儿童实体瘤关键手术信息完整性，为手术记录标准化与后续治疗决策提供证据；方法学框架可借鉴于胸外科术中报告质量改进研究。","abstract_en":"Accurate documentation of critical intraoperative oncologic findings is essential for the subsequent management of children with solid tumors. This program of research aimed to establish an evidence-informed framework for operative documentation and evaluate whether synoptic reporting improves documentation completeness compared with traditional narrative reporting. A sequential, multiphase translational program of research was undertaken. First, evidence-based surgical guidelines for Wilms tumor and rhabdomyosarcoma were developed using the Grading of Recommendations Assessment, Development and Evaluation (GRADE) framework to identify surgical factors relevant to local control and subsequent treatment. These recommendations informed an international multidisciplinary Delphi consensus process to establish essential universal and tumor-specific intraoperative reporting elements and develop a standardized synoptic operative reporting template. The template was subsequently implemented across five pediatric oncology centers in a prospective before-and-after study. The primary outcome was complete documentation of six predefined critical intraoperative oncologic elements. Exploratory end-user feedback assessed usability and acceptability. The guideline development process generated evidence-based recommendations addressing key aspects of pediatric solid tumor surgery, including lymph node sampling, vascular involvement, surgical margins, tumor spillage, and residual disease. The International Delphi consensus subsequently established 15 consensus statements defining essential operative documentation, including universal and tumor-specific elements. Following implementation of synoptic reporting, complete documentation of all six predefined critical intraoperative elements increased from 3 of 73 narrative reports (4.1%) to 71 of 92 synoptic reports (77.2%), an absolute increase of 73.1 percentage points (p < 0.000001). Exploratory end-user evaluation demonstrated high perceived usability, with a mean System Usability Scale score of 81.1. This translational program establishes an evidence-informed framework for operative documentation in pediatric surgical oncology by linking evidence-based guideline development, international consensus, and implementation of a standardized synoptic reporting tool. Synoptic reporting substantially improved the completeness of documentation of critical intraoperative oncologic findings compared with narrative reporting.","tags":["儿童外科肿瘤","结构化手术报告","手术记录质量","Delphi共识","前后对照研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893503","pmid":"42893503","pmcid":"","doi":"10.1177/00031348261499927","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893503/","notice_url":"","trial_url":"","pub_date":"2026-Oct-18","briefing_date":"2026-10-18","journal_abbr":"Am Surg","journal_full":"The American surgeon","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（非系统评价，无检索策略与定量合并）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":44,"score_breakdown":{"clinical":20,"methodology":8,"specialty":16,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"巴雷特食管长度是否仍有临床价值：叙述性综述主张将长度视为连续风险变量而非历史截断值","title_en":"Does Barrett's Esophagus Length Still Matter? Contemporary Implications for Risk Stratification, Surveillance, and Endoscopic Therapy.","authors":"Herbella FAM, Katayama RC, Menezes-Rodrigues FS, Schlottmann F, Patti MG","affiliation_highlight":"Department of Surgery, Escola Paulista de Medicina, São Paulo, Brazil.","results":"","authors_conclusion":"大多数当前研究报道BE结局时未按长度分层；BE长度作为连续临床变量影响进展风险、监测间隔、治疗复杂性、根除可能性、治疗后复发及新兴预测模型；当代重要性不在于保留历史截断值，而在于将长度视为多维度风险分层的组成部分之一。","ai_note":"为叙述性综述，未报告检索策略、纳入排除标准、文献数量或偏倚评估，无法判断是否存在选择性引用；结论性表述（长度应作为连续变量、纳入预测模型）缺乏定量证据支持；未提供任何效应量或置信区间，属观点整合而非证据合成；文中称多数研究未按长度分层，却又据此得出长度具可操作性的结论，存在推论跳跃。","pico":{"p":"","ic":""},"reason":"为巴雷特食管监测间隔设定与内镜治疗前风险沟通提供以长度为核心的分层思路框架；但无原始数据，仅可作为研究假设来源，不能直接改变当前以病理分级为主的监测决策。","abstract_en":"Longer Barrett esophagus (BE) segments are associated with worse outcomes than shorter segments. However, it remains uncertain whether BE length is still a clinically actionable variable in modern surveillance, risk stratification, and treatment pathways. We reviewed current literature on the relevance of BE length as a predictor of gastroesophageal reflux disease (GERD) severity, cancer risk, treatment outcomes, regression after treatment, and remission after ablation. BE length correlates with hiatal hernia size, esophageal dysmotility, esophagitis, and acid exposure time. Long-segment BE carries a greater risk of dysplasia or progression to esophageal adenocarcinoma than short-segment BE, although smaller segments are not risk-free. Longer BE length was associated with treatment failure and increased post-treatment pain. BE length also predicted recurrence of BE, dysplasia, or adenocarcinoma after endoscopic ablation therapy. In conclusion, most current studies report BE outcomes without stratifying results by length. BE length, however, functions as a continuous clinical variable that influences multiple aspects of care, including progression risk, surveillance intervals, treatment complexity, likelihood of eradication, recurrence after therapy, and incorporation into emerging prediction models. In other words, the contemporary importance of length lies less in preserving a historical cutoff than in recognizing length as one component of multidimensional risk stratification.","tags":["巴雷特食管","风险分层","内镜监测","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42880610","pmid":"42880610","pmcid":"","doi":"10.1016/j.bbagen.2026.131014","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42880610/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Biochim Biophys Acta Gen Subj","journal_full":"Biochimica et biophysica acta. General subjects","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"生物信息学多队列转录组分析 + 体外功能验证（过表达/敲低实验）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":44,"score_breakdown":{"clinical":8,"methodology":18,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"食管鳞癌衰老相关基因GREM2与PIK3C2G的鉴定及体外功能验证：低表达与较差总生存相关","title_en":"Identification and functional validation of GREM2 and PIK3C2G as senescence-associated genes in esophageal squamous cell carcinoma.","authors":"Zhao W, Zhao S, Wang C, Dong G, Cui F, Wang M, Lin Z","affiliation_highlight":"Department of Oncology, Henan Provincial People's Hospital, People's Hospital of Zhengzhou University, People's Hospital…","results":"","authors_conclusion":"These findings establish GREM2 and PIK3C2G as senescence-associated tumor suppressors in ESCC, offering candidate biomarkers and a rationale for exploring senescence-directed therapies in this disease.","ai_note":"摘要未给出样本量、HR/95%CI/P值及多因素校正信息；生存结论基于单因素Cox与共识聚类，缺乏独立临床队列验证；功能验证限于体外食管上皮细胞，无体内或肿瘤模型证据；免疫相关分析为探索性。信息不足，无法判断其临床转化价值。","pico":{"p":"ESCC患者（TCGA-ESCC与GSE20347队列；摘要未报告样本量）及ESCC细胞系","ic":"GREM2/PIK3C2G表达水平（高/低）及过表达/敲低功能实验；无临床干预对照"},"reason":"为ESCC衰老相关基因提供候选生物标志物与体外功能证据，可影响后续生物标志物验证及衰老导向治疗研究设计，但尚不足以改变临床决策。","abstract_en":"Esophageal squamous cell carcinoma (ESCC) is an aggressive malignancy with dismal clinical outcomes, and how cellular senescence modulates ESCC biology remains poorly understood. Here, we integrated transcriptomic profiles from the TCGA-ESCC cohort with a curated panel of cellular senescence-related genes to identify and functionally validate senescence-associated regulators in ESCC. Univariate Cox regression and consensus clustering stratified ESCC patients into two molecular subtypes with divergent survival. Through differential expression analysis, random forest prioritization, and independent validation in the GSE20347 cohort, we identified GREM2 and PIK3C2G as lead candidate genes. Both were consistently downregulated in ESCC tumors and cell lines, and low expression predicted poorer overall survival. Gain- and loss-of-function experiments demonstrated that GREM2 and PIK3C2G drive p16/p21-dependent cellular senescence, trigger the senescence-associated secretory phenotype (SASP), and restrict proliferation in esophageal epithelial cells. Immune correlation analyses linked both genes to immune cell infiltration, chemokine signaling, and MHC molecule expression in the tumor microenvironment. These findings establish GREM2 and PIK3C2G as senescence-associated tumor suppressors in ESCC, offering candidate biomarkers and a rationale for exploring senescence-directed therapies in this disease.","tags":["ESCC","细胞衰老","GREM2","PIK3C2G","生物信息学","体外功能验证"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42886068","pmid":"42886068","pmcid":"","doi":"10.14309/ctg.0000000000001120","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886068/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Clin Transl Gastroenterol","journal_full":"Clinical and Translational Gastroenterology","tier":"B","if_val":3.6,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Immunoglobulin G and liver stiffness in autoimmune hepatitis: Timing matters more than biochemical correction.","title_en":"Immunoglobulin G and liver stiffness in autoimmune hepatitis: Timing matters more than biochemical correction.","authors":"Niezen S, Goyes D, Abadi-Ron V, Rojas Amaris N, Munguia F, Marenco-Flores A, Saberi B, Patwardhan V et al.","affiliation_highlight":"Division of Gastroenterology and Hepatology, Beth Israel Deaconess Medical Center, Harvard Medical School, Boston, Massa…","results":"OBJECTIVES: Transient elastography may overestimate fibrosis in autoimmune hepatitis (AIH) because hepatic inflammation independently increases liver stiffness measurement (LSM). We aimed to determine which inflammation …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: Transient elastography may overestimate fibrosis in autoimmune hepatitis (AIH) because hepatic inflammation independently increases liver stiffness measurement (LSM). We aimed to determine which inflammation markers confound LSM in AIH, whether algebraic correction improves accuracy, and when LSM becomes reliable for fibrosis staging. METHODS: Single-center retrospective cohort of adults with AIH, paired diagnostic Metavir biopsy, and at least one FibroScan visit with same-visit alanine aminotransferase (ALT) and immunoglobulin G (IgG). Mixed-effects linear regression modeled LSM on biopsy stage, ALT, IgG, and time since diagnosis with a patient-level random intercept. An inflammation-adjusted LSM was computed by subtracting estimated ALT and IgG contributions. Spearman correlation and DeLong-tested AUROC for advanced fibrosis (F3-F4) compared measured and adjusted LSM, stratified by inflammation state and treatment timing. RESULTS: We analyzed 208 FibroScan observations from 119 AIH patients (49 with advanced fibrosis). IgG was independently associated with LSM (β = +0.003 kPa per mg/dL, p < 0.001) while ALT was not (β ≈ 0, p = 0.68). The IgG-LSM relationship varied by treatment timing (IgG × 0-6 months interaction p = 0.001; IgG × 12-24 months p = 0.004). Algebraic correction did not improve discrimination (full-cohort AUROC measured 0.76 vs adjusted 0.72, DeLong p = 0.18). LSM accuracy for advanced fibrosis varied by timing: AUROC 0.71 pretreatment (n = 35), 0.64 at 12-24 months (n = 22), and 0.83 beyond 24 months (n = 72). CONCLUSIONS: In AIH, IgG-not ALT-independently inflates LSM, with a time-dependent effect strongest early after diagnosis. Algebraic correction did not improve fibrosis discrimination, but LSM accuracy improved substantially beyond 24 months after AIH diagnosis. Timing rather than algebraic correction is the more actionable clinical strategy for FibroScan interpretation in AIH.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893218","pmid":"42893218","pmcid":"PMC12226463","doi":"10.3389/fonc.2025.1624124","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893218/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Lung Cancer (Auckl)","journal_full":"Lung Cancer-Targets and Therapy","tier":"B","if_val":null,"zone":"3区","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Tiered Group of Disease Driven Oncogene Informs Survival Outcome of Taiwanese and Japanese Patients with Advanced NSCLC in the LC-SCRUM-Asia Study.","title_en":"Tiered Group of Disease Driven Oncogene Informs Survival Outcome of Taiwanese and Japanese Patients with Advanced NSCLC in the LC-SCRUM-Asia Study.","authors":"Kuo CS, Umemura S, Wang CC, Matsumoto S, Ko HW, Chung FT, Hsu PC, Izumi H et al.","affiliation_highlight":"Division of Thoracic Oncology, Department of Thoracic Medicine, Chang Gung Memorial Hospital, Chang Gung University, Col…","results":"BACKGROUND: Targeted therapy improves survival of oncogene-driven NSCLC. We evaluate the clinical outcome of advanced NSCLC with oncogenic drivers in LC-SCRUM-Asia Taiwanese and Japanese cohort using tiered groups of dis…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Targeted therapy improves survival of oncogene-driven NSCLC. We evaluate the clinical outcome of advanced NSCLC with oncogenic drivers in LC-SCRUM-Asia Taiwanese and Japanese cohort using tiered groups of disease-driven oncogene. METHODS: Fourteen genes were reported from NGS and grouped into four tiers based on lines of approved targeted therapies in Taiwan and Japan (Tier 1: ≥ two lines; Tier 2: one line; Tier 3: not targetable; Tier 4: potentially targetable; not yet approved). Overall survival (OS) of the four-tier gene groups was analyzed in Taiwanese cohort and validated in the 8619 Japanese patients using a two-stage approach. RESULTS: Three-hundred-fifty-nine patients were enrolled in Taiwanese cohort, of which 249 (69.4%) patients had a reported genomic alteration. Patients with a history of smoking (HR 0.46 [95% CI, 0.23-0.92]; p=0.031) and squamous cell carcinoma (HR 0.31 [95% CI, 0.12-0.78]; p=0.014) had a lower incidence of genomic alterations. The top five genomic alterations were EGFR (44.6%), KRAS (7.2%), ALK (3.9%), MET (3.1%) and ERBB2 (2.5%) mutations. The four-tier gene groups were significantly associated with different OS in Taiwanese patients (Log rank test p < 0.001). The adjusted OS was the longest and the shortest in patients with Tier 1 (34.5 months) and Tier 4 (16.6 months) gene groups, respectively. In Japanese cohort, a similar trend between the four-tier gene groups and OS was observed (Log rank test p < 0.001) where the Tier 1 and the Tier 4 gene groups also demonstrated the longest (42.6 months) and the shortest OS (18.9 months), respectively. CONCLUSION: The available lines of targeted therapy impact survival in patients of advanced oncogene-driven NSCLC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42881045","pmid":"42881045","pmcid":"","doi":"10.1016/j.transproceed.2026.09.011","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42881045/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Transplant Proc","journal_full":"Transplantation proceedings","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":15,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Successful First-Line Haploidentical Hematopoietic Stem Cell Transplantation in an Elderly Patient With Severe Aplastic Anemia and Complex Comorbidities: A Case Report.","title_en":"Successful First-Line Haploidentical Hematopoietic Stem Cell Transplantation in an Elderly Patient With Severe Aplastic Anemia and Complex Comorbidities: A Case Report.","authors":"Sun Y, Wang T, Wang X, Zhang Y, Yang X, Cai Y","affiliation_highlight":"Department of Hematology, Affiliated Hospital of Nantong University, Nantong University, Nantong, China.","results":"Standard management guidelines generally recommend immunosuppressive therapy (IST) as first-line treatment for older patients with severe aplastic anemia (SAA), whereas the role of upfront haploidentical hematopoietic st…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Standard management guidelines generally recommend immunosuppressive therapy (IST) as first-line treatment for older patients with severe aplastic anemia (SAA), whereas the role of upfront haploidentical hematopoietic stem cell transplantation (haplo-HSCT) in this population remains uncertain, particularly in patients with complex comorbidities. We report a 62-year-old woman with SAA, a history of surgically resected stage IA lung adenocarcinoma, and previous left lower extremity deep vein thrombosis treated with venous stent implantation and long-term aspirin therapy. Because no matched sibling or unrelated donor was available, and following individualized counseling regarding IST and transplantation, the patient underwent upfront haplo-HSCT combined with umbilical cord-derived mesenchymal stem cells after a conditioning regimen including fludarabine, busulfan, cyclophosphamide, antithymocyte globulin, and thiotepa. Neutrophil engraftment occurred on post-transplant day +12, and platelet independence was achieved on day +13. Donor chimerism reached 99.6% by day +14 and remained within the complete-chimerism range through the latest available assessment in January 2026. In late December 2025 and January 2026, the patient developed cytomegalovirus infection accompanied by transient trilineage cytopenia; after anti-CMV treatment with maribavir, the infection was controlled and peripheral blood counts subsequently recovered. At the most recent clinical follow-up on August 6, 2026, approximately 17 months after transplantation, no chronic graft-versus-host disease had developed, the previous lung adenocarcinoma remained in remission, and the thrombotic condition remained clinically stable. This case suggests that upfront haplo-HSCT combined with UC-MSCs may represent a feasible individualized treatment option for carefully selected older patients with SAA who lack matched donors, although broader conclusions require larger studies and longer follow-up.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893247","pmid":"42893247","pmcid":"PMC10449064","doi":"10.1164/rccm.202306-1066ST","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893247/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Int J Chron Obstruct Pulmon Dis","journal_full":"International Journal of Chronic Obstructive Pulmonary Disease","tier":"B","if_val":4.1,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"COPD Burden Across 48 Asian Locations, 2009-2023: Demographic Drivers and Socioeconomic Inequality.","title_en":"COPD Burden Across 48 Asian Locations, 2009-2023: Demographic Drivers and Socioeconomic Inequality.","authors":"Luo Q, Chen Y, Yang W, Wang Y, Gao Z, Zeng H","affiliation_highlight":"Department of Pulmonary and Critical Care Medicine, Ji'an Central People's Hospital, Ji'an, Jiangxi, 343000, People's Re…","results":"BACKGROUND: Chronic obstructive pulmonary disease (COPD) can show declining age-standardized rates while the number of affected people grows. We quantified this divergence and its demographic and socioeconomic pattern ac…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Chronic obstructive pulmonary disease (COPD) can show declining age-standardized rates while the number of affected people grows. We quantified this divergence and its demographic and socioeconomic pattern across Asia. METHODS: Using Global Burden of Disease 2023 estimates for 48 Asian locations (2009-2023), primary analyses examined incidence, prevalence, deaths, disability-adjusted life-years (DALYs), age-sex patterns, estimated annual percentage changes, demographic decomposition, and Socio-demographic Index (SDI)-related inequality. Exploratory analyses assessed pre-2020 trend deviations and subregional ARIMA forecasts to 2030. RESULTS: From 2009 to 2023, incident cases increased from 7.74 million to 10.75 million (38.9%), prevalent cases from 91.88 million to 129.76 million (41.2%), deaths from 2.11 million to 2.63 million (24.8%), and DALYs from 46.43 million to 55.97 million (20.5%). Age-standardized incidence and prevalence rates declined in 34 of 48 locations, death rates in 37, and DALY rates in 43. Of 522,061 additional deaths, population growth contributed 345,084 and population aging 933,776, partly offset by epidemiological change (-756,799). The death-rate SII changed from -69.90 in 2009 to -87.22 in 2023, and the concentration index from -0.140 to -0.220, indicating increasing concentration in lower-SDI populations. Summed subregional point deviations for 2020-2023 were small relative to expected burden: deaths were 0.57% and DALYs 0.26% above expected, whereas incidence was 0.35% and prevalence 0.51% below expected. Conditional 2030 point forecasts were 13.28 million incident cases, 156.74 million prevalent cases, 2.81 million deaths, and 62.63 million DALYs. CONCLUSION: Declining age-standardized rates have not reduced COPD service need across Asia. Population aging and lower-SDI disadvantage support prevention and care strategies tailored to demographic and socioeconomic context.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42879729","pmid":"42879729","pmcid":"","doi":"10.1200/CCI-25-00337","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42879729/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"JCO Clin Cancer Inform","journal_full":"JCO Clinical Cancer Informatics","tier":"B","if_val":3.6,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Comparison of an Artificial Intelligence Nutrition Platform With Dietitians in Providing Nutrition Support to Patients With Cancer.","title_en":"Comparison of an Artificial Intelligence Nutrition Platform With Dietitians in Providing Nutrition Support to Patients With Cancer.","authors":"Guirette M, Buchan ML, Basch EM, Buderer N, Goel KP, Bratton S, Loeb S","affiliation_highlight":"Savor Health LLC, New York, NY.","results":"PURPOSE: Patients with cancer experience nutrition challenges, but access to registered dietitians (RDs) is limited. The purpose of this study was to determine whether a specialized Artificial Intelligence (AI) Nutrition…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: Patients with cancer experience nutrition challenges, but access to registered dietitians (RDs) is limited. The purpose of this study was to determine whether a specialized Artificial Intelligence (AI) Nutrition Platform trained on curated high-quality evidence is equivalent in providing nutrition information to patients with cancer compared with oncology-credentialed RDs. METHODS: Twenty nutrition queries were developed by an expert panel, encompassing common cancer types, symptoms, and food allergies/preferences. These queries were administered to the AI Platform and to four nationally recruited human dietitians. Three expert reviewers with >10 years of cancer-specific nutrition experience blindly reviewed all query responses using a modified version of the Quality Assessment of Medical AI (mQAMAI) instrument, which assigns a score between 1 and 5 for accuracy, clarity, relevance, completeness, and usefulness (total quality score between 5 and 25). The primary outcome was mQAMAI total score. Equivalence was evaluated a priori using two one-sided tests (TOST). Secondary outcomes included readability and response time. RESULTS: The AI Nutrition Platform met equivalence criteria with human dietitians at ±3 to ±5 points (mean difference: 0.9 points; 90% CI, -0.27 to 2.15; TOST P < .05), while scoring higher on individual components: clarity (4.2 v 3.9; P = .001), relevance (4.1 v 3.9; P = .04), and usefulness (3.8 v 3.5; P = .02). AI responses were easier to read (Flesch-Kincaid grade level 7.2 v 9.8; P < .001) with faster response time (8.5 v 18.5 minutes per two queries; P < .001). CONCLUSION: The AI Platform was equivalent to human dietitians for cancer nutrition information, delivering responses with greater clarity, relevance, usefulness, and readability in less time. This tool could broaden access to nutrition support for patients in settings where access to dietitians is limited.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893460","pmid":"42893460","pmcid":"5934528","doi":"10.1183/23120541.00124-2017","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893460/","notice_url":"","trial_url":"","pub_date":"2026-Oct-18","briefing_date":"2026-10-18","journal_abbr":"Lung","journal_full":"LUNG","tier":"B","if_val":4.3,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Indirect Echocardiographic Signs of Increased Right-sided Afterload in Progressive Pulmonary Fibrosis: Insights from a Multicentre Italian Study.","title_en":"Indirect Echocardiographic Signs of Increased Right-sided Afterload in Progressive Pulmonary Fibrosis: Insights from a Multicentre Italian Study.","authors":"Cefalo J, Baccelli A, Varone F, Luppi F, Cameli P, Cerri S, Gerli A, Nastasi M et al.","affiliation_highlight":"Respiratory Unit, ASST Santi Paolo e Carlo, Via A.","results":"PURPOSE: Pulmonary vascular involvement is a determinant of worse outcomes in fibrotic lung diseases. Its prevalence and prognostic relevance in patients with progressive pulmonary fibrosis (PPF) is unknown.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: Pulmonary vascular involvement is a determinant of worse outcomes in fibrotic lung diseases. Its prevalence and prognostic relevance in patients with progressive pulmonary fibrosis (PPF) is unknown. The aim of this study was to assess the prevalence of indirect echocardiographic abnormalities in progressive pulmonary fibrosis before antifibrotic therapy, characterize a baseline high-risk cardiopulmonary functional profile, and assess 12-month clinical trajectories. METHODS: Observational, retrospective, multicentre study. RESULTS: 158 patients (median (IQR) age of 71 (65.2-77.0) years) with PPF were enrolled. Thirty (19.0%) had ≥ 1 echocardiographic indirect sign of increased right-sided afterload, 15 (9.5%) ≥ 2, 9 (5.7%) ≥ 3 and 1 (0.6%) all four. A shortened right ventricular outflow tract acceleration time (< 105 ms) was the most frequent alteration (12.7%), followed by right atrial dilation (10.8%). In univariable analysis, ≥1 sign was associated with male sex, a lower DLCO% predicted, a higher FVC%/DLCO% ratio and a shorter 6MWD; in the multivariable model only, male sex remained independently associated (aOR 3.45, 95% CI 0.99-12.07; p = 0.052). Twelve-month FVC trajectories did not differ by baseline echocardiographic status; nonetheless, ≥1 sign was associated with shorter time to acute exacerbation (log-rank p = 0.007) and all-cause hospitalisation (p = 0.001). CONCLUSIONS: Echocardiographic signs suggestive of increased right-sided afterload are present in a substantial proportion of PPF patients at the time of antifibrotic initiation. They identified patients at higher risk of acute exacerbation and hospitalisation, regardless of FVC decline. This higher-risk subgroup warrants specific pulmonary vascular evaluation and tighter clinical follow-up.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42881003","pmid":"42881003","pmcid":"","doi":"10.1016/j.pathol.2026.08.012","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42881003/","notice_url":"","trial_url":"","pub_date":"2026-Sep-22","briefing_date":"2026-10-18","journal_abbr":"Pathology","journal_full":"PATHOLOGY","tier":"B","if_val":3.9,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Surveying the evolving landscape of genetic and genomic testing in the state of Queensland.","title_en":"Surveying the evolving landscape of genetic and genomic testing in the state of Queensland.","authors":"Mitchell EL, Smith SM, Fowles LF, Jeppesen M, Lundie B, Lau C, Spurdle AB, Villani RM et al.","affiliation_highlight":"Pathology Queensland, Queensland Health, Brisbane, Qld, Australia.","results":"The value of genetic and genomic testing to clinical care is increasingly being recognised in the Australian clinical setting, with significant investment in initiatives to improve genomics implementation. The aim of thi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The value of genetic and genomic testing to clinical care is increasingly being recognised in the Australian clinical setting, with significant investment in initiatives to improve genomics implementation. The aim of this study was to survey current genetic test requests, nationally and in Queensland, to identify considerations for future practice and inform strategy for ensuring impact from this new technology. Data on genetic testing from the Medicare Benefits Scheme (MBS) and Queensland state-wide pathology service from 2017 to 2023 were analysed for genetic and genomic test use, funding profile, referring specialties and test categories/types. MBS service and billing data showed that genetic test use is increasing nationally, with the number of items available increasing at a higher rate than the number of items billed (item numbers being used). Queensland test request data showed an increasingly broad range of specialties have referred an increasingly diverse number of genetic and genomic testing types. Both the MBS and Queensland state-wide pathology service data indicate increasing costs per test, suggesting the growing complexity of testing is leading to an altered clinical genetic testing landscape. The results point to an increasingly complex genetic testing profile in healthcare along with a widening gap in application. Further research into genomics implementation is required to fully realise the benefits of genetics and genomics testing.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42877971","pmid":"42877971","pmcid":"","doi":"10.1002/1545-5017.70771","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42877971/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Pediatr Blood Cancer","journal_full":"PEDIATRIC BLOOD & CANCER","tier":"B","if_val":2.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Conquering Infant and Young Children Medulloblastoma in Resource-Limited Settings: Challenges, Opportunities, and Treatment Outcomes.","title_en":"Conquering Infant and Young Children Medulloblastoma in Resource-Limited Settings: Challenges, Opportunities, and Treatment Outcomes.","authors":"Amayiri N, Khattab E, Abu Shanab M, Al-Hussaini M, Obeidat M, Maraqa B, Hashem H, Ibrahimi AK et al.","affiliation_highlight":"Department of Pediatrics, Neuro-Oncology, King Hussein Cancer Center, Amman, Jordan.","results":"BACKGROUND: Infant and young children medulloblastoma poses significant treatment challenges due to high recurrence rates and the severe neurodevelopmental risks associated with craniospinal irradiation (CSI). Outcome da…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Infant and young children medulloblastoma poses significant treatment challenges due to high recurrence rates and the severe neurodevelopmental risks associated with craniospinal irradiation (CSI). Outcome data from low-middle-income countries (LMICs) remain scarce. METHODS: A retrospective chart review was conducted for children (age <5 years) diagnosed with medulloblastoma at King Hussein Cancer Center, Jordan, between 2010 and 2023. RESULTS: Twenty-seven patients were identified. The median age was 2 years (range, 0.5-4.3 years) with 78% males, and over half (52%) presented with metastatic disease. Twelve patients (44%) had ≤ 1.5 cm2 residual tumor. Seventeen patients (63%) required ventriculoperitoneal shunt placement. Seven (26%) developed postoperative complications. Ten tumors were of classic histology, eight desmoplastic, six anaplastic, and three MBEN. Sixteen tumors (59%) were molecularly subgrouped: SHH (fourteen), Group-3 (two). Patients received various treatment protocols: HeadStart 1&2-like protocols (seventeen), SKK-92 (eight), and BBSFOP (two). Although 21 patients were planned for autologous stem cell transplantation (ASCT), only 13 received it (three received SKK-92 due to financial constraints, two prematurely stopped therapy, two developed early tumor progression, and one shifted to BBSFOP protocol due to chemotherapy toxicity). At a median follow-up of 7.4 years (range, 2.5-16 years), 17 patients (63%) are alive. Twelve patients (44%) are alive in CR1 without radiotherapy (five of whom also avoided ASCT), three in CR2 after CSI-36 Gy, one in CR3 after ASCT then CSI-23.4 Gy, and one patient lost to follow-up after salvage CSI-36 Gy. Two patients developed secondary tumors: one died from high-grade glioma and one developed thyroid carcinoma. Two survivors needed cataract surgery, and four had hearing loss. Ten survivors need hormonal supplements. CONCLUSIONS: Some infants and young children with medulloblastoma can achieve durable cure without ACST or radiotherapy, even in LMICs. While these therapies remain critical salvage options, lifelong comprehensive support is imperative to optimize survival and quality of life.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42877968","pmid":"42877968","pmcid":"","doi":"10.1002/1545-5017.70770","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42877968/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Pediatr Blood Cancer","journal_full":"PEDIATRIC BLOOD & CANCER","tier":"B","if_val":2.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cell-Sorted EBV PCR Identifies Lineage Shift and Guides Management After Hematopoietic Cell Transplantation for Pediatric EBV-Positive T/NK-Cell Lymphoid Neoplasia: A Case Series.","title_en":"Cell-Sorted EBV PCR Identifies Lineage Shift and Guides Management After Hematopoietic Cell Transplantation for Pediatric EBV-Positive T/NK-Cell Lymphoid Neoplasia: A Case Series.","authors":"Quintero AM, Bhatia M, George D, Muranski P, Satwani P","affiliation_highlight":"Division of Pediatric Hematology, Oncology and Stem Cell Transplantation, Columbia University Irving Medical Center, New…","results":"Epstein-Barr virus (EBV)-positive T/natural killer (NK)-cell lymphoid neoplasms, including chronic active EBV disease and EBV-positive T/NK-cell leukemias and lymphomas, are rare, aggressive disorders for which allogenei…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Epstein-Barr virus (EBV)-positive T/natural killer (NK)-cell lymphoid neoplasms, including chronic active EBV disease and EBV-positive T/NK-cell leukemias and lymphomas, are rare, aggressive disorders for which allogeneic hematopoietic cell transplantation (alloHCT) is the only established curative therapy. After alloHCT, plasma or whole-blood EBV polymerase chain reaction (PCR) cannot distinguish relapse from EBV-driven donor B-cell proliferation. Cell-sorted EBV PCR resolves this ambiguity by quantifying EBV DNA across lymphocyte subsets to identify the cell lineage with the highest viral burden. We report four children in whom cell-sorted EBV PCR demonstrated a post-transplant shift in predominant EBV burden from T/NK cells to B cells, enabling de-escalation from cytotoxic therapy to immunosuppression reduction and B-cell-directed treatment.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42877967","pmid":"42877967","pmcid":"","doi":"10.1002/1545-5017.70767","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42877967/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Pediatr Blood Cancer","journal_full":"PEDIATRIC BLOOD & CANCER","tier":"B","if_val":2.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Clinical Characteristics of Intracranial Hemorrhage in Pediatric Acute Leukemia.","title_en":"Clinical Characteristics of Intracranial Hemorrhage in Pediatric Acute Leukemia.","authors":"Kikui H, Uemura S, Tsuji K, Kakee S, Kikuchi N, Kozaki A, Saito A, Ishida T et al.","affiliation_highlight":"Department of Hematology and Oncology, Hyogo Prefectural Kobe Children's Hospital, Kobe, Japan.","results":"BACKGROUND: Intracranial hemorrhage (ICH) is a life-threatening complication of pediatric acute leukemia. However, whether early-onset ICH and late-onset ICH are distinct clinical entities remains unclear.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Intracranial hemorrhage (ICH) is a life-threatening complication of pediatric acute leukemia. However, whether early-onset ICH and late-onset ICH are distinct clinical entities remains unclear. This study investigated the characteristics, neuroimaging findings, and outcomes of ICH. METHODS: Children with newly diagnosed acute leukemia were retrospectively reviewed. Clinical characteristics and OS were compared between patients with and without ICH, while neuroimaging findings and neurological outcomes were evaluated in patients with ICH. Early-onset ICH was defined as hemorrhage within 7 days after leukemia diagnosis, and late-onset ICH was defined as hemorrhage occurring thereafter. RESULTS: Among 340 children with acute leukemia, 11 (3.2%) developed ICH. Patients with ICH were significantly younger and more frequently had KMT2A rearrangements, hyperleukocytosis, thrombocytopenia, and coagulation abnormalities than those without ICH. Patients with ICH had a significantly lower 5-year OS rate than those without ICH (55.4% vs. 90.4%, p < 0.001). Early-onset ICH predominantly occurred in patients with acute myeloid leukemia, and it was characterized by multifocal hemorrhages at presentation. Late-onset ICH occurred exclusively in patients with acute lymphoblastic leukemia (ALL). Three infants with KMT2A-rearranged B-cell ALL developed marked cerebral atrophy, followed by subdural hematoma. Five patients required neurosurgical intervention, and all survivors had persistent neurological sequelae. CONCLUSIONS: In pediatric acute leukemia, ICH comprises two clinically distinct patterns. Early-onset ICH is primarily associated with leukemia-related coagulopathy. Late-onset ICH is characterized by cerebral atrophy, followed by subdural hematoma, in infants with KMT2A-rearranged B-cell ALL. Recognizing these distinct patterns may lead to earlier diagnosis, neuroimaging evaluation, and timely neurosurgical intervention.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42878641","pmid":"42878641","pmcid":"","doi":"10.1148/ryct.260148","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42878641/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"Radiol Cardiothorac Imaging","journal_full":"Radiology-Cardiothoracic Imaging","tier":"B","if_val":4.5,"zone":"JCR Q1 · 3区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Opportunistic Detection of Hepatic Steatosis Using Postcontrast Liver Attenuation at Coronary CT Angiography.","title_en":"Opportunistic Detection of Hepatic Steatosis Using Postcontrast Liver Attenuation at Coronary CT Angiography.","authors":"Karahacioglu D, Cural Kula G, Kula S, Veznikli M, Boge M, Atasoy Ç","affiliation_highlight":"Department of Radiology, Koç University School of Medicine, Maltepe Mahallesi, Davutpaşa Caddesi, No.","results":"Purpose To evaluate the diagnostic performance of postcontrast liver attenuation measured with coronary CT angiography (CCTA) for opportunistic detection of hepatic steatosis and to assess the impact of tube potential va…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Purpose To evaluate the diagnostic performance of postcontrast liver attenuation measured with coronary CT angiography (CCTA) for opportunistic detection of hepatic steatosis and to assess the impact of tube potential vari
