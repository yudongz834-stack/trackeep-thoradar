:"单病例报告（Case Report）· 诊断与术后随访描述","category":"nodule","category_label":"肺结节与早筛管理","score_total":29,"score_breakdown":{"clinical":8,"methodology":5,"specialty":16,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"病例","metric":"术后无复发随访时间","val":"13个月","stat":"","grounded":true,"checks":[{"num":"13","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"病例","metric":"病理确诊肿瘤灶数","val":"2处（LUL、LLL）","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"病例","metric":"术后无复发随访时间","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）"]},{"group":"病例","metric":"病理确诊肿瘤灶数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"一例偶然发现的肺上皮样血管内皮瘤病例报告：双灶楔形切除后13个月无复发","title_en":"A Rare Finding of Pulmonary Epithelioid Hemangioendothelioma.","authors":"Park R, Ober C, Sha C, Lau H, Sha I, Borczuk A, Lee PC","affiliation_highlight":"Department of Thoracic Surgery Northwell Health Long Island Jewish Medical Center New Hyde Park New York USA.","results":"最终病理证实为两处肺上皮样血管内皮瘤，分别位于左肺上叶（LUL）与左肺下叶（LLL）；术后过程平稳；切除术后13个月无复发证据","authors_conclusion":"为支持日益增多的肺上皮样血管内皮瘤治疗标准化努力，报告本例外发现；建议并实施了手术路径（机器人辅助胸腔镜楔形切除）","ai_note":"单例报告，无对照，无法支持作者所述“治疗标准化”的推论；13个月随访对恶性度可变的血管内皮瘤而言过短，“无复发”不能作为手术优于放疗的证据；患者既往肾细胞癌史可能影响病灶判读与随访策略；摘要未报告影像特征、切缘状态、是否多中心及分期信息，信息不足。","pico":{"p":"1例65岁女性非吸烟者，有糖尿病、高血压病史，肾细胞癌术后缓解8年，左肺偶然发现病灶","ic":"机器人辅助胸腔镜下左肺上叶及左肺下叶楔形切除；无对照组"},"reason":"为肺上皮样血管内皮瘤这一极罕见肺部占位提供手术切除+病理确诊的个案基线，提示偶然发现的肺结节鉴别诊断需纳入血管源性肿瘤，并为后续罕见肺肿瘤登记与手术/放疗比较研究提供病例层面参照","abstract_en":"Epithelioid hemangioendothelioma (EHE) is a rare vascular tumor with variable presentation and malignancy. These highly uncommon tumors may arise from the liver, soft tissues, bones, and, more infrequently, from the lungs. Given its rarity, treatment approach is not unanimous, with ongoing debate regarding the relative benefits of surgical resection and radiation therapy. In support of growing efforts to standardize treatment of these tumors, we present our findings of a rare pulmonary EHE, incidentally detected in the left lung of a 65-year-old, nonsmoking female patient with a history of diabetes, hypertension, and renal cell carcinoma (RCC) in remission for 8 years after surgical resection. A surgical route was recommended, and left robot-assisted thoracoscopic wedge resections were performed. Final pathological assessment confirmed two pulmonary EHE tumors, one resected from the left upper lobe (LUL) and another from the left lower lobe (LLL) of the lung. Her postoperative course was uneventful, and at 13 months postresection, there has been no evidence of recurrence.","tags":["肺上皮样血管内皮瘤","罕见肺肿瘤","机器人辅助胸腔镜楔形切除","病例报告","偶然发现肺结节"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889044","pmid":"42889044","pmcid":"PMC13668488","doi":"10.7759/cureus.116243","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889044/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-18","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（Case report）· 细胞学-病理学不一致的诊断与治疗经过描述","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":26,"score_breakdown":{"clinical":8,"methodology":4,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺鳞癌患者心包积液细胞学提示腺癌的病理不一致病例：重复活检与分子检测对治疗决策的作用","title_en":"Unexpected Pericardial Cytology in a Patient With Primary Squamous Cell Carcinoma of the Lung: Emphasizing the Need for Advanced Molecular Characterization of Tumors.","authors":"Gevorgian M, Minter A","affiliation_highlight":"Radiology, Alabama College of Osteopathic Medicine, Dothan, USA.","results":"","authors_conclusion":"本例突显了NSCLC中细胞学-病理学不一致所带来的诊断挑战与治疗影响，并强调在组织学存在不确定性时，分子检测与重复组织取样对指导个体化治疗决策的重要性。","ai_note":"单一病例、无对照与系统随访，证据等级低；作者将细胞学（腺癌）与组织学（鳞癌）不一致主要归因于“未被识别的腺鳞癌或肿瘤异质性”，但未提供克隆性/多区域测序证据，亦未证实第二原发或组织学转化，属推测性解释；TMB仅表述为“中等”而未给出数值与检测平台，分子结果无法核验；由个案外推至NSCLC总体诊疗策略存在明显局限。","pico":{"p":"单例70岁男性，既往确诊肺鳞状细胞癌，因进行性呼吸困难就诊并发现大量心包积液","ic":"心包积液细胞学检查＋分子检测（TP53、肿瘤突变负荷、微卫星状态），并重复组织活检；治疗起始为帕博利珠单抗单药，疾病进展后升级为卡铂＋培美曲塞＋帕博利珠单抗"},"reason":"提示晚期NSCLC出现细胞学与既往组织学分型不一致时，应重复取材并完成分子分型后再定治疗，避免按可能错误的病理类型选药；同时为心包积液细胞学作为分型依据的局限性提供具体实例。","abstract_en":"Non-small cell lung cancer (NSCLC) encompasses a diverse group of histologic subtypes, including adenocarcinoma, squamous cell carcinoma (SqCC), and the less common but clinically aggressive adenosquamous carcinoma. Intratumoral histologic heterogeneity is a recognized challenge in NSCLC and may result in diagnostic discordance when sampling is limited. Cytologic-pathologic discordance may raise concern for tumor heterogeneity, sampling error, or misidentified histologic subtype. In such scenarios, molecular profiling and re-biopsy are essential to refine diagnosis and guide therapy. Here, we present a case of a 70-year-old man with a known history of SqCC of the lung who presented with progressive shortness of breath and was found to have a large pericardial effusion. Cytologic analysis of the pericardial fluid revealed malignant adenocarcinoma cells, discordant with the prior SqCC diagnosis. Molecular profiling of the pericardial fluid identified a TP53 mutation, intermediate tumor mutational burden, and microsatellite stability, without actionable oncogenic drivers. Repeat tissue sampling reconfirmed SqCC histology with high PD-L1 expression. The patient was initially treated with pembrolizumab monotherapy but required escalation to carboplatin, pemetrexed, and pembrolizumab due to disease progression. The cytologic discordance raised suspicion for unrecognized adenosquamous carcinoma or tumor heterogeneity not captured on initial biopsy. No evidence of a second primary malignancy or histologic transformation was found. This case highlights the diagnostic challenges and therapeutic implications of cytologic-pathologic discordance in NSCLC. It underscores the importance of molecular profiling and repeat tissue sampling in guiding personalized treatment decisions when histologic uncertainty exists.","tags":["肺鳞癌","细胞学-病理学不一致","心包积液","分子检测","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882392","pmid":"42882392","pmcid":"","doi":"10.3390/diagnostics16193237","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882392/","notice_url":"","trial_url":"","pub_date":"2026-Oct-07","briefing_date":"2026-10-18","journal_abbr":"Diagnostics (Basel)","journal_full":"Diagnostics (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（诊断与治疗决策描述，无对照、无随访终点分析）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":26,"score_breakdown":{"clinical":7,"methodology":6,"specialty":13,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"原发乳腺肿瘤","metric":"ER 表达","val":"98%","stat":"","grounded":true,"checks":[{"num":"98%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"原发乳腺肿瘤","metric":"PR 表达","val":"98%","stat":"","grounded":true,"checks":[{"num":"98%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"原发乳腺肿瘤","metric":"Ki-67 增殖指数","val":"15%","stat":"","grounded":true,"checks":[{"num":"15%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"原发乳腺肿瘤","metric":"HER2 状态","val":"阴性","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"肝转移灶活检","metric":"Ki-67 增殖指数","val":"85%","stat":"","grounded":true,"checks":[{"num":"85%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"肝转移灶活检","metric":"GATA3 表达","val":"阴性","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"肝转移灶活检","metric":"TTF-1/chromogranin/synaptophysin/CD56","val":"阳性","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"原发乳腺肿瘤","metric":"ER 表达","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「原发乳腺肿瘤」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"原发乳腺肿瘤","metric":"PR 表达","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「原发乳腺肿瘤」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"原发乳腺肿瘤","metric":"Ki-67 增殖指数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「原发乳腺肿瘤」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"原发乳腺肿瘤","metric":"HER2 状态","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「原发乳腺肿瘤」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"肝转移灶活检","metric":"Ki-67 增殖指数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「肝转移灶活检」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"肝转移灶活检","metric":"GATA3 表达","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「肝转移灶活检」无英文锚（词典未收录，宁误杀）","终点指标词未在原摘要出现"]},{"group":"肝转移灶活检","metric":"TTF-1/chromogranin/synaptophysin/CD56","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「肝转移灶活检」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"转移性乳腺癌随访中新发肝及肺门病灶经再活检证实为异时性小细胞神经内分泌癌：一例病例报告","title_en":"Metachronous Metastatic Invasive Breast Carcinoma and Metastatic Small Cell Carcinoma Clinically and Radiologically Favoured to Be of Pulmonary Origin: A Case Report.","authors":"Bucur AR, Cindrea AC, Curescu P, Armega-Anghelescu A, Barb AC, Zara F","affiliation_highlight":"Doctoral School, Victor Babes University of Medicine and Pharmacy Timisoara, E.","results":"原发乳腺病灶：浸润性乳腺癌非特殊型，ER 98%、PR 98%、Ki-67 15%、HER2 阴性；肝活检：高级别小细胞神经内分泌癌，TTF-1、chromogranin、synaptophysin、CD56 阳性，Ki-67 85%，GATA3 阴性","authors_conclusion":"已知恶性肿瘤患者出现的新发“转移样”病灶不应自动归因于原发肿瘤进展；再活检并结合组织病理、免疫组化、临床与影像学综合评估可能识别出独立的第二原发肿瘤，并显著改变全身治疗与临床管理","ai_note":"单一病例报告，无对照与系统随访，结论属经验性推论；PET-CT 无法在影像上区分肺原发与淋巴结病变，作者以“favored a pulmonary origin”表述为倾向性推断而非病理证实（肺病灶未活检）；Discussion 提及“serological findings”但摘要未报告任何血清学指标数值，存在信息缺口；2021年诊断与“五年后”的时间线表述需核对；未报告治疗反应与生存结局","pico":{"p":"1例46岁女性，2021年诊断为转移性激素受体阳性/HER2阴性乳腺癌（左乳肿块伴多发溶骨性骨转移），5年后新发肝脏病灶及右侧肺门代谢活跃病灶","ic":"对已知乳腺癌患者的新发病灶行再活检（肝活检）并整合组织病理、免疫组化、临床与影像学评估，以鉴别原发肿瘤进展与第二原发肿瘤；后续治疗为顺铂+依托泊苷+阿替利珠单抗"},"reason":"为已知恶性肿瘤患者新发病灶的鉴别诊断路径提供具体病例参照：再活检与免疫组化可推翻“进展”的默认判断并改写全身治疗方案；可作为胸部肿瘤多原发/第二原发鉴别讨论与病例系列设计的引例，但证据级别低，不足以直接改变人群层面的临床决策","abstract_en":"Background: In patients with metastatic breast carcinoma, newly identified visceral or pulmonary lesions may represent progression of the known malignancy or, less commonly, a distinct second primary tumor. Histopathological and immunohistochemical evaluation is therefore essential for establishing tumor lineage and guiding treatment. Case Presentation: We report the case of a 46-year-old woman diagnosed in 2021 with metastatic hormone receptor-positive/HER2-negative breast carcinoma, presenting with a left breast mass and multiple osteolytic bone metastases. Histopathological examination demonstrated invasive breast carcinoma of no special type, with 98% estrogen receptor expression, 98% progesterone receptor expression, a Ki-67 proliferation index of 15%, and negative HER2 status. She received palliative radiotherapy for painful bone metastases and systemic treatment with letrozole and ribociclib. Five years later, she was evaluated for newly detected liver lesions. Positron emission tomography-computed tomography also demonstrated a metabolically active right centrohilar pulmonary lesion, although a primary lung tumor could not be definitively distinguished radiologically from nodal disease. Liver biopsy revealed a high-grade small-cell neuroendocrine carcinoma with positivity for TTF-1, chromogranin, synaptophysin, and CD56, a Ki-67 proliferation index of 85%, and negative GATA3 expression. These findings, together with the clinical and radiological features, favored a pulmonary origin. The patient was subsequently treated with cisplatin, etoposide, and atezolizumab. Discussion: This case illustrates the difficulty of distinguishing progression of metastatic breast carcinoma from a metachronous second malignancy. The markedly different morphology with a discordant neuroendocrine immunophenotypic profile together with the radiological and serological findings, favored a distinct second malignancy rather than progression of the known breast carcinoma. Conclusions: New metastatic-appearing lesions in patients with a known malignancy should not automatically be attributed to progression of the original cancer. Re-biopsy and integrated histopathological, immunohistochemical, clinical, and radiological assessment may identify a distinct second malignancy and substantially alter systemic treatment and clinical management.","tags":["乳腺癌","小细胞肺癌","第二原发肿瘤","再活检","免疫组化","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42885242","pmid":"42885242","pmcid":"","doi":"10.1080/15376516.2026.2750969","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42885242/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Toxicol Mech Methods","journal_full":"Toxicology mechanisms and methods","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述 · 机制证据总结（非系统评价）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":24,"score_breakdown":{"clinical":5,"methodology":10,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"NRF2-KEAP1信号在六价铬致肺癌发生中的机制证据与因果缺口：叙述性综述","title_en":"NRF2-KEAP1 Signaling in Chromium-Induced Lung Carcinogenesis: Mechanistic Insights and Evidence Gaps.","authors":"Varma BM, Gopalakrishnan AV","affiliation_highlight":"School of Biosciences and Technology, Vellore Institute of Technology, Vellore-632014, Tamil Nadu, India.","results":"","authors_conclusion":"The available evidence supports NRF2-KEAP1 signaling as an important component of the cellular response to Cr(VI)-associated stress, but further mechanistic studies are needed to establish its specific causal contribution to chromium-induced lung carcinogenesis.","ai_note":"叙述性综述，未报告系统检索策略、纳入排除标准或定量合并；结论基于异质性实验模型与外推机制，不能推断因果关系或临床效应；摘要无原始数据，无法核验证据强度。","pico":{"p":"","ic":""},"reason":"为铬暴露相关肺癌机制研究提供框架，并明确指出NRF2-KEAP1因果证据不足；对临床决策影响有限，但可指导职业暴露风险沟通与后续机制研究设计。","abstract_en":"Hexavalent chromium [Cr(VI)] is a recognized environmental and occupational carcinogen associated with an increased risk of lung cancer. The nuclear factor erythroid 2-related factor 2 (NRF2)-Kelch-like ECH-associated protein 1 (KEAP1) pathway regulates cellular responses to oxidative and electrophilic stress and may influence cell survival following Cr(VI) exposure. Under basal conditions, KEAP1 promotes NRF2 ubiquitination and proteasomal degradation. Oxidative or electrophilic stress can impair this process, allowing NRF2 to accumulate and activate genes involved in antioxidant defense, detoxification, and cellular redox regulation, including HMOX1, NQO1, and GCLC. Although these responses can protect normal cells from acute stress, persistent NRF2 activity has also been associated with metabolic adaptation, resistance to apoptosis, and tumor-promoting phenotypes in several cancer models.However, the extent to which NRF2-KEAP1 signaling directly contributes to Cr(VI)-induced lung carcinogenesis remains incompletely established. Many studies on Cr(VI) have investigated oxidative stress, inflammation, genotoxicity, and cellular transformation. In contrast, relatively few have directly tested whether NRF2 activation is causally involved in tumor initiation or progression in chromium-exposed lung models. This review examines the relationship among Cr(VI) exposure, redox imbalance, and NRF2-KEAP1 signaling, distinguishing findings from chromium-specific experimental systems from mechanisms inferred from broader lung cancer research. It also discusses downstream processes relevant to carcinogenesis, occupational exposure, and risk assessment, as well as potential preventive or therapeutic strategies. The available evidence supports NRF2-KEAP1 signaling as an important component of the cellular response to Cr(VI)-associated stress, but further mechanistic studies are needed to establish its specific causal contribution to chromium-induced lung carcinogenesis.","tags":["六价铬","NRF2-KEAP1","肺癌发生","职业暴露","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}}]};

const safeUrl=value=>/^https:\/\//.test(String(value||''))?String(value):'';
const hasValue=value=>value!==null&&value!==undefined&&value!==''&&!(typeof value==='number'&&Number.isNaN(value));
const show=value=>hasValue(value)?String(value):'—';
const paperKey=p=>String(p?.pmid||p?.id||'');
const categoryOf=id=>CATEGORIES.find(c=>c.id===id)||CATEGORIES[0];
const designOf=p=>String(p.study_type||'').startsWith('RCT')?'rct':String(p.study_type||'').startsWith('队列')?'cohort':'pending';
const dateMs=value=>{
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));
  if(!m)return NaN;
  const ms=Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]));
  const d=new Date(ms);
  return d.getUTCFullYear()===Number(m[1])&&d.getUTCMonth()===Number(m[2])-1&&d.getUTCDate()===Number(m[3])?ms:NaN;
};
const isoDate=ms=>new Date(ms).toISOString().slice(0,10);
const monthDay=value=>/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value).slice(5):'—';
function findAnchor(items){
  let best=null,bestMs=-Infinity;
  items.forEach(p=>{const ms=dateMs(p.briefing_date);if(Number.isFinite(ms)&&ms>bestMs){bestMs=ms;best=p.briefing_date}});
  return best;
}
function inWindow(p){
  if(!ANCHOR)return false;
  const ms=dateMs(p.briefing_date),end=dateMs(ANCHOR),start=end-(state.days-1)*DAY_MS;
  return Number.isFinite(ms)&&ms>=start&&ms<=end;
}
function mergePapers(latestPapers){
  const merged=new Map();
  latestPapers.forEach(p=>{if(p&&paperKey(p))merged.set(paperKey(p),p)});
  INJECTED_PAPERS.forEach(p=>{
    const key=paperKey(p);if(!key)return;
    if(!merged.has(key)||p.briefing_date===SITE_DATA.briefing_date)merged.set(key,p);
  });
  return [...merged.values()].sort((a,b)=>{
    const dateDiff=(dateMs(b.briefing_date)||0)-(dateMs(a.briefing_date)||0);
    if(dateDiff)return dateDiff;
    return (Number(b.score_total)||0)-(Number(a.score_total)||0)||String(a.id||'').localeCompare(String(b.id||''));
  });
}
const windowPapers=()=>PAPERS.filter(inWindow);
const tierOk=p=>state.tiers.has(String(p.tier||'').toUpperCase());
const journalOk=p=>!state.journal||String(p.journal_abbr||p.journal_full||'')===state.journal;
const journalName=p=>String(p.journal_abbr||p.journal_full||'—');
function filtered(){
  const query=state.query.trim().toLowerCase();
  return windowPapers().filter(p=>{
    const categoryOk=state.category==='all'||p.category===state.category;
    const quickOk=state.quick==='all'||(state.quick==='nct'?Boolean(p.nct_id):designOf(p)===state.quick);
    const hay=[p.title_en,p.title_zh,p.journal_abbr,p.journal_full,p.pmid,p.nct_id,p.category_label].join(' ').toLowerCase();
    return tierOk(p)&&journalOk(p)&&categoryOk&&quickOk&&hay.includes(query);
  }).sort((a,b)=>{
    const as=Number(a.score_total),bs=Number(b.score_total);
    const aScore=Number.isFinite(as)?as:-Infinity,bScore=Number.isFinite(bs)?bs:-Infinity;
    return bScore-aScore||(dateMs(b.briefing_date)||0)-(dateMs(a.briefing_date)||0)||String(a.id||'').localeCompare(String(b.id||''));
  });
}
function journalUniverse(items){
  const map=new Map();
  items.forEach(p=>{const name=journalName(p);map.set(name,(map.get(name)||0)+1)});
  return [...map].map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
}
function positions(items,journals){
  const map={},scores=items.map(p=>Number(p.score_total)).filter(Number.isFinite);
  const high=scores.length?Math.max(...scores):1,low=scores.length?Math.min(...scores):0,span=high-low||1;
  const sectorSize=360/Math.max(journals.length,1);
  journals.forEach((journal,sector)=>{
    const group=items.filter(p=>journalName(p)===journal.name).sort((a,b)=>(Number(b.score_total)||0)-(Number(a.score_total)||0)||String(a.id||'').localeCompare(String(b.id||'')));
    group.forEach((p,i)=>{
      const offset=(i-(group.length-1)/2)*Math.min(5,sectorSize*.16);
      const angle=(-90+(sector+.5)*sectorSize+offset)*Math.PI/180;
      const score=Number(p.score_total);
      const base=Number.isFinite(score)?20+(high-score)/span*18:40;
      const radius=Math.max(19,Math.min(41,base+((i%3)-1)*2.2));
      map[p.id]={left:50+Math.cos(angle)*radius,top:50+Math.sin(angle)*radius};
    });
  });
  return map;
}
function point(angle,radius){
  const rad=angle*Math.PI/180;
  return {x:300+Math.cos(rad)*radius,y:300+Math.sin(rad)*radius};
}
function sectorMarkup(journal,index,total){
  const active=state.journal===journal.name;
  const attrs=`class="journal-sector ${active?'active':''}" data-journal="${esc(journal.name)}" tabindex="0" role="button" aria-pressed="${active}" aria-label="筛选刊源：${esc(journal.name)}"`;
  const title=`<title>${esc(journal.name)} · ${journal.count} 篇</title>`;
  if(total===1)return `<circle cx="300" cy="300" r="284" ${attrs}>${title}</circle>`;
  const wedge=360/total,start=-90+index*wedge,end=start+wedge,a=point(start,284),b=point(end,284);
  const d=`M300 300L${a.x.toFixed(3)} ${a.y.toFixed(3)}A284 284 0 ${wedge>180?1:0} 1 ${b.x.toFixed(3)} ${b.y.toFixed(3)}Z`;
  return `<path d="${d}" ${attrs}>${title}</path>`;
}

    return `<button class="filter-btn ${state.category===c.id?'active':''}" data-category="${c.id}" title="${esc(c.label)}" aria-pressed="${state.category===c.id}"><span>${esc(c.label)}</span><em>${count}</em></button>`;
  }).join('');
}
function renderTierFilters(base){

}
function renderWindow(){

function renderScope(list,base,journals){

  $('#blips').innerHTML=base.map(p=>{
    const pos=POSITIONS[p.id]||{left:50,top:50};

    return `<button class="blip ${cls}" style="left:${pos.left.toFixed(2)}%;top:${pos.top.toFixed(2)}%" data-select="${esc(p.id)}" title="${esc(journalName(p))} · ${esc(show(p.score_total))}分 · ${esc(p.title_zh||p.title_en||'—')}" aria-label="${esc(p.title_zh||p.title_en||'—')}"></button>`;
  }).join('');

    const a=(-90+(i+.5)*sectorSize)*Math.PI/180,r=45.5,name=j.name.length>13?j.name.slice(0,12)+'…':j.name;

  }).join('');
  $('#scope-empty').classList.toggle('show',!list.length);
  $('#scope-empty').innerHTML=!base.length?'当前数据窗口内无论文。<br>请调整滑杆或刊源档位。':'当前条件下没有信号。<br>试试清除检索、刊源或切换专科。';
  $('#hub-count').textContent=list.length;

function statusOf(p){
  const kind=String(p.status?.kind||'');
  if(kind==='retracted')return {kind,label:'🚫 已撤稿',cls:'retracted'};
  if(kind==='concern')return {kind,label:'⚠ 关注声明',cls:'concern'};
  if(kind==='corrected')return {kind,label:'📄 更正启事',cls:'corrected'};
  if(kind==='ok')return {kind,label:'未见异常标记',cls:''};
  return {kind,label:'出版状态 —',cls:'unknown'};
}
function noticeMarkup(p,status){
  const note=String(p.status?.note||'').trim();
  if(!['retracted','concern','corrected'].includes(status.kind)&&!note)return '';
  const ref=p.status?.notice_ref||p.status?.notice_pmid||'';
  const link=safeUrl(p.notice_url);
  const label=status.kind==='retracted'?'🚫 已撤稿':status.kind==='concern'?'⚠ 关注声明':status.kind==='corrected'?'📄 更正启事':'题录状态说明';
  return `<div class="notice-banner ${status.cls||'neutral'}"><strong>${label}</strong>${note?`<br>${esc(note)}`:''}${ref?`<br>关联：${esc(ref)}`:''}${link?`<br><a href="${esc(link)}" target="_blank" rel="noopener">查看出版方声明 ↗</a>`:''}</div>`;
}
function issueOf(p){
  const volume=show(p.volume),issue=show(p.issue);
  if(volume!=='—'||issue!=='—')return `${volume}${issue!=='—'?`(${issue})`:''}`;
  return show(p.journal_issue||p.issue_info||p.volume_issue);
}
function interpretationMarkup(p,degraded){
  if(degraded)return '<div class="interpretation-paused"><strong>解读暂停</strong><br>当前仅展示题录与原始摘要，不展示生成解读。</div>';
  const blocks=[];
  if(hasValue(p.authors_conclusion))blocks.push(`<p class="honesty-note"><strong>作者结论</strong><br>${esc(p.authors_conclusion)}</p>`);
  if(hasValue(p.ai_note))blocks.push(`<p class="honesty-note"><strong>生成解读 · 未经人审</strong><br>${esc(p.ai_note)}</p>`);
  if(!blocks.length)blocks.push('<p class="honesty-note">作者结论与疑点未生成，本版留白不硬写。评分只用于信号排序，不代表临床推荐。</p>');
  return blocks.join('');
}

function renderHeader(){

  const generated=String(SITE_DATA.generated_at||SITE_DATA.updated_at||'');

function render(){
  const base=windowPapers(),tierBase=base.filter(tierOk),journals=journalUniverse(tierBase),list=filtered();
  if(list.length&&!list.some(p=>p.id===state.selected))state.selected=list[0].id;
  renderWindow();renderCategoryFilters(base);renderTierFilters(base);renderQueue(list);renderJournalLegend(journals);renderDesignLegend(list);renderScope(list,tierBase,journals);renderDetail(list);
  const readCount=PAPERS.filter(p=>state.read.has(p.id)).length;
  $('#read-count').textContent=`${String(readCount).padStart(2,'0')} / ${PAPERS.length}`;
  document.querySelectorAll('[data-quick]').forEach(btn=>btn.classList.toggle('active',btn.dataset.quick===state.quick));
}
function selectPaper(id,scroll=false){
  if(!PAPERS.some(p=>p.id===id))return;
  state.selected=id;render();
  if(scroll&&matchMedia('(max-width:900px)').matches)document.querySelector('.detail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function step(direction){
  const list=filtered();if(!list.length)return;
  const index=list.findIndex(p=>p.id===state.selected);
  state.selected=list[(index+direction+list.length)%list.length].id;render();
}
function toggleJournal(name){
  state.journal=state.journal===name?null:name;render();
}
document.addEventListener('click',event=>{
  const select=event.target.closest('[data-select]');
  if(select){selectPaper(select.dataset.select,true);return}
  const category=event.target.closest('[data-category]');
  if(category){state.category=category.dataset.category;render();return}
  const quick=event.target.closest('[data-quick]');
  if(quick){state.quick=quick.dataset.quick;render();return}
  const tier=event.target.closest('[data-tier]');
  if(tier){const name=tier.dataset.tier;state.tiers.has(name)?state.tiers.delete(name):state.tiers.add(name);render();return}
  const journal=event.target.closest('[data-journal]');
  if(journal){toggleJournal(journal.dataset.journal);return}
  if(event.target.closest('#journal-clear')){state.journal=null;render();return}
});
$('#window-range').addEventListener('input',event=>{state.days=Number(event.target.value);render()});
$('#search').addEventListener('input',event=>{state.query=event.target.value;render()});

document.addEventListener('keydown',event=>{
  if(event.key==='/'&&document.activeElement!==$('#search')){event.preventDefault();$('#search').focus()}
  if(event.key==='Escape'){state.query='';state.category='all';state.quick='all';state.journal=null;state.tiers=new Set(TIERS);$('#search').value='';render();$('#search').blur()}

async function loadRollingPapers(){
  try{
    const response=await fetch('data/radar_latest.json');
    if(!response.ok)throw new Error('rolling window unavailable');
    const payload=await response.json(),latest=Array.isArray(payload)?payload:payload?.papers;
    if(!Array.isArray(latest))throw new Error('rolling window schema mismatch');
    PAPERS=mergePapers(latest);ANCHOR=findAnchor(PAPERS);renderHeader();render();
  }catch(error){
    console.info('滚动窗数据不可用，已静默降级为注入数据。');
  }
}
ANCHOR=findAnchor(PAPERS);
renderHeader();renderFunnel();render();
loadRollingPapers();
