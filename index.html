provides detailed three-dimensional information about the lungs, the large number of generated slices increases the complexity of radiological analysis and can contribute to diagnostic errors. To address this challenge, Computer-Aided Detection (CAD) systems have been developed to assist radiologists in identifying suspicious regions. In this work, we combine axial, coronal, and sagittal representations in a single YOLOv8x detection pipeline, use additional LIDC-IDRI annotation clusters with fewer than three radiologist markings as auxiliary positive samples, and introduce nodule-free background slices as negative training samples. Detections are consolidated through intra-view clustering and weighted inter-view fusion. Experiments following the LUNA16 cross-validation protocol show that the proposed strategy improves detection performance while substantially reducing false positives. The axial baseline achieved a Competition Performance Metric (CPM) score of 0.553 with 32.61 candidates per scan, whereas the multi-view configuration with a nominal budget of 20,000 background images achieved a CPM score of 0.863 and reduced the average number of candidates to 9.11 per scan while preserving high sensitivity. These results show that the combined use of multiple anatomical views and background-negative training can substantially reduce spurious candidates in CT-based lung nodule detection.","tags":["肺结节检测","计算机辅助检测","YOLOv8x","多视图融合","假阳性抑制","LUNA16"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42891137","pmid":"42891137","pmcid":"PMC13673330","doi":"10.3389/fimmu.2026.1738437","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42891137/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述（非系统综述，未报告PRISMA流程与偏倚评估）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":43,"score_breakdown":{"clinical":9,"methodology":8,"specialty":18,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"TAM异质性在NSCLC免疫微环境中的作用及其与免疫检查点抑制剂耐药、TAM靶向治疗策略的叙述性综述","title_en":"Tumor-associated macrophages in the tumor immune microenvironment of non-small cell lung cancer.","authors":"Saldana SFA, Abdulrab ND, Raza A","affiliation_highlight":"Department of Biomedical Sciences, College of Health Sciences, Abu Dhabi University, Abu Dhabi, United Arab Emirates.","results":"","authors_conclusion":"全面理解肿瘤免疫微环境中TAM异质性，为克服NSCLC免疫耐药提供框架；未来治疗策略应整合生物标志物指导的患者选择，并采用同时靶向巨噬细胞可塑性与免疫抑制的联合方案。","ai_note":"叙述性综述，无原始数据、无定量合成、未报告文献筛选流程/纳入排除标准/偏倚风险评估，检索仅PubMed与Google Scholar（后者不可重复），证据强度有限；文中称TAM并非简单M1/M2二分，但检索词与背景仍以M1/M2框架切入，存在概念口径不一致；对CSF1R、CD47-SIRPα、纳米颗粒、工程化巨噬细胞等称“show promise”但未给出任何临床疗效数值，结论乐观程度超出所呈现证据；信息不足：未报告纳入研究数量、瘤种分期构成及任何生存/缓解数据。","pico":{"p":"非小细胞肺癌（NSCLC）；叙述性综述，未报告纳入文献数量或患者样本量","ic":"TAM异质性（CXCL9+、SPP1+、C1Q+、TREM2+亚群）及TAM靶向策略（CSF1R、CD47-SIRPα、代谢通路、纳米颗粒、表观遗传、工程化巨噬细胞、miRNA）对比常规/无对照（文献综述，无干预对照）"},"reason":"为NSCLC免疫耐药机制研究提供TAM亚群（SPP1+、TREM2+等）与靶向通路的框架性梳理，可用于确定转化研究选题与生物标志物假设，但不构成临床决策依据。","abstract_en":"BACKGROUND: Non-small cell lung cancer (NSCLC) remains the leading cause of cancer mortality, and resistance to immune checkpoint inhibitors (ICIs) is largely driven by the tumor immune microenvironment (TIME), in which tumor-associated macrophages (TAMs) are major regulators. OBJECTIVES: This review summarizes recent advances in understanding TAM heterogeneity, their contribution to immune resistance in NSCLC, and emerging therapeutic strategies targeting TAMs. METHODS: A literature search was conducted using PubMed and Google Scholar, focusing on studies published between 2021 and 2025. Key search terms included \"non-small cell lung cancer\", \"tumor immune microenvironment\", \"macrophage heterogeneity\", \"M1 macrophages\", \"M2 macrophages\", \"SPP1+ macrophages\", \"TREM2+ macrophages\", \"immune checkpoint inhibitor resistance\", \"macrophage metabolic reprogramming\", and \"TAM-targeted therapies\". Relevant studies addressing TAM heterogeneity, immune resistance, metabolic and molecular regulation, and therapeutic targeting in NSCLC were prioritized, while earlier studies were included where necessary to provide mechanistic context. RESULTS: Recent evidence demonstrates that TAMs comprise diverse functional subsets rather than a simple M1/M2 duality. Distinct populations including CXCL9+, SPP1+, C1Q+, and TREM2+ macrophages differentially regulate T-cell exclusion, immune checkpoint resistance, angiogenesis, and metabolic remodeling. Therapeutic approaches targeting CSF1R, CD47-SIRPα, metabolic pathways, nanoparticles, epigenetic regulators, engineered macrophages, and microRNA-based strategies show promise but remain limited by macrophage plasticity and compensatory immune mechanisms. CONCLUSION: A comprehensive understanding of TAM heterogeneity within the tumor immune microenvironment provides a framework for overcoming immune resistance in NSCLC. Future therapeutic strategies should integrate biomarker-guided patient selection with combination approaches that simultaneously target macrophage plasticity and immune suppression.","tags":["TAM异质性","NSCLC","免疫检查点抑制剂耐药","肿瘤免疫微环境","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42889016","pmid":"42889016","pmcid":"PMC13668555","doi":"10.3389/fimmu.2026.1947649","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889016/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Pitfalls and diagnostic challenges in TRECS-based newborn screening for Artemis, FOXN1 and Moesin deficiencies.","title_en":"Pitfalls and diagnostic challenges in TRECS-based newborn screening for Artemis, FOXN1 and Moesin deficiencies.","authors":"Ruigómez-Martín CC, Nieto-López C, Dueñas-Prieto L, Acevedo-Ávila JD, Gil-Etayo FJ, Esteban-Díez I, García-Muro C, Quesada-Espinosa JF et al.","affiliation_highlight":"Department of Immunology, Hospital Universitario 12 de Octubre, Madrid, Spain.","results":"Newborn screening (NBS) based on T-cell receptor excision circles (TRECs) has revolutionized the early diagnosis of severe combined immunodeficiency (SCID), facilitating the identification of affected newborns before the…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Newborn screening (NBS) based on T-cell receptor excision circles (TRECs) has revolutionized the early diagnosis of severe combined immunodeficiency (SCID), facilitating the identification of affected newborns before the onset of life-threatening infections. However, reduced TRECs levels are a surrogate marker of impaired thymic output rather than a disease-specific finding. Accordingly, low values can result from highly heterogeneous and distinct biological mechanisms of T-cell ontogeny that extend beyond classical SCID phenotypes. This study describes three patients with inborn errors of immunity (IEI) identified through abnormal TRECs screening who were subsequently diagnosed with Artemis, FOXN1, and Moesin deficiencies. These clinical cases demonstrate that primary T-cell immunodeficiencies can arise from defects at distinct biological levels of T-cell development, specifically in impaired antigen receptor V(D)J recombination (characteristic of NHEJ deficiencies and other SCID conditions), disrupted thymic stromal microenvironment function and compromised peripheral lymphocyte homeostasis, respectively. Consequently, optimizing clinical outcomes after a positive newborn screening requires the systematic integration of clinical, immunological and molecular findings. This diagnostic approach should involve specialized immunodeficiency centers with access to advanced flow cytometry techniques and molecular confirmation to ensure an accurate and definitive diagnosis. Ultimately, therapeutic decisions from supportive care to definitive hematopoietic stem cell transplantation or gene/enzymatic therapy for SCID patients must be guided by the precise underlying pathogenic mechanism and the specific molecular defect.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42888057","pmid":"42888057","pmcid":"","doi":"10.1016/j.acra.2026.09.065","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888057/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Acad Radiol","journal_full":"ACADEMIC RADIOLOGY","tier":"A","if_val":4.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Retrospective Lung-RADS v2022 Characterization of Fatal Lung Cancer Cases in the National Lung Screening Trial.","title_en":"Retrospective Lung-RADS v2022 Characterization of Fatal Lung Cancer Cases in the National Lung Screening Trial.","authors":"Tanwar A, Ebrahimzadeh S, Vella M, Ahn H, Beagle A, Schnitzler T, Bondarenko M, Yala A et al.","affiliation_highlight":"Department of Radiology and Biomedical Imaging, University of California San Francisco (UCSF), San Francisco, CA, USA (A…","results":"RATIONALE AND OBJECTIVES: Persistent lung cancer mortality despite screening is multifactorial. Characterizing computed tomography (CT) findings preceding fatal lung cancer may identify imaging features and screening cha…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"RATIONALE AND OBJECTIVES: Persistent lung cancer mortality despite screening is multifactorial. Characterizing computed tomography (CT) findings preceding fatal lung cancer may identify imaging features and screening challenges that warrant further study. MATERIALS AND METHODS: We conducted a retrospective, outcome-enriched case series nested within the 26,722-participant low-dose computed tomography arm of the National Lung Screening Trial. Among 359 participants who died of lung cancer within the prespecified interval, exclusions for positive baseline screening (n = 186), incomplete screening (n = 28), withdrawal/declined screening (n = 19), unavailable CTs (n = 6), or three negative screens followed by death 2+ years after the final screen (n = 29) yielded 91 participants. Screening CTs were retrospectively assessed using the Lung Imaging Reporting and Data System (Lung-RADS) v2022. Four thoracic radiologists independently reviewed visible-in-retrospect nodules and adjudicated whether they met criteria for suspicion. RESULTS: Of 91 participants, 22 (24%; 95% confidence interval (CI), 17%-34%) had visible-in-retrospect nodules considered suspicious under Lung-RADS v2022 (\"missed\"), 16 (18%; 95% CI, 11%-27%) had visible nodules not meeting suspicion criteria (\"not callable\"), 50 (55%; 95% CI, 45%-65%) had no visible-in-retrospect nodule, and 3 (3.3%) were inconclusive. Missed nodules were frequently juxtapleural (41%), obscured (50%), or irregularly bordered (68%); not-callable nodules were frequently <6 mm (75%), juxtapleural (56%), or irregularly bordered (56%). CONCLUSION: In this selected fatal-case series, small and juxtapleural nodules were common among visible nodules not meeting Lung-RADS v2022 suspicion criteria. These findings warrant evaluation in representative screening populations and should not be interpreted as estimates of population-level Lung-RADS performance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42885681","pmid":"42885681","pmcid":"","doi":"10.1200/OP-26-01123","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42885681/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"JCO Oncol Pract","journal_full":"JCO Oncology Practice","tier":"A","if_val":5.5,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A Decade of QOPI in Spain: From Quality Measurement to Continuous Improvement in Oncology Practice.","title_en":"A Decade of QOPI in Spain: From Quality Measurement to Continuous Improvement in Oncology Practice.","authors":"García-Foncillas J, Gratal P, Blasco Cordellat A, Burriel C, Jiménez FJ, Alba M, Chamochin S, Rogado Á et al.","affiliation_highlight":"Fundación ECO, Madrid, España.","results":"INTRODUCTION: We evaluated 10 years of QOPI implementation in Spain to characterize quality performance across successive stages of participation, assess sustainability over time, compare performance with contemporaneous…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: We evaluated 10 years of QOPI implementation in Spain to characterize quality performance across successive stages of participation, assess sustainability over time, compare performance with contemporaneous QOPI benchmarks, identify persistent certification gaps, and examine quality performance across repeated certification and reassessment cycles. METHODS AND MATERIALS: We conducted a longitudinal descriptive study of QOPI implementation in Spanish oncology practices between 2015 and 2025. Analyses included within-practice changes in QOPI quality measures among certified practices, comparing the last available pre-certification assessment with the first post-certification assessment, including disease-specific measures for breast, colorectal, and lung cancer; descriptive comparisons between first participation and post-certification assessments, benchmarking against the contemporaneous QOPI Aggregate, and findings from external certification and recertification surveys. RESULTS: Within-practice longitudinal analyses among certified practices showed higher post-certification performance in several patient-centered measures, including emotional well-being assessment (75.56% to 85.20%), infertility risk discussion (70.33% to 78.67%), appropriate pain management (83.57% to 89.15%), and pain assessment (83.56% to 89.50%). Certified practices maintained broadly high performance over time, although lower post-certification performance was observed in some chemotherapy and other documentation measures. Benchmarking showed a shift: pain assessment, emotional well-being assessment, appropriate pain management, and infertility counseling moved from below to above the contemporaneous QOPI Aggregate after certification. External surveys identified recurrent opportunities for improvement in treatment verification and patient information and education. CONCLUSION: A decade of QOPI implementation in Spain was associated with sustained high-quality performance, higher scores in selected patient-centered measures after certification, and the identification of persistent opportunities for improvement. Repeated measurement, benchmarking, certification, and reassessment may support organizational change and continuous quality improvement.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42888302","pmid":"42888302","pmcid":"8434938","doi":"10.1002/1878-0261.13357","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888302/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Clin Transl Oncol","journal_full":"Clinical & translational oncology : official publication of the Federation of Spanish Oncology Societies and of the National Cancer Institute of Mexico","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（非系统检索、无定量合成、无原始数据）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":42,"score_breakdown":{"clinical":17,"methodology":8,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"ctDNA在可切除非小细胞肺癌围手术期治疗中的价值与研究进展：一篇强调多数应用仍属研究性质的叙述性综述","title_en":"Value and research advances of ctDNA in perioperative therapy for non-small cell lung cancer.","authors":"Diao J, Cen F, Gao Y, Jiang M, Yin H","affiliation_highlight":"Department of Oncology, The First Affiliated Hospital of Soochow University, Suzhou, China.","results":"","authors_conclusion":"ctDNA在指导个体化围手术期管理方面显示出可观前景，但多数应用仍处于研究阶段；因此需区分已确立的相关性用途与正在临床试验中评估的前瞻性策略。当前ctDNA应用存在敏感性有限、假阳性、缺乏标准化、成本效益顾虑及难以整合进临床决策等技术挑战。未来需要前瞻性干预研究来验证ctDNA指导的治疗调整，并建立标准化流程与多学科协作路径，从而推动ctDNA融入NSCLC围手术期全程管理，实现精准疗效评估、风险分层与个体化治疗决策。","ai_note":"摘要自述“systematically examines”，但未提供检索数据库、检索式、时间范围、纳入排除标准、文献筛选流程或偏倚风险评估，也无PRISMA类流程图，属叙述性综述而非系统综述，该措辞存在夸大。全文无任何原始数值、效应量或置信区间，所有关于疗效监测、病理缓解相关性与复发预测的论断均未在摘要层面给出证据强度分级。摘要同段并列“已确立的相关性用途”与“试验中的前瞻性策略”，但未具体界定二者边界，读者无法判断哪些结论可直接用于临床。信息不足：无法评估引用文献的选择偏倚与结论稳健性。","pico":{"p":"","ic":""},"reason":"为围手术期ctDNA/MRD相关临床与科研问题提供概念框架与待验证议题清单；可用于界定ctDNA在 neoadjuvant 疗效监测与术后复发预测中的证据边界，提示设计前瞻性干预性研究时须解决标准化、假阳性与成本效益问题，但不提供可直接引用的效应量。","abstract_en":"Perioperative treatment plays an increasingly important role in improving outcomes for patients with resectable non-small cell lung cancer (NSCLC). Circulating tumor DNA (ctDNA) offers a new perspective for optimizing individualized perioperative management. This review systematically examines the core value of ctDNA in perioperative therapy for resectable NSCLC, encompassing its correlation with treatment response and pathological remission during the neoadjuvant phase, its utility as a dynamic monitor of treatment efficacy, and its emerging role in prognostic stratification and recurrence prediction in the postoperative setting. Importantly, while ctDNA demonstrates considerable promise for guiding individualized perioperative management, most applications remain investigational; we therefore distinguish between established correlative uses and prospective strategies currently under evaluation in clinical trials. It also addresses current technical challenges in ctDNA application, including limited sensitivity, false positives, lack of standardization, cost-effectiveness concerns, and difficulties in integration into clinical decision-making. Future prospective interventional studies are needed to validate ctDNA-guided treatment adjustments and to establish standardized protocols and multidisciplinary collaboration pathways, thereby facilitating the integration of ctDNA into the full course of perioperative management for NSCLC and enabling precise efficacy assessment, risk stratification, and individualized treatment decisions.","tags":["ctDNA","围手术期","可切除NSCLC","MRD","叙述性综述","证据边界"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890693","pmid":"42890693","pmcid":"PMC13673961","doi":"10.3389/fimmu.2026.1907688","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890693/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述 · 非系统评价，无原始数据","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":41,"score_breakdown":{"clinical":10,"methodology":8,"specialty":15,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺菌群、肠菌群与肺-肠轴在肺癌免疫治疗中的作用：三部分调控视角的叙述性综述","title_en":"Lung microbiota, gut microbiota, and the lung-gut axis in lung cancer immunotherapy: a tripartite regulatory perspective.","authors":"Chen Q, Wang J, Sun D, Qin J","affiliation_highlight":"Department of Respiratory and Critical Medicine, Tianjin Chest Hospital, Tianjin, China.","results":"","authors_conclusion":"本综述综合了关于肠-肺轴的现有证据，整合了肠道、肺部及瘤内菌群塑造肺癌免疫微环境与免疫治疗反应的三方调控网络；尽管这些微生物群落通过肺-肠轴在概念上相互关联，但支持其整合网络的实证证据仍属初步，这些相互作用的临床相关性尚需进一步研究。未来研究应聚焦于建立特定微生物分类群与免疫治疗结局之间的因果关系、通过多组学方法阐明空间异质性，并在设计良好的前瞻性研究中验证靶向微生物组的干预措施。","ai_note":"叙述性综述，未报告系统检索策略、纳入排除标准、证据分级或偏倚评估；将肠-肺-瘤内菌群概括为“三方调控网络”，但作者自认证据仅为初步，概念框架强于实证整合；所提机制（IPA远程调节CD8+ T细胞干性、PRR信号影响肺泡巨噬细胞极化、瘤内菌群与STING/Treg/M2/PD-L1）均为文献推论，无定量证据；存在以新概念框架选择性强调机制可能性、弱化证据强度不足的风险。","pico":{"p":"","ic":""},"reason":"为肺癌免疫治疗中微生物组相关研究提供概念框架与知识缺口清单，可影响科研假设设计与生物标志物探索方向，但不直接改变手术、结节或围手术期临床决策。","abstract_en":"The gut microbiota is well established as a key modulator of systemic immunity, with growing evidence supporting its impact on lung cancer immunotherapy outcomes. However, the contributions of the lung microbiota and the recently recognized intratumoral microbiota remain less defined. This review synthesizes current evidence on the gut-lung axis, consolidating the tripartite regulatory network of gut, lung, and intratumoral microbiota in shaping the lung cancer immune microenvironment and immunotherapy response. We discuss how gut-derived metabolites such as indole-3-propionic acid may remotely modulate CD8+ T cell stemness, how lung microbiota locally influence alveolar macrophage polarization through pattern recognition receptor signaling, and how intratumoral microbiota have been implicated in STING pathway activation, Treg/M2 polarization, and PD-L1 expression. Although these microbial communities are conceptually linked through the lung-gut axis, the empirical evidence supporting their integrated network remains preliminary, and the clinical relevance of these interactions requires further investigation. Future research should focus on establishing causal relationships between specific microbial taxa and immunotherapy outcomes, elucidating spatial heterogeneity through multi-omics approaches, and validating microbiota-targeted interventions in well-designed prospective studies. This review offers a framework for critically evaluating the current evidence and identifying key knowledge gaps in this evolving field.","tags":["肺癌免疫治疗","肠道菌群","肺菌群","肺-肠轴","叙述性综述","免疫微环境"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42890969","pmid":"42890969","pmcid":"PMC13675047","doi":"10.4103/jmp.jmp_161_26","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890969/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"J Med Phys","journal_full":"Journal of medical physics","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Is there Any Impact of Tumor Volume in Stereotactic Body Radiation Therapy for Lung Cancer? A Cohort for T1, 2 Non-small Cell Lung Cancer Cases.","title_en":"Is there Any Impact of Tumor Volume in Stereotactic Body Radiation Therapy for Lung Cancer? A Cohort for T1, 2 Non-small Cell Lung Cancer Cases.","authors":"Dimitropoulou MT, Platoni K, Alevronta E, Kouloulias V, Armpilia C, Zygogianni A","affiliation_highlight":"Department of Applied Medical Physics, National and Kapodistrian University of Athens, Medical School, ATTIKON Universit…","results":"PURPOSE/AIM: The aim of the study was to assess the impact of tumor size on dose-volume histograms (DVHs) and clinical outcomes in patients with early-stage non-small cell lung cancer (NSCLC) undergoing stereotactic body…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE/AIM: The aim of the study was to assess the impact of tumor size on dose-volume histograms (DVHs) and clinical outcomes in patients with early-stage non-small cell lung cancer (NSCLC) undergoing stereotactic body radiation therapy (SBRT) using the CyberKnife M6 System with a lung-optimized treatment module. MATERIALS AND METHODS: Retrospective analysis was performed on 12 patients diagnosed with NSCLC receiving SBRT treatment. Analysis of cumulative DVHs was done to evaluate dose distribution in the planning target volume (PTV) and surrounding organs at risk. The patient population was divided according to tumor size; one group was patients with PTV <12 cc and the other group was patients with PTV >12 cc. Statistical analysis was performed using SPSS software. RESULTS: All treatment plans achieved adequate target coverage with sharp dose gradients. There was slight improvement in terms of dose distribution and response rate for smaller tumors (PTV <12 cc); however, these differences did not show statistical significance. CONCLUSIONS: There were no statistically significant differences between tumor volume and DVH parameters or clinical response in SBRT treatment of NSCLC. Most of the patients received biological effective dose (α/β =10) values above 100 Gy, with some of them receiving >120 Gy, which has been associated with improved treatment outcomes.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890733","pmid":"42890733","pmcid":"PMC13674093","doi":"10.1016/j.xjtc.2026.102570","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890733/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"JTCVS Tech","journal_full":"JTCVS techniques","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Intraoperative recall of surgeon-defined 3-dimensional planning during robotic pulmonary resection: A feasibility study.","title_en":"Intraoperative recall of surgeon-defined 3-dimensional planning during robotic pulmonary resection: A feasibility study.","authors":"Kawakita N, Toko T, Matsui S, Nanjo K, Yamamoto K, Takehara E, Takeuchi T, Fujimoto K et al.","affiliation_highlight":"Department of Thoracic and Endocrine Surgery and Oncology, Tokushima University Graduate School of Biomedical Sciences, …","results":"OBJECTIVE: To evaluate the feasibility, usability, and user acceptance of integrating preoperative patient-specific 3-dimensional planning into an intraoperative stereoscopic robotic workflow during pulmonary resection. …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To evaluate the feasibility, usability, and user acceptance of integrating preoperative patient-specific 3-dimensional planning into an intraoperative stereoscopic robotic workflow during pulmonary resection. METHODS: We conducted a prospective single-center pilot study of patients scheduled to undergo robot-assisted pulmonary lobectomy or anatomical segmentectomy. Patient-specific pulmonary anatomical models were generated preoperatively and displayed intraoperatively on the robotic surgeon's console using an i-Lung 3-dimensional simulator. Planned transection references for the vascular and bronchial structures were defined using cut rings and recalled during surgery. Questionnaire responses from surgeons and assistants were prospectively collected after each procedure. The outcomes were summarized using descriptive statistics, and no formal hypothesis testing was performed. RESULTS: Sixteen consecutive patients were enrolled; 1 procedure was aborted because of unexpected pleural dissemination. The remaining 15 patients were analyzed. The system was successfully introduced in all 15 procedures, with no conversions, procedure interruptions, technical failures, system crashes, or image display interruptions attributable to the system. All surgeon responses indicated anatomical consistency, no rendering delay interfering with surgery, and no significant visual discomfort. Surgeon-rated depth perception and usefulness of console-based anatomical confirmation were rated 5 in 13 responses and 4 in 2 responses. Interactive functions and future-use items were rated 5 in all surgeon responses. Assistant responses also favored shared stereoscopic visualization. CONCLUSIONS: The i-Lung 3-dimensional simulator enabled feasible integration of preoperative patient-specific 3-dimensional planning into the intraoperative stereoscopic robotic console environment. Further studies with objective endpoints are warranted.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890433","pmid":"42890433","pmcid":"PMC13673136","doi":"10.1002/joa3.70498","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890433/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"J Arrhythm","journal_full":"Journal of arrhythmia","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Totally Thoracoscopic Atrial Fibrillation Ablation With the Gemini S Bipolar Clamp: A Single-Center Descriptive Cohort Study of 1-Year Rhythm, Safety, and Quality-of-Life Outcomes.","title_en":"Totally Thoracoscopic Atrial Fibrillation Ablation With the Gemini S Bipolar Clamp: A Single-Center Descriptive Cohort Study of 1-Year Rhythm, Safety, and Quality-of-Life Outcomes.","authors":"Gruszczynski M, Rodriguez Cetina Biefer H, Rings L, Salzberg SP, Ntinopoulos V, Dzemali O","affiliation_highlight":"Department of Cardiac Surgery City Hospital of Zurich-Triemli Zurich Switzerland.","results":"BACKGROUND: Outcome data for the Gemini S bipolar radiofrequency clamp are almost absent; the only indexed report being a three-patient case series. We describe 1-year outcomes in a consecutive cohort.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Outcome data for the Gemini S bipolar radiofrequency clamp are almost absent; the only indexed report being a three-patient case series. We describe 1-year outcomes in a consecutive cohort. METHODS: We retrospectively analyzed all consecutive patients treated with the Gemini S clamp between January 2021 and August 2024. Epicardial box isolation was combined with left atrial appendage (LAA) exclusion; completeness was confirmed by entry and exit block on epicardial three-dimensional mapping. The primary outcome was freedom from AF recurrence at 12 months, on and off antiarrhythmic drugs (AADs) after a 90-day blanking period. RESULTS: Twenty-three patients were included (mean age 64.4 ± 8.0 years; 82.6% male). AF was paroxysmal in 34.8%, persistent in 26.1%, and long-standing persistent in 39.1%; 60.9% had prior catheter ablation and 69.6% had failed or were intolerant to a Class I or III agent. A complete block-verified box lesion was achieved in 95.7% and LAA exclusion in 91.3%. Three patients (13.0%) required conversion to sternotomy for bleeding, exceeding larger series. There was no death, stroke, phrenic nerve palsy, or pacemaker implantation. At 1 year, 87.0% (95% CI 67.9-95.5) were in sinus rhythm, all off Class I/III AADs. CONCLUSIONS: Sinus rhythm was achieved in 87.0% of patients at 1 year. As the largest reported experience with this device, the series provides device-level evidence where little existed, but it is descriptive, not powered for comparison, and the conversion rate needs confirmation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42887200","pmid":"42887200","pmcid":"","doi":"10.1016/j.cllc.2026.09.006","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42887200/","notice_url":"","trial_url":"","pub_date":"2026-Sep-20","briefing_date":"2026-10-18","journal_abbr":"Clin Lung Cancer","journal_full":"Clinical Lung Cancer","tier":"B","if_val":3.9,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Racial Disparities in Thymic Epithelial Tumors: Insights From a Multiracial Urban Cohort.","title_en":"Racial Disparities in Thymic Epithelial Tumors: Insights From a Multiracial Urban Cohort.","authors":"Pietroluongo E, Bestvina CM, Lello AD, Esposito A, Elsebaie MAT, Brettin R, Wu S, Torri V et al.","affiliation_highlight":"Department of Medicine, Section of Hematology Oncology, Thoracic Oncology Program, The University of Chicago Medicine, C…","results":"BACKGROUND: Thymic epithelial tumors (TETs) are rare thoracic malignancies for which racial disparities in outcomes remain poorly characterized. We evaluated survival outcomes across racial groups and explored the clinic…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Thymic epithelial tumors (TETs) are rare thoracic malignancies for which racial disparities in outcomes remain poorly characterized. We evaluated survival outcomes across racial groups and explored the clinical and sociodemographic factors that may help contextualize any observed differences. PATIENTS AND METHODS: We retrospectively analyzed 128 consecutive patients with histologically confirmed TETs referred to the University of Chicago between January 1989 and March 2024. Associations between race, socioeconomic variables, and overall survival (OS) were evaluated using multivariable logistic regression, Cox proportional hazards models, and inverse probability of treatment weighting with average treatment effect (IPTW-ATE). RESULTS: Among 128 patients (75 White, 58%; 31 Black, 24%), Black race showed numerically worse OS on univariable analysis (hazard ratios [HR] 1.90, 95% confidence intervals [CI] 0.93-3.88; P = .077). Socioeconomic disparities were substantial: 74.2% of Black patients resided in low-income areas versus 12.2% of White patients (adjusted odds ratio 4.45, 95% CI 2.60-7.64; P < .0001). On multivariable analysis, thymic carcinoma histology (HR 3.97; P = .0012) and age older than 60 years (HR 2.19; P = .032) independently predicted worse survival. Black patients demonstrated numerically poorer OS (HR 2.49; P = .098). After IPTW-ATE adjustment, the association between Black race and OS was attenuated (HR 1.66, 95% CI 0.82-3.33; P = .157). CONCLUSION: Socioeconomic disadvantage emerged as one of several factors that may help contextualize the observed survival disparities in TETs. The attenuation of the effect estimates after adjustment for area-level socioeconomic factors suggests that social determinants of health may be relevant to the interpretation of these findings. Larger multi-institutional studies are needed to validate these observations.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42886720","pmid":"42886720","pmcid":"","doi":"10.1371/journal.pone.0360040","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886720/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"PLoS One","journal_full":"PloS one","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A retrospective epidemiological study of screening-derived solid cancer incidence proxy rates in South Korea before and after COVID-19 using Korean National Health Insurance Service data.","title_en":"A retrospective epidemiological study of screening-derived solid cancer incidence proxy rates in South Korea before and after COVID-19 using Korean National Health Insurance Service data.","authors":"Jung H, Jung M","affiliation_highlight":"Department of Pathology, Yonsei University College of Medicine, Seoul, Republic of Korea.","results":"BACKGROUND: The COVID-19 pandemic disrupted cancer screening and diagnostic pathways globally. Aggregate screening-derived indicators require cautious interpretation because they do not represent confirmed cancer registr…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The COVID-19 pandemic disrupted cancer screening and diagnostic pathways globally. Aggregate screening-derived indicators require cautious interpretation because they do not represent confirmed cancer registry incidence but might reflect program participation, referral patterns, and denominator composition. OBJECTIVE: To evaluate pre- and post-COVID-19 changes in selected solid cancer screening-derived incidence proxy rates in South Korea, and to estimate model-based proxy rates through 2028. METHODS: This retrospective ecological longitudinal study analyzed publicly available aggregate annual cancer-screening statistics from the Korean National Health Insurance Service (NHIS) and Korean Statistical Information Service (KOSIS) for six solid cancer programs (stomach, liver, colorectal, breast, cervical, and lung cancer). Annual proxy rates per 100,000 screened or eligible persons were calculated. Pre-COVID (2010-2019) and post-COVID (2020-2024) means were compared using Welch t-tests with Mann-Whitney U sensitivity analyses. Ordinary least-squares (OLS) forecasts were generated for 2025-2028. Interrupted time-series analysis was not feasible owing to an insufficient post-COVID observation window. RESULTS: Post-COVID changes in proxy rates were heterogeneous across selected programs. Breast cancer proxy rates increased by 17.1% (Welch p = 0.002) and liver cancer proxy rates by 83.6% (Welch p = 0.002); the liver cancer increase reflects denominator restriction to a high-risk population rather than a true epidemiological surge. Stomach cancer decreased by 23.3% (Welch p = 0.001), cervical cancer by 56.9% (Welch p = 0.005), and colorectal cancer by 25.8% (Welch p = 0.007). Lung cancer data were available only from 2019 to 2024 (program inception) and were interpreted descriptively. CONCLUSIONS: Aggregate South Korean national screening data show pandemic-era temporal associations with heterogeneous changes in selected solid cancer program proxy rates. These findings support an indirect screening-disruption and ascertainment interpretation rather than causal proof of a direct COVID-19 effect on solid cancer incidence.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42885308","pmid":"42885308","pmcid":"","doi":"10.3892/ijo.2026.5950","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42885308/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-18","journal_abbr":"Int J Oncol","journal_full":"INTERNATIONAL JOURNAL OF ONCOLOGY","tier":"B","if_val":7.3,"zone":"JCR Q1 · 3区","warned":false,"study_type":"临床前基础研究 · 体外细胞表型与机制实验及皮下异种移植模型","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":8,"methodology":17,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Disporum cantoniense 石油醚组分在 NSCLC 细胞及异种移植模型中经 AMPK/mTOR/ULK1 与 MEK/ERK 诱导自噬依赖性凋亡","title_en":"Disporum cantoniense suppresses non‑small cell lung cancer through AMPK/mTOR/ULK1‑mediated autophagy‑dependent apoptosis.","authors":"Feng C, Ji Y, Chen R, Chen Q, Pan Y, Wu J, Qin D, Law BYK et al.","affiliation_highlight":"Department of Pharmacy, Suining Chuanshan Hospital of Traditional Chinese Medicine, Sichuan 629000, P.R.","results":"","authors_conclusion":"Collectively, these findings identify DPF as a principal anti‑NSCLC fraction of Disporum cantoniense and suggest that it suppresses NSCLC progression through AMPK/mTOR/unc‑51 like autophagy activating kinase 1‑ and MEK/ERK‑mediated autophagy‑dependent apoptosis.","ai_note":"摘要未报告具体统计量、剂量、样本量、随机化或盲法信息；DPF 为多成分提取物，机制结论主要依赖通路标志物变化及药理学/基因敲除干预，尚不能确定单一因果靶点；异种移植模型“无显著全身毒性”缺乏具体安全性数据；均为临床前证据，不能外推至临床疗效。","pico":{"p":"A549 与 H1299 NSCLC 细胞、BEAS-2B 正常支气管上皮细胞、Bax-Bak 双敲除及 Atg7-/- 小鼠胚胎成纤维细胞、异种移植模型；样本量未报告","ic":"DPF（Disporum cantoniense 石油醚活性组分）干预；对照为未处理或溶剂对照，并包括药理学自噬抑制及 Atg7 缺陷/ Bax-Bak 双敲除模型"},"reason":"为天然产物治疗 NSCLC 的临床前机制研究提供自噬依赖性凋亡与 AMPK/mTOR/ULK1、MEK/ERK 通路证据，可作为后续药物开发和联合策略研究的实验基线，但不直接影响当前手术或随访决策。","abstract_en":"Non‑small cell lung cancer (NSCLC) remains a leading cause of cancer‑associated mortality and urgently requires new therapeutic agents. In the present study, phenotypic screening of natural herbal extracts was performed, identifying Disporum cantoniense extract as a selective inhibitor of NSCLC cell viability. Bioactivity‑guided fractionation further revealed that the petroleum ether fraction (DPF) was the major active fraction. DPF suppressed the viability, proliferation, colony formation, migration and invasion of A549 and H1299 cells while exhibiting weaker cytotoxicity toward BEAS‑2B cells. In addition, DPF increased propidium iodide (PI)‑positive cell death and lactate dehydrogenase release in NSCLC cells, indicating that DPF‑induced viability loss was accompanied by membrane‑damaging cytotoxicity. Transcriptomic and network pharmacology analyses indicated significant enrichment of autophagy‑, apoptosis‑, AMPK‑, mTOR‑, and MAPK‑associated pathways. Mechanistically, DPF increased LC3‑II accumulation, promoted green fluorescent protein‑LC3 puncta formation and autophagic flux, and activated the AMPK/mTOR/unc‑51 like autophagy activating kinase 1 and MEK/ERK signaling pathways. DPF also induced apoptosis, as demonstrated by increased Annexin V positivity, elevated cleaved caspase‑3 and Bax expression, reduced Bcl‑2 expression, and reduced cytotoxicity in Bax‑Bak double‑knockout mouse embryonic fibroblast (MEF) cells. Notably, pharmacological inhibition of autophagy or its upstream regulators attenuated DPF‑induced cytotoxicity. In addition, autophagy‑deficient Atg7‑/‑ MEF cells exhibited reduced DPF‑induced PI‑positive cell death, loss of cell viability, and caspase‑3 activation, further supporting the involvement of Atg7‑dependent autophagy in DPF‑induced apoptosis. In a xenograft model, DPF significantly inhibited tumor growth and increased apoptosis‑ and autophagy‑associated markers in tumor tissues without evident systemic toxicity. Collectively, these findings identify DPF as a principal anti‑NSCLC fraction of Disporum cantoniense and suggest that it suppresses NSCLC progression through AMPK/mTOR/unc‑51 like autophagy activating kinase 1‑ and MEK/ERK‑mediated autophagy‑dependent apoptosis.","tags":["NSCLC","天然产物","自噬","凋亡","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883968","pmid":"42883968","pmcid":"","doi":"10.3390/ijms27198724","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883968/","notice_url":"","trial_url":"","pub_date":"2026-Sep-29","briefing_date":"2026-10-18","journal_abbr":"Int J Mol Sci","journal_full":"International journal of molecular sciences","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Integrated Molecular, Clinicopathological and Immune Profiling of Non-Small Cell Lung Cancer: The MONREPOS Hellenic Cooperative Oncology Group (HeCOG) Study (HE_2TR/13).","title_en":"Integrated Molecular, Clinicopathological and Immune Profiling of Non-Small Cell Lung Cancer: The MONREPOS Hellenic Cooperative Oncology Group (HeCOG) Study (HE_2TR/13).","authors":"Efthymiadis K, Soteriou C, Kotoula V, Papadopoulou K, Pouliakis A, Lampaki S, Goussia A, Fountzilas E et al.","affiliation_highlight":"Department of Medical Oncology, Papageorgiou Hospital, School of Health Sciences, Faculty of Medicine, Aristotle Univers…","results":"Integrated assessment of tumour genomics and immune biomarkers may improve prognostic stratification in non-small cell lung cancer (NSCLC). We examined the distribution and prognostic relevance of somatic pathogenic/like…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Integrated assessment of tumour genomics and immune biomarkers may improve prognostic stratification in non-small cell lung cancer (NSCLC). We examined the distribution and prognostic relevance of somatic pathogenic/likely pathogenic variants (PVs), somatic copy-number alterations (SCNAs), programmed death-ligand 1 (PD-L1) expression and tumour-infiltrating lymphocytes (TILs) in a multicentre cohort. This retrospective, multicentre study included 367 unselected patients with histologically confirmed NSCLC treated at 19 centres in Greece between 2000 and 2020. Targeted next-generation sequencing (NGS) was performed in 267 tumours; PD-L1 tumour proportion score (TPS) and haematoxylin and eosin (H&E)-based TIL density were evaluated in 298 and 352 tumours, respectively. Overall survival (OS) was assessed using Kaplan-Meier and multivariable Cox regression analyses. TP53 (53.6%) and KRAS (16.5%) were the most frequently detected genes with PVs; SCNAs were identified in 22.5% of sequenced tumours and were more frequent in squamous than non-squamous histology. In multivariable analysis (254 complete cases), TIL density ≥10% (hazard ratio [HR] 0.72, 95% confidence interval [CI] 0.52-0.99; p = 0.042) and ≥2 mutated genes (HR 1.44, 95% CI 1.08-1.92; p = 0.014) were independently associated with OS. PIK3CA-containing copy-number gains were significantly enriched in squamous tumours with low TIL density (p = 0.024), while FGFR1-containing copy-number gains showed a similar but non-significant trend (p = 0.088). In the present retrospective study, co-mutation burden and TIL density provided complementary prognostic information beyond clinicopathological variables in NSCLC. The association between selected copy-number gains and an immune-poor squamous phenotype warrants prospective validation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882773","pmid":"42882773","pmcid":"","doi":"10.3390/cancers18193078","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882773/","notice_url":"","trial_url":"","pub_date":"2026-Sep-22","briefing_date":"2026-10-18","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"C","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Tarlatamab in Small Cell Lung Cancer and Extrapulmonary Small Cell Carcinoma: A Single-Centre Retrospective Cohort Study of Routine-Practice Outcomes.","title_en":"Tarlatamab in Small Cell Lung Cancer and Extrapulmonary Small Cell Carcinoma: A Single-Centre Retrospective Cohort Study of Routine-Practice Outcomes.","authors":"Bangolo A, Zhang L, Zhao J, Amoozgar B, Gill S, Rajanna S, Abdelwahab S, Molina A et al.","affiliation_highlight":"Department of Hematology and Oncology, Hackensack Meridian John Theurer Cancer Center, Hackensack, NJ 07047, USA.","results":"BACKGROUND: Tarlatamab, a Delta-like ligand 3 (DLL3)-targeting bispecific T-cell engager (BiTE), has demonstrated significant efficacy in relapsed small cell lung cancer (SCLC) in clinical trials. However, real-world cli…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Tarlatamab, a Delta-like ligand 3 (DLL3)-targeting bispecific T-cell engager (BiTE), has demonstrated significant efficacy in relapsed small cell lung cancer (SCLC) in clinical trials. However, real-world clinical outcomes and its efficacy in extrapulmonary small cell carcinoma (EPSCC) remain sparsely characterized. METHODS: We conducted a retrospective, single-institution cohort study of 24 adult patients with moderately pretreated advanced SCLC (n = 19) or EPSCC (n = 5) who received standard-of-care tarlatamab. Endpoints included objective response rate (ORR), progression-free survival (PFS), overall survival (OS), and safety. RESULTS: Patients had received a median of two prior lines of therapy, and 38% had baseline brain metastases. The overall intent-to-treat (ITT) ORR was 25.0%. Among response-evaluable patients (n = 18), the ORR was 33.3%. Efficacy was notably discordant between histologies: the SCLC cohort achieved an ITT ORR of 31.6% (46.2% in evaluable patients), whereas 100% of EPSCC patients experienced progressive disease. Systemic responses were observed in patients with baseline brain metastases (ORR 33.3%). The safety profile was manageable; any-grade CRS and ICANS occurred in 58% and 29% of patients, respectively. Severe (Grade ≥ 3) toxicities were rare, and tocilizumab was utilized therapeutically in 50% of patients for low-grade toxicity. CONCLUSIONS: These real-world data are consistent with tarlatamab's systemic efficacy and tolerability in SCLC. The lack of clinical benefit observed in this small EPSCC cohort raises a hypothesis that requires prospective biomarker-correlated evaluation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42882357","pmid":"42882357","pmcid":"","doi":"10.3390/diagnostics16193202","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882357/","notice_url":"","trial_url":"","pub_date":"2026-Oct-02","briefing_date":"2026-10-18","journal_abbr":"Diagnostics (Basel)","journal_full":"Diagnostics (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"nodule","category_label":"肺结节与早筛管理","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Two-Phase Occupational Screening in Coal-Fired Power Plant Workers: Anamnestic Risk Stratification and Targeted Low-Dose CT Findings.","title_en":"Two-Phase Occupational Screening in Coal-Fired Power Plant Workers: Anamnestic Risk Stratification and Targeted Low-Dose CT Findings.","authors":"Cranta A, Osiac E, Gheonea DI, Streba CT, Oancea CN, Gheonea IA, Niculici M, Ciofiac C et al.","affiliation_highlight":"Biophysics Department, University of Medicine and Pharmacy of Craiova, 2 Petru Rareș Street, 200349 Craiova, Romania.","results":"Background: Employees at coal-fired power plants experience cumulative occupational exposure to respirable particulates alongside a high prevalence of smoking, both contributing to chronic respiratory disease and elevate…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background: Employees at coal-fired power plants experience cumulative occupational exposure to respirable particulates alongside a high prevalence of smoking, both contributing to chronic respiratory disease and elevated lung cancer risk, and organized-screening implementation data remain scarce in this specific industrial setting outside asbestos-exposed cohorts. We evaluated a two-step occupational screening strategy integrating an anamnestic questionnaire with targeted low-dose CT (LDCT) imaging, assessing risk distribution, structured imaging findings, and the discriminative value of questionnaire-based triage relative to its underlying continuous predictors. Methods: In this cross-sectional study, all workers at a coal-fired power plant completed a structured questionnaire (F1) and were classified as high-risk or non-high-risk using a predefined eligibility rule (respiratory symptoms, or age ≥ 50 years with current/former smoking). All workers were invited to voluntary LDCT (F2), interpreted using Lung-RADS v2022 with structured emphysema and coronary artery calcium (CAC) assessment. Associations were assessed using Fisher's exact tests, multivariable logistic regression, and ROC analysis with DeLong's test; voluntary LDCT uptake was characterized with a multivariable propensity model. Results: Among 870 screened workers, 364 (41.8%) were high-risk. LDCT uptake was higher among high-risk workers (130/364, 35.7%) than non-high-risk workers (56/506, 11.1%), yielding 186 examinations. Only 14/186 (7.5%) had Lung-RADS ≥ 3. High-risk status was associated with higher prevalence of any nodule (80.8% vs. 62.5%; OR 2.52) and CAC (46.9% vs. 14.3%; OR 5.30); a composite abnormality outcome was present in 92.3% vs. 69.6% (OR 5.23). Only age (OR 1.11/year) and ever-smoking status (OR 4.38) independently predicted abnormalities on multivariable analysis; dichotomized risk classification showed reduced discrimination for CAC versus a continuous age-smoking model (AUC 0.647 vs. 0.779). Conclusions: Questionnaire-based triage effectively enriched the LDCT-screened population for smoking-related and cardiometabolic risk. Age and smoking history, rather than the full questionnaire, principally drove imaging abnormalities, supporting an integrated occupational model combining lung cancer screening with COPD and cardiovascular risk management.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882209","pmid":"42882209","pmcid":"","doi":"10.3390/jcm15197750","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882209/","notice_url":"","trial_url":"","pub_date":"2026-Oct-08","briefing_date":"2026-10-18","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Real-World Evaluation of the Immune Checkpoint Inhibitor Score (IChIS) in Advanced Non-Small Cell Lung Cancer Treated with Immunotherapy.","title_en":"Real-World Evaluation of the Immune Checkpoint Inhibitor Score (IChIS) in Advanced Non-Small Cell Lung Cancer Treated with Immunotherapy.","authors":"Dilli İ, Kavak EE, Atak M, Çelik S, Aydın İsak Ö, Zeynelgil E, Yazılıtaş D","affiliation_highlight":"Department of Medical Oncology, Etlik City Hospital, 06170 Ankara, Turkey.","results":"Background: The Immune Checkpoint Inhibitor Score (IChIS), an inflammation-based biomarker incorporating neutrophil and immature granulocyte counts, was recently developed to predict outcomes in patients with advanced no…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background: The Immune Checkpoint Inhibitor Score (IChIS), an inflammation-based biomarker incorporating neutrophil and immature granulocyte counts, was recently developed to predict outcomes in patients with advanced non-small cell lung cancer (NSCLC) receiving immune checkpoint inhibitors (ICIs). However, evidence regarding its prognostic performance in independent real-world populations remains limited. We aimed to evaluate the prognostic significance of IChIS in a real-world cohort of patients with advanced NSCLC treated with immunotherapy. Methods: This retrospective single-center cohort study included 169 patients with advanced, recurrent, or metastatic NSCLC who received ICIs with palliative intent between September 2022 and December 2025. IChIS ranged from 0 to 2 and was analyzed as a categorical variable, with IChIS 0 as the reference category. The primary endpoint was progression-free survival (PFS), while overall survival (OS) was evaluated as a secondary exploratory endpoint. Survival outcomes were estimated using the Kaplan-Meier method and evaluated using Cox proportional hazards regression. Multivariable models included ICI treatment line as a clinically relevant potential confounder. Results: A total of 169 patients were included. The median follow-up was 14.1 months. IChIS 0, 1, and 2 were observed in 105 (62.1%), 33 (19.5%), and 31 (18.4%) patients, respectively. Median PFS decreased across increasing IChIS categories. In multivariable Cox regression analysis, compared with IChIS 0, both IChIS 1 (adjusted HR 1.61, 95% CI 1.00-2.59; p = 0.04) and IChIS 2 (adjusted HR 3.63, 95% CI 2.22-5.92; p < 0.001) were independently associated with shorter PFS. For OS, IChIS 1 was not significantly associated with outcome (adjusted HR 1.51, 95% CI 0.86-2.64; p = 0.15), whereas IChIS 2 was independently associated with shorter OS (adjusted HR 4.40, 95% CI 2.53-7.64; p < 0.001). Conclusions: Higher IChIS was independently associated with shorter PFS in patients with advanced NSCLC receiving ICIs, supporting its potential role as a simple and readily available prognostic biomarker. The association with OS was primarily observed in patients with IChIS 2 and should be interpreted cautiously given the relatively short follow-up. Prospective multicenter validation is warranted.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882176","pmid":"42882176","pmcid":"","doi":"10.3390/jcm15197715","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882176/","notice_url":"","trial_url":"","pub_date":"2026-Oct-06","briefing_date":"2026-10-18","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Development and Temporal Validation of Staged Prediction Models for Acute Respiratory Distress Syndrome After Thymic Epithelial Tumour Resection.","title_en":"Development and Temporal Validation of Staged Prediction Models for Acute Respiratory Distress Syndrome After Thymic Epithelial Tumour Resection.","authors":"Wang R, Yao S, Huang L, Liu Q","affiliation_highlight":"Department of Critical Care Medicine, Beijing Tuberculosis and Thoracic Tumor Research Institute, Beijing Chest Hospital…","results":"Background/Objectives: To develop and temporally validate staged models for predicting acute respiratory distress syndrome (ARDS) after thymic epithelial tumour resection. Methods: This single-centre retrospective study …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: To develop and temporally validate staged models for predicting acute respiratory distress syndrome (ARDS) after thymic epithelial tumour resection. Methods: This single-centre retrospective study included 596 adults with pathologically confirmed thymic epithelial tumours. Patients treated in 2005-2020 formed the development cohort (n = 395), and those treated in 2021-2026 formed the temporal validation cohort (n = 201). Postoperative ARDS was adjudicated using the 2024 global definition. A preoperative model and a postoperative landmark model incorporating intraoperative, pathological, and early postoperative variables were developed using least absolute shrinkage and selection operator and multivariable logistic regression. Performance was assessed using discrimination, calibration, Brier score, decision curve analysis, bootstrap internal validation, and temporal validation. Results: ARDS occurred in 116 development patients (29.4%) and 58 validation patients (28.9%). The postoperative landmark model included the preoperative linear predictor, one-lung ventilation duration, Masaoka-Koga stage, perioperative transfusion, and early postoperative glucose, albumin, and C-reactive protein. It achieved higher AUCs than the preoperative model in the development (0.908 vs. 0.693; p < 0.001) and validation cohorts (0.928 vs. 0.655; p < 0.001), with lower Brier scores (0.107 vs. 0.187 and 0.094 vs. 0.192, respectively; both p < 0.001). The optimism-corrected development AUC was 0.898. Calibration and decision curve analyses also favoured the postoperative landmark model. Conclusions: Incorporating perioperative information improved ARDS prediction after thymic epithelial tumour surgery. The staged models may support sequential perioperative risk assessment; however, prospective evaluation and independent multicentre validation are required before implementation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890857","pmid":"42890857","pmcid":"PMC13672327","doi":"10.3389/fpubh.2026.1759430","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890857/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Public Health","journal_full":"Frontiers in public health","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"横断面调查研究 · 多阶段概率抽样问卷调查","category":"nodule","category_label":"肺结节与早筛管理","score_total":38,"score_breakdown":{"clinical":9,"methodology":18,"specialty":11,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"高危人群总体（n=1957）","metric":"LCSHB-C 健康信念总分均值","val":"95.10","stat":"SD=10.13","grounded":true,"checks":[{"num":"95.10","grounded":true,"note":"数值+语境锚命中"},{"num":"10.13","grounded":true,"note":"数值+语境锚命中"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"高危人群总体（n=1957）","metric":"LCSHB-C 健康信念总分均值","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「1957」未在原摘要出现","人群限定「总体」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"中国福建高危人群肺癌筛查健康信念的横断面调查：筛查知识与既往筛查经历与更高信念得分相关","title_en":"Lung cancer screening health beliefs among a high-risk population in China: a cross-sectional survey.","authors":"Lin X, Wang F, Lin Y, Yang J, Lei F, Huang F","affiliation_highlight":"School of Nursing, Fujian Medical University, Fuzhou, Fujian, China.","results":"共纳入1957名受试者，LCSHB-C总体平均分95.10（SD=10.13）；肺癌筛查相关知识与既往筛查经历与健康信念呈最一致的正相关；农村居住、有宗教信仰、家庭收入较高者总体得分较高；女性、目前或既往吸烟、COPD、参加国家基本医疗保险者得分较低；年龄、教育程度、体重指数、职业暴露与各健康信念维度的关联不一致。","authors_conclusion":"LCS健康信念与筛查知识、既往筛查经历及若干社会人口学和健康相关特征相关。这些发现可为量身定制的LCS教育及支持策略提供依据，以促进高危人群的知情参与。","ai_note":"摘要仅报告关联方向，未给出回归系数、OR/β、95%CI或P值，无法判断效应大小与稳健性；LCSHB-C总分95.10缺乏最小重要差异或临床阈值，难以解读其实际意义；'筛查知识'作为自变量与健康信念量表内容可能存在概念重叠与共线性；横断面设计不能推断因果方向（如既往筛查经历与信念互为因果）；单省便利性抽样，高危定义与应答率未在摘要中说明；结局为信念而非筛查参与或期别下降等硬终点，属替代性中间指标。","pico":{"p":"中国福建省肺癌高危个体，共1957例（四阶段多阶段抽样，含概率比例规模抽样）","ic":"无干预对照暴露设计；以中文版肺癌筛查健康信念量表（LCSHB-C）评估健康信念，采用多元线性回归分析相关因素"},"reason":"为肺癌筛查宣教与患者沟通干预的设计提供中国高危人群的信念基线及可干预的相关因素（知识、既往筛查经历），可作为筛查依从性研究的对照参照，但不直接改变结节处理或手术决策。","abstract_en":"OBJECTIVES: Evidence on lung cancer screening (LCS) health beliefs among high-risk populations in China remains limited. This study aimed to examine LCS health beliefs and associated factors among individuals at high risk for lung cancer in Fujian Province, China. METHODS: This cross-sectional study was conducted from September 2020 to October 2022. High-risk individuals were recruited using a four-stage multistage sampling procedure incorporating probability-proportionate-to-size sampling. LCS health beliefs were assessed using the Chinese Lung Cancer Screening Health Belief Scale (LCSHB-C). Multiple linear regression was used to examine associated factors. RESULTS: A total of 1,957 participants were included, with a mean overall LCSHB-C score of 95.10 (SD = 10.13). LCS-related knowledge and previous screening experience showed the most consistent positive associations with health beliefs. Rural residence, religious affiliation, and higher household income were also associated with higher overall scores, whereas female sex, current or former smoking, COPD, and participation in the national basic medical insurance program were associated with lower scores. Associations with age, education, body mass index, and occupational exposure varied across health belief domains. CONCLUSION: LCS health beliefs were associated with screening knowledge, previous screening experience, and several sociodemographic and health-related characteristics. These findings may inform tailored LCS education and support strategies to facilitate informed participation among high-risk populations.","tags":["肺癌筛查","健康信念","横断面调查","高危人群","中国"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42884727","pmid":"42884727","pmcid":"","doi":"10.3390/nu18193276","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42884727/","notice_url":"","trial_url":"","pub_date":"2026-Oct-05","briefing_date":"2026-10-18","journal_abbr":"Nutrients","journal_full":"Nutrients","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前机制研究 · 体外单层/球体培养及异种移植瘤模型（含HKII沉默）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":36,"score_breakdown":{"clinical":8,"methodology":13,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"芹菜素在乳酸适应的恶性间皮瘤细胞中下调HKII相关代谢并诱导细胞死亡：体外与移植瘤临床前研究","title_en":"Hexokinase II as a Potential Target of Apigenin Through the Induction of Apoptosis and Necroptosis in Malignant Mesothelioma.","authors":"Cho MK, Lee SH, Nam HS, Lee YJ","affiliation_highlight":"Department of Dermatology, Soonchunhyang University Hospital, Seoul 04401, Republic of Korea.","results":"","authors_conclusion":"HKII-associated metabolism contributes to survival of lactate-acclimated MM cells, and apigenin affects this metabolic phenotype. Direct targeting of HKII by apigenin and the complete mitochondrial apoptotic pathway require further study.","ai_note":"摘要无样本量、效应量、置信区间或统计显著性，无法评估结果可靠性；以体外和异种移植瘤的定性变化为主，HKII是否为芹菜素直接靶点及线粒体凋亡通路完整性作者亦承认需进一步研究。","pico":{"p":"乳酸适应的恶性间皮瘤细胞系 MSTO-211HAcT 和 H2452AcT（单层/球体培养及异种移植瘤模型）；样本量未报告","ic":"Apigenin（芹菜素）处理及 HKII 沉默；对照设置摘要未明确描述"},"reason":"为恶性间皮瘤乳酸适应后化疗耐受的代谢靶点（HKII/芹菜素）提供临床前依据，可影响后续代谢靶向联合策略的实验设计，但尚不改变当前临床判断。","abstract_en":"Background: Lactate-acclimated MSTO-211HAcT and H2452AcT malignant mesothelioma (MM) cells were previously found to tolerate gemcitabine more readily than their parental cells while remaining sensitive to apigenin. We examined whether changes in glucose metabolism and HKII contribute to the apigenin response. Methods: Apigenin was evaluated in monolayer and spheroid cultures and in a xenograft model; HKII was also silenced in the acclimated cells. Results: Apigenin reduced cell viability, p-AKT (Ser473), glycolysis-associated proteins including HKII, and mitochondrial electron transport chain proteins, while increasing p53 and markers of cell death. Tumor growth and selected metabolic proteins were reduced in the xenograft model. HKII silencing reduced cell viability and glucose utilization, lowered cellular ATP, altered mitochondrial membrane potential, and increased markers of apoptosis and necroptosis. Conclusions: HKII-associated metabolism contributes to survival of lactate-acclimated MM cells, and apigenin affects this metabolic phenotype. Direct targeting of HKII by apigenin and the complete mitochondrial apoptotic pathway require further study.","tags":["恶性间皮瘤","HKII","芹菜素","糖酵解","凋亡/坏死性凋亡"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890477","pmid":"42890477","pmcid":"PMC13673248","doi":"10.3892/ol.2026.15894","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890477/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-18","journal_abbr":"Oncol Lett","journal_full":"Oncology letters","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Ivonescimab combined with radiotherapy in the treatment of advanced lung adenocarcinoma with high expression of PD-L1: A case report.","title_en":"Ivonescimab combined with radiotherapy in the treatment of advanced lung adenocarcinoma with high expression of PD-L1: A case report.","authors":"Zhou Q, Yang B, Cai H, Jiang J, Chen R","affiliation_highlight":"Department of Oncology, Affiliated Hospital of Qinghai University, Xining, Qinghai 810000, P.R.","results":"The optimal sequencing of immunotherapy and radiotherapy in non-small cell lung cancer (NSCLC) remains unclear. The present study reports a case of advanced lung adenocarcinoma (cT4N2bM1a, stage IVa) with a programmed de…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The optimal sequencing of immunotherapy and radiotherapy in non-small cell lung cancer (NSCLC) remains unclear. The present study reports a case of advanced lung adenocarcinoma (cT4N2bM1a, stage IVa) with a programmed death-ligand 1 (PD-L1) tumor proportion score of 90% and TP53 mutation. The patient received first-line ivonescimab monotherapy (900 mg, every 3 weeks) for four cycles, achieving a partial response (47% reduction per Response Evaluation Criteria in Solid Tumors 1.1). Sequential thoracic radiotherapy (5,000 cGy/25 fractions) was then administered for consolidation. Serum tumor markers (carcinoembryonic antigen, cancer antigen 125, cytokeratin 19 fragment and neuron-specific enolase) exhibited markedly decreased levels from baseline. Grade I radiation pneumonitis occurred post-radiotherapy but resolved rapidly with low-dose glucocorticoids. At the last follow-up (8 months), the patient remained progression-free with the Eastern Cooperative Oncology Group performance status improving from 2 to 0. This case provides real-world evidence for the 'immunotherapy induction followed by radiotherapy consolidation' strategy in an individual with high PD-L1 expression. The presence of TP53 mutation may predict an enhanced synergistic response to combined immunotherapy and radiotherapy, warranting further investigation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890310","pmid":"42890310","pmcid":"PMC13672758","doi":"10.1007/s13205-026-05099-x","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890310/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-18","journal_abbr":"3 Biotech","journal_full":"3 Biotech","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Integrated identification of CYP1A1 and CYP1B1 as potential drivers of smoking-related lung carcinogenesis.","title_en":"Integrated identification of CYP1A1 and CYP1B1 as potential drivers of smoking-related lung carcinogenesis.","authors":"Yu X, Yang R, Xu Y, Li L, He Z","affiliation_highlight":"Hunan Provincial Hospita
