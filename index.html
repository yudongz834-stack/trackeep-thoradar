 = 27; median follow-up, 40 months), IPTW-adjusted analyses showed significantly reduced surgical burden with taLE: shorter operative time (- 118.4 min, P < 0.001), lower postoperative pain (- 2.5, P < 0.001), earlier drain removal (- 5.1 days, P = 0.008), no permanent stoma (0/74 vs. 5/27), and lower odds of temporary stoma (OR 0.05, P < 0.001) and reoperation (OR 0.02, P = 0.009). These advantages remained largely consistent in the ≥ 5 cm subgroup. Only four recurrences occurred, with no significant RFS difference (log-rank P = 0.43); power was limited. CONCLUSIONS: taLE was associated with substantially reduced surgical burden in selected patients with lower rGIST, and no significant difference in recurrence-free survival was observed during available follow-up. However, with only four events, the study was underpowered to establish oncologic equivalence. The taLE-based organ-preserving pathway may represent a promising option pending confirmation in larger cohorts.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902002","pmid":"42902002","pmcid":"12038157","doi":"10.1093/bjs/znab473","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902002/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Early nationwide experience with robotic versus open lateral pancreaticojejunostomy for symptomatic wide-duct chronic pancreatitis.","title_en":"Early nationwide experience with robotic versus open lateral pancreaticojejunostomy for symptomatic wide-duct chronic pancreatitis.","authors":"Kilinc E, van Veldhuisen CL, Leseman CA, Boermeester MA, Bouwense SA, Daams F, Erdmann JI, Mieog JSD et al.","affiliation_highlight":"Amsterdam UMC, Location University of Amsterdam, Department of Surgery, Amsterdam, the Netherlands.","results":"BACKGROUND: Lateral pancreaticojejunostomy (LPJ) is the treatment of choice in patients with symptomatic wide-duct chronic pancreatitis and a normal-size pancreatic head. Adequate pain control in the first days after LPJ…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Lateral pancreaticojejunostomy (LPJ) is the treatment of choice in patients with symptomatic wide-duct chronic pancreatitis and a normal-size pancreatic head. Adequate pain control in the first days after LPJ via laparotomy is often challenging in these patients due to opioid tolerance resulting from chronic opioid use. Although a robotic approach may improve short-term outcome, comparative multicenter data on robotic versus open LPJ are lacking. METHODS: This nationwide multicenter retrospective cohort study included consecutive adults who underwent robotic or open LPJ for symptomatic wide-duct chronic pancreatitis in the Netherlands (2010-2025). Primary outcomes were hospital stay and major complications (Clavien-Dindo grade III or higher). RESULTS: Overall, 133 patients undergoing LPJ were included, of whom 36 (27%) robotic and 97 (73%) open LPJ. The robotic LPJ conversion rate was 0% (0/36). In the overall cohort, 90-day mortality was 0% (0/133) and median hospital stay was 2 days shorter after robotic LPJ (5 [IQR, 4-7] vs 7 [6-10] days; P < 0.001) compared with open LPJ, while the rate of major complications did not differ significantly between groups (36.1% [13/36] vs 26.8% [26/97]; P = 0.405). Blood loss was less with robotic LPJ (100 [IQR, 50-100] vs 300 [125-500] mL; P < 0.001), whereas operative time was comparable (275 [IQR 180-330] vs 232 [188-276] minutes; P = 0.210), and the rate of postoperative pancreatic fistula (POPF) grade B/C was higher (22.2% [8/36] vs 7.2% [7/97]; P = 0.034). The main findings of the overall cohort remained broadly consistent after propensity score matching. CONCLUSIONS: In this early nationwide experience, robotic LPJ was associated with shorter hospital stay compared with open LPJ. Although operative time and major complications did not differ significantly between groups, POPF occurred more frequently after robotic LPJ. The potential benefits of robotic LPJ and the possible learning curve effect should be further assessed in randomized trials in experienced centers.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊且明确陈述主要终点，直接影响可切除胸部肿瘤围术期/新辅助方案选择","curation_clinical_value":"阅读后可直接核对可切除胸部肿瘤围术期/新辅助方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902000","pmid":"42902000","pmcid":"10586983","doi":"10.1080/09546634.2018.1506080","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902000/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Bilateral R2 sympathetic surgery for craniofacial hyperhidrosis: a 10-year retrospective cohort study on long-term outcomes and development of a prognostic predictive model.","title_en":"Bilateral R2 sympathetic surgery for craniofacial hyperhidrosis: a 10-year retrospective cohort study on long-term outcomes and development of a prognostic predictive model.","authors":"Wang Z, Chen H, Lin M, Lin J, Du Q, Chen J","affiliation_highlight":"Department of Thoracic Surgery, The First Affiliated Hospital of Fujian Medical University, 20 Chazhong Road, Fuzhou, 35…","results":"OBJECTIVE: To evaluate the long-term efficacy and safety of bilateral R2 sympathetic surgery for CFH, to characterize the 10-year longitudinal trajectory of postoperative CH and recurrence, and to identify clinically acc…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To evaluate the long-term efficacy and safety of bilateral R2 sympathetic surgery for CFH, to characterize the 10-year longitudinal trajectory of postoperative CH and recurrence, and to identify clinically accessible predictors of CH and postoperative satisfaction that may assist in preoperative risk communication. Preliminary nomograms were developed and internally validated using the area under the curve (AUC), calibration plots, sensitivity, and specificity. MATERIALS AND METHODS: A total of 127 patients who underwent bilateral R2 sympathetic surgery for CFH between April 2013 and April 2023 were retrospectively analyzed. Baseline characteristics, operative details, and follow-up outcomes were extracted from medical records and structured telephone interviews. Predictive features were selected using least absolute shrinkage and selection operator (LASSO) regression. Cox proportional hazards and multivariate logistic regression models were subsequently applied to identify independent predictors of CH and satisfaction, respectively. Nomograms were developed and internally validated using the area under the receiver operating characteristic curve (AUC), calibration plots, sensitivity, and specificity. RESULTS: All patients achieved immediate resolution of craniofacial sweating, accompanied by a significant postoperative heart rate reduction (84.8 ± 11.68 → 72.17 ± 7.54 bpm, P < 0.001). Severe CH (grade IV) developed in 70.1% of patients, predominantly involving the thoracoabdominal (84.3%) and thigh (54.3%) regions. Cox regression identified preoperative heart rate > 79.5 bpm (HR = 2.46, 95% CI 1.61-3.75, P = 0.0002) and sympathetic clamping (HR = 5.69, 95% CI 3.03-10.67, P = 0.001) as independent risk factors for severe CH. Logistic regression showed that lower preoperative thoracoabdominal sweating was associated with higher postoperative satisfaction (OR = 0.05, 95% CI 0.01-0.23, P = 0.001). The nomograms demonstrated adequate discrimination and calibration. CONCLUSION: Bilateral R2 sympathetic surgery achieves rapid and durable relief of craniofacial hyperhidrosis with sustained high satisfaction over 10 years. Beyond confirming efficacy, the extended follow-up uniquely demonstrates that CH severity stabilizes within the first postoperative year and does not worsen over time-a critical finding for patient reassurance. Preoperative resting heart rate > 79.5 bpm and the use of sympathetic clamping independently predict severe CH, whereas lower baseline thoracoabdominal sweating predicts superior satisfaction. Although the proposed nomograms require external validation before routine adoption, they offer a practical, individualized reference for preoperative risk communication and, combined with the intraoperative choice of electrocautery, support a dual-phase strategy for optimizing surgical outcomes in CFH patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901819","pmid":"42901819","pmcid":"","doi":"10.1016/j.ebiom.2026.106511","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901819/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"EBioMedicine","journal_full":"eBioMedicine","tier":"A","if_val":11.2,"zone":"JCR Q1 · 1区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cerebrospinal fluid amyloid and neurodegeneration biomarkers in the diagnosis and prognosis of amyotrophic lateral sclerosis: a multicohort observational study.","title_en":"Cerebrospinal fluid amyloid and neurodegeneration biomarkers in the diagnosis and prognosis of amyotrophic lateral sclerosis: a multicohort observational study.","authors":"Obara K, Janelidze S, Ito D, Karlsson L, Yamamoto M, Mastrangelo A, Tran S, Tsujikawa K et al.","affiliation_highlight":"Clinical Memory Research Unit, Department of Clinical Sciences Malmö, Lund University, Lund, Sweden; Department of Neuro…","results":"BACKGROUND: Neurofilament light chain (NfL) is an established biomarker for amyotrophic lateral sclerosis (ALS). However, it remains unclear whether biomarkers reflecting amyloid-β metabolism (Aβ), tau (phosphorylated ta…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Neurofilament light chain (NfL) is an established biomarker for amyotrophic lateral sclerosis (ALS). However, it remains unclear whether biomarkers reflecting amyloid-β metabolism (Aβ), tau (phosphorylated tau, pTau), and astrogliosis (glial fibrillary acidic protein, GFAP) can complement NfL in clinical applications. It is also unclear how Alzheimer's disease (AD) co-pathology affects disease progression in ALS. METHODS: We studied 264 patients with ALS and 164 disease-control participants, analysing baseline cerebrospinal fluid (CSF) NfL, Aβ peptides, pTau181, pTau217, and GFAP. A two-step diagnostic strategy was examined in individuals with intermediate NfL values, using machine-learning models. Prognostic associations were evaluated using linear mixed-effects and Cox models adjusted for established predictors; survival was additionally examined in pooled analyses including an external ALS cohort (n = 153). FINDINGS: Patients with ALS exhibited higher CSF NfL, Aβ38, Aβ40, Aβ42, pTau181, and pTau217 than controls, even within Aβ-negative subgroups. NfL discriminated ALS from controls with an AUC of 0.85 (0.82-0.88), which increased to 0.90 (0.88-0.92) in machine-learning models incorporating additional biomarkers. The machine-learning models maintained a high positive predictive value (0.90) for classifying cases with intermediate NfL values. Significant Aβ × NfL interactions were observed for longitudinal functional decline, and pooled survival analyses showed stronger associations between NfL and survival in the Aβ-positive ALS subgroup (14%) than in the Aβ-negative ALS subgroup (HR 4.02 [2.17-7.45] vs 1.62 [1.36-1.92]). INTERPRETATION: Multiple biomarker assessments can reduce misclassification of individuals with intermediate NfL values. CSF Aβ positivity modified the association between baseline NfL and disease progression. Personalised diagnosis and prognosis based on fine-grained co-pathology evaluation may enhance clinical management of ALS. FUNDING: This study was primarily supported by JST SPRING (JPMJSP2125). A complete list of funding organisations is provided in Acknowledgements.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901931","pmid":"42901931","pmcid":"11977975","doi":"10.1023/A:1008809610703","nct_id":"NCT02497521","url":"https://pubmed.ncbi.nlm.nih.gov/42901931/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT02497521","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"NPJ Digit Med","journal_full":"npj Digital Medicine","tier":"A","if_val":18.0,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"MEDA-PKD: a dynamic, real-time analytics platform for precision care in autosomal dominant polycystic kidney disease.","title_en":"MEDA-PKD: a dynamic, real-time analytics platform for precision care in autosomal dominant polycystic kidney disease.","authors":"Grundmann F, Arjune S, Alkarkoukly S, Bartram MP, Beck BB, Benzing T, Boehm V, Bohl K et al.","affiliation_highlight":"Department II of Internal Medicine and Center for Molecular Medicine Cologne, University of Cologne, Faculty of Medicine…","results":"The use of medical real-world data is constrained by fragmented data infrastructures and the absence of tools integrating longitudinal clinical with molecular data at scale. Autosomal dominant polycystic kidney disease (…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The use of medical real-world data is constrained by fragmented data infrastructures and the absence of tools integrating longitudinal clinical with molecular data at scale. Autosomal dominant polycystic kidney disease (ADPKD), the most common monogenic cause of kidney failure, exemplifies this gap given its phenotypic complexity and the need for individualized treatment decisions. We present MEDA-PKD (MEdical DAta translation service of Polycystic Kidney Disease), an interactive, near-real-time analytics platform that integrates clinical routine with research data from the German AD(H)PKD Tolvaptan Registry (NCT02497521, DRKS00008910) into a harmonized database ( https://doi.org/10.18716/adpkd_registry ). MEDA-PKD provides automated near-real-time analysis and dynamic visualization, replacing traditional static approaches to clinical cohorts. As of March 2026, MEDA-PKD visualized data from 1735 patients (mean follow-up 796 days). eGFR slope analysis of data from patients initiating tolvaptan therapy (332 patients) demonstrates the platform's capacity to evaluate real-world therapeutic impact in real-time. Other tabs include family history, medication, lifestyle, quality of life and a wide array of lab values (20,894 entries). Besides, MEDA-PKD integrates proteomics data and allows for secure individual patient-level data access. MEDA-PKD represents a paradigm shift by transforming static cohort data into a living, actionable knowledge resource in ADPKD and will serve as a template for other diseases.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902330","pmid":"42902330","pmcid":"11773404","doi":"10.1177/00031348251339700","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902330/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"World J Emerg Surg","journal_full":"World Journal of Emergency Surgery","tier":"A","if_val":7.7,"zone":"JCR Q1 · 1区","warned":false,"study_type":"更新版系统评价与Meta分析（RCT＋比较性观察研究，随机效应模型，RoB 2/ROBINS-I/GRADE）","category":"surgery","category_label":"微创与无管化胸外科","score_total":46,"score_breakdown":{"clinical":13,"methodology":21,"specialty":4,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"总体人群（急诊剖腹术）","metric":"手术部位感染（SSI，主要终点）","val":"RR 0.53","stat":"95% CI 0.41–0.68; I²=68%","grounded":true,"checks":[{"num":"0.53","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.41","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.68","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"68%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"总体人群（急诊剖腹术）","metric":"手术部位感染（SSI，主要终点）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「总体」未在原摘要出现","人群限定「急诊剖腹术」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"预防性负压伤口治疗降低急诊剖腹术手术部位感染风险：更新系统评价与Meta分析（证据确定性极低）","title_en":"Negative pressure wound therapy for the prevention of surgical site complications in emergency laparotomies: an updated systematic review and meta-analysis.","authors":"Rey Chaves CE, Orozco Chamorro CM, Ramírez-Giraldo C, Pesce A, Blanco-Pulido JP, Gómez Garnica DG, Gutiérrez Segura JA","affiliation_highlight":"Pontificia Universidad Javeriana, Hospital Universitario San Ignacio, Bogotá, Colombia.","results":"主要终点SSI：NPWT组低于标准敷料组，RR 0.53（95% CI 0.41–0.68），异质性I²=68%。次要终点中，浅部与深部SSI、血清肿、切口裂开均有下降；器官/腔隙SSI、血肿、住院时间未见下降。敏感性分析与亚组分析显示效应方向一致。漏斗图不对称且Egger检验有统计学意义，提示小样本效应。","authors_conclusion":"在急诊剖腹术患者中，对闭合切口行预防性NPWT与较低的SSI及若干伤口相关并发症风险相关；但由于异质性、偏倚风险和小样本效应，证据确定性仍极低，需大型实用性多中心随机试验以明确获益幅度与最佳患者选择。","ai_note":"检索窗口仅覆盖2022年4月至2025年12月（作为前次综述的更新），早期研究依赖前版综述，检索策略与纳入重叠情况未在摘要中说明，信息不足；纳入23项研究中观察性研究占比不明，RoB 2/ROBINS-I评定结果未给出具体分布；主要终点为阳性，但作者同步强调GRADE极低确定性、I²=68%与小样本效应，摘要未报告各终点的事件率/基线风险，无法推算绝对风险差与NNT；'浅部与深部SSI、血清肿、切口裂开均下降'未列出具体数值与CI，且多重次要终点缺乏校正说明；对器官/腔隙SSI无效这一阴性结果被放在次要位置，需注意选择性强调；结论指向需RCT，与阳性点估计之间存在张力，属合理但需读者自行权衡。","pico":{"p":"成人急诊剖腹术患者；23项研究共5371例，其中NPWT组2528例","ic":"预防性负压伤口治疗（NPWT）施用于闭合切口 vs 标准术后敷料"},"reason":"为急诊剖腹术这一高感染风险人群的切口预防策略提供合并效应量基线，可用于设计腹部大手术/急诊开腹的切口管理路径与未来RCT样本量估算；对胸外科仅在外科部位感染预防与围手术期伤口管理层面具有间接参考价值。","abstract_en":"INTRODUCTION: Surgical site infections (SSIs) are common after emergency laparotomy and are associated with substantial morbidity, prolonged recovery, and increased health care costs. Negative pressure wound therapy (NPWT) has been increasingly used prophylactically on closed incisions in high-risk surgical patients; however, evidence supporting its effectiveness after emergency laparotomy remains heterogeneous. This updated systematic review and meta-analysis aimed to reassess the effectiveness of NPWT compared with standard postoperative dressings for the prevention of SSI and other wound-related complications following emergency laparotomy. MATERIALS AND METHODS: A systematic review and meta-analysis was conducted in accordance with the Cochrane Handbook and PRISMA 2020 guidelines. PubMed, Embase, Web of Science, Cochrane CENTRAL, and ClinicalTrials.gov were searched for studies published from April 2, 2022, to December 10, 2025, updating a prior review. Randomized clinical trials and comparative observational studies evaluating NPWT versus standard dressings in adult patients undergoing emergency laparotomy were included. The primary outcome was SSI. Secondary outcomes included superficial and deep SSI, wound dehiscence, seroma, hematoma, and length of hospital stay. Random-effects meta-analyses were performed. Risk of bias was assessed using RoB 2 and ROBINS-I, and certainty of evidence was evaluated with GRADE. RESULTS: Twenty-three studies involving 5371 patients were included, of whom 2528 received NPWT. NPWT was associated with a significantly lower risk of SSI compared with standard dressings (risk ratio, 0.53; 95% CI 0.41-0.68), with moderate to substantial heterogeneity (I² = 68%). NPWT was also associated with reductions in superficial and deep SSI, seroma formation, and wound dehiscence, but not with organ/space SSI, hematoma, or length of hospital stay. Sensitivity and subgroup analyses demonstrated consistent direction of effect. Funnel plot asymmetry and a significant Egger test suggested small-study effects. CONCLUSION: Among patients undergoing emergency laparotomy, prophylactic NPWT applied to closed incisions was associated with a lower risk of SSI and several wound-related complications compared with standard postoperative dressings. However, the certainty of evidence remains very low due to heterogeneity, risk of bias, and small-study effects, highlighting the need for large pragmatic multicenter randomized trials to better define the magnitude of benefit and optimal patient selection.","tags":["负压伤口治疗","手术部位感染","急诊剖腹术","系统评价/Meta分析","GRADE极低确定性"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902208","pmid":"42902208","pmcid":"6212360","doi":"10.1016/j.sjpain.2016.06.012","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902208/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-22","journal_abbr":"BMC Gastroenterol","journal_full":"BMC gastroenterology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"回顾性观察性研究 · 个性化体位管理组与常规左侧卧位对照组比较","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":46,"score_breakdown":{"clinical":20,"methodology":13,"specialty":13,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"个性化体位管理与老年食管癌患者镇静内镜检查低氧血症风险降低相关：回顾性观察研究","title_en":"Effectiveness of personalized positioning management in preventing hypoxemia during sedated endoscopy: a retrospective study.","authors":"Chen Y, Zhu J","affiliation_highlight":"Nursing Department, Sir Run Run Shaw Hospital, Zhejiang University School of Medicine, Hangzhou, China.","results":"","authors_conclusion":"Personalized positioning management effectively reduces both the incidence and severity of hypoxemia during sedated endoscopic examination in elderly patients with EC. This strategy demonstrates high clinical safety and feasibility.","ai_note":"回顾性观察设计，非随机，样本量小（每组67例）；摘要仅报告“显著降低/升高”，未给出低氧血症发生率、最低SpO₂、OR/95%CI/P值等具体效应量，无法评估效应大小；未说明“个性化体位管理”的具体组成和实施一致性；结论中“high clinical safety and feasibility”超出该回顾性摘要可支持的范围。","pico":{"p":"老年食管癌接受镇静胃镜检查的患者；干预组67例，对照组67例","ic":"个性化体位管理 vs 常规左侧卧位"},"reason":"为老年食管癌患者镇静胃镜的体位选择与低氧血症预防提供直接对照证据，可影响围检查期呼吸安全管理流程；但因回顾性设计且缺乏具体效应量，更适合作为前瞻性验证的假设来源。","abstract_en":"BACKGROUND: To investigate the preventive effects of personalized positioning management on hypoxemia during sedated endoscopic examination in elderly patients with esophageal cancer (EC). METHODS: A retrospective observational study was conducted. We retrospectively reviewed the medical records of elderly patients with esophageal cancer who underwent sedated gastroscopy between January 2023 and June 2024. Patients who received personalized positioning management were assigned to the intervention group (n = 67), while those who underwent conventional left lateral decubitus positioning were assigned to the control group (n = 67). The incidence of hypoxemia, lowest peripheral oxygen saturation (SpO₂), severe hypoxemic events, examination time, sedative dosage, comfort scores, and incidence of adverse events were compared between the two groups. Binary logistic regression analysis was performed to identify factors associated with hypoxemia. RESULTS: In the intervention group, the incidence of hypoxemia was significantly lower; the lowest SpO₂ was distinctly higher; and the incidences of severe hypoxemia and hypoxemic events requiring intervention were lower. Personalized positioning management was identified as an independent protective factor against hypoxemia. A higher American Society of Anesthesiologists physical status classification (Class III) was an independent risk factor for hypoxemia. The intervention group had a shorter examination time, lower propofol dosage, higher comfort scores, and a lower incidence of adverse events. CONCLUSION: Personalized positioning management effectively reduces both the incidence and severity of hypoxemia during sedated endoscopic examination in elderly patients with EC. This strategy demonstrates high clinical safety and feasibility.","tags":["食管癌","镇静内镜","低氧血症","体位管理","回顾性研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42901437","pmid":"42901437","pmcid":"","doi":"10.1016/j.canlet.2026.218915","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901437/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cancer Lett","journal_full":"CANCER LETTERS","tier":"A","if_val":11.8,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Early transcriptional divergence and spatial remodeling toward immune activation and evasion shape lung adenocarcinoma precancer evolution.","title_en":"Early transcriptional divergence and spatial remodeling toward immune activation and evasion shape lung adenocarcinoma precancer evolution.","authors":"Li JR, Zhu B, Chi Y, Chen H, Chen P, Hemaych JV, Tian Y, Hu X et al.","affiliation_highlight":"Graduate Institute of Biomedical Sciences, College of Medicine, Chang Gung University, Taoyuan, Taiwan; Molecular Medici…","results":"Tumor heterogeneity is a universal feature of cancer and may arise as early as precancer stages during lung adenocarcinoma evolution, yet the emergence of aggressive transcriptional programs remains incompletely understo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Tumor heterogeneity is a universal feature of cancer and may arise as early as precancer stages during lung adenocarcinoma evolution, yet the emergence of aggressive transcriptional programs remains incompletely understood. Here, we integrated spatial transcriptomics with single-cell RNA sequencing to characterize inter- and intratumoral heterogeneity across hyperplasia, adenoma, and invasive adenocarcinoma (IAC) in a genetically engineered mouse model (129S4/Sv KrasLSL-G12D/+). Disease progression was accompanied by coordinated remodeling of epithelial, stromal, and immune compartments, along with dynamic changes in proliferation, immune response, and metabolic pathways. Notably, lesions of the same histological stage exhibited substantial transcriptional heterogeneity. By quantifying dedifferentiation states, we identified a subset of adenomas that had already diverged toward highly proliferative and metabolically active programs despite lacking invasive features. These lesions were further marked by early chromosome 6 amplification, whose corresponding human ortholog signature recapitulated aggressive proliferation-associated programs in early-stage human lung adenocarcinoma. Spatial analyses further revealed pronounced intratumoral heterogeneity within IAC, with tumor core regions showing increased proliferation and metabolism but reduced immune signaling compared to peripheral regions. In addition, immune checkpoint gene expression in T cells was transiently elevated at the hyperplasia stage, suggesting early immune modulation prior to overt malignancy. Together, these findings indicate that aggressive transcriptional divergence can emerge early during lung adenocarcinoma evolution and that spatial organization critically shapes tumor and immune programs before and after invasion.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42900988","pmid":"42900988","pmcid":"","doi":"10.1016/j.compmedimag.2026.102827","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900988/","notice_url":"","trial_url":"","pub_date":"2026-Oct-13","briefing_date":"2026-10-22","journal_abbr":"Comput Med Imaging Graph","journal_full":"COMPUTERIZED MEDICAL IMAGING AND GRAPHICS","tier":"A","if_val":5.5,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A review of Kolmogorov-Arnold networks for medical image analysis.","title_en":"A review of Kolmogorov-Arnold networks for medical image analysis.","authors":"Bai J, Cai Z, Yang R, Lekadir K, Li S","affiliation_highlight":"College of Information Science and Technology, Jinan University, Guangzhou, China.","results":"Kolmogorov-Arnold Networks (KANs) replace selected scalar weights or fixed activations with learnable univariate edge functions. We conducted a controlled retrospective evidence reconstruction and update of Crossref, Eur…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Kolmogorov-Arnold Networks (KANs) replace selected scalar weights or fixed activations with learnable univariate edge functions. We conducted a controlled retrospective evidence reconstruction and update of Crossref, Europe PMC, arXiv, and OpenAlex, supplemented by local full texts and citation tracking, for studies published from January 2024 to February 2026. After report-level screening and version consolidation, 138 independent medical-imaging studies met explicitly defined medical-imaging eligibility criteria (127 direct imaging inputs; 11 image-derived representations). Studies were classified by primary KAN placement - backbone, bottleneck/token, physics-informed or implicit representation, or task-specific head - and evaluated for task, modality, comparator, reported result, and evidence of a KAN-specific contribution. None met the strictest contribution-evidence standard of a complete resource-controlled factorial comparison; 48 provided moderate, 46 weak/compound, and 44 insufficient evidence for the independent KAN contribution. Whole-model results were favorable in 68 studies, mixed or trade-off in 30, unfavorable or without incremental gain in 4, and indeterminate or not comparable in 36; these labels do not isolate the effect of KAN. External validation, calibration, repeated-run stability, and deployment metrics were inconsistently reported. The evidence supports KAN chiefly as a task-dependent module for controlled testing within established convolutional, Transformer, state-space, or physics-informed pipelines, rather than as a generally superior replacement. Priorities include matched ablations, function-stability analysis, external-center evaluation, and standardized resource reporting.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42898679","pmid":"42898679","pmcid":"PMC10861597","doi":"10.34133/cancomm.0051","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42898679/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-22","journal_abbr":"Cancer Commun (Lond)","journal_full":"Cancer Communications","tier":"A","if_val":28.4,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Spatiotemporal Analysis of Molecular Continuity in Pathogenesis of Squamous Cell Carcinoma: From Normal Epithelium to Precancerous Lesions and Carcinoma.","title_en":"Spatiotemporal Analysis of Molecular Continuity in Pathogenesis of Squamous Cell Carcinoma: From Normal Epithelium to Precancerous Lesions and Carcinoma.","authors":"Lan L, Wang X, Jiang X, Lin X, Lai Y, Tan W, Zhang S, Lin D et al.","affiliation_highlight":"Department of Etiology and Carcinogenesis, National Cancer Center/National Clinical Research Center/Cancer Hospital, Chi…","results":"Squamous cell carcinomas (SCCs) develop from the stratified epithelia of the esophagus, head and neck, lung, and skin, providing a tractable model to investigate how altered epithelial fields progress toward invasive can…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Squamous cell carcinomas (SCCs) develop from the stratified epithelia of the esophagus, head and neck, lung, and skin, providing a tractable model to investigate how altered epithelial fields progress toward invasive cancer. Across SCC subtypes, evolution often begins before overt malignancy, with age- and exposure-associated mutant clones expanding within histologically normal epithelia. As lesions advance, early driver selection becomes coupled to copy number alterations, chromosomal instability, and epigenetic remodeling, whereas later stages are shaped by branching diversification, cellular plasticity, and regionally constrained selection. Despite tissue-specific differences, several recurrent principles emerge, including clonal expansion within mutated normal fields, transition bottlenecks marked by genome-scale instability, and the spatial organization of subclonal architecture and invasive-front states. In this review, we synthesize recent progress in the temporal ordering and spatial patterning of SCC evolution and discuss how genetic alterations, epigenetic remodeling, and tissue ecology jointly drive disease progression. We further highlight the implications for early interception, biomarker development, immune evasion, and evolution-informed prevention and therapy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901162","pmid":"42901162","pmcid":"","doi":"10.1016/j.chom.2026.09.018","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901162/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Cell Host Microbe","journal_full":"Cell Host Microbe","tier":"A","if_val":23.2,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Discovery of phage defense systems through component modularity networks.","title_en":"Discovery of phage defense systems through component modularity networks.","authors":"van den Berg DF, Costa AR, Esser JQ, Muralidharan A, van den Bossche H, Fierlier D, Fomenkov A, Wu R et al.","affiliation_highlight":"Department of Bionanoscience, Delft University of Technology, 2629 HZ Delft, Netherlands; Kavli Institute of Nanoscience…","results":"Phage defense systems in bacteria exhibit high degrees of modularity, with sensing, signal transmission, and effector enzymes frequently exchanged among phage defense gene clusters. In this study, we capitalize on this m…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Phage defense systems in bacteria exhibit high degrees of modularity, with sensing, signal transmission, and effector enzymes frequently exchanged among phage defense gene clusters. In this study, we capitalize on this modularity to discover phage defense systems by searching for defense-associated modules in new gene contexts across Pseudomonas aeruginosa genomes. This approach reveals a large and interconnected network of modular components distributed across diverse gene clusters. From over 500 candidate defense systems, we select five for experimental testing and validate three: Dionysus, a TerB-encoding system that interferes with early phage infection (EPI) vesicle formation by jumbo phages; Ophion, a radical S-adenosyl-L-methionine (SAM)-containing system that blocks progression from the EPI vesicle to the nucleus stage during jumbo phage infection; and Hercules, a tightly regulated restriction-modification (RM)-like system. Collectively, we demonstrate that leveraging the modular architecture of phage defense systems is an effective approach to their discovery.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902390","pmid":"42902390","pmcid":"10004578","doi":"10.19723/j.issn.1671-167X.2020.05.004","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902390/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"Epigenetics Chromatin","journal_full":"Epigenetics & Chromatin","tier":"A","if_val":4.4,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"ASH2L-mediated H3K4me3 methylation governs palatal development by regulating WNT5B.","title_en":"ASH2L-mediated H3K4me3 methylation governs palatal development by regulating WNT5B.","authors":"Ling Z, Zhu X, Tan X, Ma Z, Xie F, Wang J","affiliation_highlight":"Department of Pediatric Dentistry, Shanghai Ninth People's Hospital, Shanghai Jiao Tong University School of Medicine, S…","results":"BACKGROUND: Orofacial clefts, particularly cleft palate, are among the most common congenital anomalies, imposing substantial functional impairment and psychosocial burden on affected individuals. Emerging evidence impli…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Orofacial clefts, particularly cleft palate, are among the most common congenital anomalies, imposing substantial functional impairment and psychosocial burden on affected individuals. Emerging evidence implicates epigenetic modifications, especially histone lysine methylation, as critical regulators of embryonic development, yet their precise roles in palatogenesis remain poorly defined. The H3K4 methyltransferase complexes, which require the core subunit ASH2L for full enzymatic activity, govern transcriptional activation during development; however, whether ASH2L-mediated H3K4me3 deposition contributes to palatal morphogenesis is unknown. RESULTS: Here, we show that conditional deletion of Ash2l in Six2-positive palatal mesenchymal cells results in complete cleft palate in mice. Multi-omics analyses (RNA-seq and CUT&Tag-seq) reveal that Ash2l loss causes genome-wide reduction of H3K4me3 enrichment at key developmental genes, most notably Wnt5b, leading to their transcriptional downregulation. Functionally, Ash2l deficiency impairs proliferation and osteogenic differentiation of palatal mesenchymal cells, resulting in stunted palatal shelf growth and disrupted osteogenesis. Pharmacological activation of WNT signaling downstream of Wnt5b partially rescues these cellular defects, confirming the functional relevance of this axis. CONCLUSION: These findings establish ASH2L-mediated H3K4me3 as a critical epigenetic regulator of palatal development through WNT5B modulation, and identify potential therapeutic targets for cleft palate.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902023","pmid":"42902023","pmcid":"12209268","doi":"10.3389/fimmu.2025.1606311","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902023/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-22","journal_abbr":"Funct Integr Genomics","journal_full":"FUNCTIONAL & INTEGRATIVE GENOMICS","tier":"A","if_val":4.0,"zone":"JCR Q2 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Genome-wide identification and characterization of the PE/PPE gene family in Mycobacterium abscessus.","title_en":"Genome-wide identification and characterization of the PE/PPE gene family in Mycobacterium abscessus.","authors":"Gao P, Wang X, Xie L, Long Q","affiliation_highlight":"Key Laboratory of Molecular Biology for Infectious Diseases (Ministry of Education), Institute for Viral Hepatitis, Depa…","results":"Mycobacterium abscessus (Mab) is a rapidly growing non-tuberculous mycobacterium that causes opportunistic infections and exhibits extensive intrinsic antibiotic resistance. The proline-glutamate (PE) and proline-proline…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Mycobacterium abscessus (Mab) is a rapidly growing non-tuberculous mycobacterium that causes opportunistic infections and exhibits extensive intrinsic antibiotic resistance. The proline-glutamate (PE) and proline-proline-glutamate (PPE) protein families are mycobacteria-specific virulence factors implicated in immune modulation, antigenic variation, and persistence. While Mycobacterium tuberculosis (Mtb) harbors approximately 170 PE/PPE members, the repertoire of PE/PPE genes in Mab remains largely uncharacterized. Here, we performed a genome-wide survey of PE/PPE genes in Mab ATCC 19,977 and identified 18 candidate family members, representing a relatively small fraction of the genome compared with slow-growing mycobacteria. Most predicted proteins harbor canonical PE or PPE domains and display acidic physicochemical properties. Phylogenetic analysis resolved the proteins into three subfamilies: PE, PPE, and PE-PPE, revealing moderate structural diversity but limited family expansion. Motif and gene structure analyses supported the evolutionary conservation. Notably, no PE_polymorphic GC-rich repetitive sequence (PE_PGRS) or PPE_major polymorphic tandem repeat (PPE_MPTR) members were detected, suggesting lineage-specific genomic reduction relative to other pathogenic mycobacteria. AlphaFold predictions revealed conserved N-terminal folds and variable C-terminal regions, which may contribute to functional diversification. Subcellular localization predictions indicated that most proteins are extracellular. Synteny analysis revealed no detectable collinearity among these genes. Transcriptomic analyses revealed condition-dependent expression of PE/PPE genes during amoeba and macrophage infection and under artificial sputum medium and metal ion stress, suggesting roles in environmental adaptation and host interaction. This study provides the first systematic overview of PE/PPE gene repertoire in Mab and lays the groundwork for elucidating their roles in intracellular survival, host interaction, and antimicrobial resistance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902395","pmid":"42902395","pmcid":"7759461","doi":"10.6069/js1s-k435","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902395/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"Genome Biol","journal_full":"GENOME BIOLOGY","tier":"A","if_val":9.2,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Profiling protein post-translational modifications in plasma-derived extracellular vesicles as fingerprints for breast cancer subtypes.","title_en":"Profiling protein post-translational modifications in plasma-derived extracellular vesicles as fingerprints for breast cancer subtypes.","authors":"Hadisurya M, Aguilar HA, Chen IH, Xu M, Paez JS, Bisht R, Singh J, Lee ZC et al.","affiliation_highlight":"Department of Biochemistry, Purdue University, West Lafayette, IN, 47907, USA.","results":"BACKGROUND: Addressing tumor heterogeneity in breast cancer research is crucial, given the distinct subtypes like triple-negative, luminal A/B, and HER2, requiring precise differentiation for effective treatment. This st…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Addressing tumor heterogeneity in breast cancer research is crucial, given the distinct subtypes like triple-negative, luminal A/B, and HER2, requiring precise differentiation for effective treatment. This study introduces a non-invasive method by analyzing post-translationally modified proteins in plasma extracellular vesicles, which play a role in immune regulation and intercellular communication. Examining modifications like phosphorylation, acetylation and glycosylation in extracellular vesicles provides insights into breast cancer dynamics. One hundred and one plasma samples from luminal A/B breast cancer, triple-negative breast cancer and healthy individuals underwent discovery and validation experiments. RESULT: The study identified over 28,000 unique non-modified peptides, 5,000 phosphopeptides, 680 acetyl peptides and 1,300 glycopeptides that are successfully characterized. Bioinformatics analyses revealed significant overexpression of 815 non-modified proteins, 3,958 phosphopeptides, 352 acetyl peptides and 895 glycopeptides in luminal A/B breast cancer or triple-negative breast cancer subtypes. Phosphorylated and glycosylated PD-L1 peptides emerge as potential markers for breast cancer, regardless of subtype. Aligning the findings with literature and PAM50 gene signatures highlights markers correlated with lower survival rates. The study also reports 123 scheduled parallel reaction monitoring analyses, leveraging machine learning to pinpoint a panel of specific modification sites with high accuracy for subtype differentiation. CONCLUSIONS: This research reveals diagnostic markers and enhances understanding of the molecular landscape, contributing to more effective and personalized breast cancer diagnostics and treatments.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902375","pmid":"42902375","pmcid":"1079666","doi":"10.5152/tpd.2018.5701","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902375/","notice_url":"","trial_url":"","pub_date":"2026-Jul-24","briefing_date":"2026-10-22","journal_abbr":"J Transl Med","journal_full":"Journal of Translational Medicine","tier":"A","if_val":9.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Decoding the human milk virome: a comparative analysis of composition, colonization, and health impacts.","title_en":"Decoding the human milk virome: a comparative analysis of composition, colonization, and health impacts.","authors":"Yahia S, Murugesan S, Al Khodor S","affiliation_highlight":"Research Department, Sidra Medicine, Doha, Qatar.","results":"BACKGROUND: Breast milk (BM) is a complex biological system that not only delivers essential nutrition to the baby, but is also a rich collection of microorganisms, including bacteria, viruses and fungi. Dominated by bac…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Breast milk (BM) is a complex biological system that not only delivers essential nutrition to the baby, but is also a rich collection of microorganisms, including bacteria, viruses and fungi. Dominated by bacteriophages and eukaryotic viruses, the BM virome plays a role in shaping the infant gut microbiome composition, influencing immune development and long-term health outcomes. Emerging research confirms the vertical transmission of bacteriophages from the mother to her infant via breastfeeding, and the shared viral taxa suggest functional roles in modulating bacterial populations and maintaining gut homeostasis. Disruptions in this early life virome, driven by factors such as maternal health, mode of delivery, and geographic location, have been linked to dysbiosis and disease susceptibility for conditions ranging from inflammatory bowel disease to metabolic disorders. METHODS: A systematic literature search was conducted in NCBI/PUBMED and the European Nucleotide Archive (ENA) using the keywords \"Milk virome,\" \"Milk phage,\" \"Milk phageome,\" and \"Milk metagenome\". After applying our inclusion and exclusion criteria, two studies remained. This comparative analysis explores the composition and diversity of the BM virome across two geographically distinct cohorts-Turkey and the United States-revealing significant differences in viral diversity and composition. RESULTS: The Turkish cohort exhibited a significantly higher viral richness and unique taxonomic distributions compared to the USA group. Notably, bacteriophage families like Myoviridae, Siphoviridae, and Podoviridae were shown to be abundant in both populations. The Turkish BM virome featured a higher prevalence of plant- and insect-derived viruses (e.g. Partitiviridae, Tospoviridae), likely tied to dietary or regional agricultural practices. CONCLUSIONS: Despite limitations related to sample size and methodological variability, this study emphasizes how dietary habits, environmental exposures, and geographic location may shape the breast milk virome. Further research integrating longitudinal data from a multi-ethnic population, cohorts is essential to fully harness the diagnostic and therapeutic potential of the human milk virome.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902263","pmid":"42902263","pmcid":"9724404","doi":"10.1186/s12885-022-10263-6","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902263/","notice_url":"","trial_url":"","pub_date":"2026-Jul-25","briefing_date":"2026-10-22","journal_abbr":"Respir Res","journal_full":"RESPIRATORY RESEARCH","tier":"A","if_val":5.7,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Deleted in lymphocytic leukemia 2 contributes to lung fibroblast activation and pulmonary fibrosis by interacting with and triggering focal adhesion kinase phosphorylation.","title_en":"Deleted in lymphocytic leukemia 2 contributes to lung fibroblast activation and pulmonary fibrosis by interacting with and triggering focal adhesion kinase phosphorylation.","authors":"Zhu H, Lan J, Wu X, Gao Y, Ran X, He R, Luo Z, Cheng Y et al.","affiliation_highlight":"Department of Respiratory and Critical Care Medicine, Guizhou Provincial People's Hospital, Guiyang, Guizhou, 550002, P.…","results":"The etiology of idiopathic pulmonary fibrosis (IPF) remains unknown, and therapeutic interventions are currently restricted. The activation of lung fibroblasts and the focal adhesion kinase (FAK) signaling pathway are cr…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The etiology of idiopathic pulmonary fibrosis (IPF) remains unknown, and therapeutic interventions are currently restricted. The activation of lung fibroblasts and the focal adhesion kinase (FAK) signaling pathway are crucial to the pathogenesis of IPF, yet the exact molecular mechanisms remain incompletely understood. Our study shows that the deleted in lymphocytic leukemia 2 (DLEU2) is elevated in the peripheral blood of patients with IPF, as well as in the lung tissues of mice with pulmonary fibrosis. Functional assays revealed that overexpression of DLEU2 facilitated fibrogenesis, whereas its suppression attenuated lung fibrosis in vivo and impeded fibroblast activation in vitro, predominantly through the regulation of FAK phosphorylation. Mechanistically, our findings reveal that DLEU2 regulates lung fibroblast activation by targeting miR-29a-3p. Conversely, inhibition of miR-29a-3p reversed the anti-fibrotic effects observed upon DLEU2 knockdown. Furthermore, DLEU2 was shown to directly interact with FAK, enhancing its phosphorylation and thereby facilitating fibrogenesis; inhibition of FAK phosphorylation counteracted the pro-fibrotic effects induced by DLEU2 overexpression. Taken together, these findings clarify the function of DLEU2 in facilitating FAK phosphorylation via its interactions with miR-29a-3p and FAK. The findings of this study suggest that DLEU2 may serve as a novel diagnostic biomarker and a potential therapeutic target for the treatment of IPF.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901832","pmid":"42901832","pmcid":"","doi":"10.1016/j.surg.2026.110720","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901832/","notice_url":"","trial_url":"","pub_date":"2026-Sep-28","briefing_date":"2026-10-22","journal_abbr":"Surgery","journal_full":"SURGERY","tier":"A","if_val":3.2,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Amplification of interferon-γ-driven proinflammatory macrophage responses by granulocyte-macrophage colony-stimulating factor: Implications for colorectal cancer immunotherapy.","title_en":"Amplification of interferon-γ-driven proinflammatory macrophage responses by granulocyte-macrophage colony-stimulating factor: Implications for colorectal cancer immunotherapy.","authors":"Dharmadhikari S, Beal RJ, Martinez B, Matheson PJ, Gable C, Sowers M, Zhuang Z, Li Y et al.","affiliation_highlight":"Price Institute of Surgical Research, Hiram C.","results":"BACKGROUND: Tumor-associated macrophages in colorectal cancer predominantly exhibit an immunosuppressive M2 phenotype that contributes to tumor progression and resistance to immune checkpoint inhibition. Repolarizing M2 …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Tumor-associated macrophages in colorectal cancer predominantly exhibit an immunosuppressive M2 phenotype that contributes to tumor progression and resistance to immune checkpoint inhibition. Repolarizing M2 macrophages toward a proinflammatory M1 phenotype represents a promising immunotherapeutic strategy. While interferon-γ promotes M1 macrophage activation, the effect of combining interferon-γ with granulocyte-macrophage colony-stimulating factor remains underexplored. METHODS: THP-1-derived M2-like macrophages were treated with interferon-γ (0-500 ng/mL) and granulocyte-macrophage colony-stimulating factor (0-1,000 ng/mL) in a dose-matrix experiment (n = 4). M1 and M2 markers and programmed cell death-ligand 1 were quantified by quantitative real-time polymerase chain reaction at 24 hours. Secreted interleukin-6, tumor necrosis factor-α, and interleukin-10 were measured by enzyme-linked immunosorbent assay. HT-29 colorectal cancer cells were treated with macrophage-conditioned media and assessed for E-cadherin, N-cadherin, vimentin, and Ki-67. Statistical analyses included t tests and analysis of variance. RESULTS: Interferon-γ strongly induced M1 gene expression, whereas granulocyte-macrophage colony-stimulating factor alone demonstrated modest effects. Combined interferon-γ (50 ng/mL) and granulocyte-macrophage colony-stimulating factor (500 ng/mL) amplified interleukin-6, C-X-C motif chemokine ligand 10, and tumor necrosis factor-α gene expression 5.4-fold, 2.9-fold, and 3.1-fold, respectively, beyond interferon-γ alone. Two-way analysis of variance showed no significant interaction, suggesting additive rather than synergistic enhancement. Combination treatment increased the secretion of interleukin-6 and tumor necrosis factor-α and reduced interleukin-10. Conditioned media from combination-treated macrophages increased E-cadherin and reduced N-cadherin, vimentin, and Ki-67 in HT-29 cells. CONCLUSION: Granulocyte-macrophage colony-stimulating factor augments interferon-γ-driven proinflammatory macrophage responses with protein-level changes and functional effects on colorectal cancer cells. The resulting macrophage secretome was associated with a less mesenchymal, less proliferative colorectal cancer-cell phenotype. Concurrent programmed cell death-ligand 1 upregulation provides a preclinical rationale for evaluating cytokine-mediated macrophage reprogramming in combination with programmed cell death protein 1/programmed cell death-ligand 1 checkpoint blockade in colorectal cancer.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902001","pmid":"42902001","pmcid":"4320594","doi":"10.1186/s13049-015-0099-8","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902001/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Robotic emergency surgery in geriatric care.","title_en":"Robotic emergency surgery in geriatric care.","authors":"Hess T, Miles A, Nation R, Kemp Bohan P, Egodage T","affiliation_highlight":"Department of Surgery, Cooper University Hospital, Camden, NJ, 08103, USA.","results":"BACKGROUND: Older adults present unique challenges in emergency general surgery (EGS) due to increased comorbidities and frailty. While minimally invasive surgery (MIS), including laparoscopic (lap) and robotic technique…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Older adults present unique challenges in emergency general surgery (EGS) due to increased comorbidities and frailty. While minimally invasive surgery (MIS), including laparoscopic (lap) and robotic techniques, reduces perioperative morbidity, the role of minimally invasive EGS in geriatric patients remains unclear. This study compares outcomes for geriatric EGS patients following robotic, lap, and open procedures. We hypothesize that MIS approaches would improve perioperative outcomes in geriatric patients. METHODS: We conducted a retrospective analysis of the ACS-NSQIP database (2022-2023) including patients ≥65 years undergoing emergent or urgent intra-abdominal surgery. Operative approach was categorized as robotic, lap, or open. The primary outcome was severe complication, and secondary outcomes included length of stay (LOS), discharge disposition, and readmission. RESULTS: 58,940 patients were included: 1832 robotic, 30,137 lap, and 26,971 open. With robotic vs lap and open, operative time was shortest (82.5 vs 110 vs 96 min, p < 0.001), conversion to open was less frequent (6.2 vs 12.9%, p < 0.001), and LOS was shorter (4 vs 4 vs 8 days, p < 0.001). Readmission and reoperation were lowest following MIS (9.2 vs 7.9 vs 9.8%, and 3.7 vs 3.3% vs 7.6%, both p < 0.001). After propensity matching, robotic patients had higher ASA scores and more transfusions but lower rates of sepsis (2.6 vs 6.5%) and mortality (2.3 vs 2.7%) compared to the lap group (p < 0.001). Multivariable regression demonstrated decreased risk of severe complications for patients who underwent robotic surgery (p = 0.025) with no difference in operative time or LOS, and patients were more likely to be discharged home. CONCLUSIONS: Robotic EGS in geriatric patients is associated with fewer severe complications, lower conversion rates, shorter LOS, and favorable discharge disposition.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901999","pmid":"42901999","pmcid":"7800756","doi":"10.1370/afm.2632","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901999/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Surg Endosc","journal_full":"SURGICAL ENDOSCOPY AND OTHER INTERVENTIONAL TECHNIQUES","tier":"A","if_val":3.3,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Unmasking healthcare disparities: the underreporting of gender, race, and ethnicity data in high-impact factor minimally invasive surgery journals.","title_en":"Unmasking healthcare disparities: the underreporting of gender, race, and ethnicity data in high-impact factor minimally invasive surgery journals.","authors":"Chen-Goodspeed A, Ende V, Ma X, Khedr S, Merola S, Chao S","affiliation_highlight":"Department of Surgery, NewYork Presbyterian/Queens Hospital, 56-45 Main St, New York, NY, 11355, USA.","results":"BACKGROUND: Diverse representation in clinical research is essential for equitable healthcare. Despite mandates from organizations like the NIH and ICMJE, race and gender remain underreported in surgical research, raisin…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Diverse representation in clinical research is essential for equitable healthcare. Despite mandates from organizations like the NIH and ICMJE, race and gender remain underreported in surgical research, raising concerns about the generalizability of findings. This study examines demographic reporting trends in minimally invasive surgery (MIS) and advanced endoscopy publications before and after the onset of the COVID-19 pandemic. METHODS: A systematic review of Surgical Endoscopy, Journal of Robotic Surgery, and Surgical Innovation was conducted, analyzing articles published between January 1, 2018, and December 31, 2023. 472 studies were included. For each study, study type, journal, date, geographic origin, and reported demographic data were recorded. Reporting rates across time periods (pre- vs. post-March 2020), region of origin, study design, and journal were analyzed via Chi-square, Fisher's exact tests, and Cochran-Armitage trend tests. RESULTS: Of the 472 studies, 61.2% were randomized controlled trials, with geographic representation from Asia (37.7%), Europe (34.8%), and North America (22.3%). Only 21 North American studies (20 U.S., 1 Canada) reported race; no studies from Asia or Europe did so. Among U.S. studies, race reporting did not differ significantly pre- vs. post-COVID (22.2% vs. 21.8%; p = 0.25), nor did gender reporting (p = 0.07). Regional differences in U.S. race reporting were significant (p = 0.003), with the Midwest having the lowest rate. Post-2020, gender reporting was significantly higher in Asia (94.9%) compared to Europe (84.7%) and North America (80.9%) (p = 0.005). CONCLUSIONS: Demographics remain underreported in MIS and advanced endoscopy research, particularly outside North America. Despite increased attention to health equity during the COVID-19 pandemic, reporting practices have not significantly improved. Broader adoption of standardized demographic reporting is needed to ensure evidence-based surgical care for all populations.","tags":[],"curated":true,"curation_reason":"RCT/III 期证据发表于 A 级期刊，直接影响局晚/晚期治疗线序与方案选择","curation_clinical_value":"阅读后可直接核对局晚/晚期治疗线序与方案选择的现有依据是否需要更新","curation_research_value":"RCT/III 期设计可作为同类研究的对照与方法学参照","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42900704","pmid":"42900704","pmcid":"","doi":"10.1126/scisignal.adw4374","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42900704/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-22","journal_abbr":"Sci Signal","journal_full":"Sci Signal","tier":"A","if_val":7.0,"zone":"JCR Q1 · 1区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Improving optogenetic control over Gi/o-coupled receptor signaling by optimized GIRK channel expression.","title_en":"Improving optogenetic control over Gi/o-coupled receptor signaling by optimized GIRK channel expression.","authors":"Mücher B, Garrido-Charles A, Wietek J, Köhler I, Grömmke M, Frischmuth T, Cyganek L, Rost BR et al.","affiliation_highlight":"Department of Zoology and Neurobiology, Ruhr University Bochum, 44801 Bochum, Germany.","results":"Stimulation of G protein-coupled receptors (GPCRs) that couple to Gi/o leads to the activation of G protein-activated inward rectifier K+ (GIRK) channels and membrane hyperpolarization in excitable cells. GIRK channel av…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Stimulation of G protein-coupled receptors (GPCRs) that couple to Gi/o leads to the activation of G protein-activated inward rectifier K+ (GIRK) channels and membrane hyperpolarization in excitable cells. GIRK channel availability can determine the success of optogenetic silencing strategies based on Gi/o-coupled GPCRs. To selectively enhance Gi/o-mediated GIRK currents, we created expression cassettes that coupled the activity of a GIRK subunit to the light-activated Gi/o-coupled GPCRs Opn4L (an opsin also known as melanopsin), longwave-sensitive opsin Opn1, parapinopsin, or Opn7b. We used the GIRK1 F137S mutant because of its fast activation, generation of large currents, and formation of homomeric channels, which reduced the size of the expression cassette. We demonstrated that light-mediated activation of GIRK1F137S through the opsins induced robust GIRK currents in HEK293 cells, cardiomyocytes, and cerebellar Purkinje neurons. Moreover, coupling GIRK1F137S activation to the promiscuous Opn4L changed the net effect of G protein signaling from Gq/11-mediated excitation to Gi/o-mediated inhibition in cerebellar Purkinje neurons and cardiomyocytes. Thus, our tools optimize the use of GIRK activity in the optogenetic control of the Gi/o pathway in excitable cells.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42901998","pmid":"42901998","pmcid":"8283787","doi":"10.2147/BCTT.S554836","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42901998/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-22","journal_abbr":"Funct Integr Genomics","journal_full":"FUNCTIONAL & INTEGRATIVE GENOMICS","tier":"A","if_val":4.0,"zone":"JCR Q2 · 2区","warned":false,"study_type":"多组学观察性研究（孟德尔随机化 + 单细胞/空间转录组 + bulk转录组 + 组织芯片免疫荧光验证）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":12,"methodology":15,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"多组学整合（单细胞、空间转录组与孟德尔随机化）提示TRDMT1在T细胞中的表达与乳腺癌预后及免疫治疗反应相关","title_en":"A multi-omics study integrating single-cell transcriptomics, spatial transcriptomics, and mendelian randomization unveil the implication of TRDMT1 expression in T cells on the immunotherapeutic response and prognosis in breast cancer.","authors":"Li T, Huang C, Deng H, You Y, Jiang Y, Wang Z, Wang Q, Chen K et al.","affiliation_highlight":"Department of Breast Surgery, Quanzhou First Hospital Affiliated to Fujian Medical University, Quanzhou, Fujian, 362000,…","results":"","authors_conclusion":"We confirmed the immunotherapy predict value and prognostic value of measuring TRDMT1 levels in CD8+ T cells, provided insights into enhancing CD8+ T-cell function, and identified potential targets to improve breast cancer prognosis and immunotherapy. Our research may help guide breast cancer treatment decisions and provide a prognostic evaluation option for future breast cancer treatment.","ai_note":"摘要未给出任何效应量、95%CI或P值，无法核验孟德尔随机化因果推断及预后/免疫治疗预测价值；“confirmed”属过度表述。MR暴露为血eQTL、结局涉及乳腺癌易感性与预后，工具变量、多效性、样本重叠及预后GWAS定义信息不足。单细胞、空间转录组、bulk转录组与免疫荧光主要为相关性验证，缺独立外部队列及预测准确性指标（如AUC/C-index）。组织芯片120例的终点定义、随访与统计模型未交代。乳腺癌与胸外科/胸部肿瘤直接相关性有限。","pico":{"p":"乳腺癌患者（外周血单核细胞单细胞测序、原发乳腺癌单细胞测序及组织芯片120例）；健康对照","ic":"无干预；比较TRDMT1在T细胞/CD8+ T细胞中的表达水平及乳腺癌与健康对照差异，并评估其与预后和免疫治疗反应的关系"},"reason":"为乳腺癌免疫治疗相关生物标志物（TRDMT1/CD8+ T细胞）提供多组学假说框架；对胸外科直接临床判断影响有限，但可作为肿瘤免疫生物标志物研究设计与因果推断边界判断的参考。","abstract_en":"m5C, an important RNA modification, is closely associated with breast cancer; however, their causal relationship is unknown. We examined the relationship between m5C regulation and breast cancer. Genome-wide association study breast cancer data and expression quantitative trait loci of m5C regulatory factor genes in blood were collected. We explored the causal relationship among m5C regulatory genes, breast cancer susceptibility, and prognosis through Mendelian randomization. Single-cell RNA sequencing data from peripheral blood mononuclear cells of patients with breast cancer and healthy controls were used to determine the differential expression of key genes among different cellular subpopulations. The effects of these genes on specific cellular subpopulations were further explored in single-cell RNAseq data from primary breast cancer using cellular communication, metabolic and cellular function analyses and validated the findings using flow cytometry. We validated the prognostic value of specific cellular subpopulations expressing key genes and assessed the impact of antitumor immunity using spatial transcriptomics, bulk transcriptomics, and immunofluorescence analysis of tissue microarray (120 patients). Mendelian randomization analysis indicated that the expression of the m5C writer tRNA aspartate methyltransferase 1 (TRDMT1) in blood was associated with breast cancer prognosis. TRDMT1 expression in T cells was decreased in patients with breast cancer. TRDMT1 was closely related to T-cell function. Moreover, it may modulate the antitumor immune effects of CD8+ T cells by influencing cellular communication and metabolism, impacting the prognosis and immunotherapeutic response of patients with breast cancer. We confirmed the immunotherapy predict value and prognostic value of measuring TRDMT1 levels in CD8+ T cells, provided insights into enhancing CD8+ T-cell function, and identified potential targets to improve breast cancer prognosis and immunotherapy. Our research may help guide breast cancer treatment decisions and provide a prognostic evaluation option for future breast cancer treatment.","tags":["m5C","TRDMT1","乳腺癌","单细胞转录组","空间转录组","孟德尔随机化"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42902243","pmid":"42902243","pmcid":"PMC12121696","doi":"10.7759/cureus.83193","nct_id":"","url":"https://pubme
