opic thymoma and microthymoma are extremely rare microscopic thymic epithelial proliferations that are usually identified only by histopathological examination. Their relationship to thymic cysts and to each other remains poorly understood. A 54-year-old woman was referred to our institution after an anterior mediastinal lesion was incidentally detected on routine chest computed tomography (CT). Magnetic resonance imaging and fluorodeoxyglucose positron emission tomography/CT findings were consistent with a thymic cyst. Robot-assisted thoracoscopic resection of the cyst with the adjacent thymic tissue was performed for definitive diagnosis and treatment. Histopathological examination revealed a unilocular thymic cyst accompanied by two incidental microscopic thymic epithelial lesions within the adjacent thymic tissue: a 0.6-mm microscopic thymoma and a 2.0-mm Type A microthymoma. Based on their characteristic size and histological features, both lesions were diagnosed without additional immunohistochemical analysis. The postoperative course was uneventful, and the patient remains free of recurrence 18 months after surgery. To our knowledge, the coexistence of microscopic thymoma and Type A microthymoma adjacent to a thymic cyst is exceptionally rare. The close proximity and similar histological features of these lesions suggest that they may represent different stages within a continuous morphological spectrum of microscopic thymic epithelial proliferations rather than entirely distinct entities. Furthermore, this case highlights the potential value of careful pathological examination of thymic tissue adjacent to resected thymic cysts for detecting occult microscopic epithelial lesions and improving pathological assessment.","tags":["胸腺囊肿","微胸腺瘤","病例报告","机器人辅助胸外科手术","病理诊断"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923485","pmid":"42923485","pmcid":"PMC12374922","doi":"10.1159/cro/abzag029","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923485/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Case Rep Oncol","journal_full":"Case reports in oncology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"个案报告（单例，回顾性描述性）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":28,"score_breakdown":{"clinical":8,"methodology":6,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例","metric":"Ki-67增殖指数","val":"80%","stat":"","grounded":true,"checks":[{"num":"80%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"单例","metric":"AI一线治疗后最佳疗效","val":"部分缓解（PR）","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"单例","metric":"AI治疗后进展时间","val":"3个周期后","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"单例","metric":"含ICI方案（atezolizumab+卡铂+紫杉醇）客观缓解","val":"无客观缓解","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"单例","metric":"全身治疗开始至死亡总生存","val":"6个月","stat":"","grounded":true,"checks":[{"num":"6","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"单例","metric":"Ki-67增殖指数","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"AI一线治疗后最佳疗效","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"AI治疗后进展时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"含ICI方案（atezolizumab+卡铂+紫杉醇）客观缓解","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）"]},{"group":"单例","metric":"全身治疗开始至死亡总生存","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","终点指标词未在原摘要出现"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"多柔比星联合异环磷酰胺治疗伴气道梗阻的胸部SMARCA4缺陷未分化肿瘤：1例报告显示快速但短暂的瘤体缩小与症状缓解","title_en":"Tumor Shrinkage and Symptom Relief with Doxorubicin and Ifosfamide in Thoracic SMARCA4-Deficient Undifferentiated Tumor with Airway Obstruction: A Case Report.","authors":"Ueta R, Rikimaru Y, Eba S, Itakura Y, Okita A","affiliation_highlight":"Department of Medical Oncology, Japanese Red Cross Ishinomaki Hospital, Ishinomaki, Japan.","results":"AI方案后症状迅速缓解并达部分缓解；3个周期AI后临床进展，出现左侧肾上腺转移；后续atezolizumab+卡铂+紫杉醇无客观缓解；全身治疗开始后6个月死亡。","authors_conclusion":"本病例提示多柔比星联合异环磷酰胺或可在伴气道梗阻的胸部SMARCA4-UT中带来快速但短暂的肿瘤缩小与症状改善；当需要紧急减瘤以解除即将发生的气道受压时可考虑该方案。但早期诊断同样可能重要，因为含ICI的一线方案与胸部SMARCA4-UT临床结局改善相关。","ai_note":"单例报告无对照，疗效与症状缓解无法归因于AI方案本身（同期可能使用激素/支持治疗、气道干预未描述）；'部分缓解'与'症状缓解'的具体评价标准与影像学数据未在摘要给出；作者由1例部分缓解外推至'可考虑用于紧急减瘤'，并同时主张早期诊断以使用ICI方案，结论方向存在双向泛化倾向；AI方案的选择本身源于误诊为高级别肉瘤，属偶然性用药，不能作为方案优选证据。","pico":{"p":"1例52岁重度吸烟男性，胸部SMARCA4缺陷未分化肿瘤（BRG1表达完全缺失，Ki-67 80%，SMARCA4无义突变，TMB高），临床不可切除，因肿瘤快速进展导致严重呼吸困难与晕厥（气道外压）","ic":"一线多柔比星+异环磷酰胺（AI）方案化疗；后续atezolizumab+卡铂+紫杉醇（含ICI方案）"},"reason":"为不可切除胸部SMARCA4-UT这一罕见高侵袭性肿瘤提供了一线化疗（AI）快速减瘤以解除气道压迫的个案时间线与疗效-进展-死亡节点，同时提示含ICI方案的潜在价值与误诊风险，可作为该罕见病治疗决策与未来队列/注册研究设计的假设来源与对照基线参考。","abstract_en":"INTRODUCTION: Thoracic SMARCA4-deficient undifferentiated tumor (SMARCA4-UT) is a recently recognized, rare, and highly aggressive malignancy. No standard treatment has been established for unresectable disease, and the prognosis is generally poor. These tumors often grow rapidly, and bulky masses can cause clinically significant symptoms. CASE PRESENTATION: A 52-year-old man with a history of heavy smoking presented with chest and back pain. Imaging revealed a large mediastinal mass. A CT-guided biopsy demonstrated an undifferentiated neoplasm with complete loss of BRG1 (SMARCA4) expression, a high proliferative index (Ki-67 labeling index, 80%), and no evidence of specific lineage differentiation, findings consistent with SMARCA4-UT. Subsequent comprehensive genomic profiling revealed a SMARCA4 nonsense mutation and a high tumor mutational burden. The tumor was clinically unresectable and showed rapid progression, resulting in severe dyspnea and syncope due to marked extrinsic airway compression. Because a high-grade sarcoma was initially suspected before the final diagnosis of SMARCA4-UT was established, first-line doxorubicin plus ifosfamide (AI) therapy was administered, resulting in rapid symptomatic relief and a partial response. However, after three cycles of AI therapy, the disease progressed clinically with a left adrenal metastasis. Subsequent treatment with the immune checkpoint inhibitor (ICI) atezolizumab plus carboplatin and paclitaxel showed no objective response, and the patient died 6 months after the initiation of systemic therapy. CONCLUSION: This case suggests that doxorubicin plus ifosfamide may provide rapid but transient tumor shrinkage and symptomatic improvement in thoracic SMARCA4-UT with airway obstruction. This regimen may be considered when urgent tumor reduction is required to relieve impending airway compromise. However, early diagnosis may also be important because first-line ICI-containing regimens have been associated with improved clinical outcomes in thoracic SMARCA4-UT.","tags":["SMARCA4缺陷未分化肿瘤","个案报告","气道梗阻","多柔比星+异环磷酰胺","免疫检查点抑制剂","罕见胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921322","pmid":"42921322","pmcid":"PMC13694145","doi":"10.1055/s-0046-1827803","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921322/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Indian J Radiol Imaging","journal_full":"The Indian journal of radiology & imaging","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（非系统评价）· 影像AI概念、工作流与临床应用的综合性述评","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":28,"score_breakdown":{"clinical":10,"methodology":6,"specialty":12,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"人工智能在医学影像中的应用综述：印度视角下的放射诊断现状、AI素养缺口与本地化验证需求","title_en":"Artificial Intelligence in Medical Imaging: A Review of Radiodiagnosis in Indian Perspectives.","authors":"Das E, Mondal R, Dhor A, Basu T","affiliation_highlight":"Maulana Azad Medical CollegeNew DelhiIndia.","results":"","authors_conclusion":"AI literacy is no longer optional: the radiologist's role is not threatened by AI but transformed by it—from film reader to AI-augmented clinical imaging physician capable of extending world-class diagnostic care to underserved populations across India and globally.","ai_note":"叙述性综述，摘要未见系统检索策略、纳入排除标准、文献筛选流程或偏倚风险评估，无法判断证据覆盖是否完整、是否存在选择性引用。摘要核心为立场性论述与背景统计（950件FDA清关器械、约75%属放射领域、<30%放射科医师能批判性评价AI研究、<20%接受过正式AI培训、放射科医师与人口比1:50,000对比WHO建议1:10,000、印度占全球TB负担26%），这些数字均未标注来源与年份，属背景引用而非研究结果，不宜作为证据引用。表述上“validated-and in controlled settings superior-performance”将外部验证与受控条件下的优越性并置，易被读作临床效能已确立；对肺结节检测等应用的落地限制、假阳性/工作流影响与前瞻性对照证据未在摘要中交代。摘要亦未说明利益冲突与本综述的方法学质量，需回到全文核实检索时限与引用结构。","pico":{"p":"","ic":""},"reason":"为胸部影像AI（肺结节检测等）的临床引入提供一个宏观背景：提示器械清关数量与真实世界验证、使用者判读能力之间存在落差，可用于论证AI工具上线前需本地化验证与使用者培训；但作为叙述性综述，不能作为疗效或诊断准确性证据引用。","abstract_en":"Artificial intelligence (AI) has become the most transformative development in radiology since digital imaging, with deep learning algorithms demonstrating validated-and in controlled settings superior-performance across pulmonary nodule detection, breast cancer screening, tuberculosis (TB) triage, acute stroke identification, and glioma segmentation. Over 950 AI/machine learning-enabled medical devices have received clearance from the U.S. Food and Drug Administration as of 2024, ∼75% within radiology, yet a consequential knowledge gap persists: fewer than 30% of practising radiologists can critically evaluate an AI study and fewer than 20% have received formal AI training. This review addresses that gap by providing a clinically accessible account of core AI concepts, major neural network architectures-including convolutional neural networks, U-Net, generative adversarial networks, vision transformers, and foundation models-the complete model development and validation workflow, and validated clinical applications across all major imaging modalities. We give dedicated attention to the Indian context, where an acute radiologist deficit of 1:50,000 against the World Health Organization-recommended ratio of 1:10,000, a 26% share of the global TB burden, and heterogeneous imaging infrastructure make AI both urgently necessary and uniquely demanding of local validation; we discuss the Ayushman Bharat Digital Mission, federated learning, and the domestic ecosystem of Qure.ai, Niramai, and Sigtuple as structural enablers, as well as algorithmic bias, explainability, and regulatory frameworks. We conclude that AI literacy is no longer optional: the radiologist's role is not threatened by AI but transformed by it-from film reader to AI-augmented clinical imaging physician capable of extending world-class diagnostic care to underserved populations across India and globally.","tags":["AI影像","叙述性综述","肺结节检测","印度卫生体系","算法偏倚与监管","AI素养"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925904","pmid":"42925904","pmcid":"","doi":"10.1016/j.ijpharm.2026.127602","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925904/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"Int J Pharm","journal_full":"International journal of pharmaceutics","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前体外研究 · 纳米硼递送载体制备与细胞学评价","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":26,"score_breakdown":{"clinical":3,"methodology":11,"specialty":12,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"BSH@Alb纳米粒","metric":"包封效率","val":"93.1 ± 0.39%","stat":"","grounded":true,"checks":[{"num":"93.1","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.39%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"BSH@Alb纳米粒","metric":"载药量","val":"15.52 ± 0.41%","stat":"","grounded":true,"checks":[{"num":"15.52","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.41%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"BSH@Alb纳米粒","metric":"包封效率","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「纳米粒」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"BSH@Alb纳米粒","metric":"载药量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「纳米粒」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"白蛋白/BSH偶联纳米粒用于食管鳞癌BNCT的体外制备与细胞摄取评价","title_en":"Albumin/BSH-fused nanoparticle for boron neutron capture therapy of esophageal squamous cell carcinoma.","authors":"Qin HM, Cai RW, He YJ, Zhang J, Su XL, Kan YL, Li BS, Li X et al.","affiliation_highlight":"School of Pharmaceutical Sciences & Institute of Materia Medica, Department of Central Laboratory of Binzhou People's Ho…","results":"BSH@Alb包封效率93.1 ± 0.39%，载药量15.52 ± 0.41%；在水、PBS和血浆中稳定性良好；与原型BSH相比显著增强细胞内硼蓄积并显示可接受的细胞相容性（无具体数值及统计量）","authors_conclusion":"BSH@Alb作为一种安全有效的硼剂，具有均匀粒径、高包封率、高载药量和良好稳定性；显著增强细胞内硼蓄积且细胞相容性可接受，支持其作为BNCT有前景的硼递送候选物。","ai_note":"仅为体外制剂学与细胞摄取/相容性研究，未报告体内抑瘤、安全性、肿瘤靶向或实际中子照射下BNCT疗效；摘要以“安全有效”“有前景”表述超出所展示数据；缺乏样本量、统计比较数值及主要终点预设信息。","pico":{"p":"食管鳞状细胞癌（ESCC）相关细胞模型；样本量摘要未报告","ic":"白蛋白/BSH偶联纳米粒（BSH@Alb）对比原型BSH"},"reason":"为ESCC的BNCT硼递送载体早期开发提供体外制剂学与细胞摄取基线，尚不足以影响临床诊疗判断，但可作为后续体内外BNCT研究的对照参考。","abstract_en":"Esophageal squamous cell carcinoma (ESCC) is a highly aggressive malignant tumor which suffers from poor prognosis and limited therapeutic remedies. As a physiologically-oriented radiotherapy and highly tumor-specific modality, boron neutron capture therapy (BNCT) shows great potential for the treatment of ESCC. Since efficacy of BNCT is critically restricted to boron drugs, novel boron agents with satisfactory boron load and intracellular uptake are highly demanded. Herein, we developed a novel albumin/BSH-conjugated nanoparticle (BSH@Alb) as a safe and effective boron agent. It resulted BSH@Alb displayed uniform particle size, high encapsulation efficiency (93.1 ± 0.39%), loading capacity (15.52 ± 0.41%) and good stability in different solution (water, PBS and plasma). Collectively, BSH@Alb significantly enhanced intracellular boron accumulation and showed acceptable cytocompatibility in comparison with prototype BSH, supporting its potential value for BNCT therapy as a promising boron-delivery candidate.","tags":["食管鳞癌","硼中子俘获治疗","纳米递送","白蛋白","BSH"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925773","pmid":"42925773","pmcid":"","doi":"10.1016/j.mrfmmm.2026.111952","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925773/","notice_url":"","trial_url":"","pub_date":"2026-Oct-22","briefing_date":"2026-10-25","journal_abbr":"Mutat Res","journal_full":"Mutation research","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"生物信息学整合分析 · 公共数据集探索性研究（TCGA/GEO，非实验验证）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":26,"score_breakdown":{"clinical":5,"methodology":11,"specialty":10,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"BRCA2变异转移性乳腺癌与肺腺癌共享转录组特征的生物信息学分析：候选枢纽基因SERPINA1、PIGR、FGG和FCGBP","title_en":"Identification and characterization of shared transcriptomic signatures in BRCA2-mutated metastatic breast cancer and lung adenocarcinoma: An integrative bioinformatics approach.","authors":"Abid E, Bilal S, Shahid M, Farooq SMY","affiliation_highlight":"Department of Medical Lab Technology, Green International University, Lahore, Pakistan.","results":"SERPINA1、PIGR、FGG、FCGBP被识别为两类恶性肿瘤共有的候选枢纽基因；乳腺癌基因集与BRCA2-RAD51介导的同源重组受损相关，肺数据集具有肺泡II型（AT2）细胞及肺腺癌特异特征；SERPINA1和PIGR在乳腺癌中为显著标志物，FGG在LUAD中为显著标志物。","authors_conclusion":"BRCA2变异乳腺与肺肿瘤数据集存在部分重叠的上皮转录谱；这些观察为BRCA2改变队列中的关联，不能证明BRCA2功能障碍直接驱动所识别的转录改变；SERPINA1、PIGR、FGG和FCGBP为候选的组织依赖性生物标志物，需独立验证。","ai_note":"摘要未报告样本量、BRCA2变异定义、效应量或P值，所谓“显著标志物”无法量化核验；公共数据集整合分析易受组织来源、上皮成分比例及批次效应影响，且缺乏独立验证；乳腺癌与LUAD队列的转移状态及临床变量匹配信息不足。","pico":{"p":"BRCA2变异转移性乳腺癌与BRCA2变异肺腺癌的公共TCGA/GEO数据集；样本量未在摘要报告","ic":"干预：整合生物信息学流程（DEG、STRING/Cytoscape PPI、Metascape富集、UALCAN生存分析、DISEASES数据库验证）；对照：两类肿瘤数据集间的共享/差异转录组特征（无前瞻性对照）"},"reason":"为BRCA2变异肺腺癌的转录组研究提供候选枢纽基因与跨瘤种比较假设，但当前证据仅适合作为生物标志物探索和后续验证研究的背景参考，不足以影响临床决策。","abstract_en":"Breast cancer and lung adenocarcinoma (LUAD) are most prevalent forms of malignancies worldwide and are associated with BRCA2 variants. While BRCA2 pathogenic variants are well established in breast cancer, their transcriptional consequences in lung adenocarcinoma remain poorly characterized, and no study has directly compared the shared differentially expressed gene (DEG) signature between BRCA2-variant metastatic breast cancer and BRCA2-variant LUAD. In this study, we used an integrative bioinformatics approach to identify and characterize this shared transcriptomic profile using publicly available TCGA and GEO datasets accessed via cBioPortal. Top dysregulated genes were subjected to protein-protein interaction (PPI) analysis using STRING and Cytoscape (CytoHubba, MCC algorithm), functional enrichment through Metascape and survival analysis through UALCAN, with disease associations validated against the DISEASES database. SERPINA1, PIGR, FGG and FCGBP were identified as candidate hub genes, common in both types of malignancies. The breast cancer gene set was associated with impaired BRCA2-RAD51-mediated homologous recombination, and the lung dataset had strong signatures of alveolar type 2 (AT2) cells and signatures specific to lung adenocarcinoma (LUAD). SERPINA1 and PIGR were significant markers in breast cancer and FGG was significant marker in LUAD. The findings identify a partially overlapping epithelial transcriptional profile associated with BRCA2-variant breast and lung tumor datasets. However, these observations represent associations within BRCA2-altered cohorts and do not establish that BRCA2 dysfunction directly drives the identified transcriptional changes. SERPINA1, PIGR, FGG, and FCGBP therefore represent candidate tissue-dependent biomarkers requiring independent validation.","tags":["BRCA2","肺腺癌","转录组","生物信息学","候选生物标志物"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924088","pmid":"42924088","pmcid":"PMC7712981","doi":"10.1159/cop/acaag008","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924088/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Case Rep Ophthalmol","journal_full":"Case reports in ophthalmology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"病例报告（单例）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":26,"score_breakdown":{"clinical":10,"methodology":4,"specialty":12,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"病例","metric":"年龄","val":"59岁","stat":"","grounded":true,"checks":[{"num":"59","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"治疗时序","metric":"奥希替尼开始至就诊时间","val":"12天","stat":"","grounded":true,"checks":[{"num":"12","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"随访","metric":"视网膜下液完全吸收时间","val":"2个月","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"病例","metric":"年龄","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"治疗时序","metric":"奥希替尼开始至就诊时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「治疗时序」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"随访","metric":"视网膜下液完全吸收时间","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"EGFR突变转移性NSCLC一线奥希替尼治疗后脉络膜转移灶快速消退1例","title_en":"Rapid Regression of Choroidal Metastasis under First-Line Osimertinib Therapy in Epidermal Growth Factor Receptor-Mutated Non-Small Cell Lung Cancer: A Case Report.","authors":"Hufnagel HJ, Zeitz O, Abdula F, Joussen AM, Zur Bonsen LS","affiliation_highlight":"Department of Ophthalmology, Charité - Universitätsmedizin Berlin, Corporate Member of Freie Universität Berlin and Humb…","results":"奥希替尼于就诊前12天开始；随访中视网膜下液早期减少，2个月随访时完全吸收，伴脉络膜病灶消退和视功能改善；无需局部眼部治疗。","authors_conclusion":"一线奥希替尼可能诱导EGFR突变NSCLC患者脉络膜转移灶快速消退；在部分选择病例中，系统靶向治疗的早期反应可能使局部眼部治疗得以避免。","ai_note":"单例病例报告，无对照，不能建立因果；‘快速消退’仅为描述性时序观察，摘要未提供病灶定量测量、EGFR具体突变亚型及系统疗效评价；存在选择性发表显著应答病例的可能。","pico":{"p":"1例59岁男性转移性EGFR突变NSCLC患者，伴左眼脉络膜转移及浆液性视网膜脱离","ic":"干预：一线奥希替尼；对照：无（自身前后观察）"},"reason":"提示EGFR突变NSCLC脉络膜转移可优先接受系统靶向治疗并观察，可能避免局部眼科干预；为晚期NSCLC罕见转移部位的管理提供低级别证据。","abstract_en":"INTRODUCTION: Choroidal metastases may cause substantial visual impairment in patients with metastatic non-small cell lung cancer (NSCLC). Although local ocular treatments are frequently considered, targeted systemic therapy may provide effective control in tumors harboring actionable mutations. We report the rapid regression of a choroidal metastasis following first-line osimertinib therapy in a patient with epidermal growth factor receptor (EGFR)-mutated NSCLC. CASE PRESENTATION: A 59-year-old man with metastatic EGFR-mutated NSCLC presented with progressive visual decline in the left eye. Ophthalmic examination revealed a peripapillary choroidal lesion associated with serous retinal detachment. Optical coherence tomography demonstrated subretinal fluid, consistent with a choroidal metastasis. First-line osimertinib therapy had been initiated 12 days before presentation at our clinic. An early reduction in subretinal fluid was observed during follow-up, followed by complete resolution at the 2-month follow-up. This was accompanied by regression of the choroidal lesion and improvement in visual function. No local ocular treatment was required. CONCLUSION: First-line osimertinib may induce rapid regression of choroidal metastases in patients with EGFR-mutated NSCLC. In selected cases, an early response to systemic targeted therapy may allow local ocular treatment to be avoided.","tags":["EGFR突变","奥希替尼","脉络膜转移","NSCLC","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923912","pmid":"42923912","pmcid":"PMC5873772","doi":"10.7759/cureus.118353","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923912/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例个案报告（Case Report）· 无对照、描述性","category":"surgery","category_label":"微创与无管化胸外科","score_total":26,"score_breakdown":{"clinical":8,"methodology":4,"specialty":14,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"单例病例","metric":"肺癌分期","val":"T1b N0 M0","stat":"","grounded":true,"checks":[],"missing_tokens":[]},{"group":"单例病例","metric":"TAVI至肺切除间隔","val":"7个月","stat":"","grounded":false,"checks":[{"num":"7","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["7"]},{"group":"单例病例","metric":"术后住院至出院时间","val":"第8天","stat":"","grounded":false,"checks":[{"num":"8","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["8"]},{"group":"单例病例","metric":"随访时间","val":"3个月","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":["7","8"],"semantic_passed":false,"semantic_audit":[{"group":"单例病例","metric":"肺癌分期","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"TAVI至肺切除间隔","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"术后住院至出院时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"单例病例","metric":"随访时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「单」无英文锚（词典未收录，宁误杀）","人群限定「病」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"82岁重度主动脉瓣狭窄患者先行TAVI、7个月后行肺癌切除术的单例个案报告：术后经过与3个月随访","title_en":"Transcatheter Aortic Valve Implantation Followed by Lung Cancer Resection in an Older Patient: A Case Report.","authors":"Khan L, Qadri SS","affiliation_highlight":"General Practice, West Rainton Surgery, County Durham and Darlington NHS Foundation Trust, Durham, GBR.","results":"患者82岁女性，肺癌分期T1b N0 M0；TAVI于肺切除前7个月实施；术后出现心房颤动与肺不张并接受处理，术后第8天出院；术后3个月随访状况良好。摘要未报告生存、病理、切缘或复发等肿瘤学结局数值。","authors_conclusion":"在评估手术风险、合并症与预后等因素后，先行TAVI处理瓣膜病变、再行肺癌切除是可接受的替代方案；本病例说明该干预顺序在高龄、手术风险增高人群中是合适的。","ai_note":"证据层级为单例个案，n=1，无对照，无法支持“可接受替代方案”的普适性结论；TAVI与肺切除间隔7个月为经验性安排，摘要未给出决策依据或风险量化评分（如STS-PROM/EuroSCORE）；未报告肺癌病理类型、分期路径（是否有病理确认）、切缘、淋巴结采样范围及复发/生存数据；术后房颤与肺不张的发生与处理细节不足；随访仅3个月，无法评估肿瘤学安全性。信息不足处如实标注。","pico":{"p":"1例82岁女性，偶然发现肺结节确诊肺癌，分期T1b N0 M0，合并需干预的重度主动脉瓣狭窄","ic":"先行经导管主动脉瓣植入（TAVI），7个月后行肺癌切除术；无对照组"},"reason":"为“重度主动脉瓣狭窄合并可切除非小细胞肺癌”这一常见临床难题提供一种时序安排（先TAVI、延期肺切除）的可行性案例，可作为胸外科—心内科多学科决策与个案/队列设计时的参考基线，但不构成疗效证据。","abstract_en":"The individual incidences of lung cancer and cardiovascular disease in the elderly population mean that there is a strong likelihood of both occurring simultaneously. Common practice for severe aortic stenosis (AS) would be surgical aortic valve replacement (AVR), unless deemed high-risk for this surgical procedure. Age and lung cancer both increase a patient's surgical risk; hence, the less invasive transcatheter aortic valve implantation (TAVI) to manage valve disease ahead of lung resection for lung cancer is an acceptable alternative after assessing other factors such as procedural risk, comorbidities, and prognosis. We present the case of an 82-year-old female patient who underwent a TAVI seven months before lung resection for an incidental diagnosis of lung cancer with staging T1b N0 M0. Postoperatively, she was treated for atrial fibrillation and lung collapse, then discharged after resolution of these complications on the eighth day after surgery, and remained well at follow-up three months later. This case report explores a situation when this sequence of interventions was appropriate due to increased surgical risk in the elderly population.","tags":["TAVI","肺癌切除术","高龄","主动脉瓣狭窄","个案报告","多学科决策"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926963","pmid":"42926963","pmcid":"PMC13695089","doi":"10.7759/cureus.116816","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926963/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-25","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单病例报告（case report）· 诊断与治疗经过描述","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":24,"score_breakdown":{"clinical":10,"methodology":5,"specialty":9,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"以濒临心脏压塞为首发表现最终诊断纵隔淋巴瘤：一例不典型心包积液与心脏压塞表现的病例报告","title_en":"First Presentation With Impending Cardiac Tamponade Leading to a New Diagnosis of Mediastinal Lymphoma: A Shared Learning Case on the Atypical Presentation of Pericardial Effusion and Cardiac Tamponade.","authors":"Israr S, Ilandari Dewa NS, Teo ME","affiliation_highlight":"General Medicine, Hinchingbrooke Hospital, Huntingdon, GBR.","results":"","authors_conclusion":"本病例提示应识别心脏压塞的不典型表现，并在出现不明原因心肺症状的年轻患者中考虑纵隔恶性肿瘤。","ai_note":"单例病例报告，无对照、无分母，不能推断发生率或诊断效能；“不典型表现”的强调基于个案，缺乏系统病例系列验证；摘要未给出任何可核查的数值型结果（如心包积液量、压力、缓解率），信息不足。","pico":{"p":"1例既往健康的28岁女性","ic":"急诊心包穿刺引流及后续免疫化疗；无对照组"},"reason":"提醒胸部肿瘤/胸外科在年轻患者不明原因心包积液或压塞时把纵隔恶性肿瘤纳入鉴别，并重视不典型压塞表现；仅为个案，不能改变常规决策。","abstract_en":"Cardiac tamponade is a life-threatening emergency classically associated with Beck's triad of hypotension, muffled heart sounds, and elevated jugular venous pressure; however, incomplete or atypical presentations may delay diagnosis. We report the case of a previously healthy 28-year-old woman who presented with progressive dyspnoea, pleuritic chest pain, orthopnoea, peripheral oedema, fever, and fatigue. Examination revealed mild tachycardia, soft heart sounds, reduced basal air entry, and ankle oedema, while the patient remained normotensive. Initial investigations demonstrated cardiomegaly with pleural effusions on chest radiograph, low-voltage QRS complexes on electrocardiogram, and markedly raised inflammatory markers. Computed tomography pulmonary angiography identified a large anterior mediastinal mass encasing the great vessels, a significant pericardial effusion with features of cardiac tamponade, and bilateral pleural effusions. Emergency pericardiocentesis resulted in immediate clinical improvement. Histopathological analysis confirmed high-grade B-cell lymphoma, most consistent with primary mediastinal B-cell lymphoma. The patient was treated with immunochemotherapy, achieving complete metabolic remission on end-of-treatment PET-CT. This case highlights the importance of recognising atypical presentations of cardiac tamponade and considering mediastinal malignancy in young patients presenting with unexplained cardiorespiratory symptoms.","tags":["纵隔淋巴瘤","心脏压塞","心包积液","病例报告","不典型表现"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925436","pmid":"42925436","pmcid":"","doi":"10.1093/jmcb/mjag045","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925436/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"J Mol Cell Biol","journal_full":"Journal of molecular cell biology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"基础研究 · 体外力学刺激+小鼠内皮特异性基因敲除的机制学实验","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":23,"score_breakdown":{"clinical":3,"methodology":18,"specialty":2,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Piezo1 诱导的内皮机械敏感转录因子 NR4A1 通过 PTGS2 抑制血小板活化与血栓形成（小鼠机制研究）","title_en":"Endothelial mechanosensitive transcription factor NR4A1 induced by Piezo1 modulates thrombosis via PTGS2.","authors":"Li X, Ye T, Miao S, Yu Y, Ying Y, Chen Z, Dai X, Teng P et al.","affiliation_highlight":"Life Sciences Institute, The MOE Key Laboratory of Biosystems Homeostasis & Protection, Zhejiang University, Hangzhou 31…","results":"","authors_conclusion":"These data establish the Piezo1/Ca2+/PKCδ/ERK/NR4A1/PTGS2 signaling cascade as a critical endothelial mechanotransduction pathway that senses physiological shear force to transcriptionally promote an antithrombotic state.","ai_note":"信息不足：摘要未给出任何效应量、置信区间或 P 值，仅以“greater thrombus weights and faster occlusion”定性描述体内表型，无法判断效应大小与统计稳健性；体内证据仅来自内皮特异性 Nr4a1 敲除小鼠，缺乏人类样本或临床验证；通路上下游（Ca2+/PKCδ/ERK/NR4A1/PTGS2）多为相关性/抑制剂推断，摘要未说明是否做回补或阻断实验；本研究属血管生物学机制研究，与胸部肿瘤临床问题无直接对应，归入 perioperative 仅为围手术期血栓机制层面的间接关联，存在主题错配。","pico":{"p":"内皮细胞（剪切应力刺激）与内皮细胞特异性 Nr4a1 敲除小鼠；摘要未报告样本量","ic":"干预：剪切应力/Piezo1-Ca2+-PKCδ-ERK 通路激活及内皮 Nr4a1 缺失；对照：未明确描述（推测为野生型/对照小鼠），摘要未说明"},"reason":"为“力学信号—内皮转录程序—血小板活化/血栓”轴提供机制层面的因果线索与小鼠体内表型基线，可供围手术期血栓形成机制或内皮功能相关科研选题参考；对胸部肿瘤的手术决策、随访或结节判断无直接影响。","abstract_en":"Endothelial dysfunction-induced platelet activation contributes to thrombosis in major cardiovascular diseases. Endothelial cells sense hemodynamic shear stress via the mechanosensitive ion channel Piezo1, which determines their physiological functions. However, the downstream transcriptional pathways of Piezo1 linking mechanical force to endothelial function remain incompletely defined. Here, nuclear receptor subfamily 4 group A member 1 (NR4A1) is identified as an endothelial mechanosensitive transcription factor induced by Piezo1 that modulates platelet activation and thrombosis. Mechanistically, shear stress is shown to activate Piezo1, resulting in calcium influx and the subsequent activation of protein kinase C δ (PKCδ), which activates extracellular signal-regulated kinase (ERK) to induce NR4A1 transcription. NR4A1 then upregulates prostaglandin-endoperoxide synthase 2 (PTGS2) expression, leading to the increased production of prostacyclin and inhibition of platelet activation and thrombosis. In vivo, mice with endothelial cell-specific deletion of Nr4a1 exhibit greater thrombus weights and faster occlusion. These data establish the Piezo1/Ca2+/PKCδ/ERK/NR4A1/PTGS2 signaling cascade as a critical endothelial mechanotransduction pathway that senses physiological shear force to transcriptionally promote an antithrombotic state.","tags":["Piezo1","NR4A1","PTGS2","内皮机械转导","血栓形成","基础研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921998","pmid":"42921998","pmcid":"PMC7596544","doi":"10.1007/s00394-004-0482-2","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921998/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"J Biochem Mol Toxicol","journal_full":"Journal of biochemical and molecular toxicology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"体外细胞机制研究 · A549 NSCLC细胞系","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":23,"score_breakdown":{"clinical":3,"methodology":12,"specialty":8,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"迷迭香酸通过抑制HSF1-HSP轴增强A549非小细胞肺癌细胞对轻度热疗的凋亡敏感性（体外机制研究）","title_en":"Disarming the Heat-Shock Response: Rosmarinic Acid Potentiates Mild Hyperthermia-Induced Apoptosis in A549 Non-Small Cell Lung Cancer Cells.","authors":"Ahn CR, Baek SH","affiliation_highlight":"College of Korean Medicine, Dongguk University, Goyang-si, Gyeonggi-do, Republic of Korea.","results":"","authors_conclusion":"RA增强热疗诱导的氧化应激并抑制A549细胞中的HSF1-HSP轴，为其作为热疗肺癌治疗中的生化辅助剂进一步开展临床前评估提供了依据。","ai_note":"仅为A549单细胞系体外研究，无动物或临床数据；摘要未报告样本量、重复次数、统计检验、效应量或P值；NAC rescue仅提示ROS相关，不能证明通路特异性；将“biochemical adjuvant in hyperthermic lung cancer therapy”外推至临床为时过早。","pico":{"p":"A549 非小细胞肺癌细胞（体外）","ic":"迷迭香酸（100或200 μM）联合轻度热疗（43°C，30 min）；并设NAC预处理 rescue 实验，摘要未详列全部对照"},"reason":"为肺癌热疗联合天然多酚的机制假说提供体外线索，但不直接影响手术、随访或结节风险等临床判断，主要可供实验研究设计参考。","abstract_en":"This study investigated the biochemical mechanisms by which rosmarinic acid (RA), a natural polyphenol, sensitizes A549 non-small cell lung cancer (NSCLC) cells to mild hyperthermia (43°C). A549 cells were treated with RA (100 or 200 μM) and exposed to mild hyperthermia (43°C, 30 min), after which we performed a comprehensive analysis of cell viability, clonogenic potential, and migratory recovery. The molecular underpinnings were explored through flow cytometry for reactive oxygen species (ROS) and cell cycle progression, together with western blotting for MAPK signaling (JNK, ERK), apoptosis-related proteins (Bcl-xL, survivin, caspases), and the heat-shock response (HSP27, 70, 90, and HSF1). Our results show that the combination of RA and hyperthermia impaired cell proliferation and migration while promoting S-phase accumulation and apoptosis. At the biochemical level, combined RA and hyperthermia increased intracellular ROS beyond the level produced by either treatment alone. This rise in ROS occurred alongside an altered p-JNK/total JNK profile and caspase activation-associated apoptosis. Importantly, RA suppressed the canonical heat-shock response, lowering the p-HSF1/total HSF1 ratio and reducing the expression of the molecular chaperones HSP27, 70, and 90. Pretreatment with N-acetylcysteine (NAC) attenuated the observed ROS, Annexin V, and immunoblot changes, consistent with a contribution of redox imbalance to this sensitization process. In conclusion, RA enhanced hyperthermia-induced oxidative stress and suppressed the HSF1-HSP axis in A549 cells, providing a rationale for its further preclinical evaluation as a biochemical adjuvant in hyperthermic lung cancer therapy.","tags":["NSCLC","A549","热疗","迷迭香酸","HSF1-HSP轴","体外研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42920849","pmid":"42920849","pmcid":"PMC10353527","doi":"10.1038/nature18300","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42920849/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-25","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"叙述性综述 · 非系统评价（无检索策略、无纳入排除标准、无定量合成，未报告任何原始疗效数值）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":22,"score_breakdown":{"clinical":8,"methodology":6,"specialty":8,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"治疗性mRNA癌症疫苗研究进展：以抗原-递送-免疫调节三元框架综述黑色素瘤、胰腺癌与NSCLC等实体瘤证据（无原始疗效数据）","title_en":"Progress on therapeutic mRNA vaccines for cancer.","authors":"Wu S, Liao H, Zhang W","affiliation_highlight":"Department of Pharmacy, Hubei Provincial Hospital of Traditional Chinese Medicine, Wuhan, China.","results":"","authors_conclusion":"未来研究应通过多抗原靶向、组织特异性递送工程与理性联合免疫治疗系统性优化三元设计，目标是使mRNA癌症疫苗成为标准治疗模式。","ai_note":"本文为综述而非原始研究：摘要未给出检索数据库、检索时间、纳入排除标准、筛选流程或偏倚评估，使用“systematically examines”缺乏系统评价方法学支撑，属措辞夸大。全文未报告任何可核验的疗效数值（ORR/OS/HR），却以“randomized trials with survival benefit”“clinically validated”作总体定性断言，无法溯源到具体试验与终点。结尾“standard-of-care modality”属倡议性表述而非证据结论。临床与科研判断所需信息不足。","pico":{"p":"","ic":""},"reason":"为胸部肿瘤领域mRNA疫苗（新抗原选择、LNP递送、与免疫检查点联合）提供背景框架与研究方向线索，但无数据可支撑方案选择或试验设计参数，仅可作选题与假设生成的参考读物。","abstract_en":"Therapeutic mRNA vaccines are a clinically validated cancer immunotherapy platform using in vitro transcribed mRNA encoding tumor antigens to induce durable anti-tumor immunity. Advances in mRNA engineering, lipid nanoparticle (LNP) delivery, and immunomodulatory combinations have propelled this approach from preclinical models to randomized trials with survival benefit. This review systematically examines vaccine efficacy through an antigen-delivery-immunomodulation tripartite framework. We trace the evolution from shared tumor-associated antigens to personalized neoantigens identified by computational pipelines, discuss ionizable lipid chemistry and LNP formulation for controlled tissue tropism and transfection, and analyze the bidirectional crosstalk between vaccine components and innate immune sensing that shapes adaptive T cell responses. Clinical evidence across melanoma, pancreatic cancer, non-small cell lung cancer, and other solid tumors is critically evaluated, alongside combination strategies-checkpoint blockade, oncolytic virotherapy, and adoptive cell therapy to overcome TME resistance. Persistent challenges include optimal neoantigen selection, standardized immune monitoring, and predictive biomarkers. We conclude that future research should prioritize systematic optimization of the tripartite design through multi-antigen targeting, tissue-specific delivery engineering, and rational combination immunotherapy, aiming to establish mRNA cancer vaccines as a standard-of-care modality.","tags":["mRNA疫苗","新抗原","LNP递送","免疫联合治疗","综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42923848","pmid":"42923848","pmcid":"PMC11391100","doi":"10.1016/j.vgie.2026.04.046","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923848/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-25","journal_abbr":"VideoGIE","journal_full":"VideoGIE : an official video journal of the American Society for Gastrointestinal Endoscopy","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告（VideoGIE 操作视频病例）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":21,"score_breakdown":{"clinical":10,"methodology":4,"specialty":7,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"食管鳞癌术后随访发现浅表咽部原位癌并经内镜黏膜下剥离术治疗的个案","title_en":"From endoscopic diagnosis to curative treatment: superficial pharyngeal cancer.","authors":"Nobre R, Fortes Y, Andrade de Paulo G, da Costa Martins B, Lenz L, Vaz Safatle-Ribeiro A, Maluf-Filho F","affiliation_highlight":"Endoscopy Department, Cancer Institute of the State of São Paulo, São Paulo, Brazil.","results":"病理证实为原位鳞状细胞癌，切缘阴性；患者恢复顺利，2天后出院；内镜随访见瘢痕性回缩，患者无症状","authors_conclusion":"对鳞状细胞癌高危患者，常规内镜检查应包含口腔和咽部的仔细检查，因为早期发现可能通过微创内镜技术实现治愈性治疗。","ai_note":"单例病例报告，无对照、无长期随访及复发/生存数据；由1例推断“高危患者常规咽部检查可治愈”属外推；主要展示操作可行性，不能评估筛查获益或治疗有效性；“高危”未在摘要中定义。","pico":{"p":"1例71岁男性，既往因食管鳞状细胞癌行食管次全切除术，随访内镜发现口咽后壁至下咽及右侧梨状窝浅表平坦病变，活检示高级别上皮内瘤变","ic":"内镜黏膜下剥离术（ESD）；无对照组"},"reason":"提示食管鳞癌术后患者上消化道及咽部监测可能发现可内镜切除的浅表病变，但单例证据不足以改变筛查路径或治疗决策，仅可为内镜监测研究提供假设。","abstract_en":"BACKGROUND AND AIMS: Superficial pharyngeal cancers are frequently missed during routine endoscopy and remain challenging to diagnose, even with image advances such as digital chromoendoscopy. Endoscopic submucosal dissection (ESD) has emerged as a minimally invasive, organ-preserving, therapeutic option. Pharyngeal ESD, however, requires awareness of specific anatomical and technical considerations, including narrower working space, thinner pharyngeal wall, proximity to vascular and neural structures, and the risk of airway impairment during the procedure. METHODS: A 71-year-old male patient had previously undergone subtotal esophagectomy for esophageal squamous cell carcinoma (SCC). On follow-up endoscopy, after examination of the oral cavity and pharynx, a subtle flat lesion with minimal erythema was identified on the posterior wall of the oropharynx, extending distally to the hypopharynx and right piriform sinus, mildly brownish on virtual chromoendoscopy with preserved loop-like vessels. Biopsy confirmed high-grade dysplasia, and ESD was performed. RESULTS: Histopathology confirmed in situ SCC with free margins. The patient recovered uneventfully and was discharged after 2 days. Endoscopic follow-up revealed cicatricial retraction, and the patient remained asymptomatic. CONCLUSIONS: Careful inspection of the oral cavity and pharynx should be incorporated into routine endoscopy in patients at high risk for SCC, because early detection may allow curative treatment with minimally invasive endoscopic technique.","tags":["浅表咽癌","内镜黏膜下剥离术","食管鳞癌术后随访","病例报告","内镜筛查"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42926214","pmid":"42926214","pmcid":"5330805","doi":"10.1158/2159-8290.CD-21-0316","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42926214/","notice_url":"","trial_url":"","pub_date":"2026-Aug-13","briefing_date":"2026-10-25","journal_abbr":"BMC Cancer","journal_full":"BMC CANCER","tier":"B","if_val":4.1,"zone":"JCR Q2 · 3区","warned":false,"study_type":"探索性单细胞转录组分析 · 3例腹膜后DDLPS病例","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":19,"score_breakdown":{"clinical":4,"methodology":11,"specialty":4,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"腹膜后DDLPS","metric":"样本量","val":"3","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"腹膜后DDLPS","metric":"样本量","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「腹膜后」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"单细胞分析提示去分化脂肪肉瘤中C3+恶性细胞亚群可能参与免疫调节并与Treg及巨噬细胞招募相关","title_en":"Single-cell analysis reveals the potential immunoregulatory role of C3 + malignant cell subpopulations in dedifferentiated liposarcoma.","authors":"Hu S, Dang Y, Tuo B, Liu S, Zhang Z, Gan L, Gao X, Xiao M et al.","affiliation_highlight":"Department of Colorectal Surgery, The First Affiliated Hospital of Zhengzhou University, Zhengzhou, Henan, 450052, China…","results":"","authors_conclusion":"Our findings provide new insights into the application of immunotherapy in sarcoma.","ai_note":"样本仅3例，属描述性、假说生成性研究；C3+恶性细胞经C3-C3aR1轴招募IL2RA+ Treg和SPP1+巨噬细胞的推断主要基于通路/表达关联，缺乏功能实验或独立队列验证；摘要未报告定量效应值、置信区间或P值；由DDLPS结果外推至“sarcoma immunotherapy”存在过度概括风险。","pico":{"p":"3例腹膜后去分化脂肪肉瘤（DDLPS）病例","ic":"单细胞测序分析肿瘤细胞与免疫微环境；无对照干预"},"reason":"为罕见腹膜后DDLPS的免疫微环境提供单细胞层面假说，提示C3+恶性细胞可能参与免疫抑制微环境构建；但样本量小且无功能验证，对胸外科临床决策的直接影响有限，主要可供肉瘤免疫转化研究参考。","abstract_en":"BACKGROUND: Dedifferentiated liposarcoma (DDLPS), a rare disease with limited research, exhibits resistance to radiotherapy and chemotherapy. Few reports have analyzed the tumor microenvironment of retroperitoneal undifferentiated liposarcoma using single-cell sequencing. METHODS: Single-cell analysis of three retroperitoneal DDLPS cases characterized the cellular and immune microenvironment. RESULTS: Our findings reveal significant heterogeneity among malignant cells in DDLPS, with chromosome 6 deletions being prevalent across malignant cell subpopulations and potentially linked to reduced immunogenicity based on pathway analyses. Notably, the coexistence of CD8 + T cell exhaustion and cytotoxicity reflects a continuum of exhaustion transition. Moreover, we identify a C3 + malignant cell subpopulation with ECM remodeling, angiogenesis, and activated complement pathway. Further exploration suggested that C3 + malignant cells may recruit IL2RA+ regulatory T cells and SPP1 + macrophages through the C3-C3aR1 axis. CONCLUSION: Our findings provide new insights into the application of immunotherapy in sarcoma.","tags":["单细胞测序","去分化脂肪肉瘤","肿瘤免疫微环境","C3+恶性细胞","调节性T细胞","巨噬细胞"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921712","pmid":"42921712","pmcid":"","doi":"10.1093/carcin/bgag080","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921712/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"Carcinogenesis","journal_full":"CARCINOGENESIS","tier":"B","if_val":3.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"临床前动物实验（C57BL/6 小鼠 4NQO 口腔癌模型）· 方案改良 + 化学预防干预研究","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":19,"score_breakdown":{"clinical":3,"methodology":14,"specialty":2,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":true,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"改良4NQO口腔致癌模型确立化学预防干预窗口，红茶多酚仅轻度影响肿瘤进展而不改变肿瘤发生率","title_en":"A modified 4NQO-induced oral carcinogenesis model defines a chemopreventive intervention window and reveals progression-modulatory effects of black tea polyphenols.","authors":"Anchan SS, Kohinkar PS, Bhandari YG, Gawde J, Adhvaryu VV, Rane S, Thorat R, Mahimkar MB et al.","affiliation_highlight":"Mahimkar Lab, Advanced Centre for Treatment, Research and Education in Cancer (ACTREC), Tata Memorial Centre (TMC), Khar…","results":"改良方案改善体重维持，未降低肿瘤发生率或进展；50 与 100 ppm 组间肿瘤负荷无显著差异；各致癌物处理组组织病理均见疾病谱系病变；化学预防组肿瘤发生率不变，10% 脱咖啡因提取物显著缩小肿瘤体积，茶红素仅为非显著趋势；分子分析（western blot、定性 IHC）无统计学显著差异。摘要未给出肿瘤体积/负荷的具体数值、CI 或 P 值。","authors_conclusion":"改良方案提供明确的干预窗口，解决持续致癌物暴露的局限；肿瘤体积下降而发生率不变提示其作用于肿瘤进展而非起始；改良 4NQO 模型为阶段特异性化学预防评估提供稳健平台，红茶多酚尤其是脱咖啡因提取物显示出温和的进展调控作用，值得进一步研究。","ai_note":"主要终点（肿瘤发生率）在化学预防部分为阴性，被突出的是体积这一次要/替代终点，且无具体数值与统计量呈现，存在选择性强调；分子分析全部无显著差异却以“directional changes”作正面表述；发生率“unchanged”与“reduced tumour volume”均缺样本量与检验效能说明；50 vs 100 ppm 无差异可能源于样本量不足，不能据此推断剂量等效；未报告随机化、盲法、统计方法与动物数量，属信息不足；“robust platform”为作者推断，未做与常规方案的正式统计比较；研究为口腔（头颈）模型，与胸部肿瘤无直接关联。","pico":{"p":"C57BL/6 小鼠 4NQO 诱导口腔鳞癌模型，分为常规与改良方案（50、100 ppm）及化学预防实验组；各组样本量摘要未报告","ic":"干预：改良 4NQO 方案（设无致癌物间歇）vs 常规方案；化学预防：红茶茶红素与脱咖啡因提取物（1.5%、10%）于致癌前及同期给药 vs 对照"},"reason":"与胸外科及胸部肿瘤临床决策几乎无直接关联；其可借鉴之处在于为化学预防类临床前研究提供模型设计范式，并示范“发生率 vs 肿瘤体积”终点选择与阴性主要终点解读的对照案例。","abstract_en":"The 4-nitroquinoline-1-oxide (4NQO) model closely recapitulates oral squamous cell carcinoma (OSCC) progression but is limited by cumulative toxicity in conventional protocols. This study aimed to develop a modified 4NQO regimen with defined carcinogen-free intervals and evaluate the chemopreventive potential of black tea-derived polyphenols. C57BL/6 mice were subjected to conventional and modified 4NQO regimens (50 and 100 ppm). Tumour incidence, multiplicity, and volume were assessed alongside histopathology. Systemic toxicity was monitored using body weight, fluid intake, and serum biochemistry. Chemoprevention was evaluated using thearubigins and decaffeinated extracts (1.5% and 10%) administered during pre- and concurrent intervention phases. Molecular analyses included western blotting and qualitative immunohistochemistry. The modified regimen improved body weight maintenance without compromising tumour incidence or progression. No significant differences in tumour burden were observed between the 50 and 100 ppm groups. Histopathological analysis confirmed the presence of lesions across the disease spectrum in all carcinogen-treated groups. In chemoprevention studies, tumour incidence remained unchanged; however, the 10% decaffeinated extract significantly reduced tumour volume, while thearubigins showed a non-significant trend. Molecular analyses revealed no statistically significant differences, though directional changes were observed. The modified protocol enables defined intervention windows, addressing limitations of continuous carcinogen exposure, and the reduction in tumour volume without changes in incidence suggests an effect on tumour progression rather than initiation. Collectively, the modified 4NQO model provides a robust platform for stage-specific chemoprevention evaluation, with black tea polyphenols, particularly decaffeinated extracts, demonstrating modest progression-modulating effects that warrant further investigation.","tags":["4NQO模型","口腔鳞癌","化学预防","红茶多酚","临床前研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42925478","pmid":"42925478","pmcid":"4838168","doi":"10.1016/j.tiv.2021.105138","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42925478/","notice_url":"","trial_url":"","pub_date":"2026-Oct-24","briefing_date":"2026-10-25","journal_abbr":"Cell Biochem Biophys","journal_full":"Cell biochemistry and biophysics","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"体外细胞实验（A549人肺癌细胞系）＋分子对接预测分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":18,"score_breakdown":{"clinical":4,"methodology":9,"specialty":5,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"A549人肺癌细胞","metric":"tCA 48 h IC50","val":"2.59 mM","stat":"","grounded":true,"checks":[{"num":"2.59","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"A549人肺癌细胞","metric":"tCA 48 h IC50","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「549」未在原摘要出现","人群限定「人」无英文锚（词典未收录，宁误杀）","人群限定「癌」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"反式肉桂酸在A549肺癌细胞中的体外抗增殖活性、凋亡/ER应激基因调控与分子对接预测（48 h IC50 2.59 mM）","title_en":"Anticancer Activity and Molecular Docking Analysis of Trans-Cinnamic Acid in Human Lung Cancer.","authors":"Dursun EN, Akçaalan S, Güneş CE, Şirin S, Dolanbay SN, Kurar E","affiliation_highlight":"Department of Medical Biology, Faculty of Medicine, Necmettin Erbakan University, Konya, Türkiye.","results":"tCA在A549细胞48 h的IC50=2.59 mM；其余终点（BAX、CASP3、CASP7、CASP8、CASP9、CYCS、FADD及PERK、CHOP表达上调，TAS下降、TOS升高，克隆形成受抑）仅报告“显著”变化，摘要未给出具体数值、CI或P值。","authors_conclusion":"tCA抑制A549细胞增殖与克隆形成，调控部分凋亡及ER应激相关基因，并改变氧化应激指标；这些体外结果为tCA的潜在抗癌活性提供初步证据，但仍需蛋白水平、功能学及体内研究证实其机制与治疗潜力。","ai_note":"单一细胞系、无体内/药代数据；IC50 2.59 mM远高于临床可及血药浓度，转化相关性存疑；凋亡/ER应激结论仅基于qRT-PCR基因表达，缺乏蛋白与功能验证；摘要正文称CASP3基因表达上调，而图注文字称caspase-3水平下降，二者矛盾；各终点仅报“显著”而无具体统计量，且未见多重比较校正说明；分子对接为预测性结果，不能支持因果机制。","pico":{"p":"A549人肺癌细胞（体外；无患者样本，重复次数与样本量未报告）","ic":"反式肉桂酸（tCA）处理 vs 未处理对照；除48 h IC50外，给药浓度梯度与处理时长未在摘要中说明"},"reason":"该研究为天然化合物在肺癌细胞系中的早期体外筛选，只能作为后续机制或药物开发研究的假设来源，不足以影响胸外科手术决策、结节风险评估或围术期治疗选择。","abstract_en":"Lung cancer is known to have a very high incidence and mortality rate. Trans-cinnamic acid (tCA) is a phenolic compound found in various fruits and vegetables and is known to have many effects such as antimicrobial, anti-inflammatory and anticancer. In this study, molecular docking analysis was performed to predict the binding affinities of tCA toward apoptosis- and ER stress-related target proteins. The effects of tCA on proliferation, apoptosis and endoplasmic reticulum (ER) stress gene expression, colony forming ability, total antioxidant status (TAS) and total oxidant status (TOS) in A549 human lung cancer cells were investigated. Cell proliferation and, expression levels of genes associated with apoptosis and ER stress determined using XTT and qRT-PCR, respectively. ELISA test was used for TAS, TOS and caspase-3 levels. Molecular docking analysis predicted favorable binding affinities of tCA toward the investigated target proteins. The IC50 value of tCA in A549 cells was found to be 2.59 mM at 48 h. Treatment with tCA significantly increased the expression of apoptosis genes including BAX, CASP3, CASP7, CASP8, CASP9, CYCS, and FADD. Among the ER stress-associated genes analyzed, only PERK and CHOP showed significant upregulation following tCA treatment, while no significant changes were observed in the remaining ER stress-related genes. Furthermore, tCA treatment caused a decrease in TAS level but an increase in TOS level. tCA suppressed the ability to form colonies in A549 cells according to the colony assay. In conclusion, tCA inhibited proliferation and colony formation, modulated selected apoptosis- and ER stress-related genes, and altered oxidative stress parameters in A549 cells. These in vitro findings provide preliminary evidence supporting the potential anticancer activity of tCA; however, further protein-level, functional, and in vivo studies are required to confirm the underlying mechanisms and therapeutic potential. The image outlines a study evaluating the anticancer effects of trans-cinnamic acid (tCA) on A549 lung cancer cells. Molecular docking analysis showed tCA has potential binding affinity to target proteins. In cell experiments, the IC50 of tCA was 2.59 mM at 48 h, determined by an XTT test. Treatment with tCA reduced TAS and caspase-3 levels while increasing TOS. RNA isolation and cDNA synthesis were followed by quantitative RT-PCR analysis, indicating that tCA may induce upregulation of ER stress and apoptotic markers in A549 cells. A colony assay demonstrated that tCA suppressed colony formation in these cells. ELISA assays for TAS, TOS, and caspase-3 were also performed as part of the analysis.","tags":["肺癌","A549细胞","体外研究","反式肉桂酸","分子对接","凋亡与ER应激"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42924896","pmid":"42924896","pmcid":"","doi":"10.1097/GCO.0000000000001158","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924896/","notice_url":"","trial_url":"","pub_date":"2026-Oct-26","briefing_date":"2026-10-25","journal_abbr":"Curr Opin Obstet Gynecol","journal_full":"Current opinion in obstetrics & gynecology","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（Curr Opin 系列专家综述）· RAS/MEK通路靶向治疗进展","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":16,"score_breakdown":{"clinical":6,"methodology":8,"specialty":2,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"综述：RAS通路靶向治疗在妇科肿瘤中的应用现状与方向（临床进展主要集中于低级别浆液性卵巢癌）","title_en":"Rat sarcoma inhibitors in and beyond gynecologic malignancies.","authors":"Dwabe S, Samaeekia R, Cristea M","affiliation_highlight":"Division of Hematology/Oncology, Department of Medicine, University of California, Irvine, California, USA.","results":"","authors_conclusion":"RAS通路靶向治疗需考虑肿瘤谱系、特定等位基因和功能通路依赖性；尽管妇科肿瘤的临床进展最主要见于低级别浆液性卵巢癌，新兴的非G12C疗法值得在各类妇科恶性肿瘤中进一步评估；新的联合方案与整合生物标志物对改善患者选择和克服治疗耐药是必要的。","ai_note":"全文为叙述性综述，未提供检索策略、纳入标准或证据分级；摘要中无任何疗效数值（ORR/PFS/OS及CI、P均缺失），无法量化评估；“demonstrating encouraging clinical responses, leading to accelerated approval for KRAS-mutant disease”未标注具体试验、药物与数据来源，属不可核验的结论性表述；对肺癌/结直肠癌经验的类比外推存在谱系差异风险；与胸部肿瘤临床决策的直接关联有限，信息不足处如实标注。","pico":{"p":"妇科恶性肿瘤患者，重点为复发低级别浆液性卵巢癌（叙述性综述，未报告样本量）","ic":"干预：直接RAS抑制剂（KRAS G12C、KRAS G12D、RAS(ON)多选择性抑制剂）、靶向蛋白降解剂、MEK抑制剂及RAF/MEK联合FAK抑制剂；对照：无（综述，无对照设置）"},"reason":"提供RAS通路靶向（G12C/G12D/RAS(ON)、MEK及RAF/MEK+FAK）跨瘤种研发格局与谱系依赖性思路，可作为胸部肿瘤KRAS抑制剂耐药与联合策略设计的背景参照，但对胸外科手术或围手术期决策无直接影响。","abstract_en":"PURPOSE OF REVIEW: Recent advances in direct rat sarcoma (RAS) inhibition and downstream pathway targeting have created novel therapeutic strategies which can be utilized in gynecologic oncology. This review examines RAS biology, lessons learned from other malignancies, and emerging strategies for gynecological malignancies. RECENT FINDINGS: KRAS G12C inhibitors in lung cancer established the clinical feasibility of direct RAS targeting, while colorectal cancer studies demonstrated the importance of lineage-specific combinations. KRAS G12D inhibitors, targeted protein degraders, and multiselective RAS(ON) inhibitors represent the next frontier in RAS inhibition, expanding therapeutic options across both gynecologic and nongynecologic tumors. In recurrent low-grade serous ovarian cancer, therapeutic advances have centered on inhibiting the downstream RAS-mitogen-activated protein kinase kinase (MEK)-extracellular signal-regulated kinase signaling pathway using MEK or combined RAF/MEK and focal adhesion kinase inhibitors, rather than direct RAS inhibition, demonstrating encouraging clinical responses, leading to accelerated approval for KRAS-mutant disease. SUMMARY: RAS-pathway directed therapy requires consideration of tumor lineage, specific alleles, and functional pathway dependence. Although clinical progress in gynecologic oncology is most relevant in low-grade serous ovarian cancer, emerging non-G12C therapies warrant further evaluation across gynecologic malignancies. Novel combinations and integrated biomarkers will be necessary to improve patient selection and overcome therapeutic resistance.","tags":["RAS通路","KRAS G12D","低级别浆液性卵巢癌","MEK抑制剂","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42923192","pmid":"42923192","pmcid":"PMC4878653","doi":"10.1210/jcemcr/luag325","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42923192/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-25","journal_abbr":"JCEM Case Rep","journal_full":"JCEM case reports","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单例病例报告 · 组织病理确诊的肿瘤-肿瘤转移","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":16,"score_breakdown":{"clinical":8,"methodology":5,"specialty":3,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"患者","metric":"年龄","val":"66岁","stat":"","grounded":true,"checks":[{"num":"66","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"鞍区肿块","metric":"缓慢增大时间","val":"2年","stat":"","grounded":true,"checks":[],"missing_tokens":[]}],"ungrounded_numbers":[],"semantic_passed":false,"semantic_audit":[{"group":"患者","metric":"年龄","population_ok":true,"metric_ok":false,"mismatch_reasons":["终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"鞍区肿块","metric":"缓慢增大时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「鞍区肿块」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"结直肠腺癌转移至促性腺激素型垂体腺瘤内：系统治疗控制下鞍区病灶仍缓慢增大的一例肿瘤-肿瘤转移","title_en":"Tumor-to-tumor metastasis of colorectal adenocarcinoma within a gonadotroph pituitary adenoma.","authors":"Murasawa S, Isozaki F, Fukasawa-Maeda M, Takayasu S, Inoshita N, Fujita Y","affiliation_highlight":"Department of Endocrinology and Metabolism, Hirosaki University Graduate School of Medicine, Hirosaki 036-8562, Japan.","results":"66岁男性；鞍区肿块疑似垂体腺瘤并缓慢增大2年；内分泌检查示前叶垂体功能减退、无精氨酸加压素缺乏；病理示促性腺激素型垂体腺瘤被结直肠腺癌浸润，两种成分广泛混合而非离散巢状；转移成分由存活肿瘤细胞组成，无坏死或明确治疗效应。","authors_conclusion":"本病例强调，即使全身治疗结果良好，垂体腺瘤内的转移瘤仍可能增大；因此，对于影像学提示垂体腺瘤的鞍区肿块，转移瘤应始终作为重要鉴别诊断。","ai_note":"单例病例报告，证据等级低，无法推断发生率或因果；‘extracranial disease was controlled’及‘favorable systemic therapy outcomes’未给出具体评估标准、持续时间或数值；肿瘤-肿瘤转移与碰撞瘤的区分主要依据组织学广泛混合模式，缺少更确定的分子/克隆证据；无随访结局；与胸部肿瘤临床决策直接相关性有限。","pico":{"p":"66岁男性，转移性乙状结肠腺癌患者，伴鞍区肿块缓慢增大2年（n=1）","ic":"modified FOLFOX6（5-FU、L-亚叶酸钙、奥沙利铂）联合panitumumab系统治疗；因鞍区病灶持续增大及诊断不确定行内镜经蝶手术；无对照"},"reason":"提示已知晚期结直肠癌患者的鞍区肿块需将转移至垂体腺瘤纳入鉴别，避免按良性垂体腺瘤延误诊断；对胸部肿瘤临床判断影响有限，但可作为罕见肿瘤-肿瘤转移及鞍区占位鉴别诊断的参考。","abstract_en":"Pituitary metastases are uncommon, and most cases originate from breast or lung cancer. Tumor-to-tumor metastasis, in which one neoplasm metastasizes into another, is particularly rare in the sellar region. We report a 66-year-old man with metastatic sigmoid colon adenocarcinoma treated with modified FOLFOX6 (5-fluorouracil, L-leucovorin, and oxaliplatin) plus panitumumab; extracranial disease was controlled, whereas a sellar mass initially suspected as a pituitary adenoma slowly enlarged over 2 years. Endocrine testing showed anterior hypopituitarism without arginine vasopressin deficiency. Endoscopic transsphenoidal surgery was performed for continued enlargement and diagnostic uncertainty. Histopathology demonstrated a gonadotroph pituitary adenoma infiltrated by colorectal adenocarcinoma, with extensive intermingling of the 2 components rather than discrete nests, favoring tumor-to-tumor metastasis over a collision tumor. The metastatic component consisted of viable tumor cells without necrosis or convincing treatment effect despite prolonged chemotherapy. This case underscores that metastatic tumor within a pituitary adenoma may enlarge despite favorable systemic therapy outcomes. Metastasis should therefore remain a key differential diagnosis for a sellar mass radiologically suggestive of a pituitary adenoma.","tags":["病例报告","肿瘤-肿瘤转移","垂体腺瘤","结直肠癌","鞍区肿块","经蝶手术"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921272","pmid":"42921272","pmcid":"PMC13693915","doi":"10.1002/mco2.71090","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921272/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-25","journal_abbr":"MedComm (2020)","journal_full":"MedComm","tier":"A","if_val":14.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"叙述性综述 · 跨病种机制与临床综合（摘要未报告系统检索策略、纳入标准或定量合成方法）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":13,"score_breakdown":{"clinical":0,"methodology":5,"specialty":0,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"神经退行性疾病跨病种综述：流行病学、危险因素、分类、病理生理、临床特征、诊断与治疗策略","title_en":"Neurodegenerative Diseases: Epidemiology, Risk Factors, Classification, Pathophysiology, Clinical Features, Diagnosis, and Therapeutic Strategies.","authors":"He Z, Zeng J, Wang G, Li Y, Zhang F","affiliation_highlight":"Key Laboratory of Basic Pharmacology of Ministry of Education and Joint International Research Laboratory of Ethnomedici…","results":"","authors_conclusion":"By distinguishing shared mechanisms from disease-specific abnormalities, we identify key translational gaps and explore how common biological disturbances may lead to distinct clinical trajectories. This cross-disease perspective may inform diagnostic reasoning, treatment development, and future comparative research.","ai_note":"该文研究对象为阿尔茨海默病、帕金森病、肌萎缩侧索硬化、亨廷顿病、额颞叶痴呆、Friedreich共济失调与多发性硬化，与胸部肿瘤/胸外科无任何人群、干预或终点重叠；六类目（perioperative/nodule/surgery/ai_digital/advanced/esophageal）均不适配，category 为被迫归类，不应据此视为胸部肿瘤证据。摘要为纯定性叙述，无样本量、无效应值、无P值或置信区间，无法进行任何定量核验；未说明文献检索时间范围、数据库、筛选流程与偏倚控制，属于观点整合而非可复现证据合成。作者对'共享机制可导向不同临床轨迹'的表述为假设性推演（may inform），摘要中未提供支持该推演的具体数据，存在以框架性叙事替代实证的风险。","pico":{"p":"","ic":""},"reason":"与胸部肿瘤临床及科研决策无关：不涉及肺结节风险判断、可切除NSCLC围术期方案、胸外科手术策略、AI/数字病理或食管癌管理，不能为任何胸部肿瘤判断提供依据，也不宜作为方法学或对照基线参考。","abstract_en":"Neurodegenerative diseases are a growing cause of disability worldwide, particularly as populations age. Although these disorders differ in etiology and clinical presentation, advances in genetics, neuropathology, and biomarker research have identified shared disturbances in protein homeostasis, mitochondrial function, and immune regulation. These processes may contribute to selective neuronal vulnerability and neural circuit dysfunction. These findings are refining disease classification and diagnosis, yet effective disease-modifying therapies remain limited. Disease-specific abnormalities remain essential to clinical interpretation and treatment selection. Existing reviews often focus on individual disorders or isolated mechanisms, leaving the links between shared biology and disease-specific phenotypes insufficiently clear. We synthesize evidence on the epidemiology, risk factors, classification, and pathophysiology of Alzheimer's disease, Parkinson's disease, amyotrophic lateral sclerosis, Huntington's disease, frontotemporal dementia, Friedreich's ataxia, and multiple sclerosis. We compare their clinical manifestations and diagnostic approaches, including the evolving role of biomarkers, and critically assess established and emerging therapies. By distinguishing shared mechanisms from disease-specific abnormalities, we identify key translational gaps and explore how common biological disturbances may lead to distinct clinical trajectories. This cross-disease perspective may inform diagnostic reasoning, treatment development, and future comparative research.","tags":["神经退行性疾病","叙述性综述","非胸部肿瘤","超出收录范围"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42924571","pmid":"42924571","pmcid":"","doi":"10.1177/08465371261493828","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42924571/","notice_url":"","trial_url":"","pub_date":"2026-Oct-23","briefing_date":"2026-10-25","journal_abbr":"Can Assoc Radiol J","journal_full":"CANADIAN ASSOCIATION OF RADIOLOGISTS JOURNAL-JOURNAL DE L ASSOCIATION CANADIENNE DES RADIOLOGISTES","tier":"B","if_val":4.0,"zone":"JCR Q1 · 3区","warned":false,"study_type":"叙述性综述/实施框架文章 · 非系统评价、无原始数据","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":9,"score_breakdown":{"clinical":3,"methodology":5,"specialty":1,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"便携式MRI的公平可及性取决于实施与筹资而非设备本身：一项部署框架综述","title_en":"Portable MRI and Equitable Access to Imaging: A Framework for Implementation and Sustainable Deployment.","authors":"Kamran R, Setia P, Choi J, Cecere M, Teutenberg M, Ni T, Mnatzakanian A, Jackman L et al.","affiliation_highlight":"Department of Medical Imaging, Temerty Faculty of Medicine, University of Toronto, ON, Canada.","results":"","authors_conclusion":"便携式MRI的公平影响与其说取决于设备，不如说取决于其如何实施和筹资；应将便携式MRI重新界定为社会技术干预，其公平获益取决于设备能力、实施与组织变革、可持续筹资三域的协同设计；并提出部署框架以支持放射科领导者和卫生系统。","ai_note":"本文为叙述性综述/框架文章，无原始数据、无系统检索与定量结局；“反向公平假说”及三域框架属作者论证，未经实证检验；对临床决策的直接证据不足。","pico":{"p":"","ic":""},"reason":"为便携式MRI在资源不均地区的实施与筹资提供概念框架，可用于影像可及性研究设计，但不直接改变胸部肿瘤临床判断。","abstract_en":"MRI is a reference-standard modality for an expanding range of clinical questions, yet it remains among the most unevenly distributed technologies in medicine. Portable low- and ultra-low-field MRI, compact permanent-magnet systems that operate without cryogens or need for in-room radiofrequency shielding, have been proposed as a means of extending imaging to settings where fixed scanners are unavailable or cannot be reached safely. A growing evidence base indicates that these systems can address a defined set of high-value clinical questions, including the detection of intracerebral hemorrhage and large ischemic infarcts, the assessment of hydrocephalus, and the monitoring of critically ill patients at the bedside. This article synthesises the technical basis, clinical applications, and equity implications of portable MRI and argues that the technology's equity impact depends less on the device than on how it is implemented and financed. Consistent with the inverse-equity hypothesis, an imaging technology introduced without deliberate design tends to reach advantaged populations first, and may transiently widen the disparities it is intended to reduce. Drawing on implementation science, change management, and financial reasoning, this article reframes portable MRI as a socio-technical intervention whose equitable benefit depends on the coordinated design of three domains: (1) device capability, (2) implementation and organizational change, and (3) sustainable financing matched to local context. The Canadian setting, including remote and Indigenous communities, is used to illustrate both the opportunity and the conditions required to realize the benefits of portable MRI. A deployment framework is proposed to support radiology leaders and health systems.","tags":["便携式MRI","健康公平","实施科学","影像可及性"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42921130","pmid":"42921130","pmcid":"PMC13693332","doi":"10.1016/j.ctro.2026.101324","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42921130/","notice_url":"","trial_url":"","pub_date":"2027-Jan","briefing_date":"2026-10-25","journal_abbr":"Clin Transl Radiat Oncol","journal_full":"Clinical and Translational Radiation Oncology","tier":"B","if_val":3.6,"zone":"JCR Q1 · 3区","warned":false,"study_type":"叙述性文献综述（非系统评价）· 专家推荐意见","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":9,"score_breakdown":{"clinical":3,"methodology":5,"specialty":1,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"低分次放疗时代乳腺近距离放疗补量的适用人群：GEC-ESTRO乳腺工作组叙述性文献综述与推荐","title_en":"The value of breast brachytherapy boost in the current era: a narrative literature review from the GEC-ESTRO breast cancer working group.","authors":"Montesinos IM, Konat-Bąska K, Guinot JL, Polgar C, Strnad V, Hannoun-Levi JM, Gutierrez C","affiliation_highlight":"Hospital Universitario de Navarra, Department of Radiation Oncology, Navarra, Spain.","results":"","authors_conclusion":"近距离放疗作为补量的使用已下降，尤其自整合式与超低分次方案引入以来；在当代乳腺癌治疗中，建议近距离放疗对经选择的高危患者仍是可选方案，因其可按风险体积实现剂量提升并保护周围危及器官。","ai_note":"叙述性综述而非系统评价：无检索流程图、无纳入排除清单、无偏倚风险评估、无定量合并，推荐强度缺乏分级方法学支撑；推荐的年龄/切缘阈值（<40岁、切缘阳性、<50岁合并高危因素）系对既有文献的归纳性专家意见，本综述未提供新的对照数据；“brachytherapy use has declined”无任何使用率数值支持，属未量化的断言；摘要中无任何主要/次要终点的效应量与P值，无法核验推荐依据；此外主题为乳腺癌放疗，与胸部肿瘤（肺/食管/胸壁外科）范围不符。","pico":{"p":"乳腺癌患者（依据1984—2025年检索到的112篇文献间接界定，未给出具体样本量）","ic":"干预：组织间插植近距离放疗补量（boost）；对照：其他补量技术（如同时整合补量SIB）、超低分次方案或不补量"},"reason":"主题为乳腺癌放疗补量技术选择，与胸外科及胸部肿瘤的临床判断几乎无交集；仅可作为了解“高龄/切缘阳性等高危亚组是否需剂量提升”这一放疗决策逻辑的背景材料，对胸部肿瘤科研选题与设计参考价值有限。","abstract_en":"PURPOSE: To identify patients who may benefit from an interstitial brachytherapy boost in the era of hypofractionation and widespread use of simultaneous integrated boost. MATERIAL AND METHODS: Between 1984 and 2025, 112 articles were identified through a narrative search of the PubMed, MEDLINE, and Cochrane databases using the keywords \"breast cancer\", \"boost\", \"interstitial brachytherapy\", and \"interventional radiotherapy\". Two main areas were addressed: an update on risk factors and patient selection, and a review of boost techniques, with an emphasis on interstitial brachytherapy and comparisons with other techniques. Based on this evidence, we formulated recommendations on the role of brachytherapy boost in contemporary breast cancer (BC) treatment. RESULTS: Based on the available literature, the addition of a boost should be strongly recommended for patients aged <40 years, patients with positive margins, and patients aged <50 years with at least one of the following features: high-grade disease, extensive intraductal carcinoma, and/or a triple-negative phenotype. In other scenarios, includ
