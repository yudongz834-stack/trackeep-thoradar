<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

n":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Postoperative pulmonary complications (PPCs) ranging from 30% to 50% have been recognized as a major threat to postoperative recovery. Current conventional interventions cannot effectively reduce the occurrence of PPCs. OBJECTIVE: In this study, we aimed to investigate the effects of multiple low-dose intranasal dexmedetomidine administration on PPCs in elderly patients. METHODS: In this double-blind, randomized, controlled trial, elderly patients were randomly assigned at a 1:1 ratio to receive multiple low-dose intranasal dexmedetomidine administration (MD group) or normal saline nasal spray (NS group). The primary outcome was the incidence of PPCs within 7 days after surgery. Key secondary outcomes included the severity grading and classification of PPCs. Other secondary outcomes included serum interleukin-6 (IL-6) and tumor necrosis factor-α (TNF-α) levels, Richards-Campbell sleep questionnaire (RCSQ) scores at predefined time points, and adverse reactions. RESULTS: A total of 190 patients were screened, and 186 completed the study. The incidence of PPCs was significantly lower in the MD group than in the NS group (9.68% vs. 22.58%, P = 0.017), with a risk ratio (RR) of 2.333 [95% confidence interval (CI): 1.173-6.317], absolute risk reduction (ARR) of 12.90%, and number needed to treat (NNT) of 7.75. Sensitivity analyses using the per-protocol population (PP) dataset yielded consistent results, confirming the stability and reliability of the primary outcome. The distribution of severity grading of PPCs also differed significantly between the groups (P = 0.036). After Bonferroni correction, the between-group difference in PPCs severity grading was not statistically significant (corrected P = 0.072). The distribution of pneumonia also differed significantly between the groups (P = 0.029). There were significant group effects, time effects, and interaction effects for IL-6, TNF-α, and RCSQ in the two groups after surgery (all P < 0.05). No significant between-group differences were observed in drug-related adverse events. CONCLUSION: Multiple low-dose intranasal dexmedetomidine administration significantly reduces the incidence of PPCs in elderly patients undergoing radical thoracoscopic lung-cancer resection with a favorable safety profile. CLINICAL TRIAL REGISTRATION: https://www.chictr.org.cn/showproj.html?proj=243165; identifier ChiCTR2400090593.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889180","pmid":"42889180","pmcid":"PMC13669195","doi":"10.3389/fmed.2026.1923698","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889180/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Med (Lausanne)","journal_full":"Frontiers in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Ciprofol versus propofol for general anesthesia during thoracoscopic surgery: a randomized double-blind trial.","title_en":"Ciprofol versus propofol for general anesthesia during thoracoscopic surgery: a randomized double-blind trial.","authors":"Wang Y, Geng Y, Yan Y, Gao X, Shi Q","affiliation_highlight":"Department of Anesthesiology, Fuyang Normal University Second Affiliated Hospital, Fuyang, Anhui, China.","results":"BACKGROUND: Ciprofol is a novel intravenous anesthetic with potentially improved hemodynamic stability and fewer injection-related adverse effects than propofol. This study compared ciprofol and propofol for general anes…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Ciprofol is a novel intravenous anesthetic with potentially improved hemodynamic stability and fewer injection-related adverse effects than propofol. This study compared ciprofol and propofol for general anesthesia in patients undergoing video-assisted thoracoscopic surgery (VATS). METHODS: In this prospective, randomized, double-blind trial, 120 adults undergoing elective thoracoscopic surgery were randomized to ciprofol (n = 60) or propofol (n = 60). MAP, HR, and BIS were assessed at eight predefined perioperative time points using linear mixed-effects models. The repeated binary outcome of BIS ≥60 was analyzed using a generalized linear mixed-effects model. Induction characteristics, injection pain, recovery profiles, and perioperative adverse events were also evaluated. RESULTS: MAP differed significantly between groups, with higher values in the ciprofol group at loss of consciousness and after tracheal intubation. HR was modestly higher at selected early time points, without a significant group-by-time interaction. BIS was higher with ciprofol during the early intraoperative period, and BIS ≥60 was more frequent at loss of consciousness (76.7% vs. 43.3%, p < 0.001), but not thereafter. Ciprofol was associated with shorter induction time (38.3 vs. 46.0 s, p < 0.001), less injection pain (5.0% vs. 20.0%, p = 0.025), and shorter PACU stay (48.0 vs. 55.7 min, p = 0.011). No significant differences were observed in supplemental anesthetic requirements, emergence time, or perioperative adverse events. CONCLUSIONS: Ciprofol showed a perioperative profile broadly comparable to propofol, with transient differences in hemodynamic parameters and higher BIS during the early intraoperative period. Ciprofol was associated with faster induction, less injection pain, and shorter PACU stay. Larger multicenter studies are warranted to confirm these findings. CLINICAL TRIAL REGISTRATION: https://www.chictr.org.cn/showproj.html?proj=203394, Identifier: ChiCTR2400082924.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42878810","pmid":"42878810","pmcid":"12367816","doi":"10.1007/s00330-024-11204-6","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42878810/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"Eur Radiol","journal_full":"EUROPEAN RADIOLOGY","tier":"A","if_val":6.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Low-dose vs standard-dose photon-counting CT for myopathy-associated interstitial lung disease: a prospective feasibility study.","title_en":"Low-dose vs standard-dose photon-counting CT for myopathy-associated interstitial lung disease: a prospective feasibility study.","authors":"Zhu Z, Xu K, Pang Y, Hu G, Nicodème L, Hofmanninger J, Han W, Röhrich S et al.","affiliation_highlight":"Department of Radiology, Peking Union Medical College Hospital, Chinese Academy of Medical Sciences and Peking Union Med…","results":"OBJECTIVES: To evaluate the clinical utility of photon counting computed tomography (PCCT)-derived quantitative parameters for assessing interstitial lung disease (ILD) burden in patients with inflammatory idiopathic myo…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: To evaluate the clinical utility of photon counting computed tomography (PCCT)-derived quantitative parameters for assessing interstitial lung disease (ILD) burden in patients with inflammatory idiopathic myopathy (IIM), comparing standard-dose (SD) and tin-filtered low-dose (LD) protocols, and to assess the added value of ultrathin reconstructions. MATERIALS AND METHODS: In this single-centre prospective study (September 2023-November 2024), outpatients with IIM-ILD underwent two consecutive PCCT scans. Quantitative ILD features were extracted using a commercial deep-learning software (ContextFlow ADVANCE Chest CT). Primary analyses compared LD 1.0 mm with SD 1.0 mm reconstructions using Bland-Altman analysis, with exploratory analyses of ultrathin (0.4 mm) reconstructions. Correlation analyses between deep learning-derived quantitative parameters, visual assessment, and pulmonary function tests were performed. RESULTS: Forty-eight adults with IIM-ILD (40 females; mean age, 53.88 ± 11.13 years) were included. The LD protocol achieved a substantial dose reduction (CTDIvol: 0.77 vs 5.40 mGy) while maintaining good agreement with SD (mean net differences [MNDs] < 1% for all patterns). LD-1.0 mm protocol yielded higher volume of ground-glass opacity (MND, 0.98%) and lower volume of fibrosis extent (MND, -0.64%). Reticular pattern showed strong association with FVC% (rhoSD1.0mm = -0.62, p < 0.001) and DLCO% (rhoSD1.0mm = -0.73, p < 0.001), with similar correlations observed under LD acquisition (Δrho ≤ 0.02). Ultrathin reconstructions yielded greater measurement of bronchiectasis (MND, 0.13% on SD scans). CONCLUSION: LD PCCT serves as a radiation-sparing alternative for quantitative disease assessment. Ultrathin reconstructions provide limited additional value. Future longitudinal studies are warranted to validate the performance of LD PCCT for disease monitoring. KEY POINTS: Question Can LD photon-counting CT provide robust quantitative assessment of ILD burden in patients with inflammatory myopathy compared with SD imaging? Findings Deep learning segmentation yielded LD ILD patterns that closely matched SD results, with all MNDs below 1%. Clinical relevance LD PCCT maintains quantitative robustness and physiological validity for IIM-ILD assessment, with total disease burden showing good agreement with the SD protocol, offering a radiation-sparing alternative without compromising CT-physiology correlation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective_matched","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42890422","pmid":"42890422","pmcid":"PMC13673135","doi":"10.1002/cai2.70082","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890422/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"Cancer Innov","journal_full":"Cancer innovation","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述（非系统综述）· KRAS G12C突变NSCLC治疗与耐药机制","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":47,"score_breakdown":{"clinical":18,"methodology":10,"specialty":19,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"KRAS G12C突变NSCLC的分子机制与治疗进展：机制导向全程管理综述","title_en":"Molecular Mechanisms and Therapeutic Advances in KRAS G12C-Mutant Non-Small Cell Lung Cancer: Toward Mechanism-Guided Longitudinal Management.","authors":"Wang H, Chen H, Li S, Zhao J","affiliation_highlight":"Department of Thoracic Medical Oncology Peking University Cancer Hospital Beijing China.","results":"","authors_conclusion":"总结KRAS G12C突变NSCLC的流行病学、分子生物学、诊断、治疗证据与耐药机制，区分随机或指南支持实践与早期转化信号，并提出结合PD-L1、TMB、STK11/KEAP1/TP53、TTF-1、脑转移和ctDNA的风险分层与机制导向管理框架；进展时应区分寡进展与系统进展，条件允许时行组织再活检及血浆检测。","ai_note":"叙述性综述，未说明系统检索、文献筛选或偏倚评估方法；所提风险分层/机制导向框架为作者整合，尚缺乏前瞻性验证；摘要未给出PFS/ORR/OS具体数值，无法核验效应量；将PFS/ORR获益与OS未一致转化并列，但未突出终点层级。","pico":{"p":"KRAS G12C突变NSCLC患者（综述；未报告样本量）","ic":"sotorasib、adagrasib等KRAS G12C抑制剂 vs 多西他赛（既往治疗后），并讨论联合及后线策略"},"reason":"为KRAS G12C突变晚期NSCLC的靶向治疗选择、耐药后再活检与ctDNA监测、以及生物标志物分层提供综述性框架，适合作为临床路径和后续研究设计的背景参考。","abstract_en":"KRAS G12C-mutant non-small cell lung cancer (NSCLC) has become a clinically actionable molecular subtype. Discovery of the switch-II pocket enabled the development of covalent KRAS G12C(OFF)-state inhibitors, transforming a historically \"undruggable\" target into a therapeutic vulnerability. Drugging KRAS, however, proved to be a problem of chemistry, whereas sustaining its inhibition has proved to be a problem of biology. KRAS G12C-mutant NSCLC is biologically heterogeneous, and the magnitude and durability of clinical benefit are shaped by co-mutations, the tumor microenvironment, brain metastases status, pharmacologic differences between agents, and the dynamic evolution of resistance. Randomized trials have demonstrated that sotorasib and adagrasib improve progression-free survival (PFS) and objective response rates (ORR) over docetaxel in previously treated disease, yet these gains have not translated consistently into a definitive overall survival (OS) advantage. This review synthesizes the epidemiology, molecular biology, diagnostic strategies, first- and later-line treatment evidence, resistance mechanisms, and emerging KRAS/RAS-directed approaches. We distinguish randomized or guideline-supported practice from early-phase and translational signals, and propose an implementable framework that combines PD-L1, tumor mutational burden, STK11/KEAP1/TP53 status, TTF-1 expression, brain metastases, and circulating tumor DNA (ctDNA) for risk stratification and mechanism-guided management. At disease progression, oligoprogression should be distinguished from systemic progression, and tissue re-biopsy together with plasma profiling should be considered when feasible. In China, several domestically developed KRAS G12C inhibitors have been approved, and reimbursement coverage is expanding; the cost of molecular testing, uneven institutional access, regional disparities and limited confirmatory and real-world evidence nonetheless continue to constrain implementation. Future priorities include randomized first-line comparisons, biomarker-defined combination strategies, improved central nervous system activity and mechanism-matched treatment after resistance.","tags":["KRAS G12C","NSCLC","靶向治疗","耐药","综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888178","pmid":"42888178","pmcid":"","doi":"10.1080/14712598.2026.2742404","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888178/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Expert Opin Biol Ther","journal_full":"Expert opinion on biological therapy","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性药物评价/综述（非系统评价；检索PubMed、ClinicalTrials.gov、会议及监管公告）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":44,"score_breakdown":{"clinical":17,"methodology":10,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"TROP2 ADC sac-TMT治疗NSCLC的药物评价：PFS改善但OS数据未成熟","title_en":"An evaluation of sacituzumab tirumotecan for the treatment of NSCLC.","authors":"Wang J, Zhou Y, Wu L","affiliation_highlight":"Department of Thoracic Oncology, The Affiliated Cancer Hospital of Xiangya School of Medicine, Central South University/…","results":"","authors_conclusion":"Randomized trials have demonstrated improved progression-free survival (PFS) with sac-TMT versus docetaxel and platinum-pemetrexed chemotherapy in epidermal growth factor receptor (EGFR)-mutated advanced NSCLC after EGFR tyrosine kinase inhibitor (EGFR-TKI) progression. In advanced NSCLC without actionable driver alterations, sac-TMT plus pembrolizumab improved PFS versus pembrolizumab alone in programmed death-ligand 1 (PD-L1)-positive disease; however, overall survival (OS) remains immature, and superiority over contemporary chemoimmunotherapy has not been established. The principal clinically relevant toxicities are hematologic toxicity and stomatitis.","ai_note":"叙述性药物评价而非系统评价；摘要未报告样本量、效应值、CI或P值，无法核验PFS获益幅度；OS不成熟且未证实优于当代化疗免疫治疗；检索截止日期写作2026-09-20，需核对是否为笔误或预设更新日期；主要终点与次要终点信息不足。","pico":{"p":"晚期NSCLC人群：EGFR突变且EGFR-TKI进展后；无可用驱动基因突变且PD-L1阳性（样本量未报告）","ic":"sac-TMT vs 多西他赛或铂类-培美曲塞化疗；sac-TMT联合帕博利珠单抗 vs 帕博利珠单抗单药"},"reason":"为TROP2 ADC在EGFR突变后线及PD-L1阳性一线联合策略提供证据概览，影响ADC与免疫联合的临床定位及后续试验设计。","abstract_en":"INTRODUCTION: Non-small cell lung cancer (NSCLC) remains a leading cause of cancer-related mortality, and resistance to targeted therapy and immunotherapy represents a substantial unmet clinical need. Trophoblast cell-surface antigen 2 (TROP2)-directed antibody-drug conjugates (ADCs) have emerged as a promising therapeutic class. AREAS COVERED: This drug evaluation summarizes the pharmacological rationale, molecular design, preclinical activity, clinical efficacy, safety profile, and regulatory development of sacituzumab tirumotecan (sac-TMT; MK-2870/SKB264) in NSCLC. Relevant evidence was identified through searches of PubMed, ClinicalTrials.gov, major oncology congress proceedings, and regulatory announcements through 20 September 2026. EXPERT OPINION: Randomized trials have demonstrated improved progression-free survival (PFS) with sac-TMT versus docetaxel and platinum-pemetrexed chemotherapy in epidermal growth factor receptor (EGFR)-mutated advanced NSCLC after EGFR tyrosine kinase inhibitor (EGFR-TKI) progression. In advanced NSCLC without actionable driver alterations, sac-TMT plus pembrolizumab improved PFS versus pembrolizumab alone in programmed death-ligand 1 (PD-L1)-positive disease; however, overall survival (OS) remains immature, and superiority over contemporary chemoimmunotherapy has not been established. The principal clinically relevant toxicities are hematologic toxicity and stomatitis. Future studies should clarify predictive biomarkers, optimal treatment sequencing, intracranial activity, and generalizability, while generating mature survival and quality-of-life data.","tags":["TROP2 ADC","sac-TMT","NSCLC","药物评价","EGFR突变","PD-L1"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888494","pmid":"42888494","pmcid":"","doi":"10.1002/sim.70773","nct_id":"NCT01903993","url":"https://pubmed.ncbi.nlm.nih.gov/42888494/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT01903993","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"Stat Med","journal_full":"Statistics in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"统计方法学研究 · 理论推导+模拟研究+NSCLC临床试验数据再分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":43,"score_breakdown":{"clinical":8,"methodology":24,"specialty":11,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"随机延迟治疗效应下最大0-1加权log-rank检验的提出及模拟与NSCLC试验数据验证","title_en":"A Max 0-1 Weighted Log-Rank Test for Time-to-Event Data With Random Delayed Treatment Effect.","authors":"Liu J, Chu C, Yi B, Chen MH","affiliation_highlight":"Department of Statistics, University of Connecticut, Storrs, Connecticut, USA.","results":"","authors_conclusion":"所提出的基于0-1加权log-rank统计量最大值的检验方法有用，模拟研究和NSCLC临床试验真实数据分析进一步证明了其有用性。","ai_note":"摘要未报告任何效应量、P值、样本量或终点，真实数据分析仅为示例，无法评估临床适用性。摘要称分析“一项”NSCLC临床试验真实数据，却列出两个ClinicalTrials.gov注册号（NCT01903993、NCT02008227），数据来源与范围信息不足。","pico":{"p":"非小细胞肺癌临床试验人群（样本量未报告）","ic":"所提出的最大0-1加权log-rank检验 vs 传统log-rank检验（摘要未列具体分组）"},"reason":"为免疫治疗延迟效应场景提供生存分析检验方法，可能影响NSCLC免疫治疗试验主要终点的统计解释与设计，但不直接改变临床决策。","abstract_en":"In a cancer clinical trial with an immunotherapy, the treatment often becomes effective after a certain delay time. It is well known that traditional log-rank test no longer provides optimal power in this case. There has been a great interest to search for a more powerful test to detect a truly effective immunotherapy treatment. In this paper, we propose a new testing method based on the maximum value of a set of 0-1 weighted log-rank test statistics and establish useful theoretical results of the relevant test statistics. Extensive simulation studies are conducted to examine the empirical performance of the proposed method. An analysis of the real data from a non-small-cell lung cancer clinical trial is also carried out to further demonstrate the usefulness of the proposed test method. Trial Registration: ClinicalTrials.gov ID: NCT01903993, NCT02008227.","tags":["延迟效应","加权log-rank","免疫治疗","NSCLC","统计方法"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889653","pmid":"42889653","pmcid":"PMC13669878","doi":"10.3389/or.2026.1853377","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889653/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Oncol Rev","journal_full":"Oncology reviews","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前研究 · 小鼠Lewis肺癌模型剂量探索、随机分组疗效评价及蛋白组学分析","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":41,"score_breakdown":{"clinical":9,"methodology":15,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"放疗联合NK细胞治疗非小细胞肺癌的免疫增强效应：小鼠模型蛋白组学探索","title_en":"Exploring the immune enhancement effect of radiotherapy combined with NK cells on non-small cell lung cancer based on proteomics technology.","authors":"Chang C, Youming T, Ying L, Ningning L, Chunhui G, Dekai W, Mei L, Qiyuan W et al.","affiliation_highlight":"Graduate School, Guangxi University of Chinese Medicine, Nanning, Guangxi, China.","results":"","authors_conclusion":"RT and NK cell therapy demonstrate superior synergistic efficacy and no overt toxicity was observed, with repeated treatments further delaying tumor progression. Mechanistically, proteomics shows that RT disrupts DNA replication/repair networks, whereas NK cell therapy was associated with upregulation of multiple complement components, including those belonging to the classical and lectin pathways, suggesting a potential involvement of these pathways.","ai_note":"仅为临床前小鼠数据，不能外推至临床疗效或安全性判断；摘要未报告样本量、具体效应值、统计方法与P值；称“randomized”但未说明随机化、分配隐藏与盲法；无生存终点，毒性仅为主观描述且未量化；“synergistic”未见交互作用统计检验；蛋白组学结果为描述性通路富集，缺乏验证；作者所述“clinical basis”超出数据支持范围。","pico":{"p":"C57BL/6小鼠皮下Lewis肺癌模型；样本量未报告","ic":"干预：放疗、NK细胞过继输注、二者联合（单周期或重复周期）；对照：Control组、RT单药组、NK单药组"},"reason":"为胸部肿瘤放疗联合NK细胞免疫治疗的转化研究提供机制假设和临床前基线，但尚不能影响临床方案选择或患者管理决策。","abstract_en":"BACKGROUND: Although radiotherapy (RT) and natural killer (NK) cell-based therapy have shown promising potential in the treatment of non-small cell lung cancer (NSCLC), the therapeutic efficacy and safety of their combination remain to be fully elucidated. In this study, we evaluated the efficacy and safety of combined RT and NK cell therapy and performed preliminary proteomic profiling to characterize its potential effects on the tumor immune microenvironment (TIME), providing new insights and a theoretical and clinical basis for the development of NK cell-based therapeutic strategies for NSCLC. METHODS: C57BL/6-derived subcutaneous Lewis lung carcinoma models were established to determine the minimal effective dose of both radiotherapy and adoptively transferred natural killer cells. Based on the MED-derived findings, the mice were further randomized into five experimental groups for therapeutic efficacy evaluation: the Control group, the RT group, the NK group, the combination therapy group (RN group), and the repeated combination therapy group (RN2 group). Tumour volume and body weight were monitored longitudinally. Differentially abundant proteins were interrogated by Gene Ontology enrichment and Kyoto Encyclopaedia of Genes and Genomes (KEGG) pathway analyses to systematically describe the synergistic antitumor efficacy of differentially expressed proteins. RESULTS: Compared with RT or NK cell-based immunotherapy as monotherapies, the RN group exhibited markedly enhanced tumor growth inhibition, with no overt treatment-related toxicities observed. Following the second cycle of combined therapy, mice in the RN2 group displayed a more pronounced reduction in tumor growth rate with those in the single-cycle combination cohort; notably, no significant adverse events associated with the combined regimen were detected throughout the entire experimental duration. Proteomic profiling unraveled that RT disrupted the core regulatory networks governing intracellular DNA replication and repair processes in tumor cells in a therapy-specific manner, whereas NK cell immunotherapy potently and selectively activated the classical pathway of the host complement system. CONCLUSION: Collectively, RT and NK cell therapy demonstrate superior synergistic efficacy and no overt toxicity was observed, with repeated treatments further delaying tumor progression. Mechanistically, proteomics shows that RT disrupts DNA replication/repair networks, whereas NK cell therapy was associated with upregulation of multiple complement components, including those belonging to the classical and lectin pathways, suggesting a potential involvement of these pathways.","tags":["NSCLC","放疗","NK细胞治疗","临床前小鼠模型","蛋白组学","肿瘤免疫微环境"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42891252","pmid":"42891252","pmcid":"PMC13674029","doi":"10.1016/j.xjtc.2026.102401","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42891252/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"JTCVS Tech","journal_full":"JTCVS techniques","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":15,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Septum-guided segmentectomy for deep early-stage non-small cell lung cancer: A novel, margin-independent, parenchyma-sparing concept.","title_en":"Septum-guided segmentectomy for deep early-stage non-small cell lung cancer: A novel, margin-independent, parenchyma-sparing concept.","authors":"Wang Q, Wu X, Wen Z, Liu Y, Zhang J, Yao F, Li Z, Geng J et al.","affiliation_highlight":"Department of Thoracic Surgery, Shanghai Chest Hospital, Shanghai Jiao Tong University School of Medicine, Shanghai, Chi…","results":"OBJECTIVE: The application of segmentectomy for deep-located tumors remains controversial as the result of margin concerns. This study evaluated septum-guided segmentectomy, which uses intersegmental septa and veins as a…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: The application of segmentectomy for deep-located tumors remains controversial as the result of margin concerns. This study evaluated septum-guided segmentectomy, which uses intersegmental septa and veins as anatomical boundaries to ensure precise dissection independent of fixed linear margin requirements. METHODS: We retrospectively analyzed 292 patients with deep-located cT1a-bN0M0 non-small cell lung cancer undergoing septum-guided segmentectomy (n = 130) or lobectomy (n = 162) via a minimally invasive approach (January 2019 to March 2025). To rigorously control for selection bias, propensity-score matching incorporating key physiological and anatomical confounders was performed, generating 88 well-balanced matched pairs (n = 176). Perioperative outcomes, locoregional recurrence, recurrence-free survival, and overall survival were evaluated. RESULTS: After propensity-score matching, baseline balance was achieved across key covariates. Survival analysis using stratified methods revealed no significant differences in recurrence-free survival or overall survival between the groups (P> .05). Notably, despite a substantial proportion of patients in the segmentectomy group not fulfilling standard National Comprehensive Cancer Network margin criteria (>20 mm or greater tumor size)-with a mean margin distance of 14.1 mm-no locoregional recurrence was observed during follow-up. R0 resection was achieved in all patients. Although segmentectomy involved longer operative times (P< .001), perioperative complications and hospital stays were highly comparable between the 2 cohorts. CONCLUSIONS: Septum-guided segmentectomy demonstrates preliminary oncologic safety and perioperative outcomes comparable with lobectomy for deep-located early-stage non-small cell lung cancer. By using the intersegmental septum as a reliable anatomical barrier, this concept establishes a precise surgical paradigm that safely reduces the reliance on fixed margin distances.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42890433","pmid":"42890433","pmcid":"PMC13673136","doi":"10.1002/joa3.70498","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890433/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"J Arrhythm","journal_full":"Journal of arrhythmia","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Totally Thoracoscopic Atrial Fibrillation Ablation With the Gemini S Bipolar Clamp: A Single-Center Descriptive Cohort Study of 1-Year Rhythm, Safety, and Quality-of-Life Outcomes.","title_en":"Totally Thoracoscopic Atrial Fibrillation Ablation With the Gemini S Bipolar Clamp: A Single-Center Descriptive Cohort Study of 1-Year Rhythm, Safety, and Quality-of-Life Outcomes.","authors":"Gruszczynski M, Rodriguez Cetina Biefer H, Rings L, Salzberg SP, Ntinopoulos V, Dzemali O","affiliation_highlight":"Department of Cardiac Surgery City Hospital of Zurich-Triemli Zurich Switzerland.","results":"BACKGROUND: Outcome data for the Gemini S bipolar radiofrequency clamp are almost absent; the only indexed report being a three-patient case series. We describe 1-year outcomes in a consecutive cohort.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Outcome data for the Gemini S bipolar radiofrequency clamp are almost absent; the only indexed report being a three-patient case series. We describe 1-year outcomes in a consecutive cohort. METHODS: We retrospectively analyzed all consecutive patients treated with the Gemini S clamp between January 2021 and August 2024. Epicardial box isolation was combined with left atrial appendage (LAA) exclusion; completeness was confirmed by entry and exit block on epicardial three-dimensional mapping. The primary outcome was freedom from AF recurrence at 12 months, on and off antiarrhythmic drugs (AADs) after a 90-day blanking period. RESULTS: Twenty-three patients were included (mean age 64.4 ± 8.0 years; 82.6% male). AF was paroxysmal in 34.8%, persistent in 26.1%, and long-standing persistent in 39.1%; 60.9% had prior catheter ablation and 69.6% had failed or were intolerant to a Class I or III agent. A complete block-verified box lesion was achieved in 95.7% and LAA exclusion in 91.3%. Three patients (13.0%) required conversion to sternotomy for bleeding, exceeding larger series. There was no death, stroke, phrenic nerve palsy, or pacemaker implantation. At 1 year, 87.0% (95% CI 67.9-95.5) were in sinus rhythm, all off Class I/III AADs. CONCLUSIONS: Sinus rhythm was achieved in 87.0% of patients at 1 year. As the largest reported experience with this device, the series provides device-level evidence where little existed, but it is descriptive, not powered for comparison, and the conversion rate needs confirmation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888302","pmid":"42888302","pmcid":"8434938","doi":"10.1002/1878-0261.13357","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888302/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Clin Transl Oncol","journal_full":"Clinical & translational oncology : official publication of the Federation of Spanish Oncology Societies and of the National Cancer Institute of Mexico","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述 · 非系统评价（未报告检索策略与证据分级）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":14,"methodology":8,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"ctDNA 在可切除非小细胞肺癌围手术期治疗中的价值与研究进展（叙述性综述）","title_en":"Value and research advances of ctDNA in perioperative therapy for non-small cell lung cancer.","authors":"Diao J, Cen F, Gao Y, Jiang M, Yin H","affiliation_highlight":"Department of Oncology, The First Affiliated Hospital of Soochow University, Suzhou, China.","results":"","authors_conclusion":"ctDNA 在指导个体化围手术期管理方面展现出可观前景，但多数应用仍处于研究阶段；应区分已确立的相关性用途与正在临床试验中评估的前瞻性策略；当前技术挑战包括敏感性有限、假阳性、缺乏标准化、成本效益问题及整合入临床决策的困难；未来需要前瞻性干预性研究验证 ctDNA 指导的治疗调整，并建立标准化流程与多学科协作路径，从而推动 ctDNA 融入 NSCLC 围手术期全程管理，实现精准疗效评估、风险分层与个体化治疗决策。","ai_note":"题为“systematically examines”但摘要未给出检索数据库、检索时限、纳入排除标准、文献筛选流程或偏倚/质量评价方法，属叙述性综述，不具系统评价的可重复性；全篇无任何定量数据或效应量，无法核验“与治疗反应及病理缓解相关”“预后分层与复发预测”等论断的证据强度；对敏感性不足、假阳性与成本效益等局限虽有提及，但未量化其临床影响；未说明所引证据中前瞻性干预试验与回顾性相关性研究的比例，存在将探索性关联表述为可用价值的倾向。信息不足：无样本量、无研究数量、无终点数值。","pico":{"p":"","ic":""},"reason":"为可切除 NSCLC 围手术期 ctDNA 应用（新辅助疗效/病理缓解关联、术后 MRD 监测与复发预测）提供证据版图与研究缺口定位，可用于界定“相关性证据”与“前瞻性干预证据”的边界，指导后续围手术期 ctDNA 引导治疗试验的终点与标准化设计。","abstract_en":"Perioperative treatment plays an increasingly important role in improving outcomes for patients with resectable non-small cell lung cancer (NSCLC). Circulating tumor DNA (ctDNA) offers a new perspective for optimizing individualized perioperative management. This review systematically examines the core value of ctDNA in perioperative therapy for resectable NSCLC, encompassing its correlation with treatment response and pathological remission during the neoadjuvant phase, its utility as a dynamic monitor of treatment efficacy, and its emerging role in prognostic stratification and recurrence prediction in the postoperative setting. Importantly, while ctDNA demonstrates considerable promise for guiding individualized perioperative management, most applications remain investigational; we therefore distinguish between established correlative uses and prospective strategies currently under evaluation in clinical trials. It also addresses current technical challenges in ctDNA application, including limited sensitivity, false positives, lack of standardization, cost-effectiveness concerns, and difficulties in integration into clinical decision-making. Future prospective interventional studies are needed to validate ctDNA-guided treatment adjustments and to establish standardized protocols and multidisciplinary collaboration pathways, thereby facilitating the integration of ctDNA into the full course of perioperative management for NSCLC and enabling precise efficacy assessment, risk stratification, and individualized treatment decisions.","tags":["ctDNA","MRD","围手术期","可切除NSCLC","新辅助治疗","综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42876635","pmid":"42876635","pmcid":"PMC7608003","doi":"10.1016/S0140-6736(01)06071-8","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42876635/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Front Oncol","journal_full":"Frontiers in Oncology","tier":"C","if_val":3.4,"zone":"JCR Q2 · 3区","warned":false,"study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Time-segmented, feedback-guided tiered warming during radical esophagectomy: a single-center retrospective cohort study.","title_en":"Time-segmented, feedback-guided tiered warming during radical esophagectomy: a single-center retrospective cohort study.","authors":"Liu Y, Ren J, Xiao L, Wang J, Wang L, Yi Y, Cheng J, Hu M et al.","affiliation_highlight":"Department of Operating Room, The affiliated Hospital of Southwest Medical University, Luzhou, Sichuan, China.","results":"OBJECTIVE: To evaluate whether a protocolized intraoperative temperature-management strategy based on time-segmented warning thresholds and tiered, feedback-guided warming interventions reduces hypothermia and improves e…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVE: To evaluate whether a protocolized intraoperative temperature-management strategy based on time-segmented warning thresholds and tiered, feedback-guided warming interventions reduces hypothermia and improves early postoperative recovery in patients undergoing radical esophagectomy. METHODS: This single-center retrospective comparative cohort study included 116 adults who underwent elective radical esophagectomy at The affiliated Hospital of Southwest Medical University between August 2024 and January 2026 and were managed with either a time-segmented, feedback-guided tiered warming protocol (n = 58) or conventional warming (n = 58). Core temperature was monitored continuously with a lower esophageal probe until the start of esophageal mobilization and with a nasopharyngeal probe thereafter, and was recorded every 15 min. All warming adjustments were implemented manually by the clinical team according to predefined thresholds. The primary endpoint was intraoperative hypothermia, defined as a core temperature below 36 °C at any time from incision to skin closure. Secondary endpoints included severe hypothermia, nadir temperature, hypothermia burden, postoperative shivering, time to extubation, post-anesthesia care unit (PACU) recovery time, coagulation indices, 30-day complications, length of stay, and hospital cost. RESULTS: Intraoperative hypothermia occurred in 53 of 58 control patients (91.4%) and 5 of 58 intervention patients (8.6%) (risk ratio 0.09, 95% CI 0.04-0.22; P < 0.001). Severe hypothermia below 35.5 °C developed in 27 control patients (46.6%) and in none of the intervention patients. Median nadir core temperature was 35.55 °C in the control group and 36.27 °C in the intervention group (P < 0.001). Compared with conventional warming, the protocol reduced postoperative shivering (5.2% vs 51.7%), shortened time to extubation by 8.9 min, lowered the rate of any postoperative complication (34.5% vs 62.1%; P = 0.005), shortened hospital stay (12.2 vs 13.5 days; P = 0.010), and reduced mean in-hospital cost by 8,911 CNY (P < 0.001). The treatment effect was materially unchanged in adjusted analyses using Firth penalized logistic regression (adjusted odds ratio 0.004, 95% CI 0.000-0.024) and modified Poisson regression (adjusted risk ratio 0.10, 95% CI 0.04-0.23). CONCLUSION: In adults undergoing radical esophagectomy, a time-segmented, feedback-guided tiered warming protocol substantially reduced intraoperative hypothermia and was associated with faster early recovery, fewer postoperative complications, shorter hospitalization, and lower cost. Because the intervention was a multicomponent warming bundle, the contributions of its individual components cannot be separated, and the associations with complications, hospital stay, and cost should be regarded as hypothesis-generating. The protocol uses standard perioperative equipment and can be implemented without specialized hardware.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42890051","pmid":"42890051","pmcid":"PMC13672036","doi":"","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890051/","notice_url":"","trial_url":"","pub_date":"2025-Apr","briefing_date":"2026-10-18","journal_abbr":"Tanaffos","journal_full":"Tanaffos","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Galactooligosaccharides Suppress the Development of Biofilm in the Presence of Blood Polymorphonuclear Cells of Non-Small Cell Lung Cancer (NSCLC) Patients: A Pilot Study.","title_en":"Galactooligosaccharides Suppress the Development of Biofilm in the Presence of Blood Polymorphonuclear Cells of Non-Small Cell Lung Cancer (NSCLC) Patients: A Pilot Study.","authors":"Nomani M, Salimi B, Varahram M, Jamaati H, Mortaz E","affiliation_highlight":"Clinical Tuberculosis and Epidemiology Research Center, National Research Institute of Tuberculosis and Lung Diseases(NR…","results":"BACKGROUND: Bacterial biofilms pose a significant healthcare challenge due to their robust resistance to antibiotics and their involvement in various diseases, including cancer and infectious conditions. Biofilms hinder …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Bacterial biofilms pose a significant healthcare challenge due to their robust resistance to antibiotics and their involvement in various diseases, including cancer and infectious conditions. Biofilms hinder the antimicrobial activity of polymorphonuclear leukocytes (PMNs) by restricting their penetration through the extracellular matrix. With the rise of antimicrobial resistance, non-antibiotic strategies are gaining attention. Galacto-oligosaccharides (GOS) have been investigated for their potential to inhibit bacterial growth. This study investigates the impact of GOS on the biofilm development of GFP-labelled Staphylococcus aureus (GFP-SA) and Pseudomonas aeruginosa (GFP-PA) in the presence of blood PMNs from patients with non-small-cell lung cancer (NSCLC) and healthy controls.Materials and Methods: Bacterial biofilms were investigated in the presence or absence of PMNs isolated from the blood of 12 NSCLC patients and 3 healthy controls (HC), with the inclusion of GOS. These PMNs were incubated with GFP-SA or GFP-PA biofilms and exposed to various concentrations of GOS (2.5%, 5%, 10%, 15%, and 20%) for 24 hours in a microplate setting. The progress of bacterial biofilm was quantified using the crystal violet assay. RESULTS: GOS itself, with bacteria at high concentrations (10%, 15%, and 20%), suppressed biofilm formation. PMNs of NSCLC patients show higher biofilm formation than in the absence of PMNs. CONCLUSION: Based on our findings, PMNs in NSCLC patients may disrupt the natural balance of bacteria in the lungs, potentially leading to an overgrowth of biofilm-forming bacteria. GOS are known to influence immune function and may improve the ability of PMNs to fight infections. Consequently, it is proposed that GOS could enhance the ability of PMNs to phagocytose bacterial biofilms and counteract the negative effects of cancerous PMNs on biofilm formation. However, further research is needed to confirm whether GOS can effectively manage bacterial biofilms in lung cancer patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889044","pmid":"42889044","pmcid":"PMC13668488","doi":"10.7759/cureus.116243","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889044/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-18","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"Case report · 单例诊断不一致与分子检测/重复活检经验","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":32,"score_breakdown":{"clinical":9,"methodology":6,"specialty":17,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"肺鳞癌患者心包积液细胞学提示腺癌的诊断不一致病例：分子检测与重复活检的意义","title_en":"Unexpected Pericardial Cytology in a Patient With Primary Squamous Cell Carcinoma of the Lung: Emphasizing the Need for Advanced Molecular Characterization of Tumors.","authors":"Gevorgian M, Minter A","affiliation_highlight":"Radiology, Alabama College of Osteopathic Medicine, Dothan, USA.","results":"心包积液细胞学显示恶性腺癌细胞，与既往鳞癌诊断不一致；心包积液分子检测发现TP53突变、中等肿瘤突变负荷、微卫星稳定，无可用药致癌驱动基因；重复组织取样再次确认鳞癌组织学且PD-L1高表达。患者初始接受帕博利珠单抗单药治疗，因疾病进展升级为卡铂、培美曲塞联合帕博利珠单抗。未发现第二原发恶性肿瘤或组织学转化证据。","authors_conclusion":"本病例突出显示了NSCLC中细胞学-病理不一致的诊断挑战及治疗意义，强调在组织学不确定时进行分子检测和重复组织取样以指导个体化治疗决策的重要性。","ai_note":"单例病例报告，无对照、无系统性验证，不能评估分子检测或重复活检对结局的影响；标题强调“高级分子表征”，但分子检测未发现可用药驱动基因，重复活检反而确认原鳞癌诊断；治疗升级发生于疾病进展后，不能归因于细胞学不一致本身；摘要未提供定量结局与随访统计，外推性信息不足。","pico":{"p":"70岁男性，既往肺鳞状细胞癌，进行性呼吸困难并大量心包积液","ic":"心包积液细胞学分析、分子检测及重复组织活检；无对照"},"reason":"提示晚期NSCLC在细胞学与既往组织学不一致时需考虑肿瘤异质性、腺鳞癌或取样误差，并为是否重复活检及补充分子检测提供病例层面的讨论素材，但不改变现有治疗选择证据。","abstract_en":"Non-small cell lung cancer (NSCLC) encompasses a diverse group of histologic subtypes, including adenocarcinoma, squamous cell carcinoma (SqCC), and the less common but clinically aggressive adenosquamous carcinoma. Intratumoral histologic heterogeneity is a recognized challenge in NSCLC and may result in diagnostic discordance when sampling is limited. Cytologic-pathologic discordance may raise concern for tumor heterogeneity, sampling error, or misidentified histologic subtype. In such scenarios, molecular profiling and re-biopsy are essential to refine diagnosis and guide therapy. Here, we present a case of a 70-year-old man with a known history of SqCC of the lung who presented with progressive shortness of breath and was found to have a large pericardial effusion. Cytologic analysis of the pericardial fluid revealed malignant adenocarcinoma cells, discordant with the prior SqCC diagnosis. Molecular profiling of the pericardial fluid identified a TP53 mutation, intermediate tumor mutational burden, and microsatellite stability, without actionable oncogenic drivers. Repeat tissue sampling reconfirmed SqCC histology with high PD-L1 expression. The patient was initially treated with pembrolizumab monotherapy but required escalation to carboplatin, pemetrexed, and pembrolizumab due to disease progression. The cytologic discordance raised suspicion for unrecognized adenosquamous carcinoma or tumor heterogeneity not captured on initial biopsy. No evidence of a second primary malignancy or histologic transformation was found. This case highlights the diagnostic challenges and therapeutic implications of cytologic-pathologic discordance in NSCLC. It underscores the importance of molecular profiling and repeat tissue sampling in guiding personalized treatment decisions when histologic uncertainty exists.","tags":["NSCLC","心包积液","细胞学-病理不一致","分子检测","重复活检","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}}]};

const INJECTED_PAPERS=Array.isArray(SITE_DATA.papers)?SITE_DATA.papers:[];

  {id:'all',label:'全部信号',short:'全部'},
