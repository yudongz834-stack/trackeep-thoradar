function renderJournalLegend(journals){
  $('#journal-selection').textContent=`刊源：${state.journal||'全部'}`;
  $('#journal-selection').title=state.journal||'全部刊源';
  $('#journal-clear').disabled=!state.journal;
  $('#journal-legend').innerHTML=journals.map(j=>`<button class="journal-btn ${state.journal===j.name?'active':''}" data-journal="${esc(j.name)}" title="${esc(j.name)}" aria-pressed="${state.journal===j.name}">${esc(j.name)}<em>${j.count}</em></button>`).join('')||'<span class="filter-label">当前窗口无刊源</span>';
}
function renderDesignLegend(list){
  const count=kind=>list.filter(p=>designOf(p)===kind).length;
  $('#design-legend').innerHTML=`<span><i class="legend-shape rct"></i>RCT · ${count('rct')}</span><span><i class="legend-shape cohort"></i>队列 · ${count('cohort')}</span><span><i class="legend-shape"></i>待评定 · ${count('pending')}</span><span>点按信号锁定 · 点按扇区筛刊</span>`;
}
function renderScope(list,base,journals){
  const visible=new Set(list.map(p=>p.id)),POSITIONS=positions(base,journals);
  $('#journal-sectors').innerHTML=journals.map((j,i)=>sectorMarkup(j,i,journals.length)).join('');
  $('#blips').innerHTML=base.map(p=>{
    const pos=POSITIONS[p.id]||{left:50,top:50};
    const cls=[designOf(p),state.selected===p.id&&visible.has(p.id)?'selected':'',state.read.has(p.id)?'read':'',visible.has(p.id)?'':'dim'].join(' ');
    return `<button class="blip ${cls}" style="left:${pos.left.toFixed(2)}%;top:${pos.top.toFixed(2)}%" data-select="${esc(p.id)}" title="${esc(journalName(p))} · ${esc(show(p.score_total))}分 · ${esc(p.title_zh||p.title_en||'—')}" aria-label="${esc(p.title_zh||p.title_en||'—')}"></button>`;
  }).join('');
  const sectorSize=360/Math.max(journals.length,1);
  $('#scope-labels').innerHTML=journals.map((j,i)=>{
    if(journals.length>8&&j.count<2&&state.journal!==j.name)return '';
    const a=(-90+(i+.5)*sectorSize)*Math.PI/180,r=45.5,name=j.name.length>13?j.name.slice(0,12)+'…':j.name;
    return `<span class="scope-label" title="${esc(j.name)}" style="left:${50+Math.cos(a)*r}%;top:${50+Math.sin(a)*r}%">${esc(name)}</span>`;
  }).join('');
  $('#scope-empty').classList.toggle('show',!list.length);
  $('#scope-empty').innerHTML=!base.length?'当前数据窗口内无论文。<br>请调整滑杆或刊源档位。':'当前条件下没有信号。<br>试试清除检索、刊源或切换专科。';
  $('#hub-count').textContent=list.length;
}
function statusOf(p){
  const kind=String(p.status?.kind||'');
  if(kind==='retracted')return {kind,label:'🚫 已撤稿',cls:'retracted'};
  if(kind==='concern')return {kind,label:'⚠ 关注声明',cls:'concern'};
  if(kind==='corrected')return {kind,label:'📄 更正启事',cls:'corrected'};
  if(kind==='ok')return {kind,label:'未见异常标记',cls:''};
  return {kind,label:'出版状态 —',cls:'unknown'};
}
function noticeMarkup(p,status){
  const note=String(p.status?.note||'').trim();
  if(!['retracted','concern','corrected'].includes(status.kind)&&!note)return '';
  const ref=p.status?.notice_ref||p.status?.notice_pmid||'';
  const link=safeUrl(p.notice_url);
  const label=status.kind==='retracted'?'🚫 已撤稿':status.kind==='concern'?'⚠ 关注声明':status.kind==='corrected'?'📄 更正启事':'题录状态说明';
  return `<div class="notice-banner ${status.cls||'neutral'}"><strong>${label}</strong>${note?`<br>${esc(note)}`:''}${ref?`<br>关联：${esc(ref)}`:''}${link?`<br><a href="${esc(link)}" target="_blank" rel="noopener">查看出版方声明 ↗</a>`:''}</div>`;
}
function issueOf(p){
  const volume=show(p.volume),issue=show(p.issue);
  if(volume!=='—'||issue!=='—')return `${volume}${issue!=='—'?`(${issue})`:''}`;
  return show(p.journal_issue||p.issue_info||p.volume_issue);
}
function interpretationMarkup(p,degraded){
  if(degraded)return '<div class="interpretation-paused"><strong>解读暂停</strong><br>当前仅展示题录与原始摘要，不展示生成解读。</div>';
  const blocks=[];
  if(hasValue(p.authors_conclusion))blocks.push(`<p class="honesty-note"><strong>作者结论</strong><br>${esc(p.authors_conclusion)}</p>`);
  if(hasValue(p.ai_note))blocks.push(`<p class="honesty-note"><strong>生成解读 · 未经人审</strong><br>${esc(p.ai_note)}</p>`);
  if(!blocks.length)blocks.push('<p class="honesty-note">作者结论与疑点未生成，本版留白不硬写。评分只用于信号排序，不代表临床推荐。</p>');
  return blocks.join('');
}
function renderDetail(list){
  const p=PAPERS.find(item=>item.id===state.selected);
  if(!p||!list.some(item=>item.id===p.id)){
    $('#detail').innerHTML='<div class="detail-empty">信号已移出当前视野。<br>清除筛选或调整数据窗口后可继续查看详情。</div>';return;
  }
  const index=list.findIndex(item=>item.id===p.id),marked=state.read.has(p.id),status=statusOf(p),degraded=p.publish_state==='degraded';
  const paperUrl=safeUrl(p.url),trialUrl=safeUrl(p.trial_url),doi=String(p.doi||'').trim();
  const score=Number(p.score_total),hasScore=hasValue(p.score_total)&&Number.isFinite(score);
  const trial=p.nct_id?(trialUrl?`<a class="action-btn wide" href="${esc(trialUrl)}" target="_blank" rel="noopener">查看 ${esc(p.nct_id)} 试验记录 ↗</a>`:`<span class="action-btn wide">试验号 ${esc(p.nct_id)} · 链接 —</span>`):'';
  const paperLink=paperUrl?`<a class="action-btn primary" href="${esc(paperUrl)}" target="_blank" rel="noopener">打开题录 ↗</a>`:'<span class="action-btn primary">题录链接 —</span>';
  const doiLink=doi?`<a class="action-btn" href="https://doi.org/${encodeURIComponent(doi)}" target="_blank" rel="noopener">DOI 原文 ↗</a>`:'<span class="action-btn">DOI —</span>';
  const scoreTrack=hasScore?`<div class="score-track" aria-label="评分 ${score} 分"><i style="width:${Math.max(0,Math.min(100,score))}%"></i></div>`:'';
  const abstract=p.abstract_en||p.results||'';
  $('#detail').innerHTML=`<div class="detail-inner ${status.kind==='retracted'?'is-retracted':''}">
    <div class="detail-top"><span class="lock-id">SIGNAL LOCK / ${String(index+1).padStart(2,'0')}</span><span class="status-pill ${['retracted','concern','corrected'].includes(status.kind)?'has-icon':''} ${status.cls}">${status.label}</span></div>
    ${noticeMarkup(p,status)}
    <div class="detail-journal"><div><div class="journal-name">${esc(p.journal_full||p.journal_abbr||'—')}</div><div class="journal-meta">${esc(journalName(p))} · ${esc(show(p.pub_date))} · ${esc(show(p.tier))} 档</div></div><div class="score-box"><b>${esc(show(p.score_total))}</b><small>评分 · ${esc(show(p.score_source))}</small></div></div>
    ${scoreTrack}
    <h2 class="detail-title">${esc(p.title_zh||p.title_en||'—')}</h2>
    <div class="badges"><span class="badge accent">${esc(p.category_label||categoryOf(p.category).label)}</span><span class="badge">${esc(show(p.study_type))}</span>${p.nct_id?`<span class="badge">${esc(p.nct_id)}</span>`:''}${degraded?'<span class="badge paused">解读暂停</span>':''}</div>
    <div class="meta-grid">
      <div class="meta-cell"><small>PMID</small><b>${esc(show(p.pmid))}</b></div><div class="meta-cell"><small>出版状态</small><b>${esc(status.label)}</b></div>
      <div class="meta-cell"><small>影响因子 · 源值</small><b>${esc(show(p.if_val || null))}</b></div><div class="meta-cell"><small>分区 · 源值</small><b>${esc(show(p.zone))}</b></div><div class="meta-cell"><small>预警状态</small><b>${p.warned ? '⚠ 在预警名单' : '正常'}</b></div>
      <div class="meta-cell"><small>雷达日期</small><b>${esc(show(p.briefing_date))}</b></div><div class="meta-cell"><small>卷 / 期</small><b>${esc(issueOf(p))}</b></div>
      <div class="meta-cell"><small>评分口径</small><b>${esc(show(p.score_source))}</b></div><div class="meta-cell"><small>精选状态</small><b>${p.curated?'已入选':'未入选 · 不凑数'}</b></div>
    </div>
    <div class="interpretation">
      <div class="excerpt-label"><b>摘要导读</b><span>原始字段 · 非全文</span></div>
      <p class="excerpt">${esc(abstract||'摘要摘录暂缺，请通过题录链接查阅原文。')}</p>
      ${interpretationMarkup(p,degraded)}
    </div>
    <div class="detail-actions">${paperLink}${doiLink}${trial}<button class="action-btn wide ${marked?'marked':''}" id="mark-read">${marked?'✓ 已扫 · 点击撤销':'标记本篇已扫'}</button></div>
    <div class="detail-nav"><button class="nav-btn" id="prev-btn">← 上一信号</button><span class="nav-position">${index+1} / ${list.length}</span><button class="nav-btn" id="next-btn">下一信号 →</button></div>
  </div>`;
  $('#mark-read')?.addEventListener('click',()=>{state.read.has(p.id)?state.read.delete(p.id):state.read.add(p.id);render()});
  $('#prev-btn')?.addEventListener('click',()=>step(-1));
  $('#next-btn')?.addEventListener('click',()=>step(1));
}
function renderFunnel(){
  const f=SITE_DATA.funnel||{};
  $('#funnel').innerHTML=[['初抓',f.fetched],['刊源匹配',f.journal_matched],['简报入库',f.final],['规则精选',f.curated]].map(([label,value])=>`<div class="funnel-step"><b>${esc(show(value))}</b>${label}${label==='规则精选'&&value===0?' · 空缺':''}</div>`).join('');
}
function renderHeader(){
  $('#scan-date').textContent=ANCHOR?ANCHOR.replaceAll('-','.')+' / ANCHOR':'— / NO DATA';
  const generated=String(SITE_DATA.generated_at||SITE_DATA.updated_at||'');
  $('#scan-time').textContent=`${generated?generated.slice(0,16):'生成时间 —'} · 状态分项标注`;
}
function render(){
  const base=windowPapers(),tierBase=base.filter(tierOk),journals=journalUniverse(tierBase),list=filtered();
  if(list.length&&!list.some(p=>p.id===state.selected))state.selected=list[0].id;
  renderWindow();renderCategoryFilters(base);renderTierFilters(base);renderQueue(list);renderJournalLegend(journals);renderDesignLegend(list);renderScope(list,tierBase,journals);renderDetail(list);
  const readCount=PAPERS.filter(p=>state.read.has(p.id)).length;
  $('#read-count').textContent=`${String(readCount).padStart(2,'0')} / ${PAPERS.length}`;
  document.querySelectorAll('[data-quick]').forEach(btn=>btn.classList.toggle('active',btn.dataset.quick===state.quick));
}
function selectPaper(id,scroll=false){
  if(!PAPERS.some(p=>p.id===id))return;
  state.selected=id;render();
  if(scroll&&matchMedia('(max-width:900px)').matches)document.querySelector('.detail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function step(direction){
  const list=filtered();if(!list.length)return;
  const index=list.findIndex(p=>p.id===state.selected);
  state.selected=list[(index+direction+list.length)%list.length].id;render();
}
function toggleJournal(name){
  state.journal=state.journal===name?null:name;render();
}
document.addEventListener('click',event=>{
  const select=event.target.closest('[data-select]');
  if(select){selectPaper(select.dataset.select,true);return}
  const category=event.target.closest('[data-category]');
  if(category){state.category=category.dataset.category;render();return}
  const quick=event.target.closest('[data-quick]');
  if(quick){state.quick=quick.dataset.quick;render();return}
  const tier=event.target.closest('[data-tier]');
  if(tier){const name=tier.dataset.tier;state.tiers.has(name)?state.tiers.delete(name):state.tiers.add(name);render();return}
  const journal=event.target.closest('[data-journal]');
  if(journal){toggleJournal(journal.dataset.journal);return}
  if(event.target.closest('#journal-clear')){state.journal=null;render();return}
});
$('#window-range').addEventListener('input',event=>{state.days=Number(event.target.value);render()});
$('#search').addEventListener('input',event=>{state.query=event.target.value;render()});
$('#theme-btn').addEventListener('click',()=>{
  const dark=document.documentElement.classList.toggle('dark');
  $('#theme-btn').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');
  $('#theme-icon').innerHTML=dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/>';
});
document.addEventListener('keydown',event=>{
  if(event.key==='/'&&document.activeElement!==$('#search')){event.preventDefault();$('#search').focus()}
  if(event.key==='Escape'){state.query='';state.category='all';state.quick='all';state.journal=null;state.tiers=new Set(TIERS);$('#search').value='';render();$('#search').blur()}
  if((event.key==='Enter'||event.key===' ')&&document.activeElement?.classList.contains('journal-sector')){event.preventDefault();toggleJournal(document.activeElement.dataset.journal);return}
  if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    if(event.key==='ArrowLeft')step(-1);if(event.key==='ArrowRight')step(1);
  }
});
async function loadRollingPapers(){
  try{
    const response=await fetch('data/radar_latest.json');
    if(!response.ok)throw new Error('rolling window unavailable');
    const payload=await response.json(),latest=Array.isArray(payload)?payload:payload?.papers;
    if(!Array.isArray(latest))throw new Error('rolling window schema mismatch');
    PAPERS=mergePapers(latest);ANCHOR=findAnchor(PAPERS);renderHeader();render();
  }catch(error){
    console.info('滚动窗数据不可用，已静默降级为注入数据。');
  }
}
ANCHOR=findAnchor(PAPERS);
renderHeader();renderFunnel();render();
loadRollingPapers();
</script>
</body>
