ation on optimal attenuation thresholds and overall performance. Materials and Methods This retrospective study included adult patients who underwent CCTA with concomitant unenhanced coronary Agatston scoring (January to December 2025). Moderate-to-severe hepatic steatosis was defined as unenhanced liver attenuation less than 40 HU. Postcontrast liver attenuation was measured using standardized regions of interest. Diagnostic performance was assessed using receiver operating characteristic analysis with Youden index-based threshold determination. Associations between hepatic steatosis, Agatston score categories, and Coronary Artery Disease Reporting and Data System (CAD-RADS) categorizations were evaluated using likelihood ratio χ2 tests. Results Among 300 included patients (mean age ± SD, 55.6 years ± 12.0; 170 males), moderate-to-severe steatosis was present in 109 patients (36.3%). Postcontrast liver attenuation demonstrated high diagnostic performance across all settings (area under the receiver operating characteristic curve: 0.88, 0.95, and 0.89 at 100, 120, and 140 kVp, respectively). Optimal thresholds decreased with increasing tube potential (54, 47, and 40 HU at 100, 120, and 140 kVp, respectively). Patients with steatosis had a lower frequency of coronary artery calcium scores of zero (43.7% vs 57.6%) and a higher frequency of coronary artery calcium scores of 101-300 (11.7% vs 4.9%; P = .042), whereas CAD-RADS distribution was similar (P = .12). Conclusion Postcontrast liver attenuation measured with CCTA demonstrated promising diagnostic performance for opportunistic identification of moderate-to-severe hepatic steatosis across different tube potential settings. Hepatic steatosis was associated with coronary calcium burden but not with CAD-RADS categorization. Keywords: CT-Coronary Angiography, Abdomen/GI, Coronary Arteries, Liver Supplemental material is available for this article. © RSNA, 2026.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893431","pmid":"42893431","pmcid":"","doi":"10.1177/10732748261500335","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893431/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-18","journal_abbr":"Cancer Control","journal_full":"Cancer control : journal of the Moffitt Cancer Center","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Lung Cancer Screening Delivery in a Decentralized Program: Patient and Provider Perspectives.","title_en":"Lung Cancer Screening Delivery in a Decentralized Program: Patient and Provider Perspectives.","authors":"Allgood AM, Murrell JE, Tamhane AA, Williams S, Gaskin R, Jennings JC, Rivers D, Bae S et al.","affiliation_highlight":"Department of Health Services Administration, University of Alabama at Birmingham, Birmingham, AL, USA.","results":"IntroductionLung cancer is the leading cause of cancer-related death in Alabama, where screening uptake remains well below national benchmarks. Decentralized screening programs, in which referring providers manage eligib…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"IntroductionLung cancer is the leading cause of cancer-related death in Alabama, where screening uptake remains well below national benchmarks. Decentralized screening programs, in which referring providers manage eligibility identification, referrals, and follow-up without dedicated coordination infrastructure, are common across clinical settings. Yet the relationship between program design and delivery outcomes in decentralized contexts has received little attention. This study examined how a decentralized lung cancer screening program delivered screening across each step of the pathway, from patient identification through annual follow-up. The goal was to identify where and how program design produced gaps in delivery from the perspectives of patients and providers.MethodsThis qualitative study used semi-structured interviews conducted between July 2023 and May 2024 at an academic medical center in Alabama as part of a larger explanatory sequential mixed methods study. Fifteen patients who had completed screening and six providers representing primary care, pulmonology, and radiology participated. Interviews explored screening awareness, decision-making, and program delivery processes. Transcripts were analyzed using the Consolidated Framework for Implementation Research (CFIR) and constant comparative method. Reporting followed the COREQ guideline.ResultsDelivery failures were structural and concentrated at the front end of the screening pathway. Eligibility identification depended on incidental patient exposure rather than systematic outreach. Referrals reflected individual provider initiative rather than standardized workflows. Result tracking and nodule follow-up fell to ordering providers without dedicated support. Coverage gaps and geographic distance compounded these determinants.ConclusionReduced uptake in this decentralized program pointed largely to structural barriers. Closing the implementation gap may require program design changes and proactive outreach that does not depend on the clinical encounter to begin.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893318","pmid":"42893318","pmcid":"PMC13676432","doi":"10.7759/cureus.116442","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893318/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-18","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Radiographic Findings Concerning for Gangrenous Cholecystitis in an Asymptomatic Elderly Patient: A Case for Conservative Management.","title_en":"Radiographic Findings Concerning for Gangrenous Cholecystitis in an Asymptomatic Elderly Patient: A Case for Conservative Management.","authors":"Syed Z, Azhar M, Gervasoni J","affiliation_highlight":"School of Medicine, St.","results":"Gallbladder necrosis is a rare but life-threatening complication of acute cholecystitis, likely resulting from chronic blood flow, inflammation, and intraluminal pressure. It most commonly occurs in elderly or critically…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Gallbladder necrosis is a rare but life-threatening complication of acute cholecystitis, likely resulting from chronic blood flow, inflammation, and intraluminal pressure. It most commonly occurs in elderly or critically ill patients with significant comorbidities and is often underreported due to its nonspecific presentation. This diagnosis is usually associated with right upper quadrant pain, leukocytosis, and fever. Here, we present an 80-year-old woman with metastatic lung cancer, COPD, and an extensive surgical and oncologic history who was incidentally found to have radiographic findings concerning for gangrenous cholecystitis but remained asymptomatic. Despite these findings, the patient remained clinically stable with improving leukocytosis during her inpatient course and was managed conservatively without surgical intervention. Post-discharge follow-up was unavailable.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42891084","pmid":"42891084","pmcid":"PMC12610033","doi":"10.1096/fj.202502948R","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42891084/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-18","journal_abbr":"Food Sci Nutr","journal_full":"Food science & nutrition","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Aucubin Alleviates Ulcerative Colitis in Mice by Repairing the Intestinal Barrier and Modulating the Microbiota-Metabolism Axis.","title_en":"Aucubin Alleviates Ulcerative Colitis in Mice by Repairing the Intestinal Barrier and Modulating the Microbiota-Metabolism Axis.","authors":"Bi Y, Chen P, Jia S, Jia S, Lian Z, Zheng Y, Guo J, Xue J et al.","affiliation_highlight":"School of Basic Medical Sciences Changzhi Medical College Changzhi Shanxi China.","results":"Ulcerative colitis (UC) is a chronic inflammatory bowel disease with a complex pathogenesis, necessitating the development of safe and effective therapeutic interventions. This study aimed to investigate the protective e…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Ulcerative colitis (UC) is a chronic inflammatory bowel disease with a complex pathogenesis, necessitating the development of safe and effective therapeutic interventions. This study aimed to investigate the protective effects and underlying mechanisms of Aucubin (Auc) against dextran sulfate sodium (DSS)-induced UC in mice. Using a DSS-induced colitis model, we systematically evaluated the multifaceted effects of Auc by assessing the Disease Activity Index (DAI), colon length, histopathological changes, immunohistochemical staining, ELISA results, proteomic profiles, 16S rRNA sequencing data, and untargeted metabolomic analyses. Compared with the DSS group, Aucubin high-dose (Auc-H, 100 mg/kg) treatment significantly attenuated DSS-induced body weight loss, DAI score elevation, and colon shortening (all p < 0.05). The therapeutic efficacy of Auc-H was comparable to that of the positive control drug 5-aminosalicylic acid (5-ASA). Mechanistically, Auc restored intestinal barrier integrity by stimulating mucin 2 (Muc2) secretion and upregulating the expression of zonula occludens-1 (ZO-1) and Occludin, which in turn significantly reduced serum lipopolysaccharide (LPS) concentrations (p < 0.001). Proteomic analysis identified 2180 DSS-induced differentially expressed proteins, of which 679 were significantly counter-regulated by Auc-H, mainly involving the complement and coagulation cascades and immune-inflammatory pathways. Furthermore, gut microbiota analysis showed that Auc promoted the growth of beneficial bacteria, improving microbial balance. Untargeted metabolomics further revealed that Auc-H significantly restored the levels of 120 DSS-induced differential metabolites, including 86 upregulated and 34 downregulated metabolites, among which were protective tryptophan-derived indole metabolites (p < 0.05). Consequently, Aucubin exhibits significant clinical potential in alleviating UC via a multifaceted mechanism. These effects include reduced inflammation, restored epithelial barrier integrity, and modulated microbial metabolism. These findings provide crucial experimental evidence supporting the potential application of Auc as a preventive therapy for UC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889954","pmid":"42889954","pmcid":"PMC12443626","doi":"10.1093/lifemeta/loag028","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889954/","notice_url":"","trial_url":"","pub_date":"2026-Dec","briefing_date":"2026-10-18","journal_abbr":"Life Metab","journal_full":"Life metabolism","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Palmitoyltransferase DHHC13 controls lysosomal cholesterol egress through palmitoylating Niemann-Pick C1.","title_en":"Palmitoyltransferase DHHC13 controls lysosomal cholesterol egress through palmitoylating Niemann-Pick C1.","authors":"Men XT, Bai XY, Zhao YY, Huang YQ, Huo DY, Jiang YX, Xia MF, Ye H et al.","affiliation_highlight":"State Key Laboratory of Genetics and Development of Complex Phenotypes, Shanghai Key Laboratory of Metabolic Remodeling …","results":"Protein S-palmitoylation provides a key regulatory mechanism for diverse cellular activities. Although palmitoylated proteins are frequently observed in cholesterol-enriched membrane microdomains, how protein palmitoylat…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Protein S-palmitoylation provides a key regulatory mechanism for diverse cellular activities. Although palmitoylated proteins are frequently observed in cholesterol-enriched membrane microdomains, how protein palmitoylation reciprocally regulates cholesterol metabolism remains elusive. Here, we identify DHHC13 as a critical regulator linking protein palmitoylation to lysosomal cholesterol egress. Through an shRNA screen, we found that lack of DHHC13 led to pronounced lysosomal cholesterol accumulation. Mechanistically, DHHC13 directly palmitoylated Niemann-Pick C1 (NPC1). Loss of palmitoylation disrupted NPC1 association with lysosomes and caused its degradation, thereby impairing lysosomal cholesterol egress. Dhhc13 -/- mice phenocopied Npc1 -/- mice, displaying cholesterol deposition in the brain, liver, spleen, and kidney, along with significant Purkinje cell loss. Furthermore, two clinically relevant DHHC13 mutants (Q173H and R451Q) associated with neurodegenerative disorders showed diminished catalytic activity and failed to restore NPC1 palmitoylation or lysosomal cholesterol egress. Collectively, our findings uncover DHHC13 as a critical regulator of lysosomal cholesterol metabolism via NPC1 palmitoylation, providing mechanistic insights into cholesterol-related neurological disorders.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42889416","pmid":"42889416","pmcid":"PMC1360123","doi":"10.1016/j.igie.2025.12.008","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42889416/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-18","journal_abbr":"IGIE","journal_full":"iGIE : innovation, investigation and insights","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Knife-assisted endoscopic full-thickness resection of deeply invasive esophageal adenocarcinoma: a case series.","title_en":"Knife-assisted endoscopic full-thickness resection of deeply invasive esophageal adenocarcinoma: a case series.","authors":"Poortmans PJ, Argenziano ME, Montori M, Sorge A, Debels L, Desomer L, Tate DJ","affiliation_highlight":"Department of Gastroenterology and Hepatology, University Hospital Ghent (UZ Gent), Gent, Belgium.","results":"BACKGROUND AND AIMS: Esophageal adenocarcinoma (EAC) incidence is rising globally, and current therapeutic options carry substantial morbidity and mortality. We report the feasibility and early outcomes of knife-assisted…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND AND AIMS: Esophageal adenocarcinoma (EAC) incidence is rising globally, and current therapeutic options carry substantial morbidity and mortality. We report the feasibility and early outcomes of knife-assisted endoscopic full-thickness resection (kFTR) as a palliative local control in nonsurgical candidates. METHODS: Three patients with suspected locally advanced distal EAC (clinical tumor stage T1b-T2), no nodal or distant disease, and high Charlson Comorbidity Index scores were unfit for surgery and declined chemoradiotherapy. All consented to kFTR: a submucosal pocket was created cranial to the suspected invasive area, the muscle-retracting sign was identified, and the muscularis propria was incised to access the periesophageal space. The lesion was dissected laterally and resected en bloc. A fully covered metal stent was then placed. RESULTS: Patients resumed oral intake on day 5 without major adverse events. All had EAC pathologic tumor stage 1b with invasion into the deepest layer of the submucosa; 2 had positive vertical margins. One remained disease-free (24 months); 2 had local recurrence by 6 months but remained asymptomatic at last follow-up (10 and 14 months). CONCLUSIONS: In carefully selected symptomatic, inoperable patients, kFTR achieved short-to-medium term symptom control for locally advanced EAC with acceptable safety.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42887769","pmid":"42887769","pmcid":"","doi":"10.1016/j.jcpo.2026.100822","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42887769/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"J Cancer Policy","journal_full":"Journal of cancer policy","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Trends in Diversity among Medical Cancer Workforce Trainees in the United States over Fifteen years.","title_en":"Trends in Diversity among Medical Cancer Workforce Trainees in the United States over Fifteen years.","authors":"Favorito FM, Bratti VF, Hopman W, Florez N, Dee EC, Feliciano EJG, Jemal A, de Moraes FY et al.","affiliation_highlight":"Faculdade de Ciências Médicas da Santa Casa de São Paulo, São Paulo, Brazil.","results":"PURPOSE: Diverse oncology workforces improve care quality, patient satisfaction, and outcomes, particularly among underserved populations. This study aimed to evaluate long-term demographic and educational trends among U…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: Diverse oncology workforces improve care quality, patient satisfaction, and outcomes, particularly among underserved populations. This study aimed to evaluate long-term demographic and educational trends among U.S. cancer-related medical trainees and examine how these trends have shifted across specialties over a 15-year period. MATERIALS AND METHODS: Publicly available data were sourced from the Accreditation Council for Graduate Medical Education (ACGME) Data Resource Books. Gender and educational-background trends were evaluated from 2007-2023, while race/ethnicity trends were evaluated from 2011-2023 across cancer-related physician training programs, including hematology-medical oncology, medical oncology, radiation oncology, surgical oncology, pediatric hematology-oncology, medical genetics, pathology, diagnostic and interventional radiology, and nuclear medicine. Demographic variables included gender, race/ethnicity, and age; educational background was categorized as U.S. allopathic, U.S. osteopathic, or international medical graduate (IMG). Trends were assessed using the nonparametric Mann-Kendall test, with P<.05 indicating statistical significance. RESULTS: Between 2007 and 2023, female trainee representation rose significantly (47.0% to 51.5%; p<0.001), with notable gains in pediatric hematology-oncology and medical oncology. Hispanic/Latino representation increased significantly from 7.9% to 11.6% overall (p<0.001), while African American/Black representation remained unchanged (7.1% to 7.5%; p>0.05). Asian/Pacific Islander proportions rose in select specialties. The percentage of U.S. osteopathic graduates increased across most specialties (5.1% to 16.2%; p<0.001), whereas IMG representation declined slightly overall. U.S. allopathic representation decreased from 62.9% to 53.3% (p<0.001), with variation across specialties. CONCLUSION: While gains in gender and Hispanic/Latino representation are evident, African American/Black trainee representation remains stagnant, and changes in IMG participation vary across specialties. These diverging trends highlight persistent representation gaps within the U.S. cancer workforce training pipeline. Continued monitoring will be important to determine how evolving educational and accreditation policies influence these trends over time. POLICY SUMMARY: Based on these findings, program directors and professional societies should maintain inclusive recruitment practices and continue systematic monitoring of workforce diversity as accreditation policies evolve. Sustained institutional commitment may help preserve patient trust, address workforce needs, and support an oncology workforce that better reflects the populations it serves.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42883336","pmid":"42883336","pmcid":"","doi":"10.3390/molecules31193572","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42883336/","notice_url":"","trial_url":"","pub_date":"2026-Oct-08","briefing_date":"2026-10-18","journal_abbr":"Molecules","journal_full":"Molecules (Basel, Switzerland)","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Selective Cytotoxic Activity of Derivatives of the Natural Alkaloid Tetrandrine Against Cancer Cell Lines: In Vitro and In Silico Studies.","title_en":"Selective Cytotoxic Activity of Derivatives of the Natural Alkaloid Tetrandrine Against Cancer Cell Lines: In Vitro and In Silico Studies.","authors":"Alvarez-Campa MD, López-Saiz CM, Trujillo-Ruiz HE, Del-Toro-Sánchez CL, Gálvez-Ruiz JC, Moreno-Corral RA, Plascencia-Jatomea M, Soto-Sánchez AH et al.","affiliation_highlight":"Departamento de Investigación y Posgrado en Alimentos, Universidad de Sonora, Rosales y Encinas s/n, Colonia Centro, Her…","results":"Tetrandrine (TET) is a bisbenzylisoquinoline alkaloid with promising anticancer activity, although its limited selectivity toward malignant over non-cancerous cells restricts its therapeutic potential. A series of mono- …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Tetrandrine (TET) is a bisbenzylisoquinoline alkaloid with promising anticancer activity, although its limited selectivity toward malignant over non-cancerous cells restricts its therapeutic potential. A series of mono- and bis-N-substituted tetrandrine derivatives was therefore investigated to determine whether N-functionalization could improve the cytotoxic selectivity of the parent scaffold. The series included the two new compounds MU1NT and DPBT. Following initial screening in non-cancerous ARPE-19 retinal epithelial cells, selected derivatives were evaluated against 22Rv1 prostate carcinoma, A549 lung adenocarcinoma, MDA-MB-231 triple-negative breast cancer, HCT-116 colorectal carcinoma, and HeLa cervical cancer cells. TET exhibited broad but poorly selective cytotoxicity, with IC50 values of 6.81 ± 1.79 and 6.00 ± 1.96 μM in ARPE-19 and 22Rv1 cells, respectively, corresponding to a selectivity index (SI) of 1.13. By contrast, DBT showed IC50 values of 45.44 ± 1.37 μM in ARPE-19 cells and 9.89 ± 1.08 μM in 22Rv1 cells, with an SI of 4.59, the highest experimentally determined value among the tetrandrine-based compounds evaluated. MU1NT also displayed improved selectivity toward 22Rv1 cells (SI = 2.57), although with lower cytotoxic potency than DBT. Fluorescence microscopy using DAPI and phalloidin revealed pronounced nuclear and cytoskeletal alterations in DBT-treated 22Rv1 cells, whereas ARPE-19 morphology was comparatively preserved. Annexin V-FITC/PI flow cytometry further demonstrated an apoptosis-associated response in 22Rv1 cells, with total apoptosis reaching 86.30 ± 1.27% for TET and 34.77 ± 5.13% for DBT after 24 h at their respective MTT-derived IC50 concentrations. Molecular docking suggested distinct predicted interaction profiles for TET and DBT across the apoptosis-related proteins evaluated. Targeted redocking of co-crystallized venetoclax validated the Bcl-2 site-specific protocol (RMSD = 0.55 Å); however, both alkaloids scored less favorably than venetoclax, and the small score difference between TET and DBT did not account for their distinct cellular selectivity profiles. Collectively, these findings identify DBT as a promising tetrandrine derivative with improved selectivity, warranting further mechanistic studies and in vivo evaluation in prostate cancer models.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42879523","pmid":"42879523","pmcid":"","doi":"10.1021/acsami.6c15053","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42879523/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-18","journal_abbr":"ACS Appl Mater Interfaces","journal_full":"ACS applied materials & interfaces","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A Dual-Functional Hydrogel Coating for Expanded Polytetrafluoroethylene Endografts with Antibacterial and Interface-Sealing Functions.","title_en":"A Dual-Functional Hydrogel Coating for Expanded Polytetrafluoroethylene Endografts with Antibacterial and Interface-Sealing Functions.","authors":"Lou Y, Chen Y, Sun Y, Jia X, Xu C, Wu J, Ding C, Ji S et al.","affiliation_highlight":"Department of Vascular Surgery, Center for Regenerative and Aging Medicine, The Fourth Affiliated Hospital of School of …","results":"Although expanded polytetrafluoroethylene (ePTFE) endografts provide excellent mechanical exclusion of aneurysm blood flow, they remain biologically inert and lack surface functions that actively prevent bacterial coloni…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Although expanded polytetrafluoroethylene (ePTFE) endografts provide excellent mechanical exclusion of aneurysm blood flow, they remain biologically inert and lack surface functions that actively prevent bacterial colonization or promote favorable graft-vessel interface responses following implantation. Here, we report a dual-functional hydrogel coating for ePTFE vascular grafts that integrates antibacterial protection with localized procoagulant activity at the graft-vessel interface. The coating, denoted as ZnO@CH, is prepared via in situ photopolymerization of methacryloyl-modified chitosan (CSMA) incorporating zinc oxide (ZnO) nanoparticles, forming a stable, spatially confined functional layer on the outer surface of ePTFE grafts. In vitro and in vivo evaluations demonstrate that the coating exhibits potent broad-spectrum antibacterial activity against Escherichia coli and methicillin-resistant Staphylococcus aureus while maintaining cytocompatibility with vascular endothelial cells. The ZnO@CH hydrogel promoted localized thrombus formation in a rat abdominal aorta model. Separately, an in vitro liquid-barrier assay showed that hydrogel-coated ePTFE retained its barrier function under the tested conditions. Systemic safety assessments in rodent models reveal no significant acute or chronic toxicity. Collectively, this dual-functional coating strategy offers a promising biomaterial approach for improving the biological performance of ePTFE vascular grafts.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893554","pmid":"42893554","pmcid":"","doi":"10.1093/dote/doag117","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893554/","notice_url":"","trial_url":"","pub_date":"2026-Sep-02","briefing_date":"2026-10-18","journal_abbr":"Dis Esophagus","journal_full":"Diseases of the Esophagus","tier":"C","if_val":null,"zone":"未收录","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Lessons learned: Digital epidemiology of eosinophilic esophagitis and what Google Trends reveals.","title_en":"Lessons learned: Digital epidemiology of eosinophilic esophagitis and what Google Trends reveals.","authors":"Ketchem CJ, Reed CC, Dellon ES","affiliation_highlight":"Division of Gastroenterology and Hepatology, Department of Medicine, Northwestern University Feinberg School of Medicine…","results":"Eosinophilic esophagitis (EoE) is a chronic, immune-mediated disease whose incidence and prevalence have continued to rise, yet little is known about how public awareness has evolved alongside clinical progress. We used …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Eosinophilic esophagitis (EoE) is a chronic, immune-mediated disease whose incidence and prevalence have continued to rise, yet little is known about how public awareness has evolved alongside clinical progress. We used Google Trends, a freely available tool that indexes the relative popularity of search queries from 0 to 100, to examine interest in the terms 'eosinophilic esophagitis' and 'EoE' in the United States from January 2004 through December 2025, and to compare the disease term with searches for regulatory-approved EoE-relevant therapies (dupilumab/Dupixent, budesonide/Eohilia, and budesonide/Jorveza) in the United States and worldwide (English-language). Search interest for 'eosinophilic esophagitis' rose substantially across two decades (+2.97 points/year; P < 0.001), with segmented regression at clinical milestones showing significant slope changes at 2007, 2011, 2013, 2020, and 2024 (all P ≤ 0.04). Secondary analysis of the 'EoE' acronym corroborated these patterns, rising across the study period (+1.3 points/year; P < 0.001) with a final-year rise (+18.2 points/year). Searches for 'Dupixent' exceeded disease-term searches in both the United States and worldwide (English-language). Seasonal and monthly variation did not statistically differ. These observations illustrate how digital epidemiology has potential to serve as a low-cost barometer of disease awareness and information-seeking behavior. As patients increasingly turn from search engines to conversational artificial intelligence, these signals may evolve and further research is needed to define how digital epidemiology best be integrated with conventional epidemiologic data.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"C"}},{"id":"pmid_42890858","pmid":"42890858","pmcid":"PMC10906289","doi":"10.7759/cureus.116363","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42890858/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-18","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"病例报告（2例）· 诊断线索描述","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":32,"score_breakdown":{"clinical":12,"methodology":5,"specialty":15,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Bazex综合征作为隐匿恶性肿瘤皮肤标志：两例老年男性伴食管鳞癌的病例报告","title_en":"Bazex Syndrome as a Cutaneous Marker of Occult Malignancy: A Report of Two Cases.","authors":"Dias Silva B, Fernandes I, Camões S, Reis F, Olivério Ribeiro J","affiliation_highlight":"Department of Internal Medicine, Unidade Local de Saúde de Viseu Dão-Lafões, Viseu, PRT.","results":"","authors_conclusion":"这些病例强调识别Bazex综合征临床模式作为潜在恶性肿瘤标志的诊断价值；对出现 compatible 肢端银屑病样皮损、尤其具有相关癌症危险因素的老年患者，该特征性临床模式应促使系统排查隐匿性恶性肿瘤。","ai_note":"仅为2例病例报告，无对照、无诊断收益率或随访数据，无法推断Bazex综合征筛查隐匿恶性肿瘤的效能；皮肤活检均为非特异性病理表现，诊断依赖临床模式；存在病例报告的选择性发表偏倚可能；摘要未提供定量结果。","pico":{"p":"两例老年男性，表现为特征性肢端及面部银屑病样皮损","ic":"皮肤活检及临床恶性肿瘤筛查；无对照干预"},"reason":"提示胸外科/肿瘤科在难治性肢端银屑病样皮损患者中警惕食管鳞癌等隐匿肿瘤，影响皮肤表现出现时的排查路径；但证据级别仅为病例报告。","abstract_en":"Acrokeratosis paraneoplastica (Bazex syndrome) is a rare paraneoplastic dermatosis characterized by psoriasiform lesions predominantly affecting acral sites and is most commonly associated with squamous cell carcinomas of the upper aerodigestive tract. Cutaneous manifestations may precede the diagnosis of the underlying malignancy, making their recognition an important diagnostic clue. We report two cases of Bazex syndrome in older men presenting with characteristic acral and facial psoriasiform lesions. In both patients, skin biopsy revealed nonspecific histopathological findings, while the clinical pattern prompted investigation for an underlying malignancy. The first patient was subsequently diagnosed with metastatic oesophageal squamous cell carcinoma. In the second patient, investigation revealed two synchronous malignancies: a large-cell neuroendocrine carcinoma and an oesophageal squamous cell carcinoma. These cases emphasize the diagnostic value of recognizing the clinical pattern of Bazex syndrome as a marker of underlying malignancy. In patients presenting with compatible acral psoriasiform lesions, particularly older individuals with relevant cancer risk factors, this distinctive clinical pattern should prompt systematic investigation for an occult malignancy.","tags":["Bazex综合征","副肿瘤性皮肤病","食管鳞癌","病例报告"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42893558","pmid":"42893558","pmcid":"","doi":"10.1002/wjs.70610","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42893558/","notice_url":"","trial_url":"","pub_date":"2026-Oct-18","briefing_date":"2026-10-18","journal_abbr":"World J Surg","journal_full":"WORLD JOURNAL OF SURGERY","tier":"B","if_val":2.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"观点/论述类文章（Perspective）· 无原始数据，基于文献与框架整合提出政策主张","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":23,"score_breakdown":{"clinical":8,"methodology":9,"specialty":6,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"儿童外科体系无法脱离儿科麻醉单独强化：将儿科麻醉定位为卫生系统核心功能的论述与整合框架（IPASF）","title_en":"Safe Surgery Starts With Safe Anesthesia: Positioning Pediatric Anesthesia as a Core Health-System Function Within Global Children's Surgical Systems.","authors":"Gathuya ZN, Mutio EM, Mboya E, Nabukenya MT, Mumphansha H","affiliation_highlight":"Department of Anaesthesia, The Nairobi Hospital, Nairobi, Kenya.","results":"","authors_conclusion":"安全且公平的儿童外科需要有针对性地投资于支撑安全麻醉的系统；IPASF 为围手术期连续体中的政策、实施、教育、研究与评估提供了实用框架。","ai_note":"本文为观点性论述，无原始数据、无对照、无量化效应估计，全部结论为规范性主张而非实证结果；IPASF 为作者自建整合框架，未经外部验证或落地评估，其可行性、成本与效果均信息不足；引用 WHO 卫生系统模块、Lancet Commission、NSOAP、GICS 等框架属选择性叙事的权威背书，未系统评价证据等级；与胸外科/胸部肿瘤的临床决策关联间接，主要外推价值在围手术期体系与资源配置层面。","pico":{"p":"","ic":""},"reason":"为儿科围手术期与麻醉资源配置提供政策论证框架，可用于全球外科/围手术期体系研究的立论背景与框架引用，但不提供可直接改变成人胸外科临床判断的证据。","abstract_en":"BACKGROUND: Children's surgery is increasingly recognized as a global health priority, yet pediatric anesthesia remains comparatively under-recognized despite being essential for safe surgical and perioperative care. THE PROBLEM: Children require specialized expertise, age-appropriate equipment, reliable monitoring, oxygen, medicines, recovery, and critical care. In many low- and middle-income countries, deficiencies across these domains limit access and contribute to preventable perioperative morbidity and mortality. THE CENTRAL CLAIM: We posit that children's surgical systems cannot be strengthened without parallel investment in pediatric anesthesia systems. Pediatric anesthesia should therefore be recognized as a cross-cutting core health-system function rather than a supporting clinical specialty. EVIDENCE SYNTHESIS: This perspective integrates the WHO Health Systems Building Blocks, the Lancet Commission on Global Surgery, National Surgical, Obstetric and Anesthesia Plans, the GICS Optimal Resources for Children's Surgery framework, and Donabedian's Structure-Process-Outcome model into an Integrated Pediatric Anesthesia Systems Framework (IPASF). RECOMMENDATIONS: Governments, professional societies, academic institutions, global surgery organizations, and development partners should integrate pediatric anesthesia into surgical-system planning, workforce development, financing, service delivery, quality improvement, and research. CONCLUSION: Safe and equitable children's surgery requires deliberate investment in the systems that enable safe anesthesia. The IPASF provides a practical framework for policy, implementation, education, research, and evaluation across the perioperative continuum.","tags":["全球外科","儿科麻醉","卫生系统框架","围手术期","政策论述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42885582","pmid":"42885582","pmcid":"","doi":"10.1093/jncics/pkag115","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42885582/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"JNCI Cancer Spectr","journal_full":"JNCI Cancer Spectrum","tier":"B","if_val":4.8,"zone":"JCR Q2 · 3区","warned":false,"study_type":"Commentary/观点评论 · 非系统评价、无原始数据","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":20,"score_breakdown":{"clinical":10,"methodology":6,"specialty":4,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"可操作基因组发现常未转化为匹配治疗：精准肿瘤学实施障碍与公平性评论","title_en":"When Actionable Genomic Findings Do Not Translate into Treatment in Precision Oncology.","authors":"Cobran EK","affiliation_highlight":"Department of Quantitative Health Science, Mayo Clinic College of Medicine and Science, Scottsdale, Arizona, USA.","results":"","authors_conclusion":"作者主张：精准肿瘤学下一项实施挑战是使具有临床意义的基因组发现具备现实可操作性；全面基因组检测应足够早以影响治疗规划，分子肿瘤委员会建议应与现实治疗及试验机会连接，提出建议时应预判经济与保险障碍，公平性评价应超越检测可及性并纳入是否接受基因组指导治疗。精准肿瘤学不应仅以识别治疗机会来评判，还应以患者能否在临床相关窗口内获得这些机会来评判。","ai_note":"本文为观点评论，无原始研究人群、对照、终点或效应量；摘要未提供支持“推荐至治疗启动之间存在显著流失”的定量证据，障碍列举属专家论述；结论具政策倡导性，不能作为实施效果或干预有效性的证据。","pico":{"p":"","ic":""},"reason":"该评论提示精准肿瘤学中分子可操作性与实际治疗可及性之间存在落差，可影响晚期肿瘤患者基因组检测时机、分子肿瘤委员会转介及试验/付费可行性评估；对胸外科直接手术决策影响有限。","abstract_en":"Comprehensive genomic profiling has expanded the ability to identify potentially actionable molecular alterations across cancers, but identification of an actionable finding does not ensure that a patient will receive a genomically matched therapy. Studies of precision-oncology programs and molecular tumor boards consistently demonstrate substantial attrition between treatment recommendation and treatment initiation. The reasons extend beyond molecular interpretation and include the timing of genomic profiling, clinical deterioration, geographic availability of biomarker-selected trials, insurance and financial barriers, and disparities in access to specialty cancer care. Importantly, these barriers arise after a potentially useful molecular finding has already been identified, creating a distinction between molecular actionability and practical treatment access. This commentary argues that the next implementation challenge for precision oncology is to make clinically meaningful genomic findings realistically actionable. Comprehensive genomic profiling should occur early enough to inform treatment planning; molecular tumor board recommendations should be linked to realistic treatment and trial opportunities; financial and insurance barriers should be anticipated when recommendations are made; and equity should be evaluated beyond access to testing to include receipt of genomically informed treatment. As genomic profiling becomes increasingly integrated into routine cancer care, precision oncology should be judged not only by its ability to identify therapeutic opportunities but also by whether patients can reach those opportunities while they remain clinically relevant.","tags":["精准肿瘤学","基因组检测","可操作性","治疗可及性","观点评论"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888274","pmid":"42888274","pmcid":"12339972","doi":"10.1016/j.compbiomed.2021.105111","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888274/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-18","journal_abbr":"Cell Mol Life Sci","journal_full":"Cellular and molecular life sciences : CMLS","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"叙述性综述 · 无原始研究数据（非系统综述）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":11,"score_breakdown":{"clinical":6,"methodology":5,"specialty":0,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"HPV感染至宫颈癌前病变的分子机制、免疫微环境与新兴技术综述（无原始数据）","title_en":"From HPV infection to cervical precancer: Molecular mechanisms, immune microenvironment and emerging technologies.","authors":"Zhou Y, Ge Y, Liu K, Liu H, Dong Z","affiliation_highlight":"Department of Pathophysiology, School of Basic Medical Sciences, College of Medicine, State Key Laboratory of Metabolic …","results":"","authors_conclusion":"整合基因组学、转录组学、免疫治疗和人工智能将实现更个性化和有效的干预，最终降低全球宫颈癌负担。","ai_note":"非胸部肿瘤主题；为叙述性综述，未报告系统检索、纳入排除标准或原始数据；摘要将p16、Ki67、miRNA、单细胞RNA测序、空间转录组及深度学习列为‘有前景’，但无性能数值或验证证据；对AI诊断仅提数据变异性和可解释性挑战，信息不足。","pico":{"p":"","ic":""},"reason":"不直接影响胸外科/胸部肿瘤临床判断；仅可提示AI与分子分型在癌前病变综述中的概念框架，不能外推至胸部肿瘤决策。","abstract_en":"Cervical cancer remains a leading cause of cancer-related mortality among women globally, with persistent high-risk human papillomavirus (HPV) infection as the primary etiological factor. Cervical precancerous lesions, including high-grade squamous intraepithelial lesions and adenocarcinoma in situ, represent the critical window for intervention prior to invasive cancer development. However, additional factors such as immunosuppression, smoking, and microbiome composition also play crucial roles in the development of cervical precancerous lesions. While HPV vaccination, screening, and treatment have reduced cancer incidence, these must be complemented by personalized approaches that target the molecular mechanisms driving carcinogenesis. Key dysregulated tumor suppressors (e.g., p16) and signaling pathways (PI3K/AKT/mTOR, Wnt/β-catenin) highlight the need for advanced therapeutic strategies. The immune microenvironment also plays a critical role in cancer progression, suggesting potential for immunotherapy. Promising biomarkers like p16, Ki67, and microRNAs require integration with technologies such as single-cell RNA sequencing and spatial transcriptomics for deeper insights into tumor heterogeneity and microenvironment dynamics. Additionally, while deep learning models hold promise in improving diagnostic accuracy for cervical intraepithelial neoplasia (CIN), challenges such as data variability and interpretability need addressing. In conclusion, incorporating genomics, transcriptomics, immunotherapy, and artificial intelligence will enable more personalized and effective interventions, ultimately reducing the global burden of cervical cancer.","tags":["HPV","宫颈癌前病变","免疫微环境","人工智能","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42888105","pmid":"42888105","pmcid":"","doi":"10.1016/j.pathol.2026.08.013","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42888105/","notice_url":"","trial_url":"","pub_date":"2026-Sep-22","briefing_date":"2026-10-18","journal_abbr":"Pathology","journal_full":"PATHOLOGY","tier":"B","if_val":3.9,"zone":"JCR Q1 · 3区","warned":false,"study_type":"非原始研究 · 指南/观点综述（病理学家视角）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":10,"score_breakdown":{"clinical":5,"methodology":4,"specialty":1,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"澳大利亚HIV感染者肛门癌筛查指南：病理学家视角的筛查路径解读","title_en":"Preventing cancer Down Under: Australian screening guidelines for prevention of anal cancer in people living with HIV: the pathologists' viewpoint.","authors":"Roberts JM, Armstrong BH, Corbett-Burns S, Turner RC, Dyer CEF, Jin F, Hillman RJ, Grulich AE et al.","affiliation_highlight":"Douglass Hanly Moir Pathology, Macquarie Park, NSW, Australia; Kirby Institute, University of New South Wales, Kensingto…","results":"","authors_conclusion":"The pathologist's role will be critical to the success of this endeavour.","ai_note":"非原始研究，无研究设计、样本量、终点数据或效应量；为专家观点/指南路径解读，存在专家意见偏倚且无法评估筛查算法的实际效果；与胸部肿瘤无直接关系。","pico":{"p":"HIV感染者（PLHIV），澳大利亚筛查指南目标人群；样本量未报告","ic":"基于HPV检测及基因分型的筛查，高危HPV阳性者以液基细胞学（LBC）分流；对照未描述"},"reason":"几乎不影响胸外科临床决策；仅可作为跨瘤种HPV相关筛查与病理沟通框架的背景参考。","abstract_en":"Anal squamous cell carcinoma (ASCC) is a human papillomavirus (HPV)-associated cancer with a rising incidence. People living with human immunodeficiency virus (PLHIV) are at the highest risk. Recent evidence has shown that treatment of the precursor lesion, high-grade squamous intraepithelial lesion (HSIL), can prevent cancer development. Consequently, several countries have published screening guidelines for anal HSIL as a strategy to decrease cancer incidence. In Australia, the Australasian Society for HIV, Viral Hepatitis and Sexual Health Medicine (ASHM) has recently released guidelines for PLHIV, based on HPV testing and genotyping, with liquid-based cytology (LBC) used as a triage tool for those testing positive to high-risk HPV. The pathologist's role will be critical to the success of this endeavour. This article describes the scientific basis for the recommended screening algorithm. The key features of each testing component are outlined, including anal swab collection, biopsy interpretation and the importance of relevant clinical information, to enhance communication between pathologist and clinician. Future developments are discussed, including the possibility of extension of the benefits of such screening to other at-risk groups.","tags":["肛门癌","HIV","筛查指南","病理学"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42880082","pmid":"42880082","pmcid":"","doi":"10.1016/j.biomaterials.2026.124694","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42880082/","notice_url":"","trial_url":"","pub_date":"2026-Oct-12","briefing_date":"2026-10-18","journal_abbr":"Biomaterials","journal_full":"Biomaterials","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"临床前机制与治疗研究 · 细胞实验与帕金森病小鼠模型","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":9,"score_breakdown":{"clinical":1,"methodology":8,"specialty":0,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"电子结构工程化纳米调节剂调控铁-ROS循环治疗帕金森病的临床前研究","title_en":"Regulating the iron-ROS cycle via electronic structure-engineered nanoregulators for Parkinson's disease therapy.","authors":"Qin Y, Xu J, Boyer C, Prince S, Kang H, Akhtar M, Wang Y, Huang R et al.","affiliation_highlight":"State Key Laboratory of Metabolic Dysregulation & Prevention and Treatment of Esophageal Cancer, Tianjian Laboratory of …","results":"","authors_conclusion":"","ai_note":"与胸部肿瘤临床无关；为临床前细胞/动物研究，摘要未报告样本量、对照设置、统计量与效应值；“疾病修饰”及与左旋多巴联用持续神经保护属外推性表述，缺乏定量证据；信息不足，无法用于胸外科临床判断。","pico":{"p":"帕金森病相关细胞模型与帕金森病小鼠；样本量摘要未报告","ic":"干预：氮掺杂草药来源碳点纳米调节剂；对照：摘要未明确报告"},"reason":"与胸外科/胸部肿瘤临床判断无直接关联；仅可作为纳米药物临床前评价方法学的旁证，不改变胸部肿瘤诊疗决策。","abstract_en":"Iron-driven reactive oxygen species (ROS) amplification forms a self-sustaining pathological cycle in Parkinson's disease (PD), yet remains difficult to therapeutically interrupt due to the lack of strategies that coordinate metal homeostasis and redox regulation. Here, we report an electronic-structure-engineered nanoregulatory strategy that regulates the iron-ROS cycle rather than passively scavenging ROS. Nitrogen-doped, herbal-derived carbon dots (CD) were rationally constructed to establish a conjugated electronic framework, in which heteroatom-induced electron delocalization defined redox-active sites and governed the coupling between iron chelation and catalytic ROS regulation. This structure-electronic state-function relationship enabled programmable disruption of the iron-ROS feedback loop at its source. Functionally, the nanoregulators achieved low-density lipoprotein receptor-related protein 1 (LRP1)-mediated brain delivery, exhibited efficient central nervous system exposure, and underwent brain clearance via the cerebrospinal fluid pathway. At the cellular level, they restored mitochondrial function, suppressed ferroptosis-associated lipid peroxidation, and reprogramed stress-related pathways toward neuronal survival. Transcriptomic analysis further revealed coordinated regulation of redox, metabolic, and inflammatory networks. In Parkinsonian mice, this strategy reduced iron deposition, preserved dopaminergic neurons, and improved motor function. Integration with levodopa further enabled sustained, disease-modifying neuroprotection.","tags":["帕金森病","纳米调节剂","铁-ROS循环","临床前研究","非胸部肿瘤"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42880078","pmid":"42880078","pmcid":"","doi":"10.1016/j.molimm.2026.10.003","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/428800   }
  const index=list.findIndex(item=>item.id===p.id),marked=state.read.has(p.id),status=statusOf(p),degraded=p.publish_state==='degraded';
  const paperUrl=safeUrl(p.url),trialUrl=safeUrl(p.trial_url),doi=String(p.doi||'').trim();
  const score=Number(p.score_total),hasScore=hasValue(p.score_total)&&Number.isFinite(score);
  const trial=p.nct_id?(trialUrl?`<a class="action-btn wide" href="${esc(trialUrl)}" target="_blank" rel="noopener">查看 ${esc(p.nct_id)} 试验记录 ↗</a>`:`<span class="action-btn wide">试验号 ${esc(p.nct_id)} · 链接 —</span>`):'';
  const paperLink=paperUrl?`<a class="action-btn primary" href="${esc(paperUrl)}" target="_blank" rel="noopener">打开题录 ↗</a>`:'<span class="action-btn primary">题录链接 —</span>';
  const doiLink=doi?`<a class="action-btn" href="https://doi.org/${encodeURIComponent(doi)}" target="_blank" rel="noopener">DOI 原文 ↗</a>`:'<span class="action-btn">DOI —</span>';
  const scoreTrack=hasScore?`<div class="score-track" aria-label="评分 ${score} 分"><i style="width:${Math.max(0,Math.min(100,score))}%"></i></div>`:'';
  const abstract=p.abstract_en||p.results||'';
  $('#detail').innerHTML=`<div class="detail-inner ${status.kind==='retracted'?'is-retracted':''}">
    <div class="detail-top"><span class="lock-id">SIGNAL LOCK / ${String(index+1).padStart(2,'0')}</span><span class="status-pill ${['retracted','concern','corrected'].includes(status.kind)?'has-icon':''} ${status.cls}">${status.label}</span></div>
    ${noticeMarkup(p,status)}
    <div class="detail-journal"><div><div class="journal-name">${esc(p.journal_full||p.journal_abbr||'—')}</div><div class="journal-meta">${esc(journalName(p))} · ${esc(show(p.pub_date))} · ${esc(show(p.tier))} 档</div></div><div class="score-box"><b>${esc(show(p.score_total))}</b><small>评分 · ${esc(show(p.score_source))}</small></div></div>
    ${scoreTrack}
    <h2 class="detail-title">${esc(p.title_zh||p.title_en||'—')}</h2>
    <div class="badges"><span class="badge accent">${esc(p.category_label||categoryOf(p.category).label)}</span><span class="badge">${esc(show(p.study_type))}</span>${p.nct_id?`<span class="badge">${esc(p.nct_id)}</span>`:''}${degraded?'<span class="badge paused">解读暂停</span>':''}</div>
    <div class="meta-grid">
      <div class="meta-cell"><small>PMID</small><b>${esc(show(p.pmid))}</b></div><div class="meta-cell"><small>出版状态</small><b>${esc(status.label)}</b></div>
      <div class="meta-cell"><small>影响因子 · 源值</small><b>${esc(show(p.if_val || null))}</b></div><div class="meta-cell"><small>分区 · 源值</small><b>${esc(show(p.zone))}</b></div><div class="meta-cell"><small>预警状态</small><b>${p.warned ? '⚠ 在预警名单' : '正常'}</b></div>
      <div class="meta-cell"><small>雷达日期</small><b>${esc(show(p.briefing_date))}</b></div><div class="meta-cell"><small>卷 / 期</small><b>${esc(issueOf(p))}</b></div>
      <div class="meta-cell"><small>评分口径</small><b>${esc(show(p.score_source))}</b></div><div class="meta-cell"><small>精选状态</small><b>${p.curated?'已入选':'未入选 · 不凑数'}</b></div>
    </div>
    <div class="interpretation">
      <div class="excerpt-label"><b>摘要导读</b><span>原始字段 · 非全文</span></div>
      <p class="excerpt">${esc(abstract||'摘要摘录暂缺，请通过题录链接查阅原文。')}</p>
      ${interpretationMarkup(p,degraded)}
    </div>
    <div class="detail-actions">${paperLink}${doiLink}${trial}<button class="action-btn wide ${marked?'marked':''}" id="mark-read">${marked?'✓ 已扫 · 点击撤销':'标记本篇已扫'}</button></div>
    <div class="detail-nav"><button class="nav-btn" id="prev-btn">← 上一信号</button><span class="nav-position">${index+1} / ${list.length}</span><button class="nav-btn" id="next-btn">下一信号 →</button></div>
  </div>`;
  $('#mark-read')?.addEventListener('click',()=>{state.read.has(p.id)?state.read.delete(p.id):state.read.add(p.id);render()});
  $('#prev-btn')?.addEventListener('click',()=>step(-1));
  $('#next-btn')?.addEventListener('click',()=>step(1));
}
function renderFunnel(){
  const f=SITE_DATA.funnel||{};
  $('#funnel').innerHTML=[['初抓',f.fetched],['刊源匹配',f.journal_matched],['简报入库',f.final],['规则精选',f.curated]].map(([label,value])=>`<div class="funnel-step"><b>${esc(show(value))}</b>${label}${label==='规则精选'&&value===0?' · 空缺':''}</div>`).join('');
}
function renderHeader(){
  $('#scan-date').textContent=ANCHOR?ANCHOR.replaceAll('-','.')+' / ANCHOR':'— / NO DATA';
  const generated=String(SITE_DATA.generated_at||SITE_DATA.updated_at||'');
  $('#scan-time').textContent=`${generated?generated.slice(0,16):'生成时间 —'} · 状态分项标注`;
}
function render(){
  const base=windowPapers(),tierBase=base.filter(tierOk),journals=journalUniverse(tierBase),list=filtered();
  if(list.length&&!list.some(p=>p.id===state.selected))state.selected=list[0].id;
  renderWindow();renderCategoryFilters(base);renderTierFilters(base);renderQueue(list);renderJournalLegend(journals);renderDesignLegend(list);renderScope(list,tierBase,journals);renderDetail(list);
  const readCount=PAPERS.filter(p=>state.read.has(p.id)).length;
  $('#read-count').textContent=`${String(readCount).padStart(2,'0')} / ${PAPERS.length}`;
  document.querySelectorAll('[data-quick]').forEach(btn=>btn.classList.toggle('active',btn.dataset.quick===state.quick));
}
function selectPaper(id,scroll=false){
  if(!PAPERS.some(p=>p.id===id))return;
  state.selected=id;render();
  if(scroll&&matchMedia('(max-width:900px)').matches)document.querySelector('.detail-panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function step(direction){
  const list=filtered();if(!list.length)return;
  const index=list.findIndex(p=>p.id===state.selected);
  state.selected=list[(index+direction+list.length)%list.length].id;render();
}
function toggleJournal(name){
  state.journal=state.journal===name?null:name;render();
}
document.addEventListener('click',event=>{
  const select=event.target.closest('[data-select]');
  if(select){selectPaper(select.dataset.select,true);return}
  const category=event.target.closest('[data-category]');
  if(category){state.category=category.dataset.category;render();return}
  const quick=event.target.closest('[data-quick]');
  if(quick){state.quick=quick.dataset.quick;render();return}
  const tier=event.target.closest('[data-tier]');
  if(tier){const name=tier.dataset.tier;state.tiers.has(name)?state.tiers.delete(name):state.tiers.add(name);render();return}
  const journal=event.target.closest('[data-journal]');
  if(journal){toggleJournal(journal.dataset.journal);return}
  if(event.target.closest('#journal-clear')){state.journal=null;render();return}
});
$('#window-range').addEventListener('input',event=>{state.days=Number(event.target.value);render()});
$('#search').addEventListener('input',event=>{state.query=event.target.value;render()});
$('#theme-btn').addEventListener('click',()=>{
  const dark=document.documentElement.classList.toggle('dark');
  $('#theme-btn').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');
  $('#theme-icon').innerHTML=dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/>';
});
document.addEventListener('keydown',event=>{
  if(event.key==='/'&&document.activeElement!==$('#search')){event.preventDefault();$('#search').focus()}
  if(event.key==='Escape'){state.query='';state.category='all';state.quick='all';state.journal=null;state.tiers=new Set(TIERS);$('#search').value='';render();$('#search').blur()}
  if((event.key==='Enter'||event.key===' ')&&document.activeElement?.classList.contains('journal-sector')){event.preventDefault();toggleJournal(document.activeElement.dataset.journal);return}
  if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    if(event.key==='ArrowLeft')step(-1);if(event.key==='ArrowRight')step(1);
  }
});
async function loadRollingPapers(){
  try{
    const response=await fetch('data/radar_latest.json');
    if(!response.ok)throw new Error('rolling window unavailable');
    const payload=await response.json(),latest=Array.isArray(payload)?payload:payload?.papers;
    if(!Array.isArray(latest))throw new Error('rolling window schema mismatch');
    PAPERS=mergePapers(latest);ANCHOR=findAnchor(PAPERS);renderHeader();render();
  }catch(error){
    console.info('滚动窗数据不可用，已静默降级为注入数据。');
  }
}
ANCHOR=findAnchor(PAPERS);
renderHeader();renderFunnel();render();
loadRollingPapers();
</script>
</body>
</html>
