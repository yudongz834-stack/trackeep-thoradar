<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

与对照基线，但尚不足以改变当前患者选择或随访决策","abstract_en":"OBJECTIVES: Extensive-stage small cell lung cancer (ES-SCLC) remains an aggressive malignancy with limited durable responses to immune checkpoint inhibitors (ICIs) and no established predictive biomarkers. This study aimed to evaluate the prognostic and predictive value of tertiary lymphoid structures (TLSs) in patients with ES-SCLC receiving ICI-based therapy. METHODS: In this multicenter retrospective study of 180 treatment-naïve ES-SCLC patients subsequently receiving ICI-based therapy, TLSs were systematically evaluated using H&E staining, multiplex immunofluorescence, and spatial analysis to determine their prognostic and predictive value. RESULTS: TLSs were identified in 22.2% of cases and independently associated with improved overall survival (OS) in both univariate (HR = 0.365, 95% CI: 0.217-0.613, P < 0.001) and multivariate (HR = 0.337, 95% CI: 0.199-0.569, P < 0.001) analyses. Crucially, TLS maturation status was associated with clinical outcomes, as patients with mature TLSs containing CD21+ follicular dendritic cells and organized germinal centers experienced significantly longer survival than those with non-mature TLSs (P = 0.0049). Beyond mere presence, responders to ICIs exhibited distinct spatial characteristics, including higher TLS densities, denser immune infiltration, and shorter distances between TLS-resident CD20+ B cells, CD3+ T cells, and tumor cells, suggesting that immune-tumor spatial organization within TLSs reflects functional antitumor engagement. CONCLUSION: TLS maturation and spatial architecture may serve as candidate tissue biomarkers associated with clinical outcomes in ICI-treated ES-SCLC, warranting prospective validation alongside SCLC molecular subtyping.","tags":["ES-SCLC","三级淋巴结构","免疫治疗生物标志物","空间分析","回顾性队列"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903240","pmid":"42903240","pmcid":"PMC13680735","doi":"10.1002/ags3.70299","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903240/","notice_url":"","trial_url":"","pub_date":"2026-Oct-19","briefing_date":"2026-10-23","journal_abbr":"Ann Gastroenterol Surg","journal_full":"Annals of Gastroenterological Surgery","tier":"B","if_val":3.2,"zone":"JCR Q2 · 3区","warned":false,"study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Association of Prophylactic Abdominal Drain Placement With Short-Term Postoperative Outcomes After Hepatectomy: A Nationwide Inpatient Database Study in Japan.","title_en":"Association of Prophylactic Abdominal Drain Placement With Short-Term Postoperative Outcomes After Hepatectomy: A Nationwide Inpatient Database Study in Japan.","authors":"Kouzu K, Aso S, Hirano Y, Matsui H, Yoshimura K, Kitagawa H, Kato T, Yamane N et al.","affiliation_highlight":"Department of Surgery National Defense Medical College Saitama Japan.","results":"AIM: Although randomized trials have discouraged routine prophylactic abdominal drainage after uncomplicated hepatectomy, these drains are still widely used in clinical practice. This study evaluated the association betw…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"AIM: Although randomized trials have discouraged routine prophylactic abdominal drainage after uncomplicated hepatectomy, these drains are still widely used in clinical practice. This study evaluated the association between prophylactic abdominal drain placement and short-term outcomes after hepatic resection using a nationwide inpatient database. METHODS: We identified patients who underwent initial hepatic resection for liver tumors from the Japanese Diagnosis Procedure Combination database. Patients were classified into drain and no-drain groups according to whether a prophylactic abdominal drain was placed intraoperatively. In-hospital outcomes were compared using propensity score overlap weighting. Subgroup analyses were performed for intra-abdominal infection and in-hospital mortality. RESULTS: Among 73 613 eligible patients, 62 934 (85.5%) received prophylactic abdominal drains. After overlap weighting, the incidence of intra-abdominal infection did not differ significantly between the drain and no-drain groups (5.1% vs. 5.5%; risk difference, -0.3%; 95% confidence interval [CI], -0.8 to 0.1). Bile leakage, postoperative transfusion, postoperative drainage, and hospitalization costs were also comparable between groups. In contrast, prophylactic drain placement was associated with lower in-hospital mortality (0.5% vs. 1.0%; risk difference, -0.6%; 95% CI, -0.8 to -0.4). Subgroup analyses showed that this association was more evident in patients with low body mass index and those treated at low- or middle-volume hospitals. CONCLUSION: Prophylactic abdominal drain placement after hepatic resection was not associated with a lower incidence of intra-abdominal infection.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42902634","pmid":"42902634","pmcid":"","doi":"10.1177/00031348261501893","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42902634/","notice_url":"","trial_url":"","pub_date":"2026-Oct-20","briefing_date":"2026-10-23","journal_abbr":"Am Surg","journal_full":"The American surgeon","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"单中心前瞻性描述性队列 · 诊疗路径映射与访谈","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":51,"score_breakdown":{"clinical":19,"methodology":14,"specialty":18,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"总体","metric":"转移性疾病比例","val":"48%","stat":"","grounded":true,"checks":[{"num":"48%","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"总体","metric":"症状出现至报告症状时间","val":"85天","stat":"","grounded":true,"checks":[{"num":"85","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"总体","metric":"症状出现至诊断时间","val":"137天","stat":"","grounded":true,"checks":[{"num":"137","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"总体","metric":"诊断至开始治疗时间","val":"48天","stat":"","grounded":true,"checks":[{"num":"48","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"转移性 vs 局限区域性","metric":"至治疗时间","val":"72 vs 128天","stat":"P=0.014","grounded":true,"checks":[{"num":"72","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"128","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"},{"num":"0.014","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"手术患者","metric":"诊断至开始新辅助治疗时间","val":"57天","stat":"","grounded":true,"checks":[{"num":"57","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]},{"group":"手术患者","metric":"完成新辅助治疗至食管切除术时间","val":"97天","stat":"","grounded":true,"checks":[{"num":"97","grounded":true,"note":"数值命中（指标无可用锚词，仅存在性比对）"}],"missing_tokens":[]}],"ungrounded_numbers":["27"],"semantic_passed":false,"semantic_audit":[{"group":"总体","metric":"转移性疾病比例","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」未在原摘要出现","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"总体","metric":"症状出现至报告症状时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」未在原摘要出现","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"总体","metric":"症状出现至诊断时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」未在原摘要出现","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"总体","metric":"诊断至开始治疗时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「总体」未在原摘要出现","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"转移性 vs 局限区域性","metric":"至治疗时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「局限区域性」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"手术患者","metric":"诊断至开始新辅助治疗时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「手术」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]},{"group":"手术患者","metric":"完成新辅助治疗至食管切除术时间","population_ok":false,"metric_ok":false,"mismatch_reasons":["人群限定「手术」无英文锚（词典未收录，宁误杀）","终点指标词无可用锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"农村食管癌患者诊疗路径延迟与碎片化：单中心前瞻性描述性队列","title_en":"The Journey of Care for Rural Esophageal Cancer Patients.","authors":"Yang E, Kalmeta S, Goodwin N","affiliation_highlight":"Department of Surgery, Asante Three Rivers Medical Center, Grants Pass, OR, USA.","results":"共纳入27例；48%初诊即为转移性疾病；患者平均在症状出现后85天报告症状，症状出现后137天确诊，确诊后48天开始治疗；转移性患者至治疗时间短于局限区域性患者（72 vs 128天，P=0.014）；手术患者从确诊到开始新辅助治疗平均57天，完成新辅助治疗到食管切除术平均97天","authors_conclusion":"Rural esophageal cancer patients endure prolonged, fragmented, and variable care journeys. Surgical patients, in particular, face delays before esophagectomy. Rural research provides valuable insights for tailoring broader interventions for rural communities. In partnership, rural centers and universities provide both bottom-up and top-down perspectives in defragmenting rural esophageal cancer care.","ai_note":"单中心小样本描述性研究，无对照与风险调整；手术患者亚组例数未报告，新辅助至手术延迟的稳健性信息不足；转移性患者治疗更快可能受治疗目标与路径差异影响，摘要未说明校正；访谈3个月结果未量化呈现；时间间隔依赖患者报告与路径映射，回忆偏倚与选择偏倚信息不足。","pico":{"p":"2024年9月至2025年4月在农村癌症中心接受治疗的食管癌患者27例","ic":"无干预对照；观察性映射从症状出现至治疗的诊疗路径，并在入组时及3个月时访谈"},"reason":"量化农村食管癌从症状到治疗的多个延迟节点，为胸外科评估食管癌诊疗可及性、术前新辅助到手术衔接及农村转诊路径提供基线；可用于设计减少诊疗碎片化的干预研究。","abstract_en":"BackgroundRural esophageal cancer patients experience both fragmented and delayed care. One-size-fits-all interventions aimed at rural communities can be ineffective, as they can vary significantly in population, geographic isolation, and medical specialty availability. Therefore, as a rural health care center, we analyzed the journey of care for our esophageal cancer patients to better understand and serve our community. We aimed to create a framework for how to approach and analyze this complex care continuum for other small communities.MethodsEsophageal cancer patients receiving care at a rural cancer center from September 2024 to April 2025 were enrolled. Care journeys were mapped from symptom onset through treatment. Interviews occurred at enrollment and 3 months.ResultsTwenty-seven patients were enrolled. Nearly half (48%) presented with metastatic disease. Patients on average reported symptoms 85 days after onset, were diagnosed 137 days after onset, and started treatment 48 day after diagnosis. Metastatic patients experienced shorter times to treatment (72 vs 128 days, P = 0.014) compared to locoregional patients. Surgical patients averaged 57 days from diagnosis to starting neoadjuvant treatment, followed by 97 days from completing neoadjuvant treatment to esophagectomy. Patients reported disempowerment, difficulty navigating the medical system, and a lack of awareness before diagnosis.ConclusionsRural esophageal cancer patients endure prolonged, fragmented, and variable care journeys. Surgical patients, in particular, face delays before esophagectomy. Rural research provides valuable insights for tailoring broader interventions for rural communities. In partnership, rural centers and universities provide both bottom-up and top-down perspectives in defragmenting rural esophageal cancer care.","tags":["农村医疗","食管癌","诊疗延迟","照护连续性","单中心描述性研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42904735","pmid":"42904735","pmcid":"","doi":"10.1093/oncolo/oyag424","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42904735/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Oncologist","journal_full":"ONCOLOGIST","tier":"A","if_val":4.7,"zone":"JCR Q2 · 2区","warned":false,"study_type":"回顾性真实世界比较有效性队列研究（TriNetX 全球协作网络数据库，1:1 倾向性评分匹配）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":49,"score_breakdown":{"clinical":19,"methodology":17,"specialty":5,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":true,"critic_verified":false,"verify_error":"","tuple_audit":[{"group":"FOLFOX vs FOLFIRI（PSM 匹配后）","metric":"中位总生存（OS）","val":"5.7 个月 vs 5.8 个月","stat":"P=.958","grounded":false,"checks":[{"num":"5.7","grounded":true,"note":"数值命中+邻句锚命中"},{"num":"5.8","grounded":false,"note":"数值在摘要中，但所在句无该指标语境（疑似张冠李戴）"},{"num":"958","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["5.8","958"]},{"group":"FOLFOX vs CapOx（PSM 匹配后）","metric":"中位总生存（OS）","val":"5.7 个月 vs 5.8 个月","stat":"P=.803","grounded":false,"checks":[{"num":"5.7","grounded":true,"note":"数值命中+邻句锚命中"},{"num":"5.8","grounded":false,"note":"数值在摘要中，但所在句无该指标语境（疑似张冠李戴）"},{"num":"803","grounded":false,"note":"数值未在原摘要出现"}],"missing_tokens":["5.8","803"]}],"ungrounded_numbers":["958","803"],"semantic_passed":false,"semantic_audit":[{"group":"FOLFOX vs FOLFIRI（PSM 匹配后）","metric":"中位总生存（OS）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「PSM」未在原摘要出现","人群限定「匹配后」无英文锚（词典未收录，宁误杀）"]},{"group":"FOLFOX vs CapOx（PSM 匹配后）","metric":"中位总生存（OS）","population_ok":false,"metric_ok":true,"mismatch_reasons":["人群限定「PSM」未在原摘要出现","人群限定「匹配后」无英文锚（词典未收录，宁误杀）"]}],"publish_state":"degraded","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"真实世界比较 FOLFOX、FOLFIRI 与 CapOx 作为晚期胆道癌二线化疗的疗效：三种方案总生存无显著差异","title_en":"Real-World Comparative Effectiveness of FOLFOX, FOLFIRI, and CapOx as Second-Line Chemotherapy for Advanced Biliary Tract Cancer.","authors":"Chao CY, Tseng KY, Lin HC, Shih YH","affiliation_highlight":"Division of Medical Oncology, Department of Oncology, Taichung Veterans General Hospital, Taichung, Taiwan.","results":"匹配队列中位 OS：FOLFOX vs FOLFIRI 为 5.7 个月 vs 5.8 个月（P=.958）；FOLFOX vs CapOx 为 5.7 个月 vs 5.8 个月（P=.803）。总体不良事件谱相当；FOLFOX 较 FOLFIRI 中性粒细胞减少发生率更低、血小板减少发生率更高；FOLFOX 与 CapOx 毒性相似，贫血与血小板减少存在小幅差异。","authors_conclusion":"本真实世界研究显示 FOLFOX、FOLFIRI 与 CapOx 作为晚期胆道癌二线化疗的生存结局相当，这些发现支持依据患者特征与毒性谱进行个体化方案选择。","ai_note":"①主要终点为 OS，但摘要未给出任何风险比或 95%CI，仅报 P 值，无法判断等价性还是把握度不足所致的“阴性”；三组中位 OS 均约 5.7–5.8 个月，提示入组人群整体预后极差，组间差异被天花板/地板效应掩盖的可能性未讨论。②未说明样本量/效能计算，FOLFIRI 与 CapOx 匹配后仅 184/149 例，非劣效界值未预设，“可比”结论属事后解读。③TriNetX 为电子病历/理赔数据，不良事件依赖编码，存在漏报与错分；未提及二线治疗后的后续治疗、剂量强度、体能状态、CA19-9、肝转移负荷等关键混杂因素是否可及或已校正。④仅排除“后续接受分子靶向治疗”者，未提及是否纳入免疫治疗或靶向治疗作为后续线数，也未描述缺失数据与随访截尾。⑤研究时间窗标注为 2010 年 1 月至 2025 年 7 月，超出投稿时点的未来日期与数据可获得性存在内部矛盾，摘要未作说明（信息不足）。⑥结论中“个体化选择”属超出数据的推断性表述，摘要未提供任何可操作的生物标志物或临床分层依据。","pico":{"p":"2010 年 1 月至 2025 年 7 月于 TriNetX 数据库识别的晚期胆道癌成人患者，一线吉西他滨+顺铂进展后接受二线 FOLFOX（825 例）、FOLFIRI（184 例）或 CapOx（149 例）；排除后续接受分子靶向治疗者；1:1 倾向性评分匹配后 FOLFOX vs FOLFIRI 各 182 例，FOLFOX vs CapOx 各 149 例","ic":"干预/对照：二线 FOLFOX 对比 FOLFIRI；二线 FOLFOX 对比 CapOx（均为化疗方案间的头对头比较）"},"reason":"为晚期胆道癌一线吉西他滨+顺铂失败后的二线化疗选择提供对照基线：三种氟尿嘧啶方案生存相近，可据毒性谱取舍，避免默认某一方案生存更优；同时提示后续二线研究设计需以约 5.8 个月中位 OS 作为对照参照，并暴露出现有真实世界证据在效能与混杂控制上的缺口。","abstract_en":"BACKGROUND: Advanced biliary tract cancer (BTC) has a poor prognosis following progression on first-line gemcitabine plus cisplatin. However, evidence comparing second-line chemotherapy regimens remains limited. This study aimed to compare the effectiveness and safety of fluorouracil, leucovorin, and oxaliplatin (FOLFOX); fluorouracil, leucovorin, and irinotecan (FOLFIRI); and capecitabine plus oxaliplatin (CapOx). PATIENTS AND METHODS: Adults with advanced BTC who received first-line gemcitabine plus cisplatin followed by second-line FOLFOX, FOLFIRI, or CapOx between January 2010 and July 2025 were identified from the TriNetX Global Collaborative Network. Patients who subsequently received molecularly targeted therapies were excluded. The study included 825 patients receiving FOLFOX, 184 receiving FOLFIRI, and 149 receiving CapOx; after 1:1 propensity score matching, the respective comparisons included 182 and 149 patients per group. Overall survival (OS) and treatment-related adverse events were compared between the matched cohorts. RESULTS: The median OS was comparable between FOLFOX and FOLFIRI (5.7 months vs. 5.8 months, P=.958) and between FOLFOX and CapOx (5.7 months vs. 5.8 months, P=.803). The overall adverse event profiles were also comparable. However, FOLFOX was associated with lower rates of neutropenia but higher rates of thrombocytopenia than FOLFIRI. In contrast, FOLFOX and CapOx demonstrated similar toxicity despite modest differences in anemia and thrombocytopenia. CONCLUSION: This real-world study demonstrates comparable survival outcomes among FOLFOX, FOLFIRI, and CapOx as second-line chemotherapies for advanced BTC. These findings support individualized regimen selection based on patient characteristics and toxicity profiles.","tags":["晚期胆道癌","二线化疗","FOLFOX","FOLFIRI","CapOx","真实世界研究"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903807","pmid":"42903807","pmcid":"PMC13681453","doi":"10.3389/fimmu.2026.1814514","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903807/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"Narrative review（叙述性综述）· 非系统综述","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":48,"score_breakdown":{"clinical":17,"methodology":7,"specialty":16,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"胸膜间皮瘤免疫抑制性肿瘤微环境与免疫检查点抑制剂耐药：机制及治疗策略综述","title_en":"Reprogramming the tumor microenvironment in mesothelioma: from immune suppression to therapeutic opportunity.","authors":"Cerbone L, Garau A, Balossino A, Martinotti S, Ranzato E, Genova C, Rigo V, Meda S et al.","affiliation_highlight":"SSD Mesotelioma, Melanoma e Tumori Rari, IRCCS AOU SS Antonio e Biagio e Cesare Arrigo, Alessandria, Italy.","results":"","authors_conclusion":"Novel therapeutic strategies aimed at depleting or modulating suppressive immune populations within the TME are emerging as promising avenues to overcome resistance and enhance the effectiveness of ICIs.","ai_note":"叙述性综述，无系统检索、定量合成或偏倚评估；摘要未给出纳入研究数量及效应量；“promising avenues”属作者观点，需原始研究验证。","pico":{"p":"","ic":""},"reason":"为胸膜间皮瘤免疫治疗耐药机制与TME靶向策略提供框架，影响晚期PM免疫治疗研究方向及生物标志物探索设计。","abstract_en":"Pleural mesothelioma (PM) is a rare and aggressive cancer with limited treatment options and poor prognosis. Unlike other thoracic cancers responding well to immunotherapy, PM typically lacks key predictive biomarkers such as Programmed Death-Ligand 1 (PD-L1) tumor expression. Nonetheless, immune checkpoint inhibitors (ICIs) have shown clinical activity in PM, particularly in non-epithelioid subtypes. However, only a subset of patients benefits from this approach, and resistance remains a major challenge. A growing body of evidence suggests that tumor microenvironment (TME) plays a central role in shaping this resistance. In PM, the TME is notably immunosuppressive, dominated by regulatory T cells, myeloid-derived suppressor cells, and tumor-associated macrophages. These elements act as a shield against immune activation, limiting the efficacy of ICIs. Novel therapeutic strategies aimed at depleting or modulating suppressive immune populations within the TME are emerging as promising avenues to overcome resistance and enhance the effectiveness of ICIs. In this narrative review, we examine the unique features of the TME in PM, its role in immunotherapy resistance, and emerging strategies aimed at harnessing or remodeling the TME to improve patient outcomes.","tags":["胸膜间皮瘤","肿瘤微环境","免疫检查点抑制剂","免疫治疗耐药","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903351","pmid":"42903351","pmcid":"PMC13680486","doi":"10.3389/fimmu.2026.1957511","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903351/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Variant-informed multimodal tissue-state modeling reveals an NRF2 stress niche and dependency axis in KEAP1/NFE2L2-altered cancer.","title_en":"Variant-informed multimodal tissue-state modeling reveals an NRF2 stress niche and dependency axis in KEAP1/NFE2L2-altered cancer.","authors":"Kong M, Li Q, Zhao X, Wang Y, Luo Y, Yu Y, Zhang C","affiliation_highlight":"Department of Cardiology, The Affiliated Hospital of Southwest Medical University, Luzhou, Sichuan, China.","results":"INTRODUCTION: Cancer genotypes influence transcriptional programs, spatial organization, histopathology, and treatment-response states, yet these molecular and tissue-level features are often analyzed separately in publi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Cancer genotypes influence transcriptional programs, spatial organization, histopathology, and treatment-response states, yet these molecular and tissue-level features are often analyzed separately in public-data studies. VISTA was developed as a variant-informed, multimodal framework for modeling genotype-linked tissue states and prioritizing validation-ready biological hypotheses. METHODS: VISTA integrates somatic variants, protein-region and AlphaMissense-informed priors, RNA-state scoring, whole-slide image embeddings, immunotherapy cohorts, spatial and single-cell references, cell-line dependency maps, and pharmacogenomic screens. We evaluated the framework in KEAP1/NFE2L2-altered lung cancer and melanoma, using the NRF2 stress axis as a biologically defined test case. Analyses incorporated project-adjusted modeling, bootstrap confidence intervals, permutation testing, leave-project sensitivity analyses, independent tumor-level validation cohorts, fixed-effect external meta-analysis, model-system analyses using DepMap/CCLE, tissue-context analyses, immunotherapy cohorts, and exploratory whole-slide image analyses. RESULTS: In TCGA LUAD, LUSC, and SKCM pilot cohorts, KEAP1 and NFE2L2 alterations were consistently associated with NRF2 stress activation across project-adjusted models and sensitivity analyses. Independent analyses of CPTAC LUAD, CPTAC LSCC, and non-TCGA LUAD cohorts reproduced higher NRF2-state scores in KEAP1/NFE2L2-altered tumors. Fixed-effect external meta-analysis supported associations with both KEAP1 mutation and combined KEAP1-or-NFE2L2 alteration status. DepMap/CCLE analyses provided complementary model-system evidence: KEAP1/NFE2L2-mutant models had higher NRF2 scores, while NRF2-high or KEAP1/NFE2L2-mutant contexts showed stronger NFE2L2 dependency. Tissue-context analyses positioned NRF2 stress near hypoxic, stromal, myeloid, and immune programs. Immunotherapy cohorts supported the relevance of NRF2-associated states to treatment-response biology, while also indicating limited utility for static pan-cancer prediction. Exploratory whole-slide image analyses using pathology foundation-model embeddings identified morphology associations with myeloid, hypoxic, and CAF/TGF-beta barrier programs. DISCUSSION: VISTA provides an evidence-layered approach to variant-informed tissue-state modeling. By integrating genomic, transcriptomic, imaging, spatial, cellular, dependency, and pharmacogenomic evidence, it can help prioritize genotype-linked cancer states and validation-ready hypotheses. VISTA is not intended to function as a stand-alone clinical predictor; its claims are bounded by the evidence available in each data layer and by the biological and clinical context of the analyzed cohorts.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42905014","pmid":"42905014","pmcid":"","doi":"10.1148/ryai.260161","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42905014/","notice_url":"","trial_url":"","pub_date":"2026-Oct-21","briefing_date":"2026-10-23","journal_abbr":"Radiol Artif Intell","journal_full":"Radiology-Artificial Intelligence","tier":"A","if_val":20.1,"zone":"JCR Q1 · 1区","warned":false,"study_type":"队列研究（启发式判定）","category":"nodule","category_label":"肺结节与早筛管理","score_total":48,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Interpretable Deep Learning for Opportunistic Screening of Left Ventricular Dysfunction Screening Using Chest Radiographs.","title_en":"Interpretable Deep Learning for Opportunistic Screening of Left Ventricular Dysfunction Screening Using Chest Radiographs.","authors":"Jang S, Lee DH, Cho HS, Byeon SJ, Hur BY, Park CM, Chung M, Nam JG et al.","affiliation_highlight":"Department of Radiology, Seoul National University Bundang Hospital, 82 Gumi-ro 173beongil, Bundang-gu, Seongnam, Gyeong…","results":"Purpose To develop and evaluate a deep learning model (DLLV) for identifying reduced left ventricular ejection fraction (LVEF) on chest radiographs (CXRs) and assess its potential as a prescreening tool for selective tra…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Purpose To develop and evaluate a deep learning model (DLLV) for identifying reduced left ventricular ejection fraction (LVEF) on chest radiographs (CXRs) and assess its potential as a prescreening tool for selective transthoracic echocardiography (TTE) in health checkup populations. Materials and Methods Same-day CXR-TTE pairs obtained between January 2016 and September 2021 were retrospectively collected for model development. Counterfactual learning was applied to enhance model performance and interpretability. External testing included one tertiary referral center cohort and two health checkup cohorts. Discrimination was evaluated using area under the receiver operating characteristic curve (AUC) and area under the precision-recall curve (AUPRC), and DLLV-based prescreening was evaluated by estimated TTE reduction and missed-case burden. Results The development dataset included 24,674 patients (32,135 CXR-TTE pairs); external cohorts included 5440, 28,034, and 6085 patients (53-62% male). DLLV achieved an AUC of 0.86 (95% CI: 0.84, 0.88) for LVEF ≤ 40% in the tertiary referral cohort. In health checkup cohorts, AUCs were 0.92-0.97 for LVEF ≤ 40%, with AUPRCs of 0.04 in both cohorts, corresponding to 87-fold (95% CI: 16, 404) and 37-fold (95% CI: 3, 251) enrichment over baseline prevalence. Counterfactual reinforcement learning produced heatmaps with greater heart localization precision (P < .001 for all) and higher AUC for LVEF < 50% (P = .04). DLLV-based prescreening estimated TTE volume reductions up to 85% while identifying all 12 and 7 individuals with LVEF ≤ 40%. Conclusion DLLV identified reduced LVEF on CXRs across external test cohorts and showed potential as a prescreening tool for selective TTE in health checkup populations. ©RSNA, 2026.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903172","pmid":"42903172","pmcid":"PMC12059482","doi":"10.20517/cdr.2025.14","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903172/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Artif Intell","journal_full":"Frontiers in artificial intelligence","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":45,"score_breakdown":{"clinical":20,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"scTIME: single-cell-informed interpretable modeling of immunotherapy-associated immune states in non-small cell lung cancer.","title_en":"scTIME: single-cell-informed interpretable modeling of immunotherapy-associated immune states in non-small cell lung cancer.","authors":"Chen G, You C, Gao H, Xu C","affiliation_highlight":"YongJia People's Hospital, Wenzhou, China.","results":"Immune checkpoint inhibitor response in non-small cell lung cancer (NSCLC) reflects coordinated tumor and immune states that are not fully captured by single biomarkers. We developed scTIME, an interpretable model that t…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Immune checkpoint inhibitor response in non-small cell lung cancer (NSCLC) reflects coordinated tumor and immune states that are not fully captured by single biomarkers. We developed scTIME, an interpretable model that translates single-cell immune programs into bulk transcriptomic scores, and integrated public single-cell, T-cell receptor, transcriptomic, survival, and proteogenomic cohorts. Response modeling used two cohorts with different endpoints (40 patients) and compared six algorithms. ElasticNet was selected as a sparse reporting model, achieving a pooled five-fold out-of-fold ROC-AUC of 0.810; nested model selection yielded 0.772. Matched held-out stratification identified response-enriched scTIME groups in a direct descriptive comparison with CD274, while the fitted score emphasized cytotoxic CD8, natural killer, SPP1 macrophage, interferon-response, and antigen-presentation programs. Single-cell analyses and external projections linked these programs to CXCL10-CXCR3 recruitment, exclusion-associated states, and T-cell receptor ecology across molecular contexts. Exploratory survival and cross-omics analyses extended the framework beyond the response cohorts but were interpreted as projection rather than independent validation. Together, the results show how cell-resolved immune biology can support transparent, multi-omic biomarker development without reducing response to a single pathway. scTIME remains exploratory because model choice was post hoc, cohorts were small and clinically heterogeneous, and endpoint-matched external validation was unavailable.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903280","pmid":"42903280","pmcid":"PMC13680878","doi":"10.3389/fimmu.2026.1947415","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903280/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"基础实验研究：小鼠在体机械通气模型（Control/LVT/HVT）+ RAW264.7巨噬细胞体外功能获得/缺失实验","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":44,"score_breakdown":{"clinical":8,"methodology":18,"specialty":10,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"高潮气量机械通气通过巨噬细胞BMPRIB-p38/NF-κB轴促进小鼠肺内炎症与肺损伤","title_en":"Macrophage BMPRIB mediates p38-dependent inflammatory reprogramming and chemotaxis during ventilator-induced lung injury.","authors":"Wang J, Sun Q, Li L, Xu J, Yang L","affiliation_highlight":"Department of Anesthesiology, The Second Xiangya Hospital, Central South University, Changsha, Hunan, China.","results":"摘要未报告任何数值型结果（无组间定量差异、无P值或95%CI）","authors_conclusion":"HVT-induced BMPRIB upregulation in lung macrophages allows BMP4 to activate BMPRIB-dependent p38/NF-κB p65 axis as a key mediator of macrophage-driven inflammation in VILI. Targeting the BMPRIB-dependent p38/NF-κB axis may represent a novel therapeutic strategy.","ai_note":"摘要通篇为定性描述，缺样本量、缺统计量与效应值，无法判断差异幅度与可重复性；核心论据“HVT选择性上调BMPRIB而下调BMPRII、BMPRIA不变”未给出定量与统计支持；气管内给予外源BMP4属超生理刺激，“BMP4-BMPRIB-p38/NF-κB”链条主要依赖药理学抑制剂（LDN193189、SB202190）交叉验证，存在脱靶可能；未见人肺组织或临床VILI标本验证；“novel therapeutic strategy”为由小鼠+细胞系结果的外推表述。","pico":{"p":"小鼠机械通气模型（Control插管不通气、LVT低潮气量、HVT高潮气量三组）；体外RAW264.7巨噬细胞（各组样本量摘要未报告）","ic":"干预：气管内注射外源性BMP4、BMP I型受体拮抗剂LDN193189、BMPRIB过表达/敲低、p38抑制剂SB202190；对照：未通气插管对照与低潮气量通气组"},"reason":"为胸科围术期机械通气（单肺通气/术后通气）相关肺损伤提供巨噬细胞BMPRIB-p38/NF-κB轴的机制假说，可作为肺保护性通气与围术期炎症研究的背景引用与后续靶点筛选线索，但不改变现有通气策略或临床决策。","abstract_en":"BACKGROUND: Ventilator-induced lung injury (VILI) is a major iatrogenic complication of mechanical ventilation, in which dysregulated inflammation, particularly macrophage-driven response, amplifies pulmonary damage. Although bone morphogenetic protein (BMP) signaling exhibits context-dependent effects in pulmonary disorders, whether specific BMP receptors (BMPRs) regulate macrophage function during VILI remains unknown. METHODS: Mice subjected to mechanical ventilation were randomly divided into Control (intubation without ventilation), LVT (low tidal volume), and HVT (high tidal volume) groups. HVT-exposed mice received intratracheal administration of exogenous BMP4 or the BMP type I receptor antagonist LDN193189. Lung injury severity was assessed by ultrasound, macroscopic scoring, wet/dry ratio, and histopathology. Macrophage accumulation, M1/M2 polarization, interstitial-to-alveolar macrophage (IM/AM) ratio, and BMP receptor expression were evaluated. Transcriptomic profiling was performed to identify differentially expressed genes and enriched pathways. In vitro, gain- and loss-of-function experiments (overexpression and knockdown of BMPRIB) were conducted in RAW264.7 macrophages to assess cytokine/chemokine production, migration, and MAPK pathway activation. The p38 inhibitor SB202190 was used to probe downstream signaling. RESULTS: Compared with Control and LVT groups, HVT induced time-dependent macrophage accumulation, skewed M1/M2 polarization, and a progressive elevation of the IM/AM ratio. Strikingly, HVT selectively upregulated BMPRIB in lung macrophages, while downregulating BMPRII and leaving BMPRIA unchanged. Intratracheal BMP4 exacerbated these effects, whereas LDN193189 reversed BMP4-induced macrophage accumulation, M1 polarization, IM/AM elevation, and suppressed activation of ERK, JNK, p38, and p65 signaling. Transcriptomic analysis revealed that BMP4 enriched MAPK and inflammation-related pathways, with LDN193189 co-treatment partially reversing this enrichment. In BMP4-stimulated RAW264.7 macrophages, BMPRIB overexpression enhanced, whereas BMPRIB knockdown attenuated, cytokine/chemokine production and migration. Pharmacological p38 inhibition (SB202190) abrogated BMP4-induced pro-inflammatory effects in macrophages. CONCLUSIONS: HVT-induced BMPRIB upregulation in lung macrophages allows BMP4 to activate BMPRIB-dependent p38/NF-κB p65 axis as a key mediator of macrophage-driven inflammation in VILI Targeting the BMPRIB-dependent p38/NF-κB axis may represent a novel therapeutic strategy.","tags":["VILI","机械通气","巨噬细胞极化","BMP信号","p38/NF-κB","动物实验"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903588","pmid":"42903588","pmcid":"PMC13681840","doi":"10.3389/fmed.2026.1955926","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903588/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Med (Lausanne)","journal_full":"Frontiers in medicine","tier":"B","if_val":null,"zone":"PubMed 收录期刊","warned":false,"study_type":"批判性叙述综述（非系统综述）· 证据合成","category":"nodule","category_label":"肺结节与早筛管理","score_total":44,"score_breakdown":{"clinical":14,"methodology":11,"specialty":19,"journal":0},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"重建感知影像组学对亚实性肺结节风险分层的临床价值尚缺乏前瞻性证据：批判性叙述综述","title_en":"Reconstruction-aware radiomics for risk stratification of subsolid pulmonary nodules: technical evidence, clinical limits, and translation priorities.","authors":"Liu Y, Peng Y, Chen F, Huang J, Yang J, Zhong J","affiliation_highlight":"Department of Radiology, Zigong First People's Hospital, Zigong, Sichuan, China.","results":"","authors_conclusion":"Translation therefore requires reconstruction and segmentation robustness testing, strong conventional comparators, external calibration, prespecified thresholds, and prospective decision-linked evaluation. Until such benefit and safety are demonstrated, reconstruction-aware radiomics should remain investigational or confined to governed, domain-checked decision-support pathways.","ai_note":"叙述性综述，未报告系统检索策略、纳入研究数量及偏倚评估，无法判断证据合成的完整性；“未发现前瞻性研究”属文献回顾性判断而非系统检索结果；结论谨慎且与所述证据一致，但缺乏定量合成。","pico":{"p":"亚实性肺结节（SSNs；含纯磨玻璃结节pGGNs与部分实性结节PSNs）；样本量未报告","ic":"干预：重建感知影像组学（targeted或高空间分辨率CT重建）；对照：标准化薄层CT及常规临床/影像学比较指标（实性成分、实性成分比例CTR、形态、纵向生长）"},"reason":"为亚实性结节影像组学研究设定转化门槛：强调需在配对重建域、外部校准及前瞻性决策关联中验证，避免将重建依赖的组学特征直接用于临床风险分层。","abstract_en":"Subsolid pulmonary nodules (SSNs), including pure ground-glass nodules (pGGNs) and part-solid nodules (PSNs), span transient inflammatory abnormalities and adenocarcinoma-spectrum lesions with widely different management implications. This critical narrative review treats CT reconstruction as part of the quantitative biomarker definition and asks whether targeted or high-spatial-resolution reconstruction provides stable, task-specific information beyond standardized thin-section CT. Evidence was synthesized across direct SSN reconstruction-domain studies, technical robustness studies, and clinical prediction studies. Direct imaging studies support improved depiction of selected fine structures, while same-scan GGN evidence demonstrates substantial pixel-size dependence of radiomic features and model composition. However, most clinical models were not evaluated in paired reconstruction domains, external validation with calibration remains uncommon, and no prospective study demonstrating management or patient benefit from reconstruction-aware radiomics in SSNs was identified in the literature reviewed. Persistent pGGNs provide a biological and technical rationale for investigating incremental quantitative information, but greater benefit than in PSNs has not been demonstrated. In PSNs, any model must add value beyond solid-component measurements, consolidation-to-tumor ratio, morphology, and longitudinal growth. Translation therefore requires reconstruction and segmentation robustness testing, strong conventional comparators, external calibration, prespecified thresholds, and prospective decision-linked evaluation. Until such benefit and safety are demonstrated, reconstruction-aware radiomics should remain investigational or confined to governed, domain-checked decision-support pathways.","tags":["亚实性肺结节","影像组学","CT重建","风险分层","证据转化"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42903612","pmid":"42903612","pmcid":"PMC13681839","doi":"10.3389/fimmu.2026.1965154","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903612/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The multifaceted role of mesenchymal stem cells in infectious diseases: antimicrobial properties, immunomodulation and tissue repair.","title_en":"The multifaceted role of mesenchymal stem cells in infectious diseases: antimicrobial properties, immunomodulation and tissue repair.","authors":"Nyabi O, Temsamani F, Agalit A, El Bakkouri K, Hendi Z, Al Battah F, Vosough M, Idrissi Serhrouchni K et al.","affiliation_highlight":"Center for Applied Molecular Technologies, Institute of Clinical and Experimental Research, UCLouvain, Brussels, Belgium…","results":"BACKGROUND: Mesenchymal stem cells (MSCs) have emerged as promising therapeutic agents for infectious diseases owing to their antimicrobial, immunomodulatory, and tissue regenerative properties. Beyond their well-establi…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Mesenchymal stem cells (MSCs) have emerged as promising therapeutic agents for infectious diseases owing to their antimicrobial, immunomodulatory, and tissue regenerative properties. Beyond their well-established role in tissue repair, MSCs and their secretome directly influence pathogen clearance through the secretion of antimicrobial peptides, extracellular vesicles, iron-sequestration mechanisms, and modulation of both innate and adaptive immune responses. KNOWLEDGE GAP: Despite extensive preclinical investigations, MSC responses are highly pathogen-dependent, with outcomes that can be beneficial, neutral, or even detrimental depending on the infectious context. The heterogeneity in MSC efficacy across different pathogens underscores the need for a nuanced understanding of their mechanisms of action and the development of strategies to optimize therapeutic outcomes. KEY FINDINGS: In bacterial infections, MSCs generally promote pathogen clearance and attenuate inflammation. Conversely, antiviral effects are often indirect, primarily involving the regulation of cytokine-driven immunopathology rather than direct inhibition of viral replication. Fungal and parasitic infections exhibit more complex interactions, with some pathogens exploiting MSCs as protective niches or reprogramming their immunological functions. Emerging strategies, including priming, genetic engineering, and cell-free secretome approaches, show promise in enhancing MSC efficacy. However, heterogeneity in cell source, manufacturing processes, potency, dosing, and timing remains a significant translational barrier. CONCLUSION: Future development of MSC-based therapies should shift from a universal, one-size-fits-all approach toward pathogen-specific, tailored cellular or cell-free products. This transition requires the establishment of standardized potency assays, optimized dosing protocols, and clinically meaningful endpoints. Adopting a pathogen-oriented framework will be essential for advancing MSCs as effective anti-infective agents, especially in the face of rising antimicrobial resistance.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903592","pmid":"42903592","pmcid":"PMC13681180","doi":"10.3389/fimmu.2026.1810963","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903592/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"N-back electroencephalography asymmetry and peripheral immune cell subpopulation composition.","title_en":"N-back electroencephalography asymmetry and peripheral immune cell subpopulation composition.","authors":"Ducharme M, Nader G, De Luca V","affiliation_highlight":"Centre for Addiction and Mental Health, Schizophrenia Department, Toronto, ON, Canada.","results":"INTRODUCTION: Cognitive deficits such as working memory impairment and peripheral inflammation frequently occur together in neuropsychiatric conditions, yet the relationship between them remains poorly understood. To add…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Cognitive deficits such as working memory impairment and peripheral inflammation frequently occur together in neuropsychiatric conditions, yet the relationship between them remains poorly understood. To address this gap, the present study examines these associations in healthy young adults to establish baseline relationships between peripheral immune cell subpopulations and neural activity without clinical confounds. The aim of this study is to investigate whether the relative proportions of peripheral immune cell subpopulations are associated with EEG asymmetry during a working memory task and with task performance. METHODS: EEG data were recorded from 24 healthy participants during a 2-back working memory task. Relative EEG asymmetry indices were computed for four frequency bands: alpha, beta, delta, and theta. 2-back task performance was also calculated. Peripheral blood was collected for DNA extraction and genome-wide DNA methylation analysis to estimate the relative proportions of immune cell subpopulations. Estimated proportions were Center Log-Ratio-transformed. Spearman's correlation and multiple linear regression were used to identify associations between EEG asymmetry, relative immune markers, and n-back task performance. RESULTS & DISCUSSION: Our analysis revealed that theta asymmetry was associated with CLR-transformed proportions of natural killer cells (p=0.035) and CD4+ T cells (p = 0.027). 2-back task target accuracy was nearly correlated with granulocytes (p = 0.082) and CD8+ T cell proportions (p=0.016); however, these associations did not remain significant after Bonferroni correction. Despite this, both immune markers significantly predicted 2-back target accuracy across three multiple linear regression models (model 1: p = 0.005, model 2: p = 0.002, model 3: p = 0.002).","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903418","pmid":"42903418","pmcid":"PMC13681373","doi":"10.3389/fimmu.2026.1973515","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903418/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"叙述性综述（非系统评价，无检索策略与定量合成）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":43,"score_breakdown":{"clinical":11,"methodology":6,"specialty":18,"journal":8},"score_source":"llm","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"食管癌免疫治疗耐药的分子机制与克服策略：一篇非系统性综述","title_en":"Molecular mechanisms and therapeutic strategies of immunotherapy resistance in esophageal cancer.","authors":"Pang Y, Jiang P, Liu K, Suo X, Zhang D, Xu Y, Ge Y, Fu Q et al.","affiliation_highlight":"Key Laboratory of Microbiome and Esophageal Cancer Prevention and Treatment, The First Affiliated Hospital, and College …","results":"","authors_conclusion":"本综述全面分析了食管癌免疫治疗耐药的分子机制，包括CAF/TAM及免疫抑制细胞群介导的TME重塑、糖/氨基酸/脂质代谢重编程、DNA甲基化/组蛋白修饰/非编码RNA的表观遗传调控及代偿性免疫检查点上调；并强调微生物组的新兴作用，批判性评估了抗血管生成药物、ADC及多组学与类器官模型指导的个体化联合策略等克服耐药的方案。","ai_note":"本文为叙述性综述，摘要未交代文献检索范围、纳入排除标准、筛选流程与证据分级，无法判断是否存在选择性引用；全文无任何原始数据、效应量或置信区间，机制归类（TME/代谢/表观遗传/微生物组）与联合策略清单的完整性不可核验；将'克服耐药'的联合策略表述为已有前景但未给出其证据等级，存在把早期/临床前证据与确证性证据混同的风险；信息不足，无法评估其结论稳健性。","pico":{"p":"","ic":""},"reason":"为食管癌ICI耐药的机制分类与联合治疗（抗血管生成、ADC、多组学/类器官个体化）提供概念框架，可用于梳理耐药相关标志物假设与设计转化研究/临床试验的立项背景，但不构成改变当前临床决策的证据。","abstract_en":"Immunotherapy, particularly immune checkpoint inhibitors (ICIs), has transformed the treatment landscape for advanced esophageal cancer (EC). Nevertheless, clinical benefits are constrained by primary and acquired resistance driven by a dynamic immunosuppressive tumor microenvironment (TME), extensive metabolic reprogramming, and epigenetic dysregulation. This review provides a comprehensive analysis of the molecular mechanisms underlying immunotherapy resistance in EC, including TME remodeling by cancer-associated fibroblasts, tumor-associated macrophages, and immunosuppressive cell populations; metabolic reprogramming encompassing glucose, amino acid, and lipid metabolism; epigenetic regulation involving DNA methylation, histone modifications, and non-coding RNAs; and compensatory immune checkpoint upregulation. We further highlight the emerging role of the microbiome and critically evaluate combination strategies designed to overcome resistance, including anti-angiogenic agents, ADCs, and personalized approaches guided by multi-omics and organoid models.","tags":["食管癌","免疫检查点抑制剂","免疫耐药","肿瘤微环境","叙述性综述"],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903413","pmid":"42903413","pmcid":"PMC13680744","doi":"10.3389/fimmu.2026.1987918","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903413/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Postischemic endothelial immune reprogramming in stroke.","title_en":"Postischemic endothelial immune reprogramming in stroke.","authors":"Gao L, Liang Z, Xie J","affiliation_highlight":"Admission and Discharge Service Center, The Second Hospital & Clinical Medical School, Lanzhou University, Lanzhou, Gans…","results":"Large-vessel recanalization is essential in acute ischemic stroke, but it does not guarantee microvascular reperfusion. Endothelial responses may contribute to persistent tissue hypoperfusion through leukocyte traffickin…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Large-vessel recanalization is essential in acute ischemic stroke, but it does not guarantee microvascular reperfusion. Endothelial responses may contribute to persistent tissue hypoperfusion through leukocyte trafficking and immunothrombosis. Many of these responses may begin during ischemia and may continue or intensify when blood flow returns. We therefore use postischemic or ischemia/reperfusion-associated terminology unless experiments isolate the contribution of reperfusion. We propose that endothelial immune reprogramming requires a coordinated molecular program, localization to a defined vascular segment and time, and a corresponding change in immune-regulatory function. An isolated increase in an adhesion molecule or circulating biomarker indicates activation or injury but cannot identify such a state. Barrier/stress, adhesive/chemotactic, and prothrombotic responses overlap. Experimental studies implicate endothelial signaling, leukocyte arrest, and platelet interactions with neutrophil extracellular traps, but have not established a common sequence of endothelial states. Human evidence comes mainly from circulating biomarkers, thrombectomy thrombi, post-mortem tissue, and perfusion imaging. The available findings have yet to link a defined cerebral endothelial state to downstream perfusion and clinical outcome in the same patients. Prospective studies should combine serial vascular biomarkers, repeated perfusion imaging, and longitudinal follow-up, with endothelial-enriched molecular profiling when tissue is available. Therapeutic studies should test whether modifying a reversible endothelial program relieves no-reflow while preserving later immune resolution and vascular repair. These approaches remain investigational.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903374","pmid":"42903374","pmcid":"PMC13681304","doi":"10.3389/fimmu.2026.1910252","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903374/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Review on the significance and clinical application of anti-p53 autoantibody detection.","title_en":"Review on the significance and clinical application of anti-p53 autoantibody detection.","authors":"Bu F, Ling ZN, Li P, Zhou B, Zhu WY, Wang JL, Liu X, Zhu TY et al.","affiliation_highlight":"Zhejiang Cancer Institute, Zhejiang Cancer Hospital, Hangzhou, Zhejiang, China.","results":"As a critical tumor suppressor gene, mutations in p53 often contribute to the initiation and progression of cancer. Anti-p53 autoantibody (p53-AAb), produced by the immune system in response to mutated p53 protein, can b…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"As a critical tumor suppressor gene, mutations in p53 often contribute to the initiation and progression of cancer. Anti-p53 autoantibody (p53-AAb), produced by the immune system in response to mutated p53 protein, can be detected in the blood during early stages of tumor development. As a non-invasive biomarker, p53-AAb demonstrates potential for early screening, auxiliary diagnosis, prognosis evaluation, and treatment monitoring across various cancer types. Based on current literature and evidence-based medical data, this Review Article provides an overview of the scientific rationale, technical aspects, and clinical applications of p53-AAb testing. It summarizes practical considerations to guide scientific research and clinical practice, with the aim of promoting standardized utilization of this biomarker.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"A"}},{"id":"pmid_42903323","pmid":"42903323","pmcid":"PMC13680458","doi":"10.3389/fimmu.2026.1948697","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42903323/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-23","journal_abbr":"Front Immunol","journal_full":"Frontiers in Immunology","tier":"A","if_val":7.0,"zone":"JCR Q1 · 2区","warned":false,"study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":43,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":8},"score_source":"heuristic","prescreen":"llm","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Genetic susceptibility and clinical validation of ICAM-5 in immune-mediated non-infectious uveitis.","title_en":"Genetic susceptibility and clinical validation of ICAM-5 in immune-mediated non-infectious uveitis.","authors":"Zhuang Z, Hu P, Hong X, Lin T, Yu Y, Jia X, Su X, Su B et al.","affiliati
