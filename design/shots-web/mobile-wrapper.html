<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mobile 390 Preview Frame - ThorRadar</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#DFDACB;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:30px;
    }
    .phone-container{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }
    .phone-label{
      font-family:"Cascadia Mono",monospace;
      font-size:12px;
      font-weight:700;
      color:#46433C;
      letter-spacing:.05em;
    }
    .phone-frame{
      width:414px;
      height:868px;
      background:#1F1E1D;
      border-radius:48px;
      padding:12px;
      box-shadow:0 30px 70px -15px rgba(31,30,29,.4),0 0 0 2px #DFDACB;
      position:relative;
    }
    .phone-screen{
      width:390px;
      height:844px;
      border-radius:38px;
      overflow:hidden;
      background:#F0EEE6;
    }
    iframe{
      width:390px;
      height:844px;
      border:none;
      display:block;
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="phone-label">iPhone 14 / 15 (390 × 844px) · 移动端响应式实测</div>
    <div class="phone-frame">
      <div class="phone-screen">
        <iframe src="../agron-web.html"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
