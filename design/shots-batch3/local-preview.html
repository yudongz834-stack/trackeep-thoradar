<!doctype html>
<!-- 合并策略：radar_latest 按 pmid 优先合并；与 SITE_DATA.briefing_date 同日的重复记录以 SITE_DATA 为准；fetch 失败静默使用注入数据。 -->
<!-- 三态分支：retracted＝🚫 已撤稿，concern＝⚠ 关注声明，corrected＝📄 更正启事；degraded 独立显示「解读暂停」。 -->
<!-- 滑杆锚点：取合并后 papers 的最大 briefing_date，N 天窗口含锚点及此前 N-1 天，不使用本机今天。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>胸科雷达 · 滚动信号场</title>
<style>
:root{--bg:#F0EEE6;--card:#FAF9F5;--card-2:#F5F3EC;--line:#DFDACB;--text:#1F1E1D;--text-2:#46433C;--muted:#7A7568;--accent:#D97757;--accent-dark:#BC5F3F;--accent-soft:#F5E8E1;--accent-on-soft:#A34A28;--success:#2F9E44;--success-soft:#E7F3EA;--success-on-soft:#2B7A3F;--warning:#E8590C;--warning-soft:#FCEBDD;--warning-on-soft:#A64309;--danger:#C92A2A;--danger-soft:#FBE7E7;--danger-on-soft:#B02525;--shadow-sm:0 1px 2px rgba(31,30,29,.05);--shadow-card:0 1px 2px rgba(31,30,29,.04),0 10px 30px -14px rgba(31,30,29,.12)}
html.dark{--bg:#26241f;--card:#302d27;--card-2:#2b2823;--line:#4a453d;--text:#ece7de;--text-2:#c5bfb2;--muted:#9c9488;--nav:#2b2823;--accent:#e08a6a;--accent-dark:#c9744f;--accent-soft:#3a2b23;--on-accent:#26241f;--accent-on-soft:#e8b49a;--success:#5cb974;--success-soft:#26372b;--success-on-soft:#8fd0a0;--warning-soft:#3a2f1e;--warning-on-soft:#e0a86a;--danger:#e07a7a;--danger-soft:#3a2626;--danger-on-soft:#e8a0a0;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5);color-scheme:dark}
:root{
--font-sans:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
--font-serif:"Georgia","Cambria","Palatino Linotype","Noto Serif SC",serif;
--font-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft);color:var(--accent-on-soft)}
.topbar{height:76px;padding:0 20px;display:grid;grid-template-columns:auto auto minmax(220px,420px) auto;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:38px;height:38px;color:var(--accent-dark)}
.brand-name{display:block;font-size:17px;letter-spacing:.08em;line-height:1.15}
.brand-sub{display:block;margin-top:5px;font:9px/1 var(--font-mono);letter-spacing:.17em;color:var(--muted)}
.scan-meta{display:flex;align-items:center;gap:9px;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
.scan-meta b{display:block;font:600 12px/1.2 var(--font-mono);letter-spacing:.04em}
.scan-meta small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--success-soft);flex:0 0 auto}
.search{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;color:var(--muted);min-width:0}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:4px 5px;background:var(--card)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.deck{height:calc(100vh - 112px);min-height:640px;padding:16px 18px;display:grid;grid-template-columns:252px minmax(420px,1fr) 350px;grid-template-areas:"queue scope detail";gap:16px;max-width:1800px;margin:0 auto}
.panel{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.queue-panel{grid-area:queue;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 9px/1.2 var(--font-mono);letter-spacing:.17em;color:var(--accent-on-soft);text-transform:uppercase}
.panel-head h2,.scope-head h1{margin:5px 0 0;font-size:15px;line-height:1.25;letter-spacing:.02em}
.counter{font:600 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.filters{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.filter-label{margin:0 0 8px 2px;font-size:10px;color:var(--muted)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-btn{min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;font-size:10.5px;color:var(--text-2)}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn em{font:9px/1 var(--font-mono);font-style:normal;color:var(--muted)}
.filter-btn:hover{background:var(--card-2)}
.filter-btn.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent-on-soft)}
.filter-btn.active em{color:var(--accent-on-soft)}
.quick-row{display:flex;gap:5px;margin-top:9px}
.quick-btn{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;font-size:9.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.quick-btn.active{background:var(--text);border-color:var(--text);color:var(--card)}
.queue-title{padding:12px 16px 7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.queue-title span:last-child{font:9px/1 var(--font-mono)}
.queue-list{list-style:none;margin:0;padding:0 7px 10px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.queue-item{margin:2px 0}
.queue-btn{width:100%;min-width:0;display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:7px;align-items:start;padding:10px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.queue-btn:hover{background:var(--card-2)}
.queue-btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.queue-index{font:10px/1.4 var(--font-mono);color:var(--muted);padding-top:2px}
.queue-btn.selected .queue-index{color:var(--accent-on-soft)}
.queue-text{min-width:0}
.queue-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45;font-weight:550;overflow-wrap:anywhere}
.queue-text small{display:block;margin-top:5px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-score{font:600 10px/1.4 var(--font-mono);color:var(--accent-on-soft);text-align:right}
.queue-item.read .queue-text strong{color:var(--muted)}
.queue-item.read .queue-index{color:var(--success-on-soft)}
.queue-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.scope-panel{grid-area:scope;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3px 8px 0;overflow:hidden}
.scope-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 8px}
.scope-head h1{font-size:18px}
.scope-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
.read-progress{text-align:right;white-space:nowrap}
.read-progress b{display:block;font:600 18px/1 var(--font-mono);color:var(--accent-dark)}
.read-progress small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.scope-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.scope{position:relative;width:min(100%,calc(100vh - 292px));max-width:640px;min-width:340px;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--card) 72%,var(--bg));box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);isolation:isolate}
.scope-grid{position:absolute;inset:0;width:100%;height:100%;z-index:0;color:var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 312deg,color-mix(in srgb,var(--accent) 4%,transparent) 326deg,color-mix(in srgb,var(--accent) 18%,transparent) 352deg,color-mix(in srgb,var(--accent) 32%,transparent) 360deg);animation:sweep 10s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope-label{position:absolute;z-index:2;transform:translate(-50%,-50%);font:600 9px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 5px}
.blip{--rot:0deg;position:absolute;z-index:4;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%) rotate(var(--rot));cursor:pointer;transition:opacity .18s,box-shadow .18s,background .18s}
.blip:hover{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.blip.rct{width:14px;height:14px;border-radius:3px;background:var(--accent);--rot:45deg}
.blip.cohort{width:13px;height:13px;background:var(--card);border:2px solid var(--accent-dark)}
.blip.selected{z-index:6;background:var(--accent-dark);box-shadow:0 0 0 5px var(--accent-soft),0 0 0 6px var(--accent-dark)}
.blip.read:not(.selected){opacity:.38}
.blip.dim{opacity:.07;pointer-events:none}
.scope-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow-sm);pointer-events:none}
.scope-hub b{font:600 21px/1 var(--font-mono);color:var(--accent-dark)}
.scope-hub small{margin-top:5px;font:8px/1 var(--font-mono);letter-spacing:.13em;color:var(--muted)}
.scope-empty{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;box-shadow:var(--shadow-card);color:var(--muted);font-size:12px;line-height:1.6}
.scope-empty.show{display:block}
.scope-foot{padding:8px 4px 0}
.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:9.5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-shape{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.legend-shape.rct{border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.legend-shape.cohort{background:var(--card);border:1.5px solid var(--accent-dark)}
.funnel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel-step{position:relative;text-align:center;color:var(--muted);font-size:9px}
.funnel-step:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:2px;color:var(--line);font-family:var(--font-mono)}
.funnel-step b{display:block;margin-bottom:4px;font:600 13px/1 var(--font-mono);color:var(--text-2)}
.funnel-step:last-child b{color:var(--accent-dark)}
.detail-panel{grid-area:detail;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.detail-inner{padding:17px 18px 16px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lock-id{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--accent-on-soft)}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:var(--success-soft);color:var(--success-on-soft);padding:5px 7px;font-size:9px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.detail-journal{margin-top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.journal-name{font-size:11px;font-weight:650;color:var(--text-2);overflow-wrap:anywhere}
.journal-meta{margin-top:5px;font:9px/1.4 var(--font-mono);color:var(--muted)}
.score-box{text-align:right;flex:0 0 auto}
.score-box b{font:600 28px/.9 var(--font-mono);color:var(--accent-dark)}
.score-box small{display:block;margin-top:6px;color:var(--muted);font-size:8px}
.score-track{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.score-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.detail-title{margin:16px 0 13px;font-size:19px;line-height:1.36;font-weight:650;letter-spacing:-.012em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:4px 7px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);font-size:9px;line-height:1.35}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-on-soft)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.meta-cell{min-width:0;padding:10px 4px}
.meta-cell:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-cell small{display:block;color:var(--muted);font-size:8.5px;margin-bottom:5px}
.meta-cell b{display:block;font:500 10px/1.45 var(--font-mono);overflow-wrap:anywhere}
.excerpt-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.excerpt-label b{font-size:11px}
.excerpt-label span{font:8px/1 var(--font-mono);color:var(--muted)}
.excerpt{margin:0;color:var(--text-2);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
.honesty-note{margin:14px 0 0;padding:10px 11px;border-left:2px solid var(--line);background:var(--card-2);color:var(--muted);font-size:10px;line-height:1.6}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.action-btn{min-width:0;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--text-2);text-decoration:none;font-size:10px;cursor:pointer;padding:8px}
.action-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html.dark .action-btn.primary{color:var(--on-accent)}
.action-btn.wide{grid-column:1/-1}
.action-btn.marked{background:var(--success-soft);border-color:transparent;color:var(--success-on-soft)}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:5px 0}
.nav-btn:hover{color:var(--accent-dark)}
.nav-position{font:9px/1 var(--font-mono);color:var(--muted)}
.detail-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.footer{height:36px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px;background:var(--card)}
.footer span{min-width:0}
.footer .keys{font-family:var(--font-mono);white-space:nowrap}
.scope{width:min(100%,calc(100vh - 360px));min-width:300px}
.tier-block{margin-top:11px}
.tier-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tier-chip{border:1px solid var(--line);background:var(--card-2);border-radius:6px;padding:6px 3px;color:var(--muted);font:600 10px/1 var(--font-mono);cursor:pointer}
.tier-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.tier-chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-on-soft)}
.window-control{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.window-top label{font-size:10px;color:var(--muted)}
.window-value{font:600 10px/1 var(--font-mono);color:var(--accent-on-soft);white-space:nowrap}
#window-range{display:block;width:100%;margin:9px 0 7px;accent-color:var(--accent);cursor:pointer}
.window-label{display:block;color:var(--text-2);font:9px/1.5 var(--font-mono);text-align:center;white-space:nowrap}
.journal-sectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
.journal-sector{fill:transparent;stroke:var(--line);stroke-width:.55;cursor:pointer;transition:fill .18s,stroke .18s}
.journal-sector:nth-child(even){fill:color-mix(in srgb,var(--card) 20%,transparent)}
.journal-sector:hover,.journal-sector:focus-visible{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);outline:none}
.journal-sector.active{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent-dark);stroke-width:1.4}
.journal-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;color:var(--muted);font-size:9px}
.journal-toolbar span{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-clear{border:1px solid var(--line);border-radius:5px;background:var(--card-2);color:var(--text-2);padding:3px 7px;font-size:9px;cursor:pointer}
.journal-clear:disabled{opacity:.4;cursor:default}
.journal-legend{display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:5px;max-height:49px;overflow:auto;margin:5px 0 7px;padding:1px 3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journal-btn{max-width:150px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:3px 6px;font-size:8px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journal-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-on-soft)}
.journal-btn em{margin-left:4px;font:8px/1 var(--font-mono);font-style:normal}
.status-pill.has-icon::before{display:none}
.status-pill.retracted{background:var(--danger-soft);color:var(--danger-on-soft);font-weight:700}
.status-pill.concern{background:var(--warning-soft);color:var(--warning-on-soft);font-weight:650}
.status-pill.corrected{background:var(--accent-soft);color:var(--accent-on-soft)}
.status-pill.unknown{background:var(--card-2);color:var(--muted)}
.status-pill.unknown::before{background:var(--muted)}
.notice-banner{margin:12px 0 0;padding:10px 11px;border-radius:7px;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.notice-banner.retracted{background:var(--danger-soft);color:var(--danger-on-soft);border:1px solid var(--danger)}
.notice-banner.concern{background:var(--warning-soft);color:var(--warning-on-soft);border:1px solid var(--warning)}
.notice-banner.corrected{background:var(--accent-soft);color:var(--accent-on-soft);border:1px solid var(--accent)}
.notice-banner.neutral{background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}
.notice-banner a{color:inherit;font-weight:650}
.interpretation{transition:opacity .18s}
.detail-inner.is-retracted .interpretation{opacity:.46;filter:grayscale(.9)}
.badge.paused{background:var(--warning-soft);border-color:transparent;color:var(--warning-on-soft)}

 receptor (EGFR) mutations in non-small cell lung cancer (NSCLC) with limited treatment options. Firmonertinib is a once-daily oral, brain-penetrant, mutant-selective EGFR tyrosine kinase inhibitor with a unique trifluoroethoxy side chain. Firmonertinib had high anti-proliferative efficacy in EGFR PACC-mutant cells and xenografts. In the phase 1b FURTHER study (NCT05364073), patients with metastatic EGFR PACC-mutant NSCLC randomized to receive first-line firmonertinib 160 mg (n = 25) or 240 mg (n = 22) had confirmed objective response rates (ORRs) of 43% and 68%, median duration of response not reached and 14.6 months, and median progression-free survival of 11.1 and 16.0 months, respectively; treatment-related adverse events led to dose reductions (19% and 24%) and discontinuation (3% and 0%). Intracranial ORR among patients with brain metastases at baseline was 47% (8/17). Results support further study of first-line firmonertinib in patients with EGFR PACC-mutant NSCLC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42887199","pmid":"42887199","pmcid":"","doi":"10.1016/j.cllc.2026.09.007","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42887199/","notice_url":"","trial_url":"","pub_date":"2026-Sep-21","briefing_date":"2026-10-17","journal_abbr":"Clin Lung Cancer","journal_full":"Clinical lung cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A Randomized Phase III Trial of Concurrent Chemoradiotherapy Followed by Durvalumab Consolidation, With or Without Induction Chemo-Immunotherapy, in Patients With Unresectable Locally Advanced Non-Small Cell Lung Cancer: JCOG2510 (PRIME-CRT).","title_en":"A Randomized Phase III Trial of Concurrent Chemoradiotherapy Followed by Durvalumab Consolidation, With or Without Induction Chemo-Immunotherapy, in Patients With Unresectable Locally Advanced Non-Small Cell Lung Cancer: JCOG2510 (PRIME-CRT).","authors":"Kawabata K, Masuda K, Miura K, Saida Y, Ko R, Akamatsu H, Horinouchi H, Chiba T et al.","affiliation_highlight":"Japan Clinical Oncology Group Data Center/Operations Office, National Cancer Center Hospital, Tokyo, Japan.","results":"BACKGROUND: Definitive concurrent chemoradiotherapy (cCRT) followed by durvalumab consolidation is the current standard of care for unresectable locally advanced non-small-cell lung cancer (LA-NSCLC). However, survival o…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Definitive concurrent chemoradiotherapy (cCRT) followed by durvalumab consolidation is the current standard of care for unresectable locally advanced non-small-cell lung cancer (LA-NSCLC). However, survival outcomes in this setting remain unsatisfactory. Although the PACIFIC trial improved outcomes, further intensification of systemic therapy may be required to improve long-term survival. Preclinical and perioperative clinical evidence suggests that introducing immunotherapy in the presence of an intact primary tumor may enhance antitumor immune responses. Recently, early-phase studies have reported the feasibility and potential efficacy of induction chemo-immunotherapy followed by cCRT; however, its clinical benefit has not been confirmed in a phase III trial. PATIENTS AND METHODS: This multicenter, randomized, phase III trial is designed to determine whether the addition of induction chemo-immunotherapy to the current standard strategy of cCRT followed by durvalumab consolidation improves survival outcomes in patients with unresectable LA-NSCLC. Previously untreated patients with unresectable LA-NSCLC without activating EGFR mutations are randomized 1:1 to receive either cCRT followed by durvalumab consolidation or induction chemo-immunotherapy followed by cCRT and durvalumab consolidation. Randomization is adjusted for age, clinical stage, programmed death-ligand 1 expression, and institution. The primary endpoints are progression-free and overall survival. Secondary endpoints include objective response rate, proportion of patients proceeding to cCRT after induction therapy, and adverse events. A total of 212 patients will be enrolled from 60 institutions over 5 years. CONCLUSION: The results of this trial should clarify whether the addition of induction chemo-immunotherapy can enhance curative potential and lead to improved overall survival in patients with unresectable LA-NSCLC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":true,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882930","pmid":"42882930","pmcid":"","doi":"10.3390/cancers18193236","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882930/","notice_url":"","trial_url":"","pub_date":"2026-Oct-08","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A Totally Laparoscopic Transhiatal Approach for Esophageal Cancer During Mediastinoscopic Esophagectomy.","title_en":"A Totally Laparoscopic Transhiatal Approach for Esophageal Cancer During Mediastinoscopic Esophagectomy.","authors":"Konishi H, Sumiyoshi S, Inoue H, Nishibeppu K, Kosuga T, Yamamoto Y, Morimura R, Fujiwara H et al.","affiliation_highlight":"Division of Digestive Surgery, Department of Surgery, Kyoto Prefectural University of Medicine, Kajii-cho 465, Kamigyo-k…","results":"BACKGROUND: Mediastinoscopic esophagectomy is a minimally invasive approach that avoids thoracotomy and single-lung ventilation. We previously performed this procedure using hand-assisted laparoscopic surgery (HALS) and …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Mediastinoscopic esophagectomy is a minimally invasive approach that avoids thoracotomy and single-lung ventilation. We previously performed this procedure using hand-assisted laparoscopic surgery (HALS) and recently established a totally laparoscopic transhiatal approach. This retrospective, non-randomized study reported laparoscopic technique and compared the feasibility and surgical outcomes of these approaches. METHODS: We retrospectively reviewed 262 patients who underwent radical mediastinoscopic esophagectomy using left cervical and transhiatal approaches at the Kyoto Prefectural University of Medicine between January 2020 and June 2026. HALS was performed in 202 patients and laparoscopy in 60 patients. Surgical procedures and perioperative outcomes were compared between the groups. RESULTS: Blood loss and total operative time did not differ significantly between the groups, although the transhiatal procedure tended to require a longer operative time with laparoscopy (p = 0.09). The approach used for middle mediastinal lymphadenectomy was similar between the two groups (43% vs. 35%, p = 0.28), and the overall number of dissected lymph nodes, excluding the upper mediastinal and cervical nodes, was comparable. However, significantly more abdominal lymph nodes were dissected with laparoscopy than with HALS (17.9 vs. 15.7, p = 0.04). Laparoscopic gastric mobilization and lymph node dissection were safely performed, with no significant differences in the rate of postoperative complications or curability. CONCLUSIONS: The totally laparoscopic transhiatal technique is a feasible and safe approach for mediastinoscopic esophagectomy, with surgical outcomes comparable to those of HALS and not inferior abdominal lymph node dissection. It may be particularly advantageous for cases requiring meticulous abdominal lymphadenectomy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42882887","pmid":"42882887","pmcid":"","doi":"10.3390/cancers18193193","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882887/","notice_url":"","trial_url":"","pub_date":"2026-Oct-02","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"From Thoracotomy to Robotic Platforms in Thoracic Surgery: Technical Evolution, Simulation-Based Training, and Surgical Outcomes.","title_en":"From Thoracotomy to Robotic Platforms in Thoracic Surgery: Technical Evolution, Simulation-Based Training, and Surgical Outcomes.","authors":"Piazzolla M, Sampietro D, Delcuratolo MD, Girotti PNC, Muscarella LA, Parente P","affiliation_highlight":"Unit of Thoracic Surgery, Fondazione IRCCS Casa Sollievo Della Sofferenza, 71013 San Giovanni Rotondo, Italy.","results":"Thoracic surgery has progressively moved from open thoracotomy to video-assisted and robot-assisted approaches, reducing access-related trauma while changing the technical environment in which pulmonary resections are pe…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Thoracic surgery has progressively moved from open thoracotomy to video-assisted and robot-assisted approaches, reducing access-related trauma while changing the technical environment in which pulmonary resections are performed and taught. This narrative review examines the clinical evolution of open, video-assisted thoracic surgery (VATS), and robot-assisted thoracic surgery (RATS), with particular attention to the evidence supporting their perioperative and oncological outcomes, the learning curves associated with minimally invasive surgery, and the role of simulation-based training. Randomized trials now provide robust evidence that VATS improve postoperative recovery compared with thoracotomy in appropriately selected patients with predominantly early-stage non-small cell lung cancer, without compromising long-term oncological outcomes. Randomized comparisons between RATS and VATS support RATS as an oncologically acceptable minimally invasive alternative and suggest advantages in selected technical endpoints, particularly blood loss and lymph node retrieval, but do not demonstrate consistent superiority in major clinical or survival outcomes. Learning curves vary according to previous experience, case complexity, supervision, institutional volume, and the endpoint used to define competence, making fixed case-number thresholds an incomplete measure of proficiency. Simulation can improve selected technical skills and provide objective performance assessment, although evidence becomes progressively less robust when moving from simulator performance to operating room transfer and patient-level outcomes. Surgical approach, therefore, should be interpreted within a broader framework that includes patient and tumour characteristics, oncological quality, surgical expertise, institutional resources, and structured training.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882041","pmid":"42882041","pmcid":"","doi":"10.3390/jcm15197579","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882041/","notice_url":"","trial_url":"","pub_date":"2026-Sep-29","briefing_date":"2026-10-17","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Systemic, Pleural, and Alveolar Cytokine Responses After Video-Assisted Thoracoscopic Versus Open Lobectomy for Non-Small Cell Lung Cancer: A Prospective Observational Study.","title_en":"Systemic, Pleural, and Alveolar Cytokine Responses After Video-Assisted Thoracoscopic Versus Open Lobectomy for Non-Small Cell Lung Cancer: A Prospective Observational Study.","authors":"Ancın B, Özercan MM, Yılmaz Y, Uysal S, Kumbasar U, Dikmen E, Sarıbaş Z, Doğan R et al.","affiliation_highlight":"Department of Thoracic Surgery, Faculty of Medicine, Hacettepe University, Ankara 06100, Türkiye.","results":"Background/Objectives: Surgical access and one-lung ventilation (OLV) may generate distinct systemic and local inflammatory responses after lung resection. We compared perioperative cytokine profiles in serum, pleural fl…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: Surgical access and one-lung ventilation (OLV) may generate distinct systemic and local inflammatory responses after lung resection. We compared perioperative cytokine profiles in serum, pleural fluid, and bronchoalveolar lavage (BAL) after video-assisted thoracoscopic surgery (VATS) and open thoracotomy for non-small cell lung cancer (NSCLC). Methods: This prospective, single-center, non-randomized observational study included 40 adults undergoing anatomical lobectomy with mediastinal lymph-node dissection (VATS, n = 20; open thoracotomy, n = 20). Surgical access was selected according to patient preference. TNF-α, IL-6, IL-8, and IL-10 were measured in serial serum and pleural-fluid samples and in BAL from both lungs before OLV and after resection. Results: Serum and pleural-fluid cytokines peaked at 4 h in both groups. Exploratory pointwise comparisons showed that at 24 h, serum TNF-α (4.89 [IQR, 4.43-5.92] vs. 4.01 [IQR, 3.75-5.12] pg/mL; p = 0.010), IL-6 (150.22 [IQR, 136.90-194.66] vs. 108.00 [IQR, 100.46-125.88] pg/mL; p < 0.001), and IL-8 (66.83 [IQR, 57.70-82.82] vs. 43.62 [IQR, 32.89-50.59] pg/mL; p = 0.001) were higher after thoracotomy than after VATS; differences at 48 h persisted for TNF-α (2.48 [IQR, 1.86-3.04] vs. 1.99 [IQR, 1.19-2.23] pg/mL; p = 0.010) and IL-8 (16.92 [IQR, 15.09-23.99] vs. 7.42 [IQR, 6.44-11.30] pg/mL; p < 0.001). Pleural-fluid IL-6 at 24 h and IL-8 at 48 h were also higher after thoracotomy, whereas BAL cytokines did not differ significantly by approach. Longitudinal GEE analyses showed significant approach-by-time interactions for serum TNF-α, IL-6, and IL-8 and for pleural-fluid IL-8, but not for pleural-fluid IL-6. Conclusions: VATS was associated with a lower systemic proinflammatory response than open thoracotomy, while differences in the pleural compartment were more limited and no detectable difference was observed in early alveolar cytokine responses. These findings highlight compartment-specific differences in perioperative inflammatory responses between VATS and open thoracotomy.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42880121","pmid":"42880121","pmcid":"","doi":"10.1016/j.clinsp.2026.101203","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42880121/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-17","journal_abbr":"Clinics (Sao Paulo)","journal_full":"Clinics (Sao Paulo, Brazil)","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Aerosolized prostaglandin E1 improves oxygenation during one-lung ventilation: A dose-finding randomized controlled trial.","title_en":"Aerosolized prostaglandin E1 improves oxygenation during one-lung ventilation: A dose-finding randomized controlled trial.","authors":"Li P, Hu X, Li P, Xing L, Wang Q, Gu L, Wu C","affiliation_highlight":"Department of Anesthesiology, Jiangsu Cancer Hospital & Jiangsu Institute of Cancer Research & The Affiliated Cancer Hos…","results":"OBJECTIVES: This study aimed to investigate the effects of varying doses of aerosolized Prostaglandin E1 (PGE1) on oxygenation and intrapulmonary shunt fraction (Qs/Qt) during One-Lung Ventilation (OLV) under 60% Fractio…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: This study aimed to investigate the effects of varying doses of aerosolized Prostaglandin E1 (PGE1) on oxygenation and intrapulmonary shunt fraction (Qs/Qt) during One-Lung Ventilation (OLV) under 60% Fraction of Inspired Oxygen (FiO2). Secondary objectives included evaluating the impact on intraoperative hypoxemia, postoperative Clinical Pulmonary Infection Score (CPIS), and Postoperative Pulmonary Complications (PPCs). DESIGN: A prospective, single center, randomized, double-blind, controlled trial. SETTING: The study was conducted at a single academic medical center. PARTICIPANTS: A total of 160 patients aged 65‒84 years, with American Society of Anesthesiologists (ASA) physical status II or III and Body Mass Index (BMI) < 30 kg/m2, undergoing elective esophageal cancer surgery were enrolled. Patients with certain comorbidities, respiratory diseases, or contraindications to PGE1 were excluded. INTERVENTIONS: Patients were randomly assigned to one of four groups: Group L ‒ Received 0.1 μg/kg PGE1 nebulization; Group M ‒ Received 0.2 μg/kg PGE1 nebulization; Group H ‒ Received 0.3 μg/kg PGE1 nebulization; Group C (control) ‒ Received normal saline nebulization. Nebulization was performed for 10-minutes via a modified breathing circuit into the ventilated lung before initiating OLV. MEASUREMENTS: Arterial blood gas parameters (arterial partial pressure of oxygen, PaO2; arterial oxygen saturation, SaO2; arterial partial pressure of carbon dioxide, PaCO2), hemodynamic variables (Mean Arterial Pressure [MAP]; Heart Rate [HR]), respiratory mechanics (Peak airway pressure [Ppeak]; dynamic lung compliance [Cdyn]), PaO2/FiO2 ratio, and Qs/Qt were recorded at multiple time points during OLV. The incidence of intraoperative hypoxemia and hypotension, PPCs within 7-days, and CPIS on postoperative day-2 were also assessed. MAIN RESULTS: All PGE1 groups showed significantly improved PaO2, SaO2, and PaO2/FiO2 ratio, and reduced Qs/Qt during the first 30-minutes of OLV compared to the control group. The High-dose group (H) demonstrated the greatest improvement in oxygenation. The incidence of intraoperative hypoxemia [Group L: 0/40 (0%), Group M: 0/40 (0%), Group H: 0/40 (0%), Group C: 3/40 (7.5%)] and hypotension did not differ significantly among groups; however, the hypoxemia finding was exploratory as the study was not powered for this endpoint. No significant differences were observed in PPCs incidence among groups, but group H was associated with a lower CPIS on postoperative day-2 compared to group C. Hemodynamic changes were transient and clinically manageable. CONCLUSIONS: Nebulized PGE1 at doses of 0.1-0.3 μg/kg improves oxygenation and reduces Qs/Qt during OLV under 60% oxygen, with the 0.3 μg/kg dose being most effective. It did not significantly reduce the incidence of PPCs within 7-days. The incidence of intraoperative hypoxemia was lower in the PGE1 groups (0/120) compared with the control group (3/40), but this was an exploratory finding as the study was not powered for this endpoint. The higher dose (0.3 μg/kg) was associated with a lower CPIS on postoperative day-2 (3.3 vs. 4.1), but CPIS is a surrogate marker, and this finding should be interpreted as exploratory. The clinical significance of this small difference is uncertain, as changes of this magnitude are below the typically recognized thresholds for meaningful clinical improvement. Hemodynamic monitoring is recommended when using higher doses of PGE1.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42876373","pmid":"42876373","pmcid":"","doi":"10.1111/1759-7714.70402","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42876373/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-17","journal_abbr":"Thorac Cancer","journal_full":"Thoracic cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Efficacy and Safety of Trilaciclib for the Prevention of Chemotherapy-Induced Myelosuppression in Patients With Solid Tumors: A Systematic Review and Meta-Analysis.","title_en":"Efficacy and Safety of Trilaciclib for the Prevention of Chemotherapy-Induced Myelosuppression in Patients With Solid Tumors: A Systematic Review and Meta-Analysis.","authors":"Tian W, Liu Q, Zhou Y, Zhang Z","affiliation_highlight":"Department of Pharmacy, Peking University First Hospital, Beijing, China.","results":"Trilaciclib, a cyclin-dependent kinase 4 and 6 (CDK4/6) inhibitor administered before chemotherapy, reduces chemotherapy-induced myelosuppression (CIM) in extensive-stage small cell lung cancer (ES-SCLC), but its efficac…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Trilaciclib, a cyclin-dependent kinase 4 and 6 (CDK4/6) inhibitor administered before chemotherapy, reduces chemotherapy-induced myelosuppression (CIM) in extensive-stage small cell lung cancer (ES-SCLC), but its efficacy across solid tumors remains unclear. This meta-analysis evaluated the efficacy and safety of trilaciclib in solid tumor patients receiving chemotherapy. PubMed, Embase, Cochrane Library, and ClinicalTrials.gov were searched from inception to January 21, 2026. Randomized controlled trials (RCTs) and cohort studies comparing chemotherapy with or without trilaciclib were included. Primary outcomes were severe neutropenia (SN), febrile neutropenia (FN), duration of severe neutropenia (DSN), Grade 3/4 leukopenia, and granulocyte colony-stimulating factor (G-CSF) use. Secondary outcomes included other hematologic toxicities, supportive care interventions, and efficacy outcomes. Ten studies involving 1172 patients (six RCTs and four cohort studies) were identified. Trilaciclib significantly reduced SN (OR, 0.14; 95% CI, 0.06-0.31; p < 0.001), FN (OR, 0.19; 95% CI, 0.11-0.36; p < 0.001), Grade 3/4 leukopenia (OR, 0.25; 95% CI, 0.13-0.46; p < 0.001), and G-CSF use (OR, 0.36; 95% CI, 0.18-0.71; p = 0.0087), and shortened DSN (MD, -2.30 days; 95% CI, -4.28 to -0.31; p = 0.0309). It also reduced Grade 3/4 anemia and thrombocytopenia and decreased use of erythropoiesis-stimulating agents, red blood cell transfusions, and platelet transfusions. Overall survival showed a borderline improvement (HR, 0.84; 95% CI, 0.71-0.99; p = 0.0373), while no significant differences were observed in progression-free survival, overall response rate, or non-hematologic adverse events. Subgroup analyses suggested greater benefit in ES-SCLC. Overall, trilaciclib before chemotherapy significantly reduced CIM and supportive care needs, with no apparent compromise in antitumor efficacy and more pronounced effects in ES-SCLC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42874870","pmid":"42874870","pmcid":"","doi":"10.1016/j.japh.2026.103551","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42874870/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-17","journal_abbr":"J Am Pharm Assoc (2003)","journal_full":"Journal of the American Pharmacists Association : JAPhA","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"RCT（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":53,"score_breakdown":{"clinical":28,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Effectiveness of Pharmaceutical Care in Reducing the Incidence of Immune Checkpoint Inhibitor-related Pneumonitis in Patients with NSCLC: A Randomized Controlled Trial.","title_en":"Effectiveness of Pharmaceutical Care in Reducing the Incidence of Immune Checkpoint Inhibitor-related Pneumonitis in Patients with NSCLC: A Randomized Controlled Trial.","authors":"Luo C, Lai Y, Zhang W, Lu H, Luo H, Wei L, Lin X, Zhou C et al.","affiliation_highlight":"Department of Pharmacy, The First Affiliated Hospital, Guangzhou Medical University, Guangzhou, China; Guangzhou Medical…","results":"BACKGROUND: Immune checkpoint inhibitors (ICIs) have revolutionized the treatment of non-small cell lung cancer (NSCLC), yet immune checkpoint inhibitor-related pneumonitis (CIP) remains a potentially life-threatening ad…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Immune checkpoint inhibitors (ICIs) have revolutionized the treatment of non-small cell lung cancer (NSCLC), yet immune checkpoint inhibitor-related pneumonitis (CIP) remains a potentially life-threatening adverse event that may be mitigated through structured pharmaceutical care interventions. OBJECTIVE: To assess the effectiveness of pharmacy services in reducing the occurrence of CIP among patients with NSCLC receiving ICIs. METHODS: Patients who underwent immunotherapy at our hospital between November, 2023 to September, 2024 were selected and randomized into the control and intervention groups (105 patients each). Intervention group received 6 months of pharmacy services, and CIP occurrence, clinical efficacy, medication adherence, and quality of life at 3, 6, and 9 months were compared between the two groups. RESULTS: Compared with the control group, the intervention group had a significantly lower CIP incidence and immunotherapy suspension rate due to CIP (2.9% vs. 9.5%, P = 0.043), as well as significantly improved medication adherence at all time points (P < 0.05). The intervention group also had lower CIP severity and longer onset time (8.6 months vs. 6.2 months), along with numerically higher ORR (40.6% vs. 30.3%) and DCR (81.2% vs. 71.7%), and a favorable trend in emotional function scores; however, these differences did not reach statistical significance. CONCLUSIONS: Pharmacy care can reduce the incidence and severity, and increase the onset time of CIP, thus enhancing drug safety.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42886246","pmid":"42886246","pmcid":"6599424","doi":"10.1016/j.gie.2016.11.023","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886246/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-17","journal_abbr":"Surg Endosc","journal_full":"Surgical endoscopy","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":45,"score_breakdown":{"clinical":20,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Thoracoscopic versus endoscopic resection for esophageal leiomyoma: a propensity score-matched retrospective cohort study.","title_en":"Thoracoscopic versus endoscopic resection for esophageal leiomyoma: a propensity score-matched retrospective cohort study.","authors":"Zhang S, Geng Z, Hu Y, Yang X, Jiang D, Yin J, Lin M, Wang H et al.","affiliation_highlight":"Department of Thoracic Surgery, Zhongshan Hospital, Fudan University, No 180, Fenglin Road, Xuhui District, Shanghai, 20…","results":"INTRODUCTION: Esophageal leiomyoma is the most common benign mesenchymal tumor of the esophagus. Minimally invasive management is performed by thoracoscopic surgery or endoscopic resection, but comparative evidence remai…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Esophageal leiomyoma is the most common benign mesenchymal tumor of the esophagus. Minimally invasive management is performed by thoracoscopic surgery or endoscopic resection, but comparative evidence remains limited. This study evaluated perioperative outcomes and treatment-selection patterns for thoracic and endoscopic resection. METHODS: Patients with pathologically confirmed leiomyoma who underwent resection between January 2015 and September 2023 were retrospectively reviewed. Patients with malignant components, biopsy/fine-needle aspiration only, or incomplete data were excluded. A 1:1 propensity score matching analysis was performed using nearest-neighbor matching with a caliper of 0.1, matching age, sex, tumor location, and maximal tumor diameter. RESULTS: A total of 1,348 patients were included in the primary analysis: 132 underwent minimally invasive thoracic surgery and 1,216 underwent endoscopic resection. In the endoscopic group, 54.5% underwent endoscopic submucosal dissection and 45.5% underwent submucosal tunneling endoscopic resection. In the MIS group, 62 patients (47.0%) received intraoperative endoscopic assistance. Endoscopic resection was associated with shorter operative duration (41.9 ± 39.9 vs 114.8 ± 71.0 min, p < 0.001) and shorter postoperative hospital stay (median 2.0 vs 5.0 days, p < 0.001), whereas minimally invasive thoracic surgery was used for larger tumors (median 5.0 vs 1.3 cm, p < 0.001). After matching, 113 pairs were analyzed. Endoscopic resection remained associated with shorter operative duration (73.7 ± 62.9 vs 111.6 ± 61.5 min, p = 0.009) and shorter postoperative hospital stay (median 3.0 vs 5.0 days, p < 0.001). In the matched cohort, nasogastric tube placement and delayed stay of 5 days or longer were less common after endoscopic resection. CONCLUSIONS: Endoscopic resection was associated with faster postoperative recovery in patients with esophageal leiomyoma, whereas thoracic surgery remained important for larger tumors and complex lesions. These findings support a size- and location-oriented treatment strategy rather than a universal preference for either approach.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882784","pmid":"42882784","pmcid":"","doi":"10.3390/cancers18193089","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882784/","notice_url":"","trial_url":"","pub_date":"2026-Sep-23","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":45,"score_breakdown":{"clinical":20,"methodology":15,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Rethinking Age Limits for Robotic Lung Cancer Resection: Contemporary Short-Term Outcomes in Octogenarians.","title_en":"Rethinking Age Limits for Robotic Lung Cancer Resection: Contemporary Short-Term Outcomes in Octogenarians.","authors":"Bagrodia N, Djabri D, Boualoy T, Lopez K, Baiu I, D'souza DM, Merritt RE, Kneuertz PJ et al.","affiliation_highlight":"Division of Thoracic Surgery, Department of Surgery, The Ohio State University Wexner Medical Center, 410 W 10th Ave., C…","results":"Objective: We sought to assess the outcomes of octogenarians compared to a reference group of younger patients undergoing robotic anatomic lung resection for non-small cell lung cancer (NSCLC) to better understand the po…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Objective: We sought to assess the outcomes of octogenarians compared to a reference group of younger patients undergoing robotic anatomic lung resection for non-small cell lung cancer (NSCLC) to better understand the postoperative expectations of this elderly patient population. Methods: A prospectively maintained Institutional General Thoracic Surgery Database was queried for patients aged 80 years and above (octogenarians) and 65-75 years (reference group) undergoing robotic lobectomy or segmentectomy for NSCLC between 2015 and 2026. Clinical data and postoperative outcomes were collected and compared using both unadjusted and 1:1 propensity-score matching. Results: In total, 822 patients were identified: 101 in the octogenarian group (mean age 82.4 years [standard deviation 2.2]) and 721 in the reference group (69.7 [3.1], p < 0.001). Postoperative complications that were more frequent in octogenarians included pneumothorax requiring chest tube insertion (5.9% vs. 2.2%, p = 0.043), atrial arrhythmias (18.8% vs. 9.2%, p = 0.005), and urinary tract infections (6.9% vs. 1.7%, p = 0.005). Air leak, atelectasis, pneumonia, respiratory failure, pleural effusion, empyema, and delirium did not differ between the groups. After propensity matching, there were no significant differences in the aforementioned postoperative outcomes. While the unadjusted length of stay was longer in octogenarians (4 days [interquartile range 3-5] vs. 3 [2-5], p = 0.012), this was no longer significant after matching (4 [3-5] vs. 3 [2-5], p = 0.369). There were no statistically significant differences in 30-day readmission rates (p = 0.197) or 30-day mortality (p = 0.781) after propensity-score matching. Conclusions: Among carefully selected octogenarians undergoing robotic anatomic lung resection for NSCLC, no statistically significant differences in short-term postoperative outcomes were detected compared with patients aged 65-75 years after adjustment for baseline differences. These findings support individualized surgical selection beyond chronologic age alone.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective_matched","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42886999","pmid":"42886999","pmcid":"","doi":"10.2196/99573","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886999/","notice_url":"","trial_url":"","pub_date":"2026-Oct-16","briefing_date":"2026-10-17","journal_abbr":"JMIR Cancer","journal_full":"JMIR cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Metastasis Extraction From Non-Small Cell Lung Cancer Clinical Notes Using Large Language Model-Based Classification: Retrospective Comparative Study.","title_en":"Metastasis Extraction From Non-Small Cell Lung Cancer Clinical Notes Using Large Language Model-Based Classification: Retrospective Comparative Study.","authors":"Balaji S, Campbell K, Chen RZ, Smith D, Reyna MA, Sarker A, Wallach JD, Parikh RB et al.","affiliation_highlight":"Department of Biomedical Informatics, School of Medicine, Emory University, Atlanta, GA, United States.","results":"BACKGROUND: Identification of metastasis status in non-small cell lung cancer (NSCLC) is a critical part of understanding disease prognosis, treatment courses, trial eligibility, and population-level cancer surveillance.…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Identification of metastasis status in non-small cell lung cancer (NSCLC) is a critical part of understanding disease prognosis, treatment courses, trial eligibility, and population-level cancer surveillance. However, metastasis status is inconsistently recorded in structured cancer registry fields, since manual abstraction of clinical notes is often an error-prone process. This challenge highlights an opportunity for leveraging large language models (LLMs) to conduct high-scale metastasis extraction from real-world clinical documentation. OBJECTIVE: We conducted a retrospective, multicohort comparative evaluation of 3 distinct LLMs for 2 independent classification tasks: overall metastasis presence at any site and brain/central nervous system (CNS) metastasis presence. We evaluated model performance on 2 independent NSCLC cohorts: one with registry labels and another with manual annotations. We further explored whether our methods could analyze clinical documentation and recover missing information in structured registry fields. METHODS: Patient cohorts were derived from the Winship Cancer Institute. Cohort 1 (n=579 patients; 24,887 notes across 69 note types; 2023-2025) used registry-linked metastasis fields as the reference standard. Cohort 2 (n=22 patients; 644 radiology notes; 2010-2021) was drawn from 2 completed randomized trials and used dual-annotated labels (Cohen κ: 0.93 overall metastasis; 0.88 CNS metastasis) as the reference standard. We fine-tuned the GatorTron-base encoder model for each independent binary classification task. We evaluated MedGemma-27B-text and Llama 3.1-70B using zero-shot prompting. A separate cohort of 675 patients with missing registry labels was used for an exploratory missingness-recovery analysis, validated against annotations of a random subsample. Our best-performing model was used to conduct further site-specific metastasis classification, based on available registry data. RESULTS: More than half (675/1260, 54%) of initially identified cohort 1 patients had missing or unknown registry metastasis labels. MedGemma demonstrated the best performance in overall metastasis classification (cohort 1: F1-score=0.80; cohort 2 patient-level: F1-score=1.0; cohort 2 note-level: F1-score=0.93). For brain/CNS metastasis, Llama3 performed best in both cohorts (cohort 1: F1-score=0.79; cohort 2 patient-level: F1-score=0.93; cohort 2 note-level: F1-score=0.86). The fine-tuned GatorTron model showed strong performance for classification of overall metastasis in cohort 1 (F1-score=0.72). Error analysis indicated that several model errors reflected incomplete registry labels, ambiguous clinical language, or missing documentation. In the exploratory recovery analysis, model predictions agreed with manual annotations at an accuracy of 0.90 and F1-score of 0.89. Additional site-specific metastasis classification by MedGemma demonstrated high performance for liver metastasis (F1-score=0.82) and bone metastasis (F1-score=0.79). CONCLUSIONS: All models demonstrated relatively high performance. The zero-shot generative models were more robust to nuanced documentation and context-dependent brain/CNS metastasis extraction. The fine-tuned encoder model demonstrated strong classification performance but may have been limited by potential inaccuracies in the registry reference standards during model training. This study further demonstrated the potential of LLMs in recovering plausible structured labels from narrative text, complementing cancer registries for metastasis ascertainment.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882867","pmid":"42882867","pmcid":"","doi":"10.3390/cancers18193173","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882867/","notice_url":"","trial_url":"","pub_date":"2026-Oct-01","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Durvalumab Plus High-Dose Radiation in NSCLC III: Long-Term Results from the Austrian Radio-Oncological Lung Cancer Study Association Registry (ALLSTAR).","title_en":"Durvalumab Plus High-Dose Radiation in NSCLC III: Long-Term Results from the Austrian Radio-Oncological Lung Cancer Study Association Registry (ALLSTAR).","authors":"Hörmandinger K, Ruznic E, Klebermass M, Grambozov B, Feurstein P, Karner J, Gruber G, Heilmann M et al.","affiliation_highlight":"Comprehensive Cancer Centre, Department of Radiation Oncology, Medical University Innsbruck, A-6020 Innsbruck, Austria.","results":"PURPOSE: Chemoradioimmunotherapy (CRIT) with 60-66 Gy is the standard of care (SoC) for non-small-cell lung cancer (NSCLC) UICC stage III. The aim of this real-world data (RWD) study was to report the long-term impact of…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"PURPOSE: Chemoradioimmunotherapy (CRIT) with 60-66 Gy is the standard of care (SoC) for non-small-cell lung cancer (NSCLC) UICC stage III. The aim of this real-world data (RWD) study was to report the long-term impact of Durvalumab and radiation dose escalation on clinical outcomes. MATERIAL AND METHODS: ALLSTAR is a nationwide prospective multicentre registry for NSCLC UICC stage III, in which 12/14 Austrian centres participated (ethics approval number: 1002/2019). The basis for the current analysis is the third data extraction, which was completed on 2 June 2025. Apart from the SoC, alternative dose-fractionation and sequential CRT concepts >66 Gy were also permitted. Durvalumab maintenance treatment for one year was administered at the discretion of the tumour board at each centre. RESULTS: Compared to prior analyses by our group, 40 individuals who completed follow-up (FUP) were added to this final analysis, leading to a total patient population of 228 (156 CRT plus Durvalumab; 72 CRT). In 156 patients, Durvalumab was added to CRT, while 72 received CRT only. The median FUP periods were 41.0 (95%-CI: 36.7-45.4) and 37.8 months (95%-CI: 31.4-44.1) for the Durvalumab and CRT cohort, respectively. Radiation dose escalation combined with Durvalumab treatment was associated with a nominally higher ITC of 37 months (95%-CI: 24.5-not reached) compared with 17.7 months (95%-CI: 14.9-not reached) in patients receiving neither dose escalation nor Durvalumab (N = 135; HR = 0.61; 95%-CI: 0.37-1.006; p-value 0.051). With Durvalumab maintenance, a median PFS of 22.8 months (95%-CI: 19.4-38.3) was observed compared to 16.5 months (95%-CI: 12.6-24.5) without (N = 228; HR = 0.61; 95%-CI: 0.42-0.88; p-value 0.0071). Median OS was 52.6 months (95%-CI: 39.5-not reached) with Durvalumab compared to 27.4 months (95%-CI: 18.7-not reached) without (N = 228; HR = 0.52; 95%-CI: 0.34-0.78; log-rank p-value < 0.002). Median time to death or distant metastasis (TTDM) was 33.3 months (95%-CI: 23.5-45) in the Durvalumab cohort compared to 18.7 months (95%-CI: 14.8-not reached) in the CRT cohort (N = 228; HR = 0.60; 95%-CI: 0.42-0.89; log-rank p-value 0.01). Median time to death or local relapse (TDLR) with Durvalumab was 30.4 months (95%-CI: 23.5-51.1) compared to 17.2 months (95%-CI: 14.8-25.7) without (N = 226; HR = 0.58; 95%-CI: 0.40-0.83; log-rank p-value < 0.003). CONCLUSION: This final RWD analysis implies both a beneficial effect of high-dose irradiation combined with Durvalumab on ITC and the long-lasting impact of Durvalumab on PFS, OS, TTDM, and TDLR.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882056","pmid":"42882056","pmcid":"","doi":"10.3390/jcm15197594","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882056/","notice_url":"","trial_url":"","pub_date":"2026-Sep-30","briefing_date":"2026-10-17","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Prognostic Value of Pretreatment Modified Glasgow Prognostic Score in Nivolumab-Treated Advanced Non-Small Cell Lung Cancer.","title_en":"Prognostic Value of Pretreatment Modified Glasgow Prognostic Score in Nivolumab-Treated Advanced Non-Small Cell Lung Cancer.","authors":"Biter S, Kıdı MM, Aydınalp Camadan Y, İpek ŞA, Asarkaya E, Asoğlu H, Bayram E, Köşeci T et al.","affiliation_highlight":"Department of Medical Oncology, Çukurova University Faculty of Medicine, Adana 01330, Turkey.","results":"Background/Objectives: Immune checkpoint inhibitors have become a standard treatment option for advanced/metastatic non-small cell lung cancer (NSCLC); however, considerable heterogeneity exists among patients regarding …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: Immune checkpoint inhibitors have become a standard treatment option for advanced/metastatic non-small cell lung cancer (NSCLC); however, considerable heterogeneity exists among patients regarding treatment response and survival. This study aimed to determine whether the pretreatment modified Glasgow Prognostic Score (mGPS), a marker of systemic inflammation and nutritional status, is prognostically associated with progression-free survival (PFS) and overall survival (OS) in patients with advanced/metastatic NSCLC treated with nivolumab at a single tertiary oncology center. Methods: This retrospective, single-center cohort study included 130 adult patients with histologically confirmed advanced/metastatic NSCLC who received nivolumab at the Department of Medical Oncology, Çukurova University Faculty of Medicine. The pretreatment mGPS (0, 1, or 2), derived from baseline serum C-reactive protein (CRP) and albumin levels, was analyzed in relation to PFS and OS using the Kaplan-Meier method, log-rank test, and Cox proportional hazards regression. The prognostic value of mGPS was tested in multivariable Cox models adjusted for age, sex, Eastern Cooperative Oncology Group (ECOG) performance status, histology, brain metastasis, liver metastasis, and neutrophil-to-lymphocyte ratio (NLR); the proportional hazards assumption was formally tested, and the incremental discriminative contribution of mGPS was assessed using bootstrap resampling. Results: Among 130 patients, 83.8% received nivolumab as second-line therapy. Pretreatment mGPS was 0, 1, and 2 in 40 (30.8%), 55 (42.3%), and 35 (26.9%) patients, respectively. Median OS was not reached, 9.7 months, and 3.0 months across mGPS 0, 1, and 2, respectively; corresponding median PFS values were 10.2, 4.8, and 3.0 months (log-rank p < 0.001 for both endpoints). After adjustment for age, sex, ECOG performance status, histology, brain metastasis, liver metastasis, and NLR, each one-point increase in mGPS remained associated with worse OS (adjusted HR 2.38; 95% CI 1.64-3.46; p < 0.001) and PFS (adjusted HR 1.81; 95% CI 1.32-2.48; p < 0.001), independent of the covariates included in the model. The proportional hazards assumption held for mGPS in both models. Addition of mGPS to the clinical-variables-only model was associated with higher model discrimination (Harrell's C-index: 0.676 to 0.737 for OS and 0.620 to 0.666 for PFS), a difference confirmed as statistically significant by bootstrap resampling (2000 iterations; 95% CI for the difference excluding zero, p < 0.001 for both endpoints). Conclusions: Pretreatment mGPS is a simple, readily available marker that shows a robust prognostic-rather than treatment-predictive-association with both OS and PFS in patients with advanced/metastatic NSCLC treated predominantly as second-line nivolumab monotherapy. Its addition to established clinical variables was associated with a statistically significant, though modest, improvement in prognostic discrimination. These findings require prospective, multicenter validation, including in first-line immunotherapy settings, before mGPS can be recommended for routine clinical risk stratification.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882029","pmid":"42882029","pmcid":"","doi":"10.3390/jcm15197567","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882029/","notice_url":"","trial_url":"","pub_date":"2026-Sep-29","briefing_date":"2026-10-17","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Preoperative CRP-Albumin-Lymphocyte (CALLY) Index Is Associated with Survival but Does Not Predict Anastomotic Leak or Major Morbidity After Minimally Invasive Esophagectomy.","title_en":"Preoperative CRP-Albumin-Lymphocyte (CALLY) Index Is Associated with Survival but Does Not Predict Anastomotic Leak or Major Morbidity After Minimally Invasive Esophagectomy.","authors":"Çağlıyan Ö, Düzköylü Y, Karaköse E, Kılavuz H, Şevik HO, Tekin O, Yoran ED, Topgül OH et al.","affiliation_highlight":"Department of Gastroenterological Surgery, Başakşehir Çam and Sakura City Hospital, 34480 Istanbul, Turkey.","results":"Background/Objectives: The CRP-albumin-lymphocyte (CALLY) index is promoted both as a marker of postoperative morbidity and as a prognostic factor for survival. These claims are rarely tested together, thresholds usually…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: The CRP-albumin-lymphocyte (CALLY) index is promoted both as a marker of postoperative morbidity and as a prognostic factor for survival. These claims are rarely tested together, thresholds usually come from the dataset in which they are then tested, and the index is seldom compared against its components. We examined both in one minimally invasive esophagectomy cohort. Methods: Consecutive esophagectomies with a thoracoscopic or robotic thoracic phase at one centre were reviewed. The index was derived from the preoperative albumin, C-reactive protein, and lymphocyte count. Short-term endpoints were major morbidity (Clavien-Dindo grade ≥ 3) and anastomotic leak; survival was analysed by Kaplan-Meier and Cox methods, with internal cut-points stress-tested by bootstrapping. Results: Of 154 esophagectomies screened, 22 open or transhiatal procedures and one exploration without resection were excluded, leaving 131 patients. Major morbidity occurred in 39 (29.8%), and leak in 21 (16.0%). The index discriminated neither: area under the curve 0.556 (95% CI: 0.450-0.663) and 0.481 (95% CI: 0.339-0.623). Over a median follow-up of 31.0 months, there were 39 deaths, and median survival was 62.1 months. Here, the index behaved differently: each unit of log-CALLY carried a hazard ratio of 0.776 (95% CI: 0.643-0.936, p = 0.008), and three-year survival rose from 48.5% in the lowest tertile to 77.1% in the highest (trend p = 0.020). The association held after adjustment for stage and nodal status (0.749, 95% CI: 0.609-0.922, p = 0.006), lifting the concordance index of a stage-based model from 0.699 to 0.741. However, entered with CRP, the index lost significance. Conclusions: The index said nothing useful about early surgical morbidity yet was independently associated with survival, although that signal did not survive adjustment for CRP alone. It belongs with prognostic markers rather than perioperative risk scores.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42881832","pmid":"42881832","pmcid":"","doi":"10.3390/jcm15197370","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42881832/","notice_url":"","trial_url":"","pub_date":"2026-Sep-23","briefing_date":"2026-10-17","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Pulmonary Resection for Bronchiectasis: Perioperative and Follow-Up Outcomes in a VATS-Dominant Cohort.","title_en":"Pulmonary Resection for Bronchiectasis: Perioperative and Follow-Up Outcomes in a VATS-Dominant Cohort.","authors":"Can A, Yıldıran H","affiliation_highlight":"Department of Thoracic Surgery, Faculty of Medicine, Selcuk University, Selçuklu, Konya 42131, Türkiye.","results":"Background/Objectives: Surgical resection remains an important treatment option for selected patients with bronchiectasis who have persistent symptoms, recurrent pulmonary infections, or hemoptysis despite medical therap…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: Surgical resection remains an important treatment option for selected patients with bronchiectasis who have persistent symptoms, recurrent pulmonary infections, or hemoptysis despite medical therapy. This study evaluated perioperative and follow-up outcomes after pulmonary resection for bronchiectasis in a predominantly video-assisted thoracoscopic surgery (VATS)-treated cohort. Methods: This retrospective single-center cohort included patients who underwent pulmonary resection for bronchiectasis between January 2009 and January 2026. Baseline and follow-up data were analyzed at the patient level, whereas operative and perioperative outcomes were assessed at the procedure level. Follow-up duration was calculated from the most recent resection to the last available clinical assessment. Results: Thirty-four patients underwent 37 pulmonary resections. Multilobar disease was present in 14 procedures (37.8%). VATS was used in 30 procedures (81.1%) and thoracotomy in 7 (18.9%). Median hospital stay was 11 days (range, 4-41). Postoperative complications occurred after 6 procedures (16.2%), with no 30-day mortality. Complete or partial symptomatic improvement occurred after 31 procedures (83.8%). Median follow-up was 20.8 months (interquartile range, 5.9-58.8; range, 0.4-144.2). At the last available clinical assessment, 23 patients (67.6%) had no recorded symptoms; recurrent hemoptysis occurred in 1 (2.9%) an
