d recurrent pulmonary infection in 2 (5.9%). Conclusions: Pulmonary resection for bronchiectasis was associated with acceptable morbidity, no 30-day mortality, and a high rate of postoperative clinical improvement in this VATS-dominant cohort. Most patients had no recorded symptoms at their last available clinical assessment, while recurrent hemoptysis and pulmonary infection were uncommon.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42873309","pmid":"42873309","pmcid":"10239601","doi":"10.1016/j.jpedsurg.2017.08.059","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42873309/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-17","journal_abbr":"Pediatr Surg Int","journal_full":"Pediatric surgery international","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"队列研究（启发式判定）","category":"surgery","category_label":"微创与无管化胸外科","score_total":40,"score_breakdown":{"clinical":20,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Routine pulmonary wound closure after thoracoscopic sublobar resection for congenital lung malformations in children: impact on early recovery, one-year CT-based lung expansion, and the learning curve.","title_en":"Routine pulmonary wound closure after thoracoscopic sublobar resection for congenital lung malformations in children: impact on early recovery, one-year CT-based lung expansion, and the learning curve.","authors":"Huang JX, Hong SM, Hong JJ, Liu JF, Qiu L, Zeng RJ, Chen Q, Wang ZC et al.","affiliation_highlight":"Department of Cardiothoracic Surgery, College of Clinical Medicine for Obstetrics & Gynecology and Pediatrics, Fujian Ch…","results":"BACKGROUND: The necessity of routine pulmonary parenchymal wound closure following thoracoscopic sublobar resection for congenital lung malformations (CLMs) in children remains uncertain. This study aimed to evaluate the…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: The necessity of routine pulmonary parenchymal wound closure following thoracoscopic sublobar resection for congenital lung malformations (CLMs) in children remains uncertain. This study aimed to evaluate the association of routine wound closure with drainage-related recovery, perioperative outcomes, one-year computed tomography (CT)-based lung re-expansion, and the procedural learning curve. METHODS: Consecutive children who underwent thoracoscopic sublobar resection for CLMs between January 2021 and March 2025 were retrospectively reviewed. The cohort was divided into a non-closure group and a routine-closure group according to wound management strategy. Pulmonary wound closure was performed using an absorbable barbed suture, generally proceeding from the peripheral or lower-tension side toward the central or higher-tension region. Irregular wounds were managed by initiating closure from multiple peripheral points converging centrally while preserving the natural axis of residual bronchi and vasculature. Outcomes included chest tube duration, drainage volume, prolonged air leak, chest tube reinsertion, postoperative hospital stay, perioperative complications, one-year CT-based volumetric indices, and closure-time learning curve metrics. RESULTS: A total of 285 children were included, comprising 75 in the non-closure group and 210 in the closure group. Baseline characteristics were comparable between groups. Compared with the non-closure group, the closure group exhibited significantly shorter chest tube duration (0.87 ± 0.74 vs. 2.81 ± 1.99 days, P < 0.001), lower postoperative drainage volume (2.12 ± 0.70 vs. 7.21 ± 2.58 mL/kg/day, P < 0.001), reduced rates of prolonged air leak and drainage failure, and shorter postoperative hospital stay (5.63 ± 0.83 vs. 7.68 ± 2.10 days, P < 0.001). At one-year follow-up, CT-based volumetric assessment revealed no evidence that wound closure restricted residual lung re-expansion. Closure time decreased from approximately 22 min in the early phase to 11 min in the late phase, with learning curve inflection points identified at cases 47 and 135. CONCLUSIONS: Routine pulmonary wound closure following thoracoscopic sublobar resection for pediatric CLMs was associated with improved drainage-related recovery and shorter hospitalization, without compromising one-year lung re-expansion on CT. Although closure adds a procedural step, efficiency improved substantially with experience, demonstrating a quantifiable learning curve.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42887461","pmid":"42887461","pmcid":"","doi":"10.1016/j.ejca.2026.117774","nct_id":"NCT05786430","url":"https://pubmed.ncbi.nlm.nih.gov/42887461/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT05786430","pub_date":"2026-Oct-08","briefing_date":"2026-10-17","journal_abbr":"Eur J Cancer","journal_full":"European journal of cancer (Oxford, England : 1990)","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Lazertinib plus pemetrexed and carboplatin in patients with EGFR-mutant advanced non-small cell lung cancer after progression on lazertinib.","title_en":"Lazertinib plus pemetrexed and carboplatin in patients with EGFR-mutant advanced non-small cell lung cancer after progression on lazertinib.","authors":"Hong MH, Shim BY, Kim CG, Kim YS, Lee S, Lee Y, Ahn BC, Ahn MJ et al.","affiliation_highlight":"Division of Medical Oncology, Yonsei Cancer Center, Yonsei University College of Medicine, Seoul, Korea.","results":"BACKGROUND: Therapeutic strategies after progression on third-generation EGFR tyrosine kinase inhibitors (EGFR-TKIs) remain suboptimal in EGFR-mutant non-small cell lung cancer (NSCLC). We investigated whether continuing…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Therapeutic strategies after progression on third-generation EGFR tyrosine kinase inhibitors (EGFR-TKIs) remain suboptimal in EGFR-mutant non-small cell lung cancer (NSCLC). We investigated whether continuing EGFR inhibition with lazertinib combined with platinum-pemetrexed chemotherapy could extend clinical benefit after progression on prior lazertinib. METHODS: In the multicenter, single-arm, phase II LUCAS study (NCT05786430), patients with advanced EGFR-mutant NSCLC who had progressed on lazertinib received lazertinib 240 mg daily plus pemetrexed-carboplatin for four cycles, followed by maintenance lazertinib and pemetrexed. The primary endpoint was progression-free survival (PFS); secondary endpoints included overall survival (OS), objective response rate (ORR), intracranial PFS, safety, and exploratory ctDNA analyses. RESULTS: Of 86 patients, 46.5% had a history of brain metastases. Among 81 response-evaluable patients, median PFS was 9.5 months (95% CI: 6.3-9.6; one-sided p = 0.017 against a null median of 6.0 months). In the safety population, median OS was 15.9 months (95% CI: 12.4-20.0) and ORR was 36.0% (95% CI: 26.0-47.1). Outcomes were similar irrespective of prior lazertinib line or EGFR subtype. Baseline ctDNA-detected EGFR amplification was associated with inferior survival. Among 36 patients with radiologically evident baseline brain metastases, median intracranial PFS was 9.9 months (95% CI: 7.8-16.4) with infrequent isolated intracranial progression. Grade ≥ 3 adverse events occurred in 69.8%, predominantly hematologic, without new safety signals. CONCLUSIONS: Continuation of lazertinib with platinum-pemetrexed chemotherapy after progression on prior lazertinib was associated with meaningful systemic and intracranial activity and manageable toxicity. Randomized evaluation is required to establish the incremental benefit of lazertinib continuation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42886469","pmid":"42886469","pmcid":"","doi":"10.4103/jmas.jmas_302_26","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886469/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-17","journal_abbr":"J Minim Access Surg","journal_full":"Journal of minimal access surgery","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Non-intubated video-assisted thoracoscopic McKeown oesophagectomy using i-gel™ and continuous pressure support ventilation: A case report.","title_en":"Non-intubated video-assisted thoracoscopic McKeown oesophagectomy using i-gel™ and continuous pressure support ventilation: A case report.","authors":"Ranjan M, Sirohiya P, Maurya P, Kumar N","affiliation_highlight":"Department of Onco-Anaesthesia and Palliative Medicine, Dr.","results":"Non-intubated video-assisted thoracoscopic surgery (NIVATS) minimises airway trauma and ventilator-induced lung injury, yet its application in complex, multi-phase McKeown oesophagectomy is seldom reported. A 32-year-old…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Non-intubated video-assisted thoracoscopic surgery (NIVATS) minimises airway trauma and ventilator-induced lung injury, yet its application in complex, multi-phase McKeown oesophagectomy is seldom reported. A 32-year-old female (40 kg, 140 cm and body mass index: 20.4 kg/m 2 ) presented for McKeown minimally invasive oesophagectomy following neoadjuvant chemoradiotherapy. We employed a 'less invasive anaesthesia' strategy combining T9-T10 thoracic epidural analgesia with Bispectral Index-guided target-controlled propofol infusion. Continuous pressure support ventilation (16 cmH 2 O above a positive end-expiratory pressure of 5 cmH 2 O) with preserved spontaneous breathing was maintained via a size 3 i-gel™ throughout surgery; neuromuscular blockade and controlled mechanical ventilation were not used at any stage. Surgical exposure was optimised via right-sided capnothorax. The resulting permissive hypercapnia was haemodynamically well-tolerated. Recovery was uneventful, and the airway device was removed after protective airway reflexes had returned. She was discharged from the hospital on post-operative day 6 without any complications. NIVATS for McKeown oesophagectomy may be feasible in carefully selected patients.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42886039","pmid":"42886039","pmcid":"","doi":"10.1148/rycan.250617","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42886039/","notice_url":"","trial_url":"","pub_date":"2026-Nov","briefing_date":"2026-10-17","journal_abbr":"Radiol Imaging Cancer","journal_full":"Radiology. Imaging cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"ai_digital","category_label":"胸外科 AI 与三维重建","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Multimodal Transformer Integrating CT and Pathology for Postoperative Risk Stratification in Stage I Non-Small Cell Lung Cancer.","title_en":"Multimodal Transformer Integrating CT and Pathology for Postoperative Risk Stratification in Stage I Non-Small Cell Lung Cancer.","authors":"Wang L, Zong Y, Li X, Tang H, Yao J, Cao Y, Luo Y, Li J et al.","affiliation_highlight":"Department of Radiology, Jinling Hospital, The First School of Clinical Medicine, Southern Medical University, 305 Zhong…","results":"Purpose To develop and evaluate an interpretable, multimodal deep learning model to improve postoperative risk stratification and predict adjuvant therapy benefit in stage I non-small cell lung cancer (NSCLC). Materials …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Purpose To develop and evaluate an interpretable, multimodal deep learning model to improve postoperative risk stratification and predict adjuvant therapy benefit in stage I non-small cell lung cancer (NSCLC). Materials and Methods In this multicenter retrospective study of patients with stage I NSCLC, a multimodal model called the Deep Learning-Radiomic-Text Transformer (DLRTransformer) was developed by integrating multiview 2.5-dimensional deep learning features from CT scans, radiomics, clinical variables, and prognostic embeddings extracted from pathology reports using a large language model. A central transformer architecture fuses these features to predict disease-free survival. Model performance was evaluated on independent external datasets and compared with guideline-based risk stratification. Associations between model-derived risk scores and tumor microenvironment features were analyzed to assess biologic interpretability. Results A total of 1073 patients (mean age ± SD, 60.8 years ± 9.8; 550 male) were enrolled from five centers. On external datasets, DLRTransformer demonstrated robust prognostic performance (concordance index, 0.77-0.78), outperforming the guideline-based risk stratification (concordance index, 0.60-0.65). Risk scores were associated with tumor microenvironment phenotypes, including increased neoplastic cellularity and reduced tertiary lymphoid structures. A treatment-by-risk interaction was observed (interaction hazard ratio [HR], 0.14; 95% CI: 0.06, 0.32; P < .01). In propensity score-matched subcohorts, adjuvant therapy improved disease-free survival in high-risk patients (HR, 0.30; 95% CI: 0.11, 0.84; P = .02) but not in low-risk patients (HR, 1.70; 95% CI: 0.97, 2.99; P = .06). Conclusion The DLRTransformer improved postoperative risk stratification compared with guideline-based risk stratification and identified patients with stage I NSCLC who benefited from adjuvant therapy. Keywords: Deep Learning, Large Language Models LLMs, CT, Prognosis & Prediction, Non-Small Cell Lung Cancer (NSCLC), Multimodal Deep Learning, Risk Stratification, Adjuvant Therapy, Tumor Microenvironment (TME) Supplemental material is available for this article. © The Author(s) 2026. Published by the Radiological Society of North America under a CC BY 4.0 license.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42885537","pmid":"42885537","pmcid":"","doi":"10.1111/1759-7714.70401","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42885537/","notice_url":"","trial_url":"","pub_date":"2026-Oct","briefing_date":"2026-10-17","journal_abbr":"Thorac Cancer","journal_full":"Thoracic cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Nodule Dye-Localization Using Interventional Fluoroscopy for Image-Guided Sublobar Lung Resection.","title_en":"Nodule Dye-Localization Using Interventional Fluoroscopy for Image-Guided Sublobar Lung Resection.","authors":"Wu YL, Kam KH, Liang CY, Lai YT, Jeng TH, Lee CC, Wu YF, Yang YC et al.","affiliation_highlight":"Division of Thoracic Surgery, Department of Surgery, Ditmanson Medical Foundation Chia-Yi Christian Hospital, Chia-Yi, T…","results":"BACKGROUND: Precise localization is critical for sublobar resection of small pulmonary nodules. We evaluated the safety, technical efficiency, and clinical outcomes of preoperative percutaneous dye-localization using a c…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Precise localization is critical for sublobar resection of small pulmonary nodules. We evaluated the safety, technical efficiency, and clinical outcomes of preoperative percutaneous dye-localization using a cone-beam computed tomography (CBCT)-enabled flat-panel detector interventional fluoroscopy system in a hybrid operating room (HOR). METHODS: We retrospectively reviewed 74 consecutive patients (137 lesions) who underwent image-guided localization followed by video-assisted thoracoscopic surgery (VATS) sublobar resection (wedge resection or segmentectomy) between 2022 and 2023 at Chia-Yi Christian Hospital. Procedural workflow, localization success, surgical margins, and perioperative outcomes were systematically analyzed. RESULTS: Technical localization success was achieved in 100% of lesions (mean nodule diameter: 8.59 ± 4.85 mm). The procedure required a mean of 1.31 ± 0.67 puncture attempts per lesion at a mean depth of 5.22 ± 1.86 cm. Procedure-related pneumothorax occurred in 29.7% (22/74) of patients, with 14.9% (11/74) requiring pigtail catheter drainage; pneumothorax occurrence was significantly associated with multiple puncture attempts (p < 0.001) and lower-lobe lesions (p = 0.001). Lower-lobe location was significantly associated with requiring more puncture attempts (p = 0.028). For malignant lesions, the mean pathological resection margin was 17.16 ± 8.73 mm, with 92.31% achieving a margin-to-tumor ratio (MTR) ≥ 1. The mean postoperative hospital stay was 3.04 ± 1.16 days. CONCLUSIONS: Single-stage image-guided dye-localization and VATS sublobar lung resection in an HOR using a biplane CBCT-enabled platform is safe, feasible, and effective. This streamlined workflow ensures high technical success and adequate surgical margins with manageable complications. Further studies are warranted to evaluate long-term oncological outcomes.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882934","pmid":"42882934","pmcid":"","doi":"10.3390/cancers18193240","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882934/","notice_url":"","trial_url":"","pub_date":"2026-Oct-08","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The Dynamic Role of Liquid Biopsy in Patients with Non-Small Cell Lung Cancer Receiving Immune Checkpoint Inhibitors: Emerging Opportunities and Clinical Challenges.","title_en":"The Dynamic Role of Liquid Biopsy in Patients with Non-Small Cell Lung Cancer Receiving Immune Checkpoint Inhibitors: Emerging Opportunities and Clinical Challenges.","authors":"Bazan Russo TD, Gristina V, Pepe F, Scimone C, Busuito G, Cozzolino D, Sarracino C, Ratto G et al.","affiliation_highlight":"Department of Precision Medicine in Medical, Surgical and Critical Care (Me.Pre.C.C.), University of Palermo, 90127 Pale…","results":"Immune checkpoint inhibitors (ICIs) have transformed the treatment of non-small-cell lung cancer (NSCLC), yet predicting durable benefit and detecting resistance remain major challenges. As immunotherapy expands across d…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Immune checkpoint inhibitors (ICIs) have transformed the treatment of non-small-cell lung cancer (NSCLC), yet predicting durable benefit and detecting resistance remain major challenges. As immunotherapy expands across disease stages, minimally invasive tools are increasingly needed to monitor response and inform treatment personalization. Liquid biopsy enables serial assessment of circulating tumor DNA (ctDNA) and other blood-based biomarkers, complementing tissue analysis and imaging. This review critically synthesizes evidence across resectable, locally advanced, and metastatic NSCLC, integrating ctDNA dynamics with emerging multi-omics approaches. Its contribution is to distinguish the prognostic value of circulating biomarkers from evidence that using them to guide treatment improves patient outcomes, while identifying priorities for clinical translation. Across the reviewed studies, ctDNA clearance is associated with favorable outcomes, whereas persistent or rising ctDNA signals an increased risk of recurrence or progression, sometimes before radiological detection. Methylation, fragmentomics, plasma proteomics, and immune-cell profiling may provide complementary information on tumor-immune interactions. However, low tumor shedding, clonal hematopoiesis, assay variability, and unvalidated intervention thresholds limit routine use. The expansion of perioperative immunotherapy and emerging interest in biomarker-guided treatment adaptation make this synthesis timely. Prospective interventional trials are needed to determine whether liquid biopsy can safely guide treatment escalation, de-escalation, or discontinuation. By clarifying both the promise and the limitations of longitudinal monitoring, this review informs research aimed at detecting ineffective treatment earlier and reducing unnecessary treatment exposure while preserving cancer control.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882902","pmid":"42882902","pmcid":"","doi":"10.3390/cancers18193208","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882902/","notice_url":"","trial_url":"","pub_date":"2026-Oct-04","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"A Chronobiological Prognostic Model for Resected Stage I Non-Small-Cell Lung Cancer.","title_en":"A Chronobiological Prognostic Model for Resected Stage I Non-Small-Cell Lung Cancer.","authors":"Leuzzi G, Minicozzi P, Verderio P, Ciniselli CM, Ferrari M, Pardolesi A, Stanzi A, Brandolini J et al.","affiliation_highlight":"Division of Thoracic Surgery, Fondazione IRCCS Istituto Nazionale dei Tumori, 20133 Milan, Italy.","results":"OBJECTIVES: Chronobiology may influence outcomes in non-small-cell lung cancer (NSCLC), but its prognostic role in early-stage disease remains unclear. We evaluated the association between perioperative chronobiological …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: Chronobiology may influence outcomes in non-small-cell lung cancer (NSCLC), but its prognostic role in early-stage disease remains unclear. We evaluated the association between perioperative chronobiological variables, systemic inflammation, and long-term outcomes after complete resection for stage I NSCLC. METHODS: 587 patients who underwent curative-intent resection for pathological stage I NSCLC between 2009 and 2018 were retrospectively reviewed. Chronobiological and inflammatory variables included season of surgery (spring/summer [21st March-22nd September], autumn/winter [23rd September-20th March]), time of day, day of week, and preoperative (CRP0 levels: low ≤ 3 mg/L, high > 3 mg/L) and postoperative day-3 (CRP3 levels: low ≤ 126 mg/L, high > 126 mg/L) C-reactive protein levels. The cohort was randomly divided into training (70%) and testing (30%) sets to develop and validate a prognostic model for overall survival (OS), taking into consideration the follow-up time. Disease-free survival (DFS) was analyzed as a secondary endpoint. RESULTS: Median follow-up was 6.7 years, with 80 deaths and 108 recurrences recorded. In the training set, older age (p = 0.0049), stage IB disease (p = 0.0301), high CRP0 (p = 0.0049), and high CRP3 (p = 0.0280) were associated with worse OS, while surgery performed during autumn/winter was associated with improved OS (p = 0.0312). The multivariate Cox model including age, stage, and season of surgery showed the best prognostic performance (C-index 0.67, 95% Bonferroni-adjusted CI 0.50-0.83) and was internally validated in the testing cohort (C-index 0.69, 95%CI 0.52-0.86). The resulting linear predictor remained associated with both OS and DFS in the overall population. CONCLUSIONS: A simple model integrating age, pathological stage, and season of surgery was associated with long-term outcomes after surgery in stage I NSCLC. This model provides an exploratory framework integrating host-, tumor-, and chronobiological dimensions of prognosis. These findings require external validation and further investigation of the biological mechanisms underlying seasonal variation.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882853","pmid":"42882853","pmcid":"","doi":"10.3390/cancers18193159","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882853/","notice_url":"","trial_url":"","pub_date":"2026-Sep-29","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"AI-Driven Multi-Omics Approaches for Deciphering Small-Cell Lung Cancer Heterogeneity Using Nucleic-Acid-Based Features.","title_en":"AI-Driven Multi-Omics Approaches for Deciphering Small-Cell Lung Cancer Heterogeneity Using Nucleic-Acid-Based Features.","authors":"Zeeshan S, McVey C, Majeed S, Ahmed Z, Nichols M","affiliation_highlight":"Department of Biomedical and Health Informatics, School of Medicine, The University of Missouri-Kansas City, Kansas City…","results":"BACKGROUND: Small-cell lung cancer (SCLC) is a rare but highly aggressive malignancy defined by rapid progression, early metastasis, and profound therapeutic resistance. Its extensive heterogeneity across genomic, transc…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Small-cell lung cancer (SCLC) is a rare but highly aggressive malignancy defined by rapid progression, early metastasis, and profound therapeutic resistance. Its extensive heterogeneity across genomic, transcriptomic, epigenetic, proteomic, and microenvironmental levels continues to undermine precision medicine. Emerging evidence highlights the complex role of epidermal growth factor receptor (EGFR) alterations, histologic transformation from EGFR-mutant non-small cell lung cancer (NSCLC) to SCLC, and the influence of distinct transcriptional subtypes on clinical behavior. METHODS: This review synthesizes current literature encompassing nucleic-acid-based determinants of resistance, SCLC molecular architecture, transformation biology, and subtype evolution, integrating findings from genomic, transcriptomic, epigenetic, proteomic, imaging, and clinical studies. We additionally evaluated artificial intelligence (AI) and machine learning (ML) methodologies with potential to unify multi-omics, radiomics, and clinical variables to model subtype plasticity, clonal evolution, and therapy-induced rewiring. RESULTS: The evidence demonstrates that traditional single-layer analyses are insufficient to capture the multiscale architecture of SCLC biology or the nonlinear interactions driving resistance, whereas AI-enabled multi-omics approaches offer advantages in enhancing subtype classification, supporting early detection, and improving prediction of therapeutic response. Key barriers such as tissue scarcity, limited biomarker availability, and extreme intratumoral heterogeneity remain significant challenges, though increasingly addressable through integrative computational frameworks. CONCLUSION: AI-driven systems-level integration reframes SCLC as a dynamically evolving, multilayered disease process, where nucleic-acid alterations are central to subtype evolution and treatment resistance, providing a conceptual model to guide biomarker discovery and therapeutic development. By leveraging AI-enabled multi-omics and radiomics, this framework has the potential to advance personalized clinical management and overcome longstanding diagnostic and therapeutic challenges in SCLC.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882836","pmid":"42882836","pmcid":"","doi":"10.3390/cancers18193140","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882836/","notice_url":"","trial_url":"","pub_date":"2026-Sep-28","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"nodule","category_label":"肺结节与早筛管理","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Refining Lung Cancer Care: The Emerging Role of Liquid Biopsy in Screening, Diagnosis, and Precision Oncology.","title_en":"Refining Lung Cancer Care: The Emerging Role of Liquid Biopsy in Screening, Diagnosis, and Precision Oncology.","authors":"Mansour H, Mazouji O, El Hammouti A, Alloubi I, Incitti R, El Kazzouli S, Ouhajjou A, Nejjari C et al.","affiliation_highlight":"Euromed Research Center, Euromed University of Fes (UEMF), Fes 30000, Morocco.","results":"Lung cancer (LC) remains the leading cause of cancer-related mortality worldwide, representing a major public health challenge. Although low-dose computed tomography is currently the standard screening method for high-ri…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Lung cancer (LC) remains the leading cause of cancer-related mortality worldwide, representing a major public health challenge. Although low-dose computed tomography is currently the standard screening method for high-risk individuals to reduce mortality, its clinical performance is limited by false-positive findings and restricted accessibility. Emerging biomarker-based liquid biopsy offers a promising non-invasive approach for cancer detection. This narrative review provides a critical overview and evaluation of clinically endorsed liquid biopsy applications for guiding treatment in advanced-stage lung cancer, as well as investigational advances in liquid biopsy for early cancer detection. We also address challenges of current liquid biopsy technologies, the integration of artificial intelligence, implementation improvements, and future perspectives for their adoption into routine clinical practice. To complement this narrative review, a structured search of the ClinicalTrials.gov registry was performed to identify clinical trials evaluating liquid biopsy in lung cancer. Current evidence supports the clinical use of liquid biopsy for molecular profiling and treatment selection in advanced non-small cell lung cancer (NSCLC), whereas its application in early detection, screening, and minimal residual disease (MRD)-guided management remains investigational and requires further prospective validation. Overall, liquid biopsy represents a promising complementary approach to advance precision oncology and improve lung cancer management.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"prospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882792","pmid":"42882792","pmcid":"","doi":"10.3390/cancers18193097","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882792/","notice_url":"","trial_url":"","pub_date":"2026-Sep-23","briefing_date":"2026-10-17","journal_abbr":"Cancers (Basel)","journal_full":"Cancers","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Longitudinal Assessment of EGFR and MET Transcriptional Activity Using Cell-Free Chromatin Immunoprecipitation in Two Patients with EGFR-Mutated Non-Small Cell Lung Cancer.","title_en":"Longitudinal Assessment of EGFR and MET Transcriptional Activity Using Cell-Free Chromatin Immunoprecipitation in Two Patients with EGFR-Mutated Non-Small Cell Lung Cancer.","authors":"Pedersen E, Maansson CT, Meldgaard P, Sorensen BS","affiliation_highlight":"Department of Clinical Biochemistry, Aarhus University Hospital, 8200 Aarhus, Denmark.","results":"Background/Objectives:MET amplification represents the most common bypass resistance mechanism to EGFR tyrosine kinase inhibitor (TKI) treatment in EGFR-mutated non-small cell lung cancer (NSCLC). Combination therapy wit…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives:MET amplification represents the most common bypass resistance mechanism to EGFR tyrosine kinase inhibitor (TKI) treatment in EGFR-mutated non-small cell lung cancer (NSCLC). Combination therapy with the EGFR-TKI, osimertinib, and the MET-TKI, crizotinib, has demonstrated clinical efficacy in overcoming this resistance. However, assessing MET transcriptional activity during treatment remains challenging. Methods: Cell-free chromatin immunoprecipitation (cfChIP) targeting H3 lysine 36 trimethylation (H3K36me3) was employed to investigate the transcriptional activity of the EGFR and MET genes in serial liquid biopsies obtained from two patients with EGFR-mutated NSCLC. Droplet digital PCR (ddPCR) was used to quantify circulating tumor DNA (ctDNA) and cfChIP enrichment levels. Results: In PT1, H3K36me3 mEGFR and MET cfChIP enrichment increased during disease progression, with MET enrichment increasing further following the initiation of crizotinib/osimertinib combination therapy, during which the patient experienced a partial response. In PT2, MET amplification was detected in a liquid biopsy, but MET cfChIP enrichment remained low throughout the treatment course, and the patient did not respond to crizotinib. Conclusions: This two-patient feasibility study illustrates the potential of cfChIP-ddPCR for the longitudinal assessment of EGFR and MET transcriptional activity in liquid biopsies. These observations warrant further investigation of cfChIP as an approach for monitoring transcriptional activity during osimertinib/crizotinib treatment.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42882103","pmid":"42882103","pmcid":"","doi":"10.3390/jcm15197644","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42882103/","notice_url":"","trial_url":"","pub_date":"2026-Oct-02","briefing_date":"2026-10-17","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Biomarker Integration in the Perioperative Management of Early-Stage Non-Small-Cell Lung Cancer.","title_en":"Biomarker Integration in the Perioperative Management of Early-Stage Non-Small-Cell Lung Cancer.","authors":"Rabinovich EP, Martin LW","affiliation_highlight":"Department of Surgery, University of Virginia Health System, Charlottesville, VA 22903, USA.","results":"The concept of personalized medicine has tremendous appeal-tailoring diagnosis and treatment to an individual, rather than a \"one-size-fits-all\" approach. The management of non-small-cell lung cancer (NSCLC) has rapidly …","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"The concept of personalized medicine has tremendous appeal-tailoring diagnosis and treatment to an individual, rather than a \"one-size-fits-all\" approach. The management of non-small-cell lung cancer (NSCLC) has rapidly evolved toward strategies increasingly guided by tumor biology and precision oncology. The safety and significant efficacy of biomarker-directed therapies in metastatic disease have fueled interest in applying precision oncology to early-stage, operable NSCLC. Advances in molecular profiling have revealed that a substantial proportion of resected NSCLC harbor actionable driver mutations, enabling the integration of targeted therapies into the perioperative setting. The success of adjuvant epidermal growth factor receptor and anaplastic lymphoma kinase inhibition established a framework for biomarker-driven therapy and highlights the importance of comprehensive molecular testing at diagnosis. In parallel, perioperative immune checkpoint inhibitor-based strategies have expanded treatment options for appropriately selected patients, further emphasizing the importance of molecular profiling. Significant implementation gaps remain, including incomplete molecular testing, delayed results, inadequate tissue sampling, fragmented workflows, and disparities in access. Beyond clinically actionable driver mutations, emerging research highlights radiogenomics and advances in the use of circulating tumor DNA for minimal residual disease detection, with important implications for early recurrence detection and patient prognostication, although these technologies differ in clinical maturity. Collectively, these developments emphasize the molecular heterogeneity underlying early-stage NSCLC and the expanding role of biomarkers in guiding clinical decision-making. Integrating genomic, radiographic, and biologic markers into clinical workflows will be essential to refine risk stratification, personalize perioperative treatment strategies, and ultimately improve long-term oncologic outcomes.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42881915","pmid":"42881915","pmcid":"","doi":"10.3390/jcm15197453","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42881915/","notice_url":"","trial_url":"","pub_date":"2026-Sep-24","briefing_date":"2026-10-17","journal_abbr":"J Clin Med","journal_full":"Journal of clinical medicine","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Clinicopathological and Perioperative Factors Associated with Overall Survival and 90-Day Mortality Following Esophagectomy for Esophageal Cancer.","title_en":"Clinicopathological and Perioperative Factors Associated with Overall Survival and 90-Day Mortality Following Esophagectomy for Esophageal Cancer.","authors":"Esin H, Güner M","affiliation_highlight":"Department of General Surgery, Izmir City Hospital, University of Health Sciences, 35540 Izmir, Türkiye.","results":"Background/Objectives: Esophageal cancer (EC) is an aggressive malignancy, and outcomes following esophagectomy are influenced by both oncological and perioperative factors. This study aimed to identify clinicopathologic…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Background/Objectives: Esophageal cancer (EC) is an aggressive malignancy, and outcomes following esophagectomy are influenced by both oncological and perioperative factors. This study aimed to identify clinicopathological and perioperative factors associated with overall survival (OS) after esophagectomy for EC and, secondarily, to evaluate factors associated with 90-day mortality. Methods: A total of 101 patients who underwent radical esophagectomy with two-field lymphadenectomy between April 2016 and April 2023 were retrospectively evaluated. The primary outcome was OS, defined as the time from esophagectomy to death from any cause or the date of last follow-up. The secondary outcome was 90-day postoperative mortality. OS was evaluated using Kaplan-Meier and Cox proportional hazards analyses, whereas 90-day mortality was assessed using Firth penalized-likelihood logistic regression because of the limited number of events. Results: During follow-up, 74 patients (73.3%) died, including 11 deaths within 90 days after esophagectomy. The estimated 1-, 3-, and 5-year OS rates were 80.1%, 44.8%, and 38.0%, respectively. In the whole-cohort multivariable Cox model, stratified by surgical approach, lymph node positivity was associated with poorer OS (HR 10.57, 95% CI 4.78-23.38; p < 0.001). Among patients receiving neoadjuvant chemotherapy (n = 76), lymph node positivity (HR 6.34, 95% CI 2.60-15.45; p < 0.001) and pathological non-response (HR 2.96, 95% CI 1.13-7.73; p = 0.027) were associated with poorer OS. In exploratory Firth regression analysis, lymph node positivity (OR 103.11, 95% CI 7.40 -> 1000; p < 0.001) and intraoperative complications (OR 75.58, 95% CI 7.42 -> 1000; p < 0.001) were strongly associated with 90-day mortality. Conclusions: Lymph node positivity was consistently associated with poorer OS both in the entire cohort and among patients receiving neoadjuvant chemotherapy. Pathological non-response was additionally associated with poorer OS in the neoadjuvant chemotherapy subgroup, while lymph node positivity and intraoperative complications were strongly associated with 90-day mortality.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":true,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42881189","pmid":"42881189","pmcid":"7116508","doi":"10.1016/j.ccell.2018.03.012","nct_id":"NCT03539484","url":"https://pubmed.ncbi.nlm.nih.gov/42881189/","notice_url":"","trial_url":"https://clinicaltrials.gov/study/NCT03539484","pub_date":"2026-Aug-14","briefing_date":"2026-10-17","journal_abbr":"NPJ Precis Oncol","journal_full":"NPJ precision oncology","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Early functional reactivity to a CEACAM5 x CD3 T cell bispecific antibody in solid tumors associates with baseline immune contexture rather than target antigen density alone.","title_en":"Early functional reactivity to a CEACAM5 x CD3 T cell bispecific antibody in solid tumors associates with baseline immune contexture rather than target antigen density alone.","authors":"Wilson S, Silva A, Serrano-Serrano ML, Karanikas V, Waldhauer I, Schoenle A, Bar V, Salpeter SJ et al.","affiliation_highlight":"Computational Sciences Center of Excellence, Roche Innovation Center Welwyn, Welwyn Garden City, UK.","results":"Clinical translation of T cell bispecific (TCB) therapies in solid tumors is hindered by the immunosuppressive tumor microenvironment and intratumoral heterogeneity, features poorly captured by standard preclinical model…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Clinical translation of T cell bispecific (TCB) therapies in solid tumors is hindered by the immunosuppressive tumor microenvironment and intratumoral heterogeneity, features poorly captured by standard preclinical models. We applied an integrated translational framework, combining humanized mouse models, a patient-derived ex vivo organ culture (EVOC) platform, and Phase 1 clinical trial data (ClinTrials.gov identifier NCT03539484), to define the biologic determinants of functional reactivity to a CEACAM5 x CD3 TCB. In humanized mice bearing CEA-positive tumors, the TCB inhibited tumor growth and increased intratumoral T cell infiltration. EVOC, which preserves native 3D tumor architecture and endogenous tumor immune contexture, revealed rapid TCB-induced secretion of IFNγ, IL-2, TNFα, and IL-10 across colorectal, pancreatic, and non-small cell lung cancer patient tumors, with substantial inter-patient heterogeneity. Higher baseline CD3+ T cell infiltration trended with a greater magnitude of cytokine release in patient tumors treated with the TCB ex vivo versus tumors with lower CD3+ T cell infiltration. Baseline tumor CEA expression did not associate with functional response in EVOC. In the Phase 1 trial, on-treatment peripheral cytokine induction was greater in patients with immune-inflamed or -excluded tumors as compared to those with immune-desert tumors. EVOC recapitulated the high inter-patient functional heterogeneity observed clinically, with a coefficient of variation for IFNγ of 135% in EVOC versus 190% in patients, compared with 52% in humanized mice. These findings suggest that early pharmacodynamic responses to CEACAM5 x CD3 TCB associate with a pre-existing tumor immune state rather than target antigen expression alone and support integration of patient-derived ex vivo models for modeling clinically-relevant pharmacodynamics.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42880447","pmid":"42880447","pmcid":"","doi":"10.1016/j.jval.2026.10.002","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42880447/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-17","journal_abbr":"Value Health","journal_full":"Value in health : the journal of the International Society for Pharmacoeconomics and Outcomes Research","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Cost-Effectiveness of Telisotuzumab Vedotin-tllv for Previously Treated High c-Met Protein-Overexpressing Nonsquamous Non-Small Cell Lung Cancer in the United States.","title_en":"Cost-Effectiveness of Telisotuzumab Vedotin-tllv for Previously Treated High c-Met Protein-Overexpressing Nonsquamous Non-Small Cell Lung Cancer in the United States.","authors":"Weiss GJ","affiliation_highlight":"Department of Medicine, UMass Chan Medical School, Worcester, Massachusetts, USA.","results":"OBJECTIVES: To estimate the incremental cost-effectiveness of telisotuzumab vedotin-tllv (teliso-V) versus docetaxel in previously treated high c-Met protein-overexpressing (≥50% of tumor cells with 3+ staining) advanced…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"OBJECTIVES: To estimate the incremental cost-effectiveness of telisotuzumab vedotin-tllv (teliso-V) versus docetaxel in previously treated high c-Met protein-overexpressing (≥50% of tumor cells with 3+ staining) advanced nonsquamous non-small cell lung cancer. METHODS: A partitioned survival model with monthly cycles and a five-year horizon was built from the US healthcare sector perspective. Individual time-to-event data were reconstructed from published Kaplan-Meier curves of the c-Met High subgroup (N=78) of LUMINOSITY and the CONTACT-01 docetaxel arm (N=180). Because individual covariate data were unavailable, a naive (unadjusted) indirect comparison was conducted. Seven parametric distributions were fit independently by arm; their median and range were the primary summary. The analysis was preregistered. RESULTS: The unadjusted overall survival hazard ratio favored teliso-V but was not statistically significant (HR 0.690; 95% CI 0.471-1.010). The median incremental cost-effectiveness ratio was approximately $2.0 million per QALY (range, $1.7-$2.2 million). Across 70,000 probabilistic iterations, cost-effectiveness was not achieved in any iteration at $50,000, $100,000, $150,000, or $200,000 per QALY. The threshold payment limit at $150,000 per QALY was approximately $1,209 per 100 mg (92% reduction). CONCLUSIONS: At the current Medicare Part B payment limit, telisotuzumab vedotin-tllv is unlikely to be cost-effective versus docetaxel in the US high c-Met protein-overexpressing population at conventional willingness-to-pay thresholds. The conclusion was robust to modeled survival extrapolation and parameter uncertainty. Because the comparison is unadjusted, comparative effectiveness remains uncertain pending randomized results.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42878946","pmid":"42878946","pmcid":"4103614","doi":"10.1097/SLA.0000000000002171","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42878946/","notice_url":"","trial_url":"","pub_date":"2026-Oct-15","briefing_date":"2026-10-17","journal_abbr":"J Gastrointest Cancer","journal_full":"Journal of gastrointestinal cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Uniportal versus Multiportal Video-Assisted Thoracoscopic Surgery for Minimally Invasive Esophagectomy in Esophageal Cancer: A GRADE-Assessed Systematic Review and Meta-Analysis.","title_en":"Uniportal versus Multiportal Video-Assisted Thoracoscopic Surgery for Minimally Invasive Esophagectomy in Esophageal Cancer: A GRADE-Assessed Systematic Review and Meta-Analysis.","authors":"Amin F, Fatima R, Iqbal S, Bilal M, Sajid H, Raza A, Ahmed N, Shah S et al.","affiliation_highlight":"King Edward Medical University, Lahore, Pakistan.","results":"BACKGROUND: Minimally invasive esophagectomy has become the preferred surgical approach for esophageal cancer, with uniportal video-assisted thoracoscopic surgery (uVATS) emerging as a potential refinement over conventio…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Minimally invasive esophagectomy has become the preferred surgical approach for esophageal cancer, with uniportal video-assisted thoracoscopic surgery (uVATS) emerging as a potential refinement over conventional multiportal VATS (mVATS). However, comparative evidence remains limited to small single-centre studies. This systematic review and meta-analysis aimed to comprehensively evaluate perioperative and safety outcomes of uVATS versus mVATS in patients undergoing minimally invasive esophagectomy. METHODS: A systematic search was conducted across PubMed/MEDLINE, Embase, Scopus, Cochrane Library, Web of Science, ClinicalTrials.gov, and CNKI from inception through April 2026. Studies directly comparing uVATS with mVATS in adults undergoing minimally invasive esophagectomy were eligible. Binary outcomes were pooled as odds ratios and continuous outcomes as mean differences under REML random-effects model. Heterogeneity was assessed using I² statistics. Certainty of evidence was evaluated using the GRADE framework. RESULTS: Nine studies comparing uVATS and mVATS were included. uVATS was associated with significantly lower postoperative pain on day one (MD - 2.10, 95% CI - 3.63 to - 0.57; I² = 99.3%), reduced postoperative pneumonia (OR 0.41, 95% CI 0.22-0.76; I² = 43.5%), and shorter length of hospital stay (MD - 2.13 days, 95% CI - 3.64 to - 0.63; I² = 96.8%). No significant differences were observed between approaches for anastomotic leakage (OR 1.13, 95% CI 0.61-2.09), overall complications (OR 0.79, 95% CI 0.47-1.32), recurrent laryngeal nerve injury (OR 0.89, 95% CI 0.43-1.85), perioperative mortality (OR 0.53, 95% CI 0.16-1.81), intraoperative blood loss, or total operative time. CONCLUSION: UVATS esophagectomy appears to be a feasible and safe alternative to mVATS, with potential advantages in postoperative pain, pulmonary morbidity, and hospital stay while maintaining comparable perioperative safety. The evidence base remains limited by high heterogeneity and predominance of observational studies. Multicenter randomized trials with standardized protocols and long-term oncologic follow-up are needed to consolidate these findings.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"rct","phase3":false,"primary_endpoint":false,"negative_rigorous":true,"tier":"B"}},{"id":"pmid_42877868","pmid":"42877868","pmcid":"PMC9161394","doi":"10.1159/000552719","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42877868/","notice_url":"","trial_url":"","pub_date":"2026","briefing_date":"2026-10-17","journal_abbr":"Case Rep Oncol","journal_full":"Case reports in oncology","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Carboplatin, Etoposide, and Durvalumab for Extensive-Stage Small Cell Lung Cancer in a Patient Undergoing Maintenance Hemodialysis: A Case Report.","title_en":"Carboplatin, Etoposide, and Durvalumab for Extensive-Stage Small Cell Lung Cancer in a Patient Undergoing Maintenance Hemodialysis: A Case Report.","authors":"Fujita M, Matsunaga N, Tsuji H, Tamura Y, Tsuruoka K, Nakamura T, Ikeda S, Fujisaka Y et al.","affiliation_highlight":"Respiratory Medicine and Thoracic Oncology, Osaka Medical and Pharmaceutical University Hospital, Takatsuki City, Japan.","results":"INTRODUCTION: Patients undergoing maintenance hemodialysis exhibit a unique immunological state characterized by chronic inflammation and T-cell dysfunction. Evidence regarding the efficacy and safety of combination chem…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: Patients undergoing maintenance hemodialysis exhibit a unique immunological state characterized by chronic inflammation and T-cell dysfunction. Evidence regarding the efficacy and safety of combination chemoimmunotherapy in dialysis patients remains extremely limited. CASE REPORT: We report a case of extensive-stage small cell lung cancer (performance status 1, cT1cN2M1c, stage IVB) in a patient undergoing maintenance hemodialysis who received 4 cycles of carboplatin (300 mg/m2, day 1), etoposide (50 mg/m2, days 1 and 3), and durvalumab (1,500 mg/body, day 1). Treatment was safely continued after adjusting the dosing schedule and dose levels in accordance with the dialysis schedule. Although new brain metastases developed during treatment and whole-brain radiotherapy was administered, computed tomography after 4 cycles demonstrated a partial response, and durvalumab maintenance therapy was subsequently continued. Grade 4 thrombocytopenia and grade 3 anemia and neutropenia were observed as adverse events; however, these were manageable with transfusion support and dose reduction. Disease progression was subsequently observed. CONCLUSION: Carboplatin, etoposide, and durvalumab can provide meaningful therapeutic benefit even in patients undergoing maintenance hemodialysis when adverse events are appropriately managed.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42875306","pmid":"42875306","pmcid":"","doi":"10.1016/j.transproceed.2026.09.015","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42875306/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-17","journal_abbr":"Transplant Proc","journal_full":"Transplantation proceedings","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Sequential Liver, Kidney, and Heart Transplantation in a Single Recipient: Long-Term Survival Complicated by Chronic Renal Allograft Failure, Lung Cancer, and Recurrent Infection-A Case Report.","title_en":"Sequential Liver, Kidney, and Heart Transplantation in a Single Recipient: Long-Term Survival Complicated by Chronic Renal Allograft Failure, Lung Cancer, and Recurrent Infection-A Case Report.","authors":"Xia JN, Luo ZK, Li JH, Yu H","affiliation_highlight":"Cardiovascular Intensive Care Unit, The Second Affiliated Hospital of Hainan Medical University, Haikou, Hainan, China.","results":"BACKGROUND: Multi-organ transplant recipients face a substantial long-term risk of infection, malignancy, and chronic rejection secondary to prolonged immunosuppression. Sequential liver, kidney, and heart transplantatio…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Multi-organ transplant recipients face a substantial long-term risk of infection, malignancy, and chronic rejection secondary to prolonged immunosuppression. Sequential liver, kidney, and heart transplantations remain rare, resulting in limited evidence to guide perioperative management and long-term follow-up. CASE SUMMARY: A 61-year-old man underwent sequential liver, kidney, and heart transplantations in 2012, 2018, and 2022, respectively. Initial graft function was favorable under an immunosuppressive regimen comprising tacrolimus, mycophenolate mofetil, and corticosteroids. From 2023 onwards, he developed recurrent SARS-CoV-2 infections, lung cancer requiring a segmentectomy, recurrent lower-extremity arteriosclerosis obliterans, and progressive renal allograft failure. He ultimately died from cardiopulmonary arrest precipitated by severe metabolic acidosis and electrolyte derangements complicating renal allograft failure. DISCUSSION: This case suggests that patients undergoing sequential multi-organ transplantations can achieve meaningful long-term survival with multidisciplinary care and individualized immunosuppression. Nevertheless, complications related to cumulative immunosuppression remain a major challenge, necessitating dynamic follow-up and tailored post-transplant management. CONCLUSION: Sequential liver, kidney, and heart transplantations are feasible in carefully selected patients. However, the delayed adverse effects of chronic immunosuppression pose a major threat to long-term outcomes, underscoring the absolute necessity for vigilant monitoring and highly individualized pharmacological management.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"case_report","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42874594","pmid":"42874594","pmcid":"","doi":"10.1016/j.medj.2026.101327","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42874594/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-17","journal_abbr":"Med","journal_full":"Med (New York, N.Y.)","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"esophageal","category_label":"食管与纵隔肿瘤","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Tumor DNA methylation subtypes and expression levels of CFISH predict response and overall survival to immunochemotherapy.","title_en":"Tumor DNA methylation subtypes and expression levels of CFISH predict response and overall survival to immunochemotherapy.","authors":"Fuchs HS, Xie P, James SA, Cao Z, Carroll TM, Inoue M, Siejka-Zielińska P, Kim S et al.","affiliation_highlight":"Ludwig Institute for Cancer Research, University of Oxford, Oxford, UK.","results":"BACKGROUND: Predicting patient response to immunochemotherapy is vital but challenging and poorly studied in the (neo)adjuvant setting. We showed that tumor monocyte content (TMC) predicts overall survival of advanced es…","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"BACKGROUND: Predicting patient response to immunochemotherapy is vital but challenging and poorly studied in the (neo)adjuvant setting. We showed that tumor monocyte content (TMC) predicts overall survival of advanced esophageal cancer (OC) in response to immunochemotherapy. We report clinical outcomes of 35 operable OC patients receiving ICI-based therapy and molecular profiling of the unique phase-2 LUD2015-005 trial treating 73 OC patients (38 advanced/inoperable and 35 operable) in the (neo)adjuvant setting. METHODS: LUD2015-005 trial patients were treated with 4-week immune checkpoint inhibitor (ICI)-only before combination with standard of care. Paired and longitudinally collected biopsies of tumor and multiple adjacent normal sites were bi-dissected to extract DNA and RNA. Whole-genome, methylome, single-cell and bulk RNA sequencing data generated from the entire LUD2015-005 cohort were used for cell-deconvolution and data integration analysis. FINDINGS: Neoadjuvant ICI-based combination therapy of operable OC in the LUD2015-005 trial revealed improved overall outcomes. Tumor monocytes contribute to tumor immune microenvironment (TiME) remodeling and associate with tumor reactive CD8+ T cells upon ICI+ chemotherapy/chemoradiotherapy. We identified five DNA-methylation subtypes with distinct TiME and a TMC-related five-gene signature CFISH (CXCL8, FCN1, IFI30, SLC11A1, and HLA-DRA) as highly predictive biomarkers of overall survival in OC and beyond. CONCLUSIONS: These findings highlight the importance of the myeloid compartment in ICI response and the potential of CFISH and tumor DNA methylation in patient stratification for immunochemotherapy. FUNDING: This work is mainly funded by Ludwig Institute for Cancer Research, CRUK Grants A21998 and C30423/A2541, and NIHR Oxford Biomedical Research Center. AstraZeneca UK Limited provided durvalumab and tremelimumab for LUD2015-005.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42872517","pmid":"42872517","pmcid":"","doi":"10.1002/ijc.70789","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42872517/","notice_url":"","trial_url":"","pub_date":"2026-Oct-14","briefing_date":"2026-10-17","journal_abbr":"Int J Cancer","journal_full":"International journal of cancer","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"advanced","category_label":"局晚期与晚期靶向/免疫","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"Real-World Experience With Multimodal Treatment of Resectable Stage II-III Non-Small Cell Lung Cancer: A Single Institutional Analysis.","title_en":"Real-World Experience With Multimodal Treatment of Resectable Stage II-III Non-Small Cell Lung Cancer: A Single Institutional Analysis.","authors":"Griffo R, Niedermaier B, Klotz LV, Schneider M, Allgäuer M, Kriegsmann M, Roesch RM, Brendel L et al.","affiliation_highlight":"Department of Thoracic Surgery, Thoraxklinik, University of Heidelberg, Heidelberg, Germany.","results":"Neoadjuvant therapy has recently become an integral component of multimodal treatment for resectable lung cancer. However, real-world data on perioperative morbidity and treatment adherence remain limited.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"Neoadjuvant therapy has recently become an integral component of multimodal treatment for resectable lung cancer. However, real-world data on perioperative morbidity and treatment adherence remain limited. This study aimed to assess the feasibility and safety of different neoadjuvant treatment approaches applied within daily clinical routine. We retrospectively analyzed patients with resectable stage II-III non-small cell lung cancer undergoing either neoadjuvant chemoimmunotherapy or chemotherapy/chemoradiotherapy followed by curative surgical resection. Treatment groups were compared with respect to perioperative outcomes, radiologic and pathologic downstaging, and pathologic response. A total of 143 patients met the inclusion criteria, of whom 46 (32.2%) received chemoimmunotherapy and 97 (67.8%) were treated with chemotherapy prior to surgery. Adverse events leading to treatment discontinuation occurred in only two patients in the chemoimmunotherapy group and four patients in the chemotherapy group. Chemoimmunotherapy was associated with significantly higher rates of pathologic complete response (37.0% vs. 4.1%) and more pronounced nodal downstaging, with a higher proportion of patients achieving ypN0 status (76.1% vs. 34.0%). High tumoral PD-L1 expression (≥ 50%) and squamous cell carcinoma histology were independently associated with pathologic complete response. Real-world treatment with neoadjuvant chemoimmunotherapy was feasible and resulted in improved response rates compared with chemotherapy, without increasing perioperative morbidity. Histology and high PD-L1 expression may serve as predictors for complete pathologic response, although the predictive value of PD-L1 requires confirmation in larger cohorts with more complete biomarker data.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"retrospective","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42871941","pmid":"42871941","pmcid":"PMC10423609","doi":"10.1002/ijc.33357","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42871941/","notice_url":"","trial_url":"","pub_date":"2026-Aug","briefing_date":"2026-10-17","journal_abbr":"Can Liver J","journal_full":"Canadian liver journal","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"perioperative","category_label":"围术期与新辅助治疗","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_error":"","tuple_audit":[],"ungrounded_numbers":[],"semantic_passed":true,"semantic_audit":[],"publish_state":"full","status":{"kind":"ok","note":"","notice_pmid":"","notice_ref":"","impact_known":true},"title_zh":"The association between cirrhosis and outcomes among patients with lung cancer in Ontario between 2007 and 2017: A population-based study.","title_en":"The association between cirrhosis and outcomes among patients with lung cancer in Ontario between 2007 and 2017: A population-based study.","authors":"Ho AK, Djerboua M, Chung W, Robinson A, Flemming JA","affiliation_highlight":"Department of Public Health Sciences, Queen's University, Kingston, Ontario, Canada.","results":"INTRODUCTION: We describe the association between cirrhosis and outcomes among patients treated for non-small cell lung cancer (NSCLC). METHODS: NSCLC cases in 2007-2017 in Ontario, Canada, were reviewed.","authors_conclusion":"","ai_note":"","pico":{"p":"","ic":""},"reason":"启发式模式收录（未接入语言模型精评）：按期刊层级与研究类型自动入选。","abstract_en":"INTRODUCTION: We describe the association between cirrhosis and outcomes among patients treated for non-small cell lung cancer (NSCLC). METHODS: NSCLC cases in 2007-2017 in Ontario, Canada, were reviewed. Cirrhosis was identified using validated coding. The association between cirrhosis and outcomes was evaluated using logistic regression, Kaplan-Meier curves, and adjusted survival models. RESULTS: Among patients with stage 1-3 NSCLC receiving lung resection (n = 59,226), 3% had cirrhosis with higher 30-day (5% versus 2%, p < 0.001) and 90-day (8% versus 3%, p < 0.001) mortality. After multivariable logistic regression, cirrhosis was associated with higher mortality odds at 30 days (OR 2.35, 95% CI 1.39-3.99, p < 0.001) and 90 days (OR 2.10, 95% CI 1.38-3.21, p < 0.001); higher 90-day post-operative complications odds (OR 1.44, 95% CI 1.14-1.81, p = 0.002); and higher hospital readmission odds at 30 days (OR 1.90, 95% CI 1.41-2.56, p < 0.001) and 90 days (OR 1.63, 95% CI 1.27-2.10, p = 0.001). Among those with stage 4 NSCLC (n = 27,357), adjusted Cox regression showed cirrhosis was associated with higher mortality (HR 1.10, 95% CI 1.02-1.18, p = 0.016). However, when liver-related mortality was a competing event, association between cirrhosis and cancer-specific mortality was absent (sHR 1.04, 95% CI 0.95-1.13, p = 0.395). A lower proportion of patients with cirrhosis received systemic treatments (31% versus 40%, p < 0.001), and a greater proportion experienced post-treatment complications: electrolyte disturbances (10% versus 5%, p < 0.001), kidney injury (5% versus 2%, p = 0.012), and thrombocytopenia (7% versus 2%, p < 0.001). CONCLUSIONS: Cirrhosis is associated with increased morbidity and mortality in stage 1-3 NSCLC patients undergoing curative surgery. Stage 4 NSCLC patients with cirrhosis are less likely to receive palliative treatment and may experience more post-treatment complications.","tags":[],"curated":false,"curation_reason":"","curation_clinical_value":"","curation_research_value":"","curation_signals":{"design":"unknown","phase3":false,"primary_endpoint":false,"negative_rigorous":false,"tier":"B"}},{"id":"pmid_42871886","pmid":"42871886","pmcid":"PMC9373699","doi":"10.7759/cureus.116162","nct_id":"","url":"https://pubmed.ncbi.nlm.nih.gov/42871886/","notice_url":"","trial_url":"","pub_date":"2026-Sep","briefing_date":"2026-10-17","journal_abbr":"Cureus","journal_full":"Cureus","tier":"B","if_val":0.0,"zone":"PubMed 收录期刊","study_type":"研究类型待评定（启发式模式）","category":"surgery","category_label":"微创与无管化胸外科","score_total":35,"score_breakdown":{"clinical":15,"methodology":10,"specialty":10,"journal":0},"score_source":"heuristic","prescreen":"keyword","is_negative_highlight":false,"critic_verified":null,"verify_err
